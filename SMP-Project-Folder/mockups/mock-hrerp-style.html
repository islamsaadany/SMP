<!--
  ═══════════════════════════════════════════════════════════════════════════
  SMP · SAMPLE IN THE HR_ERP DESIGN LANGUAGE
  ═══════════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A working slice of the Strategy Management Platform painted in HR_ERP's
  design language, so the two can be compared on the same content. Five
  screens, the real Raya Trade demo data, and the real scoring formulas
  copied out of `src/config-data.js` — so every figure on screen is derived
  here exactly as the platform derives it, not typed in.

  WHAT DID NOT CHANGE
  Navigation, page structure, section order, what each screen says, what is
  clickable and what every number means. The chrome is still the three rows
  it is today: the prototype banner, the header with "Viewing as", the navy
  unit row with its folds, the page tabs and the section row.

  WHAT CHANGED — and it is only this
  · Palette      cool grey ground -> HR_ERP's warm paper (#f5f3ee / #fefdfb)
  · Type         Georgia + system sans -> Fraunces (display) + Hanken Grotesk
  · Shape        2px corners -> 12px cards, 8px controls
  · Elevation    flat bordered boxes -> soft card shadow with a hover lift
  · Headings     plain <h2> -> gold uppercase eyebrow above a serif title
  · Tabs         SMP's own -> HR_ERP's: navy label, rounded gold underline
  · Entrance     none -> HR_ERP's staggered fade-up on tiles
  Tables, status bands and the four band colours are unchanged in meaning;
  only their surfaces warm up to sit on paper.

  ONE THING HR_ERP CANNOT SUPPLY: it has no dark palette — its globals.css
  defines light only. So this sample is light-only, and the theme switch is
  absent. Adopting the language wholesale means either dropping dark or
  authoring a dark counterpart HR_ERP does not have.

  Sources read: hr_erp/src/app/globals.css (the @theme tokens, .ff-card,
  .ff-data-table, .ff-stagger), hr_erp/src/components/AppShell.tsx (navy
  chrome, active states, gold pips), hr_erp/src/app/(app)/dashboard/page.tsx
  (eyebrow + serif title + tile grid) and AdminBenefitsTabs.tsx (the tabs).
-->

     rather than on the old cool grey; a green chip that still carried a blue-grey
     tint would be the one thing on the page that had not moved. */
  --good:#2e7d5b; --attn:#a8821e; --warn:#c0673a; --bad:#b04434; --none:#8a9099;
  --good-bg:#e9f1ec; --attn-bg:#f7efd3; --warn-bg:#f8ebe2; --bad-bg:#f7e6e2;

  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-card:12px; --r-ctl:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
     line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px;border-radius:3px}
[hidden]{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}
/* hr_erp's own answer for a many-column data table: isFullWidthRoute drops the
   centred cap and gives the registry the whole screen. Business units is that
   table here — eleven columns squeezed into 1180px is a scrollbar nobody asked
   for. Everything else stays centred. */
.wrap.wide{max-width:none}

/* ── The prototype banner. Unchanged in job: it says the data is invented. ── */
.banner{background:var(--navy-950);color:#fff;padding:10px 24px;font-size:13px;
        display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:baseline}
.banner strong{color:var(--gold-300);font-weight:700}

/* ── Header. Same three things as today: who the product is, who you are
      looking as, and the buttons that leave. ─────────────────────────────── */
header.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand .mark{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-600)}
.brand h1{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.viewer{display:flex;align-items:center;gap:8px;font-size:12px}
.viewer label{font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:10px}
.viewer select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
               border:1px solid var(--line);border-radius:var(--r-ctl);padding:6px 10px}
.viewer .note{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-700)}

/* ── Unit row. HR_ERP's chrome is navy-900 with white type, an active item on
      navy-800 and a gold pip; translated to a horizontal row the pip becomes a
      gold underline, which is what SMP already used. ──────────────────────── */
nav.units{background:var(--navy-900)}
.units-in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:2px}
/* The unit tabs scroll; Manage does not. It was inside the scroller and the
   tenth unit pushed it off the right edge — the one control that leaves the
   units must not be the one you have to scroll to find. */
.units-scroll{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;min-width:0}
/* A divider, so a unit name clipped by the scroller reads as an edge rather
   than as a half-drawn word. hr_erp uses border-navy-700 for the same job. */
.units-fixed{display:flex;align-items:center;gap:2px;flex:0 0 auto;padding-left:10px;
             margin-left:2px;border-left:1px solid var(--navy-700);align-self:stretch}
.units button{font:inherit;font-size:14px;padding:12px 14px;border:0;background:none;
              color:var(--navy-100);cursor:pointer;white-space:nowrap;border-radius:0;
              border-bottom:3px solid transparent;transition:color .15s,background .15s}
.units button:hover{color:#fff;background:rgba(255,255,255,.06)}
.units button[aria-selected="true"]{color:#fff;font-weight:600;background:var(--navy-800);
                                    border-bottom-color:var(--gold-400)}
/* The folds and the Manage gear are HR_ERP's rounded-lg buttons, not tabs. */
.units button.fold{margin:6px 4px;padding:7px 12px;border-radius:var(--r-ctl);
                   font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
                   background:var(--navy-800);color:var(--navy-100);border-bottom:0}
.units button.fold:hover{background:var(--navy-700);color:#fff}
.units button.fold[aria-expanded="true"]{background:var(--gold-500);color:var(--navy-900)}

/* ── Page tabs. Straight from hr_erp AdminBenefitsTabs: navy label, muted when
      off, a rounded gold underline on the active one, over a line-coloured
      rule. SMP's two rows keep their two jobs — pages, then sections. ─────── */
nav.tabs{background:var(--paper);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:24px;overflow-x:auto}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:14px 2px 12px;border:0;
             background:none;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative;
             transition:color .15s}
.tabs button:hover{color:var(--navy-700)}
.tabs button[aria-selected="true"]{color:var(--navy-800)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;inset-inline:0;bottom:-1px;
             height:2px;border-radius:2px;background:var(--gold-500)}
nav.tabs.sectionrow{background:var(--surface)}
nav.tabs.sectionrow .tabs button{font-size:13px;padding:11px 2px 10px}

/* ── Page head: gold eyebrow, serif title, muted lede. This is HR_ERP's most
      recognisable move and it appears on 42 of its pages. ─────────────────── */
.view{padding-top:30px}
.pagehead{margin-bottom:24px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-600)}
.pagehead h1{font-family:var(--serif);font-size:30px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.pagehead p{margin:8px 0 0;color:var(--muted);max-width:70ch}

/* ── Section head: a gold pip, an uppercase label, a hairline to the right and
      a count on the end — hr_erp/design-mockups/admin-home. ───────────────── */
.sechead{display:flex;align-items:center;gap:10px;margin:40px 0 14px}
.sechead .pip{width:6px;height:6px;border-radius:999px;background:var(--gold-500);flex:0 0 6px}
.sechead b{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--navy-700)}
.sechead .rule{flex:1;height:1px;background:var(--line)}
.sechead .count{font-size:12px;color:var(--muted)}
h2.serif{font-family:var(--serif);font-size:22px;font-weight:500;margin:0 0 4px}
.secnote{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:66ch}

/* ── Cards. hr_erp .ff-card: soft elevation, a 2px lift on hover, 12px corners.
      SMP's boxes were 2px-cornered and flat, which is the single biggest
      visual difference between the two products. ─────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
      box-shadow:var(--shadow-card);transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
a.card,.card.clickable{display:block;color:inherit;text-decoration:none;cursor:pointer}
a.card:hover,.card.clickable:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-2px);
      border-color:var(--navy-300)}
.card.pad{padding:20px}

/* Staggered fade-up, hr_erp .ff-stagger. Applied to the tile rows only. */
@keyframes ff-fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ff-stagger>*{animation:ff-fade-up .5s cubic-bezier(.2,.7,.2,1) both}
.ff-stagger>*:nth-child(2){animation-delay:60ms}
.ff-stagger>*:nth-child(3){animation-delay:120ms}
.ff-stagger>*:nth-child(4){animation-delay:180ms}
.ff-stagger>*:nth-child(5){animation-delay:240ms}
.ff-stagger>*:nth-child(6){animation-delay:300ms}
@media (prefers-reduced-motion:reduce){
  .ff-stagger>*,.card{animation:none;transition:none}
  a.card:hover,.card.clickable:hover{transform:none}
}

/* ── The band chip. Same four words, same four meanings. ─────────────────── */
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;
      white-space:nowrap;letter-spacing:.01em}
.chip.good{background:var(--good-bg);color:#1f5b41}
.chip.attn{background:var(--attn-bg);color:var(--gold-800)}
.chip.warn{background:var(--warn-bg);color:#95492a}
.chip.bad{background:var(--bad-bg);color:#8a3428}
.chip.none{background:var(--navy-50);color:var(--muted)}
.chip.plain{background:var(--navy-50);color:var(--navy-700);font-weight:600}
.chip.gold{background:var(--gold-100);color:var(--gold-800)}
.t-good{color:var(--good)} .t-attn{color:var(--gold-700)} .t-warn{color:var(--warn)}
.t-bad{color:var(--bad)} .t-none{color:var(--none)}

/* ── The headline figure. Serif, because in HR_ERP the display face carries
      anything the eye is meant to land on first. ─────────────────────────── */
.big{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:600;margin-left:2px}
.metric-row{display:flex;gap:26px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.metric-row>div{min-width:0}
.metric-k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.metric-v{font-size:16px;font-weight:600;margin-top:2px}
.bar{height:8px;border-radius:999px;background:var(--navy-50);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:999px}
.link{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:var(--navy-700);
      text-decoration:none;border-bottom:1px solid var(--gold-300);padding-bottom:1px}
.link:hover{color:var(--navy-800);border-bottom-color:var(--gold-500)}

/* ── Buttons. hr_erp: solid navy-800 rounded-lg for the act, a bordered
      surface button for everything else. ─────────────────────────────────── */
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--r-ctl);
     border:1px solid transparent;background:var(--navy-800);color:#fff;cursor:pointer;
     transition:background .15s}
.btn:hover{background:var(--navy-700)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--navy-700)}
.btn.ghost:hover{background:var(--navy-50)}
.btn.gold{background:var(--gold-500);color:var(--navy-900)}
.btn.gold:hover{background:var(--gold-600)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;background:var(--surface)}
.toggle button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border:0;background:none;
               color:var(--muted);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--navy-800);color:#fff}

/* ── The legend strip that sits above every scored page. Same four bands and
      the same buttons on the right; a card now instead of a flat rail. ───── */
.legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;margin-bottom:26px}
.legend .lab{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.legend .b{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.legend .dot{width:9px;height:9px;border-radius:999px;flex:0 0 9px}
.legend .acts{margin-left:auto;display:flex;gap:8px}

/* ── Data tables. hr_erp .ff-data-table verbatim in behaviour: a navy-800
      header row in bold white that sticks, a zebra tint, a total row on
      navy-50. Rounded and clipped so the header meets the card's corner. ── */
/* overflow-x:AUTO, not hidden. Hidden kept the rounded corner and silently cut
   the last two columns off the units table — a table that ends mid-column reads
   as a table that has no more columns. Auto also makes this the scroll container
   the sticky header sticks inside, which is hr_erp's .ff-data-scroll behaviour. */
.tablecard{border-radius:var(--r-card);border:1px solid var(--line);overflow-x:auto;
           background:var(--surface);box-shadow:var(--shadow-card)}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
table.dt thead th{position:sticky;top:0;z-index:2;background:var(--navy-800);color:#fff;
                  font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
                  text-align:left;padding:11px 14px;white-space:nowrap}
table.dt td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.dt tbody tr:first-child td{border-top:0}
table.dt tbody tr.zebra>td{background:#eef0f2}
table.dt tbody tr.total>td{background:var(--navy-50);font-weight:600}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
table.dt td.mid,table.dt th.mid{text-align:center}
table.dt td.idx{color:var(--muted);width:44px;font-variant-numeric:tabular-nums}
/* One name column takes the slack and everything else stops wrapping, or a
   four-word tactic breaks over four lines while "Owner" sits in a wide empty
   cell beside it. */
table.dt th.grow{width:auto}
table.dt td.grow{min-width:220px}
table.dt th.tight,table.dt td.tight{white-space:nowrap;width:1%}
table.dt td.notecell{min-width:170px}
table.dt tbody tr.focus>td:first-child{box-shadow:inset 3px 0 0 var(--gold-500)}
table.dt tbody tr.muted td{color:var(--muted)}
.dim{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}

/* ── The pillar rail. In HR_ERP the active item in a list is navy-800 with a
      gold pip; that is what a selected pillar becomes here. ─────────────── */
.split{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}
/* MIN-WIDTH:0, or the panel refuses to shrink below its widest table and the
   whole PAGE scrolls sideways instead. A grid or flex child defaults to
   min-width:auto — which means "never smaller than my content" — so the
   overflow-x:auto on .tablecard never gets the chance to do its job. Measured
   1920 -> 600 before it was believed: without this the unit page scrolled 208px
   sideways at 1024, which is a laptop, not an edge case. */
.split>*{min-width:0}
.rail{border-radius:var(--r-card);border:1px solid var(--line);overflow:hidden;background:var(--surface);
      box-shadow:var(--shadow-card);position:sticky;top:16px}
.rail .rh{background:var(--navy-800);color:#fff;padding:11px 16px;display:flex;justify-content:space-between;
          align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.rail .rh span{color:var(--gold-300)}
.rail button{display:block;width:100%;text-align:left;font:inherit;border:0;background:none;cursor:pointer;
             padding:13px 16px;border-top:1px solid var(--line);position:relative;color:inherit}
.rail button:first-of-type{border-top:0}
.rail button:hover{background:var(--gold-50)}
.rail button[aria-current="true"]{background:var(--navy-50)}
.rail button[aria-current="true"]::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
             width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--gold-500)}
.rail .rt{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.rail .rn{font-size:13.5px;font-weight:600;line-height:1.35}
.rail .rn i{font-style:normal;color:var(--muted);font-weight:600;margin-right:5px;font-size:12px}
.rail .rs{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rail .rm{font-size:11.5px;color:var(--muted);margin-top:4px}
.rail .rfoot{padding:10px 16px;border-top:1px solid var(--line);background:var(--paper);
             font-size:11.5px;color:var(--muted)}

/* ── The pillar panel to the right of the rail. ──────────────────────────── */
.panel{padding:22px 24px;min-width:0}
.panel h3{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.01em}
.panel .psub{color:var(--muted);font-size:13px;margin-top:3px}
.panel .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
              padding-bottom:16px;border-bottom:1px solid var(--line)}
.panel .pend{margin:16px 0 0;font-size:14px}
.panel .pend b{font-weight:600}
.twoup{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 4px}
.twoup>*{min-width:0}
.tablabel{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
          margin:26px 0 10px}

/* ── Quarter pips: four boxes, the ones a tactic runs in filled. Unchanged in
      meaning; rounded to match everything else. ──────────────────────────── */
.qs{display:inline-flex;gap:3px}
.qs i{width:19px;height:19px;border-radius:4px;display:grid;place-items:center;font-style:normal;
      font-size:10.5px;font-weight:700;border:1px solid var(--line);color:var(--none);background:var(--surface)}
.qs i.on{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.qs i.past{background:var(--gold-100);border-color:var(--gold-200);color:var(--gold-800)}

/* ── Donut. Same figure the platform draws today, on HR_ERP's track colour. ─ */
.donut{display:block}
.donut .track{stroke:var(--navy-50)}
.donutwrap{display:flex;align-items:center;justify-content:center;position:relative}
.donutwrap .dv{position:absolute;font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.02em}
.donutwrap .dv small{font-size:11px;font-weight:600}

/* ── Unit card on the group page: navy head, then the two figures. ───────── */
.unitcard .uh{background:var(--navy-800);color:#fff;padding:14px 16px;text-align:center}
.unitcard .uh b{font-family:var(--serif);font-size:17px;font-weight:500;display:block}
.unitcard .uh span{font-size:11.5px;color:var(--navy-200)}
.unitcard .ub{display:grid;grid-template-columns:1fr 1fr;min-height:170px}
.unitcard .ubl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
.unitcard .ubr{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;
               align-items:center;justify-content:center;gap:2px}
.unitcard .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.unitcard .exec{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}
.unitcard .execn{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin-top:10px;font-size:12.5px}
.unitcard .execn span:nth-child(odd){color:var(--muted)}
.unitcard .execn span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* ── Report screen: the fields people type into. ─────────────────────────── */
.notice{border-radius:var(--r-card);padding:14px 18px;font-size:14px;margin-bottom:22px;
        border:1px solid var(--line);background:var(--surface);border-left:3px solid var(--gold-500)}
.notice.bad{background:var(--bad-bg);border-color:#eccfc9;border-left-color:var(--bad)}
.notice b{font-weight:700}
.progline{display:flex;align-items:center;gap:18px;padding:16px 20px;margin-bottom:26px;flex-wrap:wrap}
.progline .n{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}
.progline .track{flex:1;height:8px;border-radius:999px;background:var(--navy-50);overflow:hidden;min-width:80px}
.progline .track>i{display:block;height:100%;background:var(--good);border-radius:999px}
input.f,textarea.f{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
      border:1px solid var(--line);border-radius:var(--r-ctl);padding:7px 10px;width:100%}
input.f:focus,textarea.f:focus{border-color:var(--navy-400);outline:none;box-shadow:0 0 0 3px rgba(79,109,151,.12)}
input.f.given{border-color:#bcd8c9;background:#f4faf6}
input.f.need,textarea.f.need{border-color:#e3b6ad;background:var(--bad-bg)}
/* A FIXED width, not 100%-of-whatever-the-cell-turns-out-to-be. The Reported
   column is a shrink-to-fit cell, so a percentage width let the "B EGP" suffix
   squeeze the number box to nothing: the first row's 2.7 was invisible, in a box
   that still looked like a box. */
input.f.num{text-align:right;font-variant-numeric:tabular-nums;width:78px;flex:0 0 78px}
.unitbox{display:inline-flex;align-items:center;gap:0}
.unitbox .suffix{font-size:12px;color:var(--muted);border:1px solid var(--line);border-left:0;
      border-radius:0 var(--r-ctl) var(--r-ctl) 0;padding:7px 9px;background:var(--paper);white-space:nowrap}
.unitbox input.f{border-radius:var(--r-ctl) 0 0 var(--r-ctl)}

.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(292px,100%),1fr))}
.tiles>*{min-width:0}
.tiles.three{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.rowacts{display:flex;gap:8px;align-items:center;margin-left:auto}
.headrow{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.headrow>div{min-width:0}
.headrow .rowacts{align-self:center}
@media (max-width:1000px){
  .split{grid-template-columns:1fr}
  .rail{position:static}
  .twoup{grid-template-columns:1fr}
}

/* ── The explanation panel. HR_ERP has no modal of its own, so this follows
      its card: paper scrim, surface sheet, 12px corners, the same shadow. ── */
.overlay{position:fixed;inset:0;background:rgba(10,26,48,.42);display:none;align-items:center;
         justify-content:center;padding:24px;z-index:60}
.overlay.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
       box-shadow:0 18px 48px rgba(10,26,48,.22);max-width:600px;width:100%}

   through JSON: the nav, the cards and the compile all read this one list. */
var UNIT_KEYS = ["mobile","retailstores","b2becomm","consumerelectronics","onlineshop",
                 "corporate","care","it","logistics","nigeria"];
Object.keys(UNITS).forEach(function(k){ UNITS[k].ukey = k; });

/* Only Mobile has Key Objective weights set, to show the mechanism. Every
   other unit is equal-weighted — the default nobody has to defend. */
var KO_WEIGHTS = { mobile:[40,25,20,15] };

/* ═══════════════════════════════════════════════════════════════════════════
   SCORING — copied verbatim from src/config-data.js. Nothing here is stored:
   a pillar's performance comes from its measures and its execution from its
   tactics; a unit compiles from its pillars; the group compiles from its
   units. A row and its expansion can therefore never disagree.
   ═══════════════════════════════════════════════════════════════════════ */
function avg(a){
  var v = a.filter(function(x){ return x != null && !isNaN(x); });
  return v.length ? Math.round(v.reduce(function(x,y){ return x+y; },0)/v.length) : null;
}
function koScore(list, weights){
  var vals = list.filter(function(m){ return !m.milestone && m.progress != null; });
  if (!vals.length) return null;
  if (!weights) return Math.round(vals.reduce(function(a,m){ return a + m.progress; },0)/vals.length);
  var tot = 0, acc = 0;
  list.forEach(function(m,i){
    if (m.milestone || m.progress == null) return;
    var w = weights[i] == null ? 0 : weights[i];
    acc += m.progress * w; tot += w;
  });
  return tot ? Math.round(acc/tot) : null;
}
function bandOf(v){
  if (v == null || isNaN(v)) return { key:"none", label:"No data" };
  var b = BANDS.bands;
  for (var i=0;i<b.length;i++) if (v >= b[i].floor) return b[i];
  return b[b.length-1];
}
function quartersOf(t){ return [t.q1,t.q2,t.q3,t.q4].map(function(x){ return x ? 1 : 0; }); }
/* What a tactic SHOULD have delivered by now is the share of its own active
   quarters that have already passed — which is what makes `planned` derived
   rather than stored. */
function tacticPlanned(t){
  var q = quartersOf(t), total = 0, elapsed = 0;
  for (var i=0;i<4;i++){ if (!q[i]) continue; total++; if (i+1 <= REVIEW.endsQuarter) elapsed++; }
  if (!total) return null;
  return Math.round(elapsed/total*100);
}
/* A tactic whose quarters have not begun is not behind — it is not yet due,
   and averaging a zero into execution would say otherwise. */
function tacticDue(t){ return tacticPlanned(t) > 0; }
function tacticRatio(t){ var p = tacticPlanned(t); return p && t.actual != null ? Math.round(t.actual/p*100) : null; }
function scorableMeasures(p){ return p.measures.filter(function(m){ return m.target && m.progress != null; }); }
function pillarPerf(p){ return avg(scorableMeasures(p).map(function(m){ return m.progress; })); }
function dueTactics(p){ return p.tactics.filter(tacticDue); }
/* A tactic that is due but has nothing reported is not delivering zero — it is
   unreported, and averaging a zero would say the plan is failing. */
function reportedTactics(p){ return dueTactics(p).filter(function(t){ return t.actual != null; }); }
function pillarExec(p){ return avg(reportedTactics(p).map(function(t){ return t.actual; })); }
function pillarPlan(p){ return avg(reportedTactics(p).map(tacticPlanned)); }
function pillarRatio(p){ var pl = pillarPlan(p); return pl ? Math.round(pillarExec(p)/pl*100) : null; }
function unitObjectives(u){ return koScore(u.keyObjectives, KO_WEIGHTS[u.ukey]); }
function unitExec(u){ return avg(u.items.map(pillarExec)); }
function unitPlan(u){ return avg(u.items.map(pillarPlan)); }
function unitRatio(u){ var pl = unitPlan(u); return pl ? Math.round(unitExec(u)/pl*100) : null; }
function groupKeyObjectives(){ return koScore(GROUP.keyObjectives); }
function groupUnitsObjectives(){
  var acc=0, tot=0;
  UNIT_KEYS.forEach(function(k){
    var v = unitObjectives(UNITS[k]); if (v == null) return;
    acc += v*UNITS[k].weight; tot += UNITS[k].weight;
  });
  return tot ? Math.round(acc/tot) : null;
}
/* Copied as it stands, including the asymmetry with groupUnitsObjectives above:
   that one SKIPS a unit with nothing to score, these two carry its weight in the
   denominator anyway. Nigeria has no plan, so its 5% dilutes both figures — which
   is why the group reads 102% here and not 104%. Reproduced rather than corrected:
   this sample changes the design, not the arithmetic. Flagged for Islam. */
function groupExec(){
  var acc=0, tot=0;
  UNIT_KEYS.forEach(function(k){ acc += unitExec(UNITS[k]) * UNITS[k].weight; tot += UNITS[k].weight; });
  return tot ? Math.round(acc/tot) : null;
}
function groupPlan(){
  var acc=0, tot=0;
  UNIT_KEYS.forEach(function(k){ acc += unitPlan(UNITS[k]) * UNITS[k].weight; tot += UNITS[k].weight; });
  return tot ? Math.round(acc/tot) : null;
}
/* NULL IS NEVER ZERO, and it is never NaN either: a tenant with no tactics has
   nothing delivered and nothing planned, and 0/0 printed "NaN%" on the group's
   own front page for three versions. */
function groupRatio(){ var e = groupExec(), p = groupPlan(); return (e == null || !p) ? null : Math.round(e/p*100); }
function pillarCode(u,i){ return (u.codePrefix||"") + String(i+1).padStart(2,"0"); }

/* ── Small helpers ─────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pct(v){ return v == null ? "&mdash;" : v + "<small>%</small>"; }
function chip(v){ var b = bandOf(v); return '<span class="chip ' + b.key + '">' + b.label + '</span>'; }
function tone(v){ return "t-" + bandOf(v).key; }
function bandColour(v){ return "var(--" + (bandOf(v).key === "none" ? "none" : bandOf(v).key) + ")"; }
function isFocus(id){ return !!CYCLE.focus[id]; }
function focusMark(id){ return isFocus(id) ? ' <span title="A focus measure this cycle" style="color:var(--gold-600)">&#9670;</span>' : ""; }

/* The donut the platform already draws, at HR_ERP's radius and on its track. */
function donut(v, size){
  size = size || 112;
  var r = (size-14)/2, c = 2*Math.PI*r, on = v == null ? 0 : Math.max(0, Math.min(100, v));
  return '<div class="donutwrap" style="width:' + size + 'px;height:' + size + 'px">' +
    '<svg class="donut" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle class="track" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="12"></circle>' +
      (v == null ? "" :
      '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="12" stroke-linecap="round" ' +
        'stroke="' + bandColour(v) + '" stroke-dasharray="' + (c*on/100).toFixed(1) + ' ' + c.toFixed(1) + '" ' +
        'transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')"></circle>') +
    '</svg>' +
    '<span class="dv ' + tone(v) + '">' + (v == null ? "&ndash;" : v + '<small>%</small>') + '</span></div>';
}
function quarterPips(t){
  var q = quartersOf(t);
  return '<span class="qs">' + q.map(function(on,i){
    var past = on && (i+1) <= REVIEW.endsQuarter;
    return '<i class="' + (on ? (past ? "on" : "past") : "") + '">' + (i+1) + '</i>';
  }).join("") + '</span>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHARED PIECES — the legend strip and the "how this is calculated" panel are
   the same on every scored page, which is how it is today.
   ═══════════════════════════════════════════════════════════════════════ */
function legend(acts){
  return '<div class="card legend">' +
    '<span class="lab">Reading the colours</span>' +
    BANDS.bands.map(function(b,i){
      var next = i ? BANDS.bands[i-1].floor - 1 : null;
      var range = i === 0 ? b.floor + "%+" : (b.floor ? b.floor + "–" + next + "%" : "below " + (next+1) + "%");
      return '<span class="b"><i class="dot" style="background:var(--' + b.key + ')"></i>' +
             esc(b.label) + ' &mdash; ' + range + '</span>';
    }).join("") +
    '<span class="acts">' + (acts || "") + '</span></div>';
}
function pagehead(eyebrow, title, lede){
  return '<div class="pagehead"><p class="eyebrow">' + esc(eyebrow) + '</p><h1>' + esc(title) + '</h1>' +
         (lede ? '<p>' + lede + '</p>' : "") + '</div>';
}
function sechead(label, count){
  return '<div class="sechead"><i class="pip"></i><b>' + esc(label) + '</b><i class="rule"></i>' +
         (count == null ? "" : '<span class="count">' + count + '</span>') + '</div>';
}
function howLink(key){ return '<a class="link" href="#" data-how="' + key + '">How this is calculated &rarr;</a>'; }

/* Every explanation below is the formula the page above it actually ran —
   written out, not restated from memory. */
var HOW = {
  gko: ["The group's own scorecard",
    "Every Key Objective the group holds reports a progress figure. The headline is their plain mean — " +
    "unweighted, because weights are a per-unit mechanism and the group has never had a row in the weight table. " +
    "An objective with no target set is not an objective scoring zero: it cannot be scored, so it is dropped rather than averaged in."],
  gunits: ["Business units — performance",
    "Each unit compiles its own Key Objectives into one figure, weighted where the unit has set weights and equally where it has not. " +
    "Those unit figures are then combined on the unit weights set on the Weighting tab. Nothing here is stored: a unit's card and this headline read the same numbers."],
  gexec: ["Business units — execution",
    "A tactic's plan is the share of its own active quarters that have already passed, so a tactic running Q2–Q4 is due at a third at H1. " +
    "Delivered over planned gives the ratio, and it is read as a share of plan rather than of the whole year — which is why it can pass 100%. " +
    "A tactic whose quarters have not begun is not behind; it is not yet due, and it is left out rather than counted as zero."],
  uobj: ["This unit's Key Objectives",
    "The unit's Key Objectives compiled into one figure. Mobile is the one unit with weights set (40 / 25 / 20 / 15), to show the mechanism; every other unit is equal-weighted."],
  uexec: ["This unit's execution",
    "Each pillar averages the tactics that are due and reported — delivered on one side, planned on the other — and the unit averages its pillars. " +
    "A due tactic with nothing reported is unreported, not zero, so it waits rather than dragging the figure down."]
};

/* ═══════════════════════════════════════════════════════════════════════════
   GROUP · PERFORMANCE · OVERALL
   ═══════════════════════════════════════════════════════════════════════ */
function drillCard(eyebrow, value, body, how, primary){
  var b = bandOf(value);
  return '<div class="card pad">' +
    '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">' +
      '<p class="eyebrow" style="max-width:20ch">' + esc(eyebrow) + '</p>' + chip(value) + '</div>' +
    /* The slot is drawn either way. Without it the card with no Primary chip
       pulls its headline 22px up and the row of three loses its baseline. */
    '<div style="min-height:22px;margin-top:8px">' + (primary
      ? '<span class="chip gold" style="font-size:10px;letter-spacing:.1em">Primary</span>' : "") + '</div>' +
    '<div class="big ' + tone(value) + '" style="margin-top:10px">' + pct(value) + '</div>' +
    '<div class="bar"><i style="width:' + Math.min(100, value == null ? 0 : value) + '%;background:' + bandColour(value) + '"></i></div>' +
    '<p style="margin:14px 0 0;font-size:13.5px;color:var(--muted)">' + body + '</p>' +
    howLink(how) + '</div>';
}
function renderGroupOverall(){
  var gko = groupKeyObjectives(), gunits = groupUnitsObjectives(), ratio = groupRatio();
  var e = groupExec(), p = groupPlan();
  var weights = UNIT_KEYS.map(function(k){ return UNITS[k].weight; }).join(" / ");
  return pagehead("Group · Performance", "Overall performance",
      "Three figures, and none of them stored. The group's own scorecard, what its units are achieving, and how much of the plan has actually landed.") +
    legend('<button class="btn ghost" data-noop="Arrange">Arrange</button>') +
    '<div class="tiles three ff-stagger">' +
      drillCard("Group Key Objectives", gko,
        "The group's own scorecard. All <b>" + GROUP.keyObjectives.length + "</b> objectives have a target set.", "gko", true) +
      drillCard("Business units — performance", gunits,
        "Each unit's own Key Objectives, weighted " + weights + " — composed on the Weighting tab.", "gunits", true) +
      drillCard("Business units — execution", ratio,
        "Delivered <b>" + e + "%</b> against <b>" + p + "%</b> planned — variance <b class=\"" + (e-p >= 0 ? "t-good" : "t-bad") + "\">" +
        (e-p >= 0 ? "+" : "") + (e-p) + "</b>. Read as a share of plan, not of the whole year.", "gexec") +
    '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   GROUP · PERFORMANCE · BUSINESS UNITS
   ═══════════════════════════════════════════════════════════════════════ */
var GVIEW = "cards";
function unitCard(k){
  var u = UNITS[k], obj = unitObjectives(u), r = unitRatio(u), e = unitExec(u), p = unitPlan(u);
  return '<div class="card unitcard clickable" data-go="' + k + '">' +
    '<div class="uh"><b>' + esc(u.name) + '</b><span>' + u.weight + '% weight · ' + u.items.length +
      ' pillars' + (u.real ? "" : " · illustrative") + '</span></div>' +
    '<div class="ub"><div class="ubl"><span class="k">Objectives</span>' + donut(obj) + '</div>' +
      '<div class="ubr"><span class="k">Execution</span>' +
        (r == null
          ? '<span class="exec t-none">—</span><span class="k" style="margin-top:4px">No plan</span>'
          : '<span class="exec ' + tone(r) + '">' + r + '<small style="font-size:14px">%</small></span>' +
            '<span class="k" style="margin-top:2px">of plan</span>' +
            '<span class="execn"><span>Delivered</span><span>' + e + '%</span>' +
            '<span>Planned</span><span>' + p + '%</span>' +
            '<span>Variance</span><span class="' + (e-p >= 0 ? "t-good" : "t-bad") + '">' + (e-p >= 0 ? "+" : "") + (e-p) + '</span></span>') +
      '</div></div></div>';
}
function unitTable(){
  return '<div class="tablecard"><table class="dt"><thead><tr>' +
    '<th class="idx">#</th><th>Unit</th><th class="num">Weight</th><th class="num">Pillars</th>' +
    '<th class="num">Objectives</th><th class="num">Delivered</th><th class="num">Planned</th>' +
    '<th class="num">Of plan</th><th>Status</th></tr></thead><tbody>' +
    UNIT_KEYS.map(function(k,i){
      var u = UNITS[k], obj = unitObjectives(u), r = unitRatio(u);
      return '<tr class="' + (i%2 ? "zebra" : "") + '" data-go="' + k + '" style="cursor:pointer">' +
        '<td class="idx">' + (i+1) + '</td>' +
        '<td><b>' + esc(u.name) + '</b>' + (u.real ? "" : ' <span class="dim">· illustrative</span>') + '</td>' +
        '<td class="num">' + u.weight + '%</td><td class="num">' + u.items.length + '</td>' +
        '<td class="num ' + tone(obj) + '"><b>' + (obj == null ? "—" : obj + "%") + '</b></td>' +
        '<td class="num">' + (unitExec(u) == null ? "—" : unitExec(u) + "%") + '</td>' +
        '<td class="num">' + (unitPlan(u) == null ? "—" : unitPlan(u) + "%") + '</td>' +
        '<td class="num ' + tone(r) + '"><b>' + (r == null ? "—" : r + "%") + '</b></td>' +
        '<td>' + chip(obj) + '</td></tr>';
    }).join("") + '</tbody></table></div>';
}
function renderGroupUnits(){
  return pagehead("Group · Performance", "Business units",
      "Every active unit, its own objectives on the left and what it has delivered against plan on the right. Open one to see its pillars.") +
    legend('<button class="btn ghost" data-noop="Arrange">Arrange</button>') +
    '<div class="headrow"><div><h2 class="serif">' + UNIT_KEYS.length + ' business units</h2>' +
      '<p class="secnote">Weights total 100% and are set on the Weighting tab.</p></div>' +
      '<div class="rowacts"><span class="toggle"><button data-gview="cards" aria-pressed="' + (GVIEW==="cards") + '">Cards</button>' +
      '<button data-gview="table" aria-pressed="' + (GVIEW==="table") + '">Table</button></span></div></div>' +
    (GVIEW === "cards"
      ? '<div class="tiles ff-stagger">' + UNIT_KEYS.map(unitCard).join("") + '</div>'
      : unitTable());
}

/* ═══════════════════════════════════════════════════════════════════════════
   UNIT · PERFORMANCE
   ═══════════════════════════════════════════════════════════════════════ */
var RAIL = {};                       /* which pillar each unit is opened on */
function railIndex(k){ return RAIL[k] || 0; }

function splitCard(title, value, suffix, how, metrics){
  return '<div class="card pad">' +
    '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">' +
      '<h3 style="font-family:var(--serif);font-size:19px;font-weight:500">' + esc(title) + '</h3>' + chip(value) + '</div>' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap">' +
      '<span class="big ' + tone(value) + '" style="margin-top:8px">' + pct(value) +
        (suffix ? ' <span class="metric-k" style="font-size:11px">' + esc(suffix) + '</span>' : "") + '</span>' +
      howLink(how) + '</div>' +
    '<div class="metric-row">' + metrics.map(function(m){
      return '<div><div class="metric-k">' + esc(m[0]) + '</div><div class="metric-v ' + (m[2]||"") + '">' + m[1] + '</div></div>';
    }).join("") + '</div></div>';
}

/* The focus strip. Focus measures are chosen for the cycle and carry reward;
   a measure earns once it reaches the reward line, which is 100% of target. */
function focusStrip(k){
  var u = UNITS[k], marked = [];
  u.keyObjectives.forEach(function(m){ if (isFocus(m.id)) marked.push(m); });
  u.items.forEach(function(p){ p.measures.forEach(function(m){ if (isFocus(m.id)) marked.push(m); }); });
  if (!marked.length) return "";
  var earning = marked.filter(function(m){ return m.progress != null && m.progress >= CYCLE.rewardAt; }).length;
  var short = marked.length - earning;
  return '<div class="card legend" style="margin-bottom:26px">' +
    '<span class="lab" style="color:var(--gold-700)">&#9670; Focus this cycle</span>' +
    '<span class="b"><b>' + earning + '</b>&nbsp;of&nbsp;<b>' + marked.length + '</b> earning</span>' +
    '<span class="chip gold">' + earning + ' earning</span>' +
    (short ? '<span class="chip warn">' + short + ' short</span>' : "") +
    '<span class="acts" style="font-size:13px;color:var(--muted)">reward begins at ' + CYCLE.rewardAt + '%</span></div>';
}

function measureRows(list, cols){
  return list.map(function(m,i){
    return '<tr class="' + (i%2 ? "zebra " : "") + (isFocus(m.id) ? "focus" : "") + '">' +
      '<td class="idx">' + (i+1) + '</td>' +
      '<td class="grow">' + esc(m.name) + focusMark(m.id) + '</td>' +
      '<td class="mid tight">' + esc(m.dir) + '</td>' +
      '<td class="num tight">' + esc(m.target || "—") + '</td>' +
      (cols.horizon ? '<td class="num dim">' + esc(m.target3y || "—") + '</td>' : "") +
      '<td class="mid dim">' + esc(m.compile || "—") + '</td>' +
      (cols.actual ? '<td class="num">' + esc(m.actual === "" || m.actual == null ? "—" : m.actual) + '</td>' : "") +
      (cols.progress ? '<td class="num ' + tone(m.progress) + '"><b>' + (m.progress == null ? "—" : m.progress + "%") + '</b></td>' : "") +
    '</tr>';
  }).join("");
}
function measureTable(list, cols){
  return '<div class="tablecard"><table class="dt"><thead><tr>' +
    '<th class="idx">#</th><th class="grow">Measure</th><th class="mid tight">Dir.</th><th class="num tight">Target</th>' +
    (cols.horizon ? '<th class="num tight">' + esc(GROUP.horizon) + '</th>' : "") +
    '<th class="mid tight">Compile</th>' +
    (cols.actual ? '<th class="num">' + esc(REVIEW.name) + ' actual</th>' : "") +
    (cols.progress ? '<th class="num">Progress</th>' : "") +
    '</tr></thead><tbody>' + measureRows(list, cols) + '</tbody></table></div>';
}
function tacticTable(p, reported){
  return '<div class="tablecard"><table class="dt"><thead><tr>' +
    '<th class="idx">#</th><th class="grow">Tactic</th><th class="tight">Owner</th><th class="tight">Quarters</th>' +
    (reported ? '<th class="tight">Status</th><th class="num tight">Deliv. / plan</th><th class="num tight">Var.</th><th class="num tight">Of plan</th>' : "") +
    '</tr></thead><tbody>' + p.tactics.map(function(t,i){
      var pl = tacticPlanned(t), r = tacticRatio(t), due = tacticDue(t);
      return '<tr class="' + (i%2 ? "zebra " : "") + (due ? "" : "muted") + '">' +
        '<td class="idx">' + (i+1) + '</td><td class="grow">' + esc(t.name) + '</td>' +
        '<td class="tight">' + esc(t.owner || "—") + '</td><td class="tight">' + quarterPips(t) + '</td>' +
        (reported ? (
          '<td><span class="chip plain">' + esc(t.status || "—") + '</span></td>' +
          (due
            ? '<td class="num"><b>' + t.actual + '</b> <span class="dim">/ ' + pl + '</span></td>' +
              '<td class="num ' + (t.actual - pl >= 0 ? "t-good" : "t-bad") + '">' + (t.actual - pl >= 0 ? "+" : "") + (t.actual - pl) + '</td>' +
              '<td class="num ' + tone(r) + '"><b>' + r + '%</b></td>'
            : '<td class="num" colspan="3"><span class="chip none">Not yet due</span></td>')
        ) : "") + '</tr>';
    }).join("") + '</tbody></table></div>';
}

function pillarRail(k, mode){
  var u = UNITS[k], cur = railIndex(k);
  return '<div class="rail"><div class="rh">Pillars<span>' + u.items.length + '</span></div>' +
    u.items.map(function(p,i){
      var s = pillarPerf(p), r = pillarRatio(p);
      return '<button data-rail="' + i + '" aria-current="' + (i === cur) + '">' +
        '<span class="rt"><span class="rn"><i>' + esc(pillarCode(u,i)) + '</i>' + esc(p.name) + '</span>' +
        (mode === "perf" ? '<span class="rs ' + tone(s) + '">' + (s == null ? "—" : s + "%") + '</span>' : "") + '</span>' +
        '<span class="rm">' + (mode === "perf"
            ? "execution " + (r == null ? "—" : r + "%") + (p.owner ? " · " + esc(p.owner) : "")
            : p.measures.length + " measures · " + p.tactics.length + " tactics" + (p.owner ? " · " + esc(p.owner) : "")) +
        '</span></button>';
    }).join("") +
    (mode === "perf"
      ? '<div class="rfoot">' + (avg(u.items.map(pillarPerf)) || "—") + '% across ' + u.items.length +
        ' · execution ' + (unitRatio(u) == null ? "—" : unitRatio(u) + "%") + '</div>'
      : "") +
    '</div>';
}

function renderUnitPerformance(k){
  var u = UNITS[k], obj = unitObjectives(u), r = unitRatio(u), e = unitExec(u), p = unitPlan(u);
  var scored = u.keyObjectives.filter(function(m){ return m.progress != null; }).map(function(m){ return m.progress; });
  var pi = railIndex(k), pl = u.items[pi];
  var ps = pillarPerf(pl), pr = pillarRatio(pl), pe = pillarExec(pl), pp = pillarPlan(pl);
  return pagehead("Business unit · Performance", u.name,
      "What this unit is achieving against its own Key Objectives, and how much of its plan has landed by " + esc(REVIEW.name) + ".") +
    legend('<button class="btn ghost" data-noop="Present">Present</button><button class="btn ghost" data-noop="Arrange">Arrange</button>') +
    '<div class="tiles ff-stagger" style="margin-bottom:24px">' +
      splitCard("Key Objectives performance", obj, "", "uobj", [
        ["Objectives", u.keyObjectives.length],
        ["Highest", Math.max.apply(null, scored) + "%", "t-good"],
        ["Lowest", Math.min.apply(null, scored) + "%", tone(Math.min.apply(null, scored))]
      ]) +
      splitCard("Execution performance", r, "of plan", "uexec", [
        ["Delivered", e + "%"], ["Planned", p + "%"],
        ["Variance", (e-p >= 0 ? "+" : "") + (e-p), e-p >= 0 ? "t-good" : "t-bad"]
      ]) +
    '</div>' +
    focusStrip(k) +
    '<div class="split">' + pillarRail(k, "perf") +
      '<div class="card panel">' +
        '<div class="phead"><div><h3>' + esc(pl.name) + '</h3>' +
          '<p class="psub">' + esc(pillarCode(u,pi)) + ' · theme ' + esc(pl.theme || "—") + (pl.owner ? " · " + esc(pl.owner) : "") + '</p></div>' +
          '<span class="chip ' + bandOf(ps).key + '">' + (ps == null ? "No data" : ps + "%") + '</span></div>' +
        '<div class="twoup">' +
          splitCard("Key measures performance", ps, "", "uobj", [
            ["Measures", pl.measures.length],
            ["Highest", Math.max.apply(null, scorableMeasures(pl).map(function(m){ return m.progress; })) + "%"],
            ["Lowest", Math.min.apply(null, scorableMeasures(pl).map(function(m){ return m.progress; })) + "%"]
          ]) +
          splitCard("Execution performance", pr, "of plan", "uexec", [
            ["Delivered", pe + "%"], ["Planned", pp + "%"],
            ["Variance", (pe-pp >= 0 ? "+" : "") + (pe-pp), pe-pp >= 0 ? "t-good" : "t-bad"]
          ]) +
        '</div>' +
        '<p class="tablabel">Key measures</p>' + measureTable(pl.measures, { actual:true, progress:true }) +
        '<p class="tablabel">Tactics</p>' + tacticTable(pl, true) +
      '</div></div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   UNIT · REPORTING — the one screen people TYPE into. Entries are held in
   memory here exactly as the platform holds them before a save.
   ═══════════════════════════════════════════════════════════════════════ */

/* A figure that is at risk or off track carries an explanation before it can
   be submitted. A red number with nothing beside it is where a review meeting
   stalls, so the page counts them and says so at the top. */
function needsNote(m){
  var floor = BANDS.bands[1].floor;          /* the "needs attention" floor: 70 */
  return m.progress != null && m.progress < floor && !(m.note && String(m.note).trim());
}
/* The entry box shows the number; the unit comes off the TARGET, which is where
   the unit was agreed. "6.2B EGP" makes the box read 2.7 with "B EGP" beside it. */
function splitNum(v){ var m = String(v == null ? "" : v).match(/^\s*(-?[\d.,]+)\s*(.*)$/); return m ? m[1] : ""; }
function unitOf(target){ var m = String(target == null ? "" : target).match(/^\s*-?[\d.,]+\s*(.*)$/); return m ? m[1] : ""; }

function entryBox(value, suffix, given, cls){
  var box = '<input class="f num ' + (given ? "given " : "") + (cls || "") + '" value="' + esc(value) + '">';
  return suffix ? '<span class="unitbox">' + box + '<span class="suffix">' + esc(suffix) + '</span></span>' : box;
}
function noteBox(m){
  var need = needsNote(m);
  return '<input class="f' + (need ? " need" : "") + '" value="' + esc(m.note || "") + '" placeholder="' +
         (need ? "Why, and what is being done" : "Note, if there is one") + '">';
}
function askedOf(u){
  var asked = u.keyObjectives.length, given = u.keyObjectives.filter(function(m){ return m.actual !== "" && m.actual != null; }).length;
  u.items.forEach(function(p){
    asked += p.measures.length + dueTactics(p).length;
    given += p.measures.filter(function(m){ return m.actual !== "" && m.actual != null; }).length +
             dueTactics(p).filter(function(t){ return t.actual != null; }).length;
  });
  return { asked:asked, given:given };
}
function pillarTally(p){
  var asked = p.measures.length + dueTactics(p).length;
  var given = p.measures.filter(function(m){ return m.actual !== "" && m.actual != null; }).length +
              dueTactics(p).filter(function(t){ return t.actual != null; }).length;
  return { asked:asked, given:given };
}
function reportRail(k){
  var u = UNITS[k], cur = railIndex(k);
  return '<div class="rail"><div class="rh">Pillars<span>' + u.items.length + '</span></div>' +
    u.items.map(function(p,i){
      var t = pillarTally(p), done = t.given >= t.asked;
      return '<button data-rail="' + i + '" aria-current="' + (i === cur) + '">' +
        '<span class="rt"><span class="rn"><i>' + esc(pillarCode(u,i)) + '</i>' + esc(p.name) + '</span>' +
        '<span class="chip ' + (done ? "good" : "attn") + '" style="font-size:11px">' + t.given + '/' + t.asked + '</span></span>' +
        '<span class="rm">' + (done ? "Complete" : (t.asked - t.given) + " still to give") + '</span></button>';
    }).join("") +
    '<div class="rfoot">Tally is entries given of asked</div></div>';
}
function renderUnitReport(k){
  var u = UNITS[k], tot = askedOf(u), pi = railIndex(k), p = u.items[pi], t = pillarTally(p);
  var flagged = 0;
  u.keyObjectives.forEach(function(m){ if (needsNote(m)) flagged++; });
  u.items.forEach(function(x){ x.measures.forEach(function(m){ if (needsNote(m)) flagged++; }); });
  var outside = p.tactics.length - dueTactics(p).length;
  var complete = tot.given >= tot.asked;

  return pagehead("Business unit · Reporting", REVIEW.name + " — " + u.name,
      "Enter this cycle's figures. Nothing here recalculates a target: a reported number is set against the target that was agreed.") +
    (flagged
      ? '<div class="notice bad"><b>' + flagged + ' figures need a note.</b> Anything at risk or off track carries an explanation ' +
        'before it can be submitted — a red number with nothing beside it is where a review meeting stalls.</div>'
      : "") +
    '<div class="card progline">' +
      '<span class="n">' + tot.given + '</span><span class="dim">of ' + tot.asked + ' reported</span>' +
      '<span class="track"><i style="width:' + Math.round(tot.given/tot.asked*100) + '%"></i></span>' +
      '<span class="dim" style="font-size:13px">' + esc(REVIEW.name) + ' · due ' + esc(REVIEW.due) + '</span>' +
      '<button class="btn ghost" data-noop="Submit to the SMO"' + (complete && !flagged ? "" : " disabled") + '>Submit to the SMO</button>' +
    '</div>' +

    sechead("Key Objectives", u.keyObjectives.filter(function(m){ return m.actual !== "" && m.actual != null; }).length + " / " + u.keyObjectives.length) +
    '<div class="tablecard"><table class="dt"><thead><tr>' +
      '<th class="idx">#</th><th class="grow">Key objective</th><th class="mid tight">Dir.</th><th class="num tight">Target</th>' +
      '<th class="tight">Reported</th><th>Note</th></tr></thead><tbody>' +
      u.keyObjectives.map(function(m,i){
        return '<tr class="' + (i%2 ? "zebra " : "") + (needsNote(m) ? "focus" : "") + '">' +
          '<td class="idx">' + (i+1) + '</td><td class="grow">' + esc(m.name) + focusMark(m.id) + '</td>' +
          '<td class="mid tight">' + esc(m.dir) + '</td><td class="num tight">' + esc(m.target) + '</td>' +
          '<td class="tight">' + entryBox(splitNum(m.actual), unitOf(m.target), m.actual !== "" && m.actual != null) + '</td>' +
          '<td class="notecell">' + noteBox(m) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +

    sechead("Pillars — measures and tactics", u.items.length) +
    '<div class="split">' + reportRail(k) +
      '<div class="card panel">' +
        '<div class="phead"><div><h3><span class="dim" style="font-family:var(--sans);font-size:15px;margin-right:8px">' +
          esc(pillarCode(u,pi)) + '</span>' + esc(p.name) + '</h3>' +
          '<p class="psub">' + p.measures.length + ' measures · ' + dueTactics(p).length + ' tactics asked' +
          (outside ? ' · ' + outside + ' outside this cycle' : "") + '</p></div>' +
          '<span class="chip ' + (t.given >= t.asked ? "good" : "attn") + '">' + t.given + '/' + t.asked + '</span></div>' +

        '<p class="tablabel">Key measures</p>' +
        '<div class="tablecard"><table class="dt"><thead><tr>' +
          '<th class="idx">#</th><th class="grow">Measure</th><th class="mid tight">Dir.</th><th class="num tight">Target</th>' +
          '<th class="tight">Reported</th><th>Note</th></tr></thead><tbody>' +
          p.measures.map(function(m,i){
            return '<tr class="' + (i%2 ? "zebra " : "") + (needsNote(m) ? "focus" : "") + '">' +
              '<td class="idx">' + (i+1) + '</td><td class="grow">' + esc(m.name) + focusMark(m.id) + '</td>' +
              '<td class="mid tight">' + esc(m.dir) + '</td><td class="num tight">' + esc(m.target) + '</td>' +
              '<td class="tight">' + entryBox(splitNum(m.actual), unitOf(m.target), m.actual !== "" && m.actual != null) + '</td>' +
              '<td class="notecell">' + noteBox(m) + '</td></tr>';
          }).join("") + '</tbody></table></div>' +

        '<p class="tablabel">Tactics</p>' +
        '<div class="tablecard"><table class="dt"><thead><tr>' +
          '<th class="idx">#</th><th class="grow">Tactic</th><th class="tight">Owner</th><th class="tight">Quarters</th><th class="num tight">Due at</th>' +
          '<th class="tight">Reported</th><th>Note</th></tr></thead><tbody>' +
          p.tactics.map(function(x,i){
            var due = tacticDue(x), pl = tacticPlanned(x);
            return '<tr class="' + (i%2 ? "zebra " : "") + (due ? "" : "muted") + '">' +
              '<td class="idx">' + (i+1) + '</td><td class="grow">' + esc(x.name) + '</td><td class="tight">' + esc(x.owner || "—") + '</td>' +
              '<td class="tight">' + quarterPips(x) + '</td>' +
              (due
                ? '<td class="num tight">' + pl + '%</td><td class="tight">' + entryBox(x.actual, "%", x.actual != null) + '</td>' +
                  '<td class="notecell"><input class="f" value="" placeholder="Note, if there is one"></td>'
                : '<td colspan="3"><span class="chip none">Not asked — outside this cycle</span></td>') +
            '</tr>';
          }).join("") + '</tbody></table></div>' +
      '</div></div>' +

    '<p class="tablabel">The owner\'s note on this cycle</p>' +
    '<div class="card" style="padding:6px"><textarea class="f" rows="3" style="border:0;box-shadow:none;background:transparent">' +
      esc(REVIEW.note[k] || "") + '</textarea></div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   MANAGE · BUSINESS UNITS — a configuration table. Read is the normal state;

function personName(key){ return PEOPLE[key] ? PEOPLE[key].name : "—"; }
function renderSetupUnits(){

      UNIT_KEYS.map(function(k,i){

        return '<tr class="' + (i%2 ? "zebra" : "") + '">' +

          '<td class="mid mono">' + esc(u.codePrefix) + '</td>' +

        '</tr>';

      'One helper decides which units the product is currently about, so the nav, the cards, the compile and the ' +

/* ═══════════════════════════════════════════════════════════════════════════
   THE SHELL — the same three rows the platform has today. Unit row, page tabs,
   section row. The folds are the folds; the gear is Manage.
   ═══════════════════════════════════════════════════════════════════════ */
var STATE = { unit:"group", page:"performance", section:"overall", who:"smo" };
var FOLD  = { units:false, manage:false };

/* Who can see what. The real matrix lives in `src/config-data.js`; the three
   viewers here read from it unchanged — the SMO sees everything, the group CEO
   sees the whole group but manages nothing, and a unit head sees the group and
   their own unit and reports it. */
var VIEWERS = [
  { key:"smo",     label:"Strategy Management Office — SMO", note:"Super user · all units", unit:null,     manage:true,  report:false },
  { key:"ceo",     label:"Group CEO — Chief Executive",      note:"Group · view only",      unit:null,     manage:false, report:false },
  { key:"mobhead", label:"Ashraf Laithy — Head of Mobile",   note:"Mobile",                 unit:"mobile", manage:false, report:true }
];
function viewer(){ return VIEWERS.filter(function(v){ return v.key === STATE.who; })[0]; }
function visibleUnits(){ var v = viewer(); return v.unit ? [v.unit] : UNIT_KEYS; }

/* Which pages a screen carries, and which sections sit under each page. This
   is SMP's own two-row shape: the page tabs say what kind of screen, the
   section row says which part of it. */
/* Which screens take the full width. Same test hr_erp applies: one wide,
   many-column table on the page and nothing else that wants a reading measure. */
function isWide(){ return STATE.unit === "setup"; }

function pagesFor(){
  var v = viewer();
  if (STATE.unit === "group") return [{ k:"performance", label:"Performance", sections:[
    { k:"overall", label:"Overall performance", render:renderGroupOverall },
    { k:"units",   label:"Business units",      render:renderGroupUnits }
  ]}];
  if (STATE.unit === "setup") return [{ k:"setup", label:"Business units", sections:[
    { k:"units", label:"Business units", render:renderSetupUnits }
  ]}];
  var perf = [{ k:"perf", label:"Performance", render:renderUnitPerformance }];
  if (v.report || v.manage) perf.push({ k:"report", label:"Report", render:renderUnitReport });
  return [
    { k:"performance", label:"Performance", sections:perf },
    { k:"strategy",    label:"Strategy",    sections:[{ k:"plan", label:"Plan", render:renderUnitPlan }] }
  ];
}

function paintViewer(){
  document.getElementById("asWho").innerHTML = VIEWERS.map(function(v){
    return '<option value="' + v.key + '"' + (v.key === STATE.who ? " selected" : "") + '>' + esc(v.label) + '</option>';
  }).join("");
  document.getElementById("viewerNote").textContent = viewer().note;
}

/* WHOEVER REWRITES THE ROW RE-WIRES IT, IN THE SAME FUNCTION. This row's
   innerHTML is replaced on every fold, so wiring it anywhere else means the
   handlers die the first time a fold opens. */
function paintUnits(){
  var v = viewer(), out = [];
  var me = visibleUnits();
  out.push(btn("Group", STATE.unit === "group", 'data-u="group"'));
  if (me.length === 1) {
    out.push(btn(UNITS[me[0]].name, STATE.unit === me[0], 'data-u="' + me[0] + '"'));
  } else {
    out.push('<button class="fold" data-fold="units" aria-expanded="' + FOLD.units + '">Units ' + (FOLD.units ? "&#9662;" : "&#9656;") + '</button>');
    if (FOLD.units) me.forEach(function(k){ out.push(btn(UNITS[k].name, STATE.unit === k, 'data-u="' + k + '"')); });
  }
  var right = [];
  if (v.manage) {
    if (FOLD.manage) right.push(btn("Business units", STATE.unit === "setup", 'data-u="setup"'));
    right.push('<button class="fold" data-fold="manage" aria-expanded="' + FOLD.manage + '" title="Manage">&#9881; Manage ' + (FOLD.manage ? "&#9662;" : "&#9656;") + '</button>');
  }
  var row = document.getElementById("units"), rrow = document.getElementById("units-right");
  row.innerHTML = out.join("");
  rrow.innerHTML = right.join("");
  [row, rrow].forEach(function(el){
    el.querySelectorAll("[data-fold]").forEach(function(b){
      b.addEventListener("click", function(){ FOLD[b.dataset.fold] = !FOLD[b.dataset.fold]; paintUnits(); });
    });
    el.querySelectorAll("[data-u]").forEach(function(b){
      b.addEventListener("click", function(){ go(b.dataset.u); });
    });
  });
  function btn(label, on, attrs){
    return '<button role="tab" aria-selected="' + !!on + '" ' + attrs + '>' + esc(label) + '</button>';
  }
}

function go(unit){
  STATE.unit = unit;
  var defs = pagesFor();
  STATE.page = defs[0].k;
  STATE.section = defs[0].sections[0].k;
  paint(); window.scrollTo(0,0);
}

function paint(){
  var defs = pagesFor();
  if (!defs.some(function(d){ return d.k === STATE.page; })) STATE.page = defs[0].k;
  var page = defs.filter(function(d){ return d.k === STATE.page; })[0];
  if (!page.sections.some(function(s){ return s.k === STATE.section; })) STATE.section = page.sections[0].k;
  var sec = page.sections.filter(function(s){ return s.k === STATE.section; })[0];

  paintViewer();
  paintUnits();

  document.getElementById("subtabs").innerHTML = defs.map(function(d){
    return '<button role="tab" data-p="' + d.k + '" aria-selected="' + (d.k === STATE.page) + '">' + esc(d.label) + '</button>';
  }).join("");
  /* A section row with one section says nothing the page tab did not already
     say, so it is not drawn — an empty row still spends its height. */
  var showSec = page.sections.length > 1;
  document.getElementById("secrow").hidden = !showSec;
  document.getElementById("secrow-in").innerHTML = !showSec ? "" : page.sections.map(function(s){
    return '<button role="tab" data-s="' + s.k + '" aria-selected="' + (s.k === STATE.section) + '">' + esc(s.label) + '</button>';
  }).join("");

  document.querySelector(".wrap").classList.toggle("wide", isWide());
  document.getElementById("panel").innerHTML = sec.render(STATE.unit);
  document.getElementById("orgname").textContent = GROUP.org;
  wire();
}

function wire(){
  document.querySelectorAll("#subtabs [data-p]").forEach(function(b){
    b.addEventListener("click", function(){ STATE.page = b.dataset.p; STATE.section = null; paint(); window.scrollTo(0,0); });
  });
  document.querySelectorAll("#secrow-in [data-s]").forEach(function(b){
    b.addEventListener("click", function(){ STATE.section = b.dataset.s; paint(); window.scrollTo(0,0); });
  });
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click", function(e){ e.preventDefault(); go(b.dataset.go); });
  });
  document.querySelectorAll("[data-rail]").forEach(function(b){
    b.addEventListener("click", function(){ RAIL[STATE.unit] = +b.dataset.rail; paint(); });
  });
  document.querySelectorAll("[data-gview]").forEach(function(b){
    b.addEventListener("click", function(){ GVIEW = b.dataset.gview; paint(); });
  });
  document.querySelectorAll("[data-how]").forEach(function(b){
    b.addEventListener("click", function(e){ e.preventDefault(); openHow(b.dataset.how); });
  });
  document.querySelectorAll("[data-noop]").forEach(function(b){
    b.addEventListener("click", function(){
      openText(b.dataset.noop, "Present, Arrange, Edit and Submit are live in the platform. This sample carries five " +
        "screens to judge the design language on, so the button is drawn and does nothing here.");
    });
  });
}

/* ── The explanation panel behind "How this is calculated". ──────────────── */
function openHow(key){ var h = HOW[key]; if (h) openText(h[0], h[1]); }
function openText(title, body){
  var o = document.getElementById("overlay");
  document.getElementById("modal-t").textContent = title;
  document.getElementById("modal-b").innerHTML = body;
  o.classList.add("on");
  document.getElementById("modal-x").focus();
}
function closeModal(){ document.getElementById("overlay").classList.remove("on"); }

document.getElementById("asWho").addEventListener("change", function(e){
  STATE.who = e.target.value;
  FOLD.units = false; FOLD.manage = false;
  var v = viewer();
  /* Land the new viewer somewhere they can actually see. */
  if (v.unit) STATE.unit = (STATE.unit === "group") ? "group" : v.unit;
  else if (STATE.unit === "setup" && !v.manage) STATE.unit = "group";
  go(STATE.unit);
});
document.getElementById("modal-x").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", function(e){ if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });

paint();
</script>
