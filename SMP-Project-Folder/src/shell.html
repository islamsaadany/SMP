    /* ── The register's own file (§54.3) ────────────────────────────
       Download, upload, review, apply. The gate is checked HERE as well as on
       the section that draws the controls, for the reason renderImport()
       states: a destination can be reached with a stale page after a role
       changed under the viewer, and the handler is the last thing between a
       file and the register. */
    var dlp = document.querySelector("[data-dlppl]");
    if (dlp) dlp.addEventListener("click", function(){
      sendXlsx(peopleWorkbook(), "SMP - people.xlsx");
    });

    /* `pfile`, NOT `pf` (found 2026-08-23). TWO BRANCHES EACH ADDED A `var pf`
       TO THIS ONE FUNCTION and git merged both without a word, because they
       are six hundred lines apart and nothing about the text conflicts. `var`
       is FUNCTION-scoped, so they were one binding: on every paint where the
       People page is not on screen this line reassigned it to null, and the
       deck button's handler — which closed over the same `pf` — threw
       `null.dataset` and a function's Present did nothing at all.

       Neither branch was wrong and neither test could have caught it: each
       half worked perfectly in the tree it was written in. A CLEAN MERGE CAN
       STILL COLLIDE IN A SHARED SCOPE, and the only thing that finds it is
       driving the merged product. */
    var pfile = document.getElementById("ppl-file");
    if (pfile) pfile.addEventListener("change", function(){
      if (grant("c_people") !== "edit") return;
      var file = this.files && this.files[0];
      if (!file) return;
      PFILEMENU = false;   /* the menu's job is done the moment a file is picked */
      var rx = new FileReader();
      rx.onload = function(){
        readXlsx(rx.result).then(function(sheets){
          if (!sheets["People"]) {
            /* §48.8's rule: a file that cannot be read has to SAY so, where
               the upload is. A plan workbook dropped here is the likely
               mistake, and naming the sheet it is missing is what tells
               somebody which of the two files they picked up. */
            PPLF.plan = { rows:[], notices:[], newBus:[],
                          problems:[{ at:file.name, msg:"has no sheet called People. This is " +
                            "the people workbook's own sheet \u2014 download the template from " +
                            "Register file " +
                            "and fill that." }] };
            PPLF.read = ""; PPLF.done = null;
            paint();
            return;
          }
          var rows = peopleFromWorkbook(sheets);
          PPLF.plan = planPeopleFile(rows);
          PPLF.read = file.name + " \u00b7 " + plural(rows.length, "row");
          PPLF.done = null;
          paint();
        }).catch(function(e){
          PPLF.plan = { rows:[], notices:[], newBus:[], added:0, updated:0,
                        roles:0, retired:0, restored:0,
                        problems:[{ at:file.name,
                          msg:"could not be read as a workbook \u2014 " + e.message }] };
          PPLF.read = ""; PPLF.done = null;
          paint();
        });
      };
      rx.readAsArrayBuffer(file);
    });

    /* ── ANSWERING A ROW THE FILE COULD NOT PLACE (§87.5) ────────────
       The answer is written onto the plan row and the row is re-read against
       the person it now means — through peopleRowChoose(), never by setting
       `choice` here, or the differences on screen would still be the ones
       computed against the other reading. */
    document.querySelectorAll("[data-cfchoice]").forEach(function(r){
      r.addEventListener("change", function(){
        var p = r.dataset.cfchoice.split("|");     /* index|mode|key */
        var row = PPLF.plan && PPLF.plan.rows[Number(p[0])];
        if (!row) return;
        peopleRowChoose(row, p[1] === "match" ? { mode:"match", key:p[2] } : { mode:p[1] });
        paint();
      });
    });
    /* WHICH OF THE FILE'S VALUES TO TAKE (§87.6). Ticking repaints, because
       the tally above the table counts what is ticked — a review whose summary
       disagreed with its own list would be worse than no summary. Typing is
       what must never repaint (§35); this is not typing. */
    document.querySelectorAll("[data-pplpick]").forEach(function(c){
      c.addEventListener("change", function(){
        var p = c.dataset.pplpick.split("|");      /* index|field */
        var row = PPLF.plan && PPLF.plan.rows[Number(p[0])];
        if (!row) return;
        row.picks.forEach(function(f){ if (f.k === p[1]) f.take = c.checked; });
        paint();
      });
    });
    function pplPickAll(on){
      if (!PPLF.plan) return;
      PPLF.plan.rows.forEach(function(row){
        row.picks.forEach(function(f){ f.take = on; });
      });
      paint();
    }
    document.querySelectorAll("[data-pplpickall]").forEach(function(b){
      b.addEventListener("click", function(){ pplPickAll(true); });
    });
    document.querySelectorAll("[data-pplpicknone]").forEach(function(b){

    document.querySelectorAll("[data-setpw]").forEach(function(b){

    document.querySelectorAll("[data-pwgen]").forEach(function(b){

        for (var i = out.length - 1; i > 0; i--) {
          var j = rnd(i + 1), t = out[i]; out[i] = out[j]; out[j] = t;

    /* ── The register (§35) ─────────────────────────────────────────

       the bulk issue. Everything writes the same data the Business units page
       writes — there is no second copy to keep in step. */
    /* ── A TEXT FIELD WRITES ITS VALUE AND REPAINTS NOTHING (§71.2) ──
       Islam: "when I edit things of the table let the table stay stable — it
       jumps to other cells or refreshes the whole page."

       It did: every one of these called `paint()`, which rebuilds the entire
       panel. Tabbing out of a name threw away the scroll position, the focus,
       the open menu and every enhanced select on the page, and rebuilt
       thirty-three rows to record one word — on a table you edit by moving
       across it, so it happened on EVERY cell.

       Nothing needs the repaint. The value is already correct in the box it
       was typed into; the copies of it elsewhere (a chip counting how many
       people have no email, a name echoed in the navigation) refresh on the
       next natural paint. That is a summary going stale for a few seconds
       against losing your place on every field exit, and it is not close.

       SAVED, THOUGH. `SYNC.afterPaint()` is what schedules the write, and it
       was only ever reached THROUGH paint() — so removing the repaint without
       this would have made every edit stay on screen and never reach the
       database until something else happened to repaint.

       Hoisted OUT of wire() in §129: the builder's dialogs write rows from
       outside wire()'s closure, and a second copy of "how an edit reaches

       moved up a scope, and every old caller still resolves it. */
    /* ── SCOPED, SO THE DIALOG CAN BE WIRED WITHOUT THE PAGE (§116) ──
       `root` defaults to the document, which is every existing caller. The
       person dialog passes its own body: its fields are built after paint() has
       run, so they need wiring of their own — and re-running the whole of
       wire() would bind a second handler to everything still on the page
       behind (§24, §47.2). */
    function fieldWire(attr, apply, root){
      (root || document).querySelectorAll("[data-" + attr + "]").forEach(function(inp){
        inp.addEventListener("change", function(){
          var p = personBy(inp.dataset[attr]);
          if (!p) return;
          apply(p, inp.value.trim());
          fieldSaved();
        });
      });
    }
    /* ── THE PERSON'S OWN FIELDS, NAMED ONCE (§116) ──────────────────
       Called with the document by wire(), and with the dialog's body by
       wirePersonDialog(). The register draws these fields in the dialog now and
       nowhere else, so without a root the form would be inert — which is §96's
       fault exactly: an editor that looks identical and discards every
       keystroke. */
    window.wirePersonFields = function(root){
    fieldWire("pname",  function(p, v){ if (v) p.name = v; }, root);
    /* Name (§93.8). setKnownName() DELETES the field when it is cleared or

       the full name later would leave a stale short one standing beside it. */
    fieldWire("pknown", function(p, v){ setKnownName(p, v); }, root);
    fieldWire("ptitle", function(p, v){ if (v) p.title = v; else delete p.title; }, root);
    fieldWire("pphone", function(p, v){ if (v) p.phone = v; else delete p.phone; }, root);

       than kept as "", so absent and blank stay one word — the codebase reads

    fieldWire("pempid", function(p, v){ if (v) p.empId = v; else delete p.empId; }, root);

        if (SMPRules.isSeatRole(role)) {

    R.querySelectorAll("[data-seatno]").forEach(function(b){

    /* ── THE TWO FACTS THAT COULD BE READ AND NOT CORRECTED (§69.17) ──
       Both go through the ONE door each already has: attachPersonAt() is where
       "where does this person sit" is written, shared by the register, the
       file importer and the Use-it button (§54.1), and `p.mainbu` is the
       client's own word, stored as first written.

       An Official BU NOT on the list is kept rather than refused — the list is
       soft (§54) and a name the file brought is still this person's true
       answer — but it is ADDED to the list unmapped, exactly as the file
       reader does, so the SMO can then point it somewhere. Two places writing
       the same fact differently is what mainbuList() exists to prevent. */
    R.querySelectorAll("[data-pmainbu]").forEach(function(sel){
      sel.addEventListener("change", function(){
        if (grant("c_people") !== "edit") return;
        var p = personBy(sel.dataset.pmainbu);
        if (!p) return;
        var v = sel.value.trim();
        if (!v) delete p.mainbu;
        else {
          p.mainbu = v;
          if (!mainbuBy(v)) mainbuList().push({ name: v, at: null });
        }
        paint();
      });
    });
    /* ── THE COMPANY FIELD WRITES THE SAME ONE FACT (§135.6) ────────
       Through `attachPersonAt()`, which clears the other two pointers — so
       choosing a company MOVES somebody out of a unit rather than adding a
       second place they sit. It is only reachable when the unit above says
       nothing, so that move is never a surprise. */
    R.querySelectorAll("[data-pco]").forEach(function(sel){
      sel.addEventListener("change", function(){
        if (grant("c_people") !== "edit") return;
        var p = personBy(sel.dataset.pco);
        if (!p || personCompanyDerived(p)) return;
        attachPersonAt(p, sel.value ? "co:" + sel.value : null);
        /* EITHER HALF FINISHES IT (§110, §135.6). A Company CEO is refused
           until the person sits at a company, and the Company field is now the
           only control that can put them there — so answering it while a
           refusal is standing is the answer that refusal was waiting for. */
        if (ROLESTOP && ROLESTOP.key === p.key && ADDROLE === p.key &&
            roleIsGrantable(ADDROLE_KIND)) {
          tryGrantRole(p.key, ADDROLE_KIND);
          return;
        }
        paint();
      });
    });
    R.querySelectorAll("[data-pat]").forEach(function(sel){
      sel.addEventListener("change", function(){
        if (grant("c_people") !== "edit") return;
        var p = personBy(sel.dataset.pat);
        if (!p) return;
        attachPersonAt(p, sel.value || null);
        /* THE OTHER HALF OF "EITHER ORDER" (§110). If a role is picked and
           standing refused on this row, moving the person is the answer it was
           waiting for — so it is taken now, rather than leaving somebody to
           re-pick a role the select is already showing. Only while a refusal is
           standing: changing the Unit on a row nobody is granting a role on
           stays what it has always been, a move and nothing else. */
        if (ROLESTOP && ROLESTOP.key === p.key && ADDROLE === p.key &&
            roleIsGrantable(ADDROLE_KIND)) {
          tryGrantRole(p.key, ADDROLE_KIND);
          return;
        }
        paint();
      });
    });

    /* ACCEPTING WHAT SOMEBODY SAID ABOUT THEMSELVES (§56). The declaration
       granted nothing; this is the SMO moving them, and it is an ordinary edit
       of the person's BU — attachPersonAt() is the one door the register and
       the file importer already share (§54), and the save is authorised on the
       server like every other. Nothing here touches the declaration itself: it
       stands until the person says something else, and the note stops showing
       the moment the two agree. */
    R.querySelectorAll("[data-usesaid]").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.dataset.usesaid;
        var said = saidAt(key);
        var p = personBy(key);
        if (!p || !said) return;
        SAIDFAIL = null;
        attachPersonAt(p, said);
        paint();
      });
    });

    /* THE OTHER ANSWER (§180): the register was already right. Unlike Use it
       beside it, this touches nothing in the state graph — a declaration lives
       outside it (§56) — so there is no save to carry it and it goes straight
       to the server.

       WRITTEN LOCALLY BEFORE THE ANSWER COMES BACK, and that is deliberate:
       the map is this screen's copy of a server fact, the press has to look
       like it landed, and a failure PUTS IT BACK rather than leaving the row
       claiming an answer the database never took (§171 — a failed write that
       says nothing is the fault, not the failure). */
    R.querySelectorAll("[data-dropsaid]").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.dataset.dropsaid;
        var was = SAIDWHERE && SAIDWHERE[key];
        if (!was || typeof SYNC === "undefined" || !SYNC.dismissWhere) return;
        SAIDFAIL = null;
        SAIDWHERE[key] = { at: saidAt(key), dismissed: true };
        paint();
        SYNC.dismissWhere(key, function(err){
          if (!err) return;
          /* PUT IT BACK, AND SAY SO. Leaving the row claiming an answer the
             database never took is the silent failure §171 was written about;
             the sentence is the server's own, because it owns the refusal. */
          SAIDWHERE[key] = was;
          SAIDFAIL = { key: key, why: "Not saved \u2014 " + String(err.message || err) };
          paint();
        });
      });
    });

    /* ── ANSWERING AN ATTENTION ITEM (§190) ───────────────────────────
       Islam: "attention items that stays attention item is a problem — always
       give me the option to dismiss." Every kind now has one, under the box it
       is about.

       IT WRITES THE FACT, NOT A PRESS. setAttnOff() stores what was answered
       (§190's fingerprint), so the item comes back the moment that fact
       changes — dismissing a Super user seat says nothing about the NEXT seat
       somebody is given, which is exactly what §186 exists to catch.

       AN ORDINARY EDIT OF THE ROW, so it rides the autosave and the server
       authorises it as `setup` like every other person change (§42's
       fall-through). paint() is what redraws the dialog, since §116 made the
       register's repaint reach it. */
    R.querySelectorAll("[data-attnoff]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = personBy(b.dataset.attnoff);
        if (!p || !b.dataset.attnkind) return;
        setAttnOff(p, b.dataset.attnkind, true);
        paint();
      });
    });

    /* One temporary password for everyone who has none. The SERVER picks the
       set — this sends a password and nothing else — so the worst a stale
       screen can do is issue to a shorter list than it showed. */
    /* Unfolding a person's extra roles (§47.1). Not a hover: a hover cannot be
       reached on a touch screen, and this is the only place the second role
       appears on the page. */
    R.querySelectorAll("[data-proles]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        PROLES = b.dataset.proles || null;
        paint();
      });
    });
    };
    wirePersonDialogControls(document);
    /* The two header menus (§47.2). Opening one closes the other. */
    /* ONE OPEN AT A TIME (§90). Three menus in one cluster, and two of them
       overlapping is two things covering each other — the same rule the row
       menus keep with a single PMENU key. */
    document.querySelectorAll("[data-filemenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation(); PFILEMENU = !PFILEMENU; PCOLMENU = false; PWMENU = false; paint();
      });
    });
    document.querySelectorAll("[data-colmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation(); PCOLMENU = !PCOLMENU; PWMENU = false; PFILEMENU = false; paint();
      });
    });
    document.querySelectorAll("[data-pwmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation(); PWMENU = !PWMENU; PCOLMENU = false; PFILEMENU = false; paint();
      });
    });
    /* A tick repaints the table but MUST NOT close the menu — you come here to
       set several columns, and a chooser that shuts after each one is a chooser
       you reopen six times. */
    document.querySelectorAll("[data-col]").forEach(function(b){
      b.addEventListener("change", function(e){
        e.stopPropagation(); setPeopleCol(b.dataset.col, b.checked); paint();
      });
    });
    document.querySelectorAll("[data-colall],[data-colnone]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var on = b.hasAttribute("data-colall");
        PEOPLE_COLS.forEach(function(c){ setPeopleCol(c.k, on); });
        paint();
      });
    });
    /* Edit the whole page, cursor in this person's name. The focus is applied
       AFTER the repaint that creates the input — focusing a node the paint is
       about to replace focuses nothing. */
    /* Same for the other two actions in that menu. `data-setpw` is wired
       elsewhere and already clears it; `data-as` is the viewer switch. */
    document.querySelectorAll(".kmenu [data-as]").forEach(function(b){
      b.addEventListener("click", function(){ PMENU = null; });
    });
    /* ── TABLEKIT: SEARCH, FILTER, SORT (spec 012 §2.2, §2.3) ───────
       All three work on the RENDERED rows and none of them repaints. Typing
       into a box that a repaint would replace is the fault this project has
       recorded four times (§30.1, §35, §71.2, §75) and is now Constitution XV.

       The state (what is typed, which chip is lit) lives outside the render so
       that a repaint from somewhere else — adding a row, a role given — puts it
       back rather than clearing it. */
    /* ── WHAT A ROW SAYS, AS OPPOSED TO WHAT IT CONTAINS (§84.2) ──────
       `tr.innerText` looked right and was wrong on any table with a `<select>`
       in it: a select carries EVERY option, so on Capabilities — where each row
       has a picker listing all eight functions — searching "Treasury" matched
       all eight rows. Measured: 8 of 8. The reader sees one function per row and
       the search saw eight.

       The reverse fault is in the same sentence: an `<input>` contributes no
       text at all, so with the table in edit mode a search would have matched
       NOTHING. Both are the same mistake — reading the markup instead of what
       is on screen.

       So the row's text is: its cells with the pickers taken out, plus each
       select's CHOSEN option, plus each input's VALUE. `textContent` rather
       than `innerText` on the clone, because a detached node reports `innerText`
       as empty (§69.5's lesson, in a fourth place). */
    function tkCellText(el){
      var clone = el.cloneNode(true);
      [].forEach.call(clone.querySelectorAll("select"), function(sel){
        sel.parentNode.removeChild(sel);
      });
      var t = clone.textContent || "";
      [].forEach.call(el.querySelectorAll("select"), function(sel){
        var o = sel.options[sel.selectedIndex];
        if (o) t += " " + o.text;
      });
      [].forEach.call(el.querySelectorAll("input, textarea"), function(i){
        if (i.type !== "checkbox" && i.type !== "radio") t += " " + i.value;
      });
      return t.trim().toLowerCase();
    }
    function tkRowText(tr){ return tkCellText(tr); }

    function tkApply(id){
      var table = document.querySelector('[data-tktable="' + id + '"]');
      if (!table) return;
      var q = String(TKQ[id] || "").trim().toLowerCase();
      [].forEach.call(table.tBodies[0] ? table.tBodies[0].rows : [], function(tr){
        if (tr.classList.contains("newrow")) return;   /* the Add row is not a row */
        tr.hidden = !!q && tkRowText(tr).indexOf(q) === -1;
      });
    }
    document.querySelectorAll("[data-tksearch]").forEach(function(inp){
      inp.addEventListener("input", function(){
        TKQ[inp.dataset.tksearch] = inp.value;
        tkApply(inp.dataset.tksearch);
      });
    });
    document.querySelectorAll("[data-tktable]").forEach(function(t){ tkApply(t.dataset.tktable); });

    document.querySelectorAll("[data-tksort]").forEach(function(th){
      th.addEventListener("click", function(){
        var bits = th.dataset.tksort.split("|"), id = bits[0], col = parseInt(bits[1], 10);
        var cur = TKSORT[id];
        /* Three states, and the third is the one that matters: asc, desc, and
           BACK TO THE TABLE'S OWN ORDER. Two states would make the order
           somebody arranged unreachable once they had sorted once. */
        if (!cur || cur.col !== col) TKSORT[id] = { col: col, dir: 1 };
        else if (cur.dir === 1) TKSORT[id] = { col: col, dir: -1 };
        else TKSORT[id] = null;
        paint();
      });
    });
    document.querySelectorAll("[data-tktable]").forEach(function(t){
      var st = TKSORT[t.dataset.tktable];
      if (!st || !t.tBodies[0]) return;
      var body = t.tBodies[0];
      var rows = [].slice.call(body.rows).filter(function(r){
        return !r.classList.contains("newrow"); });
      var add = [].slice.call(body.rows).filter(function(r){
        return r.classList.contains("newrow"); });
      /* THE SAME READING THE SEARCH USES (§84.3), and for the same reason: a
         cell holding an `<input>` has NO text, so Capabilities — editable for
         the SMO without a pen — sorted every row as the empty string and the
         order never moved. It looked like a sort that did nothing, which is
         indistinguishable from a sort that is not wired up.

         `tkCellText` is `tkRowText`'s single-cell twin: the chosen option of a
         picker, the value of a field, otherwise the words. */
      var val = function(r){
        var c = r.cells[st.col];
        return c ? tkCellText(c) : "";
      };
      rows.sort(function(a, b){
        var x = val(a), y = val(b);
        /* Numbers compare as numbers. A column of 1, 2, 10 sorted as text puts
           10 between 1 and 2, which reads as a broken sort rather than as a
           text sort. */
        var nx = parseFloat(x.replace(/[^0-9.\-]/g, "")), ny = parseFloat(y.replace(/[^0-9.\-]/g, ""));
        var both = x !== "" && y !== "" && !isNaN(nx) && !isNaN(ny) &&
                   /^[^a-z]*$/.test(x) && /^[^a-z]*$/.test(y);
        var c = both ? (nx - ny) : x.localeCompare(y);
        return c * st.dir;
      });
      rows.concat(add).forEach(function(r){ body.appendChild(r); });
      /* The row numbers are the VIEW's, so they still read 1..n after a sort —
         a first column of 7, 3, 12 would say the sort had failed. */
      rows.forEach(function(r, i){
        var c = r.querySelector("td.idx");
        if (c && /^\s*\d+\s*$/.test(c.textContent)) c.textContent = String(i + 1);
      });
    });

    /* ── PUTTING THE CURSOR IN A FIELD MUST NOT MOVE THE ROW (§110) ──
       Islam: "once I open the edit of a line the line jumps to the first line,
       that is the wrong behaviour."

       It is the CURSOR, not the repaint. The register is its own scrolling box
       (`.cfg`), and a plain focus() lets the browser scroll the focused field
       into view — so opening row 20 of 33 scrolled that box from 0 to 533px and
       hauled the row from y=638 to y=105, which is where the first line sits.
       His words exactly, and measured.

       `preventScroll` holds the row where it was pressed and still lands the
       cursor in the right field: nothing needs scrolling, because the row is
       already where the person just clicked.

       AND `no-jump.py` HAS BEEN GREEN THROUGHOUT — it opens a row and then
       measures repaints, so it never once measured the act of opening one
       (§94.2). It does now.

       `focusNoScroll` rather than the option written twice: the register's pen
       and the six inline pens are the same act, and §85 already found out what
       happens when that pair of lines is maintained in two places. */
    window.focusNoScroll = function(f){
      if (!f) return;
      try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); }
      if (f.select) f.select();
    };
    /* ── EDIT THIS ROW (§79.2, spec 012 §2.1) ───────────────────────
       It used to turn the whole page's edit mode on and put the cursor in this
       person's name — 297 inputs to change one job title. It opens the ROW now.
       The snapshot is taken here, before anything is typed, because that is the
       only moment the original still exists. */
    /* ── EDIT OPENS THE DIALOG (§116) ────────────────────────────────
       Islam: "the edit button can open a pop up modal with the data rather
       than inline."

       `rowEditOpen` still runs and still takes the snapshot: the dialog's
       Cancel restores from exactly the same `ROWWAS` and `ROWHELD` the inline
       row used (§79.2, §110.6), so what changed is where the fields are drawn
       and nothing about what abandoning them puts back. */
    document.querySelectorAll("[data-pedit]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        openPersonDialog({ key:b.dataset.pedit, mode:"edit" });
      });
    });
    /* ── ADD OPENS THE SAME ONE, EMPTY (§116.3) ──────────────────────── */
    document.querySelectorAll("[data-padd-open]").forEach(function(b){
      b.addEventListener("click", function(){
        newPersonReset();
        var d = newDraftStart();
        openPersonDialog({ key:d.key, mode:"add" });
      });
    });
    /* ── AND THE QUEUE OPENS IT ON THE FIRST PERSON WAITING (§116.2) ───
       Islam: "a button at top showing pending requests … that opens the
       profiles that needs attention in the pop up modal that fixes and save and
       move to the next in the same place." */
    document.querySelectorAll("[data-attn]").forEach(function(b){
      b.addEventListener("click", function(){
        var q = attentionQueue();
        if (!q.length) return;
        openPersonDialog({ key:q[0].key, mode:"queue", queue:q, at:0 });
      });
    });
    /* Save writes nothing of its own: every field has already written itself
       through `fieldSaved()` (§71.2). What it does is END the mode, which is
       what makes finishing deliberate — and flush, so leaving the page cannot
       be the thing that saves. */
    /* THE SAME PEN, ON THE SIX TABLES THAT HAVE NO ⋮ (§85). `data-pedit` above
       is the register's, inside its menu; this is the inline one. Both do the
       one thing: take the snapshot, name the row, repaint, and put the cursor
       in the row's first field — which the render marks rather than this
       guessing, because every table's first editable column is different. */
    document.querySelectorAll("[data-rowedit]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var bits = b.dataset.rowedit.split("|"), table = bits[0], key = bits.slice(1).join("|");
        rowEditOpen(table, key, ROWFIND[table] ? ROWFIND[table](key) : null);
        paint();
        focusNoScroll(document.querySelector(".tk-firstfield"));
      });
    });
    /* LEAVING THE ROW TAKES THE PICKER WITH IT (§110). `ADDROLE` and
       `ROLESTOP` are both properties of one open row, and neither was being
       cleared when the row closed — so a refusal answered by pressing Cancel
       came back the next time that row was opened, about a pick nobody had just
       made. Screen state outliving the screen it belongs to (§25.2). */
    document.querySelectorAll("[data-rowsave]").forEach(function(b){
      b.addEventListener("click", function(){
        rowEditClose();
        ADDROLE = null; ADDROLE_KIND = ""; ROLESTOP = null;
        if (typeof SYNC !== "undefined" && SYNC.afterPaint) SYNC.afterPaint();
        paint();
      });
    });
    document.querySelectorAll("[data-rowcancel]").forEach(function(b){
      b.addEventListener("click", function(){
        rowEditCancel();
        ADDROLE = null; ADDROLE_KIND = ""; ROLESTOP = null;
        if (typeof SYNC !== "undefined" && SYNC.afterPaint) SYNC.afterPaint();
        paint();
      });
    });
    /* ── MERGING TWO ROWS (§87.4) ───────────────────────────────────
       Opening it from the row records WHICH row, and clears everything the
       last merge left behind — a picks map carried over from a different pair
       would silently apply one person's answer to another's fields. */
    document.querySelectorAll("[data-pmerge]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        mergeReset();
        PMERGE.a = b.dataset.pmerge;
        PMENU = null;
        /* NO paint() HERE. The register behind goes inert the moment the modal
           opens, and repainting it first would rebuild the ⋮ this click came
           from — the control `openModalHtml` is about to remember so it can
           put focus back on it (§48.4). The row menu closes on the next
           natural paint, behind a dialog nobody can see it through. */
        mergeOpen();
      });
    });
    /* THE RECEIPT'S CLOSE WAS WIRED HERE, and it went with the section it
       belonged to (§93.5, §24). Leaving it would have been worse than dead
       code: this is a DOCUMENT-wide query and the dialog's own Close and
       Cancel carry the same attribute, so with paint() now running while the
       wizard is open it would have bound a second handler to them — one that
       resets the merge without closing the dialog. wireMerge() owns them. */

    /* ── CLICK TO COPY AN ADDRESS OR A NUMBER (§93.6) ────────────────
       Islam: "make the email and the phone to be copied on clicking on them."

       THE WORD IS WRITTEN INTO THE ELEMENT, NOT PAINTED. paint() would replace
       the button that was just pressed — §63's rule, learned on Save draft —
       so the tick is set on the node and put back on a timer. The original
       text is kept on the node too, or a second click during the tick would
       copy the word "Copied".

       AND THE FALLBACK IS NOT DECORATION. `navigator.clipboard` needs a secure
       context, and this product is opened from `file://` every day of its
       life — so a hidden textarea and `execCommand("copy")` is the path that
       actually runs here, and the promise path is the one that runs in
       production. Both end at the same tick, and a failure says so rather
       than tick-ing anyway. */
    document.querySelectorAll("[data-copy]").forEach(function(b){
      b.addEventListener("click", function(){
        var self = this, v = self.dataset.copy;
        var was = self.dataset.copyWas || self.textContent;
        self.dataset.copyWas = was;
        function done(ok){
          /* NOT "Press Cmd-C" — this runs on Windows too, and naming the
             wrong key is worse than naming none. */
          self.textContent = ok ? "Copied" : "Could not copy";
          self.classList.toggle("copied", ok);
          clearTimeout(self.__copyT);
          self.__copyT = setTimeout(function(){
            self.textContent = was;
            self.classList.remove("copied");
          }, 1200);
        }
        function legacy(){
          var t = document.createElement("textarea");
          t.value = v;
          t.setAttribute("readonly", "");
          t.style.cssText = "position:fixed;top:-1000px;opacity:0";
          document.body.appendChild(t);
          t.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          document.body.removeChild(t);
          done(ok);
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(v).then(function(){ done(true); }, legacy);
        } else { legacy(); }
      });
    });

    /* The row's action menu (§46.4). Opening one closes any other, because
       PMENU is a single key rather than a flag per row. */
    document.querySelectorAll("[data-pmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        PMENU = PMENU === b.dataset.pmenu ? null : b.dataset.pmenu;
        paint();
      });
    });
    /* ── THE FUNCTIONS TABLE'S ROW MENU (§93.14) ──────────────────────
       The same shape, and it CLOSES ANY OPEN QUESTION as it opens: the delete
       refusal and the two clear confirmations render in the same corner, so a
       menu opened over one of them would stack two panels in one cell. */
    document.querySelectorAll("[data-fnmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        FNMENU = FNMENU === b.dataset.fnmenu ? null : b.dataset.fnmenu;
        CLEARING = null;
        paint();
      });
    });
    document.querySelectorAll("[data-fncolmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        FNCOLMENU = !FNCOLMENU; PCOLMENU = false; PWMENU = false; PFILEMENU = false;
        paint();
      });
    });
    document.querySelectorAll("[data-fncol]").forEach(function(b){
      b.addEventListener("change", function(){ setFnCol(this.dataset.fncol, this.checked); paint(); });
    });
    /* stopPropagation, or the document click-away above closes the panel
       before the paint that would show the boxes changing (§47.2). */
    document.querySelectorAll("[data-fncolall],[data-fncolnone]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var on = b.hasAttribute("data-fncolall");
        FN_COLS.forEach(function(c){ setFnCol(c.k, on); });
        paint();
      });
    });
    /* TWO COLLECTIVE ACTIONS, AND THE SECOND IS NOT THE FIRST WITH A WIDER
       REACH. "none" can lock nobody out — it only reaches people who could not
       sign in anyway. "all" overwrites live passwords and ends sessions, so the
       panel names the number of people it hits before it will do it.

       THE TWO COLLECTIVE ACTIONS OPEN THE SAME PANEL (§69.22). Both were a
       `confirm()` in front of a `prompt()`, and both could be suppressed —
       which on the destructive one meant a reset proceeding because its
       warning had been silenced. The warning is IN the panel now.

       Menu state cleared HERE, before the panel is drawn, never from the
       button's own teardown: closing the menu first unmounts the control the
       click is still inside (§47.2). */
    document.querySelectorAll("[data-pwbulk]").forEach(function(b){
      b.addEventListener("click", function(){
        PSETPW = { key: "bulk:" + b.dataset.pwbulk, pw: "", err: "", done: null };
        PWMENU = false; PMENU = null; PDEL = null;
        paint();
      });
    });

    /* Asked ONCE, the first time the register is on screen with a database
       behind it. Credentials are not in the state graph and never will be
       (§19), so this is a separate question — and it is a question about other
       people's accounts, so the server answers it only for the SMO.

       PWSTATES starts null meaning "not asked" and is set to {} before the
       request goes out, which is what stops every repaint asking again. Empty
       renders as a dash, not as "none": not knowing is not the same as knowing
       there is no password (§30.2, the same distinction). */
    /* ── Branding (§39) ─────────────────────────────────────────────
       The colour input fires `input` continuously while the picker is dragged,
       so it repaints on `change` — once, when the picker closes — and the hex
       field on `change` too. A repaint per frame of a drag would rebuild the
       control being dragged, which is §30.1 again. */
    document.querySelectorAll("[data-brand]").forEach(function(inp){
      inp.addEventListener("change", function(){
        branding()[inp.dataset.brand] = inp.value.toUpperCase();
        applyBrand(); paint();
      });
    });
    document.querySelectorAll("[data-brandhex]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = inp.value.trim();
        /* An unreadable value is refused rather than stored: a half-typed hex
           would blank the colour and look like the platform had lost it. */
        if (v && !hexRgb(v)) { inp.value = branding()[inp.dataset.brandhex] || ""; return; }
        branding()[inp.dataset.brandhex] = v ? rgbHex(hexRgb(v)) : null;
        applyBrand(); paint();
      });
    });
    document.querySelectorAll("[data-brandclear]").forEach(function(b){
      b.addEventListener("click", function(){
        branding()[b.dataset.brandclear] = null;
        applyBrand(); paint();
      });
    });
    document.querySelectorAll("[data-brandreset]").forEach(function(b){
      b.addEventListener("click", function(){
        GROUP.branding = {};
        applyBrand(); paint();
      });
    });

    /* ── Communication (§72) ────────────────────────────────────────
       `fieldSaved()` rather than `paint()`, the same rule the register learned
       in §71.2: a repaint on `change` replaces the field somebody has just
       tabbed out of, and the next field they meant to reach has moved. What
       DOES have to follow the edit is the preview, so it is redrawn on its
       own — one element, not the page. */
    document.querySelectorAll("[data-comms]").forEach(function(inp){
      inp.addEventListener("change", function(){
        commsSet(inp.dataset.comms, inp.value);
        fieldSaved();
        paintMailPreview();
      });
    });
    document.querySelectorAll("[data-commsreset]").forEach(function(b){
      b.addEventListener("click", function(){
        delete GROUP.comms;
        paint();
      });
    });
    /* THE WORD IS WRITTEN INTO THE ELEMENT, not painted (§63.4): a repaint
       would replace the button that was just pressed, and with it the sentence
       saying what pressing it did. */
    document.querySelectorAll("[data-mailtest]").forEach(function(b){
      b.addEventListener("click", function(){
        var to = document.getElementById("mailto");
        var out = document.getElementById("mailsent");
        var addr = to ? to.value.trim() : "";
        /* `good-tx` and `bad-tx` are TOKENS, not classes — written as a class
           name this line would have silently coloured nothing. */
        function say(msg, ok){
          MAILSENT = { ok: ok, msg: msg };
          if (!out) return;
          out.textContent = msg;
          out.style.color = ok === null ? "" : ("var(--" + (ok ? "good" : "bad") + "-tx)");
        }
        if (!addr) return say("Type an address first.", false);
        say("Sending…", null);
        b.disabled = true;
        var sh = commsShape();
        SYNC.mailTest({
          to: addr,
          subject: "Test from " + (sh.org || "the Strategy Management Platform"),
          html: MAIL.sampleFor(sh),
          body: "",
          fromName: sh.fromName,
          replyTo: sh.replyTo
        }, function(err){
          b.disabled = false;
          say(err ? err : ("Sent to " + addr + ". If it is not there, look in the junk folder."), !err);
        });
      });
    });
    paintMailPreview();

    /* ── The composer (§74) ─────────────────────────────────────────
       TICKING REPAINTS; TYPING DOES NOT. A checkbox changes what the page
       shows (which capsules are lit, and who it resolves to), so it repaints.
       The subject and the body are mirrored into SENDMSG on `change` and
       written straight into the preview on `input`, because a repaint would
       replace the box being typed into (§35, §71.2). */
    document.querySelectorAll("[data-aud]").forEach(function(inp){
      inp.addEventListener("change", function(){
        if (inp.dataset.aud === "everyone") sendmsg().criteria.everyone = inp.checked;
        else sendmsgToggle(inp.dataset.aud, inp.value, inp.checked);
        /* CHANGING WHO IT GOES TO MAKES IT A DIFFERENT SEND, so Send comes back
           for the same reason editing the words does (§143). */
        sendmsgTouched();
        sendmsgAsk();
        paint();
      });
    });
    document.querySelectorAll("[data-audkey]").forEach(function(b){
      b.addEventListener("click", function(){
        sendmsgToggle("keys", b.dataset.audkey, false);
        sendmsgTouched(); sendmsgAsk(); paint();
      });
    });
    var audpick = document.getElementById("audpick");
    if (audpick) audpick.addEventListener("change", function(){
      if (!this.value) return;
      sendmsgToggle("keys", this.value, true);
      sendmsgTouched(); sendmsgAsk(); paint();
    });

    /* THE BUTTON'S TWO FIELDS ARE THE ONLY BOXES LEFT (§76.3) — the heading
       and the body are typed into the message itself. These two redraw the
       preview, because they change what it contains; the typing inside it must
       never redraw, or the caret dies mid-word. */
    [["msgctalabel","ctaLabel"],["msgctahref","ctaHref"]].forEach(function(pair){
      var el = document.getElementById(pair[0]);
      if (!el) return;
      el.addEventListener("input", function(){
        sendmsg()[pair[1]] = el.value;
        sendmsgTouched();
        paintMsgPreview();
      });
    });
    /* ── THE LINK IS COMPLETED WHERE IT IS TYPED (spec 027) ─────────
       Islam typed `smp-orpin-tau.vercel.app` and the message went out with it
       verbatim. In an email that is not an address at all — there is no base
       document for it to be relative to — so the mail client handed it to
       macOS, which looked for a file of that name and answered "-50". The
       button was dead for everybody who pressed it.

       ON `change`, WHICH FOR A TEXT BOX MEANS ON BLUR (§35) — never on
       `input`, or `https://` would appear in front of the third character
       somebody typed and the caret would sit behind it. So it happens once,
       when they have finished, and it is WRITTEN INTO THE FIELD: seeing the
       scheme appear IS the explanation, and a value quietly corrected on the
       way out is one nobody can check (§124 — whatever reads a value cleans
       it, rather than an instruction to go and look).

       NOTHING IS REFUSED HERE. A half-typed address is a normal thing to have
       in a box you are still filling in; the refusal belongs at the moment of
       sending, where there is something to refuse. */
    var ctahref = document.getElementById("msgctahref");
    if (ctahref) ctahref.addEventListener("change", function(){
      var fixed = SMPRules.webUrl(ctahref.value);
      if (!fixed || fixed === ctahref.value.trim()) return;
      ctahref.value = fixed;
      sendmsg().ctaHref = fixed;
      sendmsgTouched();
      paintMsgPreview();
    });

    /* THE OVERVIEW'S ONE LOUD CONTROL (§144.8). It moves to the other tab
       rather than doing anything itself — the composer is where the act
       happens, and this is the way in that a tab was not being. */
    var msgwrite = document.querySelector("[data-msgwrite]");
    if (msgwrite) msgwrite.addEventListener("click", function(){
      CURSEC["send"] = "compose";
      paint();
    });

    /* ── THE GREETING (spec 022) ────────────────────────────────────
       THE SWITCH REPAINTS; TYPING THE WORD DOES NOT. Turning it on draws a
       box and a line that were not there, which is a repaint; typing into
       that box must only redraw the PREVIEW, or the field being typed into is
       replaced mid-word (§35, §71.2) — the same rule the two button fields
       above obey.

       `greet` is the word or null. Turning it off DELETES the value rather
       than remembering it, so off is the absence and a draft saved off
       carries nothing (§50.6). */
    document.querySelectorAll("[data-greet]").forEach(function(b){
      b.addEventListener("click", function(){
        sendmsg().greet = b.dataset.greet === "1" ? "Dear" : null;
        sendmsgTouched();
        paint();
      });
    });
    var mg = document.getElementById("msggreet");
    if (mg) mg.addEventListener("input", function(){
      sendmsg().greet = mg.value;
      sendmsgTouched();
      paintMsgPreview();
    });

    paintMsgPreview();

    /* ── The recipient dropdowns (§76.2) ────────────────────────────
       Opening one repaints (it draws a panel that was not there); TYPING in
       its search does not — the rows are hidden in place, exactly as the
       register's own search does it (§35), because a repaint would replace the
       input being typed into. */
    document.querySelectorAll("[data-ddopen]").forEach(function(b){
      b.addEventListener("click", function(){
        DDOPEN = (DDOPEN === b.dataset.ddopen) ? null : b.dataset.ddopen;
        paint();
      });
    });
    document.querySelectorAll("[data-ddsearch]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var q = inp.value.trim().toLowerCase();
        var pop = inp.closest(".ddpop");
        if (!pop) return;
        pop.querySelectorAll(".ddrow").forEach(function(row){
          row.hidden = !!q && (row.dataset.ddtext || "").indexOf(q) < 0;
        });
      });
      inp.focus();
    });
    document.querySelectorAll("[data-ddclear]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.ddclear, c = sendmsg().criteria;
        if (k === "roles") c.roles = [];
        else if (k === "people") c.keys = [];
        else {
          /* Only the ones this dropdown offers, or Clear on Business units
             would empty the functions beside it. */
          var mine = {};
          document.querySelectorAll('[data-ddpop="' + k + '"] [data-aud]')
            .forEach(function(i){ mine[i.value] = 1; });
          c.targets = (c.targets || []).filter(function(v){ return !mine[v]; });
        }
        sendmsgAsk(); paint();
      });
    });
    positionDD();

    /* ── Drafts (§76.1) ─────────────────────────────────────────────
       The word is written into the element, not painted: pressing Save must
       not replace the button that was pressed (§63.4). */
    var msgdraft = document.getElementById("msgdraft");
    if (msgdraft) msgdraft.addEventListener("click", function(){
      var st = sendmsg(), out = document.getElementById("msgsaid");
      if (!st.subject.trim() && !st.body.trim()) {
        if (out) out.textContent = "There is nothing written to save yet.";
        return;
      }
      msgdraft.disabled = true;
      if (out) out.textContent = "Saving\u2026";
      SYNC.mailDraftSave({ id: st.draftId, subject: st.subject, body: st.body,
                           ctaLabel: st.ctaLabel, ctaHref: st.ctaHref,
                           greet: st.greet,
                           criteria: st.criteria }, function(err, j){
        msgdraft.disabled = false;
        if (err) { if (out) out.textContent = err; return; }
        st.draftId = j.id;
        DRAFTLIST = null;
        paint();
      });
    });
    document.querySelectorAll("[data-draftopen]").forEach(function(b){
      b.addEventListener("click", function(){
        SYNC.mailDraftOpen(b.dataset.draftopen, function(err, j){
          if (err) return;
          var d = j.draft, st = sendmsg();
          st.draftId = String(d.id);
          st.subject = d.subject || ""; st.body = d.body || "";
          st.ctaLabel = d.cta_label || ""; st.ctaHref = d.cta_href || "";
          /* NULL IS OFF, and it has to stay null rather than becoming "" —
             `greet == null` is the switch everywhere else (spec 022). */
          st.greet = (d.greet == null) ? null : String(d.greet);
          st.criteria = d.audience || { everyone:false, roles:[], targets:[], keys:[] };
          /* Whatever was resolved for the message you were writing before is
             not this message's audience. Cleared, then asked again. */
          st.aud = null;
          sendmsgAsk(); paint();
        });
      });
    });
    document.querySelectorAll("[data-draftdel]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!confirm("Delete this draft? It cannot be brought back.")) return;
        var id = b.dataset.draftdel;
        SYNC.mailDraftDelete(id, function(){
          var st = sendmsg();
          if (String(st.draftId || "") === String(id)) st.draftId = null;
          DRAFTLIST = null;
          paint();
        });
      });
    });
    /* ── REMOVING A TEST COPY (§145) ────────────────────────────────
       The Super user's alone, and only ever a test copy — Islam's B: the
       clutter goes and the record of what the business was actually sent stays
       whole. `mayDestroy()` decides whether the control is drawn and the SERVER
       decides whether it may act, because a control that is only hidden is
       decoration (§42, §44).

       THE PLATFORM'S OWN MODAL, never `confirm()` (§95): a browser dialog can
       be silenced permanently on some other site, and this cannot be undone.
       It names the subject and when it went, so the row being removed is the
       row you meant.

       IT IS THE ROW'S OWN ID, read at press time from the element, and the
       refusal the server may give is SHOWN rather than swallowed — a delete
       that silently does nothing is the fault this whole section is about. */
    document.querySelectorAll("[data-sentdel]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = this.dataset.sentdel;
        var row = ((SENTLIST && SENTLIST.messages) || []).filter(function(m){
          return String(m.id) === String(id); })[0] || {};
        openModalHtml("Remove this test copy?", "",
          '<div class="sendconfirm">' +
            '<div class="kv"><span class="k">Subject</span><span>' +
              esc(String(row.subject || "")) + '</span></div>' +
            '<div class="kv"><span class="k">Sent</span><span>' +
              esc(String(row.sent_at || "").slice(0, 16).replace("T", " ")) +
              ' \u2014 to you only</span></div>' +
            '<div class="kv"><span class="k">No undo</span><span>The record of ' +
              'this test copy goes for good. Messages that went to the business ' +
              'are never removed.</span></div>' +
            '<div class="cbtns"><button data-delno="1">Cancel</button>' +
            '<button class="danger" data-delyes="1">Yes, remove it</button></div>' +
          '</div>');
        var box = document.getElementById("modal-b");
        if (!box) return;
        var no = box.querySelector("[data-delno]");
        if (no) no.addEventListener("click", function(){ closeModal(); });
        var yes = box.querySelector("[data-delyes]");
        if (yes) yes.addEventListener("click", function(){
          closeModal();
          SYNC.mailHistoryDelete(id, function(err){
            if (err) {
              /* THE REFUSAL IS SAID ON THE PAGE (§32, one surface in), in the
                 outcome line the Overview already has, rather than warning a
                 console nobody has open. */
              var st = sendmsg();
              st.result = { ok: false, landed: true, msg: err, skipped: 0, rows: null };
              paint(); return;
            }
            if (SENTONE && String(SENTONE.id) === String(id)) SENTONE = null;
            SENTLIST = null;
            paint();
          });
        });
      });
    });

    /* ON THE OVERVIEW, not on the composer (§144). Both lists are drawn there
       now, and the old gate — the Send button — is on the other tab. */
    if (DRAFTLIST === null && document.getElementById("msgover") &&
        typeof SYNC !== "undefined" && SYNC.isLive()) {
      DRAFTLIST = { drafts: [] };
      SYNC.mailDraftList(function(err, j){
        DRAFTLIST = err ? { error: err } : { drafts: (j && j.drafts) || [] };
        paint();
      });
    }

    /* ── OPENING A SENT MESSAGE (§93.15) ──────────────────────────────
       Asked once per message and kept, so closing and reopening the same one
       does not go back to the server. The state carries the id, so a paint
       that happens while it is loading redraws "Asking…" rather than losing
       the panel (§35's rule for the password states). */
    document.querySelectorAll("[data-sentone]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = Number(this.dataset.sentone);
        if (SENTONE && SENTONE.id === id) { SENTONE = null; paint(); return; }
        SENTONE = { id: id, asking: true, data: null, error: null };
        paint();
        if (typeof SYNC === "undefined" || !SYNC.isLive()) {
          SENTONE = { id: id, asking: false, data: null,
                      error: "There is no server here to ask." };
          paint(); return;
        }
        SYNC.mailHistoryOne(id, function(err, j){
          /* Only if this is still the message being asked about — two quick
             clicks would otherwise land the first answer on the second panel. */
          if (!SENTONE || SENTONE.id !== id) return;
          SENTONE = err || !j || !j.ok
            ? { id: id, asking: false, data: null,
                error: (err && err.message) || (j && j.error) || "Could not ask the server." }
            : { id: id, asking: false, data: j, error: null };
          paint();
        });
      });
    });
    var sentClose = document.querySelector("[data-sentclose]");
    if (sentClose) sentClose.addEventListener("click", function(){ SENTONE = null; paint(); });

    /* THE NAMES ARE A DISCLOSURE, not a repaint of the composer — but the
       audience block is its own element and paint() is what redraws it, so
       this is one of the few things on this page that may repaint (§35: what
       must not repaint is the TYPING, and this is not it). */
    /* ── BOUND ON THE CONTAINER, NOT ON THE BUTTON (§95) ───────────
       `paintAudience()` replaces `#audout`'s innerHTML, so a handler bound to
       the button inside it dies the moment the server answers — which is the
       only moment there is ever anything to disclose. Bound here it survives,
       because `#audout` itself is only ever replaced by `paint()`, which runs
       `wire()` after it (§29.5).

       AND IT REDRAWS THE BLOCK RATHER THAN THE PAGE. A full repaint would
       replace the composer, and the composer may have a half-typed sentence in
       it that has not reached SENDMSG yet (§35, §71.2). */
    var audout = document.getElementById("audout");
    if (audout) audout.addEventListener("click", function(e){
      if (!e.target.closest("[data-audnames]")) return;
      SENDNAMES = !SENDNAMES; paintAudience();
    });

    var msgsend = document.getElementById("msgsend");
    if (msgsend) msgsend.addEventListener("click", function(){
      var st = sendmsg(), out = document.getElementById("msgsaid");
      function say(msg, ok){
        st.result = { msg: msg, ok: ok, rows: (st.result && st.result.rows) || null };
        if (!out) return;
        out.textContent = msg;
        out.style.color = ok === null ? "" : ("var(--" + (ok ? "good" : "bad") + "-tx)");
      }
      if (!sendmsgHasAny()) return say("Choose who it goes to first.", false);
      if (!st.subject.trim()) return say("It needs a subject.", false);
      if (!st.body.trim()) return say("It needs something in it.", false);
      /* ── A BUTTON THAT CANNOT OPEN IS REFUSED (spec 027) ──────────
         The blur above completes anything that CAN be completed, so what is
         left here is a value no amount of tidying makes into a web address —
         and the alternative to saying so is what happened: the message goes,
         and every person who presses the button gets their operating system's
         refusal instead of the platform. The one moment this can still be
         stopped is before the confirmation, so it is checked here rather than
         inside reallySend(), where a person has already said yes. */
      if (st.ctaHref.trim() && !SMPRules.webUrl(st.ctaHref))
        return say("The button's link is not a web address, so it would not open " +
                   "for anybody. Give it one starting https:// — or clear it " +
                   "to send with no button.", false);
      var n = (st.aud && st.aud.to) ? st.aud.to.length : 0;
      if (!n) return say("That comes to nobody with an address.", false);
      /* ── THE CONFIRMATION IS THE PLATFORM'S OWN (§95) ──────────────
         It was `confirm()` — the browser dialog, which a person can silence
         permanently with a checkbox on some other site, after which the most
         irreversible act in this product happens on one press with nothing
         shown. §69.22 removed exactly this from the register's password reset
         for exactly this reason, and this is the more dangerous of the two.

         AND IT GETS TO SAY MORE. A native dialog is one line of text; this one
         names the subject, the count, and — the part that matters — WHO WILL
         NOT RECEIVE IT, which is the fault that started this whole thread. */
      var sk = (st.aud && st.aud.skipped) || [];
      openModalHtml("Send to " + plural(n, "person", "people") + "?", "",
        '<div class="sendconfirm">' +
          '<div class="kv"><span class="k">Subject</span><span>' +
            esc(st.subject.trim()) + '</span></div>' +
          '<div class="kv"><span class="k">Goes to</span><span><b>' +
            plural(n, "person", "people") + '</b>, one message each \u2014 nobody ' +
            'sees who else got it.</span></div>' +
          (sk.length
            ? '<div class="kv"><span class="k">Skipped</span><span><b>' + sk.length +
              '</b> with no usable address: ' +
              esc(sk.slice(0, 6).map(function(x){ return x.name; }).join(", ")) +
              (sk.length > 6 ? ", and " + (sk.length - 6) + " more" : "") + '</span></div>'
            : '') +
          '<div class="kv"><span class="k">No undo</span><span>A message that has ' +
            'gone cannot be recalled.</span></div>' +
          '<div class="cbtns"><button data-sendno="1">Cancel</button>' +
          '<button class="danger" data-sendyes="1">Yes, send it</button></div>' +
        '</div>');
      var box = document.getElementById("modal-b");
      if (box) {
        var no = box.querySelector("[data-sendno]");
        if (no) no.addEventListener("click", function(){ closeModal(); });
        var yes = box.querySelector("[data-sendyes]");
        if (yes) yes.addEventListener("click", function(){ closeModal(); reallySend(); });
      }
      return;
    });

    /* The send itself, lifted out so the confirmation can call it. Everything
       below this line is what the button used to do after `confirm()` said
       yes, unchanged. */
    function reallySend(){
      var st = sendmsg(), out = document.getElementById("msgsaid");
      /* WRITTEN INTO THE ELEMENT, because a repaint would replace the button
         that was just pressed (§63). THE CLASS, not an inline colour — the
         render says the same thing with `.msgsaid.bad`, and two ways of
         colouring one span is how the two come to disagree (§53.5). A null
         `ok` is "in progress" and wears neither.

         THIS ONLY EVER REPORTS A FAILURE NOW (§144): a send the server
         answered leaves this tab, and its outcome is drawn on the Overview. */
      function say(msg, ok){
        st.result = { msg: msg, ok: ok, rows: (st.result && st.result.rows) || null };
        if (!out) return;
        out.textContent = msg;
        out.className = "why msgsaid" + (ok === false ? " bad" : "");
      }
      var n = (st.aud && st.aud.to) ? st.aud.to.length : 0;
      var msgsend = document.getElementById("msgsend");
      var sh = commsShape();
      say("Sending to " + plural(n, "person", "people") + "\u2026", null);
      msgsend.disabled = true;
      st.busy = true;
      /* The server resolves the list again from the stored register, so what it
         holds has to be what is on screen before the send, not after. */
      SYNC.saveNow(function(){
      SYNC.mailSend({
        draftId: st.draftId,
        criteria: st.criteria, subject: st.subject.trim(), body: st.body.trim(),
        ctaLabel: st.ctaLabel.trim(), ctaHref: st.ctaHref.trim(),
        greet: st.greet,
        fromName: sh.fromName, replyTo: sh.replyTo,
        html: MAIL.html({
          org: sh.org, accent: sh.accent, panel: sh.panel, footer: sh.footer,
          eyebrow: sh.eyebrow, title: st.subject.trim(), preheader: st.subject.trim(),
          body: st.body.trim(),
          /* NO NAME HERE, deliberately — the builder leaves the region and the
             server fills it once per recipient, because who they are is the
             server's answer (spec 022, §74.2). */
          greeting: st.greet == null ? null : { word: st.greet },
          /* THROUGH THE RULE, never the raw box: the two sends and the
             preview must draw the same link, and it must be one that opens. */
          cta: (st.ctaLabel.trim() && SMPRules.webUrl(st.ctaHref))
                 ? { label: st.ctaLabel.trim(), href: SMPRules.webUrl(st.ctaHref) } : null
        })
      }, function(err, j){
        msgsend.disabled = false; st.busy = false;
        if (err) { say(err, false); return; }
        /* ── THE SERVER ANSWERED, SO GO BACK TO THE RECORD (§144) ─────
           Islam: "when I finish the email and send it it should take me back
           to the dashboard and show me that the message was sent there."

           `landed` is what says the outcome belongs on the Overview rather
           than in the composer's bar — set for a partial failure too, because
           the message DID go to most people and the record is where the
           failures are named. Only a send that never happened stays here.

           THE COMPOSER IS EMPTIED. What was in it has been sent and is in the
           record now; leaving it loaded behind a tab is a message that looks
           unsent and is one press from going twice. */
        st.result = { ok: !j.failed, landed: true,
          msg: plural(j.sent, "message", "messages") + " sent" +
               (j.failed ? ", " + j.failed + " failed" : "") + ".",
          skipped: (st.aud && st.aud.skipped) ? st.aud.skipped.length : 0,
          rows: null };
        st.subject = ""; st.body = "";
        st.ctaLabel = ""; st.ctaHref = ""; st.greet = null;
        /* The lists are asked again rather than guessed at: what the server
           recorded is the record, and a row this page invented would be a
           second copy of it (§95). */
        SENTLIST = null;
        st.draftId = null; DRAFTLIST = null;
        CURSEC["send"] = "over";
        paint();
      });
      });
    }

    /* ── SEND ME A COPY (§95) ───────────────────────────────────────
       The cheapest safeguard there is, and it was missing: a message to
       seventy-six people cannot be recalled, and until now the only way to see
       the real thing was to send the real thing. This builds THE SAME message
       with THE SAME builder (§72.3) and sends one copy, so what the sender
       reads in their own inbox is what the recipients will read — the subject
       included, unprefixed, or the preview would be a preview of something
       else.

       IT GOES TO THE PERSON SIGNED IN, NEVER THE PERSON BEING VIEWED AS.
       `viewer()` is the simulation (§45.1) and the SMO uses it constantly; a
       test that followed it would put a real message in a real colleague's
       inbox, addressed from a screen the sender was only looking through.
       `SYNC.person()` is the session, which is the one thing the switcher
       cannot move.

       THE ADDRESS COMES OFF THE REGISTER, because the session carries a key, a
       name and a role and no address (api/auth.js) — and if the register has
       none for them it says so and names the row to fix, rather than failing
       at the API with somebody else's error message. */
    var msgtestme = document.getElementById("msgtestme");
    if (msgtestme) msgtestme.addEventListener("click", function(){
      var st = sendmsg(), out = document.getElementById("msgsaid");
      function say(msg, ok){
        st.result = { msg: msg, ok: ok, rows: (st.result && st.result.rows) || null };
        if (!out) return;
        out.textContent = msg;
        out.style.color = ok === null ? "" : ("var(--" + (ok ? "good" : "bad") + "-tx)");
      }
      if (!st.subject.trim()) return say("It needs a subject before it can be previewed.", false);
      if (!st.body.trim()) return say("It needs something in it.", false);
      /* THE SAME REFUSAL SEND MAKES (spec 027). A copy that quietly dropped the
         button would be a preview of a message nobody can send — and the point
         of a copy is to see what the recipients will see. */
      if (st.ctaHref.trim() && !SMPRules.webUrl(st.ctaHref))
        return say("The button's link is not a web address, so it would not open " +
                   "for anybody. Give it one starting https:// — or clear it " +
                   "to send with no button.", false);
      var me = (typeof SYNC !== "undefined" && SYNC.person && SYNC.person()) || null;
      var row = me ? PEOPLE.filter(function(p){ return p.key === me.key; })[0] : null;
      var addr = row ? String(row.email == null ? "" : row.email).trim() : "";
      if (!addr)
        return say("There is no address on your own row on the register, so there is " +
                   "nowhere to send the copy. Add one on People.", false);
      var sh = commsShape();
      say("Sending you a copy…", null);
      msgtestme.disabled = true;
      SYNC.mailTest({
        to: addr,
        subject: st.subject.trim(),
        html: MAIL.html({
          org: sh.org, accent: sh.accent, panel: sh.panel, footer: sh.footer,
          eyebrow: sh.eyebrow, title: st.subject.trim(), preheader: st.subject.trim(),
          body: st.body.trim(),
          /* YOUR COPY GREETS YOU, by the name on the row of whoever is SIGNED
             IN — `row` is found from SYNC.person(), never viewer(), which is
             the simulation (§95). Filled here rather than left as a region:
             there is one recipient and the browser knows who they are. */
          greeting: st.greet == null ? null
                      : { word: st.greet, name: SMPRules.firstName(row) },
          /* THROUGH THE RULE, never the raw box: the two sends and the
             preview must draw the same link, and it must be one that opens. */
          cta: (st.ctaLabel.trim() && SMPRules.webUrl(st.ctaHref))
                 ? { label: st.ctaLabel.trim(), href: SMPRules.webUrl(st.ctaHref) } : null
        }),
        body: st.body.trim(),
        fromName: sh.fromName,
        replyTo: sh.replyTo
      }, function(err){
        msgtestme.disabled = false;
        say(err ? err : ("One copy sent to " + addr + ". Nobody else has had it. " +
                         "If it is not there, look in the junk folder."), !err);
      });
    });

    if (SENTLIST === null && document.getElementById("msgover") &&
        typeof SYNC !== "undefined" && SYNC.isLive()) {
      SENTLIST = { messages: [] };
      SYNC.mailHistory(function(err, j){
        SENTLIST = err ? { error: err } : { messages: (j && j.messages) || [] };
        paint();
      });
    }
    if (document.getElementById("audout") && sendmsgHasAny() &&
        !sendmsg().aud && !sendmsg().asking) sendmsgAsk();

    /* Asked ONCE PER SESSION, the same shape as the register's password
       states: whether a key is present and what Resend says about the domain
       are the server's facts, and a page that guessed them would report a
       working deployment as broken. Once, not once per paint — and not once
       per visit either, because the answer depends on environment variables
       that cannot change without a redeploy. The section says so, so nobody
       reads a stale verdict as a live one. */
    if (MAILSTATE === null && document.getElementById("mailprev") &&
        typeof SYNC !== "undefined" && SYNC.isLive()) {
      MAILSTATE = { pending:true };
      SYNC.mailStatus(function(err, st){
        MAILSTATE = err ? { error: err } : st;
        paint();
      });
    }

    wirePicker();

    /* ── ASKED WHEN THE REGISTER IS ON SCREEN (§93.2) ────────────────
       Islam: "the password status is all dash now — what is that status?"

       It was not a status. It is what the column shows when the server has
       said nothing about anybody, and the server had not been asked: this
       waited for `[data-edit="people"]`, the register's whole-table PEN, which
       spec 012 removed when rows became individually editable. The selector
       stopped matching, the request stopped firing, and 33 rows showed a dash
       that looks exactly like data.

       §51.11, in wiring rather than in a check: a condition keyed on markup
       that no longer exists does not fail, it quietly does nothing. Nothing
       threw, nothing was logged, and the passwords themselves were never
       touched — `credentials` is its own table outside the state graph (§19).

       KEYED ON THE PAGE NOW, NOT ON ITS MARKUP (§108.11). §93.2 keyed it on
       `.peoplecfg`, the register's table — better than the pen it replaced,
       and still the same KIND of thing: a class name, which a restyle can
       retire without anything failing. It asks the two pages that want the
       answer by NAME, which is data rather than markup and cannot silently
       stop matching. The Overview joins the list because it counts these two
       facts (§108.10) — and gating it on the register's markup would have
       given it a permanent, silent null, which draws no row: this exact fault
       twice already, and in the safe-looking direction both times. */
    /* THE FILTER IS RE-APPLIED AFTER EVERY PAINT, or a repaint that arrives
       while somebody is reading their own results would quietly show them the
       whole list again (§108.13). The box's value is rendered from RAILQ, so
       the two can never disagree. */
    railFilter();

    var WANTS_PEOPLE_FACTS = { people:1, overview:1 };
    var onRegister = !!WANTS_PEOPLE_FACTS[currentSub];
    if (PWSTATES === null && onRegister &&
        typeof SYNC !== "undefined" && SYNC.isLive() && inOffice()) {
      PWSTATES = {};
      SYNC.passwordStates(function(err, st){
        /* AND A REFUSAL IS SAID, not swallowed into the same dash. `return`
           left PWSTATES as {} — indistinguishable from "asked, and nobody has
           a password" — so a 403 and a healthy empty tenant looked identical.
           A column that cannot answer says so. */
        if (err) { PWSTATES = { __error: String(err.message || err) }; paint(); return; }
        PWSTATES = st;
        paint();
      });
    }
    /* The same shape and the same moment as the password states: asked once
       per visit to the page, and absent rather than empty from file:// (§56). */
    /* The same selector, and it had gone the same way (§93.2). */
    if (SAIDWHERE === null && onRegister &&
        typeof SYNC !== "undefined" && SYNC.isLive() && inOffice()) {
      SAIDWHERE = {};
      SYNC.declarations(function(err, said){
        /* AND IT SAYS SO NOW TOO (§108.11). This was `if (err) return`, which
           leaves SAIDWHERE as {} — "asked, and nobody declared anything" —
           the exact shape §93 removed from the passwords beside it and did not
           come back for. It costs the register nothing (a note per row, absent
           either way) and it costs the Overview a false all-clear, which is
           the one thing that page must never give. */
        if (err) { SAIDWHERE = { __error: String(err.message || err) }; return; }
        SAIDWHERE = said;
        paint();
      });
    }
    /* ── AND WHAT THE INBOX IS HOLDING (§108.10) ─────────────────────
       Asked only on the Overview, because the Inbox counts its own queue when
       it is open and the corner has its own cadence (§98.1) — a third asker
       polling in the background is what §98 was about. Once per visit: this is
       a summary somebody reads and then acts on, not a live board. */
    if (OVQUEUE === null && currentSub === "overview" &&
        typeof CHAT !== "undefined" && CHAT.servable && CHAT.servable() && inOffice()) {
      OVQUEUE = {};
      CHAT.officeQueue(function(err, q){
        if (err || !q) { OVQUEUE = { __error: String((err && err.message) || err || "no answer") }; return; }
        OVQUEUE = q;
        paint();
      });
    }
  }

  /* ── The assignment picker (§35) ────────────────────────────────
     Open one, search it, choose a name or add a new one. Used by Business
     units and by Supporting functions, which is why it addresses everything
     through grantPersonRole() rather than writing UNIT_ROLES or FUNCTIONS
     itself — the register writes through the same door, so the two screens
     cannot drift apart.

     TYPING DOES NOT REPAINT. The filter hides rows in place instead, because
     a repaint would replace the very input being typed into, taking its focus
     and its caret with it — the same family of fault as §30.1, where a change
     handler rewrote the DOM under a button mid-click. A search box is an
     interaction that lasts several keystrokes; nothing may rebuild it while
     it is running. */
  function wirePicker(){
    document.querySelectorAll("[data-pick-open]").forEach(function(b){
      b.addEventListener("click", function(){
        PICKING = b.dataset.pickOpen; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-pick-cancel]").forEach(function(b){
      b.addEventListener("click", function(){ PICKING = null; PICKQ = ""; paint(); });
    });
    document.querySelectorAll("[data-pick-set]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.pickSet.split("|");
        grantPersonRole(p[2], p[1], p[0]);
        PICKING = null; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-pick-clear]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.pickClear.split("|");
        revokePersonRole(p[2], p[1], p[0]);
        PICKING = null; PICKQ = ""; paint();
      });
    });
    /* Add new: the typed name becomes a person AND takes the role in one act,
       which is the whole point — "create only the name and the Role", in
       Islam's words. They appear in the register immediately, for the rest of
       their details. */
    document.querySelectorAll("[data-pick-new]").forEach(function(b){
      b.addEventListener("click", function(){
        var name = (PICKQ || "").trim();
        if (!name) return;
        var idf = document.getElementById("pickNewId");
        var mlf = document.getElementById("pickNewEmail");
        var o = { name:name, empId:(idf ? idf.value : "").trim(),
                  email:(mlf ? mlf.value : "").trim() };
        /* REFUSED, IN THE PICKER, NAMING WHO (§87.3). An employee number or an
           address already on the register means the person is already on the
           register, and the thing to do is give them the role — which is the
           control directly above this one. The refusal stays in the popover
           rather than repainting the page away from it. */
        var chk = personAddCheck(o);
        if (chk.stop) {
          var er = document.querySelector(".pickerr");
          if (er) {
            er.hidden = false;
            er.textContent = chk.person.name + " is already on the register with that " +
              (chk.by === "empId" ? "employee number" : "address") +
              " \u2014 search for them above and give them the role.";
          }
          return;
        }
        var p = b.dataset.pickNew.split("|");
        o.where = p[0]; o.role = p[1];
        addPerson(o);
        PICKING = null; PICKQ = ""; paint();
      });
    });

    /* The naming picker (spec 008 §3B). Its own open/set/clear, and the SAME
       search below \u2014 one filter implementation, because two would drift the
       way two copies of a rule drift. It writes { by } and nothing else: a
       figure a set holds is not offered a control at all, so this only ever
       sees a free figure or one this unit named itself. */
    document.querySelectorAll("[data-name-open]").forEach(function(b){
      b.addEventListener("click", function(){
        PICKING = b.dataset.nameOpen; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-name-set]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.nameSet.split("|");        /* src|<unit>|<figure>|<person> */
        var hit = SMPRules.rowById(world(), p[1], p[2]);
        if (hit && !(hit.src && hit.src.set)) hit.src = { by: p[3] };
        PICKING = null; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-name-clear]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.nameClear.split("|");
        var hit = SMPRules.rowById(world(), p[1], p[2]);
        if (hit && hit.src && !hit.src.set) delete hit.src;
        PICKING = null; PICKQ = ""; paint();
      });
    });

    var q = document.getElementById("pickQ");
    if (!q) return;
    q.addEventListener("input", function(){
      PICKQ = q.value;
      var needle = PICKQ.trim().toLowerCase();
      var any = false;
      document.querySelectorAll(".pickrow").forEach(function(r){
        var hit = !needle || r.dataset.find.indexOf(needle) > -1;
        r.hidden = !hit;
        if (hit) any = true;
      });
      /* ── THE SPELLING IS WHY THE TWINS EXIST (§87.3) ───────────────
         A plain substring search finds nobody the moment the name is typed a
         little differently from the way HR spelled it — and what the picker
         then offers is "+ Add", which is exactly how three people ended up on
         this register twice. So when nothing matched, ask the looser question
         before offering to create anybody: the same one the register's marks
         use, the chain of names in order rather than a similarity score.

         SHOWN, NOT SUBSTITUTED. Add stays available underneath — two people
         really can have names that read alike, and the picker must not be the
         thing that decides they are one person. */
      var near = false;
      if (needle && !any) {
        document.querySelectorAll(".pickrow").forEach(function(r){
          if (!namesLookLikeOne(needle, r.dataset.name)) return;
          r.hidden = false; near = true;
        });
      }
