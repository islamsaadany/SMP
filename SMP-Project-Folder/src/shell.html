      });
    });
    var newBu = document.getElementById("newMainbu");
    if (newBu) {
      newBu.addEventListener("input", function(){ NEWMAINBU = newBu.value; });
      newBu.addEventListener("keydown", function(e){
        if (e.key === "Enter") { e.preventDefault(); addTypedMainbu(); }
      });
    }
    function addTypedMainbu(){
      var n = (NEWMAINBU || "").trim();
      if (!n) return;
      addMainbu(n);
      NEWMAINBU = "";
      paint();
    }
    document.querySelectorAll("[data-mbadd]").forEach(function(b){
      b.addEventListener("click", addTypedMainbu);
    });

    /* ── The register's own file (§54.3) ────────────────────────────
       Download, upload, review, apply. The gate is checked HERE as well as on
       the section that draws the controls, for the reason renderImport()
       states: a destination can be reached with a stale page after a role
       changed under the viewer, and the handler is the last thing between a
       file and the register. */
    var dlp = document.querySelector("[data-dlppl]");
    if (dlp) dlp.addEventListener("click", function(){
      sendXlsx(peopleWorkbook(), "SMP - people.xlsx");
    });

    /* `pfile`, NOT `pf` (found 2026-08-23). TWO BRANCHES EACH ADDED A `var pf`
       TO THIS ONE FUNCTION and git merged both without a word, because they
       are six hundred lines apart and nothing about the text conflicts. `var`
       is FUNCTION-scoped, so they were one binding: on every paint where the
       People page is not on screen this line reassigned it to null, and the
       deck button's handler — which closed over the same `pf` — threw
       `null.dataset` and a function's Present did nothing at all.

       Neither branch was wrong and neither test could have caught it: each
       half worked perfectly in the tree it was written in. A CLEAN MERGE CAN
       STILL COLLIDE IN A SHARED SCOPE, and the only thing that finds it is
       driving the merged product. */
    var pfile = document.getElementById("ppl-file");
    if (pfile) pfile.addEventListener("change", function(){
      if (grant("c_people") !== "edit") return;
      var file = this.files && this.files[0];
      if (!file) return;
      var rx = new FileReader();
      rx.onload = function(){
        readXlsx(rx.result).then(function(sheets){
          if (!sheets["People"]) {
            /* §48.8's rule: a file that cannot be read has to SAY so, where
               the upload is. A plan workbook dropped here is the likely
               mistake, and naming the sheet it is missing is what tells
               somebody which of the two files they picked up. */
            PPLF.plan = { rows:[], notices:[], newBus:[], added:0, updated:0,
                          roles:0, retired:0, restored:0,
                          problems:[{ at:file.name, msg:"has no sheet called People. This is " +
                            "the people workbook's own sheet \u2014 download the template above " +
                            "and fill that." }] };
            PPLF.read = ""; PPLF.done = null;
            paint();
            return;
          }
          var rows = peopleFromWorkbook(sheets);
          PPLF.plan = planPeopleFile(rows);
          PPLF.read = file.name + " \u00b7 " + plural(rows.length, "row");
          PPLF.done = null;
          paint();
        }).catch(function(e){
          PPLF.plan = { rows:[], notices:[], newBus:[], added:0, updated:0,
                        roles:0, retired:0, restored:0,
                        problems:[{ at:file.name,
                          msg:"could not be read as a workbook \u2014 " + e.message }] };
          PPLF.read = ""; PPLF.done = null;
          paint();
        });
      };
      rx.readAsArrayBuffer(file);
    });

    document.querySelectorAll("[data-pplapply]").forEach(function(b){
      b.addEventListener("click", function(){
        if (grant("c_people") !== "edit") return;
        var plan = PPLF.plan;
        if (!plan || plan.problems.length) return;
        applyPeopleFile(plan);
        /* The receipt is written from what the plan SAID, before the state
           moved under it — counted after the fact it would be counting the
           register rather than the file. */
        var parts = [];
        if (plan.added)    parts.push(plural(plan.added, "person").replace("persons", "people") + " added");
        if (plan.updated)  parts.push(plan.updated + " updated");
        if (plan.roles)    parts.push(plural(plan.roles, "role") + " given");
        if (plan.retired)  parts.push(plan.retired + " retired");
        if (plan.restored) parts.push(plan.restored + " restored");
        if (plan.newBus.length) parts.push(plural(plan.newBus.length, "BU name") + " added to the BU list");
        PPLF.done = parts.length ? parts.join(", ") + "." : "Nothing to change \u2014 the file matched the register.";
        PPLF.plan = null; PPLF.read = "";
        paint();
      });
    });
    document.querySelectorAll("[data-pplcancel]").forEach(function(b){
      b.addEventListener("click", function(){
        PPLF.plan = null; PPLF.read = ""; PPLF.done = null;
        paint();
      });
    });
    document.querySelectorAll("[data-as]").forEach(function(b){
      b.addEventListener("click", function(){
        VIEWER = b.dataset.as;
        document.getElementById("asWho").value = VIEWER;
        current = null; currentSub = null; paint(); window.scrollTo(0,0);
      });
    });
    /* The SMO issues a temporary password; the server checks the policy and
       forces a change on first sign-in. */
    /* ── ISSUING A PASSWORD, IN THE PAGE (§69.22) ────────────────────
       This was a `prompt()`, and a browser is allowed to SUPPRESS one —
       Chrome offers "prevent this page from creating additional dialogs"
       after a few — whereupon it returns null, the old handler read that as
       "cancelled", and nothing happened at all. No error, nowhere. That is
       the failure Islam hit, on a path that works perfectly when driven.

       Opening it closes the menu, for positionRowMenu()'s reason: it places
       `document.querySelector(".kmenu")`, so a second one in the same cell
       would be left unplaced at the top-left of the window. */
    document.querySelectorAll("[data-setpw]").forEach(function(b){
      b.addEventListener("click", function(){
        PSETPW = { key: b.dataset.setpw, pw: "", err: "", done: null };
        PMENU = null; PDEL = null;
        paint();
      });
    });
    document.querySelectorAll("[data-pwcancel]").forEach(function(b){
      b.addEventListener("click", function(){
        PSETPW = { key:null, pw:"", err:"", done:null };
        paint();
      });
    });
    /* TYPING NEVER REPAINTS (§35) — the value is kept in PSETPW so a repaint
       caused by anything ELSE cannot throw away what is half typed, and this
       handler only records it. */
    var pwField = document.getElementById("pwset-field");
    if (pwField) {
      pwField.addEventListener("input", function(){ PSETPW.pw = pwField.value; });
      pwField.addEventListener("keydown", function(e){
        if (e.key !== "Enter") return;
        e.preventDefault();
        var go = document.querySelector("[data-pwset]");
        if (go) go.click();
      });
      if (!PSETPW.pw) pwField.focus();
    }
    /* GENERATED FROM crypto, never from Math.random: this is a credential, and
       a predictable one is worse than a weak one somebody chose. One character
       is taken from each required class first so the result cannot fail the
       policy, then the rest is filled and the whole thing shuffled — building
       it in class order would make every generated password start with a
       capital and end with a symbol. */
    document.querySelectorAll("[data-pwgen]").forEach(function(b){
      b.addEventListener("click", function(){
        var sets = ["ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnpqrstuvwxyz",
                    "23456789", "!?@#$%&*+-="];
        var n = 14, out = [], pool = sets.join("");
        var rnd = function(max){
          var a = new Uint32Array(1);
          (window.crypto || window.msCrypto).getRandomValues(a);
          return a[0] % max;
        };
        sets.forEach(function(set){ out.push(set[rnd(set.length)]); });
        while (out.length < n) out.push(pool[rnd(pool.length)]);
        for (var i = out.length - 1; i > 0; i--) {
          var j = rnd(i + 1), t = out[i]; out[i] = out[j]; out[j] = t;
        }
        PSETPW.pw = out.join(""); PSETPW.err = "";
        paint();
      });
    });
    document.querySelectorAll("[data-pwset]").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.dataset.pwset;
        var f = document.getElementById("pwset-field");
        var pw = (f ? f.value : PSETPW.pw) || "";
        if (!pw.trim()) {
          PSETPW.err = "Type a password, or press Generate.";
          paint();
          return;
        }
        PSETPW.pw = pw;
        /* ONE BUTTON, TWO ENDPOINTS, and the difference is which one the SERVER
           picks the people for: `issueTemporary` sends a scope and never a list
           of keys, so a stale screen can only ever issue to FEWER people than it
           thinks, never more (§35). */
        if (key.indexOf("bulk:") === 0) {
          var scope = key.slice(5);
          SYNC.issueTemporary(pw, scope, function(err, issued){
            if (err) { PSETPW.err = err; paint(); return; }
            issued.forEach(function(k){ if (PWSTATES) PWSTATES[k] = "temporary"; });
            PSETPW.err = "";
            PSETPW.done = {
              pw: issued.length ? pw : "",
              what: issued.length
                ? "Issued to " + plural(issued.length, "person").replace("persons", "people") + "."
                : (scope === "all"
                    ? "Nobody to issue to \u2014 you are the only active person."
                    : "Nobody needed one \u2014 everybody already has a password.")
            };
            paint();
          });
          return;
        }
        SYNC.setPassword(key, pw, function(err){
          if (err) {
            /* The SERVER's sentence, verbatim — it owns the policy, and a
               second copy here would be a rule in two places (§42). */
            PSETPW.err = err;
            paint();
            return;
          }
          /* The register shows a password COLUMN now, so a reset that does not
             repaint it leaves the screen claiming the old state. Ask again
             rather than assuming — the server is what knows. */
          if (PWSTATES) PWSTATES[key] = "temporary";
          PSETPW.err = "";
          PSETPW.done = pw;
          paint();
        });
      });
    });
    document.querySelectorAll("[data-pwcopy]").forEach(function(b){
      b.addEventListener("click", function(){
        var el = document.getElementById("pwset-done");
        if (!el) return;
        var text = el.textContent;
        var say = function(ok){ b.textContent = ok ? "Copied" : "Select it and copy"; };
        /* The clipboard needs a secure context and a permission, and neither is
           guaranteed — so the failure says what to do instead rather than
           leaving a button that did nothing (which is the whole fault this
           panel exists to fix). */
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function(){ say(true); },
                                                   function(){ say(false); });
        } else { say(false); }
      });
    });

    /* ── The register (§35) ─────────────────────────────────────────
       Three text fields, a standing toggle, an add row, the role controls and
       the bulk issue. Everything writes the same data the Business units page
       writes — there is no second copy to keep in step. */
    /* ── A TEXT FIELD WRITES ITS VALUE AND REPAINTS NOTHING (§71.2) ──
       Islam: "when I edit things of the table let the table stay stable — it
       jumps to other cells or refreshes the whole page."

       It did: every one of these called `paint()`, which rebuilds the entire
       panel. Tabbing out of a name threw away the scroll position, the focus,
       the open menu and every enhanced select on the page, and rebuilt
       thirty-three rows to record one word — on a table you edit by moving
       across it, so it happened on EVERY cell.

       Nothing needs the repaint. The value is already correct in the box it
       was typed into; the copies of it elsewhere (a chip counting how many
       people have no email, a name echoed in the navigation) refresh on the
       next natural paint. That is a summary going stale for a few seconds
       against losing your place on every field exit, and it is not close.

       SAVED, THOUGH. `SYNC.afterPaint()` is what schedules the write, and it
       was only ever reached THROUGH paint() — so removing the repaint without
       this would have made every edit stay on screen and never reach the
       database until something else happened to repaint. */
    function fieldSaved(){
      if (typeof SYNC !== "undefined" && SYNC.afterPaint) SYNC.afterPaint();
    }
    function fieldWire(attr, apply){
      document.querySelectorAll("[data-" + attr + "]").forEach(function(inp){
        inp.addEventListener("change", function(){
          var p = personBy(inp.dataset[attr]);
          if (!p) return;
          apply(p, inp.value.trim());
          fieldSaved();
        });
      });
    }
    fieldWire("pname",  function(p, v){ if (v) p.name = v; });
    fieldWire("ptitle", function(p, v){ if (v) p.title = v; else delete p.title; });
    fieldWire("pphone", function(p, v){ if (v) p.phone = v; else delete p.phone; });
    /* The two the employee file brings (§54.2). Cleared when emptied rather
       than kept as "", so absent and blank stay one word — the codebase reads
       every optional field with == null and a stored empty string would come
       back through the round trip as a field the data never had. */
    fieldWire("pempid", function(p, v){ if (v) p.empId = v; else delete p.empId; });
    fieldWire("pemail", function(p, v){ if (v) p.email = v; else delete p.email; });

    document.querySelectorAll("[data-pact]").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.dataset.pact;
        var p = personBy(key);
        if (!p) return;
        if (personActive(p)) {
          var held = personRoles(p).length;
          if (held && !confirm(p.name + " holds " + plural(held, "role") +
              ". Retiring takes " + (held === 1 ? "it" : "them") +
              " away and closes their sign-in. Everything already reported in their name stays.\n\nRetire " +
              p.name + "?")) return;
          retirePerson(key);
        } else {
          /* ── RESTORING ASKS ABOUT THE ROLES (§49.4) ────────────────
             It used to hand the person back with nothing, so they returned as
             a Contributor of their unit and nobody was told. A seat somebody
             else has taken up meanwhile is named and NOT offered — restoring
             one person must never quietly unseat another. */
          var back = personHeldRoles(key), free = back.filter(function(r){ return !r.taken; });
          var give = false;
          if (back.length) {
            var name = function(r){ return roleName(r.role) + " of " + roleWhereLabel(r.at); };
            var taken = back.filter(function(r){ return r.taken; });
            give = confirm(p.name + " held " + plural(back.length, "role") + " when they were retired.\n\n" +
              (free.length
                ? "Give back: " + free.map(name).join(", ") + "\n"
                : "None can be given back.\n") +
              (taken.length
                ? "Held by somebody else now, so left alone: " +
                  taken.map(function(r){ return name(r) + " (" + personName(r.taken) + ")"; }).join(", ") + "\n"
                : "") +
              "\nOK gives back what it can. Cancel brings " + p.name +
              " back with no role \u2014 a Contributor of their unit.");
            if (!give && !confirm("Bring " + p.name + " back with no role?")) return;
          }
          restorePerson(key, give && free.length > 0);
        }
        /* THE MENU CLOSES WHEN ITS ACTION FIRES (§48.7). It was left open, so
           after retiring somebody the panel stayed on screen now reading
           "Restore this person" — and the next press of the kebab read as a
           toggle-shut, which looks like a broken control. Cleared AFTER the
           action, never before: closing it first would unmount the button the
           click is still inside (§47.2). */
        PMENU = null;
        paint();
      });
    });

    /* ── DELETING A PERSON FOR GOOD (§69) ───────────────────────────
       Opening the question CLOSES the menu it came from: positionRowMenu()
       places `document.querySelector(".kmenu")` — the first one — so two of
       them in one cell would leave the second unplaced at the top-left of the
       window. One panel open at a time, which is what the state shape already
       says (PMENU and PDEL are single keys, not flags per row).

       Cleared AFTER the action in every branch, never before: closing it first
       unmounts the button the click is still inside (§47.2). */
    document.querySelectorAll("[data-pdel]").forEach(function(b){
      b.addEventListener("click", function(){
        PDEL = b.dataset.pdel; PMENU = null; paint();
      });
    });
    document.querySelectorAll("[data-pdel-no]").forEach(function(b){
      b.addEventListener("click", function(){ PDEL = null; paint(); });
    });
    document.querySelectorAll("[data-pdel-yes]").forEach(function(b){
      b.addEventListener("click", function(){
        /* deletePerson() re-asks the blockers and refuses on its own (§48.2).
           This does not check them again — two copies of "may this be deleted"
           is exactly the drift the one function exists to prevent — it reads
           the ANSWER, and says so when the answer is no. */
        var key = b.dataset.pdelYes, p = personBy(key), name = p ? p.name : key;
        var done = deletePerson(key);
        PDEL = null;
        paint();
        if (!done) {
          alert(name + " could not be deleted \u2014 something has come to point at " +
                "them since this was asked. Open the menu again to see what.");
        }
      });
    });

    /* The typed name is held in a global rather than read off the input at
       submit time, because the repaint that follows any other change would
       otherwise throw it away mid-typing. */
    var newName = document.getElementById("newPersonName");
    if (newName) {
      newName.addEventListener("input", function(){ NEWPERSON = newName.value; });
      newName.addEventListener("keydown", function(e){
        if (e.key === "Enter") { e.preventDefault(); addTypedPerson(); }
      });
    }
    function addTypedPerson(){
      var name = (NEWPERSON || "").trim();
      if (!name) return;
      addPerson({ name: name });
      NEWPERSON = "";
      paint();
    }
    document.querySelectorAll("[data-padd]").forEach(function(b){
      b.addEventListener("click", addTypedPerson);
    });

    /* ── THE ROLE PICKER, ONE HALF PER COLUMN (§69) ─────────────────
       It opens EMPTY. Before this it opened on "owner", so a picker somebody
       opened by mistake was already holding an answer — which was harmless
       while a Give button stood between it and the grant, and is not now that
       choosing both halves IS the grant. */
    document.querySelectorAll("[data-prole-open]").forEach(function(b){
      b.addEventListener("click", function(){
        ADDROLE = b.dataset.proleOpen; ADDROLE_KIND = ""; paint();
      });
    });
    /* Choosing the role repaints, because the SECOND select's options depend
       on the first: a company CEO is attached to a company, a function head to
       a function. One list of every role-times-place would offer Company CEO
       of Mobile. Emptying it back to "Choose a role…" empties the other half
       with it, rather than leaving a unit list standing under no role. */
    document.querySelectorAll("[data-prole-pick]").forEach(function(sel){
      sel.addEventListener("change", function(){ ADDROLE_KIND = sel.value; paint(); });
    });
    /* NO GIVE BUTTON. The pair commits itself the moment the second half is
       answered — Islam: "without give or cancel … eventually it's a selection
       that I can remove after with the x button you made."

       Which is why it is guarded on BOTH halves rather than on this one: a
       change event on the where select can only fire after a role was picked,
       but ADDROLE_KIND is a global that a repaint between the two could have
       cleared, and granting `undefined` at a unit writes a role nothing can
       name and nothing can take off. */
    document.querySelectorAll("[data-prole-where]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var key = sel.dataset.proleWhere;
        if (!sel.value || !roleIsGrantable(ADDROLE_KIND)) return;
        grantPersonRole(key, ADDROLE_KIND, sel.value);
        ADDROLE = null; ADDROLE_KIND = "";
        paint();
      });
    });
    document.querySelectorAll("[data-prole-off]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.proleOff.split("|");
        revokePersonRole(p[0], p[1], p[2]);
        paint();
      });
    });
    /* ── THE TWO FACTS THAT COULD BE READ AND NOT CORRECTED (§69.17) ──
       Both go through the ONE door each already has: attachPersonAt() is where
       "where does this person sit" is written, shared by the register, the
       file importer and the Use-it button (§54.1), and `p.mainbu` is the
       client's own word, stored as first written.

       An Official BU NOT on the list is kept rather than refused — the list is
       soft (§54) and a name the file brought is still this person's true
       answer — but it is ADDED to the list unmapped, exactly as the file
       reader does, so the SMO can then point it somewhere. Two places writing
       the same fact differently is what mainbuList() exists to prevent. */
    document.querySelectorAll("[data-pmainbu]").forEach(function(sel){
      sel.addEventListener("change", function(){
        if (grant("c_people") !== "edit") return;
        var p = personBy(sel.dataset.pmainbu);
        if (!p) return;
        var v = sel.value.trim();
        if (!v) delete p.mainbu;
        else {
          p.mainbu = v;
          if (!mainbuBy(v)) mainbuList().push({ name: v, at: null });
        }
        paint();
      });
    });
    document.querySelectorAll("[data-pat]").forEach(function(sel){
      sel.addEventListener("change", function(){
        if (grant("c_people") !== "edit") return;
        var p = personBy(sel.dataset.pat);
        if (!p) return;
        attachPersonAt(p, sel.value || null);
        paint();
      });
    });

    /* ACCEPTING WHAT SOMEBODY SAID ABOUT THEMSELVES (§56). The declaration
       granted nothing; this is the SMO moving them, and it is an ordinary edit
       of the person's BU — attachPersonAt() is the one door the register and
       the file importer already share (§54), and the save is authorised on the
       server like every other. Nothing here touches the declaration itself: it
       stands until the person says something else, and the note stops showing
       the moment the two agree. */
    document.querySelectorAll("[data-usesaid]").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.dataset.usesaid;
        var said = SAIDWHERE && SAIDWHERE[key];
        var p = personBy(key);
        if (!p || !said) return;
        attachPersonAt(p, said);
        paint();
      });
    });

    /* One temporary password for everyone who has none. The SERVER picks the
       set — this sends a password and nothing else — so the worst a stale
       screen can do is issue to a shorter list than it showed. */
    /* Unfolding a person's extra roles (§47.1). Not a hover: a hover cannot be
       reached on a touch screen, and this is the only place the second role
       appears on the page. */
    document.querySelectorAll("[data-proles]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        PROLES = b.dataset.proles || null;
        paint();
      });
    });
    /* The two header menus (§47.2). Opening one closes the other. */
    document.querySelectorAll("[data-colmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation(); PCOLMENU = !PCOLMENU; PWMENU = false; paint();
      });
    });
    document.querySelectorAll("[data-pwmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation(); PWMENU = !PWMENU; PCOLMENU = false; paint();
      });
    });
    /* A tick repaints the table but MUST NOT close the menu — you come here to
       set several columns, and a chooser that shuts after each one is a chooser
       you reopen six times. */
    document.querySelectorAll("[data-col]").forEach(function(b){
      b.addEventListener("change", function(e){
        e.stopPropagation(); setPeopleCol(b.dataset.col, b.checked); paint();
      });
    });
    document.querySelectorAll("[data-colall],[data-colnone]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var on = b.hasAttribute("data-colall");
        PEOPLE_COLS.forEach(function(c){ setPeopleCol(c.k, on); });
        paint();
      });
    });
    /* Edit the whole page, cursor in this person's name. The focus is applied
       AFTER the repaint that creates the input — focusing a node the paint is
       about to replace focuses nothing. */
    /* Same for the other two actions in that menu. `data-setpw` is wired
       elsewhere and already clears it; `data-as` is the viewer switch. */
    document.querySelectorAll(".kmenu [data-as]").forEach(function(b){
      b.addEventListener("click", function(){ PMENU = null; });
    });
    document.querySelectorAll("[data-pedit]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var key = b.dataset.pedit;
        EDITING.people = true; PMENU = null;
        paint();
        var f = document.querySelector('[data-pname="' + key + '"]');
        if (f) { f.focus(); f.select(); }
      });
    });
    /* The row's action menu (§46.4). Opening one closes any other, because
       PMENU is a single key rather than a flag per row. */
    document.querySelectorAll("[data-pmenu]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        PMENU = PMENU === b.dataset.pmenu ? null : b.dataset.pmenu;
        paint();
      });
    });
    /* TWO COLLECTIVE ACTIONS, AND THE SECOND IS NOT THE FIRST WITH A WIDER
       REACH. "none" can lock nobody out — it only reaches people who could not
       sign in anyway. "all" overwrites live passwords and ends sessions, so the
       panel names the number of people it hits before it will do it.

       THE TWO COLLECTIVE ACTIONS OPEN THE SAME PANEL (§69.22). Both were a
       `confirm()` in front of a `prompt()`, and both could be suppressed —
       which on the destructive one meant a reset proceeding because its
       warning had been silenced. The warning is IN the panel now.

       Menu state cleared HERE, before the panel is drawn, never from the
       button's own teardown: closing the menu first unmounts the control the
       click is still inside (§47.2). */
    document.querySelectorAll("[data-pwbulk]").forEach(function(b){
      b.addEventListener("click", function(){
        PSETPW = { key: "bulk:" + b.dataset.pwbulk, pw: "", err: "", done: null };
        PWMENU = false; PMENU = null; PDEL = null;
        paint();
      });
    });

    /* Asked ONCE, the first time the register is on screen with a database
       behind it. Credentials are not in the state graph and never will be
       (§19), so this is a separate question — and it is a question about other
       people's accounts, so the server answers it only for the SMO.

       PWSTATES starts null meaning "not asked" and is set to {} before the
       request goes out, which is what stops every repaint asking again. Empty
       renders as a dash, not as "none": not knowing is not the same as knowing
       there is no password (§30.2, the same distinction). */
    /* ── Branding (§39) ─────────────────────────────────────────────
       The colour input fires `input` continuously while the picker is dragged,
       so it repaints on `change` — once, when the picker closes — and the hex
       field on `change` too. A repaint per frame of a drag would rebuild the
       control being dragged, which is §30.1 again. */
    document.querySelectorAll("[data-brand]").forEach(function(inp){
      inp.addEventListener("change", function(){
        branding()[inp.dataset.brand] = inp.value.toUpperCase();
        applyBrand(); paint();
      });
    });
    document.querySelectorAll("[data-brandhex]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = inp.value.trim();
        /* An unreadable value is refused rather than stored: a half-typed hex
           would blank the colour and look like the platform had lost it. */
        if (v && !hexRgb(v)) { inp.value = branding()[inp.dataset.brandhex] || ""; return; }
        branding()[inp.dataset.brandhex] = v ? rgbHex(hexRgb(v)) : null;
        applyBrand(); paint();
      });
    });
    document.querySelectorAll("[data-brandclear]").forEach(function(b){
      b.addEventListener("click", function(){
        branding()[b.dataset.brandclear] = null;
        applyBrand(); paint();
      });
    });
    document.querySelectorAll("[data-brandreset]").forEach(function(b){
      b.addEventListener("click", function(){
        GROUP.branding = {};
        applyBrand(); paint();
      });
    });

    /* ── Communication (§72) ────────────────────────────────────────
       `fieldSaved()` rather than `paint()`, the same rule the register learned
       in §71.2: a repaint on `change` replaces the field somebody has just
       tabbed out of, and the next field they meant to reach has moved. What
       DOES have to follow the edit is the preview, so it is redrawn on its
       own — one element, not the page. */
    document.querySelectorAll("[data-comms]").forEach(function(inp){
      inp.addEventListener("change", function(){
        commsSet(inp.dataset.comms, inp.value);
        fieldSaved();
        paintMailPreview();
      });
    });
    document.querySelectorAll("[data-commsreset]").forEach(function(b){
      b.addEventListener("click", function(){
        delete GROUP.comms;
        paint();
      });
    });
    /* THE WORD IS WRITTEN INTO THE ELEMENT, not painted (§63.4): a repaint
       would replace the button that was just pressed, and with it the sentence
       saying what pressing it did. */
    document.querySelectorAll("[data-mailtest]").forEach(function(b){
      b.addEventListener("click", function(){
        var to = document.getElementById("mailto");
        var out = document.getElementById("mailsent");
        var addr = to ? to.value.trim() : "";
        /* `good-tx` and `bad-tx` are TOKENS, not classes — written as a class
           name this line would have silently coloured nothing. */
        function say(msg, ok){
          MAILSENT = { ok: ok, msg: msg };
          if (!out) return;
          out.textContent = msg;
          out.style.color = ok === null ? "" : ("var(--" + (ok ? "good" : "bad") + "-tx)");
        }
        if (!addr) return say("Type an address first.", false);
        say("Sending…", null);
        b.disabled = true;
        var sh = commsShape();
        SYNC.mailTest({
          to: addr,
          subject: "Test from " + (sh.org || "the Strategy Management Platform"),
          html: MAIL.sampleFor(sh),
          fromName: sh.fromName,
          replyTo: sh.replyTo
        }, function(err){
          b.disabled = false;
          say(err ? err : ("Sent to " + addr + ". If it is not there, look in the junk folder."), !err);
        });
      });
    });
    paintMailPreview();

    /* ── The composer (§74) ─────────────────────────────────────────
       TICKING REPAINTS; TYPING DOES NOT. A checkbox changes what the page
       shows (which capsules are lit, and who it resolves to), so it repaints.
       The subject and the body are mirrored into SENDMSG on `change` and
       written straight into the preview on `input`, because a repaint would
       replace the box being typed into (§35, §71.2). */
    document.querySelectorAll("[data-aud]").forEach(function(inp){
      inp.addEventListener("change", function(){
        if (inp.dataset.aud === "everyone") sendmsg().criteria.everyone = inp.checked;
        else sendmsgToggle(inp.dataset.aud, inp.value, inp.checked);
        sendmsgAsk();
        paint();
      });
    });
    document.querySelectorAll("[data-audkey]").forEach(function(b){
      b.addEventListener("click", function(){
        sendmsgToggle("keys", b.dataset.audkey, false);
        sendmsgAsk(); paint();
      });
    });
    var audpick = document.getElementById("audpick");
    if (audpick) audpick.addEventListener("change", function(){
      if (!this.value) return;
      sendmsgToggle("keys", this.value, true);
      sendmsgAsk(); paint();
    });

    /* The four typed fields. `input` for the preview so it follows the
       keystroke, `change` for the store so a repaint cannot lose it — the same
       field wired twice on purpose, for two different jobs. */
    [["msgsubject","subject"],["msgbody","body"],
     ["msgctalabel","ctaLabel"],["msgctahref","ctaHref"]].forEach(function(pair){
      var el = document.getElementById(pair[0]);
      if (!el) return;
      el.addEventListener("input", function(){
        sendmsg()[pair[1]] = el.value;
        paintMsgPreview();
      });
    });
    paintMsgPreview();

    var msgsend = document.getElementById("msgsend");
    if (msgsend) msgsend.addEventListener("click", function(){
      var st = sendmsg(), out = document.getElementById("msgsaid");
      function say(msg, ok){
        st.result = { msg: msg, ok: ok, rows: (st.result && st.result.rows) || null };
        if (!out) return;
        out.textContent = msg;
        out.style.color = ok === null ? "" : ("var(--" + (ok ? "good" : "bad") + "-tx)");
      }
      if (!sendmsgHasAny()) return say("Choose who it goes to first.", false);
      if (!st.subject.trim()) return say("It needs a subject.", false);
      if (!st.body.trim()) return say("It needs something in it.", false);
      var n = (st.aud && st.aud.to) ? st.aud.to.length : 0;
      if (!n) return say("That comes to nobody with an address.", false);
      /* THE CONFIRMATION NAMES THE NUMBER, because the number is the thing
         that cannot be taken back. */
      if (!confirm("Send \u201c" + st.subject.trim() + "\u201d to " +
                   plural(n, "person", "people") + "? This cannot be undone."))
        return;
      var sh = commsShape();
      say("Sending to " + plural(n, "person", "people") + "\u2026", null);
      msgsend.disabled = true;
      st.busy = true;
      SYNC.mailSend({
        criteria: st.criteria, subject: st.subject.trim(), body: st.body.trim(),
        ctaLabel: st.ctaLabel.trim(), ctaHref: st.ctaHref.trim(),
        fromName: sh.fromName, replyTo: sh.replyTo,
        html: MAIL.html({
          org: sh.org, accent: sh.accent, panel: sh.panel, footer: sh.footer,
          eyebrow: sh.eyebrow, title: st.subject.trim(), preheader: st.subject.trim(),
          body: st.body.trim(),
          cta: (st.ctaLabel.trim() && st.ctaHref.trim())
                 ? { label: st.ctaLabel.trim(), href: st.ctaHref.trim() } : null
        })
      }, function(err, j){
        msgsend.disabled = false; st.busy = false;
        if (err) { say(err, false); return; }
        st.result = { ok: !j.failed,
          msg: plural(j.sent, "message", "messages") + " sent" +
               (j.failed ? ", " + j.failed + " failed" : "") + ".",
          rows: null };
        /* The list is asked again rather than guessed at: what the server
           recorded is the record, and a row this page invented would be a
           second copy of it. */
        SENTLIST = null;
        paint();
      });
    });

    if (SENTLIST === null && document.getElementById("msgsend") &&
        typeof SYNC !== "undefined" && SYNC.isLive()) {
      SENTLIST = { messages: [] };
      SYNC.mailHistory(function(err, j){
        SENTLIST = err ? { error: err } : { messages: (j && j.messages) || [] };
        paint();
      });
    }
    if (document.getElementById("audout") && sendmsgHasAny() &&
        !sendmsg().aud && !sendmsg().asking) sendmsgAsk();

    /* Asked ONCE PER SESSION, the same shape as the register's password
       states: whether a key is present and what Resend says about the domain
       are the server's facts, and a page that guessed them would report a
       working deployment as broken. Once, not once per paint — and not once
       per visit either, because the answer depends on environment variables
       that cannot change without a redeploy. The section says so, so nobody
       reads a stale verdict as a live one. */
    if (MAILSTATE === null && document.getElementById("mailprev") &&
        typeof SYNC !== "undefined" && SYNC.isLive()) {
      MAILSTATE = { pending:true };
      SYNC.mailStatus(function(err, st){
        MAILSTATE = err ? { error: err } : st;
        paint();
      });
    }

    wirePicker();

    if (PWSTATES === null && document.querySelector('[data-edit="people"]') &&
        typeof SYNC !== "undefined" && SYNC.isLive() && hasRole("super")) {
      PWSTATES = {};
      SYNC.passwordStates(function(err, st){
        if (err) return;
        PWSTATES = st;
        paint();
      });
    }
    /* The same shape and the same moment as the password states: asked once
       per visit to the page, and absent rather than empty from file:// (§56). */
    if (SAIDWHERE === null && document.querySelector('[data-edit="people"]') &&
        typeof SYNC !== "undefined" && SYNC.isLive() && hasRole("super")) {
      SAIDWHERE = {};
      SYNC.declarations(function(err, said){
        if (err) return;
        SAIDWHERE = said;
        paint();
      });
    }
  }

  /* ── The assignment picker (§35) ────────────────────────────────
     Open one, search it, choose a name or add a new one. Used by Business
     units and by Supporting functions, which is why it addresses everything
     through grantPersonRole() rather than writing UNIT_ROLES or FUNCTIONS
     itself — the register writes through the same door, so the two screens
     cannot drift apart.

     TYPING DOES NOT REPAINT. The filter hides rows in place instead, because
     a repaint would replace the very input being typed into, taking its focus
     and its caret with it — the same family of fault as §30.1, where a change
     handler rewrote the DOM under a button mid-click. A search box is an
     interaction that lasts several keystrokes; nothing may rebuild it while
     it is running. */
  function wirePicker(){
    document.querySelectorAll("[data-pick-open]").forEach(function(b){
      b.addEventListener("click", function(){
        PICKING = b.dataset.pickOpen; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-pick-cancel]").forEach(function(b){
      b.addEventListener("click", function(){ PICKING = null; PICKQ = ""; paint(); });
    });
    document.querySelectorAll("[data-pick-set]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.pickSet.split("|");
        grantPersonRole(p[2], p[1], p[0]);
        PICKING = null; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-pick-clear]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.pickClear.split("|");
        revokePersonRole(p[2], p[1], p[0]);
        PICKING = null; PICKQ = ""; paint();
      });
    });
    /* Add new: the typed name becomes a person AND takes the role in one act,
       which is the whole point — "create only the name and the Role", in
       Islam's words. They appear in the register immediately, for the rest of
       their details. */
    document.querySelectorAll("[data-pick-new]").forEach(function(b){
      b.addEventListener("click", function(){
        var name = (PICKQ || "").trim();
        if (!name) return;
        var p = b.dataset.pickNew.split("|");
        addPerson({ name: name, role: p[1], where: p[0] });
        PICKING = null; PICKQ = ""; paint();
      });
    });

    /* The naming picker (spec 008 §3B). Its own open/set/clear, and the SAME
       search below \u2014 one filter implementation, because two would drift the
       way two copies of a rule drift. It writes { by } and nothing else: a
       figure a set holds is not offered a control at all, so this only ever
       sees a free figure or one this unit named itself. */
    document.querySelectorAll("[data-name-open]").forEach(function(b){
      b.addEventListener("click", function(){
        PICKING = b.dataset.nameOpen; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-name-set]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.nameSet.split("|");        /* src|<unit>|<figure>|<person> */
        var hit = SMPRules.rowById(world(), p[1], p[2]);
        if (hit && !(hit.src && hit.src.set)) hit.src = { by: p[3] };
        PICKING = null; PICKQ = ""; paint();
      });
    });
    document.querySelectorAll("[data-name-clear]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.nameClear.split("|");
        var hit = SMPRules.rowById(world(), p[1], p[2]);
        if (hit && hit.src && !hit.src.set) delete hit.src;
        PICKING = null; PICKQ = ""; paint();
      });
    });

    var q = document.getElementById("pickQ");
    if (!q) return;
    q.addEventListener("input", function(){
      PICKQ = q.value;
      var needle = PICKQ.trim().toLowerCase();
      var any = false;
      document.querySelectorAll(".pickrow").forEach(function(r){
        var hit = !needle || r.dataset.name.indexOf(needle) > -1;
        r.hidden = !hit;
        if (hit) any = true;
      });
      /* A heading with nothing under it is a heading that lies about what the
         list contains. */
      document.querySelectorAll(".pickhead").forEach(function(h){
        var n = h.nextElementSibling, shown = false;
        while (n && n.classList.contains("pickrow")) {
          if (!n.hidden) shown = true;
          n = n.nextElementSibling;
        }
        h.hidden = !shown;
      });
      var empty = document.querySelector(".pickempty");
      if (empty) empty.hidden = any;
      var add = document.querySelector("[data-pick-new]");
      if (add) {
        add.hidden = !needle;
        add.textContent = '+ Add \u201c' + PICKQ.trim() + '\u201d';
      }
      var hint = document.querySelector(".pickhint");
      if (hint) hint.hidden = !!needle;
    });
    q.focus();
  }

  /* Arrangement. One button turns handles on everywhere the viewer is
     permitted; committing a drop re-renders and restores whatever was open. */
  function wireArrange(){
    document.querySelectorAll("[data-arrange]").forEach(function(b){
      b.addEventListener("click", function(){ ARRANGE = !ARRANGE; paint(); });
    });

    /* ── Reporting is a MODE now (§63.1) ─────────────────────────────
       Enter from Performance, leave with Cancel. Nothing is written by either:
       every figure was already saved as it was typed. */
    document.querySelectorAll("[data-report]").forEach(function(b){
      b.addEventListener("click", function(){
        REPORTING = this.dataset.report; paint(); window.scrollTo(0,0);
      });
    });
    document.querySelectorAll("[data-repcancel]").forEach(function(b){
      b.addEventListener("click", function(){ REPORTING = null; paint(); window.scrollTo(0,0); });
    });
    /* SAVE DRAFT, AND IT SAYS THE TRUE THING (§63.2). The word is written into
       the element rather than through a repaint: paint() would replace the
       button that was just pressed, and the reassurance would vanish in the
       same frame it appeared. */
    document.querySelectorAll("[data-repsave]").forEach(function(b){
      b.addEventListener("click", function(){
        var say = this.parentElement.querySelector("[data-savesay]");
        var show = function(text, cls){
          if (!say) return;
          say.textContent = text;
          say.className = "savesay " + (cls || "");
        };
        show("Saving…", "");
        if (typeof SYNC === "undefined" || !SYNC.saveNow) { show("Saved", "ok"); return; }
        SYNC.saveNow(function(state){
          if (state === "saved" || state === "clean") show("Saved", "ok");
          else if (state === "offline") show("Nothing to save — no server here", "");
          else if (state === "busy") show("Saving…", "");
          else show("Not saved — see the message above", "bad");
        });
      });
    });
    /* ── ADDING AND REMOVING A PLAN ROW (§69.13) ─────────────────────
       Both re-ask `mayEditPlan()` rather than trusting the render that drew
       the button (§48.2, §62): a repaint can happen between the two, and the
       pen is the SMO's alone (§31).

       Removing is by ID, never by index — the index is the thing that goes
       stale across a repaint, and splicing a stale one takes the wrong row.
       Adding APPENDS and mints an id of its own; nothing renumbers, because
       renumberUnit() rewrites every id from POSITION and every reported
       figure, focus mark and cycle snapshot is keyed on those (§48.1). */
    document.querySelectorAll("[data-rowadd]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!mayEditPlan()) return;
        var a = this.dataset.rowadd.split("|"), what = a[0];
        if (what === "pillar")  { addPillar(unitLike(a[1])); }
        else if (what === "measure" || what === "tactic") {
          var u = unitLike(a[1]), it = u && u.items[+a[2]];
          if (!it) return;
          if (what === "measure") addMeasure(it); else addTactic(it);
        }
        else if (what === "project") {
          var c = capById(a[1]);
          if (!c) return;
          var np = addProject(c);
          /* Select what was just made, or the new project is added to a rail
             that goes on showing the old one and nothing says it worked. */
          if (np) RAIL[railKeyFor(c)] = np.id;
        }
        else {
          var pr = projById(a[1]);
          if (!pr) return;
          if (what === "deliverable") addDeliverable(pr);
          else if (what === "outcome") addOutcome(pr);
          else if (what === "milestone") addMilestone(pr);
        }
        paint();
      });
    });
    document.querySelectorAll("[data-rowoff]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!mayEditPlan()) return;
        var a = this.dataset.rowoff.split("|"), list = a[0], id = a[1];
        removeRowById(listById(list, id), id);
        paint();
      });
    });

    document.querySelectorAll(".sortable").forEach(function(c){
      var kind = c.dataset.kind;
      /* THE CONTAINER SAYS WHAT IT HOLDS (§63.5). This used to pick the
         selector from `data-kind`, and "pillars" meant `.prow-wrap` — which
         does not exist inside a rail, so the rail's grips were bound to
         nothing and dragging a pillar did nothing at all, on every unit, for
         as long as the rail has had handles. Measured: 4 grips, 0 bound. */
      var sel = c.dataset.item || "tr";
      makeSortable(c, sel, function(order){
        var open = [];
        document.querySelectorAll('.prow[aria-expanded="true"]').forEach(function(r){ open.push(+r.dataset.p); });

        /* unitLike(), not UNITS[...] — a function that plans in pillars is
           drawn by these same pages and its key carries the "fn:" prefix
           (§59). Read off the CONTAINER rather than off `current`, so a
           container can never be committed against a different subject than
           the one it was rendered for. */
        var subj = unitLike(c.dataset.u || current);
        if (kind === "pillars") applyOrder(subj.items, order);
        else if (kind === "units") applyOrder(UNIT_KEYS, order);
        else if (kind === "caps") applyOrder(GROUP.capabilities, order);
        else if (kind === "themes") applyOrder(GROUP.themes, order); else {
          /* The plan states the pillar outright; the Performance accordion
             still answers by walking up to the row above it. */
          var pi;
          if (c.dataset.pi != null) pi = +c.dataset.pi;
          else {
            var body = c.closest(".pbody");
            pi = +body.previousElementSibling.dataset.p;
          }
          var it = subj.items[pi];
          applyOrder(kind === "measures" ? it.measures : it.tactics, order);
        }

        paint();
        open.forEach(function(i){
          var r = document.querySelector('.prow[data-p="' + i + '"]');
          if (r) { r.setAttribute("aria-expanded","true"); r.nextElementSibling.hidden = false; }
        });
      });
    });
  }

  /* Import. Downloading is attempted as a file and always offered as text,
     because a sandboxed frame may refuse the download and leaving the SMO with
     nothing would be worse than a copy box. */
  function csvFor(){
    if (impIsCap()) {
      var c = impCap();
      return IMP.kind === "plan" ? capPlanTemplate(c) : capProgressTemplate(c);
    }
    var u = impUnit();
    return IMP.kind === "plan" ? planTemplate(u) : progressTemplate(u);
  }
  /* A subject's name, made safe to put in a filename. Extracted from
     fileName() below, which was the only caller until the filled example
     needed the same thing — two copies of "how do we spell this in a
     filename" is two answers waiting to differ. */
  function safeFileBit(name){
    return String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "plan";
  }
  function fileName(){
    var name = impIsCap() ? impCap().name : impUnit().name;
    return safeFileBit(name) + "-" + IMP.kind + "-template.csv";
  }
  /* A plan file is READ into a summary, not diffed: it authors the plan, so
     what matters is what it holds and what that displaces (§22). Reporting is
     still a difference against what is recorded. */
  function readPlanRows(rows, label){
    IMP.read = label;
    if (impIsCap()) {
      var c = impCap();
      IMP.check = validateCapPlan(c, rows);
      IMP.summary = capReplaceSummary(c, rows);
    } else {
      var u = impUnit();
      IMP.check = validatePlan(u, rows);
      IMP.summary = planReplaceSummary(u, rows);
    }
    IMP.diff = null;
    paint();
  }
  function impFail(msg){
    IMP.check = { problems:[{ at:"the whole file", msg:msg }], notices:[] };
    IMP.summary = null; IMP.diff = null; IMP.read = "";
    paint();
  }

  function loadCSV(text){
    IMP.done = null;
    IMP.text = text;
    /* A plan arrives as a workbook, because a workbook has a Read me sheet and
       a plan file has to say which unit it is for. A flat CSV cannot say it,
       and guessing would write one unit's plan into another \u2014 the worst
       accident this flow can have. Reporting still takes a CSV: it is per unit
       and the unit is chosen on screen. */
    if (IMP.kind === "plan") {
      impFail("a plan has to arrive as the .xlsx template \u2014 its Read me sheet is what says " +
              "which unit the plan is for. Download the plan template above and fill that.");
      return;
    }
    var rows = parseCSV(text);
    if (impIsCap()) {
      var c = impCap();
      var cShape = checkCapFileShape(c, rows, "progress");
      IMP.check = cShape.length ? { problems: cShape, notices: [] } : null;
      IMP.diff = diffCapProgress(c, rows);
      IMP.summary = null;
      paint();
      return;
    }
    var u = impUnit();
    var shape = checkFileShape(u, rows, "progress");
    IMP.check = shape.length ? { problems: shape, notices: [] } : null;
    IMP.diff = diffProgress(u, rows);
    IMP.summary = null;
    paint();
  }

  /* Lifted out of wireImport() 2026-08-23 (§54.3): the People page sends a
     workbook too, and two copies of "build it, wrap it in a blob, click a
     link, revoke the URL" is the second one that gets the revoke wrong. */
  /* §47.2: the action fires BEFORE the menu closes. A `<details>` closed from
     inside its own click has not unmounted the button the click is still in —
     it hides it — so this is safe where removing the node would not be. */
  function closeDlMenu(el){
    var d = el.closest("details.dlmenu");
    if (d) d.open = false;
  }

  function sendXlsx(sheets, name){
    var bytes = buildXlsx(sheets);
    var blob = new Blob([bytes], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  function wireImport(){
    var us = document.getElementById("imp-unit");
    if (us) us.addEventListener("change", function(){ IMP.unit = us.value; IMP.diff = null; paint(); });

    document.querySelectorAll("[data-impkind]").forEach(function(b){
      b.addEventListener("click", function(){ IMP.kind = b.dataset.impkind; IMP.diff = null; paint(); });
    });

    /* THE PLAN TEMPLATE IS GENERIC, IN BOTH FORMATS (§22, §61): built against
       an empty shape rather than a chosen subject's content, with the subject
       named on the Read me sheet. Two files, one menu. */
    document.querySelectorAll("[data-dlplan]").forEach(function(b){
      b.addEventListener("click", function(){
        closeDlMenu(this);
        if (this.dataset.dlplan === "projects")
          sendXlsx(capPlanWorkbook(blankCapShape()), "SMP - projects plan template.xlsx");
        else
          sendXlsx(planWorkbook(blankUnitShape()), "SMP - pillars plan template.xlsx");
      });
    });

    /* A PROGRESS FILE IS NOT GENERIC — it is one subject's current rows, so
       the subject travels with the format. Choosing a format the selected
       subject does not keep moves the selection to the first that does AND
       repaints, so the select shows exactly what was downloaded rather than
       leaving a file arriving from a list that says something else. */
    document.querySelectorAll("[data-dlprog]").forEach(function(b){
      b.addEventListener("click", function(){
        closeDlMenu(this);
        var want = this.dataset.dlprog;
        if (impFmtOf(IMP.unit) !== want) {
          var first = impSubjects(want)[0];
          if (!first) {
            alert(want === "projects"
              ? "There are no capabilities yet, so there is no projects file to download."
              : "There are no business units yet, so there is no pillars file to download.");
            return;
          }
          IMP.unit = first.v; IMP.diff = null; IMP.summary = null; IMP.read = "";
        }
        var sheets = impIsCap() ? capProgressWorkbook(impCap()) : progressWorkbook(impUnit());
        sendXlsx(sheets, fileName().replace(/\.csv$/, ".xlsx"));
        paint();
      });
    });

    /* ── THE FILLED EXAMPLE (§69.12) ─────────────────────────────────
       The FORMAT IS READ OFF THE SUBJECT, here as everywhere (§61): the
       select's value is a unit key, `fn:<key>` or `cap:<id>`, and that is
       already the whole answer. Nothing stores which workbook to build.

       The selection is read off the control at the moment of pressing rather
       than tracked on `change`, because nothing here repaints — the only
       reason IMP.filled exists at all is so a repaint caused by something ELSE
       on this page does not throw the choice away (§35). */
    var fsel = document.getElementById("imp-filled");
    if (fsel) fsel.addEventListener("change", function(){ IMP.filled = fsel.value; });
    document.querySelectorAll("[data-dlfilled]").forEach(function(b){
      b.addEventListener("click", function(){
        var sel = document.getElementById("imp-filled");
        var v = sel ? sel.value : IMP.filled;
        if (!v) return;
        IMP.filled = v;
        if (v.indexOf("cap:") === 0) {
          var c = capById(v.slice(4));
          if (!c) return;
          sendXlsx(capPlanWorkbook(c),
            "SMP - projects plan - " + safeFileBit(c.name) + ".xlsx");
          return;
        }
        /* unitLike(), not UNITS[...] — a function that plans in pillars is one
           of these and its key carries the "fn:" prefix (§59). */
        var u = unitLike(v);
        if (!u) return;
        sendXlsx(planWorkbook(u), "SMP - pillars plan - " + safeFileBit(u.name) + ".xlsx");
      });
    });

    var dl = document.querySelector("[data-dl]");
    if (dl) dl.addEventListener("click", function(){
      var blob = new Blob([csvFor()], { type:"text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fileName();
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
    });

    var show = document.querySelector("[data-showcsv]");
    if (show) show.addEventListener("click", function(){
      openModalHtml(esc(fileName()), "Select all and copy, if the download is blocked",
        '<textarea class="csvbox" readonly>' + csvFor().replace(/</g, "&lt;") + '</textarea>');
    });

    var f = document.getElementById("imp-file");
    if (f) f.addEventListener("change", function(){
      if (grant("c_import") !== "edit") return;
      var file = f.files && f.files[0]; if (!file) return;
      if (/\.xlsx$/i.test(file.name)) {
        var rx = new FileReader();
        rx.onload = function(){
          readXlsx(rx.result).then(function(sheets){
            /* The template is generic, so the file itself says whose plan it
               is: one cell on the Read me sheet. Nothing else in the workbook
               names a unit, and with the codes gone nothing else could. */
            if (IMP.kind === "plan") {
              var picked = readmePick(sheets);
              if (!picked) {
                impFail(impIsCap()
                  ? "no capability chosen. Open the Read me sheet and pick one from the dropdown in B2 \u2014 the platform cannot tell whose plan this is."
                  : "no business unit chosen. Open the Read me sheet and pick one from the dropdown in B2 \u2014 the platform cannot tell whose plan this is.");
                return;
              }
              var uk = UNIT_KEYS.filter(function(k){ return UNITS[k].name === picked; })[0];
              /* A FUNCTION THAT PLANS IN PILLARS IS A PLAN SUBJECT (§61). Its
                 plan lives on the function, so the pillars template offers it
                 on the Read me sheet beside the units — and the upload has to
                 be able to resolve the name it just offered. */
              var fk = uk ? null : FUNCTION_KEYS.filter(function(k){
                var f = FUNCTIONS[k];
                return f.active !== false && fnPlansInPillars(f) && f.name === picked;
              })[0];
              /* ONE NAMING IN THE FILE (§51.19). Islam: "I don't think we
                 should have the capability file with 2 namings capability and
                 function. we can just upload with the capability and we
                 connect the function on the platform … to avoid the confusion
                 between the 2 templates."

                 §51.2 put a Supporting function row in the workbook so two
                 functions with a similarly named capability could be told
                 apart. It solved that and made a worse problem: the file then
                 carried TWO names that had to AGREE, and a workbook whose
                 halves disagreed was refused — "no capability called Customer
                 Centric under Customer Experience" — for a link the PLATFORM
                 owns and can see. Which function carries a capability is a
                 Setup decision, made on the Capabilities page (§51.11).

                 THE AMBIGUITY IS ANSWERED HERE INSTEAD, and better: two
                 capabilities sharing a name are refused BY NAME, naming both
                 functions, rather than resolved by whichever came first in the
                 array. That was the silent wrong-plan §51.2 feared, and it is
                 now caught at the one moment somebody can still act on it. */
              var caps = GROUP.capabilities.filter(function(x){ return x.name === picked; });
              var cp = caps[0];
              if (!uk && !fk && caps.length > 1) {
                impFail('two capabilities are called "' + esc(picked) + '" \u2014 under ' +
                  caps.map(function(x){
                    var f = FUNCTIONS[x.fn];
                    return f ? esc(f.name) : "no function";
                  }).join(" and ") + '. Rename one on Setup \u2192 Capabilities, then upload again.');
                return;
              }
              if (!uk && !fk && !cp) {
                impFail('no business unit, supporting function or capability called "' +
                  esc(picked) +
                  '". Open the Read me sheet and choose one from the dropdown in B2.');
                return;
              }
              IMP.unit = uk ? uk : fk ? "fn:" + fk : "cap:" + cp.id;
              if (!uk && !fk && cp) {
                var cRows = capPlanFromWorkbook(cp, sheets);
                readPlanRows(cRows, cp.name + " \u00b7 " + cRows.length + " rows");
              } else {
                var pu = impUnit();
                var pRows = planFromWorkbook(pu, sheets);
                readPlanRows(pRows, pu.name + " \u00b7 " + pRows.length + " rows");
              }
              return;
            }
            if (impIsCap()) {
              var c = impCap();
              var cpRows = capProgressFromWorkbook(c, sheets);
              var cShape = checkCapFileShape(c, cpRows, "progress");
              IMP.check = cShape.length ? { problems: cShape, notices: [] } : null;
              IMP.diff = diffCapProgress(c, cpRows);
              IMP.summary = null;
              paint();
              return;
            }
            var u = impUnit();
            var rows = progressFromWorkbook(u, sheets);
            var shape = checkFileShape(u, rows, "progress");
            IMP.check = shape.length ? { problems: shape, notices: [] } : null;
            IMP.diff = diffProgress(u, rows);
            IMP.summary = null;
            paint();
          }).catch(function(e){
            IMP.check = { problems:[{ at:file.name, msg:"could not be read as a workbook \u2014 " + e.message }], notices:[] };
            IMP.diff = null; IMP.summary = null; IMP.read = "";
            paint();
          });
        };
        rx.readAsArrayBuffer(file);
        return;
      }
      var rd = new FileReader();
      rd.onload = function(){ loadCSV(String(rd.result)); };
      rd.readAsText(file);
    });

    var paste = document.querySelector("[data-paste]");
    if (paste) paste.addEventListener("click", function(){
      openModalHtml("Paste the filled file", "",
        '<textarea class="csvbox" id="pastebox" placeholder="Paste the CSV here"></textarea>' +
        '<div class="imp-row" style="margin-top:12px"><button class="editbtn" id="pasteok">Read it</button></div>');
      document.getElementById("pasteok").addEventListener("click", function(){
        var t = document.getElementById("pastebox").value;
        closeModal();
        if (t.trim()) loadCSV(t);
      });
    });

    var ap = document.querySelector("[data-apply]");
    if (ap) ap.addEventListener("click", function(){
      /* THE LAST GATE, and the one that actually protects the data: applying a
         plan archives and replaces a whole unit's plan in memory before any
         save is attempted. Checked here rather than trusted from the page that
         drew the button (§48.2). */
      if (grant("c_import") !== "edit") {
        alert("Importing is the SMO's. Nothing has been applied.");
        return;
      }
      var what, arch;
      if (IMP.kind === "plan") {
        var sm = IMP.summary, inc = sm.incoming;
        if (impIsCap()) {
          var cc = impCap();
          arch = applyCapPlanReplace(cc, sm.rows);
          what = plural(inc.projects, "project") + ", " +
                 plural(inc.objectives, "objective") + " written.";
          IMP.done = { unit:cc.name, key:cc.id, fn:cc.fn, what:what, archived:arch };
        } else {
          /* WRITABLE, not the reading view — a plan applied to fnAsUnit()'s
             throwaway object is reported as written and is not (§61). */
          var uu = unitLikeWritable(IMP.unit);
          arch = applyPlanReplace(uu, sm.rows);
          var wfk = fnKeyOfTarget(IMP.unit);
          if (wfk) fnWriteBack(wfk, uu);
          /* The tenant's own word for a pillar, which the label registry holds
             in the plural because that is how it is used in headings. */
          what = plural(inc.pillars, L("pillar", "bu").toLowerCase().replace(/s$/, "")) + ", " +
                 plural(inc.measures, "measure") + ", " +
                 plural(inc.tactics, "tactic") + " written.";
          IMP.done = { unit:uu.name, key:uu.ukey, what:what, archived:arch };
        }
      } else {
        var ch = IMP.diff.rows.filter(function(r){ return r.status === "changed"; }).length;
        what = ch + " figure" + (ch === 1 ? "" : "s") + " updated.";
        if (impIsCap()) {
          var c = impCap();
          applyCapProgress(c, IMP.diff);
          IMP.done = { unit:c.name, key:c.id, fn:c.fn, what:what };
        } else {
          var u = impUnit();
          applyProgress(u, IMP.diff);
          IMP.done = { unit:u.name, key:u.ukey, what:what };
        }
      }
      IMP.diff = null; IMP.summary = null; IMP.text = ""; IMP.check = null; IMP.read = "";
      paint();
    });

    /* Archived plans: restore one, or forget it for good. Forgetting asks,
       because it is the only act in the import flow that actually destroys
       something. */
    document.querySelectorAll("[data-restore]").forEach(function(b){
      b.addEventListener("click", function(){
        if (restoreArchive(b.dataset.restore)) paint();
      });
    });
    document.querySelectorAll("[data-forget]").forEach(function(b){
      b.addEventListener("click", function(){
        var a = ARCHIVES.filter(function(x){ return x.id === b.dataset.forget; })[0];
        if (!a) return;
        if (!confirm("Delete " + a.name + "'s archive of " + a.at +
                     " for good? This is the one thing here that cannot be undone.")) return;
        forgetArchive(a.id);
        paint();
      });
    });
    /* The receipt's way back for a capability: its function's pages. */
    document.querySelectorAll("[data-gofn]").forEach(function(b){
      b.addEventListener("click", function(){
        IMP.done = null;
        current = b.dataset.gofn; currentSub = null;
        paint(); window.scrollTo(0,0);
      });
    });
    document.querySelectorAll("[data-gounit]").forEach(function(b){
      b.addEventListener("click", function(){
        IMP.done = null;
        var target = document.querySelector('#units button[data-u="' + b.dataset.gounit + '"]');
        if (target) target.click();
      });
    });
    var cx = document.querySelector("[data-cancel]");
    if (cx) cx.addEventListener("click", function(){ IMP.diff = null; paint(); });
  }

  wireDeck();
  wireSlides();

  var overlay = document.getElementById("overlay");
  /* ══ THE MODAL IS ACTUALLY MODAL NOW (§48.4) ══════════════════════
     Three faults, one shape: the dialog announced itself as `aria-modal` and
     then behaved like a panel. One Tab left it and landed in the page behind,
     which was neither `inert` nor `aria-hidden`; Escape closed it but dropped
     focus to <body> rather than back to the control that opened it; and while
     CLOSED it stayed in the tab order and in the accessibility tree, so every
     screen in the product carried a stray "Close" button and a permanently
     announced empty dialog.

     That last one is §3.2's own lesson arriving in a different tree: opacity:0
     hides a box, it does not remove it. `inert` on the page behind is what the
     platform already needed and what the deck needs too.

     The pattern is not invented here — searchsel.js already does exactly this
     for its popup: open, move focus in; close, put focus back where it was. */
  var modalReturn = null;
  var wrapEl = document.querySelector(".wrap");
  /* ONE WAY IN, for the same reason §48.4 gave: the inert page behind, the
     remembered focus and the announced dialog are what MAKE it a modal, and a
     caller that sets `.on` by hand gets a dialog that only looks like one.
     There were two such callers — the CSV box and the paste box — and they had
     both been left behind when the dialog was fixed. */
  function openModalHtml(title, sub, body){
    modalReturn = document.activeElement;
    document.getElementById("modal-t").innerHTML = title || "";
    document.getElementById("modal-s").innerHTML = sub || "";
    document.getElementById("modal-b").innerHTML = body || "";
    overlay.classList.add("on");
    overlay.removeAttribute("aria-hidden");
    if (wrapEl) { wrapEl.inert = true; wrapEl.setAttribute("aria-hidden", "true"); }
    document.getElementById("modal-x").focus();
  }
  function openModal(id){
    var m = MODALS[id]; if (!m) return;
    openModalHtml(m.title, m.sub || "", m.body);
  }
  function closeModal(){
    if (!overlay.classList.contains("on")) return;
    overlay.classList.remove("on");
    overlay.setAttribute("aria-hidden", "true");
    if (wrapEl) { wrapEl.inert = false; wrapEl.removeAttribute("aria-hidden"); }
    /* Back to the control that opened it — the one thing a keyboard user
       cannot do for themselves, because the thing they pressed is behind a
       dialog they have just dismissed. */
    if (modalReturn && document.contains(modalReturn)) modalReturn.focus();
    modalReturn = null;
  }
  overlay.setAttribute("aria-hidden", "true");   /* closed at boot */
  document.getElementById("modal-x").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });

  /* A menu that stays open after you have looked away is a menu you have to
     dismiss. Bound once, at boot, rather than on every repaint. */
  document.addEventListener("click", function(e){
    /* A row's action menu closes the same way — but only on a click OUTSIDE
       it, or choosing an item would close the menu before the item's own
       handler ran. That is §30.1 from the other side: this listener rewrites
       the DOM, so it must not fire in the middle of an interaction with it. */
    if (typeof PMENU !== "undefined" && PMENU !== null &&
        !(e.target.closest && e.target.closest(".kmenu, [data-pmenu]"))) {
      PMENU = null; paint();
    }
    /* The header menus close the same way, and on a click anywhere that is not
       inside them. `.hmenu` covers both the button and its panel. */
    if (typeof PCOLMENU !== "undefined" && (PCOLMENU || PWMENU) &&
        !(e.target.closest && e.target.closest(".hmenu"))) {
      PCOLMENU = false; PWMENU = false; paint();
    }
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (typeof PMENU !== "undefined" && PMENU !== null) { PMENU = null; paint(); }
    if (typeof PCOLMENU !== "undefined" && (PCOLMENU || PWMENU)) {
      PCOLMENU = false; PWMENU = false; paint();
    }
  });

  /* The switcher lists the people the platform actually has. It was filled
     once, at load, from the baked-in example \u2014 so on the deployed product it
     went on offering all 29 of them after hydration had replaced them with the
     tenant's own, and picking someone who had gone threw on the next repaint.
     It is refilled whenever the list itself changes, which is cheap because
     the signature says when nothing has. */
  var sel = document.getElementById("asWho");
  var viewerSig = null;
  function fillViewers(){
    var sig = PEOPLE.map(function(p){ return p.key; }).join(",");
    if (sig !== viewerSig) {
      viewerSig = sig;
      sel.innerHTML = PEOPLE.map(function(p){
        return '<option value="' + p.key + '">' + p.name + " \u2014 " + p.title + '</option>';
      }).join("");
    }
    viewer();               /* corrects VIEWER if the person selected has gone */
    sel.value = VIEWER;
  }
  fillViewers();
  sel.addEventListener("change", function(){
    VIEWER = sel.value; current = null; currentSub = null; paint(); window.scrollTo(0,0);
  });

  /* The three nav rows sit in one sticky container, so nothing has to be
     measured and no offset has to be kept in sync. The header still condenses,
     but on hysteresis — condense at 70, expand at 20 — because a single
     threshold oscillates: shrinking the header pulls content up, which can
     drop the page back under the threshold and re-expand it. */
  /* The sticky pillar header pins beneath the chrome, so it needs the chrome's
     height. That height changes for three separate reasons — the header
     condenses, the window resizes, and the tab row is repopulated on every
     paint — so it is observed rather than measured at chosen moments. This is
     what the old code got wrong: it measured on every scroll frame, mid
     transition, and fed the result straight back into the layout. */
  var chromeEl = document.querySelector(".chrome");
  new ResizeObserver(function(){
    document.documentElement.style.setProperty("--chrome-h", chromeEl.offsetHeight + "px");
  }).observe(chromeEl);

  /* NO CONDENSE-ON-SCROLL. The chrome is one height, always.

     This was the last thing in the product that changed size while you
     scrolled, and it is what Islam had been reporting as the scroll-up glitch
     for four versions. Two separate causes had already been found and fixed
     underneath it (a chrome with no background in 2.7, a rail capped against
     its own measured height in 2.8) and the symptom kept coming back, because
     the mechanism was still there.

     What it actually did, measured: at scroll position 25 the chrome settled
     at 190px if you had arrived scrolling DOWN, and 168px if you had arrived
     scrolling UP - and stayed there. Not a transition mid-flight; the settled
     state genuinely depended on the direction you came from. That is the
     hysteresis (condense past 70, expand below 20) working exactly as
     designed - it is what stopped the header chattering at the threshold - but
     the consequence is that scrolling back up holds the header condensed and
     then drops 22px of chrome into the page in one step, moving everything
     below it. That step, plus the .18s ease it animated with, is the "hazy and
     damaged" of the original report.

     It bought 22px. The header is 47px now (§27) - it was 108px when the
     condense was written, and reclaiming a fifth of a tall header was worth
     something. Reclaiming 22px from a 47px one is not worth a chrome whose
     height depends on which way you were scrolling.

     The ResizeObserver that publishes --chrome-h stays. The rail's sticky
     offset still reads it; it simply reports a constant now, which is the
     easiest possible thing for it to be right about. */


  /* Pillar rows: accordion, plus pulling the opened row under the chrome so a
     collapsing row above cannot move the page out from under the cursor. */
  function wirePillars(){
    /* The control shows what pressing it will do, and follows the rows: opening
       the last panel by hand flips it to fold. */
    function syncFold(){
      var rows = document.querySelectorAll(".prow");
      var btn = document.querySelector("[data-allrows]");
      if (!btn || !rows.length) return;
      var allOpen = document.querySelectorAll('.prow[aria-expanded="true"]').length === rows.length;
      btn.innerHTML = allOpen ? ICON_FOLD : ICON_UNFOLD;
      btn.title = allOpen ? "Collapse all" : "Expand all";
    }
    syncFold();
    var foldBtn = document.querySelector("[data-allrows]");
    if (foldBtn) foldBtn.addEventListener("click", function(){
      var rows = document.querySelectorAll(".prow");
      var allOpen = document.querySelectorAll('.prow[aria-expanded="true"]').length === rows.length;
      rows.forEach(function(r){
        r.setAttribute("aria-expanded", String(!allOpen));
        r.nextElementSibling.hidden = allOpen;
      });
      syncFold();
    });

    document.querySelectorAll(".prow").forEach(function(b){
      b.addEventListener("click", function(){
        /* Panels open and close independently. Nothing else closes.

           This is the third attempt and the only one that works, so the reasoning
           is worth keeping. First the opened row was scrolled to the top, which
           threw the page ~350px on every click. Then the row was anchored so it
           could not move \u2014 and it did not, to the pixel \u2014 but holding it still
           while a panel ABOVE it collapsed meant scrolling the window 785px, so
           everything else on screen changed and it read as a worse jump than
           before. The row was the wrong thing to hold.

           An accordion was chosen to stop the list becoming unreadable when
           several pillars are open. That is a smaller cost than a page that
           lurches on every click. Opening a panel now only ever adds height
           BELOW the row, and closing one only removes height below it, so
           nothing above the click ever moves and no correction is needed. */
        var open = b.getAttribute("aria-expanded") === "true";
        b.setAttribute("aria-expanded", String(!open));
        b.nextElementSibling.hidden = open;
        syncFold();
      });
    });
  }

  /* Paint immediately from the baked data, then hydrate from the database
     where one is reachable and repaint. On file:// this is just paint(). */
  /* The colours are already applied - THEME.apply() ran in the head. This
     only hangs the control on the chrome, which has to exist first. */
  THEME.wire();
  /* Before the first paint, so the tenant's own colours are on screen from the
     start rather than arriving a frame later. SYNC.boot repaints after
     hydration and applyBrand runs again there, because the branding that
     matters is the one in the DATABASE, not the one baked into the file. */
  applyBrand();
  SYNC.boot(function(){ applyBrand(); paint(); });
</script>
