<!-- A REFUSED SAVE HAS TO SAY SO, WHERE THE SAVE IS (spec 006 §4, and the
     rule §32 set for the Labels page). The server now decides who may change
     what; without this the failure mode is silent - a change is made, the
     server refuses it, and the platform goes on showing it as though it had
     landed. Hidden until there is something to say. -->

<div class="chrome">
<!-- Three things on the first line and nothing else: who the product is, who
     you are looking as, and the two buttons that leave. The org name, the unit
     name and the "Group, N units" tag all left in 2.9 - the row below already
     says where you are, and repeating it cost the whole first line. -->
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Strategy Management Platform</h1>
      <!-- Whose strategy this is. The product name alone never said it, and a
           consulting product shown to a client should. Set in paint() from
           GROUP.org, so it follows the demo switch: the worked example says
           Raya Trade, the client's own tenant says the client. textContent,
           never innerHTML - the org name is typed in Labels. -->
      <span class="orgname" id="orgname"></span>
    </div>
    <div class="viewer">
      <label for="asWho">Viewing as</label>
      <select id="asWho"></select>
      <span class="viewer-note" id="viewerNote"></span>
    </div>
    <!-- Far right, together: Demo data, then Sign out (appended by SYNC).
         Switches the whole product between the client's own data and the
         full worked example, for explaining how it works. Appears only
         where there is a live dataset to tell the example apart from. -->
    <div class="topacts" id="topacts">
      <!-- Light and Dark. First of the three because it changes how the
           product LOOKS; the two beside it change what it shows or end the
           session. Hidden until THEME.wire() draws its mark. -->
      <button class="infobtn themebtn" id="themebtn" type="button" hidden></button>
      <!-- The palette switch was here until 3.12. It is gone at Islam's
           direction: "I don't need to have slate, the branding covers this
           from inside." Which colours the product wears is the TENANT's
           decision, set once on Setup › Branding, not a per-screen preference
           that leaves two people looking at different products. Light and dark
           stay each viewer's own — those are about the room they sit in. -->
      <!-- The typeface, while the four are being compared (§38.8). It renders
           its own name in the face it names, so you can see one without
           pressing it. It goes when the choice is settled. -->
      <button class="infobtn fontbtn" id="fontbtn" type="button" hidden></button>
      <!-- TWO DEMOS, SO A MENU (§67). "Filled Project" is the full worked
           example; "Clear Project" is the same organisation with nothing
           filled in, for explaining the cycle from the beginning. A <details>
           for the same reason every other menu here is one: the action fires
           before the menu closes, and closing a <details> from inside its own
           click hides the button rather than unmounting it (§47.2).
           Both hidden until SYNC finds a live dataset to tell them apart
           from — opened as a file the whole product IS the example. -->
      <details class="dlmenu right demomenu" id="demomenu" hidden>
        <summary class="infobtn">Demo data<span class="dlcar" aria-hidden="true">&#9662;</span></summary>
        <div class="menu" role="menu">
          <button role="menuitem" data-demomode="demo">Filled project<span class="dlsub">The full worked example, every page populated</span></button>
          <button role="menuitem" data-demomode="demoClear">Clear project<span class="dlsub">The same organisation with nothing filled in yet</span></button>
        </div>
      </details>
      <button class="infobtn" id="demobtn" hidden>Exit demo</button>
    </div>
  </div>
</header>

<script>
/* Two drawn glyphs used to sit at the right of the row — a gear for Setup and
   a stacked list for Manage. They were replaced in 2.9 by one worded button
   with a menu: the same ten destinations, but named rather than guessed at. */

  /* Page definitions carry the access key the matrix is keyed on, so a page
     is never rendered without a grant having been checked first. */
  var SUBS = {
    /* A supporting function is the destination; the capabilities it carries are
       named inside its pages. */
    /* Two tabs, not five. The top row asks one question \u2014 how is it going, or
       what did we agree \u2014 and everything else is a section inside one of the
       two. Reporting is not a page you visit: it is what a cycle asks of you
       for two weeks a quarter, so it appears inside Performance and leaves
       again. See \u00a715.10. */
    /* STRATEGY FIRST, THEN PERFORMANCE (Islam, 2026-08-24). §28's argument
       stands and this is the row catching up with it: what was agreed is what
       people come to read, and the score is a consequence of it — which is
       already why a unit and a function both OPEN on their plan. The row said
       the opposite, left to right.

       `primary` stays on Performance and keeps its own job, which is not
       order: it names the page a destination lands on when nothing else has
       been chosen, and §28 answers that separately (see the landing rules
       below). Order is the array. */
    fn: [
      { k:"fnstrat", ac:"k_found", label:"Strategy", sections: function(k){
          /* PLAN, not Projects, when the function plans in pillars — the tab
             has to say what is behind it (spec 010). */
          /* OVERVIEW, NOT FOUNDATION (Islam, 2026-08-24): "the word foundation
             is confusing, the capability doesn't have a foundation it's called
             Overview" — and, asked about the other kind: "the function that
             plans in pillars has overview as well. the foundation is only for
             business units."

             Which the page had already been saying in prose for versions: a
             capability has no clauses, no aspiration and no SWOT, and its
             foundation IS the group's (§15.1). A tab called Foundation over a
             page whose first sentence is "there is no foundation here" is the
             label arguing with the content. FOUNDATION IS A BUSINESS UNIT'S
             WORD; a function gets Overview whichever way it plans, because the
             two formats are the same product (§53.5) and a label that changed
             with the format would be a third thing to keep in step.

             The KEY stays `found` and the access key stays `k_found`: renaming
             either would lose every stored preference and every grant pointing
             at it, for a word (§65, the same rule as `bu`). */
          return [{ k:"found", ac:"k_found", label:"Overview", render:renderFnFoundation },
                  { k:"proj",  ac:"k_proj",
                    label:fnPlansInPillars(FUNCTIONS[fnKeyOf(k)]) ? "Plan" : "Projects",
                    render:renderFnProjects }];
        } },
      { k:"fnperf", ac:"k_perf", label:"Performance", primary:true, dot:true,
        render: function(k){
          return REPORTING === k ? renderFnReport(k) : renderFnPerformance(k);
        } }
    ],
    /* A COMPANY HAS ONE TAB, AND THAT IS THE POINT (§68). It carries no
       strategy of its own — no plan, no foundation, no objectives (§23) — so a
       tab row of one would be a row saying nothing. What it has is a reading
       of the units it holds, gated on the GROUP's Performance key at the
       company's target: `companyAllows()` then answers correctly for all
       three cases, because §23's two flags are already the thing that decides
       whether a company CEO sees the group and the other companies. */
    co: [
      { k:"performance", ac:"g_perf", label:"Performance", primary:true,
        render:renderCompanyPerformance }
    ],
    group: [
      { k:"performance", ac:"g_perf",   label:"Performance", primary:true, render:renderGroupPerformance },
      { k:"foundation",  ac:"g_found",  label:"Foundation",                render:renderGroupFoundation },
      { k:"focus",       ac:"g_focus",  label:"Focus",                     render:renderFocusBoard },
      { k:"temple",      ac:"g_temple", label:"Temple",                    render:renderTemple },
      { k:"weighting",   ac:"g_weight", label:"Weighting",                 render:renderWeighting }
    ],
    unit: [
      { k:"strategy", ac:"u_found", label:"Strategy", sections: function(u){
          /* Spec 008 §3B. A SECTION of Strategy, not a Setup page: a
             custodian holds no Setup at all, so a Setup page would be
             unreachable by the only person it is for. `when` hides it outright
             until the tenant switches naming on \u2014 a tab that opens a page
             nobody may use is worse than no tab. */
          return [{ k:"found", ac:"u_found", label:"Foundation", render:renderUnitFoundation },
                  { k:"swot",  ac:"u_anal",  label:"SWOT",       render:renderUnitAnalysis },
                  { k:"plan",  ac:"u_plan",  label:"Plan",       render:renderUnitPlan },
                  { k:"who",   ac:"u_src",   label:"Who enters", when:namingOn,
                    render:renderUnitNaming }];
        } },
      /* PERFORMANCE IS A RESULT OF REPORTING (§63), so it is one page and not
         two sibling sections repeating the tab's own word. Reporting is a MODE
         you enter from it with the Report button and leave again with Cancel —
         which is what it always was for two weeks a quarter (§15.10), now said
         in the navigation instead of in a comment. REPORTING holds the TARGET
         rather than a boolean, so it can never open somebody else's report. */
      { k:"performance", ac:"u_perf", label:"Performance", primary:true, dot:true,
        render: function(u){
          return REPORTING === u.ukey ? renderReport(u) : renderUnitPerformance(u);
        } }
    ],
    /* Setup is what EXISTS: decided once, revisited rarely.

       GROUPED, AND BY THE QUESTION YOU CAME TO ANSWER (Islam, 2026-08-22,
       §46). Ten pages in one flat row is a row you read end to end every
       time; grouping them by which TABLE they edit would have produced the
       same row with headings on it. `grp` is the group's key and SETUP_GROUPS
       below is the order — one list, so a page cannot be in two groups and
       cannot be in none. */
    setup: [
      /* The register (§35). First now, because "who" is the first question
         anybody opens Setup to answer. It used to be a section at the bottom
         of Roles & access, which is a matrix page — a staff list is not a
         matrix. */
      { k:"people", ac:"c_people", grp:"who", label:"People register", primary:true, render:renderPeople },
      /* The client's own names for parts of the business, and what each one
         opens here (§54.1). In *Who* rather than *What we run*, and sharing
         c_people rather than taking a key of its own: it is not another thing
         being planned, it is the vocabulary the register's own data arrives
         in, and Companies already shares c_units on exactly this argument. */
      { k:"mainbu", ac:"c_people", grp:"who", label:"Official BU list",      render:renderMainbus },
      { k:"access", ac:"c_access", grp:"who", label:"Roles & access",        render:renderAccess },

      { k:"units",  ac:"c_units",  grp:"run", label:"Business units",        render:renderUnits },
      /* Its own tab since 3.5. It shares c_units - the same person manages
         both - but it answers a different question from "which units exist",
         and it was being pushed off the top of a ten-row table. */
      { k:"companies", ac:"c_units", grp:"run", label:"Companies",           render:renderCompanies },
      { k:"fns",    ac:"c_fns",    grp:"run", label:"Functions",             render:renderFunctions },
      { k:"caps",   ac:"c_caps",   grp:"run", label:"Capabilities",          render:renderCaps },

      /* Spec 008, restructured 2026-08-22 (§46.2). Configuring the sets and
         FILLING one were two Setup pages; they are one page with two sections
         now, because they are two halves of the same subject and the second
         one's tab told you nothing about the first.

         THE PARENT IS GATED ON c_source, NOT c_sets, and that is the whole
         trick: c_source is `area:"always"`, so the entry is reachable, and the
         SECTIONS then decide what is inside it. The SMO gets both; a set owner
         who is not the SMO gets only Fill; anybody else gets no entry at all,
         because paint() drops a def whose every section is refused. Gate the
         parent on c_sets and the owner loses the page they exist for. */
      { k:"sets",   ac:"c_source", grp:"meas", label:"Figure sets", sections: function(){
          return [{ k:"cfg",  ac:"c_sets",   label:"Sets configuration", render:renderSetsSetup },
                  { k:"fill", ac:"c_source", label:"Fill a figure set",
                    when: canPickSets,                                 render:renderSourceSetup }];
        } },
      { k:"bands",  ac:"c_bands",  grp:"meas", label:"Scoring bands",        render:function(){ return renderBands() + renderBandsExtra(); } },
      { k:"labels", ac:"c_labels", grp:"meas", label:"Labels",               render:renderLabels },

      /* Last in Setup: it changes how everything else LOOKS, which is a thing
         you do once the things themselves exist (§39). */
      { k:"brand",  ac:"c_brand",  grp:"look", label:"Branding",             render:renderBranding },
      /* §72. In *How it looks* rather than a group of its own, and that is the
         argument rather than the leftover: an email leaves wearing the tenant's
         accent, the tenant's name and the tenant's footer, so what it looks
         like is the same subject Branding answers — one step further out, where
         the reader is not in the platform at all. */
      { k:"comms",  ac:"c_comms",  grp:"look", label:"Communication",         render:renderComms }
    ],
    /* ONE DESTINATION, NOT TWO (§47.7). Manage and Setup were split in §46.1
       because a flat menu of sixteen was doing two jobs — and that argument
       was about the MENU. The rail with groups solves the same problem better,
       so keeping two doors behind one gear is now the odd part: the gear opens
       the page, and the rail's first group is the cycle.

       These keep their own array because they are still a group with its own
       label and its own answer to "may this person reach anything here"; they
       are concatenated into the setup list by defsFor(). */
    manage: [
      /* FIRST, because it is the page you open before the others — and now
         also because the gear lands on whichever def is `primary`. */
      { k:"cycle",    ac:"c_cycle", grp:"cycle",  label:"Reporting cycle", primary:true, render:renderCycle },
      /* EDIT, NOT VIEW — the page IS the action (§48.2). `a_cycle` defaults to
         `view` for every role, so gating the row on "not none" put Import in
         the rail of a contributor, a unit owner, a custodian and a company
         CEO. They could apply a file, watch the receipt say it worked, and
         then have the server refuse the save. There is nothing to READ on this
         page, so restriction is by removing it (§37) rather than trimming it. */
      { k:"import",   ac:"c_import", grp:"cycle", label:"Import",
        when: function(){ return grant("c_import") === "edit"; },        render:renderImport },
      { k:"archives", ac:"c_import", grp:"cycle", label:"Archived plans",                 render:renderArchives },
      { k:"focusset", ac:"c_focus", grp:"cycle",  label:"Focus measures",                render:renderFocusSetup },
      /* Only for somebody who has actually been named on a figure. Its reach
         is not a setting (§16.7), so `when` hides it outright rather than the
         matrix answering "none" — a menu entry that opens an empty page is
         worse than no entry. */
      /* Last in its group: it explains the rest, so it is not where you start. */
      /* §74. A DOING page, so it sits with the cycle rather than beside the
         Communication SETTINGS — and gated at edit for Import's reason
         (§48.2): there is nothing to read on a composer, so a view grant would
         open a page whose every control the server then refuses. */
      { k:"send",     ac:"c_send", grp:"cycle",   label:"Send a message",
        when: function(){ return hasRole("super"); },                    render:renderSendMessage },
      { k:"kb",       ac:"c_kb", grp:"cycle",     label:"Knowledge base",                render:renderKB },
      { k:"myfig",    ac:"c_myfig", grp:"cycle",  label:"Figures I report",
        when: ownsAnySource,                                render:renderMySources }
    ]
  };

  var current = "group", currentSub = "performance";
  /* WHOSE report is open, or null. A target rather than a boolean: the page is
     per unit or per function, and a flag would follow you onto the next one
     (§63.1). Dropped by every navigation, exactly as the edit modes are. */
  var REPORTING = null;

  /* EVERY MODE IS LEFT WHEN YOU GO SOMEWHERE ELSE. Edit is a decision about
     the thing being edited, not a lamp that stays on while you walk around —
     the rule §29 set for EDIT_PAGE, and every mode added since has had to be
     added here by hand. Named once so the next one cannot be forgotten at
     three call sites out of five (§63.1). */
  /* ── ASKING WHO THAT IS (§74.2) ─────────────────────────────────────
     The criteria change, the server answers, and the answer is written into
     ONE element rather than painted: the composer beside it may have a
     half-typed sentence in it, and a repaint arriving mid-thought is the fault
     §71.2 was about. It is also debounced, because ticking four boxes in a row
     is four questions with only the last one's answer wanted. */
  var AUDTIMER = null;
  function sendmsgAsk(){
    var st = sendmsg();
    if (!sendmsgHasAny()) { st.aud = null; st.asking = false; return; }
    st.asking = true;
    if (AUDTIMER) clearTimeout(AUDTIMER);
    AUDTIMER = setTimeout(function(){
      AUDTIMER = null;
      if (typeof SYNC === "undefined" || !SYNC.isLive()) {
        st.asking = false;
        st.aud = { error: "there is no server here to ask" };
        return paintAudience();
      }
      var asked = JSON.stringify(st.criteria);
      SYNC.mailAudience(st.criteria, function(err, j){
        /* A stale answer is worse than none: somebody ticked again while this
           was in flight, and painting it would show a list for criteria that
           are no longer on screen. */
        if (JSON.stringify(st.criteria) !== asked) return;
        st.asking = false;
        st.aud = err ? { error: err } : { to: j.to || [], skipped: j.skipped || [] };
        paintAudience();
      });
    }, 180);
  }
  function paintAudience(){
    var el = document.getElementById("audout");
    if (el) el.innerHTML = sendmsgAudienceHtml();
    var chip = document.querySelector('.phead2 .hright .chip:last-of-type');
    if (chip && document.getElementById("msgsend")) {
      var st = sendmsg();
      chip.textContent = (sendmsgHasAny() && st.aud && st.aud.to)
        ? plural(st.aud.to.length, "recipient", "recipients") : "nobody chosen";
    }
  }

  function leaveModes(){
    Object.keys(EDIT_PAGE).forEach(function(k){ EDIT_PAGE[k] = false; });
    Object.keys(EDITING).forEach(function(k){ EDITING[k] = false; });
    if (typeof ARRANGE !== "undefined") ARRANGE = false;
    REPORTING = null;
    CLEARING = null;
    /* The sentence under Send a test goes with the page (§72.6). Cleared HERE
       rather than read-and-cleared by the renderer: a render function with a
       side effect is the shape `branding()` had when it was inventing fields
       nobody stored (§42, §50.6). */
    if (typeof MAILSENT !== "undefined") MAILSENT = null;
    /* A composed message goes with the page too — a subject typed for one
       audience sitting on the screen after navigating away is a message
       waiting to be sent to the wrong people. */
    if (typeof SENDMSG !== "undefined") SENDMSG = null;
  }
  /* Which section of a container tab is open, per tab. Kept per tab rather than
     globally so moving between Performance and Strategy does not reset both. */
  var CURSEC = {};

  /* Which of a destination's tabs the viewer holds. The TARGET matters now:
     the same five unit tabs answer differently for a unit somebody owns and
     one they do not (§37), so asking without saying which unit would give the
     currently-open unit's answer for every unit in the navigation. */
  function allowed(defs, target){
    return defs.filter(function(d){
      if (d.when && !d.when()) return false;
      return grantAt(d.ac, target || TARGET) !== "none";
    });
  }

  /* REACHABLE, not merely allowed. A tab with SECTIONS shows nothing of its
     own — its sections are the pages — so a tab whose every section is refused
     is a tab that opens onto nothing.

     This has to be ONE function because two places ask the question: the menu,
     deciding whether to offer Setup at all, and paint(), deciding which tabs
     exist. They disagreed for exactly one viewer and it cost a crash. Figure
     sets is gated on `c_source`, which is `area:"always"` — every viewer is
     allowed the ENTRY, and only its sections decide whether there is anything
     inside. For the group CEO both sections are refused, so paint() filtered
     the def out, found `defs` empty, fell back to the unfiltered list, put the
     same def back, and read `secs[0].k` off an empty array. */
  function reachable(defs, target, arg){
    return allowed(defs, target).filter(function(d){
      return !d.sections || allowed(d.sections(arg), target).length;
    });
  }

  /* A unit tab appears only if the viewer reaches that unit AND holds at least
     one of its pages. Restriction is by removing the page, never by trimming
     what a page shows. */
  /* Which fold is open. Expanding is BROWSING, not going: opening Functions
     while sitting on Mobile does not move the page, so the closed fold has to
     carry the location or the navigation stops saying where you are. */
  /* A TWO-POSITION SWITCH, ONE SIDE ALWAYS ON (§47.6). Islam: "one button as a
     switch between both and the one that is selected is highlighted."

     The control has looked like one segmented box since §41.8, but it behaved
     as two independent folds with a THIRD state — both closed — which is what
     made it a pair of folds rather than a switch. Dropping that state is the
     whole change: the row always shows one list, the lit half always says
     which, and pressing the lit one now does nothing rather than emptying the
     row. Nobody was choosing "neither" on purpose; they were closing the one
     they had opened.

     It starts on Units, because a business unit is what the platform is mostly
     about and every viewer who holds any unit holds one here. */
  var NAVFOLD = "units";

  function myUnits(){
    return activeKeys().filter(function(k){ return allowed(SUBS.unit, k).length; });
  }
  function myFns(){
    return FUNCTION_KEYS.filter(function(k){
      /* fnShows(), not `capsOfFunction(k).length` and not fnHasWork() either
         — the same question fnsReachable() asks, asked once (§59, §61). */
      return fnShows(k) && allowed(SUBS.fn, "fn:" + k).length;
    });
  }
  /* The folds appear only for someone who reaches more than one unit AND more
     than one capability — today the SMO and the CEO. Everyone else sees the row
     exactly as it has always been, and never meets the concept. */
  function foldsNeeded(){ return myUnits().length > 1 && myFns().length > 1; }

  function unitTabs(){
    var out = [];
    /* ── THE GROUP BUTTON BECOMES A DROPDOWN (§68) ────────────────────
       Islam, asked where a company should sit: "make the group button name
       general and make it a drop down that opens group and company."

       So the first button is WHERE YOU ARE at this level — "Group" on the
       group, the company's name on a company — and pressing it offers the
       others. That is one button where a row of them would otherwise grow by
       one per company, and it puts the group and its companies where they
       belong: the same kind of thing, one above the other.

       WITH ONE DESTINATION IT IS A PLAIN BUTTON. A menu holding a single item
       is a door behind a door (§32) — and it is the ordinary case, because a
       tenant with no companies has only the group, and a company CEO whose
       `seeGroup` flag is off has only their own company. */
    var tops = [];
    if (allowed(SUBS.group, "group").length) tops.push({ k:"group", label:"Group" });
    companiesReachable().forEach(function(ck){
      if (allowed(SUBS.co, "co:" + ck).length)
        tops.push({ k:"co:" + ck, label:COMPANIES[ck].name });
    });
    if (tops.length === 1) out.push({ k:tops[0].k, label:tops[0].label });
    else if (tops.length > 1) out.push({ tops:tops });
    var us = myUnits(), cs = myFns(), fold = foldsNeeded();

    if (fold) {
      /* The row does NOT group by company (§15.13). It was built that way and
         taken out in the same version: the SMO and the group CEO see
         everything and already have this fold, so companies added a second
         layer of folding to a row that was working; and a company CEO sees
         only their own three or four units, so there is nothing to group. The
         grouping solved a problem neither viewer had. The company level
         survives where it does work — deciding who reaches what.

         REVERSAL of the 1.2 rule: a closed fold no longer announces where you
         are. It remembers silently — reopening puts you back, and the page
         below already says it. Repeating it made the row noisier the more
         folds there were. Worth revisiting if the row ever feels lost, since
         with the company folds gone there are only two folds again. */
      /* THE TWO FOLDS TRAVEL TOGETHER, in one container (§41.8, treatment 4).
         They used to be separated by whichever list was open, so the control
         you had just pressed moved every time you pressed it and the second
         fold ended up in a different place depending on the first. As one
         segmented box they stay put, the bar carries one box instead of two,
         and the shared container says outright that Units and Functions are
         the same kind of thing. The opened list follows BOTH of them. */
      /* A switch cannot rest on a side that has nothing behind it: a viewer who
         holds functions but no units would otherwise land on an empty Units
         list with no way to see that Functions has anything. */
      if (NAVFOLD === "units" && !us.length) NAVFOLD = "caps";
      if (NAVFOLD === "caps"  && !cs.length) NAVFOLD = "units";
      out.push({ folds: [
        { fold:"units", label:"Units",     open:NAVFOLD === "units" },
        { fold:"caps",  label:"Functions", open:NAVFOLD === "caps" }
      ] });
      /* A FUNCTION'S "SHOWN IN THE NAV" IS NOW ACTUALLY SHOWN IN THE NAV
         (§51.7, Islam). Both branches read `FUNCTIONS[k].name` — the full
         name — so a function's navName was stored, printed in the Setup
         table, editable there, and read by NOTHING. Setting the Strategy
         Management Office to "SMO" changed a cell and left the navigation
         saying "Strategy Management Office".

         Units had gone through navName() since the field existed; functions
         never did. §45.1's fault in a fourth tree: a field nobody reads fails
         silently, and it fails looking like the feature was never built. The
         same one-argument helper answers for both now, so a third kind of
         thing added later cannot get this wrong on its own. */
      if (NAVFOLD === "units")
        us.forEach(function(k){ out.push({ k:k, label:navName(UNITS[k]) }); });
      else
        cs.forEach(function(k){ out.push({ k:"fn:" + k, label:navName(FUNCTIONS[k]) }); });
    } else {
      us.forEach(function(k){ out.push({ k:k, label:navName(UNITS[k]) }); });
      cs.forEach(function(k){ out.push({ k:"fn:" + k, label:navName(FUNCTIONS[k]) }); });
    }
    /* Manage and Setup used to be two glyph buttons here. They are now one
       worded button with a menu, rendered separately (paintMenu) so it can sit
       anchored right and open downward without the row's layout owning it.
       Anchored right rather than trailing the row: it is the same destination
       wherever you are, and a control that moves as the list beside it grows
       is a control you have to look for. */
    return out;
  }


  /* One list, two labelled groups. Merging the two buttons was about the way
     IN, not about the pages: every entry still opens exactly the page it
     always opened, with its own tab row underneath. The groups stay named
     because "Reporting cycle" and "Scoring bands" are different kinds of
     thing \u2014 what the SMO does each cycle, and what was decided once. */
  /* ══ SETUP IS A PAGE WITH A RAIL, NOT A ROW OF TEN TABS (§46.1) ═════
     Islam: "let's think of some sort of grouping for the settup tabs. and an
     easier view for it. maybe a collapsable rail on the left."

     Grouped by THE QUESTION YOU CAME TO ANSWER rather than by which table the
     page edits — group by table and you get the same flat row with headings
     over it. Four groups, two to four pages each, every page in exactly one.

     The rail is not a new component: it is `.rail` inside `.split`, which is
     what a unit's pillars have sat in since 1.7. That is most of why this is
     worth doing — Setup stops looking like a settings screen bolted onto the
     side of the product and starts looking like the rest of it.

     NO ICON STRIP. Ten setup pages need ten icons, and a label, a scoring band
     and a figure set are three abstractions with no picture anybody guesses
     right; the mockup drew it collapsing so it could be seen failing. If a
     page ever genuinely needs the 236px back, the page asks for it — Roles &
     access is the only candidate. */
  /* The setup destination IS manage + setup now. One list, built here rather
     than written out twice, so a page cannot be in one and missing from the
     other. */
  function setupDefs(){ return SUBS.manage.concat(SUBS.setup); }

  var SETUP_GROUPS = [
    { k:"cycle", label:"Running the cycle", note:"What you do while a cycle is open" },
    { k:"who",  label:"Who",              note:"Who exists, and what may they touch" },
    { k:"run",  label:"What we run",      note:"The things being planned" },
    { k:"meas", label:"How it's measured", note:"What the numbers mean" },
    { k:"look", label:"How it looks",     note:"What it wears" }
  ];

  /* ══ THE RAIL COLLAPSES (§47.3) ═══════════════════════════════════
     Islam: "the side panel needs to be collapsable and it needs to be sticky."

     Sticky it already was — `.rail` has carried `position:sticky` since 1.7
     and the setup rail inherits it; measured, it pins under the chrome and
     holds. What it could not do is get out of the way, and the register is
     nine columns wide in the 880px the rail leaves.

     COLLAPSED IS A HANDLE, NOT AN ICON RAIL. HR_ERP collapses its sidebar to
     64px of icons, and that works there because its destinations are Employees,
     Directory, Time off — things with pictures. Ours are Labels, Scoring bands,
     Figure sets, and the mockup drew that failing. What makes a handle enough
     here is that THE PANE ALREADY NAMES THE PAGE: every Setup page opens with
     its own title, so collapsing the rail costs navigation, not orientation,
     and one click brings it back.

     The mechanics are HR_ERP's, because they are the house pattern: a grid
     column swap on the container, the toggle inside the panel's own head
     rather than in the page, and the preference in localStorage per browser —
     it is a property of the screen, never of the tenant (§25). */
  var RAIL_KEY = "smp.setup.rail";
  var RAIL_OPEN = true;
  try { RAIL_OPEN = localStorage.getItem(RAIL_KEY) !== "0"; } catch (e) {}
  function setRailOpen(v){
    RAIL_OPEN = v;
    try { localStorage.setItem(RAIL_KEY, v ? "1" : "0"); } catch (e) {}
  }
  var ICO_CHEV =
    '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" fill="none" ' +
    'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* WHICH GROUPS ARE FOLDED. Five groups and sixteen pages is a long rail, so
     they collapse — but the group holding the page you are ON is always open,
     whatever the stored preference says. A rail that can hide the thing it is
     pointing at is a rail that lies about where you are. */
  var RAILSHUT = {};
  try { RAILSHUT = JSON.parse(localStorage.getItem("smp.setup.groups") || "{}") || {}; }
  catch (e) { RAILSHUT = {}; }
  function toggleRailGroup(k){
    RAILSHUT[k] = !RAILSHUT[k];
    try { localStorage.setItem("smp.setup.groups", JSON.stringify(RAILSHUT)); } catch (e) {}
  }

  function setupRail(defs, activeKey){
    if (!RAIL_OPEN) {
      return '<div class="rail setuprail shut">' +
        '<button type="button" class="railtog" data-railtog="1" ' +
          'title="Show the Setup list" aria-label="Show the Setup list" ' +
          'aria-expanded="false">' + ICO_CHEV + '</button></div>';
    }
    var rows = SETUP_GROUPS.map(function(g){
      var items = defs.filter(function(d){ return d.grp === g.k; });
      if (!items.length) return "";       /* a group with nothing in it is not a heading */
      var here = items.some(function(d){ return d.k === activeKey; });
      var shut = !!RAILSHUT[g.k] && !here;
      return '<button type="button" class="rgroup' + (shut ? " shut" : "") +
          '" data-railgrp="' + g.k + '" title="' + esc(g.note) + '" ' +
          'aria-expanded="' + (!shut) + '">' +
          '<span class="rgtw" aria-hidden="true">' + (shut ? "\u25b8" : "\u25be") + '</span>' +
          esc(g.label) + '<span class="rgn">' + items.length + '</span></button>' +
        (shut ? '' : items.map(function(d){
          return '<button type="button" class="ritem' + (d.k === activeKey ? " on" : "") +
            '" data-setupgo="' + d.k + '">' + esc(d.label) + '</button>';
        }).join(""));
    }).join("");
    return '<div class="rail setuprail"><div class="rhead">Setup' +
      '<button type="button" class="railtog" data-railtog="0" ' +
        'title="Hide the Setup list" aria-label="Hide the Setup list" ' +
        'aria-expanded="true">' + ICO_CHEV + '</button></div>' + rows + '</div>';
  }

  function menuGroups(){
    var gs = [];
    /* Neither depends on the unit you happen to be looking at — Setup and the
       cycle belong to nobody's unit — but they are asked explicitly so they
       cannot start depending on it by accident. */
    /* NOTHING LEFT TO GROUP. Manage and Setup are one destination now (§47.7),
       so the gear has exactly one thing to offer — and a menu holding one item
       is a door behind a door, which §32 removed once already at the gate. The
       gear IS the door now; this function only answers whether there is
       anything behind it, and which page to land on. */
    var st = reachable(setupDefs(), "group", null);
    /* THE PRIMARY PAGE, falling back to the first the viewer holds. Landing on
       "whatever happens to be first in the array" put the gear on the knowledge
       base — true of the list, wrong for the person pressing it, who is far
       more often coming to open or chase a cycle. */
    var land = st.filter(function(d){ return d.primary; })[0] || st[0];
    if (st.length) gs.push({ dest:"setup", label:"Setup", single:true,
                             items:[{ k:land.k, label:"Setup" }] });
    return gs;
  }

  /* Where a destination opens. The group and Setup keep their own first page;
     a BUSINESS UNIT opens on Strategy and, inside it, on Plan, and a
     SUPPORTING FUNCTION opens on Strategy and, inside it, on Projects — the
     same page under the name that function's plan goes by. Both are checked
     against what the viewer holds rather than assumed.

     ONE FUNCTION, TWO KINDS OF DESTINATION (§53.1). It used to say "not a
     function" and send every function to Performance, which is exactly the
     kind of divergence the cross-testing rule now forbids: what the unit got
     in §28, the function did not. The tab and section keys are the only
     difference, so they are two variables rather than two branches. */
  function entrySub(k){
    var d = allowed(defsFor(k));
    if (!d.length) return null;
    /* A COMPANY OPENS ON PERFORMANCE, and there is nothing else to open.
       §28's rule — a unit opens on what was AGREED, not on the score — is about
       plans, and a company has none: its page IS the reading (§68). */
    if (k !== "group" && k !== "manage" && k !== "setup" && !isCo(k)) {
      var fn = isFn(k);
      var tab = fn ? "fnstrat" : "strategy", want = fn ? "proj" : "plan";
      var strat = d.filter(function(x){ return x.k === tab; })[0];
      if (strat) {
        var secs = allowed(strat.sections(fn ? k : UNITS[k]));
        if (secs.some(function(x){ return x.k === want; })) CURSEC[tab] = want;
        if (secs.length) return tab;
      }
    }
    return d[0].k;
  }

  function isFn(k){ return typeof k === "string" && k.indexOf("fn:") === 0 && !!fnOf(k); }
  function isCo(k){
    return typeof k === "string" && k.indexOf("co:") === 0 && !!COMPANIES[k.slice(3)];
  }
  function defsFor(k){
    return k === "group" ? SUBS.group
         /* Both keys resolve to the SAME merged list (§47.7). "manage" survives
            only so a stored or in-flight `current` from before the merge lands
            somewhere real rather than on the unit branch. */
         : k === "manage" || k === "setup" ? setupDefs()
         : isCo(k) ? SUBS.co
         : isFn(k) ? SUBS.fn
         : SUBS.unit;
  }

  function paintUnits(){
    var tabs = unitTabs();
    document.getElementById("units").classList.toggle("folded", foldsNeeded());
    /* A destination folded out of sight is still where you are. Resetting
       `current` because it is not in the visible list would make expanding a
       fold navigate \u2014 which is exactly what a fold must not do. Only reset when
       the destination is genuinely unreachable for this viewer. */
    var everything = myUnits().concat(myFns().map(function(k){ return "fn:" + k; }))
      .concat(companiesReachable().map(function(ck){ return "co:" + ck; }));
    if (allowed(SUBS.group, "group").length) everything.push("group");
    if (allowed(SUBS.setup, "group").length) everything.push("setup");
    if (allowed(SUBS.manage, "group").length) everything.push("manage");
    if (everything.indexOf(current) === -1) {
      var dests = tabs.filter(function(t){ return t.k; });
      current = dests.length ? dests[0].k : null;
    }
    document.getElementById("units").innerHTML = tabs.map(function(t, i){
      if (t.folds) {
        /* NO DISCLOSURE ARROW. A ▸/▾ twist promises "this opens and closes",
           which is what these were and are not any more — a switch has two
           sides and the lit one IS the state (§47.6). `aria-pressed` rather
           than `aria-expanded` for the same reason: nothing expands. */
        /* ONE BUTTON, TWO WORDS (§51.9, Islam: "I want it a switching button
           where the 2 words stay on 1 button but on clicking the selection
           switches"). It was two buttons inside a container that LOOKED like
           one control, which is a different thing: you pressed the side you
           wanted rather than pressing the control. Now there is one button
           carrying both words, the lit word is the state, and pressing it
           anywhere switches to the other — so the thing you press and the
           thing that changes are the same object.

           A plain button, not `role="switch"`: a switch is on or off and this
           is neither: it is two named sides. The label says what pressing it
           will DO, because the visible words already say where you are. */
        var lit = t.folds.filter(function(f){ return f.open; })[0] || t.folds[0];
        var other = t.folds.filter(function(f){ return f !== lit; })[0] || lit;
        return '<span class="sep"></span>' +
          '<button class="navswitch" data-fold="' + other.fold + '"' +
          ' aria-label="Showing ' + lit.label.toLowerCase() + '. Press to show ' +
          other.label.toLowerCase() + '.">' +
          t.folds.map(function(f){
            return '<span class="nsw' + (f.open ? " on" : "") + '">' + f.label + '</span>';
          }).join("") + '</button>';
      }
      if (t.tops) {
        /* The label is where you ARE, not what the menu is called: a control
           saying "Group" while you are looking at Distribution is a control
           that has stopped telling you anything. A <details>, like every other
           menu here, so the action fires before the menu closes without
           unmounting the button the click is still inside (§47.2). */
        var here = t.tops.filter(function(x){ return x.k === current; })[0];
        return '<details class="dlmenu topsel" id="topsel">' +
          '<summary role="tab" aria-selected="' + (!!here) + '">' +
            esc(here ? here.label : t.tops[0].label) +
            '<span class="dlcar" aria-hidden="true">\u25be</span></summary>' +
          '<div class="menu" role="menu">' + t.tops.map(function(x){
            return '<button role="menuitem" data-u="' + esc(x.k) + '"' +
              (x.k === current ? ' aria-current="true"' : '') + '>' + esc(x.label) +
              (x.k === "group" ? '' : '<span class="dlsub">' +
                plural(companyUnitKeys(x.k.slice(3)).length, "business unit") + '</span>') +
              '</button>';
          }).join("") + '</div></details>';
      }
      return ((i === 1 && !tabs[1].folds) ? '<span class="sep"></span>' : '') +
        '<button role="tab" aria-selected="' + (t.k === current) + '" data-u="' + t.k + '"' +
        '>' + t.label + '</button>';
    }).join("") + menuHTML();
    /* Only destinations. A fold button lives in the same row but goes nowhere \u2014
       binding it here set current to undefined and reset the page to Group, which
       made expanding a fold navigate. */
    /* WIRED HERE, NOT IN wire(). paintUnits() replaces this row's innerHTML, so
       every handler inside it dies on each call and has to be re-attached by
       the same function that destroyed them. The fold used to be wired in
       wire(), which only runs on a full paint() - and three paths call
       paintUnits() ALONE: opening the Manage menu, closing it with Escape, and
       closing it by clicking anywhere else. After any of those the Units and
       Functions folds were dead until something else forced a full repaint,
       which is why they "worked after a few tries".

       The rule was already written on the fold's own handler in 2.x - rewriting
       the row destroys its handlers - and then the menu was added and broke it
       from the other side. So: whoever rewrites the DOM re-wires it, and there
       is only one place that does. */
    document.querySelectorAll("#units [data-fold]").forEach(function(b){
      b.addEventListener("click", function(){
        /* Browsing, not going: `current` is untouched, so the page and its tabs
           stay exactly as they are. A SWITCH, not a toggle — pressing the lit
           side leaves it lit (§47.6). */
        NAVFOLD = b.dataset.fold;
        paintUnits();
      });
    });
    document.querySelectorAll("#units [data-u]").forEach(function(b){
      b.addEventListener("click", function(){
        /* Edit is a decision about the thing being edited, not a lamp that
           stays on while you walk around. Leaving edit modes on across a unit
           switch landed you editing a different unit's foundation without
           ever pressing Edit on it. Arrange mode drops for the same reason. */
        if (current !== b.dataset.u) leaveModes();
        current = b.dataset.u;
        /* A business unit opens on its PLAN and a supporting function on its
           PROJECTS, not on Performance. What was agreed is the thing people
           come to read and the thing they come to change; the score is a
           consequence of it and is one click away. Falls back to the first
           page the viewer actually holds, so someone without u_plan is not
           sent to a tab that is not there. */
        currentSub = entrySub(current);
        paint(); window.scrollTo(0,0);
      });
    });
    wireMenu();
  }

  /* A gear. It replaced the word "Manage" in 3.3 - at 11px uppercase in a
     pill, the word was the widest thing in the navigation row and it named a
     menu rather than a place. The mark is the same 20px box the theme control
     uses. */
  /* TWO SLIDERS, NOT A GEAR (Islam, 2026-08-23, chosen from six drawn at the
     size the control is actually worn — a 20px mark in a 34px button, which is
     the only size it is ever seen at).

     The gear's teeth were the problem: at 20px an outlined cog loses them to
     anti-aliasing and reads as a smudge. Two sliders hold their shape at that
     size, and they are the truer picture anyway — the page behind this is
     sixteen things you SET, not machinery. */
  var ICON_MANAGE =
    '<svg viewBox="0 0 20 20" class="navmenusvg" aria-hidden="true">' +
    '<g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">' +
    '<path d="M3 6.5h9M15.5 6.5h1.5M3 13.5h4M10.5 13.5h6.5"/>' +
    '<circle cx="13.6" cy="6.5" r="2.1"/><circle cx="8.6" cy="13.5" r="2.1"/></g></svg>';

  /* The menu lives inside the row so it sits on the same baseline as the tabs,
     but its panel is absolutely positioned, so a long list never widens the
     row or pushes the units along. */
  function menuHTML(){
    var gs = menuGroups();
    if (!gs.length) return "";
    var on = current === "manage" || current === "setup";
    /* ONE CLICK, NOT TWO. With a single destination behind it the gear stops
       being a menu button and becomes a link — press it and you are on the
       page, with the rail carrying everything the menu used to list. */
    var only = gs[0].items[0];
    return '<span class="sep pinsep"></span>' +
      '<button type="button" class="navmenu-btn navmenu-ico navmenu-solo' +
        (on ? " here" : "") + '" data-md="setup" data-ms="' + only.k + '" ' +
        'title="Setup" aria-label="Setup">' + ICON_MANAGE + '</button>';
  }

  /* The menu panel that used to live here is gone with the two-door split
     (§47.7, §24: delete an element and delete its code with it). MENU_OPEN and
     the panel markup went with it — a stylesheet or a state flag left behind is
     how a later drawing shows a control the product does not have (§41.9). */

  function wireMenu(){
    /* No toggle any more — the gear IS a [data-md] destination, so it is wired
       by the same loop as everything else the row can go to. */
    document.querySelectorAll("#units [data-md]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        /* Same rule as a unit tab: going somewhere else drops every edit mode,
           or you land editing a page you never pressed Edit on. */
        if (current !== b.dataset.md) leaveModes();
        current = b.dataset.md;
        currentSub = b.dataset.ms;
        paint(); window.scrollTo(0,0);
      });
    });
  }

  /* THE TWO-CLICK SAVE.

     Every editable field in Setup commits on `change` and then repaints. But
     `change` on a text input fires on BLUR, and the blur is caused by pressing
     something else - usually the Done button in the same table. So the order
     was: mousedown on Done, input blurs, change fires, paint() rewrites the
     panel and destroys the very button being pressed, and the click lands on
     nothing. The value was saved; leaving edit mode took a second press. That
     is the "two clicks to save".

     Fixed once, here, rather than in twenty handlers: a repaint requested
     while the mouse is down is held until the click it belongs to has landed.
     mouseup and click are dispatched in the same task, and timers run after
     it, so a setTimeout scheduled on mouseup is reliably after the click.

     Deliberately not solved by committing on `input` instead: that works for
     the button, but a field committing on every keystroke also has to not
     repaint on every keystroke, and then nothing derived updates until
     something else happens to paint. This keeps the repaint, and only moves
     it a few milliseconds. */
  var CLICKING = false, PAINT_HELD = false, holdTimer = null;
  function releasePaint(){
    CLICKING = false;
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (PAINT_HELD) { PAINT_HELD = false; paint(); }
  }
  document.addEventListener("mousedown", function(){
    CLICKING = true;
    /* A mousedown whose mouseup lands outside the window never releases, and a
       stuck flag means the page silently stops repainting. Nothing is worth
       that, so it always releases on its own. */
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = setTimeout(releasePaint, 500);
  }, true);
  document.addEventListener("mouseup", function(){ setTimeout(releasePaint, 0); }, true);

  /* The tenant's branding, handed to THEME. One function, called on boot and
     after every change on the Branding page, so the applied colours and the
     page's own preview cannot drift apart (§39). */
  function applyBrand(){
    var b = branding();
    THEME.setBrand({ palette: b.palette, font: b.font, tokens: brandTokens() });
  }

  function paint(){
    if (CLICKING) { PAINT_HELD = true; return; }
    /* WHAT THIS PAINT IS ABOUT, set before anything renders. Every grant() with
       no target of its own answers for this — the unit, the function or the
       group currently on screen — because "own business unit" and "other
       business units" are different answers to the same page (§37), and a
       render has exactly one subject. Anything asking about a DIFFERENT thing
       (the navigation, listing every unit) passes its own target to grantAt().
       "setup" is deliberately mapped to the group: the Setup pages belong to
       nobody's unit, and their area does not depend on the target at all. */
    /* Field setters are registered during render, so the list is emptied first
       or stale closures accumulate on every repaint. */
    FIELDS.length = 0;
    fillViewers();
    paintUnits();
    /* ── TARGET IS DERIVED FROM `current`, SO IT IS SET AFTER IT SETTLES ──
       It used to be set BEFORE paintUnits(), and paintUnits is the thing that
       corrects `current` when this viewer cannot reach where the last one was
       standing. So on the first paint after the reach changed, TARGET still
       named the OLD destination while `current` had already moved — and every
       tab was then judged against the wrong subject.

       What it cost: setting the business unit owner's GROUP area to "none"
       made a unit head lose EVERYTHING. Their own unit's pages were granted —
       `u_perf` measured "edit" the whole time — but they were being asked
       against the group, where the answer had just become none, so every tab
       was filtered out and the page said there was nothing to open. The one
       change the table is most likely to be asked for took the product away
       from the person it was configured for.

       paintUnits() reads no grant of its own (every call inside it passes an
       explicit target, by the note above), so nothing needs the old value. */
    TARGET = (!current || current === "setup" || current === "manage") ? "group" : current;
    /* Repainted rather than set once: the demo switch swaps the whole graph,
       and Labels can rename the tenant while you are looking at it. The
       separator lives with the name so an unnamed tenant shows nothing at all
       rather than a stranded middot. */
    document.getElementById("orgname").textContent =
      GROUP.org ? "\u00b7 " + GROUP.org : "";
    var v = viewer();
    /* Guarded even though every person currently has a unit: reading
       UNITS[null].name throws inside paint, which aborts the repaint and
       leaves the previous screen showing \u2014 a crash that looks like a routing
       bug. */
    var where = v.unit === "group" ? "all units"
              : (v.unit && UNITS[v.unit] ? UNITS[v.unit].name : "\u2014");
    document.getElementById("viewerNote").innerHTML =
      /* The roles they hold, not a level. Several is normal — group CEO who
         also owns Care reads "Group CEO · Business unit owner". */
      (personRoles(v).map(function(r){ return roleName(r.role); })
        .filter(function(x, i, a){ return a.indexOf(x) === i; }).join(" &middot; ") || "No role") +
      " &middot; " + where;

    if (!current) {
      document.getElementById("subtabs").innerHTML = "";
      document.getElementById("panel").innerHTML =
        '<div class="note bad-note" style="margin-top:30px"><b>No pages granted.</b> The roles this person holds reach nothing. ' +
        'That is the table working as configured, not an error &mdash; open <b>Setup &rarr; Roles &amp; access</b> as the SMO to change it.</div>';
      return;
    }

    /* A tab with SECTIONS is a container: the tab itself renders nothing and
       the third row carries its pages. A tab without them renders directly, as
       every group and setup tab still does. */
    var arg = (current === "group" || current === "setup" || current === "manage") ? null
            : isFn(current) ? current : UNITS[current];
    /* Submission is per unit; a function's capabilities are not submitted
       individually, so the whole function counts as one. */
    CURRENT_REPORT_KEY = isFn(current) ? current : (UNITS[current] ? UNITS[current].ukey : null);
    var defs = reachable(defsFor(current), TARGET, arg);
    /* NO FALLBACK ONTO THE UNFILTERED LIST. It used to re-add every allowed def
       when the reachable set came out empty, which put back exactly the defs
       that had just been ruled out for having nothing to render. Nothing to
       render is a real answer, and the branch above already says it in words. */
    if (!defs.length) {
      document.getElementById("panel").innerHTML =
        '<div class="note">There is nothing here for you to open. ' +
        'That is the table working as configured, not an error &mdash; open ' +
        '<b>Setup &rarr; Roles &amp; access</b> as the SMO to change it.</div>';
      document.getElementById("subtabs").innerHTML = "";
      document.getElementById("tabrow").hidden = true;
      document.getElementById("secrow").hidden = true;
      return;
    }
    if (!defs.some(function(d){ return d.k === currentSub; })) currentSub = defs[0].k;

    /* SETUP HAS NO TAB ROW. Its ten pages are the rail's job now (§46.1), and
       leaving the row rendered as well would state the same navigation twice —
       the fault the chrome shed in 2.9. The row is emptied AND hidden: an
       empty <nav> still spends its border and its padding. */
    var railed = current === "setup";
    document.getElementById("tabrow").hidden = railed;
    /* THE DOT IS A STATE, NOT A DECORATION (§69.9). It used to hang off
       `.primary`, which is the LANDING PAGE and nothing else — so it was
       painted on every destination all the time. It now belongs to the tab
       whose page is where the outstanding report is answered, and only while
       there is one: reportPending() is the one place that decides.

       `dot` rather than more `primary`, because the two facts are unrelated
       and one class carrying both is how the dot came to mean nothing. It
       paints to the RIGHT (Islam), which is also where it belongs — a mark
       AFTER the word annotates it; a mark before it is a bullet. */
    document.getElementById("subtabs").innerHTML = railed ? "" : defs.map(function(d){
      var cls = (d.primary ? "primary" : "") +
        (d.dot && reportPending(TARGET) ? " dot" : "");
      return '<button role="tab" data-s="' + d.k + '"' +
        (cls.trim() ? ' class="' + cls.trim() + '"' : '') +
        ' aria-selected="' + (d.k === currentSub) + '">' + d.label +
        (d.dot && reportPending(TARGET)
          ? '<i class="tabdot" aria-hidden="true"></i>' +
            '<span class="vh"> \u2014 not submitted yet</span>'
          : '') + '</button>';
    }).join("");

    var def = defs.filter(function(d){ return d.k === currentSub; })[0];
    var secs = def.sections ? allowed(def.sections(arg), TARGET) : null;
    var secrowHTML = "";
    /* `secs.length`, not `secs`. An empty array is truthy, so a def whose every
       section was refused walked straight into `secs[0].k`. */
    if (secs && secs.length) {
      if (!secs.some(function(s){ return s.k === CURSEC[def.k]; })) CURSEC[def.k] = secs[0].k;
      /* A SETUP page's sections belong INSIDE its pane, not in the chrome's
         third row. The third row spans the window; the pane starts 236px in,
         beside the rail — a row of section tabs floating over the rail would
         be pointing at a page it does not sit above. Figure sets is the first
         Setup page to have sections at all (§46.2). */
      if (railed && secs.length > 1) {
        secrowHTML = '<div class="secrow">' + secs.map(function(x){
          return '<button type="button" role="tab" data-sub2="' + x.k + '"' +
            (x.cls ? ' class="' + x.cls + '"' : '') +
            ' aria-selected="' + (x.k === CURSEC[def.k]) + '">' + x.label + '</button>';
        }).join("") + '</div>';
      }
      def = secs.filter(function(s){ return s.k === CURSEC[def.k]; })[0];
    }

    /* The per-page Info button left the header in 2.9. The explanations in
       PAGEINFO stay \u2014 they are still reachable from the [data-modal] links
       inside the pages themselves. */
    var body = (current === "group" || current === "setup" || current === "manage")
      ? def.render()
      /* A company is passed its key, the way a function is: there is no
         UNITS[...] to hand it and inventing a unit-shaped object for something
         that carries no plan would be a lie about what it is (§68). */
      : isCo(current) ? def.render(current)
      : isFn(current) ? def.render(current) : def.render(UNITS[current]);
    /* The rail and the page it chose, side by side. `defs` rather than
       SUBS.setup, so a page the viewer may not open is not offered — the rail
       is navigation, and navigation that leads somewhere refused is worse than
       navigation that is short. */
    document.getElementById("panel").innerHTML = railed
      ? '<div class="split setupsplit' + (RAIL_OPEN ? '' : ' shut') + '">' +
        setupRail(defs, currentSub) +
        '<div class="pane setuppane">' + secrowHTML + body + '</div></div>'
      : body;

    /* Group Performance is four sections; they become a third nav row rather
       than one long scroll. The row exists only where there are sections. */
    var secrow = document.getElementById("secrow");
    var onSecPage = current === "group" && currentSub === "performance" && GROUP_SECTIONS.length;
    /* `!railed`: a Setup page's sections were drawn into its own pane above, so
       drawing them here as well would be the same two buttons in two places. */
    if (!railed && secs && secs.length > 1) {
      /* The same third row the group's Performance sections already use. One
         row that means "sections of the tab above", wherever it appears. */
      secrow.hidden = false;
      document.getElementById("secrow-in").innerHTML = secs.map(function(s){
        return '<button role="tab" data-sub2="' + s.k + '"' + (s.cls ? ' class="' + s.cls + '"' : '') +
          ' aria-selected="' + (s.k === def.k) + '">' + s.label + '</button>';
      }).join("");
    } else {
      secrow.hidden = !onSecPage;
      /* HIDDEN IS NOT EMPTY, AND IT HAS TO BE BOTH (§63.6). The row kept the
         buttons of whatever page was on screen last: hidden, but still in the
         document, still focusable, still found by anything that queries for
         them. Two things went looking. The contrast sweep read the section
         buttons after choosing a tab, so with Performance's sections gone it
         found STRATEGY's left over, pressed them, and reported what it
         measured as `fn/performance/foundation` — 7 extra failures counted
         twice under a name for a page it was not on (§50.6, again). And a
         hidden control is still a tab stop, which is §48's `opacity:0` lesson
         arriving in a third tree. Emptied whenever it is hidden. */
      document.getElementById("secrow-in").innerHTML = onSecPage
        ? GROUP_SECTIONS.map(function(t, i){
            return '<button role="tab" data-sec="' + i + '" aria-selected="' + (i === GSEC) + '">' + t + '</button>';
          }).join("")
        : "";
    }
    wire();
    /* LAST, and after wire(). Every <select> the paint just produced gets a
       searchable button in front of it once its list passes five options
       (searchsel.js) — the native control stays where it is, so nothing wire()
       just attached is disturbed. */
    SEARCHSEL.wire();
    positionRowMenu();
    focusOpenMenu();
    /* Every mutation repaints, so this is where a change becomes a save. */
    SYNC.afterPaint();
  }

  /* A row's action menu is position:fixed, so somebody has to put it where its
     button is. It is placed AFTER the paint that created it — measuring an
     element before it is in the document gives zeroes — and flipped above the
     button when there is no room below, because a menu that opens off the
     bottom of the window is a menu whose last item cannot be reached. */
  /* PICKING A NEW PILLAR PUTS YOU AT THE TOP OF IT (Islam, 2026-08-22).
     The rail is sticky, so it is still under the cursor after you have scrolled
     a long way down the tactics table — you pick the next pillar and land
     halfway down a table you have not read. `scrollTo(0,0)` is wrong here: it
     would throw away the rail's pinned position and put the page header back
     on screen, when what is wanted is the TOP OF THE PANE with the rail still
     pinned beside it.

     So it scrolls to the split's own offset less the chrome and the rail gap —
     the same two numbers the rail's sticky offset is built from, read from the
     same custom properties, so the pane's top lands exactly where the rail's
     does. And only ever UPWARDS: if you are already above that point, a
     scroll down to reach it would be the page moving for no reason. */
  function toPaneTop(){
    var split = document.querySelector("#panel .split");
    if (!split) return;
    var cs = getComputedStyle(document.documentElement);
    var chrome = parseFloat(cs.getPropertyValue("--chrome-h")) || 0;
    var gap = parseFloat(cs.getPropertyValue("--rail-gap")) || 0;
    var want = split.getBoundingClientRect().top + window.scrollY - chrome - gap;
    if (window.scrollY > want) window.scrollTo({ top: Math.max(0, want) });
  }

  /* ══ A MENU TAKES FOCUS, AND GIVES IT BACK (§48.4) ════════════════
     The row menu and the two header menus opened without moving focus, so
     their items could only be reached by tabbing the whole document — and
     closing one dropped focus to <body>. Both are the same omission and both
     are fixed by the pattern searchsel.js already uses for its popup.

     Called from the same place as positionRowMenu(), which is AFTER the paint
     that created the menu: focusing a node the paint is about to replace
     focuses nothing. */
  var MENURETURN = null;
  function focusOpenMenu(){
    var m = document.querySelector(".kmenu, .hmenu-panel");
    if (!m) {
      /* Closed. Put focus back on whatever opened it, if that control is still
         on the page — a repaint may have replaced it, so it is looked up by
         its data attribute rather than held as a node. */
      if (MENURETURN) {
        var back = document.querySelector(MENURETURN);
        MENURETURN = null;
        if (back && document.activeElement === document.body) back.focus();
      }
      return;
    }
    var btn = m.parentNode.querySelector("[data-pmenu],[data-colmenu],[data-pwmenu]");
    if (btn) {
      MENURETURN = btn.dataset.pmenu ? '[data-pmenu="' + btn.dataset.pmenu + '"]'
                : btn.hasAttribute("data-colmenu") ? "[data-colmenu]" : "[data-pwmenu]";
    }
    /* Only when the menu has just appeared under the keyboard — a mouse user
       who clicked it does not want the first item stealing their pointer. */
    if (document.activeElement === document.body || document.activeElement === btn) {
      var first = m.querySelector("button:not([disabled]), input");
      if (first) first.focus();
    }
  }

  function positionRowMenu(){
    var m = document.querySelector(".kmenu");
    if (!m) return;
    var btn = m.parentNode.querySelector("[data-pmenu]");
    if (!btn) return;
    var r = btn.getBoundingClientRect(), h = m.offsetHeight, w = m.offsetWidth;
    var below = window.innerHeight - r.bottom - 8;
    var top = (below >= h || r.top < h + 8) ? r.bottom + 4 : r.top - h - 4;
    m.style.top  = Math.max(8, top) + "px";
    m.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + "px";
  }

  function wire(){
    document.querySelectorAll("#subtabs button").forEach(function(b){
      b.addEventListener("click", function(){
        /* A TAB IS SOMEWHERE ELSE TOO. Only the destination change dropped the
           modes, so pressing Strategy while reporting and coming back landed
           you in the report again — and, once the plan's pen turns the drag
           handles on (§63.3), it would have carried the handles onto
           Performance with no control there to turn them off. */
        if (currentSub !== b.dataset.s) leaveModes();
        currentSub = b.dataset.s; paint(); window.scrollTo(0,0);
      });
    });
    document.querySelectorAll("[data-sub2]").forEach(function(b){
      b.addEventListener("click", function(){ CURSEC[currentSub] = b.dataset.sub2; paint(); window.scrollTo(0,0); });
    });
    /* The Setup rail (§46.1). It replaces a tab row, so it does what the tab
       row did — including dropping every edit mode on the way out, or you land
       on Branding still editing People. */
    document.querySelectorAll("[data-railgrp]").forEach(function(b){
      b.addEventListener("click", function(){ toggleRailGroup(b.dataset.railgrp); paint(); });
    });
    document.querySelectorAll("[data-railtog]").forEach(function(b){
      b.addEventListener("click", function(){ setRailOpen(b.dataset.railtog === "1"); paint(); });
    });
    document.querySelectorAll("[data-setupgo]").forEach(function(b){
      b.addEventListener("click", function(){
        if (currentSub !== b.dataset.setupgo) {
          Object.keys(EDIT_PAGE).forEach(function(k){ EDIT_PAGE[k] = false; });
          Object.keys(EDITING).forEach(function(k){ EDITING[k] = false; });
          CLEARING = null;
        }
        currentSub = b.dataset.setupgo;
        paint(); window.scrollTo(0,0);
      });
    });
    document.querySelectorAll("[data-modal]").forEach(function(b){
      b.addEventListener("click", function(e){ e.stopPropagation(); e.preventDefault(); openModal(b.dataset.modal); });
    });
    document.querySelectorAll("[data-go]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation(); e.preventDefault();
        if (!reaches(b.dataset.go)) return;
        current = b.dataset.go; currentSub = "performance"; paint(); window.scrollTo(0,0);
      });
    });

    /* Impact is the one factor a person sets; editing it recomputes the
       composite immediately so the model is visible rather than asserted. */
    document.querySelectorAll("[data-imp]").forEach(function(b){
      b.addEventListener("click", function(){
        GROUP.weighting.units[+b.dataset.imp].imp = +b.dataset.val;
        currentSub = "weighting"; paint();
        var d = document.querySelector("details.cfgwrap"); if (d) d.open = true;
      });
    });

    /* Factor weights: edited live, and the total is checked rather than
       silently normalised — 40/30/20/20 must fail loudly, not quietly
       produce an answer nobody asked for. */
    document.querySelectorAll("input.fwt").forEach(function(inp){
      inp.addEventListener("change", function(){
        var n = parseInt(inp.value, 10);
        if (!isNaN(n)) GROUP.weighting.factors[+inp.dataset.f].weight = Math.max(0, Math.min(100, n));
        paint();
      });
    });
    document.querySelectorAll("[data-rmf]").forEach(function(b){
      b.addEventListener("click", function(){
        GROUP.weighting.factors.splice(+b.dataset.rmf, 1); paint();
      });
    });
    var add = document.getElementById("addf");
    if (add) add.addEventListener("click", function(){
      GROUP.weighting.factors.push({ key:"f" + Date.now(), name:"New factor",
        kind:"judgement", basis:"describe the basis", weight:0 });
      GROUP.weighting.units.forEach(function(u){ u["f" + Date.now()] = 1; });
      paint();
    });

    /* Key Objective weights */
    document.querySelectorAll("[data-kotog]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.kotog;
        if (KO_WEIGHTS[k]) { KO_WEIGHTS[k] = null; }
        else {
          var n = UNITS[k].keyObjectives.length, base = Math.floor(100 / n), arr = [];
          for (var i = 0; i < n; i++) arr.push(base);
          arr[0] += 100 - base * n;
          KO_WEIGHTS[k] = arr;
        }
        paint();
      });
    });
    document.querySelectorAll("input.kow").forEach(function(inp){
      inp.addEventListener("change", function(){
        var p = inp.dataset.ko.split("|"), n = parseInt(inp.value, 10);
        if (!isNaN(n) && KO_WEIGHTS[p[0]]) KO_WEIGHTS[p[0]][+p[1]] = Math.max(0, Math.min(100, n));
        paint();
      });
    });

    /* Labels */
    document.querySelectorAll("input.lbl").forEach(function(inp){
      inp.addEventListener("change", function(){
        LABELS.entries[+inp.dataset.lbl][inp.dataset.scope] = inp.value || "—";
        paint();
      });
    });
    /* The "titles at this level" field went with LEVELS in 3.8. A title is
       information about a person, not a rung anyone is standing on. */

    /* Access matrix — changing a cell re-renders the navigation immediately,
       so the grid is judged by using it rather than by reading it. */
    document.querySelectorAll("[data-ac]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.ac.split("|");
        /* The row may not exist yet: a migrated tenant starts with an empty
           map and every answer coming from the shipped default. Writing a cell
           is the moment that role gets a row of its own. */
        (ACCESS[p[0]] = ACCESS[p[0]] || {})[p[1]] = p[2];
        paint();
      });
    });
    wirePillars();
    wireArrange();
    document.querySelectorAll("input[data-uname]").forEach(function(inp){
      inp.addEventListener("change", function(){
        /* Name is display only — the key is untouched, so nothing downstream
           has to be found and updated. */
        UNITS[inp.dataset.uname].name = inp.value || UNITS[inp.dataset.uname].name;
        var row = GROUP.weighting.units.filter(function(r){ return r.key === inp.dataset.uname; })[0];
        if (row) row.unit = UNITS[inp.dataset.uname].name;
        fieldSaved();                       /* §71.2 — write, do not rebuild */
      });
    });
    document.querySelectorAll("input[data-upx]").forEach(function(inp){
      inp.addEventListener("change", function(){
        UNITS[inp.dataset.upx].codePrefix = inp.value.toUpperCase().slice(0,3);
        fieldSaved();
      });
    });
    /* A unit's own mark (§52.9). The refusal is shown ON THE PAGE, because a
       save that will not happen has to say so where the save is (§42). */
    document.querySelectorAll("input[data-ulogo]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var k = inp.dataset.ulogo, f = inp.files && inp.files[0];
        inp.value = "";                       /* or the same file cannot be picked twice */
        if (!f) return;
        LOGO_NOTE = "";
        logoIntake(f).then(function(uri){
          UNITS[k].logo = uri;
          LOGO_NOTE = "";
          /* No save call: sync.js polls the serialised state every 5s and
             writes when it differs. Calling one would be a second way to
             save, and the wrong one. */
          paint();
        }, function(err){
          LOGO_NOTE = UNITS[k].name + ": " + err.message;
          paint();
        });
      });
    });
    document.querySelectorAll("[data-ulogoclear]").forEach(function(b){
      b.addEventListener("click", function(){
        /* DELETE the key rather than blanking it, so a unit with no mark is
           the same shape it was before anybody uploaded one (§52). */
        delete UNITS[b.dataset.ulogoclear].logo;
        LOGO_NOTE = "";
        paint();
      });
    });
    wireImport();
    var lc = document.querySelector("[data-lockcycle]");
    if (lc) lc.addEventListener("click", function(){ CYCLE.locked = !CYCLE.locked; paint(); });
    /* `this`, NOT A CLOSURE OVER THE ELEMENT. Reading it back off the button
       that was clicked cannot go stale, and cannot be captured by whatever
       else happens to be in this scope — see the note on `pfile` below. */
    document.querySelectorAll("[data-present]").forEach(function(b){
      b.addEventListener("click", function(){
        closeDlMenu(this);
        var t = this.dataset.present;
        if (t.indexOf("fn:") === 0) openDeckFn(t.slice(3));
        else openDeck(UNITS[t]);
      });
    });
    /* Picture slides — beside Present, because it is the deck they go into
       (§50.4). Wired here with the rest of the page's actions, in the function
       that rewrote the DOM they sit in (§29's rule: whoever rewrites the DOM
       re-wires it). */
    document.querySelectorAll("[data-picedit]").forEach(function(b){
      b.addEventListener("click", function(){
        closeDlMenu(this);
        slidesOpen(this.dataset.picedit, this.dataset.pickey);
      });
    });
    /* A capability's reporting writes back. Before the project model these
       inputs rendered and were bound to nothing at all, so a figure could be
       typed and lost on the next repaint. */
    document.querySelectorAll("[data-crep]").forEach(function(el){
      el.addEventListener("change", function(){
        var hit = capItemById(el.dataset.crep);
        if (!hit) return;
        var v = el.value.trim();
        if (v === "") { hit.obj.actual = null; }
        else if (hit.kind === "deliverable") { hit.obj.actual = Number(v); }
        else {
          var unit = el.dataset.unit || "";
          hit.obj.actual = unit && !/\s/.test(v) ? v + " " + unit : v;
          hit.obj.actual = hit.obj.actual.trim();
        }
        /* Progress is not recomputed here. It is not recomputed on a unit's
           reporting page either \u2014 a reported actual carries its score in from
           the cycle rather than being scored on the spot \u2014 and the two pages
           must behave the same way. */
        paint();
      });
    });
    document.querySelectorAll("[data-cnote]").forEach(function(el){
      el.addEventListener("change", function(){
        var hit = capItemById(el.dataset.cnote);
        if (hit) { hit.obj.note = el.value.trim() || null; paint(); }
      });
    });
    document.querySelectorAll("[data-cpick]").forEach(function(el){
      el.addEventListener("change", function(){
        var hit = capItemById(el.dataset.cpick);
        if (!hit) return;
        if (hit.kind === "milestone") hit.obj.status = el.value || null;
        else hit.obj.actual = el.value || null;
        paint();
      });
    });
    /* The rail. Which project is open belongs to the capability, so it keeps
       its place across Performance, Projects and Reporting — visible the
       whole time, which is why it is allowed to persist. */
    document.querySelectorAll("[data-urail]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.urail.split("|");
        RAIL["unit:" + p[0]] = p[1];
        paint();
        toPaneTop();
      });
    });
    /* Just the names, or the names with their detail (§60). A screen
       preference: written to localStorage and repainted, never saved. */
    /* §66. A screen preference, so it is stored and repainted — nothing here
       touches the graph and nothing here is saved to the tenant. */
    document.querySelectorAll("[data-koyear]").forEach(function(b){
      b.addEventListener("click", function(){
        setKoThisYear(!SHOW_KO_THIS_YEAR); paint();
      });
    });
    document.querySelectorAll("[data-railterse]").forEach(function(b){
      b.addEventListener("click", function(){
        RAIL_TERSE = !RAIL_TERSE;
        try { localStorage.setItem("smp.rail.terse", RAIL_TERSE ? "1" : "0"); } catch(e){}
        paint();
      });
    });
    document.querySelectorAll("[data-rail]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = capOfProjectId(b.dataset.rail);
        if (c) { RAIL[railKeyFor(c)] = b.dataset.rail; paint(); }
      });
    });
    document.querySelectorAll("[data-unav]").forEach(function(el){
      el.addEventListener("change", function(){
        UNITS[el.dataset.unav].navName = el.value.trim() || null;
        fieldSaved();
      });
    });
    document.querySelectorAll("[data-clearmenu]").forEach(function(b){
      b.addEventListener("click", function(ev){
