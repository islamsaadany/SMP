        /* Written and saved, NOT repainted (§71.2). This is every editable
           field on a plan — a pillar's name, a target, an owner, a tactic —
           and with the pen on it was rebuilding the whole page each time the
           cursor left a cell, on the one screen somebody fills in left to
           right. */
        var fn = FIELDS[+el.dataset.fld];
        if (fn) { fn(el.value); fieldSaved(); }
      });
      /* THE BOX GROWS WITH WHAT IS TYPED IN IT (§51.1, Islam: "the foundation
         end in mind is not editable in terms of space or empty lines").
         Every long-text field was `rows="2"`, so a purpose written as three
         paragraphs was typed through a two-line window — Enter worked, and you
         could not see that it had. Growing is not a repaint: it sets the
         element's own height and touches nothing else, so it is safe on
         `input` where a repaint would destroy the field being typed into
         (§35). Height is cleared first, or the box can only ever grow. */
      if (el.tagName === "TEXTAREA") {
        var fit = function(){
          el.style.height = "auto";
          el.style.height = (el.scrollHeight + 2) + "px";
        };
        el.addEventListener("input", fit);
        fit();
      }
    });
    document.querySelectorAll("[data-page]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.page; EDIT_PAGE[k] = !EDIT_PAGE[k]; paint();
      });
    });
    document.querySelectorAll("[data-sec]").forEach(function(b){
      b.addEventListener("click", function(){ GSEC = +b.dataset.sec; paint(); window.scrollTo(0,0); });
    });
    /* Cards or a table, per section (§16.6). A view preference — it changes
       how a section is laid out, never what anything is or in what order it
       is stored. */
    document.querySelectorAll("[data-gview]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.gview.split("|");

        paint();
      });
    });
    document.querySelectorAll("[data-edit]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.edit; EDITING[k] = !EDITING[k]; paint();
      });
    });
    document.querySelectorAll("input.blabel").forEach(function(inp){
      inp.addEventListener("change", function(){
        BANDS.bands[+inp.dataset.b].label = inp.value || "Unnamed"; paint();

    });
    document.querySelectorAll("input.bfloor").forEach(function(inp){
      inp.addEventListener("change", function(){

        if (!isNaN(n)) BANDS.bands[+inp.dataset.b].floor = Math.max(0, Math.min(100, n));

    /* A unit's company, and a company's two visibility flags. Both are

    document.querySelectorAll("[data-ucomp]").forEach(function(el){

        paint();
      });
    });
    /* Companies get the life every other Setup table has (§49.3): a name that
       can be typed, an Add, and a Retire that refuses while units belong. The
       KEY is untouched by a rename, exactly as a unit's is, so every `cceo`
       role and every `units.company` pointer keeps working. */
    document.querySelectorAll("input[data-coname]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var co = COMPANIES[inp.dataset.coname];
        if (co) co.name = inp.value.trim() || co.name;
        fieldSaved();
      });
    });
    document.querySelectorAll("[data-coact]").forEach(function(b){
      b.addEventListener("click", function(){
        var ck = b.dataset.coact;
        if (companyActive(ck)) retireCompany(ck); else restoreCompany(ck);

      });

    var ac = document.getElementById("addcompany");
    if (ac) ac.addEventListener("click", function(){ addCompany(); paint(); });

    /* ── The BU list (§54.1) ────────────────────────────────────────
       A name, where it points, and a Remove that is refused while anybody
       carries it. The NAME is the key here — unlike a unit or a company,
       which carry a key under the label so a rename detaches nothing — so
       renaming moves the people with it, inside renameMainbu(). */
    /* ADD AND REMOVE, one target at a time (§57). The dropdown adds and
       resets itself; the chip's × removes. Neither sends the whole list, so a
       stale screen can add something twice at worst — never silently drop the
       four somebody else mapped while this tab was open. */
    document.querySelectorAll("[data-mbadd-at]").forEach(function(sel){
      sel.addEventListener("change", function(){
        if (!this.value) return;
        addMainbuAt(this.dataset.mbaddAt, this.value);
        paint();
      });
    });
    document.querySelectorAll("[data-mbdrop]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = this.dataset.mbdrop.split("|");
        removeMainbuAt(p[0], p.slice(1).join("|"));
        paint();
      });
    });
    document.querySelectorAll("input[data-mbname]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var was = inp.dataset.mbname, now = inp.value.trim();
        if (now && now !== was && !renameMainbu(was, now)) {
          /* Refused rather than silently merged: two departments becoming one
             is a decision, and it is not one a typo gets to make. */
          alert('There is already a BU called "' + now + '". Two names cannot be merged by ' +
                'renaming one into the other \u2014 move the people first.');
        }
        paint();
      });
    });
    document.querySelectorAll("[data-mbdel]").forEach(function(b){
      b.addEventListener("click", function(){
