      /* A heading with nothing under it is a heading that lies about what the
         list contains. */
      document.querySelectorAll(".pickhead").forEach(function(h){
        var n = h.nextElementSibling, shown = false;
        while (n && n.classList.contains("pickrow")) {
          if (!n.hidden) shown = true;
          n = n.nextElementSibling;
        }
        h.hidden = !shown;
      });
      var empty = document.querySelector(".pickempty");
      if (empty) {
        empty.hidden = any || near;
      }
      var did = document.querySelector(".pickdym");
      if (did) did.hidden = !near;
      var add = document.querySelector("[data-pick-new]");
      if (add) {
        add.hidden = !needle;
        add.textContent = '+ Add \u201c' + PICKQ.trim() + '\u201d';
      }
      /* The two identifier fields appear with the Add button and go with it:
         they belong to adding somebody, not to searching for them. */
      var mk = document.querySelector(".picknew");
      if (mk) mk.hidden = !needle;
      var er = document.querySelector(".pickerr");
      if (er) { er.hidden = true; er.textContent = ""; }
      var hint = document.querySelector(".pickhint");
      if (hint) hint.hidden = !!needle;
    });
    q.focus();
  }

  /* Arrangement. One button turns handles on everywhere the viewer is
     permitted; committing a drop re-renders and restores whatever was open. */
  function wireArrange(){
    document.querySelectorAll("[data-arrange]").forEach(function(b){
      b.addEventListener("click", function(){ ARRANGE = !ARRANGE; paint(); });
    });

    /* ── REPLAYING THE GUIDED TOUR (spec 017) ────────────────────────
       The Knowledge base's one entry. It starts the story this viewer's
       roles map to and IGNORES the stored "don't show again" — that mark
       answers "should it open by itself", which is a different question
       from "show me it now", and conflating the two would leave anybody who
       once pressed it with no way back. */
    document.querySelectorAll("[data-tour-replay]").forEach(function(b){
      b.addEventListener("click", function(){ TOUR.start(this.dataset.tourReplay); });
    });

    /* ── Reporting is a MODE now (§63.1) ─────────────────────────────
       Enter from Performance, leave with Cancel. Nothing is written by either:
       every figure was already saved as it was typed. */
    document.querySelectorAll("[data-report]").forEach(function(b){
      b.addEventListener("click", function(){
        REPORTING = this.dataset.report; paint(); window.scrollTo(0,0);
      });
    });
    document.querySelectorAll("[data-repcancel]").forEach(function(b){
      b.addEventListener("click", function(){ REPORTING = null; paint(); window.scrollTo(0,0); });
    });
    /* SAVE DRAFT, AND IT SAYS THE TRUE THING (§63.2). The word is written into
       the element rather than through a repaint: paint() would replace the
       button that was just pressed, and the reassurance would vanish in the
       same frame it appeared. */
    document.querySelectorAll("[data-repsave]").forEach(function(b){
      b.addEventListener("click", function(){
        var say = this.parentElement.querySelector("[data-savesay]");
        var show = function(text, cls){
          if (!say) return;
          say.textContent = text;
          say.className = "savesay " + (cls || "");
        };
        show("Saving…", "");
        if (typeof SYNC === "undefined" || !SYNC.saveNow) { show("Saved", "ok"); return; }
        /* `"busy"` USED TO BE A SIXTH OUTCOME AND IT IS GONE (§183). It was
           answered the instant Save draft was pressed inside an autosave's
           flight, and the branch here drew "Saving…" — a word with no
           follow-up, because nothing ever told this button that the flight had
           landed. The figure did save; the screen sat on a present participle
           for ever. SYNC now parks such a caller and answers it when the next
           save settles, so the five outcomes §63 named are the whole set
           again — and this branch is deleted rather than left unreachable,
           because a branch nobody can reach is one the next reader takes for
           load-bearing (§24). */
        SYNC.saveNow(function(state){
          if (state === "saved" || state === "clean") show("Saved", "ok");
          else if (state === "offline") show("Nothing to save — no server here", "");
          else show("Not saved — see the message above", "bad");
        });
      });
    });
    /* ── ADDING AND REMOVING A PLAN ROW (§69.13) ─────────────────────
       Both re-ask `mayEditPlan()` rather than trusting the render that drew
       the button (§48.2, §62): a repaint can happen between the two, and the
       pen is the SMO's alone (§31).

       Removing is by ID, never by index — the index is the thing that goes
       stale across a repaint, and splicing a stale one takes the wrong row.
       Adding APPENDS and mints an id of its own; nothing renumbers, because
       renumberUnit() rewrites every id from POSITION and every reported
       figure, focus mark and cycle snapshot is keyed on those (§48.1). */
    document.querySelectorAll("[data-rowadd]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!mayEditPlan()) return;
        /* IN BUILD MODE A ROW IS ADDED WHOLE (§129): the same control opens
           the structured form instead of minting an empty row — the form
           applies through the same minters, so the two paths cannot drift. */
        if (BUILDER && BUILDER.target === current && builderFormFromRowadd(this.dataset.rowadd)) return;
        var a = this.dataset.rowadd.split("|"), what = a[0];
        if (what === "pillar")  { addPillar(unitLikeWritable(a[1])); }
        else if (what === "measure" || what === "tactic") {
          /* unitLikeWritable, not unitLike (§129's audit): the reading view
             hands a VIRGIN pillars function frozen empties, so the first add
             pushed into an array the function never held — accepted on
             screen, written nowhere (§50.6's fault through a fresh door). */
          var u = unitLikeWritable(a[1]), it = u && u.items[+a[2]];
          if (!it) return;
          if (what === "measure") addMeasure(it); else addTactic(it);
        }
        else if (what === "project") {
          var c = capById(a[1]);
          if (!c) return;
          var np = addProject(c);
          /* Select what was just made, or the new project is added to a rail
             that goes on showing the old one and nothing says it worked. */
          if (np) RAIL[railKeyFor(c)] = np.id;
        }
        else {
          var pr = projById(a[1]);
          if (!pr) return;
          if (what === "deliverable") addDeliverable(pr);
          else if (what === "outcome") addOutcome(pr);
          else if (what === "milestone") addMilestone(pr);
        }
        paint();
      });
    });
    /* THE QUARTER TOGGLES (§114). By id through listById, the same resolver
       every other row control uses — and §42 has classified a quarter change
       as PLAN on the server since before the screen could make one, so the
       guard here matches the refusal there. */
    document.querySelectorAll("[data-qtog]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!mayEditPlan()) return;
        var a = this.dataset.qtog.split("|"), id = a[0], q = +a[1];
        var list = listById("tactics", id);
        var t = (list || []).filter(function(x){ return x && x.id === id; })[0];
        if (!t) return;
        t["q" + q] = !t["q" + q];
        /* §145: an office write settles — a pending quarters fill loses its
           mark the moment the office touches the row. Correcting confirms. */
        gapLift(t, "quarters");
        paint();
      });
    });
    /* ── FILL THE GAPS (§145) ──────────────────────────────────────────
       The fill grant's quarter buttons: only a tactic with NO quarter at
       all is a gap (§128, §119.1), so these are only drawn there and while
       that fill is pending — the four move together under one mark, and
       clearing the last quarter is the filler's own undo. */
    document.querySelectorAll("[data-qfill]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!mayFill("u_plan")) return;
        var a = this.dataset.qfill.split("|"), id = a[0], q = +a[1];
        var list = listById("tactics", id);
        var t = (list || []).filter(function(x){ return x && x.id === id; })[0];
        if (!t) return;
        t["q" + q] = !t["q" + q];
        if (SMPRules.quartersBlank(t)) gapLift(t, "quarters");
        else gapStamp(t, "quarters");
        paint();
      });
    });
    /* Confirming a pending fill — the office's act, re-asked at the click.
       The registry is this paint's, exactly as FIELDS is (§48.2's shape). */
    document.querySelectorAll("[data-pconf]").forEach(function(b){
      b.addEventListener("click", function(){
        var e = PENDS[+b.dataset.pconf];
        if (!e || !mayAuthor(e.acKey)) return;
        gapLift(e.row, e.field);
        paint();
      });
    });
    /* ── THE GAP BAND'S CHIPS AND WALKER (§145.12) ─────────────────────
       ONE handler on the band, by delegation: gapBandRefresh() rewrites the
       chips' contents in place between paints (a repaint would destroy the
       field being typed into, §71.2), so the handler must not live on the
       nodes being rewritten. A chip is a door: it keeps fill mode on for the
       page it lands on, because the band exists only while somebody is
       filling and a door that closed the mode behind it would strand them. */
    var gband = document.querySelector("[data-gapband]");
    if (gband) gband.addEventListener("click", function(ev){
      var chip = ev.target.closest("[data-gkey]");
      if (chip){
        if (chip.dataset.gpage) EDIT_PAGE[chip.dataset.gpage] = true;
        if (chip.dataset.gsec) CURSEC[currentSub] = chip.dataset.gsec;
        if (chip.dataset.grail) RAIL[chip.dataset.grail] = chip.dataset.gcode;
        paint();
        if (typeof toPaneTop === "function") toPaneTop();
        /* §177.2: AND IT LANDS ON THE GAP IT NAMED. Islam: *"the CUS01 3
           button just opens the project."* It did exactly that — the chip
           says how many are missing there and then left you to find them,
           which on a project of five milestones is the work the button was
           supposed to save. Queued, because a real press holds the paint
           until the click lands (§30.1) and the fields do not exist until it
           has (§145.14's own fault, in the control beside it). */
        var place = chip.dataset.grail
          ? chip.dataset.grail + "|" + chip.dataset.gcode : null;
        setTimeout(function(){
          var f = gapWalkFields(place);
          if (!f.length) f = gapWalkFields();
          if (f.length) gapLight(f[0]);
        }, 0);
        return;
      }
      if (ev.target.closest("[data-fillcta]")) {
        enterFillMode(ev.target.closest("[data-fillcta]").dataset.fillcta);
        return;
      }
      if (ev.target.closest("[data-nextgap]")) gapWalk();
      if (ev.target.closest("[data-nextpend]")) pendWalk();
    });
    /* §145.14: the same two controls OUTSIDE the bar — the corner button and
       the empty-page pointer — wired directly (they are repainted, never
       rewritten in place), and never double-bound onto the bar's own. */
    document.querySelectorAll("[data-fillcta]").forEach(function(b){
      if (b.closest("[data-gapband]")) return;
      b.addEventListener("click", function(){ enterFillMode(b.dataset.fillcta); });
    });
    document.querySelectorAll("[data-nextgap]").forEach(function(b){
      if (b.closest("[data-gapband]")) return;
      b.addEventListener("click", gapWalk);
    });

    document.querySelectorAll("[data-rowoff]").forEach(function(b){
      b.addEventListener("click", function(){
        if (!mayEditPlan()) return;
        var a = this.dataset.rowoff.split("|"), list = a[0], id = a[1];
        removeRowById(listById(list, id), id);
        paint();
      });
    });
    /* ── FIRST ROWS FOR THE SURFACES THAT NEVER HAD ONE (§129's audit) ──
       The SWOT, the “Who we are” lines and a capability's objectives could
       be EDITED and never STARTED — the editors were built for correcting an
       imported plan, so an empty list rendered nothing to edit and no way to
       write the first row (§61's trap, three more times). Every add re-asks
       the shared rule rather than trusting the render that drew it (§48.2),
       and in build mode routes through the structured form. */
    document.querySelectorAll("[data-swadd]").forEach(function(b){
      b.addEventListener("click", function(){
        var a = b.dataset.swadd.split("|"), t = a[0], q = a[1];
        if (!mayAuthor("u_anal", t)) return;
        if (BUILDER && BUILDER.target === t) { openBuilderForm("swot", { target:t, q:q }); return; }
        var u = unitLikeWritable(t);
        if (!u || !u.swot || !Array.isArray(u.swot[q])) return;
        u.swot[q].push("");
        fieldSaved(); paint();
      });
    });
    document.querySelectorAll("[data-swrm]").forEach(function(b){
      b.addEventListener("click", function(){
        var a = b.dataset.swrm.split("|"), t = a[0], q = a[1], i = +a[2];
        if (!mayAuthor("u_anal", t)) return;
        var u = unitLikeWritable(t);
        if (!u || !u.swot || !Array.isArray(u.swot[q]) || u.swot[q][i] == null) return;
        if (String(u.swot[q][i]).trim() &&
            !confirm("Remove this line? This cannot be undone here.")) return;
        u.swot[q].splice(i, 1);
        fieldSaved(); paint();
      });
    });
    document.querySelectorAll("[data-clauseadd]").forEach(function(b){
      b.addEventListener("click", function(){
        var t = b.dataset.clauseadd;
        if (!mayAuthor(t === "group" ? "g_found" : "u_found", t === "group" ? null : t)) return;
        if (BUILDER && BUILDER.target === t) { openBuilderForm("clause", { target:t }); return; }
        var o = t === "group" ? GROUP : unitLikeWritable(t);
        if (!o || !Array.isArray(o.clauses)) return;
        o.clauses.push(["", ""]);
        if (o.ukey) renumberUnit(o);
        fieldSaved(); paint();
      });
    });
    document.querySelectorAll("[data-clauserm]").forEach(function(b){
      b.addEventListener("click", function(){
        var a = b.dataset.clauserm.split("|"), t = a[0], i = +a[1];
        if (!mayAuthor(t === "group" ? "g_found" : "u_found", t === "group" ? null : t)) return;
        var o = t === "group" ? GROUP : unitLikeWritable(t);
        if (!o || !Array.isArray(o.clauses) || !o.clauses[i]) return;
        if ((String(o.clauses[i][0] || "").trim() || String(o.clauses[i][1] || "").trim()) &&
            !confirm("Remove this line? This cannot be undone here.")) return;
        o.clauses.splice(i, 1);
        if (o.ukey) renumberUnit(o);
        fieldSaved(); paint();
      });
    });
    document.querySelectorAll("[data-capkoadd]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = capById(b.dataset.capkoadd);
        if (!c) return;
        var t = c.fn ? "fn:" + c.fn : null;
        if (!mayAuthor("k_found", t)) return;
        if (BUILDER && BUILDER.target === t) { openBuilderForm("capko", { capId:c.id }); return; }
        c.keyObjectives.push({ name:"", dir:"≥", target:"", compile:"Latest",
          weight:null, actual:"", progress:null });
        fieldSaved(); paint();
      });
    });
    document.querySelectorAll("[data-capkorm]").forEach(function(b){
      b.addEventListener("click", function(){
        var a = b.dataset.capkorm.split("|"), c = capById(a[0]), i = +a[1];
        if (!c || !c.keyObjectives[i]) return;
        if (!mayAuthor("k_found", c.fn ? "fn:" + c.fn : null)) return;
        if (c.keyObjectives[i].name &&
            !confirm("Remove " + c.keyObjectives[i].name + "? This cannot be undone here.")) return;
        c.keyObjectives.splice(i, 1);
        fieldSaved(); paint();
      });
    });
    document.querySelectorAll("[data-fncapadd]").forEach(function(b){
      b.addEventListener("click", function(){
        var fk = b.dataset.fncapadd;
        if (!mayAuthor("k_found", "fn:" + fk)) return;
        if (BUILDER && BUILDER.target === "fn:" + fk) { openBuilderForm("cap", { fnKey:fk }); return; }
        addCapability(fk);
        fieldSaved(); paint();
      });
    });
    /* ── THE BUILDER'S DOORS AND BAND (§129) ───────────────────────── */
    document.querySelectorAll("[data-buildplan]").forEach(function(b){
      b.addEventListener("click", function(){ openBuilderChooser(); });
    });
    /* Scoped to the band: the review dialog carries data-bnav rows of its
       own, wired by its own painter — a page-wide query here would bind
       them twice the moment a paint runs under the open dialog (§24). */
    document.querySelectorAll("#buildband [data-bnav]").forEach(function(b){
      b.addEventListener("click", function(){ builderGo(b.dataset.bnav); });
    });
    document.querySelectorAll("#buildband [data-bpause]").forEach(function(b){
      b.addEventListener("click", function(){
        BUILDER = null;
        leaveModes();
        paint();
      });
    });
    document.querySelectorAll("#buildband [data-bfinish]").forEach(function(b){
      b.addEventListener("click", function(){ builderDialogOpen("review"); });
    });

    document.querySelectorAll(".sortable").forEach(function(c){
      var kind = c.dataset.kind;
      /* THE CONTAINER SAYS WHAT IT HOLDS (§63.5). This used to pick the
         selector from `data-kind`, and "pillars" meant `.prow-wrap` — which
         does not exist inside a rail, so the rail's grips were bound to
         nothing and dragging a pillar did nothing at all, on every unit, for
         as long as the rail has had handles. Measured: 4 grips, 0 bound. */
      var sel = c.dataset.item || "tr";
      makeSortable(c, sel, function(order){
        var open = [];
        document.querySelectorAll('.prow[aria-expanded="true"]').forEach(function(r){ open.push(+r.dataset.p); });

        /* unitLike(), not UNITS[...] — a function that plans in pillars is
           drawn by these same pages and its key carries the "fn:" prefix
           (§59). Read off the CONTAINER rather than off `current`, so a
           container can never be committed against a different subject than
           the one it was rendered for. */
        var subj = unitLike(c.dataset.u || current);
        if (kind === "pillars") applyOrder(subj.items, order);
        else if (kind === "units") applyOrder(UNIT_KEYS, order);
        else if (kind === "caps") applyOrder(GROUP.capabilities, order);
        else if (kind === "themes") applyOrder(GROUP.themes, order); else {
          /* The plan states the pillar outright; the Performance accordion
             still answers by walking up to the row above it. */
          var pi;
          if (c.dataset.pi != null) pi = +c.dataset.pi;
          else {
            var body = c.closest(".pbody");
            pi = +body.previousElementSibling.dataset.p;
          }
          var it = subj.items[pi];
          applyOrder(kind === "measures" ? it.measures : it.tactics, order);
        }

        paint();
        open.forEach(function(i){
          var r = document.querySelector('.prow[data-p="' + i + '"]');
          if (r) { r.setAttribute("aria-expanded","true"); r.nextElementSibling.hidden = false; }
        });
      });
    });
  }

  /* Import. Downloading is attempted as a file and always offered as text,
     because a sandboxed frame may refuse the download and leaving the SMO with
     nothing would be worse than a copy box. */
  function csvFor(){
    if (impIsCap()) {
      var c = impCap();
      return IMP.kind === "plan" ? capPlanTemplate(c) : capProgressTemplate(c);
    }
    var u = impUnit();
    return IMP.kind === "plan" ? planTemplate(u) : progressTemplate(u);
  }
  /* A subject's name, made safe to put in a filename. Extracted from
     fileName() below, which was the only caller until the filled example
     needed the same thing — two copies of "how do we spell this in a
     filename" is two answers waiting to differ. */
  function safeFileBit(name){
    return String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "plan";
  }
  function fileName(){
    var name = impIsCap() ? impCap().name : impUnit().name;
    return safeFileBit(name) + "-" + IMP.kind + "-template.csv";
  }
  /* A plan file is READ into a summary, not diffed: it authors the plan, so
     what matters is what it holds and what that displaces (§22). Reporting is
     still a difference against what is recorded. */
  function readPlanRows(rows, label){
    IMP.read = label;
    if (impIsCap()) {
      var c = impCap();
      IMP.check = validateCapPlan(c, rows);
      IMP.summary = capReplaceSummary(c, rows);
    } else {
      var u = impUnit();
      IMP.check = validatePlan(u, rows);
      IMP.summary = planReplaceSummary(u, rows);
    }
    IMP.diff = null;
    paint();
  }
  function impFail(msg){
    IMP.check = { problems:[{ at:"the whole file", msg:msg }], notices:[] };
    IMP.summary = null; IMP.diff = null; IMP.read = "";
    paint();
  }

  function loadCSV(text){
    IMP.done = null;
    IMP.text = text;
    /* A plan arrives as a workbook, because a workbook has a Read me sheet and
       a plan file has to say which unit it is for. A flat CSV cannot say it,
       and guessing would write one unit's plan into another \u2014 the worst
       accident this flow can have. Reporting still takes a CSV: it is per unit
       and the unit is chosen on screen. */
    if (IMP.kind === "plan") {
      impFail("a plan has to arrive as the .xlsx template \u2014 its Read me sheet is what says " +
              "which unit the plan is for. Download the plan template above and fill that.");
      return;
    }
    var rows = parseCSV(text);
    if (impIsCap()) {
      var c = impCap();
      var cShape = checkCapFileShape(c, rows, "progress");
      IMP.check = cShape.length ? { problems: cShape, notices: [] } : null;
      IMP.diff = diffCapProgress(c, rows);
      IMP.summary = null;
      paint();
      return;
    }
    var u = impUnit();
    var shape = checkFileShape(u, rows, "progress");
    IMP.check = shape.length ? { problems: shape, notices: [] } : null;
    IMP.diff = diffProgress(u, rows);
    IMP.summary = null;
    paint();
  }

  /* Lifted out of wireImport() 2026-08-23 (§54.3): the People page sends a
     workbook too, and two copies of "build it, wrap it in a blob, click a
     link, revoke the URL" is the second one that gets the revoke wrong. */
  /* §47.2: the action fires BEFORE the menu closes. A `<details>` closed from
     inside its own click has not unmounted the button the click is still in —
     it hides it — so this is safe where removing the node would not be. */
  function closeDlMenu(el){
    var d = el.closest("details.dlmenu");
    if (d) d.open = false;
  }

  /* THE BANDS PANEL SHUTS ON A CLICK OUTSIDE (§163, Islam: "close on clicking
     outside it or clicking on the button again"). The second half is what a
     `<details>` already does; the first is not, and no dropdown in the product
     had it before.

     SCOPED TO THIS PANEL, DELIBERATELY. Presentation and the header dropdowns
     are the same `<details class="dlmenu">` and they stay as they are — this
     was asked for one control and widening it silently would change three
     others nobody mentioned (rule 1c). The cost is that two identical-looking
     dropdowns now dismiss differently, which is worth flagging rather than
     hiding: it is a candidate for making general, not a decision already made.

     `pointerdown`, not `click`: a panel that lingers until the mouse comes up
     reads as having missed the press (§100.4). Bound ONCE on the document,
     never per paint — this row is rebuilt on every render and a per-render
     binding would stack (§24, §47.2). */
  document.addEventListener("pointerdown", function(e){
    document.querySelectorAll("details.bandsmenu[open]").forEach(function(d){
      if (!d.contains(e.target)) d.open = false;
    });
  }, true);

  function sendXlsx(sheets, name){
    /* The blob dance itself lives in pptx.js as sendFileBytes() since §117 —
       this was about to be one of three copies, and three is where the rule
       says extract. */
    sendFileBytes(buildXlsx(sheets), name,
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  function wireImport(){
    var us = document.getElementById("imp-unit");
    if (us) us.addEventListener("change", function(){ IMP.unit = us.value; IMP.diff = null; paint(); });

    document.querySelectorAll("[data-impkind]").forEach(function(b){
      b.addEventListener("click", function(){ IMP.kind = b.dataset.impkind; IMP.diff = null; paint(); });
    });

    /* THE PLAN TEMPLATE IS GENERIC, IN BOTH FORMATS (§22, §61): built against
       an empty shape rather than a chosen subject's content, with the subject
       named on the Read me sheet. Two files, one menu. */
    document.querySelectorAll("[data-dlplan]").forEach(function(b){
      b.addEventListener("click", function(){
        closeDlMenu(this);
        if (this.dataset.dlplan === "projects")
          sendXlsx(capPlanWorkbook(blankCapShape()), "SMP - projects plan template.xlsx");
        else
          sendXlsx(planWorkbook(blankUnitShape()), "SMP - pillars plan template.xlsx");
      });
    });

    /* A PROGRESS FILE IS NOT GENERIC — it is one subject's current rows, so
       the subject travels with the format. Choosing a format the selected
       subject does not keep moves the selection to the first that does AND
       repaints, so the select shows exactly what was downloaded rather than
       leaving a file arriving from a list that says something else. */
    document.querySelectorAll("[data-dlprog]").forEach(function(b){
      b.addEventListener("click", function(){
        closeDlMenu(this);
        var want = this.dataset.dlprog;
        if (impFmtOf(IMP.unit) !== want) {
          var first = impSubjects(want)[0];
          if (!first) {
            alert(want === "projects"
              ? "There are no capabilities yet, so there is no projects file to download."
              : "There are no business units yet, so there is no pillars file to download.");
            return;
          }
          IMP.unit = first.v; IMP.diff = null; IMP.summary = null; IMP.read = "";
        }
        var sheets = impIsCap() ? capProgressWorkbook(impCap()) : progressWorkbook(impUnit());
        sendXlsx(sheets, fileName().replace(/\.csv$/, ".xlsx"));
        paint();
      });
    });

    /* ── THE FILLED EXAMPLE (§69.12) ─────────────────────────────────
       The FORMAT IS READ OFF THE SUBJECT, here as everywhere (§61): the
       select's value is a unit key, `fn:<key>` or `cap:<id>`, and that is
       already the whole answer. Nothing stores which workbook to build.

       The selection is read off the control at the moment of pressing rather
       than tracked on `change`, because nothing here repaints — the only
       reason IMP.filled exists at all is so a repaint caused by something ELSE
       on this page does not throw the choice away (§35). */
    var fsel = document.getElementById("imp-filled");
    if (fsel) fsel.addEventListener("change", function(){ IMP.filled = fsel.value; });
    document.querySelectorAll("[data-dlfilled]").forEach(function(b){
      b.addEventListener("click", function(){
        var sel = document.getElementById("imp-filled");
        var v = sel ? sel.value : IMP.filled;
        if (!v) return;
        IMP.filled = v;
        if (v.indexOf("cap:") === 0) {
          var c = capById(v.slice(4));
          if (!c) return;
          sendXlsx(capPlanWorkbook(c),
            "SMP - projects plan - " + safeFileBit(c.name) + ".xlsx");
          return;
        }
        /* unitLike(), not UNITS[...] — a function that plans in pillars is one
           of these and its key carries the "fn:" prefix (§59). */
        var u = unitLike(v);
        if (!u) return;
        sendXlsx(planWorkbook(u), "SMP - pillars plan - " + safeFileBit(u.name) + ".xlsx");
      });
    });

    var dl = document.querySelector("[data-dl]");
    if (dl) dl.addEventListener("click", function(){
      sendFileBytes(csvFor(), fileName(), "text/csv;charset=utf-8");
    });

    var show = document.querySelector("[data-showcsv]");
    if (show) show.addEventListener("click", function(){
      openModalHtml(esc(fileName()), "Select all and copy, if the download is blocked",
        '<textarea class="csvbox" readonly>' + csvFor().replace(/</g, "&lt;") + '</textarea>');
    });

    var f = document.getElementById("imp-file");
    if (f) f.addEventListener("change", function(){
      if (grant("c_import") !== "edit") return;
      var file = f.files && f.files[0]; if (!file) return;
      if (/\.xlsx$/i.test(file.name)) {
        var rx = new FileReader();
        rx.onload = function(){
          readXlsx(rx.result).then(function(sheets){
            /* The template is generic, so the file itself says whose plan it
               is: one cell on the Read me sheet. Nothing else in the workbook
               names a unit, and with the codes gone nothing else could. */
            if (IMP.kind === "plan") {
              var picked = readmePick(sheets);
              if (!picked) {
                impFail(impIsCap()
                  ? "no capability chosen. Open the Read me sheet and pick one from the dropdown in B2 \u2014 the platform cannot tell whose plan this is."
                  : "no business unit chosen. Open the Read me sheet and pick one from the dropdown in B2 \u2014 the platform cannot tell whose plan this is.");
                return;
              }
              var uk = UNIT_KEYS.filter(function(k){ return UNITS[k].name === picked; })[0];
              /* A FUNCTION THAT PLANS IN PILLARS IS A PLAN SUBJECT (§61). Its
                 plan lives on the function, so the pillars template offers it
                 on the Read me sheet beside the units — and the upload has to
                 be able to resolve the name it just offered. */
              var fk = uk ? null : FUNCTION_KEYS.filter(function(k){
                var f = FUNCTIONS[k];
                return f.active !== false && fnPlansInPillars(f) && f.name === picked;
              })[0];
              /* ONE NAMING IN THE FILE (§51.19). Islam: "I don't think we
                 should have the capability file with 2 namings capability and
                 function. we can just upload with the capability and we
                 connect the function on the platform … to avoid the confusion
                 between the 2 templates."

                 §51.2 put a Supporting function row in the workbook so two
                 functions with a similarly named capability could be told
                 apart. It solved that and made a worse problem: the file then
                 carried TWO names that had to AGREE, and a workbook whose
                 halves disagreed was refused — "no capability called Customer
                 Centric under Customer Experience" — for a link the PLATFORM
                 owns and can see. Which function carries a capability is a
                 Setup decision, made on the Capabilities page (§51.11).

                 THE AMBIGUITY IS ANSWERED HERE INSTEAD, and better: two
                 capabilities sharing a name are refused BY NAME, naming both
                 functions, rather than resolved by whichever came first in the
                 array. That was the silent wrong-plan §51.2 feared, and it is
                 now caught at the one moment somebody can still act on it. */
              var caps = GROUP.capabilities.filter(function(x){ return x.name === picked; });
              var cp = caps[0];
              if (!uk && !fk && caps.length > 1) {
                impFail('two capabilities are called "' + esc(picked) + '" \u2014 under ' +
                  caps.map(function(x){
                    var f = FUNCTIONS[x.fn];
                    return f ? esc(f.name) : "no function";
                  }).join(" and ") + '. Rename one on Setup \u2192 Capabilities, then upload again.');
                return;
              }
              if (!uk && !fk && !cp) {
                impFail('no business unit, supporting function or capability called "' +
                  esc(picked) +
                  '". Open the Read me sheet and choose one from the dropdown in B2.');
                return;
              }
              IMP.unit = uk ? uk : fk ? "fn:" + fk : "cap:" + cp.id;
              if (!uk && !fk && cp) {
                var cRows = capPlanFromWorkbook(cp, sheets);
                readPlanRows(cRows, cp.name + " \u00b7 " + cRows.length + " rows");
              } else {
                var pu = impUnit();
                var pRows = planFromWorkbook(pu, sheets);
                readPlanRows(pRows, pu.name + " \u00b7 " + pRows.length + " rows");
              }
              return;
            }
            if (impIsCap()) {
              var c = impCap();
              var cpRows = capProgressFromWorkbook(c, sheets);
              var cShape = checkCapFileShape(c, cpRows, "progress");
              IMP.check = cShape.length ? { problems: cShape, notices: [] } : null;
              IMP.diff = diffCapProgress(c, cpRows);
              IMP.summary = null;
              paint();
              return;
            }
            var u = impUnit();
            var rows = progressFromWorkbook(u, sheets);
            var shape = checkFileShape(u, rows, "progress");
            IMP.check = shape.length ? { problems: shape, notices: [] } : null;
            IMP.diff = diffProgress(u, rows);
            IMP.summary = null;
            paint();
          }).catch(function(e){
            IMP.check = { problems:[{ at:file.name, msg:"could not be read as a workbook \u2014 " + e.message }], notices:[] };
            IMP.diff = null; IMP.summary = null; IMP.read = "";
            paint();
          });
        };
        rx.readAsArrayBuffer(file);
        return;
      }
      var rd = new FileReader();
      rd.onload = function(){ loadCSV(String(rd.result)); };
      rd.readAsText(file);
    });

    var paste = document.querySelector("[data-paste]");
    if (paste) paste.addEventListener("click", function(){
      openModalHtml("Paste the filled file", "",
        '<textarea class="csvbox" id="pastebox" placeholder="Paste the CSV here"></textarea>' +
        '<div class="imp-row" style="margin-top:12px"><button class="editbtn" id="pasteok">Read it</button></div>');
      document.getElementById("pasteok").addEventListener("click", function(){
        var t = document.getElementById("pastebox").value;
        closeModal();
        if (t.trim()) loadCSV(t);
      });
    });

    var ap = document.querySelector("[data-apply]");
    if (ap) ap.addEventListener("click", function(){
      /* THE LAST GATE, and the one that actually protects the data: applying a
         plan archives and replaces a whole unit's plan in memory before any
         save is attempted. Checked here rather than trusted from the page that
         drew the button (§48.2). */
      if (grant("c_import") !== "edit") {
        alert("Importing is the SMO's. Nothing has been applied.");
        return;
      }
      var what, arch;
      if (IMP.kind === "plan") {
        var sm = IMP.summary, inc = sm.incoming;
        if (impIsCap()) {
          var cc = impCap();
          arch = applyCapPlanReplace(cc, sm.rows);
          what = plural(inc.projects, "project") + ", " +
                 plural(inc.objectives, "objective") + " written.";
          IMP.done = { unit:cc.name, key:cc.id, fn:cc.fn, what:what, archived:arch };
        } else {
          /* WRITABLE, not the reading view — a plan applied to fnAsUnit()'s
             throwaway object is reported as written and is not (§61). */
          var uu = unitLikeWritable(IMP.unit);
          arch = applyPlanReplace(uu, sm.rows);
          var wfk = fnKeyOfTarget(IMP.unit);
          if (wfk) fnWriteBack(wfk, uu);
          /* The tenant's own word for a pillar, which the label registry holds
             in the plural because that is how it is used in headings. */
          what = plural(inc.pillars, L("pillar", "bu").toLowerCase().replace(/s$/, "")) + ", " +
                 plural(inc.measures, "measure") + ", " +
                 plural(inc.tactics, "tactic") + " written.";

        }

        what = ch + " figure" + (ch === 1 ? "" : "s") + " updated.";
        if (impIsCap()) {
          var c = impCap();
          applyCapProgress(c, IMP.diff);
          IMP.done = { unit:c.name, key:c.id, fn:c.fn, what:what };
        } else {
          var u = impUnit();
          applyProgress(u, IMP.diff);
          IMP.done = { unit:u.name, key:u.ukey, what:what };
        }
      }
      IMP.diff = null; IMP.summary = null; IMP.text = ""; IMP.check = null; IMP.read = "";
      paint();
    });

    /* Archived plans: restore one, or forget it for good. Forgetting asks,
       because it is the only act in the import flow that actually destroys
       something. */
    document.querySelectorAll("[data-restore]").forEach(function(b){
      b.addEventListener("click", function(){

      });
    });

    document.querySelectorAll("[data-gofn]").forEach(function(b){

  }

  wireDeck();
  wireSlides();

  var overlay = document.getElementById("overlay");
  /* ══ THE MODAL IS ACTUALLY MODAL NOW (§48.4) ══════════════════════
     Three faults, one shape: the dialog announced itself as `aria-modal` and
     then behaved like a panel. One Tab left it and landed in the page behind,
     which was neither `inert` nor `aria-hidden`; Escape closed it but dropped
     focus to <body> rather than back to the control that opened it; and while
     CLOSED it stayed in the tab order and in the accessibility tree, so every
     screen in the product carried a stray "Close" button and a permanently
     announced empty dialog.

     That last one is §3.2's own lesson arriving in a different tree: opacity:0
     hides a box, it does not remove it. `inert` on the page behind is what the
     platform already needed and what the deck needs too.

     The pattern is not invented here — searchsel.js already does exactly this
     for its popup: open, move focus in; close, put focus back where it was. */
  var modalReturn = null;
  var wrapEl = document.querySelector(".wrap");
  /* ONE WAY IN, for the same reason §48.4 gave: the inert page behind, the
     remembered focus and the announced dialog are what MAKE it a modal, and a
     caller that sets `.on` by hand gets a dialog that only looks like one.
     There were two such callers — the CSV box and the paste box — and they had
     both been left behind when the dialog was fixed. */
  function openModalHtml(title, sub, body){
    modalReturn = document.activeElement;
    document.getElementById("modal-t").innerHTML = title || "";
    document.getElementById("modal-s").innerHTML = sub || "";
    document.getElementById("modal-b").innerHTML = body || "";
    overlay.classList.add("on");
    overlay.removeAttribute("aria-hidden");
    if (wrapEl) { wrapEl.inert = true; wrapEl.setAttribute("aria-hidden", "true"); }
    document.getElementById("modal-x").focus();

  /* ── THE MERGE WIZARD LIVES IN THAT DIALOG (§90.4) ────────────────
     `mergePaint()` rewrites the modal's own body and re-wires it, rather than
     calling paint(): paint() rebuilds the register behind an inert overlay and
     would leave the dialog showing a step nobody chose — and the elements its
     handlers are bound to would be gone. This is §30.1's rule from the other
     side: whoever rewrites the DOM re-wires it, in the same function (§24). */
  /* ══ THE PERSON DIALOG'S OWN PAINT (§116) ══════════════════════════
     `mergePaint()`'s rule, and for the same reason (§90.4): this rewrites the
     DIALOG's body and re-wires it rather than calling paint(), because paint()
     rebuilds the register behind an inert overlay and would leave every handler
     in here bound to elements that no longer exist.

     THE REGISTER BEHIND IS REPAINTED ONLY WHEN THE DIALOG CLOSES. Islam, asked
     whether covering it mattered: "no problem I care more about the edit
     dialogue I don't need to see the full register." So nothing tries to keep
     the two in step while it is open — which is what makes this safe. */
  function personDialogPaint(){
    var t = PEOPLEDLG.title();
    var el = document.getElementById("modal-t");
    if (!el) return;
    el.textContent = t.t;
    document.getElementById("modal-s").textContent = t.s;
    document.getElementById("modal-b").innerHTML =
      PEOPLEDLG.html() + '<div class="pdfoot">' + PEOPLEDLG.foot() + '</div>';
    wirePersonDialog();
  }
  function openPersonDialog(cfg){
    PDLG = cfg;
    PMENU = null;
    ROLESTOP = null;
    if (cfg.mode !== "add") rowEditOpen("people", cfg.key, personBy(cfg.key));
    var t = PEOPLEDLG.title();
    openModalHtml(esc(t.t), esc(t.s),
      PEOPLEDLG.html() + '<div class="pdfoot">' + PEOPLEDLG.foot() + '</div>');
    /* NARROWER THAN THE PLATFORM'S OTHER DIALOGS (§122). `.modal` is
       `min(940px,100%)` for every modal in the product — the merge wizard, the
       send confirmation, the paste box — so the width is marked on the OVERLAY
       for this one rather than loosened for all of them. Removed in
       closeModal(), which is the one door every way out goes through
       (§116.6), so it can never be left on a dialog that is not this one. */
    overlay.classList.add("pdlg-on");
    wirePersonDialog();
    /* The cursor lands in the first field, and NEVER scrolls to get there
       (§110.7) — the dialog is already in view, and letting the browser scroll
       to a focused field is what threw the register's rows about. */
    focusNoScroll(document.querySelector('#modal-b .pdf input.fld'));
  }
  /* CLOSING IS WHERE THE REGISTER CATCHES UP. One door for all four ways out,
     so a mode that forgot to clear PDLG cannot leave the page believing a
     dialog is open (§24). */
  function closePersonDialog(cancel){
    if (cancel) rowEditCancel(); else rowEditClose();
    if (PDLG && PDLG.mode === "add") newDraftEnd();
    PDLG = null;
    ADDROLE = null; ADDROLE_KIND = ""; ROLESTOP = null;
    closeModal();
    if (typeof SYNC !== "undefined" && SYNC.afterPaint) SYNC.afterPaint();
    paint();
  }
  function wirePersonDialog(){
    var body = document.getElementById("modal-b");
    if (!body) return;
    /* THE FIELDS ARE THE PAGE'S OWN, so they are wired by the page's own
       wiring. `wireFields` binds every `data-p*` on whatever it is given
       (§71.2), which is why moving the form into a dialog needed no second set
       of handlers — and SEARCHSEL is re-applied because these selects were
       built a moment ago (§45.5). */
    wirePersonFields(body);
    if (typeof SEARCHSEL !== "undefined") SEARCHSEL.wire(body);
    /* The Unit select, the Official BU select, the role picker and "Use it" are
       the register's own controls and are wired by the same functions the page
       uses — scoped to this body for the same reason the fields are. */
    wirePersonDialogControls(body);
    body.querySelectorAll("[data-pdlg-close]").forEach(function(b){
      b.addEventListener("click", function(){ closePersonDialog(false); });
    });
    body.querySelectorAll("[data-pdlg-cancel]").forEach(function(b){
      b.addEventListener("click", function(){ closePersonDialog(true); });
    });
    body.querySelectorAll("[data-pdlg-skip]").forEach(function(b){
      b.addEventListener("click", function(){ personDialogStep(true); });
    });
    body.querySelectorAll("[data-pdlg-next]").forEach(function(b){
      b.addEventListener("click", function(){ personDialogStep(false); });
    });
    body.querySelectorAll("[data-pdlg-add]").forEach(function(b){
      b.addEventListener("click", personDialogAdd);
    });
    /* THE SECOND PRESS, and it is a different button rather than the same one
       pressed twice (§87.3): "I have checked, they are two people" is a
       different sentence from "Add", and a control that means one thing the
       first time and another the second is one nobody can undo. */
    body.querySelectorAll("[data-pdlg-anyway]").forEach(function(b){
      b.addEventListener("click", function(){
        NEWPERSON.forced = true;
        personDialogAdd();
      });
    });
    /* Opening the row they collided with abandons the draft — there is nothing
       to add if the answer is "they are already here". */
    body.querySelectorAll("[data-pgo]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.pgo;
        closePersonDialog(false);
        openPersonDialog({ key:k, mode:"edit" });
      });
    });
  }
  /* ── SAVE AND MOVE TO THE NEXT, IN THE SAME PLACE (§116.2) ──────────
     `skip` differs from `next` in one thing only — whether this person's edits
     are kept — because leaving somebody for later must not also throw away what
     was typed before deciding to leave them. Both walk the SAME stored list:
     see PDLG's note on why the queue is not re-asked as it goes. */
  function personDialogStep(skip){
    if (!PDLG || !PDLG.queue) return;
    if (skip) rowEditCancel(); else rowEditClose();
    var at = PDLG.at + 1;
    /* A ROW CAN LEAVE THE REGISTER WHILE THE QUEUE IS OPEN — a merge is one
       press away from here — so each step checks the next person still exists
       rather than trusting the list (§48.2). */
    while (at < PDLG.queue.length && !personBy(PDLG.queue[at].key)) at++;
    if (at >= PDLG.queue.length) { closePersonDialog(false); return; }
    PDLG.at = at;
    PDLG.key = PDLG.queue[at].key;
    ADDROLE = null; ADDROLE_KIND = ""; ROLESTOP = null;
    rowEditOpen("people", PDLG.key, personBy(PDLG.key));
    personDialogPaint();
    focusNoScroll(document.querySelector('#modal-b .pdf input.fld'));
  }
  /* ── ADDING THEM IS THE SAME LADDER THE FILE CLIMBS (§87) ───────────
     Emp ID, then email, and no third rung. A name stops nothing — two people
     really can share one — so a clash on either identifier is REFUSED by
     naming who, and a matching name is only ever a warning. */
  function personDialogAdd(){
    if (!NEWDRAFT) return;
    /* ── COMMIT WHATEVER IS STILL BEING TYPED (§116.3) ────────────────
       Every field writes itself on `change`, which for a text input means on
       BLUR — so the last box somebody typed in has not been written yet at the
       moment they reach for this button. A mouse click blurs it on the way
       past and the keyboard usually has too, which is exactly the kind of
       almost-always that hides a fault: found by a check whose `fill` fires
       `input` and never blurs, and the address it had just typed was not on the
       draft when the identity ladder asked (§87).

       So the field is closed here rather than trusted to have closed itself. */
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var nm = String(NEWDRAFT.name || "").trim();
    if (!nm) {
      NEWPERSON.hit = null; NEWPERSON.warn = null;
      NEWPERSON.err = "A name is the one thing needed.";
      personDialogPaint();
      return;
    }
    /* TWO ARGUMENTS, NOT AN OBJECT (§87). `personByIdentity(id, email)` climbs
       the ladder — employee number, then address, and no third rung — and
       handing it an object made every rung miss, so the stop never fired and a
       second row for somebody already here went straight in. Found by the
       check that exists for exactly that. */
    var chk = personByIdentity(NEWDRAFT.empId, NEWDRAFT.email);
    if (chk && chk.person && !NEWPERSON.forced) {
      NEWPERSON.hit = chk.person.key; NEWPERSON.hitBy = chk.by;
      personDialogPaint();
      return;
    }
    /* THROUGH THE ONE DOOR (§54.1). `addPerson` mints the key, attaches the
       person and is what the file importer and the assignment picker both call
       — so the dialog hands it the same shape they do rather than pushing onto
       PEOPLE itself. It answers with the KEY, not the person. */
    var key = addPerson({ name:nm, title:NEWDRAFT.title, phone:NEWDRAFT.phone,
                          empId:NEWDRAFT.empId, email:NEWDRAFT.email,
                          mainbu:NEWDRAFT.mainbu, where:personAt(NEWDRAFT) });
    var made = personBy(key);
    if (!made) { closePersonDialog(false); return; }
    /* The one field addPerson does not take: what they are CALLED, as opposed
       to their full name (§93.8). Written through setKnownName so it is deleted
       rather than stored when it matches the guess (§50.6). */
    if (NEWDRAFT.known) setKnownName(made, NEWDRAFT.known);
    newPersonReset();
    newDraftEnd();
    PDLG = null;
    closeModal();
    if (typeof SYNC !== "undefined" && SYNC.afterPaint) SYNC.afterPaint();
    paint();
  }

  function mergeOpen(){
    openModalHtml("Merge two rows", "", mergeStepHtml());
    wireMerge();
  }
  function mergePaint(){
    var body = document.getElementById("modal-b");
    if (!body) return;
    body.innerHTML = mergeStepHtml();
    wireMerge();
  }
  function wireMerge(){
    var body = document.getElementById("modal-b");
    if (!body) return;
    function pickOther(key){
      PMERGE.b = key || null;
      /* The survivor and the field answers belong to the PAIR, so choosing a
         different second row starts both again rather than carrying an answer
         across to fields it was never about. */
      PMERGE.keep = key ? mergeDefaultKeep(PMERGE.a, key) : null;
      PMERGE.picks = {}; PMERGE.err = null;
      mergePaint();
    }
    body.querySelectorAll("[data-pmerge-b]").forEach(function(b){
      b.addEventListener("click", function(){ pickOther(b.dataset.pmergeB); });
    });
    body.querySelectorAll("[data-pmerge-sel]").forEach(function(sel){
      sel.addEventListener("change", function(){ pickOther(sel.value); });
    });
    body.querySelectorAll("[data-pmerge-step]").forEach(function(b){
      b.addEventListener("click", function(){
        PMERGE.step = Number(b.dataset.pmergeStep) || 1;
        PMERGE.err = null;
        mergePaint();
      });
    });
    body.querySelectorAll("[data-pmerge-keep]").forEach(function(r){
      r.addEventListener("change", function(){
        PMERGE.keep = r.dataset.pmergeKeep;
        /* Swapping which row survives turns every field answer round — "keep
           mine" now means the other value — so the answers are dropped rather
           than silently reinterpreted. */
        PMERGE.picks = {}; PMERGE.err = null;
        mergePaint();
      });
    });
    body.querySelectorAll("[data-pmerge-pick]").forEach(function(r){
      r.addEventListener("change", function(){
        var p = r.dataset.pmergePick.split("|");
        PMERGE.picks[p[0]] = p[1] === "take";
        mergePaint();
      });
    });
    body.querySelectorAll("[data-pmerge-close]").forEach(function(b){
      b.addEventListener("click", function(){ mergeReset(); closeModal(); paint(); });
    });
    body.querySelectorAll("[data-pmerge-go]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.pmergeGo.split("|");
        var keepName = (personBy(p[0]) || {}).name || p[0];
        var dropName = (personBy(p[1]) || {}).name || p[1];
        var r = mergePeople(p[0], p[1], PMERGE.picks);
        /* A REFUSAL STAYS IN THE DIALOG. mergePeople() ends in deletePerson(),
           which refuses if anything still points at the row (§87.4) — that is
           the check, and its sentence has to be read where the button was. */
        if (!r.ok) { PMERGE.err = r.why; PMERGE.step = 3; mergePaint(); return; }
        /* THE DIALOG STAYS OPEN TO SAY WHAT IT DID (§93.5). It used to close
           and leave a "Merge two rows" section standing under the register —
           a notification on a table page, which is what §90 moved the other
           two steps in here to stop.

           mergeReset() FIRST and `done` after it, because the reset clears
           every field of PMERGE including that one. paint() repaints the
           register BEHIND the overlay — safe, and necessary, because the
           overlay is outside the wrap paint() rewrites and paint() is where a
           change becomes a save. mergePaint() then draws the receipt. */
        mergeReset();
        PMERGE.done = dropName + "\u2019s row was merged into " + keepName + ".";
        paint();
        mergePaint();
      });
    });
  }

  function openModal(id){
    var m = MODALS[id]; if (!m) return;
    openModalHtml(m.title, m.sub || "", m.body);
  }
  function closeModal(){
    if (!overlay.classList.contains("on")) return;
    overlay.classList.remove("on");
    overlay.classList.remove("pdlg-on");
    overlay.setAttribute("aria-hidden", "true");
    if (wrapEl) { wrapEl.inert = false; wrapEl.removeAttribute("aria-hidden"); }

       cannot do for themselves, because the thing they pressed is behind a
       dialog they have just dismissed. */
    if (modalReturn && document.contains(modalReturn)) modalReturn.focus();
    modalReturn = null;
    /* ── AND THE BODY IS EMPTIED (§116.6) ──────────────────────────────
       A closed dialog used to keep its markup, which was harmless while the
       merge wizard was the only thing in here: a few buttons nobody could
       reach. The person dialog is a FORM, and `wirePersonFields(document)` runs
       on every paint — so a form left standing in the hidden overlay collected
       a second handler on every repaint, for ever, each one writing the same
       value again. §24 and §47.2's fault, arriving through a dialog rather than
       a menu.

       It also settles §3.2's older one: hidden is not gone, and a form nobody
       can see is still in the tab order until something removes it. */
    document.getElementById("modal-b").innerHTML = "";
    document.getElementById("modal-t").textContent = "";
    document.getElementById("modal-s").textContent = "";
  }
  overlay.setAttribute("aria-hidden", "true");   /* closed at boot */
  /* ── EVERY WAY OUT IS THE SAME WAY OUT (§116.6) ────────────────────
     The × and Escape closed the overlay directly, which for the merge wizard
     was the whole of it. The person dialog has state behind it — `PDLG`, the
     row snapshot `ROWEDIT` holds, and a draft person that belongs to nobody —
     so a way out that skips `closePersonDialog` leaves the page believing a
     dialog is open and the next Cancel restoring somebody who is no longer on
     screen. Both go through the one door now, and it treats them as KEEPING
     what was typed: every field has already written itself (§71.2), so throwing
     it away on the × would discard edits the register has already shown. */
  /* ══ THE PLAN BUILDER'S DIALOGS AND NAVIGATION (§129, spec 020) ══════
     The shell's half: everything that needs paint(), the modal, or the
     navigation state the closure holds. The HTML and the data logic live in
     builder.js; this half never mints a row and never counts one — it opens
     doors, moves the navigation, and wires what builder.js rendered
     (whoever rewrites the DOM re-wires it, §24, §30.1). */
  var BDLG = null;   /* "choose" | "form" | "review" while a builder dialog is open */
  function builderDialogOpen(kind){
    BDLG = kind;
    openModalHtml("", "", "");
    builderDialogPaint();
  }
  /* The dialog's own painter (§116's shape): it rewrites the DIALOG's body
     and re-wires it rather than calling paint(), which would rebuild the
     page behind an inert overlay mid-interaction. */
  function builderDialogPaint(){
    if (!BDLG) return;
    var t = document.getElementById("modal-t"), s = document.getElementById("modal-s"),
        b = document.getElementById("modal-b");
    if (!t) return;
    if (BDLG === "choose") {
      t.textContent = "Build a plan"; s.textContent = "Whose plan is this?";
      b.innerHTML = builderChooserHtml();
      wireBuilderChooser(b);
    } else if (BDLG === "form") {
      var def = bformDef(BFORM.kind, BFORM.ctx);
      t.textContent = def.title;
      s.textContent = BUILDER ? builderSubjectName(BUILDER.target) : "";
      b.innerHTML = bformHtml();
      wireBuilderForm(b);
      focusNoScroll(b.querySelector("input.bfi, textarea.bfi"));
    } else if (BDLG === "review") {
      t.textContent = "The plan as it stands";
      s.textContent = builderSubjectName(BUILDER.target);
      b.innerHTML = builderReviewHtml(BUILDER.target);
      wireBuilderReview(b);
    }
  }
  /* One door out, whatever the way (§116.6): the ×, Escape, Cancel and every
     finished act all land here, so a dialog can never leave BDLG believing
     it is still open. Nothing needs rescuing — a form writes nothing until
     Add, so dismissal IS cancel. */
  function builderDialogClose(){
    BDLG = null; BFORM = null; BCHOOSE = null;
    closeModal();
  }
  function openBuilderChooser(){
    BCHOOSE = { side:"units", confirm:null };
    builderDialogOpen("choose");
  }
  function openBuilderForm(kind, ctx){
    BFORM = { kind:kind, ctx:ctx || {}, draft:{}, added:0 };
    bformSeedDefaults();
    builderDialogOpen("form");
  }
  function bformSeedDefaults(){
    (bformDef(BFORM.kind, BFORM.ctx).fields || []).forEach(function(f){
      if (f.type === "seg" && f.def != null) BFORM.draft[f.k] = f.def;
    });
  }
  /* Entering: the subject becomes the destination, the first section opens
     with its pen on. leaveModes() first — it clears EDIT_PAGE, so the pen is
     switched on AFTER it, never before. */
  function builderStart(target){
    builderEnsureCapability(target);
    BUILDER = { target: target };
    builderDialogClose();
    var first = builderSections(target)[0];
    current = target;
    builderGo(first ? first.k : "review");
  }
  function builderGo(k){
    if (!BUILDER) return;
    var sec = builderSectionByKey(BUILDER.target, k);
    if (!sec) return;
    if (k === "review") { builderDialogOpen("review"); return; }
    if (currentSub !== sec.tab) leaveModes();
    currentSub = sec.tab;
    CURSEC[sec.tab] = sec.sec;
    if (sec.pen) EDIT_PAGE[sec.pen] = true;
    paint();
    window.scrollTo(0, 0);

  function wireBuilderChooser(body){
    body.querySelectorAll("[data-bside]").forEach(function(b){
      b.addEventListener("click", function(){
        BCHOOSE.side = b.dataset.bside; BCHOOSE.confirm = null;
        builderDialogPaint();
      });
    });
    body.querySelectorAll("[data-bcont]").forEach(function(b){
      b.addEventListener("click", function(){ builderStart(b.dataset.bcont); });
    });
    body.querySelectorAll("[data-bpick]").forEach(function(b){
      b.addEventListener("click", function(){
        var t = b.dataset.bpick;
        /* A standing plan is never overwritten on one press: the row turns
           into the question, and the answer archives first (§49.2). */
        if (builderHasPlan(t)) { BCHOOSE.confirm = t; builderDialogPaint(); }
        else builderStart(t);
      });
    });
    body.querySelectorAll("[data-bfresh]").forEach(function(b){
      b.addEventListener("click", function(){
        builderStartFresh(b.dataset.bfresh);
        fieldSaved();
        builderStart(b.dataset.bfresh);
      });
    });
    body.querySelectorAll("[data-bnofresh]").forEach(function(b){
      b.addEventListener("click", function(){ BCHOOSE.confirm = null; builderDialogPaint(); });
    });
    body.querySelectorAll("[data-bnew]").forEach(function(b){
      b.addEventListener("click", function(){
        openBuilderForm(b.dataset.bnew === "unit" ? "newunit" : "newfn", {});
      });
    });
  }
  function wireBuilderForm(body){
    var refresh = function(){
      if (!BFORM) return;
      var def = bformDef(BFORM.kind, BFORM.ctx);
      var miss = bformMissing(def, BFORM.draft);
      var line = body.querySelector(".bfmiss");
      if (line) {
        line.hidden = !miss.length;
        line.innerHTML = 'Still empty: <b>' + esc(miss.join(", ")) +
          '</b> — the row is added anyway and reads as missing ' +
          (miss.length === 1 ? 'it' : 'these') + '.';
      }
      var reqk = (def.fields.filter(function(f){ return f.req; })[0] || {}).k;
      var live = !reqk || !!(BFORM.draft[reqk] && String(BFORM.draft[reqk]).trim());
      body.querySelectorAll("[data-bfadd]").forEach(function(x){ x.disabled = !live; });
    };
    body.querySelectorAll("[data-bf]").forEach(function(el){
      /* Guarded: closing the dialog empties its body, which BLURS the field
         being typed, which fires `change` into a form that no longer exists
         — Escape threw on exactly that (§30.1's family, from the far side). */
      var write = function(){ if (!BFORM) return; BFORM.draft[el.dataset.bf] = el.value; refresh(); };
      el.addEventListener("input", write);
      el.addEventListener("change", write);
    });
    body.querySelectorAll("[data-bfseg]").forEach(function(seg){
      seg.querySelectorAll("[data-bfv]").forEach(function(b){
        b.addEventListener("click", function(){
          BFORM.draft[seg.dataset.bfseg] = b.dataset.bfv;
          seg.querySelectorAll("[data-bfv]").forEach(function(x){
            x.setAttribute("aria-pressed", String(x === b));
          });
          refresh();
        });
      });
    });
    body.querySelectorAll("[data-bfqn]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = "q" + b.dataset.bfqn;
        BFORM.draft[k] = !BFORM.draft[k];
        b.setAttribute("aria-pressed", String(!!BFORM.draft[k]));
      });
    });
    body.querySelectorAll("[data-bfadd]").forEach(function(b){
      b.addEventListener("click", function(){ builderFormAdd(b.dataset.bfadd); });
    });
    var c = body.querySelector("[data-bfcancel]");
    if (c) c.addEventListener("click", function(){ builderDialogClose(); paint(); });
  }
  function builderFormAdd(mode){
    var kind = BFORM.kind, d = BFORM.draft;
    if (kind === "newunit" || kind === "newfn") {
      var stay = !!BFORM.ctx.stay;
      var made = kind === "newunit"
        ? addBusinessUnit(d.name, d.prefix, d.company)
        : addFunction(d.name, d.format);
      if (!made) return;
      fieldSaved();
      if (stay) { builderDialogClose(); paint(); }
      else builderStart(kind === "newunit" ? made : "fn:" + made);
      return;
    }
    if (!bApply(kind, BFORM.ctx, d)) { builderDialogClose(); paint(); return; }
    fieldSaved();
    if (mode === "more") {
      BFORM.added++;
      BFORM.draft = {};
      bformSeedDefaults();
      /* The page behind updates so the table shows the row that just landed —
         inert while the dialog is open, and Islam has already ruled the
         covered register acceptable in exactly this shape (§116). */
      paint();
      builderDialogPaint();
    } else {
      builderDialogClose();
      paint();
    }
  }
  function wireBuilderReview(body){
    body.querySelectorAll("[data-bnav]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.bnav;
        builderDialogClose();
        builderGo(k);
      });
    });
    var done = body.querySelector("[data-bdone]");
    if (done) done.addEventListener("click", function(){
      /* Finishing closes the band and nothing else — the plan has been live
         all along (§129). leaveModes() closes the pens with it. */
      BUILDER = null;
      builderDialogClose();
      leaveModes();
      paint();
    });
    var back = body.querySelector("[data-brvback]");
    if (back) back.addEventListener("click", function(){ builderDialogClose(); paint(); });
  }
  /* The pen's add controls, routed into the form in build mode. The pillar
     INDEX is resolved to its ID here, at open — the id survives a repaint,
     the index is the thing that goes stale (§48.2). */
  function builderFormFromRowadd(spec){
    var a = String(spec).split("|"), what = a[0];
    if (what === "pillar") { openBuilderForm("pillar", { target:a[1] }); return true; }
    if (what === "measure" || what === "tactic") {
      var u = unitLikeWritable(a[1]), it = u && u.items[+a[2]];
      if (!it) return false;
      openBuilderForm(what, { target:a[1], pid:it.id });
      return true;
    }
    if (what === "project") { openBuilderForm("project", { capId:a[1] }); return true; }
    if (what === "deliverable" || what === "outcome" || what === "milestone") {
      openBuilderForm(what, { projId:a[1] });
      return true;
    }
    return false;
  }
  /* The band's own paint, called from paint() once the navigation has
     settled — the chips read currentSub/CURSEC, so earlier would read the
     paint before this one. */
  function paintBuildBand(){
    var bb = document.getElementById("buildband");
    if (!bb) return;
    var show = !!(typeof BUILDER !== "undefined" && BUILDER && current === BUILDER.target);
    /* The viewer switcher can change who this is between paints (§94): the
       band asks the shared rule again, and hides — with the mode kept, so
       switching back finds the build where it stood. */
    if (show) {
      var ac = builderRoute(BUILDER.target) === "fnprojects" ? "k_proj" : "u_plan";
      if (!mayAuthor(ac, BUILDER.target)) show = false;
    }
    bb.hidden = !show;
    bb.innerHTML = show ? builderBandHtml(currentSub, CURSEC) : "";
  }

  function modalDismiss(){
    if (BDLG) { builderDialogClose(); paint(); return; }
    if (PDLG) { closePersonDialog(false); return; }
    closeModal();
  }
  document.getElementById("modal-x").addEventListener("click", modalDismiss);
  overlay.addEventListener("click", function(e){ if (e.target === overlay) modalDismiss(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") modalDismiss(); });

  /* A menu that stays open after you have looked away is a menu you have to
     dismiss. Bound once, at boot, rather than on every repaint. */
  document.addEventListener("click", function(e){
    /* A row's action menu closes the same way — but only on a click OUTSIDE
       it, or choosing an item would close the menu before the item's own
       handler ran. That is §30.1 from the other side: this listener rewrites
       the DOM, so it must not fire in the middle of an interaction with it. */
    if (typeof PMENU !== "undefined" && PMENU !== null &&
        !(e.target.closest && e.target.closest(".kmenu, [data-pmenu]"))) {
      PMENU = null; paint();
    }
    /* The Functions table's row menu, the same way (§93.14). Its own selector,
       because a click on THIS table's kebab must not be read as "outside" the
       register's — the two are never on screen together, and a shared test
       would be a rule that happens to work rather than one that is right. */
    if (typeof FNMENU !== "undefined" && FNMENU !== null &&
        !(e.target.closest && e.target.closest(".kmenu, [data-fnmenu]"))) {
      FNMENU = null; paint();
    }
    /* The header menus close the same way, and on a click anywhere that is not
       inside them. `.hmenu` covers both the button and its panel. */
    if (typeof PCOLMENU !== "undefined" &&
        (PCOLMENU || PWMENU || FNCOLMENU) &&
        !(e.target.closest && e.target.closest(".hmenu"))) {
      PCOLMENU = false; PWMENU = false; PFILEMENU = false; FNCOLMENU = false;
      paint();
    }
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (typeof PMENU !== "undefined" && PMENU !== null) { PMENU = null; paint(); }
    if (typeof FNMENU !== "undefined" && FNMENU !== null) { FNMENU = null; paint(); }
    if (typeof PCOLMENU !== "undefined" &&
        (PCOLMENU || PWMENU || FNCOLMENU)) {
      PCOLMENU = false; PWMENU = false; PFILEMENU = false; FNCOLMENU = false;
      paint();
    }
  });

  /* The switcher lists the people the platform actually has. It was filled
     once, at load, from the baked-in example \u2014 so on the deployed product it
     went on offering all 29 of them after hydration had replaced them with the
     tenant's own, and picking someone who had gone threw on the next repaint.
     It is refilled whenever the list itself changes, which is cheap because
     the signature says when nothing has. */
  var sel = document.getElementById("asWho");
  var viewerSig = null;
  function fillViewers(){
    var sig = PEOPLE.map(function(p){ return p.key; }).join(",");
    if (sig !== viewerSig) {
      viewerSig = sig;
      /* \u2500\u2500 THE NAME AND THE PLACE, AND NOTHING ELSE (\u00a7142) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
         Islam: *"this needs to be only the name not the full name + the unit
         name and that's all which will make it much smaller."* It read
         "Mohamed Essam \u2014 Head of the Strategy Management Office" and the
         control's cap cut it at the em dash, so the half that says WHAT YOU
         ARE LOOKING AT was the half never shown.

         The register's own two answers, never a third vocabulary (\u00a753.5):
         `knownName()` is the short name the People page shows \u2014 with
         `displayNames()` behind it, so a pair whose short names collide is
         lengthened just enough to read apart and nobody is silently dropped
         from a picker by the dedupe (\u00a7130.7, \u00a781.1) \u2014 and `placeLabel()` is
         the navigation's own word for where they sit (\u00a793.12).

         The job title goes from the option and stays on the `title`: it is
         the thing you might want and never the thing you scan by. */
      var dn = displayNames();
      sel.innerHTML = PEOPLE.map(function(p){
        var where = placeLabel(personAt(p));
        return '<option value="' + p.key + '" title="' + esc(p.name + " \u2014 " + p.title) + '">' +
          esc(knownName(p, dn)) + " \u2014 " + esc(where) + '</option>';
      }).join("");
    }
    viewer();               /* corrects VIEWER if the person selected has gone */
    sel.value = VIEWER;
  }
  fillViewers();
  sel.addEventListener("change", function(){
    /* leaveModes() — a viewer switch is a navigation, and every other one in
       the platform drops its modes (§63.1). This did not, so an open Foundation
       pen followed the SMO into a custodian's view and the fields stayed
       editable for somebody the rule closes them to (§94). The same fault the
       unit-to-unit handler fixed for edit modes, on the one path that skipped
       it. */
    leaveModes();
    VIEWER = sel.value; current = null; currentSub = null; paint(); window.scrollTo(0,0);
  });

  /* The three nav rows sit in one sticky container, so nothing has to be
     measured and no offset has to be kept in sync. The header still condenses,
     but on hysteresis — condense at 70, expand at 20 — because a single
     threshold oscillates: shrinking the header pulls content up, which can
     drop the page back under the threshold and re-expand it. */
  /* The sticky pillar header pins beneath the chrome, so it needs the chrome's
     height. That height changes for three separate reasons — the header
     condenses, the window resizes, and the tab row is repopulated on every
     paint — so it is observed rather than measured at chosen moments. This is
     what the old code got wrong: it measured on every scroll frame, mid
     transition, and fed the result straight back into the layout. */
  var chromeEl = document.querySelector(".chrome");
  new ResizeObserver(function(){
    document.documentElement.style.setProperty("--chrome-h", chromeEl.offsetHeight + "px");
  }).observe(chromeEl);

  /* ── AND A SETUP TABLE'S HEAD PINS UNDER THE PAGE'S (§135.10) ──────
     Same pattern, one component in. `--sethead-h` was a literal 46px, and §135
     changed the header's height by putting the page's own controls into it —
     42px where they are small, 49px where a search box sits on the line. A
     table head pinned 4px BELOW the page header leaves a slot between two
     pinned things, and scrolling rows show through it: measured, a 4px leak on
     Focus measures, and the thing Islam photographed.

     A CONSTANT COULD NOT HAVE BEEN RIGHT, which is why this is observed rather
     than corrected to a better number: the header WRAPS on a narrow window, so
     its height is a function of the window as well as of the page.

     NOT §28.3's LOOP, and the difference is the whole reason this is safe: the
     value feeds a sticky OFFSET and nothing else. An offset cannot change the
     height it was measured from, so there is no path from the output back to
     the input — unlike v2.8's max-height, which sized a box against a number
     the box's own size decided.

     Published on the ROOT rather than on the pane, because the pane is replaced
     on every paint and an inline value would go with it. */
  var SETHEAD_RO = new ResizeObserver(function(rs){
    var el = rs[0] && rs[0].target;
    if (!el) return;
    document.documentElement.style.setProperty(
      "--sethead-h", Math.round(el.getBoundingClientRect().height) + "px");
  });
  function watchSetupHead(){
    /* GUARDED, BECAUSE paint() CAN RUN FIRST. `SETHEAD_RO` is a `var` assigned
       here at the foot of the file, and the function declaration above it
       hoists while the value does not — the same shape as §113.8's `undefined`
       unshift. A boot that painted before this line would throw, and a throw
       mid-paint keeps the previous page on screen with the only witness in a
       console nobody has open (§118). */
    if (!SETHEAD_RO) return;
    SETHEAD_RO.disconnect();
    var el = document.querySelector(".setuphead");
    if (el) SETHEAD_RO.observe(el);
    /* Removed rather than left holding the last Setup page's number: every
       other page reads the fallback, and a stale value is worse than none. */
    else document.documentElement.style.removeProperty("--sethead-h");
  }

  /* NO CONDENSE-ON-SCROLL. The chrome is one height, always.

     This was the last thing in the product that changed size while you
     scrolled, and it is what Islam had been reporting as the scroll-up glitch
     for four versions. Two separate causes had already been found and fixed
     underneath it (a chrome with no background in 2.7, a rail capped against
     its own measured height in 2.8) and the symptom kept coming back, because
     the mechanism was still there.

     What it actually did, measured: at scroll position 25 the chrome settled
     at 190px if you had arrived scrolling DOWN, and 168px if you had arrived
     scrolling UP - and stayed there. Not a transition mid-flight; the settled
     state genuinely depended on the direction you came from. That is the
     hysteresis (condense past 70, expand below 20) working exactly as
     designed - it is what stopped the header chattering at the threshold - but
     the consequence is that scrolling back up holds the header condensed and
     then drops 22px of chrome into the page in one step, moving everything
     below it. That step, plus the .18s ease it animated with, is the "hazy and
     damaged" of the original report.

     It bought 22px. The header is 47px now (§27) - it was 108px when the
     condense was written, and reclaiming a fifth of a tall header was worth
     something. Reclaiming 22px from a 47px one is not worth a chrome whose
     height depends on which way you were scrolling.

     The ResizeObserver that publishes --chrome-h stays. The rail's sticky
     offset still reads it; it simply reports a constant now, which is the
     easiest possible thing for it to be right about. */


  /* Pillar rows: accordion, plus pulling the opened row under the chrome so a
     collapsing row above cannot move the page out from under the cursor. */
  function wirePillars(){
    /* The control shows what pressing it will do, and follows the rows: opening
       the last panel by hand flips it to fold. */
    function syncFold(){
      var rows = document.querySelectorAll(".prow");
      var btn = document.querySelector("[data-allrows]");
      if (!btn || !rows.length) return;
      var allOpen = document.querySelectorAll('.prow[aria-expanded="true"]').length === rows.length;
      btn.innerHTML = allOpen ? ICON_FOLD : ICON_UNFOLD;
      btn.title = allOpen ? "Collapse all" : "Expand all";
    }
    syncFold();
    var foldBtn = document.querySelector("[data-allrows]");
    if (foldBtn) foldBtn.addEventListener("click", function(){
      var rows = document.querySelectorAll(".prow");
      var allOpen = document.querySelectorAll('.prow[aria-expanded="true"]').length === rows.length;
      rows.forEach(function(r){
        r.setAttribute("aria-expanded", String(!allOpen));
        r.nextElementSibling.hidden = allOpen;
      });
      syncFold();
    });

    document.querySelectorAll(".prow").forEach(function(b){
      b.addEventListener("click", function(){
        /* Panels open and close independently. Nothing else closes.

           This is the third attempt and the only one that works, so the reasoning
           is worth keeping. First the opened row was scrolled to the top, which
           threw the page ~350px on every click. Then the row was anchored so it
           could not move \u2014 and it did not, to the pixel \u2014 but holding it still
           while a panel ABOVE it collapsed meant scrolling the window 785px, so
           everything else on screen changed and it read as a worse jump than
           before. The row was the wrong thing to hold.

           An accordion was chosen to stop the list becoming unreadable when
           several pillars are open. That is a smaller cost than a page that
           lurches on every click. Opening a panel now only ever adds height
           BELOW the row, and closing one only removes height below it, so
           nothing above the click ever moves and no correction is needed. */
        var open = b.getAttribute("aria-expanded") === "true";
        b.setAttribute("aria-expanded", String(!open));
        b.nextElementSibling.hidden = open;
        syncFold();
      });
    });
  }

  /* ── THE FIRST PAINT IS THE HYDRATED ONE NOW (§94.10) ──────────────
     It used to say "paint immediately from the baked data, then hydrate and
     repaint", and that immediate paint was the glitch: the wrong colours, and
     on a client's deployment another company's units. Where there is a server
     the skeleton holds the screen and SYNC.boot paints once, with the truth.
     On file:// there is nothing to wait for and this is still just paint(). */
  /* The colours are already applied - THEME.apply() ran in the head. This
     only hangs the control on the chrome, which has to exist first. */
  THEME.wire();
  /* THE BAKED BRANDING, WHICH IS THE ONLY ONE THAT EXISTS ON file:// (§94.10).
     It no longer has anything to do with the first paint — the skeleton wears
     none of these tokens, deliberately, and where there is a server the only
     branding ever seen is the one that arrives with the data. This is here for
     the file:// case, where nothing arrives and the baked branding IS the
     tenant's. */
  applyBrand();
  SYNC.boot(function(){ applyBrand(); paint(); });
</script>
