  /* THE TWO-CLICK SAVE.

     Every editable field in Setup commits on `change` and then repaints. But
     `change` on a text input fires on BLUR, and the blur is caused by pressing
     something else - usually the Done button in the same table. So the order
     was: mousedown on Done, input blurs, change fires, paint() rewrites the
     panel and destroys the very button being pressed, and the click lands on
     nothing. The value was saved; leaving edit mode took a second press. That
     is the "two clicks to save".

     Fixed once, here, rather than in twenty handlers: a repaint requested
     while the mouse is down is held until the click it belongs to has landed.
     mouseup and click are dispatched in the same task, and timers run after
     it, so a setTimeout scheduled on mouseup is reliably after the click.

     Deliberately not solved by committing on `input` instead: that works for
     the button, but a field committing on every keystroke also has to not
     repaint on every keystroke, and then nothing derived updates until
     something else happens to paint. This keeps the repaint, and only moves
     it a few milliseconds. */
  var CLICKING = false, PAINT_HELD = false, holdTimer = null;
  function releasePaint(){
    CLICKING = false;
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (PAINT_HELD) { PAINT_HELD = false; paint(); }
  }
  document.addEventListener("mousedown", function(){
    CLICKING = true;
    /* A mousedown whose mouseup lands outside the window never releases, and a
       stuck flag means the page silently stops repainting. Nothing is worth
       that, so it always releases on its own. */
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = setTimeout(releasePaint, 500);
  }, true);
  document.addEventListener("mouseup", function(){ setTimeout(releasePaint, 0); }, true);

  /* The tenant's branding, handed to THEME. One function, called on boot and
     after every change on the Branding page, so the applied colours and the
     page's own preview cannot drift apart (§39). */
  function applyBrand(){
    var b = branding();
    THEME.setBrand({ palette: b.palette, font: b.font, tokens: brandTokens() });
  }

  /* ══ A REPAINT MUST NOT MOVE THE PAGE (§75) ═══════════════════════
     Islam: "on every edit in the table the table jumps up to the start … I'm
     not able to add a role or add a number without the whole thing jumping."

     §71.2 answered this by taking `paint()` OFF the fields that did not need
     it, which fixed the fields it reached and could never fix the rest: adding
     a row, giving somebody a role, changing a figure — these genuinely have to
     repaint, because they change what the page SAYS, not just what is in a box.
     Chasing them one at a time is how a fault comes back six versions later on
     the one handler nobody remembered.

     So the repaint is made harmless instead. `paint()` replaces the whole of
     `#panel`, which throws away three things somebody was relying on: where the
     page was scrolled, where each scroll BOX inside it was scrolled — the
     register is 1127px wide in a 920px box and taller than its own frame, so it
     has both — and which field had the cursor, and where in it.

     All three are taken before the rebuild and put back after, so a repaint
     leaves the screen exactly where it was. THE COST IS TWO WALKS of the panel
     per paint; the alternative is auditing every handler in the platform for
     ever.

     A box is matched across the rebuild by its class and its ordinal among
     boxes of that class. Same page, same shape, so it holds — and when it does
     not, the worst case is that nothing is restored, which is where the product
     was already. */
  function scrollsIn(root){
    var out = [], seen = {};
    (root ? root.querySelectorAll("*") : []).forEach(function(el){
      if (!el.scrollTop && !el.scrollLeft) return;
      var k = (typeof el.className === "string" && el.className) || el.tagName;
      seen[k] = (seen[k] || 0) + 1;
      out.push({ k:k, n:seen[k], top:el.scrollTop, left:el.scrollLeft });
    });
    return out;
  }
  function putScrollsIn(root, boxes){
    if (!root || !boxes.length) return;
    var seen = {};
    root.querySelectorAll("*").forEach(function(el){
      var k = (typeof el.className === "string" && el.className) || el.tagName;
      seen[k] = (seen[k] || 0) + 1;
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].k === k && boxes[i].n === seen[k]) {
          el.scrollTop = boxes[i].top; el.scrollLeft = boxes[i].left;
          return;
        }
      }
    });
  }
  /* The field with the cursor, named by the data attribute it is wired on —
     every editable control in the platform carries one, which is what makes
     this possible without giving a thousand cells an id. */
  function focusMark(){
    var el = document.activeElement;
    if (!el || el === document.body || !el.dataset) return null;
    var mark = null, k;
    for (k in el.dataset) { mark = { attr:k, val:el.dataset[k] }; break; }
    if (!mark && el.id) mark = { id:el.id };
    if (!mark) return null;
    var o = { mark:mark };
    try { o.start = el.selectionStart; o.end = el.selectionEnd; } catch (e) {}
    return o;
  }
  function putFocus(f){
    if (!f) return;
    var sel = f.mark.id
      ? "#" + f.mark.id
      : "[data-" + f.mark.attr.replace(/[A-Z]/g, function(c){ return "-" + c.toLowerCase(); }) +
        "=" + JSON.stringify(String(f.mark.val)) + "]";
    var el;
    try { el = document.querySelector(sel); } catch (e) { return; }
    if (!el) return;
    /* `preventScroll`, and it is the whole point. focus() scrolls its element
       into view by default, so restoring the scroll and THEN restoring the
       focus undoes the first with the second — the fix causing the fault it
       was written for. Measured: without it a field near the bottom of the
       register drags the box to 952 whatever it was set to. */
    try { el.focus({ preventScroll:true }); } catch (e) { el.focus(); }
    /* The caret goes back where it was, or a repaint mid-word would put it at
       the end and the next keystroke would land in the wrong place. */
    if (f.start != null) { try { el.setSelectionRange(f.start, f.end); } catch (e) {} }
  }

  /* The card a page that could not be drawn leaves in its place (§137). One
     action, deliberately: an earlier draft carried "Open another page" beside
     Reload, and it went — the navigation is right above, and a control that
     does nothing concrete is worse than no control. The technical line is
     inside a <details> that starts CLOSED. */
  function failCard(name, msg){
    return '<div class="failcard">' +
      '<div class="fc-t">Something went wrong opening this page.</div>' +
      '<div class="fc-b">Your data is safe. Please reload, or open another page from the menu above.</div>' +
      '<button type="button" class="editbtn" data-failreload>Reload</button>' +
      '<details><summary>Technical details</summary>' +
        '<div class="fc-e">' + esc((name ? name + " · " : "") + String(msg)) + '</div>' +
      '</details></div>';
  }

  function paint(){
    if (CLICKING) { PAINT_HELD = true; return; }
    var _panel = document.getElementById("panel");
    var _keep = { y: window.pageYOffset || 0, boxes: scrollsIn(_panel), focus: focusMark() };
    /* WHAT THIS PAINT IS ABOUT, set before anything renders. Every grant() with
       no target of its own answers for this — the unit, the function or the
       group currently on screen — because "own business unit" and "other
       business units" are different answers to the same page (§37), and a
       render has exactly one subject. Anything asking about a DIFFERENT thing
       (the navigation, listing every unit) passes its own target to grantAt().
       "setup" is deliberately mapped to the group: the Setup pages belong to
       nobody's unit, and their area does not depend on the target at all. */
    /* Field setters are registered during render, so the list is emptied first
       or stale closures accumulate on every repaint. */
    FIELDS.length = 0;
    /* §177.2: and what each rail drew LAST time is not what it will draw this
       time — the same reason FIELDS is emptied here. */
    for (var rk in RAIL_SHOWN) delete RAIL_SHOWN[rk];
    /* Same reason, same line (§96): the objectives editor registers the array
       its Add and Remove act on, and an index from the last paint would act on
       the paint before it. */
    if (typeof KOLISTS !== "undefined") KOLISTS.length = 0;
    /* §145: the confirm ticks register the row they act on the same way. */
    if (typeof PENDS !== "undefined") PENDS.length = 0;
    fillViewers();
    paintUnits();
    /* ── TARGET IS DERIVED FROM `current`, SO IT IS SET AFTER IT SETTLES ──
       It used to be set BEFORE paintUnits(), and paintUnits is the thing that
       corrects `current` when this viewer cannot reach where the last one was
       standing. So on the first paint after the reach changed, TARGET still
       named the OLD destination while `current` had already moved — and every
       tab was then judged against the wrong subject.

       What it cost: setting the business unit owner's GROUP area to "none"
       made a unit head lose EVERYTHING. Their own unit's pages were granted —
       `u_perf` measured "edit" the whole time — but they were being asked
       against the group, where the answer had just become none, so every tab
       was filtered out and the page said there was nothing to open. The one
       change the table is most likely to be asked for took the product away
       from the person it was configured for.

       paintUnits() reads no grant of its own (every call inside it passes an
       explicit target, by the note above), so nothing needs the old value. */
    TARGET = (!current || current === "setup" || current === "manage") ? "group" : current;
    /* Repainted rather than set once: the demo switch swaps the whole graph,
       and Labels can rename the tenant while you are looking at it. The
       separator lives with the name so an unnamed tenant shows nothing at all
       rather than a stranded middot. */
    document.getElementById("orgname").textContent =
      GROUP.org ? "\u00b7 " + GROUP.org : "";
    /* THE ROLES, AND WHERE EACH IS HELD (§178). One builder, beside
       `placeLabel()` and asking `personAt()` like every other surface that
       answers "where does this person sit" (§54). This line used to work it
       out for itself off `p.unit` and nothing else, which is how it came to
       say an em-dash for every function head and both company CEOs while the
       DROPDOWN BESIDE IT said the function’s own name (§142). Two controls
       on one row answering one question two ways — so the copy goes rather
       than learning about functions. */
    /* AND THE WHOLE LINE ON A HOVER. `.viewer-note` is one line with an
       ellipsis, and below about 1280px this line is longer than the strip has
       room for -- what gets cut is the tail, which is the PLACE, which is the
       half §178 exists to add. §88's shape: one line, an ellipsis where it
       does not fit, the whole value one hover away. Set unconditionally
       rather than through `clipTitles()`, which is scoped to the setup tables
       and would have to be widened to reach the chrome -- and unlike the
       cells that rule was written for, this element carries no other title
       for a hover to cover. */
    (function(){
      var el = document.getElementById("viewerNote");
      el.textContent = viewerRoleLine(viewer());
      el.title = el.textContent;
    })();

    if (!current) {
      paintBuildBand();
      document.getElementById("subtabs").innerHTML = "";
      document.getElementById("panel").innerHTML =
        '<div class="note bad-note" style="margin-top:30px"><b>No pages granted.</b> The roles this person holds reach nothing. ' +
        'That is the table working as configured, not an error &mdash; open <b>Setup &rarr; Roles &amp; access</b> as the SMO to change it.</div>';
      return;
    }

    /* A tab with SECTIONS is a container: the tab itself renders nothing and
       the third row carries its pages. A tab without them renders directly, as
       every group and setup tab still does. */
    var arg = (current === "group" || current === "setup" || current === "manage") ? null
            : isFn(current) ? current : UNITS[current];
    /* Submission is per unit; a function's capabilities are not submitted
       individually, so the whole function counts as one. */
    CURRENT_REPORT_KEY = isFn(current) ? current : (UNITS[current] ? UNITS[current].ukey : null);
    var defs = reachable(defsFor(current), TARGET, arg);
    /* NO FALLBACK ONTO THE UNFILTERED LIST. It used to re-add every allowed def
       when the reachable set came out empty, which put back exactly the defs
       that had just been ruled out for having nothing to render. Nothing to
       render is a real answer, and the branch above already says it in words. */
    if (!defs.length) {
      paintBuildBand();
      document.getElementById("panel").innerHTML =
        '<div class="note">There is nothing here for you to open. ' +
        'That is the table working as configured, not an error &mdash; open ' +
        '<b>Setup &rarr; Roles &amp; access</b> as the SMO to change it.</div>';
      document.getElementById("subtabs").innerHTML = "";
      document.getElementById("tabrow").hidden = true;
      document.getElementById("secrow").hidden = true;
      return;
    }
    if (!defs.some(function(d){ return d.k === currentSub; })) currentSub = defs[0].k;

    /* SETUP HAS NO TAB ROW. Its ten pages are the rail's job now (§46.1), and
       leaving the row rendered as well would state the same navigation twice —
       the fault the chrome shed in 2.9. The row is emptied AND hidden: an
       empty <nav> still spends its border and its padding. */
    var railed = current === "setup";
    /* ── AND EVERY PAGE GETS IT NOW, SO THERE IS NOTHING TO SWITCH (§94.13)
       §93.9's `data-wide` lived here, turned on for railed pages only, and
       Islam asked for the whole platform: "let's make it fit always." The cap
       and the 1600 ceiling are both gone from `_shared.css`, so the attribute
       had nothing left to say and went with them — §24's rule, applied to the
       JS half as well as the CSS half. `railed` is still read two lines below;
       it is the rail's own switch and always was. */
    document.getElementById("tabrow").hidden = railed;
    /* THE DOT IS A STATE, NOT A DECORATION (§69.9). It used to hang off
       `.primary`, which is the LANDING PAGE and nothing else — so it was
       painted on every destination all the time. It now belongs to the tab
       whose page is where the outstanding report is answered, and only while
       there is one: reportPending() is the one place that decides.

       `dot` rather than more `primary`, because the two facts are unrelated
       and one class carrying both is how the dot came to mean nothing. It
       paints to the RIGHT (Islam), which is also where it belongs — a mark
       AFTER the word annotates it; a mark before it is a bullet. */
    /* \u00a7132.14: the Strategy tab wears NO number (Islam: "remove the number
       from the strategy word") \u2014 the missing bar in the section row below
       carries the total, the places and the action, through missBar(). */
    document.getElementById("subtabs").innerHTML = railed ? "" : defs.map(function(d){
      var cls = (d.primary ? "primary" : "") +
        (d.dot && reportPending(TARGET) ? " dot" : "");
      return '<button role="tab" data-s="' + d.k + '"' +
        (cls.trim() ? ' class="' + cls.trim() + '"' : '') +
        ' aria-selected="' + (d.k === currentSub) + '">' + d.label +
        (d.dot && reportPending(TARGET)
          ? '<i class="tabdot" aria-hidden="true"></i>' +
            '<span class="vh"> \u2014 not submitted yet</span>'
          : '') + '</button>';
    }).join("");

    var def = defs.filter(function(d){ return d.k === currentSub; })[0];
    /* THE PAGE'S NAME, TAKEN BEFORE `def` BECOMES A SECTION (§121.1). Twenty
       lines down, a page with sections reassigns `def` to whichever section is
       open — so reading the name after that gives the SECTION's: Figure sets
       was titling itself "Sets configuration" and Import & archives "Import a
       plan", which is the rail pointing at one name and the page showing
       another all over again. The rail's own label is the page's name whether
       or not it has sections inside it. */
    var pageName = def ? (def.label || "") : "";
    var secs = def.sections ? allowed(def.sections(arg), TARGET) : null;
    var secrowHTML = "";
    /* `secs.length`, not `secs`. An empty array is truthy, so a def whose every
       section was refused walked straight into `secs[0].k`. */
    if (secs && secs.length) {
      if (!secs.some(function(s){ return s.k === CURSEC[def.k]; })) CURSEC[def.k] = secs[0].k;
      /* A SETUP page's sections belong INSIDE its pane, not in the chrome's
         third row. The third row spans the window; the pane starts 236px in,
         beside the rail — a row of section tabs floating over the rail would
         be pointing at a page it does not sit above. Figure sets is the first
         Setup page to have sections at all (§46.2). */
      if (railed && secs.length > 1) {
        secrowHTML = '<div class="secrow">' + secs.map(function(x){
          return '<button type="button" role="tab" data-sub2="' + x.k + '"' +
            (x.cls ? ' class="' + x.cls + '"' : '') +
            ' aria-selected="' + (x.k === CURSEC[def.k]) + '">' + x.label + '</button>';
        }).join("") + '</div>';
      }
      def = secs.filter(function(s){ return s.k === CURSEC[def.k]; })[0];
    }

    /* The per-page Info button left the header in 2.9. The explanations in
       PAGEINFO stay \u2014 they are still reachable from the [data-modal] links
       inside the pages themselves. */
    /* THE NAME THE SHELL IS ABOUT TO SHOW (§121.1), set BEFORE the page
       renders, because cfgHead() reads it to decide whether its own heading
       would be repeating it. Cleared for every non-Setup page, or a unit's
       section called "Performance" would go unnamed on a page the rail is not
       even drawing. */
    PAGE_TITLE = railed ? (pageName || null) : null;
    /* AND THE TWO SLOTS THE PAGE'S CONTROLS ARRIVE IN (§135). Cleared before
       the render that fills them, read after it — the same trip PAGE_TITLE
       already makes, in the other direction. */
    pageLineReset();

    /* ── A FAILED RENDER SAYS SO (§137). A throw inside a page's render used
       to abort paint() and leave the PREVIOUS page standing, with the only
       witness in the hidden console — so a data fault read as a dead click,
       and the person reported the wrong symptom (§118.7, and §118's CF tab is
       exactly how that looked from production). §32's rule one level deeper:
       after a failure there is exactly one honest thing to show, and it is
       the failure. The guard sits on the PAGE's render alone — the chrome,
       the navigation and the tabs above have already painted, which is what
       makes "open another page from the menu above" a true sentence. The
       words are Islam's ask ("simple with a more user friendly message",
       2026-08-27); the error itself is kept, folded behind a closed
       disclosure, so the office can still read it without it shouting at
       anybody else. */
    var body;
    try {
      body = (current === "group" || current === "setup" || current === "manage")
        ? def.render()
        /* A company is passed its key, the way a function is: there is no
           UNITS[...] to hand it and inventing a unit-shaped object for something
           that carries no plan would be a lie about what it is (§68). */
        : isCo(current) ? def.render(current)
        : isFn(current) ? def.render(current) : def.render(UNITS[current]);
    } catch (renderErr) {
      /* Still said to the console, verbatim — the card is FOR the person, the
         console line is for whoever is diagnosing with the lid off. */
      console.error("SMP: this page could not be drawn", renderErr);
      body = failCard(pageName || (def && def.label) || "",
                      renderErr && renderErr.message || renderErr);
    }
    /* The rail and the page it chose, side by side. `defs` rather than
       SUBS.setup, so a page the viewer may not open is not offered — the rail
       is navigation, and navigation that leads somewhere refused is worse than
       navigation that is short. */
    document.getElementById("panel").innerHTML = railed
      ? '<div class="split setupsplit' + (RAIL_OPEN ? '' : ' shut') + '">' +
        setupRail(defs, currentSub) +
        /* ── THE PAGE HEADER, AND IT STAYS (§121.2) ────────────────────
           Islam: *"this page needs to be sticky for the title."* Measured
           first: the rail's head and search already stick and the pane's
           title did not — it scrolled 600px away with everything else. It
           pins at the same offset the rail's head uses, so the two line up
           rather than one sliding under the other. */
        '<div class="pane setuppane' +
          /* THE REGISTER'S PANE FILLS THE WINDOW (§122.5). Islam: "the
             registry table should extend down till the end of the page." It is
             marked here rather than guessed at in CSS, because only this page
             holds a table that is meant to scroll inside its own box — every
             other Setup page is a form or a short list and should keep growing
             the page instead. Both halves of this line came from different
             branches on the same day and both are load-bearing. */
          /* AND ROLES & ACCESS JOINS IT (§174), for the same reason and by the
             same mark: its head is now pinned to its own box, and a box only
             scrolls if something caps it. Flexing into what is left beats a
             constant here as much as it did there — the legend under the
             table, the header wrapping to a second line at a narrow width,
             and §167's two feet all change that number. */
          (currentSub === "people" || currentSub === "access" ? " panefill" : "") + '">' +
          /* ── AND THE PAGE'S CONTROLS ARE ON IT (§135) ────────────────
             `pageLineHTML()` is read AFTER `body`, because the page's own
             render is what fills the slots. The search sits left of the
             buttons, and a page with neither gets neither. */
          '<div class="setuphead' + (PAGE_TOOLS || PAGE_ACTS ? ' withacts' : '') + '">' +
            '<h1 class="setupttl">' + esc(pageName) + '</h1>' + pageLineHTML() + '</div>' +
          secrowHTML + body + '</div></div>'
      : body;
    /* The failure card's one control (§137). Wired here because the card was
       written into innerHTML two lines up — no inline handlers anywhere
       (§43.6), and wire() below owes this card nothing: it must work exactly
       when a page's own wiring cannot be trusted. */
    var failBtn = _panel.querySelector("[data-failreload]");
    if (failBtn) failBtn.addEventListener("click", function(){ location.reload(); });

    /* ── AND THE REPORTING CONTROLS GO ON THE TAB ROW (§150) ─────────────
       Read AFTER the page's render, because the render is what fills the
       slot — the same direction of travel `pageLineHTML()` makes for a Setup
       page's controls, and the reason the tab row could not simply build
       them itself: it is written further up, before this page exists.

       The row is pinned chrome, so the box stays on screen for the whole
       report — which is the entire feature. Appended rather than written
       into the row's innerHTML, because that string is the tabs' and a
       report is not a tab.

       Its controls are bound by wire() below, which queries the DOCUMENT for
       [data-submit] / [data-repsave] / [data-repcancel] — so the box works
       from outside #panel without a second wiring path (§24). */
    var tabrow = document.getElementById("subtabs");
    /* WRAPPED, SO THE CONTROLS SIT HARD RIGHT (§163). Inserted bare they land
       immediately after the last tab and read as two more tabs; the wrapper is
       what carries `margin-left:auto`. One wrapper at the one insertion point
       rather than a margin on each control — the page decides WHAT its
       controls are, the row decides WHERE they go. */
    if (REPORT_CHROME && tabrow && !railed)
      tabrow.insertAdjacentHTML("beforeend",
        '<span class="tabacts">' + REPORT_CHROME + '</span>');

    /* ── AND A TABLE TOO WIDE FOR ITS PANE SCROLLS INSIDE ITSELF (§151) ──
       Done here, once, rather than at the dozen render sites that build a
       table: every one of them would have had to remember, and the day one
       forgot would be the day a client's plan is cut again with no way to
       reach the rest of it (Islam, on Mazaya).

       WRAPPED WHATEVER THE WIDTH, and that is deliberate: `overflow-x:auto`
       shows no scrollbar and changes nothing while the table fits, so
       wrapping unconditionally means the behaviour cannot depend on which
       tenant's data happens to be loaded — the demo's plan fits at 1100px
       and the client's does not, which is exactly how this reached
       production unnoticed.

       Tables already inside a scroller are left alone: the register brings
       its own (§122.5), and a box inside a box scrolls neither well. */
    _panel.querySelectorAll("table").forEach(function(t){
      if (t.closest(".tblscroll") || t.closest(".acgrid")) return;
      var w = document.createElement("div");
      w.className = "tblscroll";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
    /* THE SECOND FROZEN COLUMN PARKS AGAINST THE FIRST ONE'S MEASURED WIDTH,
       NEVER AGAINST A CONSTANT (§151.1). It shipped as `left:38px` — the `#`
       column's declared width — and the name slid 2.5px on every scroll,
       because the RENDERED border box is the declared width plus its borders.
       §122.5's rule ("a cap made of a guessed constant goes stale silently")
       and the register's own note that the second frozen column must equal
       the first one's rendered border box (§73.2), met again here.

       Measured after the wrapping above, so the layout it reads is the one
       that will be on screen; published as a variable on the box, because
       every row's cell needs the same number and one of them deciding it is
       how two frozen columns come to disagree. */
    _panel.querySelectorAll(".tblscroll").forEach(function(w){
      var first = w.querySelector("thead th.idx, tbody td.idx");
      if (first) w.style.setProperty("--frozen-1", first.getBoundingClientRect().width + "px");
    });

    /* Group Performance is four sections; they become a third nav row rather
       than one long scroll. The row exists only where there are sections. */
    var secrow = document.getElementById("secrow");
    var onSecPage = current === "group" && currentSub === "performance" && GROUP_SECTIONS.length;
    /* `!railed`: a Setup page's sections were drawn into its own pane above, so
       drawing them here as well would be the same two buttons in two places. */
    if (!railed && secs && secs.length > 1) {
      /* The same third row the group's Performance sections already use. One
         row that means "sections of the tab above", wherever it appears. */
      secrow.hidden = false;
      document.getElementById("secrow-in").innerHTML = secs.map(function(s){
        return '<button role="tab" data-sub2="' + s.k + '"' + (s.cls ? ' class="' + s.cls + '"' : '') +
          ' aria-selected="' + (s.k === def.k) + '">' + s.label + '</button>';
      }).join("") +
        /* §145.14: THE MISSING BAR LIVES IN THIS ROW'S FREE SPACE (Islam:
           "that bar with that button is what goes up beside the plan, not
           to waste lines") — the total, one red chip per place that owes,
           and the red button, on the strategy tabs only, read mode too. */
        ((currentSub === "strategy" || currentSub === "fnstrat") &&
         typeof missBar === "function" ? missBar() : "");
    } else {
      secrow.hidden = !onSecPage;
      /* HIDDEN IS NOT EMPTY, AND IT HAS TO BE BOTH (§63.6). The row kept the
         buttons of whatever page was on screen last: hidden, but still in the
         document, still focusable, still found by anything that queries for
         them. Two things went looking. The contrast sweep read the section
         buttons after choosing a tab, so with Performance's sections gone it
         found STRATEGY's left over, pressed them, and reported what it
         measured as `fn/performance/foundation` — 7 extra failures counted
         twice under a name for a page it was not on (§50.6, again). And a
         hidden control is still a tab stop, which is §48's `opacity:0` lesson
         arriving in a third tree. Emptied whenever it is hidden. */
      document.getElementById("secrow-in").innerHTML = onSecPage
        ? GROUP_SECTIONS.map(function(t, i){
            return '<button role="tab" data-sec="' + i + '" aria-selected="' + (i === GSEC) + '">' + t + '</button>';
          }).join("")
        : "";
    }
    /* The builder's band, once the navigation above has settled (§129). */
    paintBuildBand();
    wire();
    /* LAST, and after wire(). Every <select> the paint just produced gets a
       searchable button in front of it once its list passes five options
       (searchsel.js) — the native control stays where it is, so nothing wire()
       just attached is disturbed. */
    SEARCHSEL.wire();
    /* §189: size every growing prose box to what is in it. Here, at the end
       of paint(), for SEARCHSEL's own reason — these are rebuilt on every
       paint, and a height measured before the row is laid out is a height
       measured against nothing. */
    if (typeof growFields === "function") growFields();
    /* AND THE MONTH PANEL GOES (§177). It is mounted on <body> so a repaint
       cannot take it with the button it belongs to — it would be left hanging
       over a page it no longer points at. Same reason SEARCHSEL.wire() closes
       its own popup first (§30.1). */
    MONTHPOP.shut();
    /* The office's inbox, if this paint drew it. It binds ONCE per rendered
       frame and then fills and refreshes itself on its own clock — nothing in
       it ever calls paint(), or a reply being typed would be thrown away every
       ten seconds (§35, §71.2). Called here so it is also the place the clock
       is STOPPED when a paint navigates away from the page. */
    CHAT.wireInbox();
    /* The tour, if one is running. It holds SELECTORS rather than nodes —
       this paint has just replaced every element its spotlight was drawn
       around — so it re-resolves them and puts the shade and the card back.
       Like the inbox above, nothing in it ever calls paint(). */
    TOUR.onPaint();
    /* ── AND THE PINNED TITLES SAY SO (§130.6) ───────────────────────
       The one thing CSS cannot ask. `.pane > .pband` fills its two rounded
       corners with the page's ground so nothing shows through them while it
       is pinned (§130.3) — and painting that at REST cut the card's own
       corner arc, which is what Islam saw next: *"the corner still has this
       squared corner."*

       AN OBSERVER, NOT A SCROLL LISTENER. v3.3 removed the condensing header
       and wrote the rule down: never size anything against a measurement the
       size itself can change. This changes no size at all — a class, and a
       background inside a corner — so the loop that rule guards against
       cannot form. What it does need is to be RE-ARMED after every paint,
       like the three above it: the band it was watching has just been
       replaced.

       THE THRESHOLD IS THE ELEMENT'S OWN STICKY OFFSET, read off the computed
       style rather than rebuilt from `--chrome-h` and `--rail-gap` — §29.4's
       rule, which the rail learned the hard way: one number, not two that
       happen to agree. Shrink the root by that offset plus a pixel and the
       band stops being wholly inside it at exactly the moment it pins. */
    pinWatch();
    clipTitles();
    /* The header this paint just drew is a different element from the last
       one's, so the observer is re-pointed at it (§135.10). */
    watchSetupHead();
    /* PUT THE SCREEN BACK BEFORE THE BROWSER SHOWS IT (§75). Synchronous, in
       the same frame as the rebuild, so nothing is ever drawn at the top and
       then moved — that flash is the jump, only quicker. */
    putScrollsIn(document.getElementById("panel"), _keep.boxes);
    if (_keep.y) window.scrollTo(0, _keep.y);
    putFocus(_keep.focus);
    positionRowMenu();
    focusOpenMenu();
    /* ── AND THE DIALOG, IF ONE IS OPEN (§116.6) ─────────────────────
       The person dialog's own controls — the role picker, the Unit select,
       "Use it" — are the register's, so they all end in `paint()`. That
       repaints the page BEHIND the dialog and, before this line, left the
       dialog itself showing the state it was built with: press "+ role" and
       nothing appeared, because the select had been rendered into a body
       nobody replaced.

       Here rather than in each handler, for the reason §24 gives: a control
       added to the dialog later would otherwise be silent until somebody
       remembered. `personDialogPaint()` never calls paint(), so there is no
       loop — and it REPLACES the body, so the bindings wire() has just made on
       the old nodes die with them rather than doubling up (§47.2). */
    if (PDLG && document.getElementById("modal-b")) personDialogPaint();
    /* AND WHERE YOU ARE IS REMEMBERED HERE, for the same reason the save is
       (§173): every navigation ends in a paint, so one line covers a door
       added tomorrow and there is no list of handlers to keep up to date. */
    rememberWhere();
    /* Every mutation repaints, so this is where a change becomes a save. */
    SYNC.afterPaint();
  }

  /* ── A CLIPPED VALUE IS ONE HOVER FROM THE WHOLE OF ITSELF (§88) ───
     Setup table cells are one line and clip with an ellipsis, which is only
     honest if the rest is still reachable. This is the reachability, and it is
     done HERE rather than in the twenty renderers that build those cells: a
     `title` written at render time is a guess about whether the value will fit
     — it depends on the column, the viewport and which columns are switched on
     — and the twenty guesses would be wrong in different places. Measured
     after the paint, it is not a guess at all.

     ONLY WHERE SOMETHING IS ACTUALLY HIDDEN, and removed again when it is not:
     a title on a value you can already read is a tooltip that covers the row
     you are pointing at. And never over a title somebody else set — the
     register's name cell carries the full name and the sign-in key on its own
     hover (§81.1), which says more than this would. */
  /* Held across paints so the previous one is disconnected rather than left
     observing elements nothing can reach — an observer per paint, kept, is a
     leak that grows for as long as the tab is open. */
  var PINSEE = null;
  function pinWatch(){
    if (PINSEE) { PINSEE.disconnect(); PINSEE = null; }
    var bands = document.querySelectorAll(".pane > .pband");
    if (!bands.length || typeof IntersectionObserver !== "function") return;
    /* Every band on a page shares one offset, so one observer serves them
       all — a function's Projects page draws one per capability. */
    var top = parseFloat(getComputedStyle(bands[0]).top);
    if (!(top >= 0)) return;
    PINSEE = new IntersectionObserver(function(rows){
      rows.forEach(function(r){
        /* Wholly inside the shrunk root means it is still in the flow;
           anything less means it has reached its offset and pinned. It also
           reads "pinned" once the band has scrolled off the BOTTOM, which is
           true of nothing anybody can see and costs nothing. */
        r.target.classList.toggle("pinned", r.intersectionRatio < 1);
      });
    }, { threshold: [1], rootMargin: "-" + (top + 1) + "px 0px 0px 0px" });
    Array.prototype.forEach.call(bands, function(b){ PINSEE.observe(b); });
  }
  function clipTitles(){
    document.querySelectorAll(".cfg table td").forEach(function(td){
      /* A CELL THAT ALREADY SAYS SOMETHING ON HOVER KEEPS SAYING IT. The
         register's name cell carries the full name AND the sign-in key
         (§81.1); a title on the <b> inside would cover it with less. */
      if (td.title) return;
      var kids = td.querySelectorAll(".val, .why, b, .mono");
      var list = kids.length ? kids : [td];
      list.forEach(function(el){
        if (el.dataset.keepTitle) return;
        var hidden = el.scrollWidth - el.clientWidth > 1;
        if (hidden && !el.title) el.title = (el.textContent || "").trim();
        else if (!hidden && el.dataset.clipTitle) el.removeAttribute("title");
        if (hidden && el.title) el.dataset.clipTitle = "1";
      });
    });
  }

  /* ── PLACING A DROPDOWN PANEL (§76.2) ──────────────────────────────
     `position:fixed`, so it is not clipped by the `.cfg` box this row lives in
     (§45.5) — and fixed means nothing positions it but this. Under its button,
     nudged left when it would run off the right edge, and flipped above when
     there is more room up than down. */
  function positionDD(){
    var pop = document.querySelector(".ddpop");
    if (!pop) return;
    var btn = document.querySelector('[data-ddopen="' + pop.dataset.ddpop + '"]');
    if (!btn) return;
    var r = btn.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
    var below = window.innerHeight - r.bottom;
    var top = (below < h + 12 && r.top > below) ? Math.max(8, r.top - h - 6) : r.bottom + 6;
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(top) + "px";
  }

  /* A row's action menu is position:fixed, so somebody has to put it where its
     button is. It is placed AFTER the paint that created it — measuring an
     element before it is in the document gives zeroes — and flipped above the
     button when there is no room below, because a menu that opens off the
     bottom of the window is a menu whose last item cannot be reached. */
  /* PICKING A NEW PILLAR PUTS YOU AT THE TOP OF IT (Islam, 2026-08-22).
     The rail is sticky, so it is still under the cursor after you have scrolled
     a long way down the tactics table — you pick the next pillar and land
     halfway down a table you have not read. `scrollTo(0,0)` is wrong here: it
     would throw away the rail's pinned position and put the page header back
     on screen, when what is wanted is the TOP OF THE PANE with the rail still
     pinned beside it.

     So it scrolls to the split's own offset less the chrome and the rail gap —
     the same two numbers the rail's sticky offset is built from, read from the
     same custom properties, so the pane's top lands exactly where the rail's
     does. And only ever UPWARDS: if you are already above that point, a
     scroll down to reach it would be the page moving for no reason. */
  function toPaneTop(){
    var split = document.querySelector("#panel .split");
    if (!split) return;
    var cs = getComputedStyle(document.documentElement);
    var chrome = parseFloat(cs.getPropertyValue("--chrome-h")) || 0;
    var gap = parseFloat(cs.getPropertyValue("--rail-gap")) || 0;
    var want = split.getBoundingClientRect().top + window.scrollY - chrome - gap;
    if (window.scrollY > want) window.scrollTo({ top: Math.max(0, want) });
  }

  /* ══ A MENU TAKES FOCUS, AND GIVES IT BACK (§48.4) ════════════════
     The row menu and the two header menus opened without moving focus, so
     their items could only be reached by tabbing the whole document — and
     closing one dropped focus to <body>. Both are the same omission and both
     are fixed by the pattern searchsel.js already uses for its popup.

     Called from the same place as positionRowMenu(), which is AFTER the paint
     that created the menu: focusing a node the paint is about to replace
     focuses nothing. */
  var MENURETURN = null;
  function focusOpenMenu(){
    var m = document.querySelector(".kmenu, .hmenu-panel");
    if (!m) {
      /* Closed. Put focus back on whatever opened it, if that control is still
         on the page — a repaint may have replaced it, so it is looked up by
         its data attribute rather than held as a node. */
      if (MENURETURN) {
        var back = document.querySelector(MENURETURN);
        MENURETURN = null;
        if (back && document.activeElement === document.body) back.focus();
      }
      return;
    }
    var btn = m.parentNode.querySelector("[data-pmenu],[data-colmenu],[data-pwmenu]");
    if (btn) {
      MENURETURN = btn.dataset.pmenu ? '[data-pmenu="' + btn.dataset.pmenu + '"]'
                : btn.hasAttribute("data-colmenu") ? "[data-colmenu]" : "[data-pwmenu]";
    }
    /* Only when the menu has just appeared under the keyboard — a mouse user
       who clicked it does not want the first item stealing their pointer. */
    if (document.activeElement === document.body || document.activeElement === btn) {
      var first = m.querySelector("button:not([disabled]), input");
      if (first) first.focus();
    }
  }

  function positionRowMenu(){
    var m = document.querySelector(".kmenu");
    if (!m) return;
    /* EVERY BUTTON THAT OPENS ONE OF THESE (§93.14). This read `[data-pmenu]`
       alone and RETURNED QUIETLY when it found none — so the Functions table's
       menu and its three confirmation panels were never positioned at all and
       rendered 89px and 155px past the right edge of the window, with Close
       entirely outside it. §51.11's fault in a helper rather than in a check:
       a selector that no longer covers everything it is asked about does not
       fail, it silently does nothing. A menu added to a third table is
       positioned the day it is added by being given an attribute here. */
    var btn = m.parentNode.querySelector("[data-pmenu],[data-fnmenu]");
    if (!btn) return;
    var r = btn.getBoundingClientRect(), h = m.offsetHeight, w = m.offsetWidth;
    var below = window.innerHeight - r.bottom - 8;
    var top = (below >= h || r.top < h + 8) ? r.bottom + 4 : r.top - h - 4;
    m.style.top  = Math.max(8, top) + "px";
    m.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + "px";
  }

  function fieldSaved(){
    if (typeof SYNC !== "undefined" && SYNC.afterPaint) SYNC.afterPaint();
  }
  /* §145.14: pressing "Fill in missing elements" opens fill mode for the
     page it names and walks straight to the first blank — one press, one
     field under the cursor. With no page (a section that cannot fill, like
     the SWOT), the walk itself finds the first place that owes. */
  function enterFillMode(page){
    if (page) EDIT_PAGE[page] = true;
    paint();
    /* THE WALK WAITS FOR THE PAINT IT NEEDS. On a real press, paint() is HELD
       until the click has landed (§30.1's CLICKING guard, released by a timer
       scheduled on mouseup) — so walking synchronously here reads the
       read-mode page, finds zero fillable fields, and the fallback marches
       off to another place's chip while THIS page is full of gaps. A
       zero-delay timer queues behind the mouseup's release timer, so the walk
       always sees the repainted page; on a programmatic click paint ran
       synchronously and the timer merely walks a beat later. */
    setTimeout(gapWalk, 0);
  }
  /* ── NEXT GAP (§145.12): walk the fillable blanks on this page ─────────
     Field to field in document order, wrapping; the ring says which one the
     press landed on. When the page holds none, the walk goes to the first
     PLACE still owing — through the band's own chip, so the two ways of
     moving cannot disagree about where a place is. */
  /* ── WALKING THE GAPS (§145.14, made to work in §177.2) ──────────────
     Islam, pressing it: *"the CUS01 3 button just opens the project and the
     next gap does nothing."* Three faults, and each hid the next.

     1 · THE SELECTOR WAS AN ELEMENT TYPE. `.fld.gapfld` means an input or a
         select wearing fill mode's class, so §177's month picker — a BUTTON —
         was invisible to it, and on a project whose only gaps are due dates
         the walker found nothing and fell back to clicking the chip for the
         page it was already on. `.gapwalk` is the marker now, put on by
         gapCell in both modes and carrying no styling of its own.
     2 · AN AUTHOR'S FIELDS WERE NEVER MARKED AT ALL, so this had never done
         anything in the office's pen — the loudest button on the bar, dead
         for the person who uses it most.
     3 · IT USED `document.activeElement` AS ITS CURSOR, and pressing the
         button moves focus TO THE BUTTON, so every press computed "I am
         nowhere" and lit the first field again. It reads the lit element
         instead, which nothing but this function touches.

     AND IT CROSSES PLACES, because the button says "N left" of the whole
     subject: exhaust this page and it presses the next chip that still owes,
     then walks that page's first gap — behind `setTimeout`, because a real
     press holds the paint until the click lands (§30.1, §145.14). */
  function gapWalkFields(place){
    /* Scoped to ONE place when a chip has just named one -- a function's
       projects page draws every capability at once, so the page's first gap
       is not the chip's first gap (§177.2). */
    var root = document;
    if (place) root = document.querySelector('[data-gplace="' +
      place.replace(/"/g, '\\"') + '"]') || document;
    return [].slice.call(root.querySelectorAll(".gapwalk, .qs-fill"));
  }
  function gapLight(el){
    document.querySelectorAll(".gaplit").forEach(function(e){ e.classList.remove("gaplit"); });
    /* THE CURSOR IS MARKED ON THE WALKABLE ELEMENT, NOT ON THE LIT ONE. For a
       §130.1 picker those are two different nodes -- the native select is
       hidden and its `.ssbtn` is what gets the ring -- and the ssbtn is a
       SIBLING, so a cursor read back off the lit element found nothing among
       the fields and every press lit the first one again (§34: whoever hides
       a field hides its furniture, and whoever walks to one must still know
       which field it was). */
    document.querySelectorAll("[data-gapat]").forEach(function(e){
      e.removeAttribute("data-gapat"); });
    el.setAttribute("data-gapat", "1");
    /* §130.1's pickers are searchsel-enhanced: the native select is HIDDEN in
       place with a button in front of it, so ringing the select itself lights
       nothing anybody can see (§34: whoever hides a field hides its
       furniture — and whoever walks to one walks to its furniture). */
    var lit = el;
    if (lit.previousElementSibling && lit.previousElementSibling.classList &&
        lit.previousElementSibling.classList.contains("ssbtn"))
      lit = lit.previousElementSibling;
    lit.classList.add("gaplit");
    lit.scrollIntoView({ block: "center" });
    var f = lit.matches("input,select,textarea,button")
      ? lit : lit.querySelector("button,input,select,textarea");
    if (f) f.focus({ preventScroll: true });
  }
  /* The first place that still owes and is NOT already on the screen.
     A FUNCTION'S PROJECTS PAGE DRAWS EVERY CAPABILITY AT ONCE, each with its
     own rail, so several chips can be showing at the same moment — "the next
     chip after the current one" picked one of those and the walk appeared to
     wrap without going anywhere. Asked as "is this one visible" instead,
     which is the same question a unit's single rail answers trivially. */
  function gapChipShown(c){
    /* RAIL_SHOWN, not RAIL: the first holds what the renderer DREW, the
       second only what somebody has picked, and on a page nobody has clicked
       the second is empty while the panes are plainly there (§177.2). */
    return (!c.dataset.grail || RAIL_SHOWN[c.dataset.grail] === c.dataset.gcode) &&
           (!c.dataset.gsec || CURSEC[currentSub] === c.dataset.gsec);
  }
  function gapChips(){
    return [].slice.call(document.querySelectorAll("[data-gapband] .mchip:not(.done)"));
  }
  function gapPlaceOfChip(c){
    return c && c.dataset.grail ? c.dataset.grail + "|" + c.dataset.gcode : null;
  }
  /* WHICH CHIP'S PLACE WE ARE WALKING. Remembered across paints, because
     landing on a place repaints the page and the answer has to survive that;
     falls back to the first place that is actually on screen, which is what
     the first press of all needs. */
  var GAPWALK_KEY = null;
  function gapChipAt(chips){
    for (var i = 0; i < chips.length; i++)
      if (chips[i].dataset.gkey === GAPWALK_KEY) return i;
    for (var j = 0; j < chips.length; j++) if (gapChipShown(chips[j])) return j;
    return -1;
  }
  function gapGoTo(chip){
    GAPWALK_KEY = chip.dataset.gkey;
    var place = gapPlaceOfChip(chip);
    chip.click();
    setTimeout(function(){
      var f = gapWalkFields(place);
      if (!f.length) f = gapWalkFields();
      if (f.length) gapLight(f[0]);
    }, 0);
  }
  function gapWalk(){
    var chips = gapChips();
    var i = gapChipAt(chips);
    var els = gapWalkFields(i >= 0 ? gapPlaceOfChip(chips[i]) : null);
    var cur = document.querySelector("[data-gapat]");
    var at = cur ? els.indexOf(cur) : -1;
    if (els.length && at < els.length - 1) return gapLight(els[at + 1]);
    /* Exhausted here. THE NEXT PLACE IN THE BAND'S OWN ORDER, not the first
       one that happens to be off screen -- taking the first sent the walk
       between two places for ever and never reached the third.

       AND WHAT IS SKIPPED IS THE SAME PAGE, NOT WHAT IS VISIBLE. Skipping
       every chip already on screen looked right and was not: a function's
       projects page draws several capabilities at once, so a project that was
       plainly visible had never been WALKED -- the field list is scoped to one
       place. Two chips are the same page when they name the same place, or
       when neither names one and both sit in the same section (a unit's
       Foundation and Objectives are two chips over one page). */
    var here = i >= 0 ? gapPlaceOfChip(chips[i]) : null;
    var hereSec = i >= 0 ? (chips[i].dataset.gsec || "") : "";
    var n = chips.length;
    for (var step = 1; step <= n; step++) {
      var c = chips[((i < 0 ? 0 : i) + step) % n];
      var cp = gapPlaceOfChip(c);
      var samePage = cp === here &&
        (cp !== null || (c.dataset.gsec || "") === hereSec);
      if (!samePage) return gapGoTo(c);
    }
    if (els.length) gapLight(els[0]);
  }
  /* ── AND THE SAME WALK OVER THE PENDING VALUES (§192) ──────────────
     Islam, as the SMO: *"I'm getting this badge but I don't know where they
     are — I think we need a flow like the filling to take me through the
     confirmation areas so I can confirm."* §16.7's rule: a count that cannot
     take you to what it counts is a count that makes work.

     THE SAME SHAPE AS THE GAP WALK, deliberately — one behaviour to learn,
     and the same three traps already paid for there (§177.2): the cursor is
     marked on the WALKABLE element, a place is crossed by the same page test
     rather than by what happens to be visible, and landing queues behind the
     click (§30.1's CLICKING guard holds the paint, so the ticks do not exist
     until the press has landed).

     THE PLACES COME FROM `pendMap()`, which is `gapMap()` counting marks — so
     the order, the words and the navigation are one answer for both walks and
     cannot drift (§53.5). The chips it walks are BUILT here rather than drawn
     on the bar: the office asked for a way THROUGH them, not for a second row
     of counts beside the missing ones (§41's budget). */
  var PENDWALK_KEY = null;
  function pendPlaces(){
    if (typeof pendMap !== "function") return [];
    return pendMap(TARGET).filter(function(e){ return e.count > 0; });
  }
  function pendPlaceKey(e){
    return e && e.go && e.go.rail ? e.go.rail + "|" + e.go.code : null;
  }
  function pendWalkTicks(place){
    var root = document;
    if (place) root = document.querySelector('[data-gplace="' +
      place.replace(/"/g, '\\"') + '"]') || document;
    return [].slice.call(root.querySelectorAll(".pendwalk"));
  }
  function pendLight(el){
    document.querySelectorAll(".gaplit").forEach(function(e){ e.classList.remove("gaplit"); });
    document.querySelectorAll("[data-gapat]").forEach(function(e){
      e.removeAttribute("data-gapat"); });
    el.setAttribute("data-gapat", "1");
    el.classList.add("gaplit");
    el.scrollIntoView({ block: "center" });
    el.focus({ preventScroll: true });
  }
  function pendShown(e){
    return (!e.go.rail || RAIL_SHOWN[e.go.rail] === e.go.code) &&
           (!e.go.sec || CURSEC[currentSub] === e.go.sec);
  }
  function pendAt(places){
    for (var i = 0; i < places.length; i++)
      if (places[i].key === PENDWALK_KEY) return i;
    for (var j = 0; j < places.length; j++) if (pendShown(places[j])) return j;
    return -1;
  }
  /* Navigating by the place's OWN description rather than by pressing a chip,
     because there is no chip to press — the same three `data-` values the
     missing chips carry, read straight off the map that produced them. */
  function pendGoTo(e){
    PENDWALK_KEY = e.key;
    if (e.go.sec && typeof CURSEC !== "undefined") CURSEC[currentSub] = e.go.sec;
    if (e.go.rail) RAIL[e.go.rail] = e.go.code;
    paint();
    if (typeof toPaneTop === "function") toPaneTop();
    setTimeout(function(){
      var t = pendWalkTicks(pendPlaceKey(e));
      if (!t.length) t = pendWalkTicks();
      if (t.length) pendLight(t[0]);
    }, 0);
  }
  function pendWalk(){
    var places = pendPlaces();
    if (!places.length) return;
    var i = pendAt(places);
    var ticks = pendWalkTicks(i >= 0 ? pendPlaceKey(places[i]) : null);
    var cur = document.querySelector("[data-gapat]");
    var at = cur ? ticks.indexOf(cur) : -1;
    if (ticks.length && at < ticks.length - 1) return pendLight(ticks[at + 1]);
    var here = i >= 0 ? pendPlaceKey(places[i]) : null;
    var hereSec = i >= 0 ? (places[i].go.sec || "") : "";
    var n = places.length;
    for (var step = 1; step <= n; step++) {
      var e = places[((i < 0 ? 0 : i) + step) % n];
      var ep = pendPlaceKey(e);
      var samePage = ep === here &&
        (ep !== null || (e.go.sec || "") === hereSec);
      if (!samePage) return pendGoTo(e);
    }
    if (ticks.length) pendLight(ticks[0]);
  }

    /* ── THE MONTH PICKER (§177) ────────────────────────────────────────
       A due date is chosen, never typed. The button carries the FIELDS index
       and the month and year it is currently showing; the panel is built by
       monthPopHtml() and mounted on <body> as position:fixed, because a
       project's tables sit inside `.tblscroll` and an absolute panel is
       clipped to a strip of it (§45.5 settled this for searchsel).

       PICKING FIRES THE SETTER AND NOTHING ELSE. `data-fld` writes without
       repainting (§71.2), and this is the same contract: close the panel
       FIRST -- the click is still inside it (§30.1) -- then write, then let
       paint() run, which is what turns the red button amber. Stepping the
       year rebuilds only the panel, so the year can be walked without
       committing anything. */
  var MONTHPOP = (function(){
      var open = null;
      var shut = function(){
        if (!open) return;
        open.pop.remove();
        open.btn.classList.remove("open");
        open.btn.setAttribute("aria-expanded", "false");
        document.removeEventListener("pointerdown", open.onDoc, true);
        document.removeEventListener("keydown", open.onKey, true);
        window.removeEventListener("scroll", open.onGone, true);
        window.removeEventListener("resize", open.onGone, true);
        open = null;
      };
      var place = function(btn, pop){
        var r = btn.getBoundingClientRect();
        var h = pop.offsetHeight, w = pop.offsetWidth;
        var below = window.innerHeight - r.bottom - 8;
        var top = (below >= h || r.top < h + 8) ? r.bottom + 4 : r.top - h - 4;
        var left = Math.min(r.left, Math.max(8, window.innerWidth - w - 8));
        pop.style.top = Math.max(8, top) + "px";
        pop.style.left = left + "px";
      };
      var draw = function(btn){
        var mi = btn.dataset.mi === "" ? null : +btn.dataset.mi;
        var yr = +btn.dataset.yr;
        /* The lit month belongs to the year it was set in: step to 2027 and
           nothing is lit, step back and Jul lights again. */
        open.pop.innerHTML = monthPopHtml(mi, yr, yr === open.setYear);
        place(btn, open.pop);
      };
      var write = function(value){
        var btn = open.btn, i = +btn.dataset.month;
        shut();
        var fn = FIELDS[i];
        if (!fn) return;
        fn(value);
        fieldSaved();
        paint();
      };
      document.addEventListener("click", function(ev){
        var btn = ev.target.closest && ev.target.closest("[data-month]");
        if (btn) {
          var was = open && open.btn === btn;
          shut();
          if (was) return;
          var pop = document.createElement("div");
          pop.className = "monthpop";
          pop.setAttribute("role", "dialog");
          pop.setAttribute("aria-label", "Pick a month");
          document.body.appendChild(pop);
          var onDoc = function(e){
            if (!pop.contains(e.target) && !btn.contains(e.target)) shut();
          };
          var onKey = function(e){ if (e.key === "Escape") { shut(); btn.focus(); } };
          var onGone = function(e){ if (!pop.contains(e.target)) shut(); };
          open = { btn: btn, pop: pop, onDoc: onDoc, onKey: onKey, onGone: onGone,
                   setYear: +btn.dataset.yr };
          /* Nothing is lit until a month has been set: an empty cell must not
             open with July already looking chosen (§15.1, absent never zero). */
          if (btn.dataset.mi === "") open.setYear = null;
          btn.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
          draw(btn);
          document.addEventListener("pointerdown", onDoc, true);
          document.addEventListener("keydown", onKey, true);
          window.addEventListener("scroll", onGone, true);
          window.addEventListener("resize", onGone, true);
          return;
        }
        if (!open) return;
        var step = ev.target.closest("[data-myr]");
        if (step && open.pop.contains(step)) {
          open.btn.dataset.yr = +open.btn.dataset.yr + (+step.dataset.myr);
          draw(open.btn);
          return;
        }
        var pick = ev.target.closest("[data-mpick]");
        if (pick && open.pop.contains(pick))
          return write(monthValue(+pick.dataset.mpick, +open.btn.dataset.yr));
        if (ev.target.closest("[data-mclear]") && open.pop.contains(ev.target))
          return write("");
      });
      return { shut: shut };
    })();

  function wire(){
    /* `[data-s]`, NOT every button in the row (§150.1). The row gained a
       second kind of child when the reporting controls moved onto it, and
       this selector said "a button here is a tab" — so pressing Save draft
       set `currentSub = undefined`, dropped the modes and repainted, which
       from the outside looked exactly like the report closing itself. A
       control is not a tab because of where it sits; a tab is the thing
       carrying the key. Found by pressing the button, not by reading — every
       assertion short of clicking it passed (§96's family). */
    document.querySelectorAll("#subtabs button[data-s]").forEach(function(b){
      b.addEventListener("click", function(){
        /* A TAB IS SOMEWHERE ELSE TOO. Only the destination change dropped the
           modes, so pressing Strategy while reporting and coming back landed
           you in the report again — and, once the plan's pen turns the drag
           handles on (§63.3), it would have carried the handles onto
           Performance with no control there to turn them off. */
        if (currentSub !== b.dataset.s) leaveModes();
        currentSub = b.dataset.s; paint(); window.scrollTo(0,0);
      });
    });
    document.querySelectorAll("[data-sub2]").forEach(function(b){
      b.addEventListener("click", function(){ CURSEC[currentSub] = b.dataset.sub2; paint(); window.scrollTo(0,0); });
    });
    /* The Setup rail (§46.1). It replaces a tab row, so it does what the tab
       row did — including dropping every edit mode on the way out, or you land
       on Branding still editing People. */
    document.querySelectorAll("[data-railgrp]").forEach(function(b){
      b.addEventListener("click", function(){ toggleRailGroup(b.dataset.railgrp); paint(); });
    });
    document.querySelectorAll("[data-railtog]").forEach(function(b){
      b.addEventListener("click", function(){ setRailOpen(b.dataset.railtog === "1"); paint(); });
    });
    /* ── THE RAIL'S SEARCH (§108.13) ────────────────────────────────
       `input` filters and NEVER paints, so the caret is never disturbed and a
       half-typed word is never thrown away (§35). Re-applied at the end of
       every paint below, so a repaint arriving mid-errand restores the filter
       rather than silently showing everything again. */
    document.querySelectorAll("[data-railq]").forEach(function(inp){
      inp.addEventListener("input", function(){ RAILQ = inp.value; railFilter(); });

      inp.addEventListener("keydown", function(e){

           Cleared before paint(), so the box below is rendered empty. */
        RAILQ = "";

           every mode added since — the open row, the composed message, the
           sent-a-test sentence — was cleared when you left a UNIT and kept when

    });

    document.querySelectorAll("input.fwt").forEach(function(inp){

    var add = document.getElementById("addf");

        CLEARING = b.dataset.clear; CLEARMENU = null; FNMENU = null; paint(); });
    });
    document.querySelectorAll("[data-clearno]").forEach(function(b){
      b.addEventListener("click", function(){
        CLEARING = null; CLEARMENU = null; FNMENU = null; paint(); });
    });
    document.querySelectorAll("[data-clearyes]").forEach(function(b){
      b.addEventListener("click", function(){
        /* One handler for all three levels \u2014 a unit, a function, or everything
           \u2014 so clearing behaves identically wherever it is reached from. */
        var p = b.dataset.clearyes.split("|");
        /* "cleared" is what the archive will be FILED under, so the list says
           how a plan left rather than only that it did (§49.2). */
        if (p[0] === "all") { if (p[1] === "plan") clearAllPlans("cleared"); else clearAllNumbers(); }
        else if (p[0] === "fnall") {
          FUNCTION_KEYS.forEach(function(k){ clearFunction(k, p[2] === "plan" ? "plan" : "nums", "cleared"); });
        }
        else if (p[0] === "fn") { clearFunction(p[1], p[2] === "plan" ? "plan" : "nums", "cleared"); }
        else if (p[1] === "plan") clearUnitPlan(UNITS[p[0]], "cleared");
        else clearUnitNumbers(UNITS[p[0]]);
        CLEARING = null; paint();
      });
    });
    document.querySelectorAll("[data-uact]").forEach(function(b){
      b.addEventListener("click", function(){
        var u = UNITS[b.dataset.uact];
        u.active = !u.active;
        /* Retirement changes what the composite is over, so the weights are
           re-derived immediately rather than on the next weighting repaint \u2014
           the group figure reads them before that repaint happens. */
        syncWeights();
        paint();
      });
    });
    document.querySelectorAll("[data-kov]").forEach(function(b){
      b.addEventListener("click", function(){ KO_VIEW = b.dataset.kov; paint(); });
    });
    document.querySelectorAll("[data-tadd]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.tadd;
        /* MINTED FROM THE MAXIMUM, NEVER FROM THE COUNT (§96.2). Remove the
           middle of KO1·KO2·KO3 and add: the count says 3 and KO3 is still on
           screen, so two rows share an id. The authoriser compares plans BY ID
           (§59) and a reporting snapshot is keyed by id and never by position
           (§48), so a collision is not cosmetic. `koMint` is the one place
           that answers it, shared with the Foundation's own editor. */
        if (k === "ko")    GROUP.keyObjectives.push(
                             Object.assign(koMint(GROUP.keyObjectives, "group"), { group:null }));
        if (k === "theme") GROUP.themes.push({ ab:"NEW", name:"New theme", note:"" });
        /* THE PRE-§15 SHAPE IS GONE (§51.11). This pushed a capability with
           `measures` and `tactics` — fields §15 removed — so the row had no
           id, no function and neither list, and the Capabilities page threw on
           the next paint. One function mints one now, and both places that add
           a capability call it. */
        if (k === "cap")   addCapability();
        paint();
      });
    });
    document.querySelectorAll("[data-trm]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.trm.split("|"), i = +p[1];
        /* Removal asks once when the row carries anything \u2014 a reported
           objective or a capability with work under it is history, and units
           get a confirm for far less. A row added a moment ago and still
           empty goes without ceremony. */
        var what = null;
        if (p[0] === "ko") {
          var m = GROUP.keyObjectives[i];
          if (m && (m.actual || m.target)) what = 'the objective "' + m.name + '"' +
            (m.actual ? " and its reported " + m.actual : "");
        }
        /* Read from the fields a capability ACTUALLY has. This asked for
           `measures.length` on an object that has not carried `measures` since
           §15, so it threw before it could confirm anything and the removal
           never ran (§51.11). */
        if (p[0] === "cap") what = capabilityHolds(GROUP.capabilities[i]) || null;
        if (what && !confirm("Remove " + what + "? This cannot be undone here.")) return;
        if (p[0] === "ko")    GROUP.keyObjectives.splice(i, 1);
        if (p[0] === "theme") GROUP.themes.splice(i, 1);
        if (p[0] === "cap")   GROUP.capabilities.splice(i, 1);
        paint();
      });
    });
    /* ── ADD AND REMOVE AN OBJECTIVE, ON A FOUNDATION (§96) ─────────
       These two buttons have existed on this page for as long as the page has,
       with nothing bound to them. The group's Temple edit has had working ones
       the whole time, editing THE SAME list — which is why nobody noticed.

       Removal ASKS ONCE when the row carries anything, and goes without
       ceremony when it does not: a reported objective is history and a row
       added a moment ago is not. The same sentence the Temple's handler uses,
       because they are the same act on the same data. */
    document.querySelectorAll("[data-korm]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.korm.split("|"), e = KOLISTS[+p[0]], i = +p[1];
        if (!e) return;
        var m = e.list[i];
        if (!m) return;
        var what = (m.actual || m.target)
          ? 'the objective "' + (m.name || "") + '"' +
            (m.actual ? " and its reported " + m.actual : "")
          : null;
        if (what && !confirm("Remove " + what + "? This cannot be undone here.")) return;
        e.list.splice(i, 1);
        koSettle(e);
        fieldSaved();
        paint();
      });
    });
    document.querySelectorAll("[data-koadd]").forEach(function(b){
      b.addEventListener("click", function(){
        var e = KOLISTS[+b.dataset.koadd];
        if (!e) return;
        /* Build mode: the objective arrives whole, through the form (§129).
           Only for the subject being built — the Temple's group list keeps
           its inline add. */
        if (BUILDER && e.owner && e.owner.ukey === BUILDER.target) {
          openBuilderForm("objective", { target: BUILDER.target });
          return;
        }
        /* SETTLED BEFORE THE NEW ROW IS MINTED, or the group's six id-less
           objectives are filled in as KO1..KO6 a moment after the new row has
           already taken KO1 (§96.4). Once before, so the maximum is true; once
           after, because a unit renumbers positionally. */
        koSettle(e);
        /* The prefix a unit's ids already use, and "group" for the group's —
           read off the owner rather than passed in, so the two cannot be given
           different answers at two call sites. */
        e.list.push(koMint(e.list, (e.owner && e.owner.ukey) || "group"));
        koSettle(e);
        fieldSaved();
        paint();
      });
    });
    document.querySelectorAll("[data-fld]").forEach(function(el){
      el.addEventListener("change", function(){
        /* Written and saved, NOT repainted (§71.2). This is every editable
           field on a plan — a pillar's name, a target, an owner, a tactic —
           and with the pen on it was rebuilding the whole page each time the
           cursor left a cell, on the one screen somebody fills in left to
           right. */
        var fn = FIELDS[+el.dataset.fld];
        /* SEVERAL ANSWERS COME AS AN ARRAY (§130.1). On a `<select multiple>`
           `el.value` is only the FIRST selected option, so a collaborators cell
           wired through the plain path would have saved one name and dropped
           the rest — silently, which is the shape §96 exists to stop. Asked of
           the element rather than of the setter: `multiple` is undefined on an
           input and on a textarea, so every other field is untouched. */
        if (fn) {
          fn(el.multiple
            ? Array.prototype.filter.call(el.options, function(o){ return o.selected; })
                .map(function(o){ return o.value; })
            : el.value);
          fieldSaved();
        }
      });
      /* THE BOX GROWS WITH WHAT IS TYPED IN IT (§51.1, Islam: "the foundation
         end in mind is not editable in terms of space or empty lines").
         Every long-text field was `rows="2"`, so a purpose written as three
         paragraphs was typed through a two-line window — Enter worked, and you
         could not see that it had. Growing is not a repaint: it sets the
         element's own height and touches nothing else, so it is safe on
         `input` where a repaint would destroy the field being typed into
         (§35). Height is cleared first, or the box can only ever grow. */
      if (el.tagName === "TEXTAREA") {
        var fit = function(){
          el.style.height = "auto";
          el.style.height = (el.scrollHeight + 2) + "px";
        };
        el.addEventListener("input", fit);
        fit();
      }
    });
    document.querySelectorAll("[data-page]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.page; EDIT_PAGE[k] = !EDIT_PAGE[k]; paint();
      });
    });
    /* The plan as slides (§117): builds and saves, repaints nothing — a
       download must not cost anybody a half-typed field elsewhere (§35). */
    document.querySelectorAll("[data-dlpptx]").forEach(function(b){
      b.addEventListener("click", function(){ sendPlanPptx(b.dataset.dlpptx); });
    });
    document.querySelectorAll("[data-sec]").forEach(function(b){
      b.addEventListener("click", function(){ GSEC = +b.dataset.sec; paint(); window.scrollTo(0,0); });
    });
    /* Cards or a table, per section (§16.6). A view preference — it changes
       how a section is laid out, never what anything is or in what order it
       is stored. */
    document.querySelectorAll("[data-gview]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = b.dataset.gview.split("|");
        GVIEW[p[0]] = p[1];
        paint();
      });
    });
    document.querySelectorAll("[data-edit]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.edit; EDITING[k] = !EDITING[k]; paint();
      });
    });
    /* ── THE KNOWLEDGE BASE'S PEN (§140) ─────────────────────────────
       Bound per paint like every control above. The two text fields write on
       `change` — blur, for a text control — so typing never repaints (§35),
       and every write ends in paint(), whose §30.1 guard already holds a
       repaint asked for mid-click until the click lands. An added question's
       id is kbx<n>, minted outside the shipped ids' namespace, which is what
       lets one handler serve both kinds of card. */
    document.querySelectorAll("[data-kbpen]").forEach(function(b){
      b.addEventListener("click", function(){ KBEDIT = !KBEDIT; paint(); });
    });
    /* The two tabs (§141). Switching leaves edit mode: the pen lives on the
       questions tab, and a mode whose control is no longer on screen is §61's
       trap — a state with no way back out of it. */
    document.querySelectorAll("[data-kbtab]").forEach(function(b){
      b.addEventListener("click", function(){
        kbTabSet(b.dataset.kbtab); KBEDIT = false; paint();
      });
    });
    document.querySelectorAll("[data-kbq], [data-kba]").forEach(function(f){
      f.addEventListener("change", function(){
        var card = f.closest(".kbed"); if (!card) return;
        var id = f.dataset.kbq || f.dataset.kba;
        var q = (card.querySelector("[data-kbq]") || {}).value;
        var a = (card.querySelector("[data-kba]") || {}).value;
        if (/^kbx\d+$/.test(id)) kbSetAdded(id, q, a); else kbSetOver(id, q, a);
        paint();
      });
    });
    /* THE AUDIENCE (§161). Its own handler rather than joining the q/a one
       above: that one reads both fields off the card and writes them
       together, and a <select> firing `change` would send its own value as
       the question. Passed as the fourth argument, which the writers treat
       as "leave it alone" when undefined. */
    document.querySelectorAll("[data-kbaud]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var id = sel.dataset.kbaud, card = sel.closest(".kbed");
        var q = ((card && card.querySelector("[data-kbq]")) || {}).value;
        var a = ((card && card.querySelector("[data-kba]")) || {}).value;
        if (/^kbx\d+$/.test(id)) kbSetAdded(id, q, a, sel.value);
        else kbSetOver(id, q, a, sel.value);
        paint();
      });
    });
    /* ── THE QUESTIONS FILE (§161) ────────────────────────────────
       The register file's handlers, on the knowledge base. Every one of them
       is gated again here rather than trusting the render: a control is drawn
       for the office and a handler is the thing that actually runs (§42, the
       gate on the control). */
    document.querySelectorAll("[data-kbfilemenu]").forEach(function(b){
      b.addEventListener("click", function(){ KBFILEMENU = !KBFILEMENU; paint(); });
    });
    var dlkb = document.querySelector("[data-dlkb]");
    if (dlkb) dlkb.addEventListener("click", function(){
      if (!inOffice()) return;
      KBFILEMENU = false;
      sendXlsx(kbWorkbook(), "SMP - knowledge base questions.xlsx");
    });
    var kbf = document.getElementById("kb-file");
    if (kbf) kbf.addEventListener("change", function(){
      if (!inOffice()) return;
      var file = this.files && this.files[0];
      if (!file) return;
      KBFILEMENU = false;   /* its job is done the moment a file is picked */
      var rx = new FileReader();
      rx.onload = function(){
        readXlsx(rx.result).then(function(sheets){
          /* §48.8: A FILE THAT CANNOT BE READ HAS TO SAY SO, where the upload
             is. The likely mistake is a people workbook or a plan template
             dropped here, and naming the sheet that is missing is what tells
             somebody which file they picked up. */
          if (!sheets["Questions"]) {
            KBFILE = { name:file.name, changes:{ reword:[], audience:[], reset:[],
              add:[], blank:0,
              unknown:[{ id:"\u2014", q:"" }] } };
            KBFILE.problem = file.name + " has no sheet called Questions. Download the " +
              "questions file from Questions file and fill that one.";
            paint();
            return;
          }
          KBFILE = { name:file.name, changes:kbFromWorkbook(sheets) };
          paint();
        }).catch(function(e){
          KBFILE = { name:file.name, changes:{ reword:[], audience:[], reset:[],
            add:[], unknown:[], blank:0 },
            problem:"That file could not be read (" + (e && e.message ? e.message : "unknown") +
              "). It has to be the .xlsx downloaded from Questions file." };
          paint();
        });
      };
      rx.readAsArrayBuffer(file);
      this.value = "";   /* or picking the same file twice fires nothing */
    });
    document.querySelectorAll("[data-kbapply]").forEach(function(b){
      b.addEventListener("click", function(){

    document.querySelectorAll("[data-kbdiscard]").forEach(function(b){

    });
    document.querySelectorAll("[data-kbdel]").forEach(function(b){

    document.querySelectorAll("input.blabel").forEach(function(inp){

    /* A LEVEL'S COLOUR, AND THE TWO WAYS THE LIST CHANGES (§168). The colour

    document.querySelectorAll("[data-bcol]").forEach(function(el){

    /* A unit's company, and a company's two visibility flags. Both are

    /* Companies get the life every other Setup table has (§49.3): a name that

    document.querySelectorAll("input[data-coname]").forEach(function(inp){

    /* ── The BU list (§54.1) ────────────────────────────────────────
       A name, where it points, and a Remove that is refused while anybody
       carries it. The NAME is the key here — unlike a unit or a company,
       which carry a key under the label so a rename detaches nothing — so

    /* ADD AND REMOVE, one target at a time (§57). The dropdown adds and
       resets itself; the chip's × removes. Neither sends the whole list, so a

    document.querySelectorAll("[data-mbadd-at]").forEach(function(sel){
