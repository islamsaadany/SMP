      '<td class="num">' + by.tac[0] + '/' + by.tac[1] + '</td>' +
      '<td class="cc">' + (miss ? '<span class="badge b-late">' + miss + ' need notes</span>' : '') + '</td>' +
      '<td class="cc"><span class="badge b-' + st.key + '">' + st.label + '</span></td></tr>';
  }).join("");

  var t = { done:0, total:0, sub:0, none:0 };
  activeKeys().forEach(function(k){
    var c = reportedCount(UNITS[k]); t.done += c.done; t.total += c.total;
    var st = unitState(UNITS[k]);
    if (st.key === "done") t.sub++; if (st.key === "late") t.none++;
  });

  var head =
    '<div class="fstrip" style="margin-bottom:20px"><div class="fstrip-head">' +
      '<span class="fstrip-t">' + esc(REVIEW.name) + '</span>' +
      '<span class="fstrip-meta">' + esc(REVIEW.from) + ' to ' + esc(REVIEW.to) +
        ' &middot; due ' + esc(REVIEW.due) + ' &middot; as of Q' + REVIEW.endsQuarter + '</span>' +
      '<span class="badge b-' + (open ? "open" : "none") + '">' + (open ? "Open" : "Closed") + '</span>' +
      (can
        ? (open
            ? '<button class="editbtn danger" data-closecycle="1">Close the cycle</button>'
            : '<button class="editbtn" data-opencycle="1">Open a new cycle</button>')
        : '') +
    '</div>' +
    '<div class="fstrip-body">' +
      '<div class="kpi"><b>' + t.done + '</b><span>of ' + t.total + ' items reported</span></div>' +
      '<div class="fchips"><span class="badge b-done">' + t.sub + ' submitted</span>' +
        '<span class="badge b-part">' + (activeKeys().length - t.sub - t.none) + ' in progress</span>' +
        (t.none ? '<span class="badge b-late">' + t.none + ' not started</span>' : '') + '</div>' +
      '<div class="fmean">plan edits: ' + (open ? "SMO only while open" : "open to unit owners") + '</div>' +
    '</div></div>';

  return '<div class="kv"><span class="pill kind">SMO</span>' +
      '<span class="pill kind">' + esc(REVIEW.cadence) + '</span></div>' + head +
    section("", "Who has reported", null,
      '<div class="cfg"><table><thead><tr><th style="width:17%">Business unit</th><th>Reporting</th>' +
        '<th style="width:20%">Progress</th><th class="cc">Objectives</th><th class="cc">Measures</th>' +
        '<th class="cc">Tactics</th><th class="cc">Notes</th><th class="cc">State</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
      (open
        ? '<div class="note"><b>A cycle can be closed with gaps.</b> Waiting for the last number ' +
          'means never closing, and a cycle that never closes writes no history. Whatever is ' +
          'unreported closes as unreported and stays visibly so.</div>'
        : '<div class="note"><b>' + esc(REVIEW.name) + ' is closed.</b> Its figures are a record. ' +
          'Opening a new cycle asks every unit again and lets each score show what it was last time.</div>') +
      (HISTORY.length
        ? '<h4 class="mini">Closed cycles</h4><div class="cfg"><table><thead><tr><th>Cycle</th>' +
          '<th class="cc">Group figure</th></tr></thead><tbody>' +
          HISTORY.map(function(h){
            return '<tr><td>' + esc(h.name) + '</td><td class="num">' + h.group + '%</td></tr>';
          }).join("") + '</tbody></table></div>'
        : ''));
}

/* ── Setup · Supporting functions ───────────────────────────────────
   The same screen as Business units, because it configures the same kind of
   thing: an editable name, a short name for the navigation, a code prefix for
   numbering its work, one head and one Strategy custodian, and retirement
   rather than deletion. Two configuration pages that mean the same thing should
   not behave differently. */
function renderFunctions(){
  var editable = grant("c_fns") === "edit" && EDITING.fns;
  var pick = function(role, current, fk){
    if (!editable) {
      var n = personName(current);
      return n ? esc(n) : '<span class="why" style="margin:0">unassigned</span>';
    }
    return '<select class="fld" data-fnrole="' + fk + '|' + role + '">' +
      '<option value="">unassigned</option>' +
      PEOPLE.map(function(p){
        return '<option value="' + p.key + '"' + (p.key === current ? " selected" : "") + '>' +
          esc(p.name) + '</option>';
      }).join("") + '</select>';
  };

  var rows = FUNCTION_KEYS.map(function(fk, i){
    var f = FUNCTIONS[fk], caps = capsOfFunction(fk);
    return '<tr' + (f.active === false ? ' class="retired"' : '') + '>' +
      '<td class="idx">' + (i + 1) + '</td>' +
      '<td>' + (editable
        ? '<input class="fld" value="' + esc(f.name) + '" data-fname="' + fk + '">'
        : '<b>' + esc(f.name) + '</b>') +
        '<span class="why mono">key ' + fk + '</span></td>' +
      '<td>' + (editable
        ? '<input class="fld" value="' + esc(f.navName || "") + '" data-fnav="' + fk +
          '" placeholder="' + esc(f.name) + '">'
        : (f.navName ? '<span class="val">' + esc(f.navName) + '</span>'
                     : '<span class="why" style="margin:0">' + esc(f.name) + '</span>')) + '</td>' +
      '<td class="cc">' + (editable
        ? '<input class="fld mono" value="' + esc(f.codePrefix || "") + '" data-fpx="' + fk + '">'
        : '<span class="mono">' + esc(f.codePrefix || "\u2014") + '</span>') + '</td>' +
      '<td class="cc"><span class="mono">' + caps.length + '</span></td>' +
      '<td class="cc">' + pick("head", f.head, fk) + '</td>' +
      '<td class="cc">' + pick("custodian", f.custodian, fk) + '</td>' +
      '<td class="cc">' + (editable
        ? '<div class="rowacts">' +
            '<button class="linkbu" data-fnretire="' + fk + '">' +
              (f.active === false ? "Reinstate" : "Retire") + '</button>' +
            (CLEARING === "fn|" + fk + "|plan"
              ? '<span class="confirm"><b>Clear the whole plan?</b>' +
                  '<span class="why" style="margin:0">Key objectives and projects across ' +
                    functionCapCount(fk) + ' ' +
                    (functionCapCount(fk) === 1 ? "capability" : "capabilities") +
                    '. The definitions stand.</span>' +
                  '<button class="rmbtn" data-clearyes="fn|' + fk + '|plan">Yes, clear the plan</button>' +
                  '<button class="linkbu" data-clearno="1">Cancel</button></span>'
              : CLEARING === "fn|" + fk + "|nums"
              ? '<span class="confirm"><b>Clear the reported progress?</b>' +
                  '<span class="why" style="margin:0">Actuals and notes across ' +
                    functionCapCount(fk) + ' ' +
                    (functionCapCount(fk) === 1 ? "capability" : "capabilities") +
                    '. The plan stands.</span>' +
                  '<button class="rmbtn" data-clearyes="fn|' + fk + '|nums">Yes, clear the progress</button>' +
                  '<button class="linkbu" data-clearno="1">Cancel</button></span>'
              : '<button class="linkbu" data-clear="fn|' + fk + '|nums">Clear progress</button>' +
                '<button class="linkbu" data-clear="fn|' + fk + '|plan">Clear plan</button>') +
          '</div>'
        : '<span class="pill ' + (f.active === false ? "none" : "good") + '">' +
            (f.active === false ? "Retired" : "Active") + '</span>') + '</td></tr>';
  }).join("");

  return cfgHead("Supporting functions",
      ['<span class="pill kind">SMO</span>', activeFunctionKeys().length + ' active',
       GROUP.capabilities.length + ' capabilities'],
      "fns", grant("c_fns") === "edit", "fnall",
      ["Clear all progress", "Clear all plans"]) +
    section("", "", null,
      '<div class="cfg"><table><thead><tr><th class="idx">#</th><th style="width:20%">Function</th>' +
        '<th style="width:14%">Shown in the nav</th><th class="cc" style="width:8%">Code</th>' +
        '<th class="cc" style="width:10%">Capabilities</th>' +
        '<th class="cc" style="width:16%">Head</th><th class="cc" style="width:16%">Strategy custodian</th>' +
        '<th class="cc" style="width:10%">Status</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
      (editable ? '<div class="addrow"><button class="editbtn" id="addfn">+ Add a supporting function</button></div>' : '') +
      '<div class="note"><b>The short name is for the navigation only.</b> Leave it blank and the ' +
        'full name is used. Page titles and every export keep the full name.</div>' +
      '<div class="note">A function carries no plan, no weight and no pillars \u2014 it improves a ' +
        'cross-cutting capability the whole group depends on. The <b>code prefix</b> numbers the work ' +
        'it owns, the way a unit\'s prefix numbers its pillars.</div>' +
      '<div class="note">A function is <b>retired, never deleted</b>: it carries reported history, ' +
        'and removing it would rewrite what was already said. <b>The custodian slot is optional</b> \u2014 ' +
        'where the head does the work themselves they already have access as head.</div>');
}

/* ── Setup · Capabilities ───────────────────────────────────────────
   The SMO decides which capabilities exist and which function owns each. Each
   belongs to exactly one function; the enhancement work inside them arrives by
   template, the way a unit's plan does. */
function renderCaps(){
  var editable = grant("c_caps") === "edit";
  var rows = GROUP.capabilities.map(function(c, i){
    var f = functionOf(c.fn);
    return '<tr><td class="idx">' + (i+1) + '</td>' +
      '<td><b>' + esc(c.name) + '</b></td>' +
      '<td>' + (editable
        ? '<select class="fld" data-capfn="' + i + '">' +
            '<option value="">\u2014 unassigned \u2014</option>' +
            FUNCTION_KEYS.map(function(k){
              return '<option value="' + k + '"' + (k === c.fn ? " selected" : "") + '>' +
                esc(FUNCTIONS[k].name) + '</option>';
            }).join("") + '</select>'
        : '<span class="val">' + esc(f ? f.name : "\u2014") + '</span>') + '</td>' +
      '<td class="nowrapcell">' + esc(f ? (personName(f.head) || "\u2014") : "\u2014") + '</td>' +
      '<td class="num">' + c.keyObjectives.length + '</td>' +
      '<td class="num">' + c.projects.length + '</td></tr>';
  }).join("");

  var orphan = GROUP.capabilities.filter(function(c){ return !c.fn; }).length;
  return '<div class="kv"><span class="pill kind">SMO</span>' +
      '<span class="pill ' + (orphan ? "none" : "good") + '">' +
        (orphan ? orphan + " unassigned" : "all assigned") + '</span></div>' +
    section("", "Capabilities", null,
      /* Widths set so a long head name \u2014 "Strategy Management Office" \u2014 does not
         wrap and leave one row taller than the rest, which reads as broken
         shading rather than as a long name. */
      '<div class="cfg"><table><thead><tr><th class="idx">#</th><th style="width:26%">Capability</th>' +
        '<th style="width:20%">Owned by</th><th style="width:24%">Head</th>' +
        '<th class="cc">Key objectives</th><th class="cc">Projects</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
      '<div class="note"><b>One function each.</b> A function may hold several capabilities \u2014 ' +
        'Marketing carries two \u2014 which is why a custodian is named after the function and never ' +
        'after a capability: naming someone after one breaks the moment a second is assigned.</div>' +
      '<div class="note"><b>A capability carries projects, and optionally key objectives.</b> ' +
        'Key objectives are optional because some capabilities hold interrelated projects serving ' +
        'one number at the top and others are a portfolio of unrelated work: where there are none ' +
        'the card is hidden rather than shown at zero. Each project carries a brief, its ' +
        'deliverables and outcomes \u2014 half its performance each \u2014 and its milestones, which are ' +
        'its execution.</div>');
}

</script>
<script>
/* ── Presentation mode ────────────────────────────────────────────────────
   A unit's review, built from whatever the platform holds at the moment it is
   opened. There is no exported copy and no version to go stale: a figure
   corrected an hour before the meeting is the figure on the slide.

   It is a mode rather than a page. It takes the whole window, the app chrome
   disappears, and Exit returns the presenter to exactly where they were.
   ──────────────────────────────────────────────────────────────────────── */

var DECK = { i:0, slides:[], root:null };

function dPct(v){ return v == null || isNaN(v) ? "&mdash;" : v + "%"; }
function dBand(v){ return band(v); }

function deckSlides(u){
  var S = [];
  var ko = unitObjectives(u), ex = unitRatio(u);
  var dl = deltaFor(u.ukey);
  var dtag = (!dl || !dl.d) ? "" :
    '<span class="ddelta ' + (dl.d > 0 ? "up" : "down") + '">' +
    (dl.d > 0 ? "\u25b2" : "\u25bc") + " " + Math.abs(dl.d) + '</span>';

  /* 1 — the cover carries the unit and the cycle, and nothing else. */
  S.push('<section class="dslide d-cover">' +
    '<div class="eyebrow">' + esc(GROUP.org) + '</div>' +
    '<h1 class="cover">' + esc(u.name) + '</h1><div class="coverrule"></div>' +
    '<p class="coversub">Strategy review &middot; ' + esc(REVIEW.name) + '</p></section>');

  /* 2 — what we are aiming at: statement above, targets below, no actuals. */
  var aimRows = u.keyObjectives.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td>' +
      '<td class="lead">' + esc(m.name) + fmark(m.id) + '</td>' +
      '<td class="num">' + esc(m.dir) + '</td>' +
      '<td class="num big3">' + (m.target3y ? esc(m.target3y) : "&mdash;") + '</td>' +
      '<td class="num">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</td></tr>';
  }).join("");
  S.push('<section class="dslide"><h2>What we are aiming at</h2>' +
    '<div class="aimtop"><div><span class="dlab">' + L("aspiration","bu") + '</span>' +
      '<p class="asp2">' + esc(u.aspiration) + '</p></div>' +
      (u.endInMind
        ? '<div><span class="dlab">End in mind</span><p class="asp3">' + esc(u.endInMind) + '</p></div>'
        : '') +
    '</div><div class="aimbottom"><span class="dlab">' + L("keyobj","bu") +
      horizonBy() + '</span>' +
      '<table class="zebra dbig"><thead><tr><th class="idx">#</th><th>Objective</th>' +
      '<th class="num">Dir.</th><th class="num">' +
        (horizonSet() ? "By " + esc(GROUP.horizon) : "3-year") + '</th>' +
      '<th class="num">This year</th></tr></thead><tbody>' + aimRows + '</tbody></table>' +
    '</div></section>');

  /* 3 — the two readings, at the size they deserve. */
  S.push('<section class="dslide d-head"><h2>Where the unit stands</h2>' +
    '<div class="headgrid">' +
      '<div class="headcell"><span class="dlab">' + L("keyobj","bu") + ' performance</span>' +
        '<b class="' + dBand(ko) + '">' + dPct(ko) + '</b>' +
        '<span class="headsub">' + (dtag ? dtag + " against the last cycle" : "no earlier cycle to compare") +
        '</span></div>' +
      '<div class="headcell"><span class="dlab">Execution performance</span>' +
        '<b class="' + dBand(ex) + '">' + dPct(ex) + '</b>' +
        '<span class="headsub">' + dPct(unitExec(u)) + ' delivered against ' +
          dPct(unitPlan(u)) + ' planned</span></div>' +
    '</div><p class="headfoot">Objectives measure what the unit committed to achieve. ' +
    'Execution measures whether the work behind it is landing on time.</p></section>');

  /* 4 — the objectives in detail. */
  var oRows = u.keyObjectives.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td>' +
      '<td class="lead">' + esc(m.name) + fmark(m.id) + '</td>' +
      '<td class="num">' + esc(m.dir) + '</td>' +
      '<td class="num">' + (m.target ? esc(m.target) : "&mdash;") + '</td>' +
      '<td class="num">' + esc(m.actual) + '</td>' +
      '<td class="num final ' + dBand(m.progress) + '">' + dPct(m.progress) + '</td></tr>';
  }).join("");
  S.push('<section class="dslide"><h2>' + L("keyobj","bu") + ' &mdash; where we stand</h2>' +
    '<table class="zebra dbig"><thead><tr><th class="idx">#</th><th>Objective</th>' +
    '<th class="num">Dir.</th><th class="num">This year</th><th class="num">Actual</th>' +
    '<th class="num">Progress</th></tr></thead><tbody>' + oRows + '</tbody></table></section>');

  /* 5 — SWOT opens with its own page, then one category per slide. */
  var sw = [["s","Strengths","good"],["w","Weaknesses","bad"],
            ["o","Opportunities","stone"],["t","Threats","warn"]];
  S.push('<section class="dslide d-cover"><span class="seclab">Section</span>' +
    '<h1 class="cover">SWOT</h1><div class="coverrule"></div>' +
    '<p class="coversub">Where this unit is strong, exposed, and what the market is offering it.</p>' +
    '<div class="secgrid">' + sw.map(function(x){
      return '<div class="seccell t-' + x[2] + '"><b>' + (u.swot[x[0]] || []).length + '</b>' +
        '<span>' + x[1] + '</span></div>';
    }).join("") + '</div></section>');
  sw.forEach(function(x){
    var items = (u.swot[x[0]] || []).map(function(t, i){
      return '<li><span class="n">' + (i+1) + '</span><span>' + esc(t) + '</span></li>';
    }).join("");
    S.push('<section class="dslide d-swot t-' + x[2] + '"><h2>' + x[1] + '</h2>' +
      '<ol class="dswot">' + items + '</ol></section>');
  });

  /* 6 — the pillars, overview then one lead-in and two tables each. */
  var pRows = u.items.map(function(p, i){
    var r = pillarExec(p) && pillarPlan(p) ? Math.round(pillarExec(p) / pillarPlan(p) * 100) : null;
    return '<tr><td class="idx">' + (i+1) + '</td><td class="dirname">' +
      '<b><span class="dcode">' + pillarCode(u, i) + '</span> ' + esc(p.name) + '</b>' +
      '<span class="dsub">' + esc(p.kind) + ' &middot; ' + esc(p.theme) + ' &middot; ' + esc(p.owner) + '</span></td>' +
      '<td class="num final ' + dBand(pillarPerf(p)) + '">' + dPct(pillarPerf(p)) + '</td>' +
      '<td class="num final ' + dBand(r) + '">' + dPct(r) + '</td></tr>';
  }).join("");
  S.push('<section class="dslide"><h2>' + L("pillar","bu") + '</h2>' +
    '<table class="zebra dirs"><thead><tr><th class="idx">#</th><th>Pillar</th>' +
    '<th class="num">Measures</th><th class="num">Execution</th></tr></thead>' +
    '<tbody>' + pRows + '</tbody></table></section>');

  u.items.forEach(function(p, pi){
    var r = pillarExec(p) && pillarPlan(p) ? Math.round(pillarExec(p) / pillarPlan(p) * 100) : null;
    S.push('<section class="dslide d-cover"><span class="seclab">' + esc(p.kind) +
      ' &middot; theme ' + esc(p.theme) + ' &middot; ' + esc(p.owner) + '</span>' +
      '<h1 class="pillarname"><span class="dcode huge">' + pillarCode(u, pi) + '</span> ' +
        esc(p.name) + '</h1>' +
      (p.sub ? '<p class="coversub">' + esc(p.sub) + '</p>' : '') +
      '<div class="coverrule"></div><div class="leadstats">' +
        '<div><span class="dlab">Key measures</span><b class="' + dBand(pillarPerf(p)) + '">' +
          dPct(pillarPerf(p)) + '</b></div>' +
        '<div><span class="dlab">Execution</span><b class="' + dBand(r) + '">' + dPct(r) + '</b></div>' +
        '<div><span class="dlab">Delivered / planned</span><b class="plain">' +
          dPct(pillarExec(p)) + ' / ' + dPct(pillarPlan(p)) + '</b></div>' +
      '</div></section>');

    var mRows = p.measures.map(function(m, i){
      return '<tr><td class="idx">' + (i+1) + '</td>' +
        '<td class="lead">' + esc(m.name) + fmark(m.id) + '</td>' +
        '<td class="num">' + esc(m.dir) + '</td>' +
        '<td class="num">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</td>' +
        '<td class="num">' + esc(m.actual) + '</td>' +
        '<td class="num final ' + dBand(m.progress) + '">' + dPct(m.progress) + '</td>' +
        (m.note ? '<td class="dnote">' + esc(m.note) + '</td>' : '<td class="dnote empty">&mdash;</td>') +
        '</tr>';
    }).join("");
    S.push('<section class="dslide" data-split="' + pillarCode(u, pi) + 'M">' +
      deckPillarHead(u, p, pi, "Key measures") +
      '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Measure</th>' +
      '<th class="num">Dir.</th><th class="num">Target</th><th class="num">Actual</th>' +
      '<th class="num">Progress</th><th>Note</th></tr></thead><tbody>' + mRows + '</tbody></table></section>');

    var tRows = p.tactics.map(function(t, i){
      if (!tacticDue(t)) {
        return '<tr class="dim"><td class="idx">' + (i+1) + '</td>' +
          '<td class="lead">' + esc(t.name) + '</td><td>' + esc(t.owner) + '</td>' +
          '<td class="num">' + spanLabel(t) + '</td>' +
          '<td colspan="2" class="cc">Outside this cycle</td>' +
          '<td class="dnote empty">&mdash;</td></tr>';
      }
      return '<tr><td class="idx">' + (i+1) + '</td>' +
        '<td class="lead">' + esc(t.name) + '</td><td>' + esc(t.owner) + '</td>' +
        '<td class="num">' + spanLabel(t) + '</td>' +
        '<td class="num">' + (t.actual == null ? "&mdash;" : t.actual) + ' / ' + tacticPlanned(t) + '</td>' +
        '<td class="num final ' + dBand(tacticRatio(t)) + '">' + dPct(tacticRatio(t)) + '</td>' +
        (t.note ? '<td class="dnote">' + esc(t.note) + '</td>' : '<td class="dnote empty">&mdash;</td>') +
        '</tr>';
    }).join("");
    S.push('<section class="dslide" data-split="' + pillarCode(u, pi) + 'T">' +
      deckPillarHead(u, p, pi, "Tactics") +
      '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Tactic</th><th>Owner</th>' +
      '<th class="num">Quarters</th><th class="num">Deliv. / due</th><th class="num">Of plan</th>' +
      '<th>Note</th></tr></thead><tbody>' + tRows + '</tbody></table></section>');
  });

  /* 7 — the owner's note, editable in the room. */
  S.push('<section class="dslide"><h2>Notes and achievements</h2>' +
    '<div class="dnotebox" contenteditable="true" data-deckunote="' + u.ukey + '">' +
      esc(REVIEW.note[u.ukey] || "") + '</div>' +
    '<p class="dhint">Editable here. A number challenged in the room is corrected in the ' +
    'platform, not in a deck that is already wrong.</p></section>');

  /* 8 — everything at risk or off track, with what is being done about it. */
  var att = [], n = 0;
  u.items.forEach(function(p, pi){
    p.measures.forEach(function(m){
      if (m.progress != null && m.progress < 70) {
        n++;
        att.push('<tr><td class="idx">' + n + '</td>' +
          '<td class="lead">' + esc(m.name) + '<span class="dsub">' + pillarCode(u, pi) +
            ' &middot; measure</span></td>' +
          '<td class="num">' + esc(m.target) + '</td><td class="num">' + esc(m.actual) + '</td>' +
          '<td class="num final ' + dBand(m.progress) + '">' + dPct(m.progress) + '</td>' +
          '<td class="dnote' + (m.note ? '' : ' empty') + '">' + (m.note ? esc(m.note) : "&mdash;") + '</td></tr>');
      }
    });
    p.tactics.forEach(function(t){
      var r = tacticRatio(t);
      if (tacticDue(t) && r != null && r < 70) {
        n++;
        att.push('<tr><td class="idx">' + n + '</td>' +
          '<td class="lead">' + esc(t.name) + '<span class="dsub">' + pillarCode(u, pi) +
            ' &middot; tactic &middot; ' + esc(t.owner) + '</span></td>' +
          '<td class="num">' + tacticPlanned(t) + '%</td><td class="num">' + t.actual + '%</td>' +
          '<td class="num final ' + dBand(r) + '">' + dPct(r) + '</td>' +
          '<td class="dnote' + (t.note ? '' : ' empty') + '">' + (t.note ? esc(t.note) : "&mdash;") + '</td></tr>');
      }
    });
  });
  if (att.length) {
    S.push('<section class="dslide" data-split="ATT"><h2>What needs attention' +
      '<span class="dwhich">' + att.length + ' at risk or off track</span></h2>' +
      '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Item</th>' +
      '<th class="num">Target / due</th><th class="num">Actual</th><th class="num">Progress</th>' +
      '<th>What is being done</th></tr></thead><tbody>' + att.join("") + '</tbody></table></section>');
  }

  S.push('<section class="dslide d-cover d-thanks"><h1 class="cover">Thank you</h1>' +
    '<div class="coverrule"></div><p class="coversub">' + esc(u.name) +
    ' &middot; ' + esc(REVIEW.name) + '</p></section>');

  return S.join("");
}

function deckPillarHead(u, p, pi, which){
  var r = pillarExec(p) && pillarPlan(p) ? Math.round(pillarExec(p) / pillarPlan(p) * 100) : null;
  return '<div class="dphdr"><h2><span class="dcode">' + pillarCode(u, pi) + '</span> ' +
    esc(p.name) + '<span class="dwhich">' + which + '</span></h2>' +
    '<div class="dstats"><span><i>Measures</i><b class="' + dBand(pillarPerf(p)) + '">' +
      dPct(pillarPerf(p)) + '</b></span>' +
    '<span><i>Delivered</i><b>' + dPct(pillarExec(p)) + '</b></span>' +
    '<span><i>Planned</i><b>' + dPct(pillarPlan(p)) + '</b></span></div></div>';
}

/* ── A supporting function's review (§15.12) ──────────────────────────────
   The same deck, carrying the project model's content: no measures, no
   tactics. One system — a function's review must read as the same product as
   a unit's, which is why every slide reuses the unit deck's shapes. */

function deckSlidesFn(fk){
  var f = FUNCTIONS[fk], caps = capsOfFunction(fk);
  var S = [];

  S.push('<section class="dslide d-cover">' +
    '<div class="eyebrow">' + esc(GROUP.org) + '</div>' +
    '<h1 class="cover">' + esc(f.name) + '</h1><div class="coverrule"></div>' +
    '<p class="coversub">Capability review &middot; ' + esc(REVIEW.name) +
    ' &middot; ' + caps.length + (caps.length === 1 ? ' capability' : ' capabilities') + '</p></section>');

  caps.forEach(function(c){
    var ko = capKOScore(c), perf = capPerf(c), ce = capExec(c);

    /* The capability's cover carries its definition and its readings — key
       objectives only where it has any (§15.1: absent, never zero). */
    S.push('<section class="dslide d-cover"><span class="seclab">Capability &middot; ' +
        esc(f.name) + '</span>' +
      '<h1 class="cover">' + esc(c.name) + '</h1>' +
      '<p class="coversub">' + esc(c.def) + '</p>' +
      '<div class="coverrule"></div><div class="leadstats">' +
        (c.keyObjectives.length
          ? '<div><span class="dlab">Key objectives</span><b class="' + dBand(ko) + '">' + dPct(ko) + '</b></div>'
          : '') +
        '<div><span class="dlab">Project performance</span><b class="' + dBand(perf) + '">' + dPct(perf) + '</b></div>' +
        '<div><span class="dlab">Milestones</span><b class="plain">' + ce.done + ' of ' + ce.total + '</b></div>' +
      '</div></section>');

    if (c.keyObjectives.length) {
      var kRows = c.keyObjectives.map(function(m, i){
        return '<tr><td class="idx">' + (i+1) + '</td>' +
          '<td class="lead">' + esc(m.name) + '</td>' +
          '<td class="num">' + (m.weight == null ? "&mdash;" : m.weight + "%") + '</td>' +
          '<td class="num">' + esc(m.dir) + '</td>' +
          '<td class="num">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</td>' +
          '<td class="num">' + (m.actual == null || m.actual === "" ? "&mdash;" : esc(m.actual)) + '</td>' +
          '<td class="num final ' + dBand(m.progress) + '">' + dPct(m.progress) + '</td>' +
          (m.note ? '<td class="dnote">' + esc(m.note) + '</td>' : '<td class="dnote empty">&mdash;</td>') + '</tr>';
      }).join("");
      S.push('<section class="dslide"><h2>Key objectives &mdash; where we stand' +
        '<span class="dwhich">' + esc(c.name) + '</span></h2>' +
        '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Objective</th>' +
        '<th class="num">Weight</th><th class="num">Dir.</th><th class="num">Target</th>' +
        '<th class="num">Actual</th><th class="num">Score</th><th>Note</th></tr></thead>' +
        '<tbody>' + kRows + '</tbody></table></section>');
    }

    var pRows = c.projects.map(function(p, i){
      var mst = projMilestones(p);
      return '<tr><td class="idx">' + (i+1) + '</td><td class="dirname">' +
        '<b>' + esc(p.name) + '</b>' +
        '<span class="dsub">' + esc(p.owner || "") + ' &middot; ' + esc(p.start) + ' &rarr; ' + esc(p.end) + '</span></td>' +
        '<td class="num">' + dPct(projDeliverySide(p)) + '</td>' +
        '<td class="num">' + dPct(projOutcomeSide(p)) + '</td>' +
        '<td class="num final ' + dBand(projPerf(p)) + '">' + dPct(projPerf(p)) + '</td>' +
        '<td class="num">' + mst.done + ' / ' + mst.total + '</td></tr>';
    }).join("");
    S.push('<section class="dslide"><h2>Projects<span class="dwhich">' + esc(c.name) + '</span></h2>' +
      '<table class="zebra dirs"><thead><tr><th class="idx">#</th><th>Project</th>' +
      '<th class="num">Deliverables</th><th class="num">Outcomes</th>' +
      '<th class="num">Performance</th><th class="num">Milestones</th></tr></thead>' +
      '<tbody>' + (pRows || '<tr><td colspan="6">No projects yet.</td></tr>') + '</tbody></table>' +
      '<p class="headfoot">Performance is half deliverables, half outcomes, per side. Milestones are completed of total.</p></section>');

    c.projects.forEach(function(p){
      var mst = projMilestones(p);
      S.push('<section class="dslide d-cover"><span class="seclab">' + esc(c.name) +
          ' &middot; ' + esc(p.owner || "") + ' &middot; ' + esc(p.start) + ' &rarr; ' + esc(p.end) + '</span>' +
        '<h1 class="pillarname">' + esc(p.name) + '</h1>' +
        '<p class="coversub">' + esc(p.brief || "") + '</p>' +
        '<div class="coverrule"></div><div class="leadstats">' +
          '<div><span class="dlab">Performance</span><b class="' + dBand(projPerf(p)) + '">' + dPct(projPerf(p)) + '</b></div>' +
          '<div><span class="dlab">Deliverables</span><b class="' + dBand(projDeliverySide(p)) + '">' + dPct(projDeliverySide(p)) + '</b></div>' +
          '<div><span class="dlab">Outcomes</span><b class="' + dBand(projOutcomeSide(p)) + '">' + dPct(projOutcomeSide(p)) + '</b></div>' +
          '<div><span class="dlab">Milestones</span><b class="plain">' + mst.done + ' of ' + mst.total + '</b></div>' +
        '</div></section>');

      var dRows = p.deliverables.map(function(d, i){
        var v = delivReads(d);
        return '<tr><td class="idx">' + (i+1) + '</td>' +
          '<td class="lead">' + esc(d.name) + '</td>' +
          '<td>' + esc(d.owner || "—") + '</td>' +
          '<td class="num">' + esc(d.due || "—") + '</td>' +
          '<td class="num">' + (d.actual == null || d.actual === "" ? "&mdash;"
            : d.kind === "pct" ? esc(String(d.actual)) + "%"
            : (String(d.actual).toLowerCase() === "yes" ? "Delivered" : "Not yet")) + '</td>' +
          '<td class="num final ' + dBand(v) + '">' + dPct(v) + '</td>' +
          (d.note ? '<td class="dnote">' + esc(d.note) + '</td>' : '<td class="dnote empty">&mdash;</td>') + '</tr>';
      }).join("");
      S.push('<section class="dslide" data-split="' + esc(p.id) + 'D">' +
        '<h2>' + esc(p.name) + '<span class="dwhich">Deliverables</span></h2>' +
        '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Deliverable</th>' +
        '<th>Owner</th><th class="num">Due</th><th class="num">Reported</th><th class="num">Reads</th>' +
        '<th>Note</th></tr></thead><tbody>' + dRows + '</tbody></table></section>');

      var oRows = p.outcomes.map(function(o, i){
        if (o.progress == null) {
          return '<tr class="dim"><td class="idx">' + (i+1) + '</td>' +
            '<td class="lead">' + esc(o.name) + '</td>' +
            '<td class="num">' + esc(o.target) + '</td>' +
            '<td colspan="2" class="cc">Measured at ' + esc(o.measureAt || "—") + '</td>' +
            '<td class="dnote empty">&mdash;</td></tr>';
        }
        return '<tr><td class="idx">' + (i+1) + '</td>' +
          '<td class="lead">' + esc(o.name) + '</td>' +
          '<td class="num">' + esc(o.target) + '</td>' +
          '<td class="num">' + esc(o.actual) + '</td>' +
          '<td class="num final ' + dBand(o.progress) + '">' + dPct(o.progress) + '</td>' +
          (o.note ? '<td class="dnote">' + esc(o.note) + '</td>' : '<td class="dnote empty">&mdash;</td>') + '</tr>';
      }).join("");
      S.push('<section class="dslide" data-split="' + esc(p.id) + 'O">' +
        '<h2>' + esc(p.name) + '<span class="dwhich">Outcomes</span></h2>' +
        '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Outcome</th>' +
        '<th class="num">Target</th><th class="num">Actual</th><th class="num">Reads</th>' +
        '<th>Note</th></tr></thead><tbody>' + oRows + '</tbody></table></section>');

      var over = projOverruns(p).map(function(m){ return m.id; });
      var mRows = p.milestones.map(function(m, i){
        var word = m.status === "done" ? "Completed" : m.status === "wip" ? "In progress" : "Not started";
        return '<tr><td class="idx">' + (i+1) + '</td>' +
          '<td class="lead">' + esc(m.name) +
          (m.covers ? '<span class="dsub">' + esc(m.covers) + '</span>' : '') + '</td>' +
          '<td>' + esc(m.owner || "—") + '</td>' +
          '<td class="num' + (over.indexOf(m.id) > -1 ? ' warn' : '') + '">' + esc(m.finish) +
          (over.indexOf(m.id) > -1 ? ' <span class="dsub">after the project ends</span>' : '') + '</td>' +
          '<td class="num final ' + (m.status === "done" ? "good" : m.status === "wip" ? "attn" : "") + '">' + word + '</td>' +
          (m.note ? '<td class="dnote">' + esc(m.note) + '</td>' : '<td class="dnote empty">&mdash;</td>') + '</tr>';
      }).join("");
      S.push('<section class="dslide" data-split="' + esc(p.id) + 'M">' +
        '<h2>' + esc(p.name) + '<span class="dwhich">Milestones &middot; ' + mst.done + ' of ' + mst.total + ' completed</span></h2>' +
        '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Milestone</th>' +
        '<th>Owner</th><th class="num">Finish</th><th class="num">Status</th>' +
        '<th>Note</th></tr></thead><tbody>' + mRows + '</tbody></table></section>');
    });
  });

  /* Everything at risk or off track across the function, with what is being
     done — the same closing gather a unit's deck makes. */
  var att = [], n = 0;
  caps.forEach(function(c){
    c.projects.forEach(function(p){
      p.deliverables.forEach(function(d){
        var v = delivReads(d);
        if (delivDue(d) && v != null && v < 70) {
          n++;
          att.push('<tr><td class="idx">' + n + '</td>' +
            '<td class="lead">' + esc(d.name) + '<span class="dsub">' + esc(p.name) + ' &middot; deliverable</span></td>' +
            '<td class="num">' + esc(d.due || "—") + '</td>' +
            '<td class="num final ' + dBand(v) + '">' + dPct(v) + '</td>' +
            '<td class="dnote' + (d.note ? '' : ' empty') + '">' + (d.note ? esc(d.note) : "&mdash;") + '</td></tr>');
        }
      });
      p.outcomes.forEach(function(o){
        if (o.progress != null && o.progress < 70) {
          n++;
          att.push('<tr><td class="idx">' + n + '</td>' +
            '<td class="lead">' + esc(o.name) + '<span class="dsub">' + esc(p.name) + ' &middot; outcome</span></td>' +
            '<td class="num">' + esc(o.target) + '</td>' +
            '<td class="num final ' + dBand(o.progress) + '">' + dPct(o.progress) + '</td>' +
            '<td class="dnote' + (o.note ? '' : ' empty') + '">' + (o.note ? esc(o.note) : "&mdash;") + '</td></tr>');
        }
      });
      projOverruns(p).forEach(function(m){
        n++;
        att.push('<tr><td class="idx">' + n + '</td>' +
          '<td class="lead">' + esc(m.name) + '<span class="dsub">' + esc(p.name) + ' &middot; milestone overrun</span></td>' +
          '<td class="num">' + esc(m.finish) + '</td>' +
          '<td class="num">ends ' + esc(p.end) + '</td>' +
          '<td class="dnote' + (m.note ? '' : ' empty') + '">' + (m.note ? esc(m.note) : "&mdash;") + '</td></tr>');
      });
    });
  });
  if (att.length) {
    S.push('<section class="dslide" data-split="FNATT"><h2>What needs attention' +
      '<span class="dwhich">' + att.length + ' at risk, off track or overrunning</span></h2>' +
      '<table class="zebra withnote"><thead><tr><th class="idx">#</th><th>Item</th>' +
      '<th class="num">Target / due</th><th class="num">Reads</th>' +
      '<th>What is being done</th></tr></thead><tbody>' + att.join("") + '</tbody></table></section>');
  }

  S.push('<section class="dslide"><h2>Notes and achievements</h2>' +
    '<div class="dnotebox" contenteditable="true" data-deckunote="fn:' + esc(fk) + '">' +
      esc(REVIEW.note["fn:" + fk] || "") + '</div>' +
    '<p class="dhint">Editable here. A number challenged in the room is corrected in the ' +
    'platform, not in a deck that is already wrong.</p></section>');

  S.push('<section class="dslide d-cover d-thanks"><h1 class="cover">Thank you</h1>' +
    '<div class="coverrule"></div><p class="coversub">' + esc(f.name) +
    ' &middot; ' + esc(REVIEW.name) + '</p></section>');

  return S.join("");
}

/* ── Opening, moving and closing ──────────────────────────────────────── */

function openDeckWith(titleHtml, slides){
  var root = document.getElementById("deckroot");
  root.querySelector(".deck").innerHTML = slides;
  root.querySelector(".dtitle").innerHTML = titleHtml;
  root.classList.add("on");
  document.body.classList.add("presenting");
  deckFitPass();
  deckIndex();
  deckShow(0);
  deckScale();
  root.focus();
}
function openDeck(u){
  openDeckWith("<b>" + esc(u.name) + "</b> &middot; " + esc(REVIEW.name), deckSlides(u));
}
function openDeckFn(fk){
  openDeckWith("<b>" + esc(FUNCTIONS[fk].name) + "</b> &middot; " + esc(REVIEW.name), deckSlidesFn(fk));
}
function closeDeck(){
  var root = document.getElementById("deckroot");
  root.classList.remove("on");
  document.body.classList.remove("presenting");
  if (document.fullscreenElement) document.exitFullscreen();
}

/* Squeeze anything that overruns, then split what still does. Run once on
   open, so the deck never reflows while it is being presented. */
function deckFitPass(){
  var deck = document.querySelector("#deckroot .deck");
  var all = deck.querySelectorAll(".dslide");
  [].forEach.call(all, function(s){
    s.classList.add("on");
    if (s.scrollHeight > s.clientHeight) s.classList.add("tight");
    s.classList.remove("on");
  });
  for (var pass = 0; pass < 20; pass++) {
    var changed = false;
    [].forEach.call(deck.querySelectorAll(".dslide[data-split]"), function(s){
      s.classList.add("on");
      var tb = s.querySelector("tbody");
      if (!tb || tb.rows.length < 2 || s.scrollHeight <= s.clientHeight) {
        s.classList.remove("on"); return;
      }
      var next = s.nextElementSibling;
      /* A continuation is splittable in its turn, or a long table stops one
         slide short and quietly overflows. */
      if (!next || next.dataset.cont !== s.dataset.split) {
        next = s.cloneNode(true);
        next.dataset.cont = s.dataset.split;
        next.querySelector("tbody").innerHTML = "";
        var h2 = next.querySelector("h2");
        if (h2 && !h2.querySelector(".contd"))
          h2.insertAdjacentHTML("beforeend", '<span class="contd">continued</span>');
        s.parentNode.insertBefore(next, s.nextSibling);
      }
      var ntb = next.querySelector("tbody");
      ntb.insertBefore(tb.rows[tb.rows.length - 1], ntb.firstChild);
      changed = true;
      s.classList.remove("on");
    });
    if (!changed) break;
  }
  [].forEach.call(deck.querySelectorAll(".dslide"), function(s){ s.classList.remove("on"); });
}

function deckIndex(){
  var root = document.getElementById("deckroot");
  DECK.slides = [].slice.call(root.querySelectorAll(".dslide"));
  root.querySelector(".dcount-t").textContent = DECK.slides.length;
  var dots = root.querySelector(".ddots");
  dots.innerHTML = DECK.slides.map(function(_, k){
    return '<button class="ddot" data-dgo="' + k + '" aria-label="Slide ' + (k+1) + '"></button>';
  }).join("");
  [].forEach.call(dots.querySelectorAll(".ddot"), function(b){
    b.addEventListener("click", function(){ deckShow(+b.dataset.dgo); });
  });
}
function deckShow(n){
  DECK.i = Math.max(0, Math.min(DECK.slides.length - 1, n));
  DECK.slides.forEach(function(s, k){ s.classList.toggle("on", k === DECK.i); });
  var root = document.getElementById("deckroot");
  [].forEach.call(root.querySelectorAll(".ddot"), function(b, k){
    b.classList.toggle("on", k === DECK.i);
  });
  root.querySelector(".dcount-c").textContent = DECK.i + 1;
}
/* Scale the fixed stage into whatever room there is. */
function deckScale(){
  var root = document.getElementById("deckroot");
  var deck = root.querySelector(".deck");
  if (root.classList.contains("fitwin")) { deck.style.transform = ""; return; }
  var st = root.querySelector(".deckstage");
  var k = Math.min(st.clientWidth / 1600, st.clientHeight / 900);
  deck.style.transform = "scale(" + k + ")";
}

function wireDeck(){
  var root = document.getElementById("deckroot");
  root.querySelector("[data-dnext]").addEventListener("click", function(){ deckShow(DECK.i + 1); });
  root.querySelector("[data-dprev]").addEventListener("click", function(){ deckShow(DECK.i - 1); });
  root.querySelector("[data-dexit]").addEventListener("click", closeDeck);
  root.querySelector("[data-dfit]").addEventListener("click", function(){
    root.classList.toggle("fitwin");
    this.textContent = root.classList.contains("fitwin") ? "16:9" : "Fit";
    deckScale();
  });
  root.querySelector("[data-dfs]").addEventListener("click", function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else root.requestFullscreen();
  });
  root.addEventListener("input", function(ev){
    var box = ev.target.closest("[data-deckunote]");
    if (box) REVIEW.note[box.dataset.deckunote] = box.textContent;
  });
  addEventListener("resize", deckScale);
  addEventListener("fullscreenchange", deckScale);
  addEventListener("keydown", function(ev){
    if (!root.classList.contains("on")) return;
    if (ev.target.isContentEditable) { if (ev.key === "Escape") ev.target.blur(); return; }
    if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); deckShow(DECK.i + 1); }
    if (ev.key === "ArrowLeft") deckShow(DECK.i - 1);
    if (ev.key === "Home") deckShow(0);
    if (ev.key === "End") deckShow(DECK.slides.length - 1);
    if (ev.key === "Escape") closeDeck();
    if (ev.key === "f" || ev.key === "F") root.querySelector("[data-dfs]").click();
    if (ev.key === "w" || ev.key === "W") root.querySelector("[data-dfit]").click();
  });
}

</script>
<script>
/* ── Persistence ──────────────────────────────────────────────────────────
   Served over http(s), the platform loads its state from /api/state and
   writes every change back, so edits survive reloads and every viewer shares
   one state. Opened as a local file it behaves exactly as before — baked
   data, no network — which is what keeps the handover file working anywhere.

   The graph sent and received is the same set of globals the pages already
   read; nothing is renamed in transit, so the server and the screen can never
   disagree about a field. Derived figures are not persisted: a unit's weight
   is zeroed in the payload and recomputed from the factor table after
   hydration (§5.1, §6), exactly as it is on a cold load.

   Saving keys off change, not off intent: after any repaint — every mutation
   repaints — the graph is serialized and compared with what was last saved;
   only a difference is written, debounced. A slow interval does the same
   check, catching the few edits that deliberately do not repaint (the deck's
   note, the reporting note boxes). */

var SYNC = (function () {
  var enabled = typeof location !== "undefined" &&
    (location.protocol === "http:" || location.protocol === "https:");
  var live = false;        /* hydrated from the API; saves flow only then */
  var lastSaved = null;    /* the serialized graph the server last accepted */
  var timer = null;
  var saving = false;

  /* Two datasets, one product.

     DEMO is the full worked example baked into this file — Raya Trade with
     every unit, capability, figure and person. LIVE is what the database
     holds, which after a clean slate is the client's own and mostly empty.

     The Demo button switches between them so the platform can be EXPLAINED
     with a complete example without that example ever being mistaken for, or
     written into, the real thing. Demo mode never saves (§B3: invented data
     is labelled every time, and it must not leak into a client's tenant). */
  var DEMO = null;
  var LIVE = null;
  var mode = "live";
  /* `clone` is the platform's own, defined once beside the archive model. */

  function graph() {
    return {
      group: GROUP, unitKeys: UNIT_KEYS, units: UNITS,
      functionKeys: FUNCTION_KEYS, functions: FUNCTIONS,
      companyKeys: COMPANY_KEYS, companies: COMPANIES,
      people: PEOPLE, unitRoles: UNIT_ROLES, levels: LEVELS, access: ACCESS,
      labels: LABELS.entries, bands: BANDS.bands, koWeights: KO_WEIGHTS,
      cycle: CYCLE, review: REVIEW, history: HISTORY, priorCycle: PRIOR_CYCLE,
      archives: ARCHIVES
    };
  }

  function serialize() {
    var s = JSON.parse(JSON.stringify(graph()));
    s.unitKeys.forEach(function (k) { if (s.units[k]) s.units[k].weight = 0; });
    return JSON.stringify(s);
  }

  /* The globals are rebound, not patched: every function in the platform
     resolves these names at call time, so reassignment reaches everything.
     The two invariants the cold-load path establishes are re-established. */
  function hydrate(state) {
    window.GROUP = state.group;
    window.UNIT_KEYS = state.unitKeys;
    window.UNITS = state.units;
    window.FUNCTION_KEYS = state.functionKeys;
    window.FUNCTIONS = state.functions;
    /* A tenant that predates the company level has neither, and an empty
       company list is a valid answer: every unit is then its own. */
    window.COMPANY_KEYS = state.companyKeys || [];
    window.COMPANIES = state.companies || {};
    window.PEOPLE = state.people;
    window.UNIT_ROLES = state.unitRoles;
    window.LEVELS = state.levels;
    window.ACCESS = state.access;
    LABELS.entries = state.labels;
    BANDS.bands = state.bands;
    window.KO_WEIGHTS = state.koWeights || {};
    window.CYCLE = state.cycle;
    window.REVIEW = state.review;
    window.HISTORY = state.history;
    window.ARCHIVES = state.archives || [];
    /* Rebound unconditionally, like every other global here. Assigning only
       when present meant a tenant with no previous cycle kept the baked-in
       example's 2025 split on screen — the Weighting factors table showed
       deltas against a year that never happened for them. */
    window.PRIOR_CYCLE = state.priorCycle || { factors: [] };
    UNIT_KEYS.forEach(function (k) { UNITS[k].ukey = k; });
    syncWeights();
  }

  function save() {
    /* The guard that matters: demo data must never reach the database. */
    if (!live || mode === "demo" || saving) return;
    var now = serialize();
    if (now === lastSaved) return;
    saving = true;
    fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: '{"state":' + now + "}"
    }).then(function (r) {
      saving = false;
      if (r.ok) lastSaved = now;
      else console.warn("SMP: save failed (HTTP " + r.status + ") — will retry on the next change");
    }).catch(function (e) {
      saving = false;
      console.warn("SMP: save failed (" + e.message + ") — will retry on the next change");
    });
  }

  /* Real identity replaces the prototype's viewer switcher on the deployed
     product (§16.9, built in §19): the page shows the signed-in person's own
     view. The switcher survives for the SMO as a read-only simulation — what
     is rendered changes, who is acting does not: the server authorizes by
     session, never by the simulated view. Offline, everything stays as it
     always was. */
  var person = null;
  function chromeFor(paint) {
    var box = document.querySelector(".viewer");
    var sel = document.getElementById("asWho");
    if (!box || !sel) return;
    if (PEOPLE.some(function (p) { return p.key === person.key; })) {
      window.VIEWER = person.key;
      sel.value = person.key;
    }
    if (person.level !== "smo") {
      sel.hidden = true;
      var label = box.querySelector("label");
      if (label) label.textContent = "Signed in as";
      var nm = document.createElement("span");
      nm.className = "viewer-note";
      nm.innerHTML = "<b></b>";
      nm.firstChild.textContent = person.name;
      box.insertBefore(nm, sel);
    }
    var out = document.createElement("button");
    out.className = "infobtn";
    out.textContent = "Sign out";
    out.addEventListener("click", function () {
      fetch("/api/auth", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: '{"action":"logout"}'
      }).finally(function () { location.replace("/"); });
    });
    box.appendChild(out);
    paint();
  }

  /* Switching datasets. Leaving live remembers where the client's data was,
     so returning restores it exactly rather than the snapshot taken at boot —
     otherwise an edit made before opening the demo would vanish from the
     screen. Anything typed while in demo is discarded, by design. */
  function setMode(next, paint) {
    if (!DEMO || next === mode) return;
    if (mode === "live") LIVE = clone(graph());
    mode = next;
    hydrate(clone(mode === "demo" ? DEMO : LIVE));
    markMode();
    paint();
    if (mode === "live") lastSaved = serialize();
  }

  /* Demo data is labelled the whole time it is on screen. The banner is the
     platform's own — it carries the invented-data notice, which is true of the
     example and NOT true of the client's own tenant, so it shows in demo mode
     and is hidden in live. */
  function markMode() {
    var btn = document.getElementById("demobtn");
    if (btn) btn.textContent = mode === "demo" ? "Exit demo" : "Demo data";
    var ban = document.getElementById("banner");
    if (ban) {
      ban.hidden = mode !== "demo";
      if (mode === "demo") {
        ban.innerHTML =
          '<span><strong>Demo data \u00b7 nothing here is saved.</strong> The full worked ' +
          'example, for explaining how the platform works.</span>' +
          '<span><strong>Only Mobile\u2019s plan is real</strong> \u2014 every other unit, every ' +
          'capability\u2019s content and every reported figure is invented.</span>';
      }
    }
  }

  return {
    isLive: function () { return live; },
    isDemo: function () { return mode === "demo"; },
    person: function () { return person; },
    /* The SMO issues or resets a password from Levels & access. The server
       checks the policy and the issuer; the password is temporary and forces
       a change on first sign-in. */
    setPassword: function (key, pw, done) {
      fetch("/api/auth", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "setPassword", person: key, password: pw })
      }).then(function (r) { return r.json(); })
        .then(function (j) { done(j.ok ? null : (j.error || "failed")); })
        .catch(function (e) { done(String(e.message || e)); });
    },
    boot: function (paint) {
      paint();
      if (!enabled) return;
      /* Taken before hydration, while the globals still hold the baked-in
         example — after hydration it is gone from memory. */
      DEMO = clone(graph());
      fetch("/api/state", { cache: "no-store" })
        .then(function (r) {
          /* Deployed and not signed in: the gate is the way in. */
          if (r.status === 401) { location.replace("/"); throw new Error("sign in"); }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!data.ok || !data.state) throw new Error(data.error || "bad payload");
          if (data.person && data.person.mustChange) { location.replace("/"); return; }
          hydrate(data.state);
          LIVE = clone(data.state);
          live = true;
          person = data.person || null;
          if (person) chromeFor(paint); else paint();
          lastSaved = serialize();
          setInterval(save, 5000);

          /* The Demo button exists only where there is a live dataset to tell
             the example apart from. Opened as a file the whole product IS the
             example, so the button would mean nothing. */
          var btn = document.getElementById("demobtn");
          if (btn) {
            btn.hidden = false;
            btn.addEventListener("click", function () {
              setMode(mode === "demo" ? "live" : "demo", paint);
            });
          }
          markMode();
        })
        .catch(function (e) {
          if (e.message !== "sign in")
            console.info("SMP: running on the baked-in data (" + e.message + ")");
        });
    },
    afterPaint: function () {
      if (!live) return;
      if (timer) clearTimeout(timer);
      timer = setTimeout(save, 800);
    }
  };
})();

</script>
<script>
/* Drawn rather than typed: a glyph at this size renders differently in every
   font, and these two are the only way into configuration and management. */
var ICON_SETUP = '<svg viewBox="0 0 20 20" class="navsvg" aria-hidden="true">' +
  '<circle cx="10" cy="10" r="3"/><path d="M10 1.6v2.2M10 16.2v2.2M3.1 3.1l1.6 1.6M15.3 15.3l1.6 1.6' +
  'M1.6 10h2.2M16.2 10h2.2M3.1 16.9l1.6-1.6M15.3 4.7l1.6-1.6"/></svg>';
var ICON_MANAGE = '<svg viewBox="0 0 20 20" class="navsvg" aria-hidden="true">' +
  '<path d="M3 5h14M3 10h14M3 15h9"/><circle cx="15.5" cy="15" r="2.2"/></svg>';

  /* Page definitions carry the access key the matrix is keyed on, so a page
     is never rendered without a grant having been checked first. */
  var SUBS = {
    /* A supporting function is the destination; the capabilities it carries are
       named inside its pages. */
    /* Two tabs, not five. The top row asks one question \u2014 how is it going, or
       what did we agree \u2014 and everything else is a section inside one of the
       two. Reporting is not a page you visit: it is what a cycle asks of you
       for two weeks a quarter, so it appears inside Performance and leaves
       again. See \u00a715.10. */
    fn: [
      { k:"fnperf", ac:"k_perf", label:"Performance", primary:true, sections: function(k){
          var secs = [{ k:"perf", ac:"k_perf", label:"Performance", render:renderFnPerformance }];
          var r = reportSectionState();
          if (r) secs.push({ k:"report", ac:"k_report", label:"Report" + r.badge,
                             cls:r.cls, render:renderFnReport });
          return secs;
        } },
      { k:"fnstrat", ac:"k_found", label:"Strategy", sections: function(k){
          return [{ k:"found", ac:"k_found", label:"Foundation", render:renderFnFoundation },
                  { k:"proj",  ac:"k_proj",  label:"Projects",   render:renderFnProjects }];
        } }
    ],
    group: [
      { k:"performance", ac:"g_perf",   label:"Performance", primary:true, render:renderGroupPerformance },
      { k:"foundation",  ac:"g_found",  label:"Foundation",                render:renderGroupFoundation },
      { k:"focus",       ac:"g_focus",  label:"Focus",                     render:renderFocusBoard },
      { k:"temple",      ac:"g_temple", label:"Temple",                    render:renderTemple },
      { k:"weighting",   ac:"g_weight", label:"Weighting",                 render:renderWeighting }
    ],
    unit: [
      { k:"performance", ac:"u_perf", label:"Performance", primary:true, sections: function(u){
          var secs = [{ k:"perf", ac:"u_perf", label:"Performance", render:renderUnitPerformance }];
          var r = reportSectionState();
          if (r) secs.push({ k:"report", ac:"u_report", label:"Report" + r.badge,
                             cls:r.cls, render:renderReport });
          return secs;
        } },
      { k:"strategy", ac:"u_found", label:"Strategy", sections: function(u){
          return [{ k:"found", ac:"u_found", label:"Foundation", render:renderUnitFoundation },
                  { k:"swot",  ac:"u_anal",  label:"SWOT",       render:renderUnitAnalysis },
                  { k:"plan",  ac:"u_plan",  label:"Plan",       render:renderUnitPlan }];
        } }
    ],
    /* Setup is what EXISTS: decided once, revisited rarely. */
    setup: [
      { k:"labels", ac:"c_labels", label:"Labels",          primary:true, render:renderLabels },
      { k:"access", ac:"c_access", label:"Levels & access",               render:renderAccess },
      { k:"bands",  ac:"c_bands",  label:"Scoring bands",                 render:function(){ return renderBands() + renderBandsExtra(); } },
      { k:"units",  ac:"c_units",  label:"Business units",                render:renderUnits },
      { k:"fns",    ac:"c_fns",    label:"Supporting functions",          render:renderFunctions },
      { k:"caps",   ac:"c_caps",   label:"Capabilities",                  render:renderCaps }
    ],
    /* Manage is what the SMO DOES, every cycle. Opening a window, chasing it,
       loading plans, marking what carries reward \u2014 activities, not structure.
       They sat in Setup only because that was the only place that existed. */
    manage: [
      { k:"cycle",    ac:"c_cycle",  label:"Reporting cycle", primary:true, render:renderCycle },
      { k:"import",   ac:"c_import", label:"Import",                        render:renderImport },
      { k:"archives", ac:"c_import", label:"Archived plans",                 render:renderArchives },
      { k:"focusset", ac:"c_focus",  label:"Focus measures",                render:renderFocusSetup }
    ]
  };

  var current = "group", currentSub = "performance";
  /* Which section of a container tab is open, per tab. Kept per tab rather than
     globally so moving between Performance and Strategy does not reset both. */
  var CURSEC = {};

  function allowed(defs){
    return defs.filter(function(d){ return grant(d.ac) !== "none"; });
  }

  /* A unit tab appears only if the viewer reaches that unit AND holds at least
     one of its pages. Restriction is by removing the page, never by trimming
     what a page shows. */
  /* Which fold is open. Expanding is BROWSING, not going: opening Functions
     while sitting on Mobile does not move the page, so the closed fold has to
     carry the location or the navigation stops saying where you are. */
  /* Both folds start closed. The row arrives at its shortest, and a person who
     never opens one is never shown eighteen entries. */
  var NAVFOLD = null;

  function myUnits(){
    return activeKeys().filter(function(k){ return reaches(k) && allowed(SUBS.unit).length; });
  }
  function myFns(){
    return allowed(SUBS.fn).length ? fnsReachable() : [];
  }
  /* The folds appear only for someone who reaches more than one unit AND more
     than one capability — today the SMO and the CEO. Everyone else sees the row
     exactly as it has always been, and never meets the concept. */
  function foldsNeeded(){ return myUnits().length > 1 && myFns().length > 1; }

  function unitTabs(){
    var out = [];
    if (reaches("group") && allowed(SUBS.group).length) out.push({ k:"group", label:"Group" });
    var us = myUnits(), cs = myFns(), fold = foldsNeeded();

    if (fold) {
      /* The row does NOT group by company (§15.13). It was built that way and
         taken out in the same version: the SMO and the group CEO see
         everything and already have this fold, so companies added a second
         layer of folding to a row that was working; and a company CEO sees
         only their own three or four units, so there is nothing to group. The
         grouping solved a problem neither viewer had. The company level
         survives where it does work — deciding who reaches what.

         REVERSAL of the 1.2 rule: a closed fold no longer announces where you
         are. It remembers silently — reopening puts you back, and the page
         below already says it. Repeating it made the row noisier the more
         folds there were. Worth revisiting if the row ever feels lost, since
         with the company folds gone there are only two folds again. */
      out.push({ fold:"units", label:"Units", open:NAVFOLD === "units" });
      if (NAVFOLD === "units")
        us.forEach(function(k){ out.push({ k:k, label:navName(UNITS[k]) }); });
      out.push({ fold:"caps", label:"Functions", open:NAVFOLD === "caps" });
      if (NAVFOLD === "caps")
        cs.forEach(function(k){ out.push({ k:"fn:" + k, label:FUNCTIONS[k].name }); });
    } else {
      us.forEach(function(k){ out.push({ k:k, label:navName(UNITS[k]) }); });
      cs.forEach(function(k){ out.push({ k:"fn:" + k, label:FUNCTIONS[k].name }); });
    }
    /* Two icons, no words. A gear is universal; the manage mark is a stacked
       list, and both carry a title and an aria-label so nothing depends on
       recognising a glyph. */
    /* Anchored right rather than trailing the row: they are the same two
       destinations wherever you are, and a control that moves as the list
       beside it grows is a control you have to look for. */
    if (allowed(SUBS.manage).length)
      out.push({ k:"manage", label:ICON_MANAGE, icon:true, first:true, title:"Manage" });
    if (allowed(SUBS.setup).length)
      out.push({ k:"setup", label:ICON_SETUP, icon:true, title:"Setup" });
    return out;
  }

  function isFn(k){ return typeof k === "string" && k.indexOf("fn:") === 0 && !!fnOf(k); }
  function defsFor(k){
    return k === "group" ? SUBS.group
         : k === "manage" ? SUBS.manage
         : k === "setup" ? SUBS.setup
         : isFn(k) ? SUBS.fn
         : SUBS.unit;
  }

  function paintUnits(){
    var tabs = unitTabs();
    document.getElementById("units").classList.toggle("folded", foldsNeeded());
    /* A destination folded out of sight is still where you are. Resetting
       `current` because it is not in the visible list would make expanding a
       fold navigate \u2014 which is exactly what a fold must not do. Only reset when
       the destination is genuinely unreachable for this viewer. */
    var everything = myUnits().concat(myFns().map(function(k){ return "fn:" + k; }));
    if (allowed(SUBS.group).length) everything.push("group");
    if (allowed(SUBS.setup).length) everything.push("setup");
    if (allowed(SUBS.manage).length) everything.push("manage");
    if (everything.indexOf(current) === -1) {
      var dests = tabs.filter(function(t){ return t.k; });
      current = dests.length ? dests[0].k : null;
    }
    document.getElementById("units").innerHTML = tabs.map(function(t, i){
      if (t.fold) {
        return '<span class="sep"></span><button class="navfold' + (t.open ? " open" : "") +
          '" data-fold="' + t.fold + '" aria-expanded="' + t.open + '">' + t.label +
          '<span class="foldtw">' + (t.open ? "\u25be" : "\u25b8") + '</span></button>';
      }
      return ((i === 1 && !tabs[1].fold) ? '<span class="sep"></span>' : '') +
        (t.first ? '<span class="sep pinsep"></span>' : '') +
        '<button role="tab" aria-selected="' + (t.k === current) + '" data-u="' + t.k + '"' +
        (t.icon ? ' class="navicon' + (t.first ? " pinned" : "") + '" title="' + esc(t.title) +
          '" aria-label="' + esc(t.title) + '"' : '') +
        '>' + t.label + '</button>';
    }).join("");
    /* Only destinations. A fold button lives in the same row but goes nowhere \u2014
       binding it here set current to undefined and reset the page to Group, which
       made expanding a fold navigate. */
    document.querySelectorAll("#units button[data-u]").forEach(function(b){
      b.addEventListener("click", function(){
        /* Edit is a decision about the thing being edited, not a lamp that
           stays on while you walk around. Leaving edit modes on across a unit
           switch landed you editing a different unit's foundation without
           ever pressing Edit on it. Arrange mode drops for the same reason. */
        if (current !== b.dataset.u) {
          Object.keys(EDIT_PAGE).forEach(function(k){ EDIT_PAGE[k] = false; });
          Object.keys(EDITING).forEach(function(k){ EDITING[k] = false; });
          if (typeof ARRANGE !== "undefined") ARRANGE = false;
          CLEARING = null;
        }
        current = b.dataset.u;
        var d = allowed(defsFor(current));
        currentSub = d.length ? d[0].k : null;
        paint(); window.scrollTo(0,0);
      });
    });
  }

  function paint(){
    /* Field setters are registered during render, so the list is emptied first
       or stale closures accumulate on every repaint. */
    FIELDS.length = 0;
    fillViewers();
    paintUnits();
    /* Derived, not typed — the count was hardcoded at three and quietly lied
       the moment the group grew. */
    document.getElementById("shapetag").innerHTML =
      "Group &middot; " + UNIT_KEYS.length + " business units &middot; H1 2026";
    var v = viewer();
    /* Guarded even though every person currently has a unit: reading
       UNITS[null].name throws inside paint, which aborts the repaint and
       leaves the previous screen showing \u2014 a crash that looks like a routing
       bug. */
    var where = v.unit === "group" ? "all units"
              : (v.unit && UNITS[v.unit] ? UNITS[v.unit].name : "\u2014");
    document.getElementById("viewerNote").innerHTML =
      (v.level === "smo" ? "Super user" : v.level.toUpperCase().replace("N","N-")) +
      " &middot; " + where;

    if (!current) {
      document.getElementById("subtabs").innerHTML = "";
      document.getElementById("panel").innerHTML =
        '<div class="note bad-note" style="margin-top:30px"><b>No pages granted.</b> This level holds no access to any page in the matrix. ' +
        'That is the matrix working as configured, not an error &mdash; open <b>Setup &rarr; Levels &amp; access</b> as the SMO to change it.</div>';
      return;
    }

    /* A tab with SECTIONS is a container: the tab itself renders nothing and
       the third row carries its pages. A tab without them renders directly, as
       every group and setup tab still does. */
    var arg = (current === "group" || current === "setup" || current === "manage") ? null
            : isFn(current) ? current : UNITS[current];
    /* Submission is per unit; a function's capabilities are not submitted
       individually, so the whole function counts as one. */
    CURRENT_REPORT_KEY = isFn(current) ? current : (UNITS[current] ? UNITS[current].ukey : null);
    var defs = allowed(defsFor(current)).filter(function(d){
      return !d.sections || allowed(d.sections(arg)).length;
    });
    if (!defs.length) defs = allowed(defsFor(current));
    if (!defs.some(function(d){ return d.k === currentSub; })) currentSub = defs[0].k;

    document.getElementById("subtabs").innerHTML = defs.map(function(d){
      return '<button role="tab" data-s="' + d.k + '"' + (d.primary ? ' class="primary"' : '') +
        ' aria-selected="' + (d.k === currentSub) + '">' + d.label + '</button>';
    }).join("");

    var def = defs.filter(function(d){ return d.k === currentSub; })[0];
    var secs = def.sections ? allowed(def.sections(arg)) : null;
    if (secs) {
      if (!secs.some(function(s){ return s.k === CURSEC[def.k]; })) CURSEC[def.k] = secs[0].k;
      def = secs.filter(function(s){ return s.k === CURSEC[def.k]; })[0];
    }

    /* One Info per page, in the same place on every page, explaining how that
       page works rather than what one figure means. */
    var ib = document.getElementById("pageinfo");
    var iid = pageInfoFor(def.ac);
    ib.hidden = !iid;
    if (iid) ib.dataset.modal = iid;
    document.getElementById("panel").innerHTML =
      (current === "group" || current === "setup" || current === "manage") ? def.render()
        : isFn(current) ? def.render(current)
        : def.render(UNITS[current]);

    /* Group Performance is four sections; they become a third nav row rather
       than one long scroll. The row exists only where there are sections. */
    var secrow = document.getElementById("secrow");
    var onSecPage = current === "group" && currentSub === "performance" && GROUP_SECTIONS.length;
    if (secs && secs.length > 1) {
      /* The same third row the group's Performance sections already use. One
         row that means "sections of the tab above", wherever it appears. */
      secrow.hidden = false;
      document.getElementById("secrow-in").innerHTML = secs.map(function(s){
        return '<button role="tab" data-sub2="' + s.k + '"' + (s.cls ? ' class="' + s.cls + '"' : '') +
          ' aria-selected="' + (s.k === def.k) + '">' + s.label + '</button>';
      }).join("");
    } else {
      secrow.hidden = !onSecPage;
      if (onSecPage) {
        document.getElementById("secrow-in").innerHTML = GROUP_SECTIONS.map(function(t, i){
          return '<button role="tab" data-sec="' + i + '" aria-selected="' + (i === GSEC) + '">' + t + '</button>';
        }).join("");
      }
    }
    document.getElementById("title").textContent =
      current === "setup" ? GROUP.org + " \u2014 configuration"
      : current === "manage" ? GROUP.org + " \u2014 management"
      : current === "group" ? GROUP.org
      : isFn(current) ? GROUP.org + " \u2014 " + FUNCTIONS[fnKeyOf(current)].name
      : GROUP.org + " \u2014 " + UNITS[current].name;

    wire();
    /* Every mutation repaints, so this is where a change becomes a save. */
    SYNC.afterPaint();
  }

    document.querySelectorAll("[data-fold]").forEach(function(b){

      if (!confirm("Close " + REVIEW.name + "?" +
          (gaps ? "\n\n" + gaps + " items are unreported and will close as unreported." : "") +
          "\n\nThe figures become a record and the plan reopens to unit owners.")) return;
      /* The snapshot. Everything a later cycle needs in order to say what a

    var oc = document.querySelector("[data-opencycle]");

                 state:"open", note:{}, submitted:{}, cadence:REVIEW.cadence };

    document.querySelectorAll("[data-rep]").forEach(function(el){
      el.addEventListener("change", function(){
        var hit = findById(UNITS[current], el.dataset.rep);
        if (!hit) return;
        var v = el.value.trim();
        /* The field holds the bare number; the unit lives in the suffix beside
           it. Rejoin them before storing, or every screen downstream reads a
           revenue of "2.7" where it expects "2.7B EGP". */
        var unit = el.dataset.unit || "";
        if (hit.kind !== "TACTIC" && v !== "" && unit)
          v = joinTarget(hit.obj.actual || hit.obj.target, v, unit);
        if (hit.kind === "TACTIC") {
          var n = parseInt(v.replace("%",""), 10);
          hit.obj.actual = v === "" ? null : Math.max(0, Math.min(100, isNaN(n) ? 0 : n));
          if (hit.obj.actual != null) {
            if (hit.obj.actual >= 100) hit.obj.status = "Done";
            else if (hit.obj.actual > 0 && hit.obj.status !== "Blocked") hit.obj.status = "WIP";
          } else hit.obj.status = "Not started";
        } else {
          hit.obj.actual = v;
          /* Progress is what the actual implies against the target, worked out
             here rather than typed, so a figure and its meaning cannot differ. */
          var t = parseFloat(String(hit.obj.target).replace(/[^0-9.]/g, ""));
          var a = parseFloat(String(v).replace(/[^0-9.]/g, ""));
          if (v === "" || isNaN(a) || isNaN(t) || !t) hit.obj.progress = null;
          else hit.obj.progress = Math.max(0, Math.min(150,
            Math.round((hit.obj.dir === "\u2264" ? t / a : a / t) * 100)));
