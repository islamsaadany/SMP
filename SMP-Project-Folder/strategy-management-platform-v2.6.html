        ' &middot; scored by the group, not by a business unit</div></div>' +
    '<div class="capkpi"><div><i>Reported</i><b>' + r.done + ' / ' + r.total + '</b></div></div></div>';
}

function fnKeyOf(key){ return String(key).replace(/^fn:/, ""); }
function capHead(c){
  var f = functionOf(c.fn), r = capReported(c);
  return '<div class="caphdr">' +
    '<div><div class="capname">' + esc(c.name) + '</div>' +
      '<div class="why" style="margin:3px 0 0">' +
        'Supporting function ' + esc(f ? f.name : "\u2014") +
        (f ? ' &middot; ' + esc(functionPeople(c.fn).map(personName).join(", ")) : '') +
        ' &middot; scored by the group, not by a business unit</div></div>' +
    '<div class="capkpi"><div><i>Reported</i><b>' + r.done + ' / ' + r.total + '</b></div></div></div>';
}

function fnHead(fk){
  var f = FUNCTIONS[fk], caps = capsOfFunction(fk), people = functionPeople(fk);
  return '<div class="caphdr">' +
    '<div><div class="capname">' + esc(f.name) + '</div>' +
      '<div class="why" style="margin:3px 0 0">Supporting function &middot; ' +
        esc(people.map(personName).join(", ")) +
        ' &middot; carries ' + caps.length + ' ' + (caps.length === 1 ? "capability" : "capabilities") +
        ', scored by the group</div></div></div>';
}

function capBand(c){
  var r = capReported(c);
  return '<div class="capline"><span class="captag">Capability</span>' +
    '<span class="capnm">' + esc(c.name) + '</span>' +
    '<span class="captally">' + r.done + ' / ' + r.total + ' reported</span></div>';
}

/* ── The rail ────────────────────────────────────────────────────────
   Which project is open is held by the capability, not by the page, so it
   keeps its place when the tab changes. That is not hidden state: the rail
   shows the selection at all times, which is the whole reason it is allowed
   to persist. It is dropped when the viewer leaves the capability. */
var RAIL = {};
function railKeyFor(c){ return "cap:" + c.id; }
function railPick(c){
  var k = railKeyFor(c), want = RAIL[k];
  var list = c.projects || [];
  if (!list.length) return null;
  for (var i = 0; i < list.length; i++) if (list[i].id === want) return list[i];
  return list[0];
}
/* Below two items there are no siblings to move between, so the rail is a
   column of wasted width. The pane simply fills it. */
function railWorthIt(list){ return (list || []).length >= 2; }

function railFor(list, sel, numOf, subOf, groupOf, footNote){
  var lastGroup = null;
  var rows = list.map(function(it){
    var g = groupOf ? groupOf(it) : null, head = "";
    if (g && g !== lastGroup) { head = '<div class="rgroup">' + esc(g) + '</div>'; lastGroup = g; }
    return head +
      '<button class="ritem' + (it.id === sel.id ? " on" : "") + '" data-rail="' + esc(it.id) + '">' +
        '<b>' + esc(it.name) + '</b>' +
        '<span class="rnum">' + (numOf ? numOf(it) : "") + '</span>' +
        (subOf ? '<span class="rsub">' + subOf(it) + '</span>' : '') +
      '</button>';
  }).join("");
  return '<div class="rail"><div class="rhead">Projects <span>' + list.length + '</span></div>' +
    rows + (footNote ? '<div class="rfoot">' + footNote + '</div>' : '') + '</div>';
}
function splitOrPane(list, sel, rail, pane){
  return railWorthIt(list)
    ? '<div class="split">' + rail + '<div class="pane">' + pane + '</div></div>'
    : '<div class="pane">' + pane + '</div>';
}

function projMeta(p){
  return (p.timeline === "date" ? esc(p.start) + " &rarr; " + esc(p.end) + " &middot; timeline by date"
                                : esc(p.start) + " &rarr; " + esc(p.end) + " &middot; timeline by quarter");
}
function delivKindPill(d){
  return '<span class="pill kind">' + (d.kind === "pct" ? "% delivered" : "Delivered / not") + '</span>';
}
function delivShown(d){
  var v = delivReads(d);
  if (v == null) return '<span class="pill kind">&mdash;</span>';
  if (d.kind === "pct") return '<span class="pill ' + band(v) + '">' + v + '%</span>';
  return v === 100 ? '<span class="pill good">Delivered</span>' : '<span class="pill warn">Not yet</span>';
}
function msPill(m){
  if (m.status === "done") return '<span class="pill good">Completed</span>';
  if (m.status === "wip") return '<span class="pill attn">In progress</span>';
  return '<span class="pill kind">Not started</span>';
}
/* A milestone finishing after the project's end date is saved as entered and
   said out loud. Two things might be true and the platform picks neither. */
function overrunNote(p){
  var over = projOverruns(p);
  if (!over.length) return "";
  return '<div class="note bad-note"><b>' + over.length + ' milestone' + (over.length === 1 ? "" : "s") +
    ' finish after this project ends on ' + esc(p.end) + '.</b> ' +
    'The dates are saved exactly as entered \u2014 the platform does not refuse one. The project has run ' +
    'past its timeline, so either the timeline moves or the overrun stands. Both are yours to decide.</div>';
}

/* ── Capability \u2192 Performance ───────────────────────────────────────
   Three readings, side by side, never folded into one. Key objectives is
   optional: where a capability has none the card is absent, not zero. */
function capScoreCards(c){
  var ko = capKOScore(c), perf = capPerf(c), ce = capExec(c);
  var cards = [];
  if (ko != null) {
    cards.push('<div class="card tight primary-card">' +
      '<div class="score-h"><h4>Key objectives <span class="rank">primary</span></h4>' +
        '<span class="pill ' + band(ko) + '">' + bandWord(ko) + '</span></div>' +
      '<div class="headline"><span class="big" style="color:var(--' + band(ko) + ')">' + pctBig(ko) + '</span></div>' +
      '<div class="minirow"><div><em>Objectives</em><b>' + c.keyObjectives.length + '</b></div>' +
        '<div><em>Weighted</em><b>' + c.keyObjectives.map(function(m){ return m.weight == null ? "\u2014" : m.weight; }).join(" / ") + '</b></div>' +
        '<div><em>Reported</em><b>' + c.keyObjectives.filter(function(m){ return m.actual != null && m.actual !== ""; }).length +
          ' / ' + c.keyObjectives.length + '</b></div></div></div>');
  }
  cards.push('<div class="card tight' + (ko == null ? " primary-card" : "") + '">' +
    '<div class="score-h"><h4>Project performance' + (ko == null ? ' <span class="rank">primary</span>' : '') + '</h4>' +
      '<span class="pill ' + band(perf) + '">' + bandWord(perf) + '</span></div>' +
    '<div class="headline"><span class="big" style="color:var(--' + band(perf) + ')">' + pctBig(perf) + '</span></div>' +
    '<div class="minirow"><div><em>Deliverables</em><b>' + pct(capDeliverySide(c)) + '</b></div>' +
      '<div><em>Outcomes</em><b>' + pct(capOutcomeSide(c)) + '</b></div>' +
      '<div><em>Projects</em><b>' + c.projects.length + '</b></div></div></div>');
  cards.push('<div class="card tight">' +
    '<div class="score-h"><h4>Execution</h4>' +
      '<span class="pill ' + band(ce.pct) + '">' + bandWord(ce.pct) + '</span></div>' +
    '<div class="headline"><span class="big" style="color:var(--' + band(ce.pct) + ')">' + pctBig(ce.pct) + '</span>' +
      '<span class="ofplan">' + ce.done + ' of ' + ce.total + ' milestones</span></div>' +
    '<div class="minirow"><div><em>Completed</em><b>' + ce.done + '</b></div>' +
      '<div><em>In progress</em><b>' + ce.wip + '</b></div>' +
      '<div><em>Not started</em><b>' + ce.todo + '</b></div></div></div>');
  return '<div class="scores">' + cards.join("") + '</div>';
}

function capKOTable(c){
  if (!c.keyObjectives.length) return "";
  return '<h4 class="mini">Key objectives</h4>' +
    miniTable(["#","Objective","Weight","Dir.","Target","Reported","Score"],
      c.keyObjectives.map(function(m, i){
        return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(m.name) +
          (m.note ? '<span class="why">' + esc(m.note) + '</span>' : '') + '</td>' +
          '<td class="cc">' + (m.weight == null ? "&mdash;" : m.weight + "%") + '</td>' +
          '<td class="cc">' + esc(m.dir) + '</td>' +
          '<td class="num">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</td>' +
          '<td class="num">' + (m.actual == null || m.actual === "" ? "&mdash;" : esc(m.actual)) + '</td>' +
          '<td class="num final" style="color:var(--' + band(m.progress) + ')">' + pct(m.progress) + '</td></tr>';
      }).join(""));
}

function projPerformanceBody(p){
  var dRows = p.deliverables.map(function(d, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(d.name) +
      (d.note ? '<span class="why">' + esc(d.note) + '</span>' : '') + '</td>' +
      '<td class="cc">' + delivShown(d) + '</td>' +
      '<td class="num final">' + pct(delivReads(d)) + '</td></tr>';
  }).join("");
  var oRows = p.outcomes.map(function(o, i){
    if (o.progress == null) {
      return '<tr class="notdue"><td class="idx">' + (i+1) + '</td><td>' + esc(o.name) + '</td>' +
        '<td class="num">' + esc(o.target) + '</td>' +
        '<td colspan="2" class="cc"><span class="pill kind">Measured at ' + esc(o.measureAt) + '</span></td></tr>';
    }
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(o.name) +
      (o.note ? '<span class="why">' + esc(o.note) + '</span>' : '') + '</td>' +
      '<td class="num">' + esc(o.target) + '</td>' +
      '<td class="num">' + esc(o.actual) + '</td>' +
      '<td class="num final" style="color:var(--' + band(o.progress) + ')">' + pct(o.progress) + '</td></tr>';
  }).join("");
  var mRows = p.milestones.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(m.name) + '</td>' +
      '<td class="cc">' + esc(m.finish) + '</td>' +
      '<td class="cc">' + msPill(m) + '</td></tr>';
  }).join("");
  var mst = projMilestones(p);
  return '<div class="ptitle"><div><h3>' + esc(p.name) + '</h3>' +
      '<div class="pmeta">' + projMeta(p) + ' &middot; deliverables ' + pct(projDeliverySide(p)) +
      ', outcomes ' + pct(projOutcomeSide(p)) + '</div></div>' +
      '<span class="pill ' + band(projPerf(p)) + '">' + pct(projPerf(p)) + '</span></div>' +
    '<h4 class="mini">Deliverables</h4>' +
    miniTable(["#","Deliverable","Reported","Reads"], dRows) +
    '<h4 class="mini">Outcomes</h4>' +
    miniTable(["#","Outcome","Target","Reported","Reads"], oRows) +
    '<h4 class="mini">Milestones <em>' + mst.done + ' of ' + mst.total + ' completed</em></h4>' +
    miniTable(["#","Milestone","Finish","Progress"], mRows);
}

function renderFnPerformance(fnKey){
  var fk = fnKeyOf(fnKey), caps = capsOfFunction(fk);
  /* The same Present a unit's Performance page carries (§8.8): available to
     anyone who can view this page, assembling the review from whatever the
     platform holds at that moment. */
  return '<div class="pageact"><button class="editbtn" data-present-fn="' + esc(fk) +
      '" title="Present this function">Present</button></div>' +
    fnHead(fk) + caps.map(function(c){
    var sel = railPick(c);
    if (!sel) return capBand(c) + '<div class="capbody">' + capScoreCards(c) + capKOTable(c) +
      '<div class="note">No projects yet. Nothing to report until there are.</div></div>';
    var rail = railFor(c.projects, sel,
      function(p){ var v = projPerf(p);
        return v == null ? '<span class="rnum">&mdash;</span>'
          : '<b style="color:var(--' + band(v) + ')">' + v + '%</b>'; },
      function(p){ var m = projMilestones(p); return m.done + ' of ' + m.total + ' milestones'; },
      null, 'Figure shown is performance');
    return capBand(c) + '<div class="capbody">' + capScoreCards(c) + capKOTable(c) +
      '<h4 class="mini">Projects</h4>' +
      splitOrPane(c.projects, sel, rail, projPerformanceBody(sel)) + '</div>';
  }).join("");
}

/* ── Capability \u2192 Projects ──────────────────────────────────────────
   The plan as it was formed. Nothing here has been reported: no progress, no
   status, no actuals. Those are entered on Reporting and read on Performance. */
function projPlanBody(p){
  var dRows = p.deliverables.map(function(d, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(d.name) + '</td>' +
      '<td class="cc">' + delivKindPill(d) + '</td>' +
      '<td class="cc">' + esc(d.due || "\u2014") + '</td>' +
      '<td class="cc">' + esc(d.owner || "\u2014") + '</td></tr>';
  }).join("");
  var oRows = p.outcomes.map(function(o, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(o.name) + '</td>' +
      '<td class="cc">' + esc(o.dir) + '</td>' +
      '<td class="num">' + esc(o.target) + '</td>' +
      '<td class="cc">' + esc(o.measureAt || "\u2014") + '</td></tr>';
  }).join("");
  var mRows = p.milestones.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(m.name) + '</td>' +
      '<td>' + esc(m.covers || "") + '</td>' +
      '<td class="cc">' + esc(m.owner || "\u2014") + '</td>' +
      '<td class="cc">' + esc(m.finish) + '</td></tr>';
  }).join("");
  return '<div class="ptitle"><div><h3>' + esc(p.name) + '</h3>' +
      '<div class="pmeta">' + projMeta(p) + '</div></div>' +
      '<span class="pill kind">' + (p.timeline === "date" ? "By date" : "By quarter") + '</span></div>' +
    '<p class="planonly"><b>Plan only</b> &nbsp;Nothing here has been reported. Progress and actuals are ' +
      'entered on Reporting and read on Performance.</p>' +
    '<h4 class="mini">Brief</h4><p class="sub" style="margin:0">' + esc(p.brief) + '</p>' +
    '<h4 class="mini">Stakeholders</h4>' +
    (p.stakeholders || []).map(function(s){ return '<span class="pill kind">' + esc(s) + '</span> '; }).join("") +
    '<h4 class="mini">Deliverables <em>\u2014 what the project hands over</em></h4>' +
    miniTable(["#","Deliverable","Kind","Due","Owner"], dRows) +
    '<h4 class="mini">Outcomes <em>\u2014 always a measure, always with a measurement time</em></h4>' +
    miniTable(["#","Outcome","Dir.","Target","Measured at"], oRows) +
    '<h4 class="mini">Milestones <em>\u2014 the timeline as planned</em></h4>' +
    miniTable(["#","Milestone","What it covers","Owner","Finish"], mRows) +
    overrunNote(p);
}

function renderFnProjects(fnKey){
  var fk = fnKeyOf(fnKey), caps = capsOfFunction(fk);
  return fnHead(fk) + caps.map(function(c){
    var sel = railPick(c);
    if (!sel) return capBand(c) + '<div class="capbody"><div class="note">' +
      'No projects yet.</div></div>';
    var rail = railFor(c.projects, sel,
      function(p){ return p.deliverables.length; },
      function(p){ return p.outcomes.length + ' outcomes &middot; ' + p.milestones.length + ' milestones'; },
      null, 'Figure shown is deliverables');
    return capBand(c) + '<div class="capbody">' +
      splitOrPane(c.projects, sel, rail, projPlanBody(sel)) + '</div>';
  }).join("");
}

/* ── Capability \u2192 Reporting ─────────────────────────────────────────
   The unit's reporting page with projects where pillars are. Same bar, same
   tally, same entry box stating its unit, same dimming for anything outside
   the cycle. */
function capEntryBox(x, unit, may, label){
  var cur = x.actual, has = cur != null && cur !== "";
  var shown = !has ? "" : (unit === "%" ? String(cur) : (splitTarget(String(cur)).value || String(cur)));
  if (!may) return '<span class="mono">' + (has ? esc(String(cur)) : "\u2014") + '</span>';
  return '<span class="entry' + (has ? " filled" : "") + '">' +
    '<input class="field" data-crep="' + x.id + '" data-unit="' + esc(unit) + '" value="' + esc(shown) +
    '" placeholder="\u2014" aria-label="Report ' + esc(label) + '">' +
    (unit ? '<span class="unitsuf">' + esc(unit) + '</span>' : '') + '</span>';
}
function capNoteBox(x, may){
  return may
    ? '<input class="fld notefld" data-cnote="' + x.id + '" value="' + esc(x.note || "") +
      '" placeholder="Note, if there is one">'
    : (x.note ? '<span class="why" style="margin:0">' + esc(x.note) + '</span>' : '');
}
function capPickBox(x, may, opts, val){
  if (!may) return '<span class="mono">' + (val ? esc(val) : "\u2014") + '</span>';
  return '<select class="fld selbox" data-cpick="' + x.id + '">' +
    opts.map(function(o){
      return '<option value="' + esc(o[0]) + '"' + (o[0] === (val || "") ? " selected" : "") + '>' +
        esc(o[1]) + '</option>';
    }).join("") + '</select>';
}

function projReportBody(p, may){
  var r = projReported(p);
  var dRows = p.deliverables.map(function(d, i){
    if (!delivDue(d)) {
      return '<tr class="notdue"><td class="idx">' + (i+1) + '</td><td>' + esc(d.name) + '</td>' +
        '<td colspan="3" class="cc"><span class="pill kind">Not asked \u2014 due ' + esc(d.due) + '</span></td></tr>';
    }
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(d.name) + '</td>' +
      '<td class="cc">' + delivKindPill(d) + '</td>' +
      '<td class="cc">' + (d.kind === "pct"
        ? capEntryBox(d, "%", may, d.name)
        : capPickBox(d, may, [["","\u2014"],["yes","Delivered"],["no","Not yet"]], d.actual)) + '</td>' +
      '<td class="notecol">' + capNoteBox(d, may) + '</td></tr>';
  }).join("");
  var oRows = p.outcomes.map(function(o, i){
    if (!outcomeDue(o)) {
      return '<tr class="notdue"><td class="idx">' + (i+1) + '</td><td>' + esc(o.name) + '</td>' +
        '<td class="num">' + esc(o.target) + '</td>' +
        '<td colspan="3" class="cc"><span class="pill kind">Not asked \u2014 measured at ' +
        esc(o.measureAt) + '</span></td></tr>';
    }
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(o.name) + '</td>' +
      '<td class="num">' + esc(o.target) + '</td>' +
      '<td class="cc">' + esc(o.measureAt || "\u2014") + '</td>' +
      '<td class="cc">' + capEntryBox(o, splitTarget(String(o.target)).unit, may, o.name) + '</td>' +
      '<td class="notecol">' + capNoteBox(o, may) + '</td></tr>';
  }).join("");
  var mRows = p.milestones.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(m.name) + '</td>' +
      '<td class="cc">' + esc(m.finish) + '</td>' +
      '<td class="cc">' + capPickBox(m, may,
        [["","\u2014"],["todo","Not started"],["wip","In progress"],["done","Completed"]], m.status) + '</td>' +
      '<td class="notecol">' + capNoteBox(m, may) + '</td></tr>';
  }).join("");
  return '<div class="ptitle"><div><h3>' + esc(p.name) + '</h3>' +
      '<div class="pmeta">' + esc(REVIEW.name) + ' &middot; ' + r.total + ' entries asked, ' +
      r.done + ' given</div></div>' +
      '<span class="pill ' + (r.done >= r.total ? "good" : "attn") + '">' + r.done + ' / ' + r.total + '</span></div>' +
    '<h4 class="mini">Deliverables</h4>' +
    miniTable(["#","Deliverable","Kind","Reported","Note"], dRows) +
    '<h4 class="mini">Outcomes</h4>' +
    miniTable(["#","Outcome","Target","Measured at","Reported","Note"], oRows) +
    '<h4 class="mini">Milestones</h4>' +
    miniTable(["#","Milestone","Finish","Progress","Note"], mRows);
}

function capReportBody(c){
  var may = REVIEW.state === "open" && grant("k_report") === "edit";
  var kRows = c.keyObjectives.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(m.name) + '</td>' +
      '<td class="cc">' + esc(m.dir) + '</td>' +
      '<td class="num">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</td>' +
      '<td class="cc">' + capEntryBox(m, splitTarget(String(m.target)).unit, may, m.name) + '</td>' +
      '<td class="notecol">' + capNoteBox(m, may) + '</td></tr>';
  }).join("");
  var sel = railPick(c);
  var koBlock = c.keyObjectives.length
    ? '<h4 class="mini">Key objectives</h4>' +
      miniTable(["#","Objective","Dir.","Target","Reported","Note"], kRows)
    : '';
  if (!sel) return koBlock + '<div class="note">No projects to report on.</div>';
  var rail = railFor(c.projects, sel,
    function(p){ var r = projReported(p);
      return '<span class="rtally' + (r.total && r.done >= r.total ? " full" : "") + '">' +
        r.done + '/' + r.total + '</span>'; },
    function(p){ var r = projReported(p);
      return r.total === 0 ? 'Not asked this cycle'
        : (r.done >= r.total ? 'Complete' : (r.total - r.done) + ' still to enter'); },
    null, 'Tally is entries given of asked');
  return koBlock + '<h4 class="mini">Projects</h4>' +
    splitOrPane(c.projects, sel, rail, projReportBody(sel, may));
}

function renderFnReport(fnKey){
  var fk = fnKeyOf(fnKey), caps = capsOfFunction(fk);
  if (REVIEW.state !== "open") {
    return fnHead(fk) + '<div class="note"><b>' + esc(REVIEW.name) + ' is closed.</b> ' +
      'Its figures are a record now.</div>';
  }
  var done = 0, total = 0;
  caps.forEach(function(c){ var r = capReported(c); done += r.done; total += r.total; });
  var pctDone = total ? Math.round(done / total * 100) : 0;
  var bar = '<div class="rep-bar">' +
      '<div class="kpi"><b>' + done + '</b><span>of ' + total + ' reported</span></div>' +
      '<div class="repbar' + (pctDone < 100 ? " part" : "") + '"><i style="width:' + pctDone + '%"></i></div>' +
      '<span class="why" style="margin:0">' + esc(REVIEW.name) + ' &middot; due ' + esc(REVIEW.due) + '</span>' +
    '</div>';
  return fnHead(fk) + bar + caps.map(function(c){
    return capBand(c) + '<div class="capbody">' + capReportBody(c) + '</div>';
  }).join("");
}

/* ── UNIT · Strategy ─────────────────────────────────────────────────
   The plan and the reading of the plan stop sharing a page. Performance
   answers how it is going; Strategy carries what was agreed, with no reported
   figure anywhere on it \u2014 the same separation the group's Temple already
   makes, and the same one a capability makes between Projects and Performance.

   The rail is here for the same reason it is on a capability: a unit's items
   are a list worked through one at a time, and Mobile's fourth item sits two
   screens below its first in an accordion. Unlike a capability's projects,
   they group by kind \u2014 a Direction and a Capability are different things and
   the rail says so. */
function unitRailKey(u){ return "unit:" + u.ukey; }
function unitRailPick(u){
  var want = RAIL[unitRailKey(u)], list = u.items || [];
  if (!list.length) return null;
  for (var i = 0; i < list.length; i++) if (list[i].code === want) return list[i];
  return list[0];
}
function unitRailFor(u, sel){
  /* The rail does not group by Direction and Capability. It did in the first
     drawing; the distinction is on the item itself and splitting the rail on it
     bought nothing at this size. Kept in the backlog rather than the code. */
  var list = u.items;
  var rows = list.map(function(it){
    return '<button class="ritem' + (it.code === sel.code ? " on" : "") + '" data-urail="' +
        esc(u.ukey) + '|' + esc(it.code) + '">' +
        '<b>' + esc(it.code) + '&nbsp; ' + esc(it.name) + '</b>' +
        '<span class="rnum">' + it.measures.length + '</span>' +
        '<span class="rsub">' + it.tactics.length + ' tactics &middot; ' + esc(it.owner) + '</span>' +
      '</button>';
  }).join("");
  return '<div class="rail"><div class="rhead">' + L("pillar","bu") +
    ' <span>' + list.length + '</span></div>' + rows +
    '<div class="rfoot">Figure shown is key measures</div></div>';
}
function unitPlanBody(it){
  var mRows = it.measures.map(function(m, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(m.name) + '</td>' +
      '<td class="cc">' + esc(m.dir) + '</td>' +
      '<td class="num">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</td>' +
      '<td class="num">' + (m.target3y ? esc(m.target3y) : "&mdash;") + '</td>' +
      '<td class="cc">' + esc(m.compile || "\u2014") + '</td></tr>';
  }).join("");
  var tRows = it.tactics.map(function(t, i){
    return '<tr><td class="idx">' + (i+1) + '</td><td>' + esc(t.name) + '</td>' +
      '<td>' + esc(t.owner) + '</td><td>' + qs(t) + '</td></tr>';
  }).join("");
  return '<div class="ptitle"><div><h3>' + esc(it.code) + '&nbsp; ' + esc(it.name) + '</h3>' +
      '<div class="pmeta">' + esc(it.kind) + ' &middot; theme ' + esc(it.theme) +
      ' &middot; ' + esc(it.owner) + '</div></div>' +
      '<span class="pill kind">' + esc(it.kind) + '</span></div>' +
    (it.sub ? '<p class="sub" style="margin:10px 0 0">' + esc(it.sub) + '</p>' : '') +
    '<p class="planonly"><b>Plan only</b> &nbsp;Nothing here has been reported. Actuals are entered ' +
      'on My reporting and read on Performance.</p>' +
    '<h4 class="mini">Key measures <em>\u2014 as planned: target, horizon, how it compiles</em></h4>' +
    miniTable(["#","Measure","Dir.","Target","3-year","Compiled"], mRows) +
    '<h4 class="mini">Tactics <em>\u2014 who carries it, and in which quarters</em></h4>' +
    miniTable(["#","Tactic","Owner","Quarters"], tRows);
}
function renderUnitPlan(u){
  var sel = unitRailPick(u);
  if (!sel) return '<div class="note">This unit has no ' + L("pillar","bu").toLowerCase() +
    ' yet, so there is no plan to show.</div>';
  /* Key objectives are NOT repeated here. They are authored on Foundation and
     read on Performance \u2014 one place to author, one place to read. Showing them
     again above the rail was duplication, and a duplicated table is a table
     that will one day disagree with itself. */
  return '<div class="kv"><h2>' + esc(u.name) + '</h2>' +
      '<span class="who">The plan as agreed &middot; no reported figure on this page</span></div>' +
    '<h4 class="mini">' + L("pillar","bu") + '</h4>' +
    (u.items.length >= 2
      ? '<div class="split">' + unitRailFor(u, sel) + '<div class="pane">' + unitPlanBody(sel) + '</div></div>'
      : '<div class="pane">' + unitPlanBody(sel) + '</div>');
}


/* ── Capability \u2192 Strategy \u2192 Foundation ────────────────────────────
   A capability has no clauses, no aspiration and no SWOT \u2014 its foundation is
   the group's. What it does have is a definition and, where it has any, its key
   objectives. Same two-card grid a unit's Foundation uses, so the two read as
   the same page with different content.

   The third column is WEIGHT rather than a three-year target: a capability's
   objectives carry the optional weighting and have never had a horizon. */
function renderFnFoundation(fnKey){
  var fk = fnKeyOf(fnKey), caps = capsOfFunction(fk);
  return fnHead(fk) + editBar("capfoundation", "k_found") + caps.map(function(c){
    var f = functionOf(c.fn);
    var koBlock = c.keyObjectives.length
      ? '<div class="ohead"><span>Objective</span><span>This year</span><span>Weight</span></div>' +
        c.keyObjectives.map(function(m){
          return '<div class="orow"><span class="on">' + esc(m.name) + '</span>' +
            '<span class="ot">' + (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</span>' +
            '<span class="ot h">' + (m.weight == null ? "&mdash;" : m.weight + "%") + '</span></div>';
        }).join("")
      : '<p class="sub" style="margin:0">None. This capability is judged by its projects.</p>';
    return capBand(c) + '<div class="capbody"><div class="fgrid">' +
      '<div class="card"><h2 class="sec first">What it is</h2><dl style="margin:0">' +
        '<div class="clause"><dt>Capability</dt><dd>' + esc(c.name) + '</dd></div>' +
        '<div class="clause"><dt>Carried by</dt><dd>' +
          esc(f ? f.name : "\u2014") +
          (f && f.head ? " \u2014 " + esc(personName(f.head)) : "") + '</dd></div>' +
        '<div class="clause"><dt>Definition</dt><dd>' +
          fieldOr("capfoundation", c.def, "", function(v){ c.def = v; }) + '</dd></div>' +
      '</dl></div>' +
      '<div class="card"><div class="cardhead"><h2 class="sec first">' + L("keyobj","bu") + '</h2>' +
        '<span class="pill horizon">Horizon &middot; ' + horizonLabel() + '</span></div>' +
        koBlock + '</div>' +
    '</div></div>';
  }).join("");
}


/* ── The rail on a unit's Performance ────────────────────────────────
   The pillar accordion becomes the rail, for the reason the rail exists: a
   unit's items are worked through one at a time, and Mobile's fourth sits two
   screens below its first when every body is stacked.

   Reordering comes WITH it. The handle moves into the rail row, which is a
   better drag target than a wide table row ever was \u2014 a vertical list of four
   is exactly what pointer reordering was written for. The whole-row click still
   selects rather than drags, which is why the handle is separate. */
function unitPerfRail(u){
  var sel = unitRailPick(u);
  if (!sel) return '<div class="note">This unit has no ' + L("pillar","bu").toLowerCase() + ' yet.</div>';
  var on = arranging("unit", u.ukey);
  var rows = u.items.map(function(it, i){
    var perf = pillarPerf(it), r = pillarRatio(it);
    return '<button class="ritem' + (it.code === sel.code ? " on" : "") + '" data-urail="' +
      esc(u.ukey) + '|' + esc(it.code) + '" data-oi="' + i + '">' +
      (on ? handle("Reorder " + it.name) : '') +
      '<b>' + pillarCode(u, i) + '&nbsp; ' + esc(it.name) + '</b>' +
      '<span class="rnum" style="color:var(--' + band(perf) + ');font-weight:700">' + pct(perf) + '</span>' +
      '<span class="rsub">' + esc(it.kind) + ' &middot; execution ' + pct(r) +
        ' &middot; ' + esc(it.owner) + '</span></button>';
  }).join("");
  var rail = '<div class="rail' + (on ? ' arranging' : '') + '">' +
    '<div class="rhead">' + L("pillar","bu") + ' <span>' + u.items.length + '</span></div>' +
    '<div class="sortable" data-kind="pillars" data-u="' + u.ukey + '">' + rows + '</div>' +
    '<div class="rfoot">' + pct(unitPillars(u)) + ' across ' + u.items.length + ' &middot; execution ' +
      pct(unitRatio(u)) + '</div></div>';
  return u.items.length >= 2
    ? '<div class="split">' + rail + '<div class="pane">' + unitPerfPane(sel, u) + '</div></div>'
    : '<div class="pane">' + unitPerfPane(sel, u) + '</div>';
}
function unitPerfPane(it, u){
  var scored = scorableMeasures(it).map(function(m){ return m.progress; });
  var uk = u && u.ukey;
  return '<div class="ptitle"><div><h3>' + esc(it.name) + '</h3>' +
      '<div class="pmeta">' + esc(it.kind) + ' &middot; theme ' + esc(it.theme) +
      ' &middot; ' + esc(it.owner) + '</div></div>' +
      '<span class="pill ' + band(pillarPerf(it)) + '">' + pct(pillarPerf(it)) + '</span></div>' +
    scorePair(pillarPerf(it), pillarExec(it), pillarPlan(it),
              it.measures.length, scored.length,
              scored.length ? Math.max.apply(null, scored) : null,
              scored.length ? Math.min.apply(null, scored) : null) +
    '<h5 class="mini">' + L("measure","bu") + '</h5>' +
    '<div class="scroll"><table>' + measureHead() +
      '<tbody class="sortable" data-kind="measures" data-u="' + uk + '">' +
      measureRows(it.measures, { unit: uk }) + '</tbody></table></div>' +
    '<h5 class="mini">' + L("tactic","bu") + '</h5>' +
    '<div class="scroll"><table>' + tacticHead() +
      '<tbody class="sortable" data-kind="tactics" data-u="' + uk + '">' +
      tacticRows(it.tactics, uk) + '</tbody></table></div>';
}

</script>
<script>
/* ── CONFIGURATION SCREENS ───────────────────────────────────────────────
   Labels · Levels & access · and the factor editor that extends Weighting.
   ─────────────────────────────────────────────────────────────────────── */

function L(key, scope){
  var e = LABELS.entries.filter(function(x){ return x.key === key; })[0];
  if (!e) return key;
  return (scope === "group" ? e.group : e.bu) || e.internal;
}

/* ── Labels ─────────────────────────────────────────────────────────── */
function renderLabels(){
  var editable = grant("c_labels") === "edit";

  var rows = LABELS.entries.map(function(e, i){
    var cell = function(which){
      var val = e[which];
      if (val === "—") return '<td><span class="pill none">Not held</span></td>';
      return '<td>' + (editable
        ? '<input class="lbl" data-lbl="' + i + '" data-scope="' + which + '" value="' + esc(val) + '" aria-label="' + esc(e.internal) + ' label at ' + which + ' level" />'
        : '<span class="mono">' + esc(val) + '</span>') + '</td>';
    };
    return '<tr><td><b>' + esc(e.internal) + '</b><span class="why">' + esc(e.note) + '</span></td>' +
      cell("group") + cell("bu") + '</tr>';
  }).join("");

  /* Two entities sharing one display label would render two different things
     under one word on the same screen. Caught here, not in a client demo. */
  var seen = {}, clashes = [];
  LABELS.entries.forEach(function(e){
    ["group","bu"].forEach(function(s){
      var v = (e[s] || "").toLowerCase();
      if (!v || v === "—") return;
      if (seen[s + "|" + v]) clashes.push(e[s]);
      seen[s + "|" + v] = true;
    });
  });

  var warn = clashes.length
    ? '<div class="note bad-note"><b>Label collision.</b> <span class="mono">' + esc(clashes[0]) +
      '</span> is in use by two entities at the same level. Saving is blocked until one of them changes &mdash; ' +
      'two different objects rendering under one word on the same screen is not recoverable by the reader.</div>'
    : '<div class="note"><b>No collisions.</b> Every display label at each level is unique, so no two entities can render under the same word.</div>';

  return '<p class="lede">Every level of the model carries an <strong>internal name</strong> the platform is built on, and a <strong>display label</strong> the tenant sees. The internal name never changes. <strong>The SMO manages this, not the client</strong> &mdash; which is what stops a label collision reaching a screen.</p>' +

    '<div class="kv"><span class="pill kind">Scope: per tenant</span>' +
    '<span class="pill kind">Managed by: SMO</span>' +
    '<span class="pill ' + (editable ? "good" : "none") + '">' + (editable ? "Editable" : "Read only for this viewer") + '</span></div>' +

    section("", "Labels", null,
      '<div class="cfg"><table><thead><tr>' +
      '<th style="width:34%">Internal name<span class="why">The contract. Never changes.</span></th>' +
      '<th style="width:33%">Display at group level</th>' +
      '<th style="width:33%">Display at business unit level</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' + warn) +

    '<div class="note"><b>Labels are per tenant, not per strategy cycle.</b> A cycle-scoped label would let 2026 and 2027 use different words for the same object, and no report spanning both could be read without a glossary.</div>' +

    '<div class="note"><b>Vision, End State and Winning Aspiration are one entity.</b> They are three display labels for the same statement, which is why a unit holds exactly one of them and never two.</div>';
}

/* ── Levels & access ────────────────────────────────────────────────── */
function stateCell(levelKey, pageKey, editable){
  var v = ACCESS[levelKey][pageKey];
  if (!editable) {
    return '<td class="ac"><span class="st st-' + v + '">' + v + '</span></td>';
  }
  var opts = ["none","view","edit"].map(function(o){
    return '<button type="button" class="stbtn' + (o === v ? " on " + o : "") + '" data-ac="' +
      levelKey + '|' + pageKey + '|' + o + '" aria-label="' + o + '">' +
      (o === "none" ? "&minus;" : o === "view" ? "&#128065;" : "&#9998;") + '</button>';
  }).join("");
  return '<td class="ac"><span class="stset">' + opts + '</span></td>';
}

function renderAccess(){
  var editable = grant("c_access") === "edit";
  var levels = [SMO_ROLE].concat(LEVELS);

  var groups = [
    { name:"Group pages",    keys:["g_perf","g_found","g_temple","g_weight"] },
    { name:"Business unit pages", keys:["u_perf","u_found","u_anal"] },
    { name:"Configuration",  keys:["c_labels","c_access"] }
  ];

  var head = '<tr><th style="width:24%">Page</th>' + levels.map(function(l){
    return '<th class="ac"><div class="factor-h"><b>' + esc(l.name) + '</b><span>' +
      esc(l.titles || "Super user") + '</span></div></th>';
  }).join("") + '</tr>';

  var body = groups.map(function(g){
    return '<tr class="grouprow"><td colspan="' + (levels.length + 1) + '">' + esc(g.name) + '</td></tr>' +
      g.keys.map(function(pk){
        var p = PAGES.filter(function(x){ return x.key === pk; })[0];
        return '<tr><td><b>' + esc(p.label) + '</b><span class="why">' + esc(p.note) + '</span></td>' +
          levels.map(function(l){ return stateCell(l.key, pk, editable); }).join("") + '</tr>';
      }).join("");
  }).join("");

  var levelRows = LEVELS.map(function(l){
    return '<tr><td><b>' + esc(l.name) + '</b></td><td>' +
      (editable ? '<input class="lvl" data-lvl="' + l.key + '" value="' + esc(l.titles) + '" aria-label="Titles at ' + esc(l.name) + '" />'
                : '<span class="mono">' + esc(l.titles) + '</span>') +
      '</td><td><span class="why" style="margin:0">' + esc(l.note) + '</span></td></tr>';
  }).join("");

  /* Credentials exist only where the platform is served with a database
     behind it (\u00a719). The SMO issues a temporary password per person \u2014
     usernames are the person keys shown here \u2014 and the person is forced to
     choose their own on first sign-in. Offline, none of this renders and the
     page is exactly the prototype's. */
  var credentialed = typeof SYNC !== "undefined" && SYNC.isLive() && viewer().level === "smo";
  var peopleRows = PEOPLE.map(function(p){
    var lv = p.level === "smo" ? SMO_ROLE : LEVELS.filter(function(x){ return x.key === p.level; })[0];
    return '<tr><td><b>' + esc(p.name) + '</b><span class="why">' + esc(p.title) +
      (credentialed ? ' &middot; <span class="mono">key ' + esc(p.key) + '</span>' : '') + '</span></td>' +
      '<td><span class="pill kind">' + esc(lv.name) + '</span></td>' +
      '<td><span class="pill ' + (p.unit === "group" ? "theme" : "kind") + '">' +
        /* A person may belong to a supporting function rather than a business
           unit \u2014 Finance and HR are not units and never will be. */
        (p.unit === "group" ? "Group &mdash; all units"
         : p.unit && UNITS[p.unit] ? esc(UNITS[p.unit].name)
         : p.fn && FUNCTIONS[p.fn] ? esc(FUNCTIONS[p.fn].name) + " &mdash; function"
         : "\u2014") + '</span></td>' +
      '<td><button class="linkbu" data-as="' + p.key + '">View as this person &rarr;</button>' +
      (credentialed ? ' <button class="linkbu" data-setpw="' + p.key + '">Set password</button>' : '') +
      '</td></tr>';
  }).join("");

  return '<p class="lede">Access is <strong>page level only</strong>. If a level can open a page, it sees everything on that page &mdash; restriction happens by removing the page, never by trimming its contents. A person carries a <strong>level</strong>, which decides which pages, and a <strong>unit attachment</strong>, which decides whose.</p>' +

    '<div class="kv"><span class="pill kind">Page level, never per element</span>' +
    '<span class="pill kind">Three states: none / view / edit</span>' +
    '<span class="pill ' + (editable ? "good" : "none") + '">' + (editable ? "Editable" : "Read only for this viewer") + '</span></div>' +

    section("", "The visibility matrix",
      "Pre-filled with a working default. Change any cell and the navigation above re-renders immediately for whoever is currently being viewed as.",
      '<div class="cfg acgrid"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="chart-legend" style="margin-top:12px">' +
        '<span><i class="st st-none">none</i> no access, page hidden</span>' +
        '<span><i class="st st-view">view</i> reads, cannot change</span>' +
        '<span><i class="st st-edit">edit</i> reads and changes</span></div>' +
      '<div class="note"><b>The CEO views weighting but does not manage it.</b> That single row is why a cell needs three states rather than two &mdash; visible and editable are different grants, and collapsing them would either lock the CEO out or hand them the model.</div>') +

    section("", "Levels and titles",
      "Levels travel between clients; titles do not. Each tenant maps its own titles onto the ladder.",
      '<div class="cfg"><table><thead><tr><th style="width:12%">Level</th><th style="width:40%">Titles at this level</th><th>What sits here</th></tr></thead><tbody>' +
      levelRows + '</tbody></table></div>' +
      '<div class="note"><b>The SMO is not a level.</b> An SMO manager might sit at N-2 and still need edit rights no N-1 has, so it is held as a super user beside the ladder rather than a rung on it.</div>') +

    section("", "People",
      "Level plus unit attachment. Two people at N-1 reach the same page types but different units &mdash; which is why the matrix alone cannot express access.",
      '<div class="cfg"><table><thead><tr><th style="width:34%">Person</th><th>Level</th><th>Attached to</th><th>Simulate</th></tr></thead><tbody>' +
      peopleRows + '</tbody></table></div>' +
      '<div class="note"><b>Ashraf and Hossam are both N-1.</b> The matrix grants both the same page types; their unit attachment is what sends one to Mobile and the other to Retail. A person attached to the group reaches every unit.</div>');
}

/* ── The factor editor, appended to the Weighting page ──────────────── */
/* The previous cycle's split, carried so a factor change can be read against
   what it replaces (§6). A tenant in its first cycle has no previous one — the
   column then says so and every factor reads "new this cycle", rather than
   showing deltas against a year that never happened. */
function priorFactors(){
  return (PRIOR_CYCLE && PRIOR_CYCLE.factors) || [];
}
function priorLabel(){
  if (!priorFactors().length) return "Previous cycle";
  return (PRIOR_CYCLE.year ? PRIOR_CYCLE.year + " " : "") + "cycle";
}

function renderFactorEditor(){
  var w = GROUP.weighting;
  var editable = grant("g_weight") === "edit" && EDITING.factors;
  var total = w.factors.reduce(function(a, f){ return a + f.weight; }, 0);

  var rows = w.factors.map(function(f, i){
    var t = FACTOR_TYPES[f.kind];
    return '<tr><td><b>' + esc(f.name) + '</b><span class="why">' + esc(f.basis) + '</span></td>' +
      '<td><span class="pill kind">' + t.label + '</span><span class="why">' + t.note + '</span></td>' +
      '<td class="num">' + (editable
        ? '<input class="fwt" data-f="' + i + '" value="' + f.weight + '" aria-label="Weight for ' + esc(f.name) + '" />'
        : '<b>' + f.weight + '%</b>') + '</td>' +
      '<td class="num"><span class="why" style="margin:0">' + (function(){
        var pf = priorFactors().filter(function(x){ return x.key === f.key; })[0];
        if (!pf) return "new this cycle";
        var d = f.weight - pf.weight;
        return pf.weight + "% &rarr; " + (d === 0 ? "unchanged"
          : '<b style="color:' + (d > 0 ? "var(--good)" : "var(--warn)") + '">' + (d > 0 ? "+" : "\u2212") + Math.abs(d) + '</b>');
      })() + '</span></td>' +
      '<td>' + (editable ? '<button class="rmbtn" data-rmf="' + i + '" aria-label="Remove ' + esc(f.name) + '">Remove</button>' : '') + '</td></tr>';
  }).join("");

  var totalOK = total === 100;

  return section("", "Weighting factors",
    "Factors are stored as rows, not as fixed columns, so adding one is data entry rather than a schema change. Each declares its own type, which decides how its values are captured.",

    '<div class="cfg-bar plain">' +
      '<span class="cfg-lab">' + w.factors.length + ' factors &middot; totalling ' + total + '%</span>' +
      (grant("g_weight") === "edit"
        ? '<button class="editbtn" data-edit="factors">' + (EDITING.factors ? "Done" : "Edit") + '</button>'
        : '<span class="pill none">View only</span>') + '</div>' +
    '<div class="cfg"><table><thead><tr>' +
      '<th style="width:30%">Factor</th><th style="width:24%">Type</th><th style="width:14%">Weight</th>' +
      '<th style="width:22%">' + priorLabel() + '</th><th style="width:10%"></th>' +
    '</tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="2"><b>Total</b></td>' +
      '<td class="num"><b class="' + (totalOK ? "" : "overload") + '">' + total + '%</b></td>' +
      '<td colspan="2">' + (totalOK
        ? '<span class="pill good">Totals 100</span>'
        : '<span class="pill bad">Must total 100 &mdash; saving blocked</span>') + '</td></tr></tfoot></table></div>' +

    (editable ? '<div class="addrow"><button class="editbtn" id="addf">+ Add a factor</button>' +
      '<span class="why" style="margin:0">A fifth factor takes a share of the same 100 &mdash; the others must give way.</span></div>' : '') +

    /* The reasoning lives in the page Info. What stays is the one thing that
       is not explanation but consequence, and only while someone is editing:
       a change from here moves a figure that has already been reported. */
    (CYCLE_REPORTED && editable
      ? '<div class="note bad-note"><b>H1 2026 has already been reported.</b> Changing a factor or a weight now recomputes every business unit\'s contribution, and with it the group figure that has already been seen.</div>'
      : ''));
}


/* ── Scoring bands ──────────────────────────────────────────────────
   One scale for every achievement-against-benchmark figure, held once so the
   legend, the colours and the status words can never drift apart. ── */
function renderBands(){
  var editable = grant("c_bands") === "edit" && EDITING.bands;
  var b = BANDS.bands;

  var rows = b.map(function(x, i){
    var top = i === 0 ? "and above" : "to " + (b[i-1].floor - 1) + "%";
    return '<tr><td><span class="swatch" style="background:var(--' + x.key + ')"></span>' +
      (editable
        ? '<input class="blabel" data-b="' + i + '" value="' + esc(x.label) + '" aria-label="Label for band ' + (i+1) + '" />'
        : '<b>' + esc(x.label) + '</b>') + '</td>' +
      '<td class="cc">' + (editable && i < b.length - 1
        ? '<input class="bfloor" data-b="' + i + '" value="' + x.floor + '" aria-label="Floor for ' + esc(x.label) + '" />'
        : '<span class="mono">' + x.floor + '</span>') + '</td>' +
      '<td class="cc"><span class="mono">' + x.floor + '% ' + top + '</span></td>' +
      '<td><span class="pill ' + x.key + '">' + esc(x.label) + '</span></td></tr>';
  }).join("");

  /* Floors must descend, or a figure falls into two bands at once. */
  var ok = true;
  for (var i = 1; i < b.length; i++) if (b[i].floor >= b[i-1].floor) ok = false;

  return '<p class="lede">One scale for every figure scored against a benchmark. <strong>Performance is actual over target; execution is delivered over plan</strong> &mdash; the same kind of number, so both read on these bands. The colour and the status word come from the same place, so they can never contradict each other.</p>' +

    '<div class="kv"><span class="pill kind">Scope: per tenant</span>' +
    '<span class="pill kind">One standing scale</span>' +
    '<span class="pill ' + (editable ? "good" : "none") + '">' + (editable ? "Editing" : "View only") + '</span></div>' +

    section("", "Scoring bands",
      "The lowest band has no floor to set &mdash; it catches everything beneath the band above it.",
      '<div class="cfg-bar plain"><span class="cfg-lab">' + b.length + ' bands</span>' +
        (grant("c_bands") === "edit"
          ? '<button class="editbtn" data-edit="bands">' + (EDITING.bands ? "Done" : "Edit") + '</button>'
          : '') + '</div>' +
      '<div class="cfg"><table><thead><tr><th style="width:34%">Band</th>' +
        '<th class="cc" style="width:16%">Floor</th><th class="cc" style="width:26%">Range</th>' +
        '<th style="width:24%">Appears as</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (ok ? '' : '<div class="note bad-note"><b>Floors must descend.</b> Two bands overlap, so a figure would fall into both. Saving is blocked until the order is fixed.</div>') +
      '<div class="note"><b>70 and 50 match the platform\'s existing thresholds</b> in <code>src/lib/scoring.ts</code>, so the strategy layer and the functional layer never disagree about a colour. 85 is the added top edge. <i>Reconcile against the codebase &mdash; this is carried from the handoff, not verified.</i></div>' +
      '<div class="note bad-note"><b>Changing a threshold rewrites history.</b> A quarter reported as on track becomes needs attention with no data having changed. Bands are per tenant and change rarely; the warning is what makes a change visible rather than silent.</div>');
}

/* ── Business units ─────────────────────────────────────────────────
   The one place a unit's name and code prefix are set. Everything else in the
   platform references the unit's KEY, so a rename here propagates and can
   never detach a unit from its weight, its pillars or its people.

   Units are marked inactive rather than deleted. A unit carries pillars,
   measures, tactics and reported progress; retiring it must not destroy a
   cycle's record. ── */
var CLEARING = null;

/* ── One header for both configuration tables ───────────────────────
   The title anchors the left; the facts about the page and its two controls sit
   far right on the same line. Before this, Business units used four elements
   for the same job \u2014 a chip row, a bar with the count and Edit, the table, then
   master clear buttons at the very bottom of the page.

   Edit is a pencil on a square: it edits THIS PAGE, not one thing. Clear is an
   eraser, the only common mark meaning "rub out the contents and leave the
   thing" \u2014 a bin would say the row is going away, which is the opposite. */
var ICO_EDIT = '<svg viewBox="0 0 20 20" aria-hidden="true">' +
  '<path d="M16 10.5V16a1.5 1.5 0 01-1.5 1.5h-10A1.5 1.5 0 013 16V6a1.5 1.5 0 011.5-1.5H10"/>' +
  '<path d="M14 2.8l3.2 3.2L10 13.2l-3.6.4.4-3.6z"/></svg>';
var ICO_DONE = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>';
var ICO_CLEAR = '<svg viewBox="0 0 20 20" aria-hidden="true">' +
  '<path d="M8.5 16.5H16"/>' +
  '<path d="M11.8 3.9l4.3 4.3a1.2 1.2 0 010 1.7l-6 6a1.2 1.2 0 01-1.7 0L4.1 11.6a1.2 1.2 0 010-1.7' +
  'l6-6a1.2 1.2 0 011.7 0z"/><path d="M7 7l5.5 5.5"/></svg>';

var CLEARMENU = null;

function cfgHead(title, chips, editKey, mayEdit, clearScope, labels){
  var editing = EDITING[editKey];
  var open = CLEARMENU === editKey;
  return '<div class="phead2"><h2 class="secttl">' + title + '</h2>' +
    '<div class="hright">' +
      chips.map(function(x){ return '<span class="chip">' + x + '</span>'; }).join("") +
      (mayEdit
        ? '<span class="iconwrap">' +
            '<button class="ico' + (editing ? " on" : "") + '" data-edit="' + editKey +
              '" title="' + (editing ? "Done" : "Edit") + '" aria-label="' +
              (editing ? "Done editing" : "Edit this page") + '">' +
              (editing ? ICO_DONE : ICO_EDIT) + '</button>' +
            '<button class="ico' + (open ? " on" : "") + '" data-clearmenu="' + editKey +
              '" title="Clear" aria-label="Clear plans or progress" aria-expanded="' + open + '">' +
              ICO_CLEAR + '</button>' +
            /* The confirmation replaces the menu in the same place, so the
               second press lands where the first one did. Deleting the old
               master block took its confirmation with it, and the menu set the
               state with nothing left to ask. */
            (CLEARING === clearScope + "||nums" || CLEARING === clearScope + "||plan"
              ? '<div class="menu confirmwrap">' +
                  '<div class="cq"><b>' +
                    (CLEARING === clearScope + "||plan"
                      ? "Clear every plan?" : "Clear all reported progress?") + '</b>' +
                    '<span class="why" style="margin:4px 0 0">' +
                      (CLEARING === clearScope + "||plan"
                        ? "The work itself, everywhere on this page. Names and definitions stand."
                        : "Actuals and notes, everywhere on this page. Every plan stands.") +
                    '</span></div>' +
                  '<button class="danger" data-clearyes="' + CLEARING + '">Yes, clear</button>' +
                  '<button data-clearno="1">Cancel</button>' +
                '</div>'
              : open
              ? '<div class="menu">' +
                  '<button data-clear="' + clearScope + '||nums">' + labels[0] + '</button>' +
                  '<button data-clear="' + clearScope + '||plan">' + labels[1] + '</button>' +
                '</div>'
              : '') +
          '</span>'
        : '') +
    '</div></div>';
}

function renderUnits(){
  var editable = grant("c_units") === "edit" && EDITING.units;
  var live = activeUnits().length;

  var rows = UNIT_KEYS.map(function(k, i){
    var u = UNITS[k];
    var wrow = GROUP.weighting.units.filter(function(r){ return r.key === k; })[0];
    var roles = UNIT_ROLES[k] || {};
    var pick = function(role, sel){
      /* Only people attached to this unit can hold either role — the dropdown
         cannot offer someone from another unit. */
      var opts = PEOPLE.filter(function(p){ return p.unit === k; });
      if (!editable) {
        var n = personName(sel);
        return n ? esc(n) : '<span class="why" style="margin:0">unassigned</span>';
      }
      return '<select class="fld" data-urole="' + k + '|' + role + '">' +
        '<option value="">unassigned</option>' +
        opts.map(function(p){
          return '<option value="' + p.key + '"' + (p.key === sel ? " selected" : "") + '>' + esc(p.name) + '</option>';
        }).join("") + '</select>';
    };
    return '<tr' + (u.active ? '' : ' class="retired"') + '>' +
      '<td class="idx">' + (i + 1) + '</td>' +
      '<td>' + (editable
        ? '<input class="fld" value="' + esc(u.name) + '" data-uname="' + k + '">'
        : '<b>' + esc(u.name) + '</b>') +
        '<span class="why mono">key ' + k + '</span></td>' +
      /* Short name for the navigation only \u2014 everywhere else keeps the full
         one. Empty means "use the full name", so nothing has to be filled in. */
      '<td>' + (editable
        ? '<input class="fld" value="' + esc(u.navName || "") + '" data-unav="' + k +
          '" placeholder="' + esc(u.name) + '">'
        : (u.navName ? '<span class="val">' + esc(u.navName) + '</span>'
                     : '<span class="why" style="margin:0">' + esc(u.name) + '</span>')) + '</td>' +
      '<td class="cc">' + (editable
        ? '<input class="fld mono" value="' + esc(u.codePrefix) + '" data-upx="' + k + '">'
        : '<span class="mono">' + esc(u.codePrefix) + '</span>') + '</td>' +
      '<td class="cc"><span class="mono">' + u.items.length + '</span></td>' +
      '<td class="cc"><span class="mono">' + u.keyObjectives.length + '</span></td>' +
      '<td class="cc"><span class="mono">' + (wrow ? u.weight + '%' : '&mdash;') + '</span></td>' +
      /* A unit belongs to a company or is its own — never neither. "Its own"
         is an explicit choice rather than an empty cell, because an empty cell
         reads as somebody having forgotten and standing alone is a decision. */
      '<td>' + (editable
        ? '<select class="fld" data-ucomp="' + k + '">' +
            COMPANY_KEYS.map(function(ck){
              return '<option value="' + ck + '"' + (u.company === ck ? " selected" : "") + '>' +
                esc(COMPANIES[ck].name) + '</option>';
            }).join("") +
            '<option value=""' + (u.company ? "" : " selected") + '>\u2014 its own company \u2014</option>' +
          '</select>'
        : (u.company ? '<span class="val">' + esc(COMPANIES[u.company].name) + '</span>'
                     : '<span class="why" style="margin:0">its own company</span>')) + '</td>' +
      '<td class="cc">' + pick("head", roles.head) + '</td>' +
      '<td class="cc">' + pick("custodian", roles.custodian) + '</td>' +
      '<td class="cc">' + (editable
        ? '<div class="rowacts">' +
            '<button class="rmbtn' + (u.active ? '' : ' on') + '" data-uact="' + k + '">' +
              (u.active ? "Retire" : "Restore") + '</button>' +
            (CLEARING === k + "|plan"
              ? '<span class="confirm"><b>Clear the whole plan?</b>' +
                  '<span class="why" style="margin:0">Pillars, measures, tactics, objectives, SWOT and the foundation text.</span>' +
                  '<button class="rmbtn" data-clearyes="' + k + '|plan">Yes, clear the plan</button>' +
                  '<button class="linkbu" data-clearno="1">Cancel</button></span>'
              : CLEARING === k + "|nums"
              ? '<span class="confirm"><b>Clear the reported progress?</b>' +
                  '<span class="why" style="margin:0">Actuals and progress only. The plan stands.</span>' +
                  '<button class="rmbtn" data-clearyes="' + k + '|nums">Yes, clear the progress</button>' +
                  '<button class="linkbu" data-clearno="1">Cancel</button></span>'
              : '<button class="linkbu" data-clear="' + k + '|nums">Clear progress</button>' +
                '<button class="linkbu" data-clear="' + k + '|plan">Clear plan</button>') +
          '</div>'
        : '<span class="pill ' + (u.active ? "good" : "none") + '">' + (u.active ? "Active" : "Retired") + '</span>') +
      '</td></tr>';
  }).join("");

  return cfgHead("Business units",

      COMPANY_KEYS.map(function(ck, i){
        var co = COMPANIES[ck], flag = function(field, val){
          if (!editable) return '<span class="pill ' + (val ? "good" : "none") + '">' +
            (val ? "Yes" : "No") + '</span>';

      'In this version it carries <b>no score and no page</b> — it decides who sees what, nothing ' +
      'more. Supporting functions belong to no company: they serve all of them. ' +
      (soloUnits().length
        ? soloUnits().length + ' unit' + (soloUnits().length === 1 ? ' stands' : 's stand') +
          ' alone: ' + soloUnits().map(function(k){ return esc(UNITS[k].name); }).join(", ") + '.'

    section("", "Business units", null,
      '<div class="cfg"><table class="unitcfg"><thead><tr>' +
        '<th class="idx" style="width:38px">#</th><th style="width:18%">Unit</th>' +
        '<th style="width:14%">Shown in the nav</th>' +
        '<th class="cc" style="width:8%">Code</th>' +
        '<th class="cc" style="width:7%">Pillars</th><th class="cc" style="width:9%">Objectives</th>' +
        '<th class="cc" style="width:7%">Weight</th>' +
        '<th style="width:12%">Company</th>' +
        '<th class="cc" style="width:14%">BU head</th><th class="cc" style="width:15%">Strategy custodian</th>' +
        '<th class="cc" style="width:9%">Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (editable ? '<div class="addrow"><button class="editbtn" id="addunit">+ Add a business unit</button></div>' : ''));
}


/* The reward rule is a property of the cycle, not of each measure \u2014 set once,
   read by every focus measure. A stretch target per measure would mean the line
   is negotiated one row at a time, which is how a scheme stops being a scheme. */
function renderBandsExtra(){
  var can = grant("c_bands") === "edit";
  var rows =
    '<div class="cfg"><table><tbody>' +
      '<tr><td style="width:46%">Reward begins at</td><td>' +
        (can && EDITING.bands
          ? inputOr2(CYCLE.rewardAt + "%", "Reward threshold", function(v){
              var n = parseFloat(String(v).replace(/[^0-9.]/g, ""));
              if (!isNaN(n)) CYCLE.rewardAt = Math.max(1, Math.round(n));
            })
          : '<span class="mono val">' + CYCLE.rewardAt + '%</span>') +
        ' <span class="why" style="margin:0 0 0 8px;display:inline">of target</span></td></tr>' +
      '<tr><td>Marks locked</td><td>' +
        (can && EDITING.bands
          ? '<button class="rmbtn' + (CYCLE.locked ? ' on' : '') + '" data-lockcycle="1">' +
            (CYCLE.locked ? "Locked" : "Open") + '</button>'
          : '<span class="pill ' + (CYCLE.locked ? "none" : "good") + '">' +
            (CYCLE.locked ? "Locked" : "Open for marking") + '</span>') + '</td></tr>' +
    '</tbody></table></div>' +
    '<div class="note">At <b>100%</b> delivering the commitment earns. Set it higher and a ' +
      'measure can meet its target without clearing the reward line \u2014 a fourth standing, ' +
      '<i>met, not earning</i>, appears between short and earning. Either way the measure is ' +

var FSET = { unit:"mobile" };

/* `renderFocusSetup` was defined TWICE, and the first one — 56 lines that

/* ── Import ─────────────────────────────────────────────────────────

/* The reward rule is a property of the cycle, not of each measure \u2014 set once,

    '<div class="note">At <b>100%</b> delivering the commitment earns. Set it higher and a ' +
      'measure can meet its target without clearing the reward line \u2014 a fourth standing, ' +
      '<i>met, not earning</i>, appears between short and earning. Either way the measure is ' +

/* ── Setup · Focus measures ─────────────────────────────────────────
   Marking is a configuration act, not something to be done while reading a
   unit's page \u2014 a marking mode sitting in a reading view invites a stray click
   on a decision that carries money.

   Everything measurable in the unit is offered: its Key Objectives first, then
   each pillar's key measures, each with its target so the choice is made
   against the number rather than the name alone. */
var FSET = { unit:"mobile" };

function renderFocusSetup(){
  var editable = grant("c_focus") === "edit" && !CYCLE.locked;
  var u = UNITS[FSET.unit];

  var pick = function(m, src){
    var on = isFocus(m.id);
    return '<div class="pick ' + (on ? "on" : "off") + '">' +
      (editable
        ? '<button class="fmark-btn' + (on ? ' on' : '') + '" data-focus="' + m.id + '" ' +
          'aria-pressed="' + on + '" aria-label="' + (on ? "Unmark " : "Mark ") + esc(m.name) + '"></button>'
        : '<span class="fmark-btn' + (on ? ' on' : '') + '" style="cursor:default"></span>') +
      '<span>' + esc(m.name) + ' <span class="src">' + esc(src) + '</span></span>' +
      '<span class="num why" style="margin:0">target ' +
        (m.target ? esc(m.target) : '<span class="missing">Missing</span>') + '</span>' +
      '<span class="why" style="margin:0;min-width:74px;text-align:right">' +
        (on ? "marked" : (editable ? "click to mark" : "")) + '</span>' +
    '</div>';
  };

  var blocks =
    '<div class="grouphead">' + L("keyobj","bu") + '</div>' +
    (u.keyObjectives.length
      ? u.keyObjectives.map(function(m){ return pick(m, "objective"); }).join("")
      : '<div class="fstrip-empty">None set for this unit.</div>') +
    u.items.map(function(p, pi){
      return '<div class="grouphead">' + pillarCode(u, pi) + ' ' + esc(p.name) +
             ' &middot; ' + esc(p.kind).toLowerCase() + '</div>' +
        (p.measures.length
          ? p.measures.map(function(m){ return pick(m, ""); }).join("")
          : '<div class="fstrip-empty">No key measures.</div>');
    }).join("");

  var n = unitFocus(u).length;
  var unitPick = '<select class="fld" id="fset-unit">' + activeKeys().map(function(k){
      var c = unitFocus(UNITS[k]).length;
      return '<option value="' + k + '"' + (k === FSET.unit ? " selected" : "") + '>' +
        esc(UNITS[k].name) + (c ? "  \u2014 " + c + " marked" : "") + '</option>';
    }).join("") + '</select>';

  return '<div class="kv"><span class="pill kind">CEO &amp; SMO</span>' +
      '<span class="pill ' + (CYCLE.locked ? "none" : "good") + '">' +
        (CYCLE.locked ? "Locked for the cycle" : "Open for marking") + '</span>' +
      '<span class="pill kind">reward begins at ' + CYCLE.rewardAt + '%</span></div>' +
    section("", "Focus measures", null,
      '<div class="imp-row" style="margin:0 0 16px">' + unitPick +
        '<span class="cfg-lab">' + n + ' marked in ' + esc(u.name) + '</span></div>' +
      '<div class="cfg" style="padding:0">' + blocks + '</div>' +
      '<div class="note">Marks are stored against the cycle, not the measure \u2014 <b>every cycle ' +
        'starts unmarked</b>, so last year\'s emphasis cannot quietly become this year\'s. ' +
        'There is no cap: three is the usual choice and it stays a choice. ' +
        '<b>Focus changes no score</b>; it is a lens and an incentive, not a second weighting.</div>');
}

/* The scope is a business unit OR a capability (§16.4): capability projects
   arrive the way a unit's plan does — same page, same three steps, same
   review — with their own sheets, because the thing being planned is a
   project with deliverables, outcomes and milestones. */
function impIsCap(){ return String(IMP.unit).indexOf("cap:") === 0; }
function impCap(){ return capById(String(IMP.unit).replace(/^cap:/, "")); }

function renderImport(){
  var isCap = impIsCap();
  var u = isCap ? impCap() : UNITS[IMP.unit];
  var isPlan = IMP.kind === "plan";
  var d = IMP.diff;

  var unitPick = '<select class="fld" id="imp-unit">' +
    '<optgroup label="Business units">' + UNIT_KEYS.map(function(k){
      return '<option value="' + k + '"' + (k === IMP.unit ? " selected" : "") + '>' + esc(UNITS[k].name) + '</option>';
    }).join("") + '</optgroup>' +
    '<optgroup label="Capabilities">' + GROUP.capabilities.map(function(c){
      return '<option value="cap:' + c.id + '"' + ("cap:" + c.id === IMP.unit ? " selected" : "") + '>' +
        esc(c.name) + '</option>';
    }).join("") + '</optgroup></select>';

  var kindPick = '<span class="minisw">' +
    '<button data-impkind="plan" aria-pressed="' + isPlan + '">Plan</button>' +
    '<button data-impkind="progress" aria-pressed="' + !isPlan + '">Progress</button></span>';

  var counts;
  if (isCap) {
    var nd = 0, no = 0, nm = 0;
    u.projects.forEach(function(p){
      nd += p.deliverables.length; no += p.outcomes.length; nm += p.milestones.length;
    });
    counts = isPlan
      ? u.keyObjectives.length + " objectives &middot; " + u.projects.length + " projects &middot; " +
        nd + " deliverables &middot; " + no + " outcomes &middot; " + nm + " milestones"
      : capReported(u).total + " reportable rows";
  } else {
    counts = isPlan
      ? u.clauses.length + " clauses &middot; " + u.keyObjectives.length + " objectives &middot; " +
        u.items.length + " pillars &middot; " +
        u.items.reduce(function(a,p){ return a + p.measures.length; }, 0) + " measures &middot; " +
        u.items.reduce(function(a,p){ return a + p.tactics.length; }, 0) + " tactics"
      : u.items.reduce(function(a,p){ return a + p.measures.length + p.tactics.length; }, 0) + " reportable rows";
  }

  /* The plan template is GENERIC (§22): one file, whichever unit is being
     planned, with the unit chosen on its own Read me sheet. So the picker is
     not part of downloading a plan — it belongs to reporting, which is per
     unit and amends rows that already exist. */
  var step1 =
    '<div class="imp-step"><div class="imp-n">1</div><div class="imp-b">' +
      '<h4>Download the template</h4>' +
      '<p class="sub">' + (isPlan
        ? "The same file whichever unit you are planning. Choose the unit on its Read me sheet, fill it in Excel, and the platform assigns every code itself."
        : "One row per reportable item, with its target and what is currently recorded. Only the New value column is typed.") +
      '</p>' +
      '<div class="imp-row">' + (isPlan ? "" : unitPick) + kindPick +
        '<button class="editbtn" data-dlx="1">' +
          (isPlan ? "Download the plan template" : "Download Excel") + '</button>' +
        (isPlan
          ? '<button class="linkbu" data-dlxcap="1">Capability template</button>'
          : '<button class="linkbu" data-dl="1">or the raw CSV</button>' +
            '<button class="linkbu" data-showcsv="1">View the CSV</button>') +
      '</div>' +
      '<p class="sub" style="margin-top:8px">' + (isPlan
        ? UNIT_KEYS.filter(function(k){ return UNITS[k].active !== false; }).length +
          " business units and " + GROUP.themes.length + " themes are in its dropdowns"
        : counts) + '</p>' +
    '</div></div>';

  var step2 =
    '<div class="imp-step"><div class="imp-n">2</div><div class="imp-b">' +
      '<h4>Upload the filled file</h4>' +
      '<p class="sub">' + (isPlan
        ? "The file says which unit it is for, so there is nothing to select here. An upload <b>authors</b> that plan \u2014 the outgoing one is archived, not destroyed \u2014 and no other unit is touched."
        : "Fill the new_value column only where a figure changed. Blank rows are ignored.") + '</p>' +
      '<div class="imp-row"><input type="file" id="imp-file" accept=".xlsx,.csv">' +
        (isPlan ? "" : '<button class="linkbu" data-paste="1">or paste the file</button>') +
        (IMP.read ? '<span class="pill quiet">Read &middot; ' + esc(IMP.read) + '</span>' : '') +
      '</div>' +
    '</div></div>';

  var chk = IMP.check;
  var blocked = chk && chk.problems.length;
  var checkBlock = chk && (chk.problems.length || chk.notices.length)
    ? '<div class="imp-checks">' +
        chk.problems.map(function(x){
          return '<div class="chk bad"><span class="pill bad">Problem</span>' +
            '<b>' + esc(x.at) + '</b><span>' + esc(x.msg) + '</span></div>';
        }).join("") +
        chk.notices.map(function(x){
          return '<div class="chk note-c"><span class="pill attn">Notice</span>' +
            '<b>' + esc(x.at) + '</b><span>' + esc(x.msg) + '</span></div>';
        }).join("") +
      '</div>' +
      (blocked ? '<div class="note bad-note"><b>Nothing can be applied while a problem stands.</b> ' +
        'Data that loads badly is harder to find later than a file that refuses to load.</div>' : '')
    : '';

  /* The receipt. An apply that just makes the review vanish leaves the SMO
     with no proof anything happened except going to look \u2014 so the result is
     stated, with the way there. */
  var receipt = IMP.done
    ? '<div class="applied"><b>Applied to ' + esc(IMP.done.unit) + '.</b> ' + IMP.done.what +
      (IMP.done.fn
        ? ' <button class="linkbu" data-gofn="fn:' + esc(IMP.done.fn) + '">Open ' +
          esc(FUNCTIONS[IMP.done.fn] ? FUNCTIONS[IMP.done.fn].name : IMP.done.fn) + '</button>'
        : ' <button class="linkbu" data-gounit="' + IMP.done.key + '">Open ' + esc(IMP.done.unit) + '</button>') +
      '</div>'
    : '';

  var step3 = receipt;

  /* A plan upload is not a diff any more (§22). What is shown is the exchange:
     what the file holds, what it displaces, and what of that was reported —
     and then the one button that makes it happen. */
  if (isPlan && IMP.summary) {
    var sm = IMP.summary, inc = sm.incoming, cur = sm.current;
    var line = isCap
      ? inc.objectives + " objectives &middot; " + inc.projects + " projects &middot; " +
        inc.deliverables + " deliverables &middot; " + inc.outcomes + " outcomes &middot; " +
        inc.milestones + " milestones"
      : inc.clauses + " clauses &middot; " + inc.objectives + " objectives &middot; " +
        inc.pillars + " pillars &middot; " + inc.measures + " measures &middot; " +
        inc.tactics + " tactics" + (inc.swot ? " &middot; " + inc.swot + " SWOT points" : "");
    var had = isCap
      ? cur.objectives + " objectives &middot; " + cur.projects + " projects &middot; " +
        cur.deliverables + " deliverables &middot; " + cur.outcomes + " outcomes &middot; " +
        cur.milestones + " milestones"
      : cur.objectives + " objectives &middot; " + cur.pillars + " pillars &middot; " +
        cur.measures + " measures &middot; " + cur.tactics + " tactics";
    var hasPlan = !planIsEmpty(cur);

    step3 =
      '<div class="imp-step"><div class="imp-n">3</div><div class="imp-b">' +
        '<h4>Review, then apply</h4>' + checkBlock +
        '<div class="imp-tally">' +
          '<span class="pill kind">' + esc(u.name) + '</span>' +
          (hasPlan
            ? '<span class="pill attn">Replacing &mdash; the old plan is archived</span>'
            : '<span class="pill good">First plan &mdash; nothing to lose</span>') +
        '</div>' +
        '<div class="scroll"><table><thead><tr><th>What</th><th>Holds</th></tr></thead><tbody>' +
          '<tr><td><b>In this file</b></td><td>' + line + '</td></tr>' +
          '<tr><td>' + (hasPlan ? "Recorded now" : "Recorded now") + '</td><td>' +
            (hasPlan ? had : "nothing yet") + '</td></tr>' +
        '</tbody></table></div>' +
        (hasPlan
          ? '<div class="note"><b>' + esc(u.name) + '\u2019s current plan' +
            (cur.reported
              ? ' and its ' + cur.reported + ' reported figure' + (cur.reported === 1 ? '' : 's')
              : '') +
            ' come off the screen.</b> ' +
            (cur.reported
              ? 'They are kept as an archive dated today and can be restored from Archived plans at any time. '
              : 'It is kept as an archive dated today and can be restored from Archived plans at any time. ') +
            'Nothing is destroyed.</div>'
          : '') +
        '<div class="imp-row" style="margin-top:14px">' +
          (blocked
            ? '<button class="editbtn" disabled style="opacity:.45;cursor:not-allowed">Apply blocked</button>'
            : '<button class="editbtn apply" data-apply="1">' +
              (hasPlan ? "Replace " : "Write ") + esc(u.name) + '\u2019s plan</button>') +
          '<button class="linkbu" data-cancel="1">Discard</button></div>' +
      '</div></div>';
  } else if (d) {
    /* Reporting is unchanged: it amends figures that already exist, so it is
       still a difference against what is recorded. */
    var changed = d.rows.filter(function(r){ return r.status === "changed"; });
    var unknown = d.rows.filter(function(r){ return r.status === "unknown"; });
    var body = changed.length
        ? '<div class="scroll"><table><thead><tr><th>' + (isCap ? "Project" : L("pillar","bu")) + '</th><th>Item</th>' +
            '<th class="cc">Type</th><th class="cc">Recorded</th><th class="cc">In the file</th></tr></thead><tbody>' +
          changed.map(function(r){
            return '<tr><td>' + esc(r.pillar) + '</td><td>' + esc(r.name) + '</td>' +
              '<td class="cc"><span class="pill kind">' + r.type + '</span></td>' +
              '<td class="num was">' + esc(r.was) + '</td><td class="num now">' + esc(r.now) + '</td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="note">No reported figure differs from what is recorded.</div>';

    step3 =
      '<div class="imp-step"><div class="imp-n">3</div><div class="imp-b">' +
        '<h4>Review, then apply</h4>' + checkBlock +
        '<div class="imp-tally">' +
          '<span class="pill attn">' + changed.length + ' changed</span>' +
          (unknown.length ? '<span class="pill bad">' + unknown.length + ' unrecognised id</span>' : '') +
        '</div>' + body +
        (changed.length
          ? '<div class="imp-row" style="margin-top:14px">' +
            (blocked
              ? '<button class="editbtn" disabled style="opacity:.45;cursor:not-allowed">Apply blocked</button>'
              : '<button class="editbtn apply" data-apply="1">Apply to ' + esc(u.name) + '</button>') +
            '<button class="linkbu" data-cancel="1">Discard</button></div>'
          : '') +
      '</div></div>';
  }

  return '<div class="kv"><span class="pill kind">SMO only</span>' +
      '<span class="pill kind">' + (isPlan
        ? "One generic template &middot; one unit per file"
        : "One file per unit or capability") + '</span></div>' +
    section("", (isPlan ? "Plan" : "Progress") + " import", null,
      '<div class="imp">' + step1 + step2 + step3 + '</div>');
}

/* ── Manage · Archived plans (§22) ───────────────────────────────────
   Every plan an upload displaced, newest first, with what it held and a way
   back. This is what makes replacing a plan an ordinary act rather than a
   nervous one: an upload never deletes, and the proof is a list you can read.

   The only destructive control in the import flow is Delete, and it asks. */
function renderArchives(){
  var can = grant("c_import") === "edit";
  if (!ARCHIVES.length)
    return section("", "Archived plans",
      "A plan is archived here whenever an upload replaces one. Nothing has been replaced yet.",
      '<div class="note">Empty. Upload a plan on <b>Import</b> and the plan it displaces will ' +
      'appear here, with a way to put it back.</div>');

  var rows = ARCHIVES.map(function(a){
    var c = a.counts || {};
    var held = a.kind === "unit"
      ? [c.pillars + " pillars", c.measures + " measures", c.tactics + " tactics",
         c.objectives + " objectives"].join(" &middot; ")
      : [c.projects + " projects", c.deliverables + " deliverables",
         c.outcomes + " outcomes", c.milestones + " milestones"].join(" &middot; ");
    var live = a.kind === "unit" ? UNITS[a.key] : capById(a.key);
    return '<tr><td><b>' + esc(a.name) + '</b>' +
        (live ? '' : '<span class="why">no longer in the platform &mdash; cannot be restored</span>') +
        '</td>' +
      '<td class="cc">' + esc(a.at) + '</td>' +
      '<td>' + esc(a.by || "\u2014") + '<span class="why">' + esc(a.why || "") + '</span></td>' +
      '<td>' + held +
        (c.reported
          ? '<span class="why">' + c.reported + ' reported figure' + (c.reported === 1 ? '' : 's') + ' kept with it</span>'
          : '<span class="why">nothing reported</span>') + '</td>' +
      '<td class="cc">' + (can && live
        ? '<button class="editbtn" data-restore="' + esc(a.id) + '">Restore</button> ' +
          '<button class="rmbtn" data-forget="' + esc(a.id) + '">Delete</button>'
        : '<span class="pill none">View only</span>') + '</td></tr>';
  }).join("");

  return section("", "Archived plans",
    "Every plan an upload replaced, newest first. Restoring puts one back and archives whatever " +
    "is there now \u2014 the same act in reverse, with the same warning.",
    '<div class="cfg"><table><thead><tr>' +
      '<th style="width:22%">Plan</th><th class="cc" style="width:12%">Archived</th>' +
      '<th style="width:20%">Replaced by</th><th>What it held</th>' +
      '<th class="cc" style="width:16%"></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>');
}

/* ── Setup · Reporting cycle ────────────────────────────────────────
   Opening turns a plan into a request. Closing snapshots it, which is the
   only way the product ever acquires a past to compare against.

   The SMO can close with gaps: waiting for the last number means never
   closing, and a cycle that never closes writes no history. Unreported items
   close as unreported and stay visibly so \u2014 a stronger prompt than an email. */
function renderCycle(){
  var can = grant("c_cycle") === "edit";
  var open = REVIEW.state === "open";

  var rows = activeKeys().map(function(k){
    var u = UNITS[k], c = reportedCount(u), st = unitState(u);
    var r = UNIT_ROLES[k] || {};
    var who = personName(r.custodian) || personName(r.head) || "\u2014";
    var pctD = c.total ? Math.round(c.done / c.total * 100) : 0;
    var miss = missingNotes(u).length;
    var by = { obj:[0,0], mea:[0,0], tac:[0,0] };
    askedItems(u).forEach(function(x){
      var slot = x.kind === "objective" ? "obj" : x.kind === "measure" ? "mea" : "tac";
      by[slot][1]++;
      if (x.obj.actual != null && x.obj.actual !== "") by[slot][0]++;
    });
    return '<tr><td><b>' + esc(u.name) + '</b></td>' +
      '<td class="why" style="margin:0">' + esc(who) + '</td>' +
      '<td><div class="repcell"><span class="repbar' + (pctD < 100 ? " part" : "") + '">' +
        '<i style="width:' + pctD + '%"></i></span>' +
        '<span class="mono why" style="margin:0">' + c.done + '/' + c.total + '</span></div></td>' +
      '<td class="num">' + by.obj[0] + '/' + by.obj[1] + '</td>' +
      '<td class="num">' + by.mea[0] + '/' + by.mea[1] + '</td>' +
