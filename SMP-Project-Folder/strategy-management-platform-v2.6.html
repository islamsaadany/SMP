<title>Raya Trade — Strategy Management Platform</title>
<style>
  :root {
    --stone:#16325C; --stone-soft:#24487A; --gold:#C9A24D; --gold-deep:#A8842F;
    --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#EFF2F6;
    --line:#D6DCE5; --line-soft:#E6EAF0;
    --ink:#171B22; --ink-2:#414A58; --ink-3:#6B7583;
    --good:#2E7D5B; --attn:#B8860B; --warn:#CC6B3D; --bad:#B04434; --none:#8A9099;
    --good-bg:#E4F0EA; --attn-bg:#F7EFD6; --warn-bg:#FBEBE0; --bad-bg:#F7E3E0;
    --panel:#16325C; --panel-ink:#FFFFFF;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --r:2px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stone:#7FA3D8; --stone-soft:#5C82BC; --gold:#D9B665; --gold-deep:#C9A24D;
      --ground:#14161A; --surface:#1C2027; --surface-2:#242932;
      --line:#333A45; --line-soft:#2A303A;
      --ink:#E9ECF1; --ink-2:#B4BCC8; --ink-3:#868F9C;
      --good:#5FB68C; --attn:#D9B23C; --warn:#E1935F; --bad:#D97066; --none:#7B838F;
      --good-bg:#1B3129; --attn-bg:#332C16; --warn-bg:#33241A; --bad-bg:#33201E;
      --panel:#24487A; --panel-ink:#EAF0FA;
    }
  }
  :root[data-theme="dark"] {
    --stone:#7FA3D8; --stone-soft:#5C82BC; --gold:#D9B665; --gold-deep:#C9A24D;
    --ground:#14161A; --surface:#1C2027; --surface-2:#242932;
    --line:#333A45; --line-soft:#2A303A;
    --ink:#E9ECF1; --ink-2:#B4BCC8; --ink-3:#868F9C;
    --good:#5FB68C; --attn:#D9B23C; --warn:#E1935F; --bad:#D97066; --none:#7B838F;
    --good-bg:#1B3129; --attn-bg:#332C16; --warn-bg:#33241A; --bad-bg:#33201E;
    --panel:#24487A; --panel-ink:#EAF0FA;
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
         font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4 { margin:0; text-wrap:balance; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 24px 80px; }

  .banner { background:var(--panel); color:var(--panel-ink); padding:10px 24px; font-size:13px;
            display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:baseline; }
  .banner strong { color:var(--gold); font-weight:700; }

  header.top { border-bottom:1px solid var(--line); background:var(--surface); }
  .top-in { max-width:1180px; margin:0 auto; padding:18px 24px; display:flex;
            align-items:flex-end; gap:20px; flex-wrap:wrap; }
  .brand { display:flex; flex-direction:column; gap:2px; margin-right:auto; }
  .eyebrow { font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .brand h1 { font-family:var(--serif); font-size:26px; letter-spacing:-.01em; }
  .shapetag { font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
              color:var(--gold-deep); border:1px solid var(--gold); border-radius:99px; padding:4px 12px; }

  nav.units { background:var(--panel); }
  .units-in { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; gap:0; overflow-x:auto; }
  /* Was opacity .62, which put grey type on navy and made the row hard to read
     \u2014 a navigation button has to be legible first and quiet second. */
  .units button { font:inherit; font-size:14.5px; padding:13px 18px; border:0; background:none;
                  color:var(--panel-ink); opacity:.82; cursor:pointer; white-space:nowrap;
                  border-bottom:3px solid transparent; }
  .units button:hover { opacity:1; }
  .units button[aria-selected="true"] { opacity:1; font-weight:700; border-bottom-color:var(--gold); }
  .units button:focus-visible { outline:2px solid var(--gold); outline-offset:-4px; }
  .units .sep { width:1px; background:var(--panel-ink); opacity:.22; margin:10px 12px; flex:0 0 1px; }

  nav.tabs { border-bottom:1px solid var(--line); background:var(--surface); }
  .tabs-in { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; gap:2px; overflow-x:auto; }
  .tabs button { font:inherit; font-size:14px; padding:12px 15px; border:0; background:none;
                 color:var(--ink-3); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--gold); font-weight:600; }
  .tabs button:focus-visible { outline:2px solid var(--gold); outline-offset:-4px; }

  .view { padding-top:32px; }
  [hidden] { display:none !important; }

  .lede { max-width:66ch; color:var(--ink-2); margin:0 0 26px; }
  .lede strong { color:var(--ink); }
  h2.sec { font-family:var(--serif); font-size:21px; margin:36px 0 4px; padding-top:20px;
           border-top:1px solid var(--line-soft); }
  h2.sec.first { border-top:0; padding-top:0; margin-top:0; }
  .sec-note { color:var(--ink-3); font-size:13.5px; margin:0 0 18px; max-width:64ch; }

  .temple { display:flex; flex-direction:column; margin:4px 0 8px; }
  .roof { background:var(--panel); clip-path:polygon(50% 0,100% 100%,0 100%); height:70px; margin-bottom:-1px; }
  .architrave { background:var(--panel); color:var(--panel-ink); padding:18px 26px;
                font-family:var(--serif); font-size:18px; line-height:1.4; text-align:center; }
  .entablature { background:var(--surface-2); border-left:1px solid var(--line); border-right:1px solid var(--line);
                 padding:16px 18px; display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px 20px; }
  .ns-item { display:flex; flex-direction:column; gap:2px; }
  .ns-label { font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .ns-value { font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums; }
  .ns-value.pending { color:var(--none); font-style:italic; font-family:var(--sans); font-size:13.5px; }
  .pillars { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:16px 18px 0; }
  .pillar { background:var(--panel); color:var(--panel-ink); padding:20px 14px; text-align:center;
            min-height:104px; display:flex; flex-direction:column; justify-content:center; gap:6px; border-radius:var(--r); }
  .pillar b { font-family:var(--serif); font-size:16px; }
  .pillar span { font-size:11px; letter-spacing:.12em; color:var(--gold); font-weight:700; }
  .pillar em { font-size:12px; font-style:normal; opacity:.8; }
  .stylobate { margin-top:16px; padding:16px 18px 18px; border:1px solid var(--line);
               border-top:3px solid var(--gold); background:var(--surface); }
  .base-head { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
               font-weight:700; margin-bottom:12px; }
  .base-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; }
  .cap { background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--r);
         padding:10px 12px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:8px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; }
  .scores { display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:16px; margin:4px 0 8px; }
  .score-h { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
  .score-h h3 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700; }
  .big { font-family:var(--mono); font-size:40px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .big small { font-size:20px; }
  .big .vs { font-size:14px; color:var(--ink-3); font-family:var(--sans); letter-spacing:0; }
  .big.nodata { font-size:19px; color:var(--none); font-style:italic; font-family:var(--sans); }
  .sub { font-size:13px; color:var(--ink-2); margin-top:9px; }
  .sub b { font-variant-numeric:tabular-nums; }
  .track { height:9px; background:var(--surface-2); border-radius:99px; margin-top:12px; position:relative; }
  .track .fill { height:100%; border-radius:99px; }
  .track.empty { background:none; border:1px dashed var(--none); }
  .marker { position:absolute; top:-4px; width:2px; height:17px; background:var(--ink); }
  .marker::after { content:""; position:absolute; top:-4px; left:-3px; border-left:4px solid transparent;
                   border-right:4px solid transparent; border-top:5px solid var(--ink); }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3); margin-top:10px; }
  .legend span { display:flex; align-items:center; gap:6px; }
  .sw { width:11px; height:11px; border-radius:2px; display:inline-block; }
  .sw.dash { border:1px dashed var(--none); }
  .sw.line { width:2px; height:13px; border-radius:0; background:var(--ink); }

  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
          letter-spacing:.04em; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .pill.good { background:var(--good-bg); color:var(--good); }
  .pill.attn { background:var(--attn-bg); color:var(--attn); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .pill.none { color:var(--none); border:1px dashed var(--none); font-weight:600; }
  .pill.kind { background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
  .pill.theme { color:var(--gold-deep); border:1px solid var(--gold); }

  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:620px; }
  th,td { text-align:left; padding:10px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  thead th { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
             font-weight:700; background:var(--surface-2); white-space:nowrap; }
  tbody tr:last-child td { border-bottom:0; }
  td.num { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  td .why, .why { display:block; font-size:12px; color:var(--ink-3); margin-top:3px; }
  .qs { display:flex; gap:3px; }
  .qs i { width:20px; height:16px; border:1px solid var(--line); border-radius:1px; font-style:normal;
          font-size:9px; display:flex; align-items:center; justify-content:center; color:var(--ink-3); background:var(--surface); }
  .qs i.on { background:var(--panel); border-color:var(--panel); color:var(--panel-ink); }

  .fgrid { display:grid; grid-template-columns:1.35fr 1fr; gap:20px; align-items:start; }
  @media (max-width:820px) { .fgrid { grid-template-columns:1fr; } }
  .clause { display:grid; grid-template-columns:120px 1fr; gap:10px 14px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .clause:last-child { border-bottom:0; }
  .clause dt { font-weight:700; color:var(--stone); font-size:13.5px; }
  .clause dd { margin:0; font-family:var(--serif); font-size:15px; }
  .statement { font-family:var(--serif); font-size:16px; line-height:1.5; }
  ul.values { display:flex; flex-wrap:wrap; gap:7px; padding:0; margin:0; }
  ul.values li { list-style:none; background:var(--surface-2); border:1px solid var(--line-soft);
                 border-radius:var(--r); padding:6px 11px; font-size:13.5px; }

  .swot { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:760px) { .swot { grid-template-columns:1fr; } }
  .swot section { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:14px 16px; }
  .swot h3 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:9px; }
  .swot ul { margin:0; padding-left:18px; font-size:13.5px; }
  .swot li { margin-bottom:5px; }
  .swot section.s { border-top:3px solid var(--good); }
  .swot section.w { border-top:3px solid var(--bad); }
  .swot section.o { border-top:3px solid var(--stone-soft); }
  .swot section.t { border-top:3px solid var(--warn); }

  .note { border-left:3px solid var(--gold); background:var(--surface-2); padding:12px 16px;
          margin:18px 0; font-size:13.5px; color:var(--ink-2); border-radius:0 var(--r) var(--r) 0; }
  .note b { color:var(--ink); }
  .note code { font-family:var(--mono); font-size:12.5px; background:var(--surface);
               padding:1px 5px; border-radius:2px; border:1px solid var(--line-soft); }
  .kv { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  footer.end { margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-3); }

  /* Sub-nav: Performance is the regular view and is marked as such */
  .tabs button.primary { color:var(--gold-deep); font-weight:700; }
  .tabs button.primary[aria-selected="true"] { color:var(--ink); }
  .tabs button.primary::before {
    content:""; display:inline-block; width:7px; height:7px; border-radius:99px;
    background:var(--gold); margin-right:7px; vertical-align:middle;
  }

  .ns-group { grid-column:1/-1; border-top:1px solid var(--line); padding-top:12px; margin-top:2px; }
  .ns-group-h { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
                font-weight:700; display:block; margin-bottom:8px; }
  .ns-group-in { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px 20px; }

  .mono { font-family:var(--mono); }
  .linkbu { font:inherit; background:none; border:0; padding:0; cursor:pointer; color:var(--stone);
            text-decoration:underline; text-underline-offset:3px; text-align:left; }
  .linkbu:hover { color:var(--gold-deep); }
  .linkbu:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  /* Expandable item rows */
  .itemlist { display:flex; flex-direction:column; gap:9px; }
  details.item { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); }
  details.item[open] { border-color:var(--stone-soft); }
  details.item summary {
    list-style:none; cursor:pointer; padding:13px 16px; display:grid;
    grid-template-columns:34px minmax(150px,1fr) 88px 46px 110px 78px 78px 44px;
    gap:10px; align-items:center;
  }
  details.item summary::-webkit-details-marker { display:none; }
  details.item summary:hover { background:var(--surface-2); }
  details.item summary:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  .i-code { font-family:var(--mono); font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .i-name { font-weight:600; font-size:14.5px; }
  .i-owner { font-size:13px; color:var(--ink-2); }
  .i-sc { display:flex; flex-direction:column; line-height:1.15; text-align:right; }
  .i-sc b { font-family:var(--mono); font-size:16px; font-variant-numeric:tabular-nums; }
  .i-sc em { font-style:normal; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
  .i-var { font-family:var(--mono); font-size:14px; text-align:right; font-variant-numeric:tabular-nums; }
  details.item summary::after {
    content:"▸"; grid-column:1/-1; display:none;
  }
  .item-body { padding:4px 16px 18px; border-top:1px solid var(--line-soft); }
  h4.mini { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
            font-weight:700; margin:22px 0 9px; }
  @media (max-width:900px) {
    details.item summary { grid-template-columns:30px 1fr 70px 70px; }
    .i-owner, .i-var { display:none; }
  }

  /* Performance is the primary reading; execution sits beside it */
  .card.primary-card { border-color:var(--stone-soft); border-top:3px solid var(--stone-soft); }
  .score-h .rank { font-size:9.5px; letter-spacing:.1em; color:var(--gold-deep);
                   border:1px solid var(--gold); border-radius:99px; padding:1px 6px; margin-left:6px; }
  .i-sc.primary b { color:var(--stone); }

  /* ── Visual performance rows ─────────────────────────── */
  .chart { display:flex; flex-direction:column; gap:2px; border:1px solid var(--line);
           border-radius:var(--r); background:var(--surface); padding:6px 0; }
  .brow { display:grid; grid-template-columns:190px 1fr; gap:18px; align-items:center;
          padding:13px 18px; border-bottom:1px solid var(--line-soft); }
  .chart .brow:last-child { border-bottom:0; }
  .brow.total { background:var(--surface-2); }
  .brow-l { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .brow-l b { font-size:14.5px; }
  .brow-l button.linkbu { font-size:14.5px; font-weight:700; }
  .brow-l span { font-size:11.5px; color:var(--ink-3); }
  .brow-r { display:flex; flex-direction:column; gap:7px; min-width:0; }

  .bar { display:grid; grid-template-columns:74px 1fr 52px; gap:10px; align-items:center; }
  .bar > label { font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                 color:var(--ink-3); font-weight:700; text-align:right; }
  .bar-track { position:relative; height:16px; background:var(--surface-2);
               border-radius:2px; overflow:visible; }
  .bar-fill { height:100%; border-radius:2px; }
  .bar-val { font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums; font-weight:600; }
  .bar.sec .bar-track { height:11px; }
  .bar.sec .bar-val { font-size:13px; font-weight:400; color:var(--ink-2); }
  .bar-plan { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
  .bar-plan::after { content:attr(data-l); position:absolute; top:-15px; left:50%;
                     transform:translateX(-50%); font-size:9.5px; color:var(--ink-3);
                     font-family:var(--mono); white-space:nowrap; }
  .bar-none { font-size:12.5px; color:var(--none); font-style:italic; }

  .chart-legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px;
                  color:var(--ink-3); margin-top:11px; }
  .chart-legend span { display:flex; align-items:center; gap:6px; }

  /* Temple is for viewing, not performance */
  .entablature { padding:18px 22px; }
  .ns-item { gap:3px; padding:2px 0; }
  .ns-target { font-family:var(--mono); font-size:16px; font-variant-numeric:tabular-nums; color:var(--ink); }
  .ns-dir { font-size:11px; color:var(--ink-3); font-family:var(--mono); }
  .ko-head { grid-column:1/-1; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
             color:var(--ink-3); font-weight:700; margin-bottom:-4px; }
  .cap.plain { justify-content:flex-start; }

  /* ── Condensing sticky chrome ───────────────────────────
     ONE sticky container, nothing measured. `.chrome` wraps the header and
     both nav rows and is the only thing pinned (config.css); the rows inside
     it simply stack.

     They used to be pinned individually as well, at hardcoded offsets —
     nav.units at 58px, nav.tabs at 103px — read from --top-h and --units-h.
     Those two custom properties are set by group-shell.html, which is NOT the
     shell the platform is built from, so in the shipped file they never had a
     value and the fallbacks stood in. The header CONDENSES on scroll, so its
     real height left those offsets: the rows drifted out of register, page
     content showed through the seams between them, and the .18s transitions
     smeared it as you scrolled. Pinning the container and nothing else cannot
     drift, because there is only one offset and the browser owns it. */
  header.top { transition:padding .18s ease; }
  .top-in { padding:12px 24px; transition:padding .18s ease; }
  .brand h1 { font-size:22px; transition:font-size .18s ease; }
  .eyebrow { transition:opacity .18s ease, max-height .18s ease; overflow:hidden; max-height:20px; }
  body.scrolled .top-in { padding:6px 24px; }
  body.scrolled .brand h1 { font-size:16px; }
  body.scrolled .eyebrow { opacity:0; max-height:0; }
  body.scrolled .shapetag { font-size:10px; padding:2px 9px; }
  nav.units { position:relative; z-index:7; }
  nav.tabs  { position:relative; z-index:6; }
  body.scrolled nav.units button { padding:9px 18px; }
  body.scrolled .tabs button { padding:9px 15px; }
  .banner { font-size:12px; padding:7px 24px; }

  /* ── Circular gauges ──────────────────────────────────── */
  .gauges { display:grid; gap:14px; }
  .gauges.g3 { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .gauges.g4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px) { .gauges.g4 { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px) { .gauges.g4 { grid-template-columns:1fr; } }
  .gcard { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
           padding:18px 16px; display:flex; flex-direction:column; align-items:center; gap:11px; text-align:center; }
  .gcard.click { cursor:pointer; }
  .gcard.click:hover { border-color:var(--stone-soft); }
  .gcard.click:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .gauge { --p:0; --c:var(--none); width:108px; height:108px; border-radius:50%; position:relative;
           background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface-2) 0); flex:0 0 auto; }
  .gauge.sm { width:78px; height:78px; }
  .gauge::before { content:""; position:absolute; inset:11px; border-radius:50%; background:var(--surface); }
  .gauge.sm::before { inset:9px; }
  .gauge-in { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
              justify-content:center; gap:0; }
  .gauge-in b { font-family:var(--mono); font-size:23px; font-variant-numeric:tabular-nums; line-height:1; }
  .gauge.sm .gauge-in b { font-size:17px; }
  .gauge-in em { font-style:normal; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:3px; }
  .gname { font-size:15px; font-weight:700; }
  .gname button.linkbu { font-size:15px; font-weight:700; }
  .gsub { font-size:11.5px; color:var(--ink-3); }
  .gexec { display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-2);
           border-top:1px solid var(--line-soft); padding-top:10px; width:100%; justify-content:center; }
  .gexec b { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ── Hover notes ──────────────────────────────────────── */
  .tip { position:relative; display:inline-flex; align-items:center; justify-content:center;
         width:14px; height:14px; border-radius:50%; border:1px solid var(--ink-3);
         color:var(--ink-3); font-size:9px; font-weight:700; margin-left:5px; cursor:help; vertical-align:middle; }
  .tip::after {
    content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--ground); font-size:12px; font-weight:400; line-height:1.4;
    letter-spacing:0; text-transform:none; padding:9px 12px; border-radius:3px; width:255px;
    opacity:0; pointer-events:none; transition:opacity .13s; z-index:20; text-align:left;
  }
  .tip:hover::after, .tip:focus::after { opacity:1; }

  /* ── Enabler cards (temple base) ──────────────────────── */
  .base-grid { grid-template-columns:repeat(4,1fr); }
  @media (max-width:860px) { .base-grid { grid-template-columns:repeat(2,1fr); } }
  .cap { flex-direction:column; align-items:flex-start; gap:5px; text-align:left; }
  details.encard { border:1px solid var(--line-soft); border-radius:var(--r); background:var(--surface-2); }
  details.encard[open] { background:var(--surface); border-color:var(--stone-soft); }
  details.encard summary { list-style:none; cursor:pointer; padding:11px 13px; display:flex;
                           flex-direction:column; gap:4px; }
  details.encard summary::-webkit-details-marker { display:none; }
  details.encard summary:hover { background:var(--surface); }
  details.encard summary:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  details.encard summary b { font-size:13.5px; }
  details.encard summary span { font-size:11px; color:var(--ink-3); }
  .encard-body { padding:0 13px 13px; font-size:12.5px; color:var(--ink-2); }
  .encard-body p { margin:0 0 10px; }
  .encard-body ul { margin:0; padding-left:16px; }
  .encard-body li { margin-bottom:4px; }
  .encard-body .mono { font-size:12px; }

  /* ── Core values box ──────────────────────────────────── */
  .valbox { margin-top:20px; }
  .valgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  details.valcard { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); }
  details.valcard[open] { border-color:var(--gold); }
  details.valcard summary { list-style:none; cursor:pointer; padding:13px 15px;
                            font-family:var(--serif); font-size:16px; display:flex;
                            align-items:center; justify-content:space-between; gap:8px; }
  details.valcard summary::-webkit-details-marker { display:none; }
  details.valcard summary::after { content:"+"; font-family:var(--mono); color:var(--gold-deep); font-size:16px; }
  details.valcard[open] summary::after { content:"−"; }
  details.valcard summary:hover { background:var(--surface-2); }
  details.valcard summary:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  .valcard-body { padding:0 15px 14px; font-size:13.5px; color:var(--ink-2); }

  /* ── Temple entablature, fixed grid ───────────────────── */
  .entablature { grid-template-columns:repeat(3,1fr); gap:16px 26px; align-items:start; }
  @media (max-width:760px) { .entablature { grid-template-columns:repeat(2,1fr); } }
  .ns-label { min-height:2.3em; display:flex; align-items:flex-start; }
  .ns-group-in { grid-template-columns:repeat(3,1fr); gap:16px 26px; }
  @media (max-width:760px) { .ns-group-in { grid-template-columns:repeat(2,1fr); } }

  /* Health band legend */
  .bands { display:flex; gap:20px; flex-wrap:wrap; align-items:center; font-size:12.5px;
           color:var(--ink-2); background:var(--surface); border:1px solid var(--line);
           border-radius:var(--r); padding:11px 16px; margin:0 0 24px; }
  .bands b { font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
             color:var(--ink-3); font-weight:700; margin-right:2px; }
  .bands span { display:flex; align-items:center; gap:7px; }
  .bands i { width:13px; height:13px; border-radius:50%; display:inline-block; }
  .bands i.dash { border:1px dashed var(--none); background:none; }

  /* ── Section separation ───────────────────────────────── */
  .section { margin-top:46px; padding-top:26px; border-top:2px solid var(--stone-soft); }
  .section:first-of-type { margin-top:8px; padding-top:0; border-top:0; }
  .section-h { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:5px; }
  .section-h h2 { font-family:var(--serif); font-size:25px; letter-spacing:-.01em; }
  .section-h .eyebrow2 { font-size:10px; letter-spacing:.16em; text-transform:uppercase;
                         color:var(--gold-deep); font-weight:700; border:1px solid var(--gold);
                         border-radius:99px; padding:3px 10px; }
  .section > .sec-note { margin-bottom:20px; max-width:70ch; }

  /* ── Weighting configuration ──────────────────────────── */
  .cfg { overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); }
  .cfg table { min-width:760px; }
  .cfg .fw { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .cfg input { font:inherit; font-family:var(--mono); font-size:13px; width:78px; padding:5px 8px;
               border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
               color:var(--ink); text-align:right; }
  .cfg input:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .cfg input[readonly] { background:var(--surface-2); color:var(--ink-3); }
  .cfg tfoot td { background:var(--surface-2); font-weight:700; }
  .factor-h { display:flex; flex-direction:column; gap:2px; }
  .factor-h b { font-size:13px; }
  .factor-h span { font-size:11px; color:var(--ink-3); font-weight:400; text-transform:none; letter-spacing:0; }
  .qual { display:inline-flex; gap:3px; }
  .qual i { width:15px; height:15px; border-radius:2px; border:1px solid var(--line);
            display:inline-block; font-style:normal; }
  .qual i.on { background:var(--stone-soft); border-color:var(--stone-soft); }

  /* ── Expandable cards: name at top, drill-down below ──── */
  details.gcard { display:block; padding:0; }
  details.gcard > summary { list-style:none; cursor:pointer; padding:16px 16px 18px;
                            display:flex; flex-direction:column; align-items:center; gap:11px; }
  details.gcard > summary::-webkit-details-marker { display:none; }
  details.gcard > summary:hover { background:var(--surface-2); }
  details.gcard > summary:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  details.gcard[open] { border-color:var(--stone-soft); }
  .ghead { width:100%; text-align:center; padding-bottom:10px; border-bottom:1px solid var(--line-soft); }
  .ghead .gname { font-size:16px; }
  .gmore { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--gold-deep);
           font-weight:700; }
  details.gcard[open] .gmore::before { content:"− "; }
  details.gcard:not([open]) .gmore::before { content:"+ "; }
  .gbody { padding:0 16px 16px; border-top:1px solid var(--line-soft); }
  .gbody h4.mini { margin-top:14px; }

  details.card { display:block; }
  details.card > summary { list-style:none; cursor:pointer; }
  details.card > summary::-webkit-details-marker { display:none; }
  details.card > summary:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  details.card .cardmore { font-size:11px; letter-spacing:.09em; text-transform:uppercase;
                           color:var(--gold-deep); font-weight:700; margin-top:12px; display:block; }
  details.card[open] .cardmore::before { content:"− "; }
  details.card:not([open]) .cardmore::before { content:"+ "; }
  .card-drill { margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }

  /* ── Modal ────────────────────────────────────────────── */
  .overlay { position:fixed; inset:0; background:rgba(10,14,20,.55); z-index:100;
             display:flex; align-items:center; justify-content:center; padding:28px;
             opacity:0; pointer-events:none; transition:opacity .15s; }
  .overlay.on { opacity:1; pointer-events:auto; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:3px;
           width:min(940px,100%); max-height:88vh; display:flex; flex-direction:column;
           box-shadow:0 24px 60px rgba(0,0,0,.28); }
  .modal-h { display:flex; align-items:flex-start; gap:16px; padding:20px 24px 16px;
             border-bottom:1px solid var(--line); }
  .modal-h div { flex:1; min-width:0; }
  .modal-h h3 { font-family:var(--serif); font-size:21px; }
  .modal-h p { margin:4px 0 0; font-size:13px; color:var(--ink-3); }
  .modal-x { font:inherit; font-size:22px; line-height:1; background:none; border:0; cursor:pointer;
             color:var(--ink-3); padding:2px 8px; border-radius:2px; }
  .modal-x:hover { background:var(--surface-2); color:var(--ink); }
  .modal-x:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .modal-b { padding:20px 24px 24px; overflow-y:auto; }
  .modal-b table { min-width:0; width:100%; }
  .modal-b .scroll { border:1px solid var(--line-soft); }
  .modal-b h4.mini:first-child { margin-top:0; }
  @media (max-width:640px) { .overlay { padding:0; } .modal { max-height:100vh; border-radius:0; } }

  /* ── Split metric boxes inside a card ─────────────────── */
  .gcard { padding:0; }
  .card-head { padding:15px 16px 13px; border-bottom:1px solid var(--line-soft); text-align:center; width:100%; }
  .card-head .gname { font-size:16px; }
  .metrics { display:grid; grid-template-columns:1fr 1fr; }
  .metric { padding:16px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:9px; }
  .metric + .metric { border-left:1px solid var(--line-soft); }
  .metric > label { font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
                    color:var(--ink-3); font-weight:700; }
  .metric .plan { font-size:11.5px; color:var(--ink-3); font-family:var(--mono);
                  font-variant-numeric:tabular-nums; }
  .plusbtn { font:inherit; font-family:var(--mono); font-size:15px; line-height:1; width:26px; height:26px;
             border:1px solid var(--line); border-radius:50%; background:var(--surface);
             color:var(--gold-deep); cursor:pointer; }
  .plusbtn:hover { border-color:var(--gold); background:var(--attn-bg); }
  .plusbtn:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .metric .none-note { font-size:11.5px; color:var(--none); font-style:italic; }

  /* ── Editable impact score ────────────────────────────── */
  .qual { display:inline-flex; gap:3px; }
  .qual button { width:22px; height:22px; border-radius:2px; border:1px solid var(--line);
                 background:var(--surface); cursor:pointer; padding:0; font:inherit; font-size:11px;
                 color:var(--ink-3); font-family:var(--mono); }
  .qual button.on { background:var(--stone-soft); border-color:var(--stone-soft); color:#fff; }
  .qual button:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .edithint { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
              color:var(--gold-deep); font-weight:700; }

  /* ── v6 card: Objectives 2/3 with the dial, Execution 1/3 as figures ── */
  .two { display:grid; grid-template-columns:2fr 1fr; }
  .gcard .card-head { background:var(--panel); color:var(--panel-ink);
                      padding:13px 16px 12px; border-bottom:0; text-align:center; width:100%; }
  .gcard .card-head .gname { font-size:16px; font-weight:700; color:var(--panel-ink); }
  .gcard .card-head .gname button.linkbu { color:var(--panel-ink);
                      text-decoration-color:rgba(255,255,255,.45); font-size:16px; }
  .gcard .card-head .gname button.linkbu:hover { color:var(--gold); }
  .gcard .card-head .gsub { font-size:11.5px; color:var(--panel-ink); opacity:.72; }
  .gcard .card-head .pill.theme { color:var(--gold); border-color:var(--gold); }

  .box-obj, .box-exec { display:flex; flex-direction:column; align-items:center; padding-top:16px; }
  .box-obj { gap:11px; padding-bottom:20px; padding-left:14px; padding-right:14px; }
  .box-exec { gap:2px; padding-bottom:16px; padding-left:10px; padding-right:10px;
              border-left:1px solid var(--line-soft); }

  .boxlabel { display:flex; align-items:center; justify-content:center; gap:6px;
              height:20px; margin-bottom:2px; }
  .boxlabel > span { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
                     color:var(--ink-3); font-weight:700; }
  .box-exec .boxlabel > span { font-size:9.5px; letter-spacing:.12em; }
  .boxlabel .plusbtn { width:19px; height:19px; font-size:12px; line-height:1;
                       opacity:0; transition:opacity .12s ease; }
  .box-obj:hover .boxlabel .plusbtn,
  .box-exec:hover .boxlabel .plusbtn,
  .boxlabel .plusbtn:focus-visible { opacity:1; }

  .box-obj .gauge { width:130px; height:130px; }
  .box-obj .gauge::before { inset:13px; }
  .box-obj .gauge-in b { font-size:28px; }

  .ratio { font-family:var(--mono); font-size:26px; line-height:1.1; color:var(--ink);
           font-variant-numeric:tabular-nums; letter-spacing:-.01em; font-weight:600; margin-top:6px; }
  .ratio small { font-size:13px; color:var(--ink); }
  .ratio-l { font-size:9px; letter-spacing:.1em; text-transform:uppercase;
             color:var(--ink-3); font-weight:700; }
  dl.led { margin:11px 0 3px; display:grid; grid-template-columns:auto auto;
           gap:3px 10px; font-size:11.5px; width:100%; }
  dl.led dt { color:var(--ink-2); }
  dl.led dd { margin:0; font-family:var(--mono); font-size:12.5px; font-weight:600;
              font-variant-numeric:tabular-nums; text-align:right; color:var(--ink); }
  dl.led dd.varv { font-weight:700; }

  .gauges.g4 .box-obj .gauge { width:110px; height:110px; }
  .gauges.g4 .box-obj .gauge::before { inset:11px; }
  .gauges.g4 .box-obj .gauge-in b { font-size:24px; }
  .gauges.g4 .ratio { font-size:22px; }

  @media (max-width:520px) {
    .two { grid-template-columns:1fr; }
    .box-exec { border-left:0; border-top:1px solid var(--line-soft); }
  }

  /* ── Fixes: centred label, centred glyph, section numbering ─────── */
  /* Three-column label row: an empty cell mirrors the button so the word
     stays centred in the box whether or not the button is visible. */
  .boxlabel { display:grid; grid-template-columns:19px 1fr 19px; gap:6px;
              align-items:center; width:100%; height:20px; margin-bottom:2px; }
  .boxlabel::before { content:""; }
  .boxlabel > span { grid-column:2; text-align:center; }
  .boxlabel .plusbtn { grid-column:3; }

  .plusbtn { display:inline-flex; align-items:center; justify-content:center;
             padding:0; line-height:1; font-family:var(--sans); font-weight:700; }
  .boxlabel .plusbtn { width:19px; height:19px; font-size:11px; }

  /* Section number leads the title */
  .section-h { align-items:baseline; gap:11px; }
  .section-n { font-family:var(--mono); font-size:12px; font-weight:700;
               letter-spacing:.04em; color:var(--gold-deep); border:1px solid var(--gold);
               border-radius:99px; padding:3px 11px; white-space:nowrap; }

  /* ── Temple: themes span the full width of the temple ───────────── */
  .pillars { padding:16px 0 0; gap:0; grid-template-columns:repeat(3,1fr); }
  .pillar { border-radius:0; margin:0; }
  .pillar + .pillar { border-left:2px solid var(--ground); }

  /* ── Weighting: collapsed, and fits without horizontal scroll ───── */
  details.cfgwrap { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); }
  details.cfgwrap[open] { border-color:var(--stone-soft); }
  details.cfgwrap > summary { list-style:none; cursor:pointer; padding:16px 20px;
                              display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  details.cfgwrap > summary::-webkit-details-marker { display:none; }
  details.cfgwrap > summary:hover { background:var(--surface-2); }
  details.cfgwrap > summary:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  .cfg-sum { display:flex; gap:20px; flex-wrap:wrap; align-items:baseline; flex:1; }
  .cfg-sum b { font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
               color:var(--ink-3); font-weight:700; }
  .cfg-sum span { font-size:14px; }
  .cfg-sum span em { font-style:normal; font-family:var(--mono); font-weight:700;
                     font-variant-numeric:tabular-nums; }
  .editbtn { font:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
             font-weight:700; color:var(--gold-deep); background:none;
             border:1px solid var(--gold); border-radius:99px; padding:6px 15px; cursor:pointer; }
  .editbtn:hover { background:var(--attn-bg); }
  details.cfgwrap[open] .editbtn::after { content:" \2014 close"; }
  .cfg-body { padding:0 20px 20px; border-top:1px solid var(--line-soft); }

  .cfg { overflow:visible; border:0; }
  .cfg table { min-width:0; width:100%; table-layout:fixed; font-size:12.5px; }
  .cfg th, .cfg td { padding:9px 8px; }
  .cfg th:first-child, .cfg td:first-child { width:15%; }
  .cfg th:last-child, .cfg td:last-child { width:15%; }
  .cfg input { width:100%; max-width:82px; font-size:12.5px; padding:4px 7px; }
  .cfg .factor-h b { font-size:11.5px; }
  .cfg .factor-h span { font-size:10px; line-height:1.3; }
  .cfg .why { font-size:10.5px; line-height:1.35; }
  .qual button { width:20px; height:20px; font-size:10px; }

  /* ── The rail ────────────────────────────────────────────────────────
     A list that does not scroll away, beside the one thing you are reading.
     It replaces the accordion wherever a page is a set of siblings worked
     through one at a time: a capability's projects, and a unit's directions
     and capabilities. The selected row keeps its place when the tab changes,
     because it is visible \u2014 so it is what you would expect rather than
     hidden state. */
  .split { display:grid; grid-template-columns:236px 1fr; gap:16px; align-items:start; }
  .rail { border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
    overflow:hidden; position:sticky; top:12px; }
  .rail .rhead { background:var(--panel); color:var(--panel-ink); font-size:10.5px;
    letter-spacing:.09em; text-transform:uppercase; font-weight:700; padding:9px 14px;
    display:flex; justify-content:space-between; gap:8px; }
  .rail .rhead span { color:rgba(255,255,255,.65); font-weight:400; }
  .rail .rgroup { background:var(--surface-2); border-bottom:1px solid var(--line-soft);
    padding:6px 14px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); font-weight:700; }
  .rail button.ritem { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
    width:100%; text-align:left; font:inherit; color:inherit; background:none;
    padding:11px 14px 11px 11px; border:0; border-bottom:1px solid var(--line-soft);
    border-left:3px solid transparent; cursor:pointer; }
  .rail button.ritem:last-of-type { border-bottom:0; }
  .rail button.ritem:hover { background:var(--zebra); }
  .rail .ritem b { font-size:13px; font-weight:500; line-height:1.35; }
  .rail .ritem .rsub { grid-column:1/-1; font-size:11px; color:var(--ink-3); margin-top:2px; }
  .rail .ritem .rnum { font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:13px; color:var(--ink-3); }
  .rail button.ritem.on { background:var(--surface-2); border-left-color:var(--gold); }
  .rail .ritem.on b { font-weight:700; }
  .rail .ritem.on .rnum { color:var(--ink); }
  .rail .rfoot { padding:9px 14px; border-top:1px solid var(--line); background:var(--surface-2);
    font-size:11.5px; color:var(--ink-3); }
  .pane { border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
    padding:16px 18px 20px; }
  .pane .ptitle { display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    flex-wrap:wrap; padding-bottom:12px; border-bottom:1px solid var(--line-soft); }
  .pane .ptitle h3 { font:400 19px/1.25 var(--serif); margin:0; }
  .pane .ptitle .pmeta { color:var(--ink-3); font-size:12.5px; margin-top:3px; }
  .planonly { font-size:12.5px; color:var(--ink-3); margin:10px 0 0; }
  .planonly b { color:var(--gold-deep); letter-spacing:.09em; text-transform:uppercase;
    font-size:10.5px; }
  @media (max-width:820px){
    .split { grid-template-columns:1fr; }
    .rail { position:static; display:flex; overflow-x:auto; }
    .rail .rhead, .rail .rfoot, .rail .rgroup { display:none; }
    .rail button.ritem { border-bottom:3px solid transparent; border-left:0; white-space:nowrap;
      grid-template-columns:auto auto; }
    .rail button.ritem.on { border-left-color:transparent; border-bottom-color:var(--gold); }
    .rail .ritem .rsub { display:none; }
  }

  /* The Report section in the third row. Gold while a cycle is asking for
     something; ordinary once it has been given. */
  #secrow-in button.appear { color:var(--gold-deep); font-weight:700; }
  #secrow-in button.appear[aria-selected="true"] { border-bottom-color:var(--gold); }
  #secrow-in button.quiet .pill { margin-left:6px; }

  /* Reordering inside the rail. The handle sits before the name; the row still
     clicks to select, so the two gestures never compete. */
  .rail button.ritem { position:relative; }
  .rail.arranging button.ritem { grid-template-columns:auto 1fr auto; }
  .rail.arranging .grip { align-self:center; }

  /* ── Viewer switcher ─────────────────────────────────────────────── */
  .viewer { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .viewer label { font-size:10px; letter-spacing:.13em; text-transform:uppercase;
                  color:var(--ink-3); font-weight:700; }
  .viewer select { font:inherit; font-size:13px; padding:5px 9px; border:1px solid var(--line);
                   border-radius:var(--r); background:var(--surface); color:var(--ink); max-width:250px; }
  .viewer select:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .viewer-note { font-size:11px; color:var(--gold-deep); font-weight:700;
                 letter-spacing:.06em; text-transform:uppercase; }
  body.scrolled .viewer label { display:none; }

  /* ── Access matrix ───────────────────────────────────────────────── */
  .acgrid table { table-layout:auto; }
  .acgrid th.ac, .acgrid td.ac { text-align:center; width:auto; }
  .acgrid tr.grouprow td { background:var(--panel); color:var(--panel-ink);
                           font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
                           font-weight:700; padding:7px 13px; }
  .st { display:inline-block; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
        font-weight:700; padding:3px 9px; border-radius:99px; font-style:normal; }
  .st-none { color:var(--none); border:1px dashed var(--none); }
  .st-view { color:var(--stone); background:var(--surface-2); border:1px solid var(--line); }
  .st-edit { color:var(--gold-deep); background:var(--attn-bg); border:1px solid var(--gold); }
  .stset { display:inline-flex; gap:2px; }
  .stbtn { width:26px; height:24px; border:1px solid var(--line); background:var(--surface);
           color:var(--ink-3); cursor:pointer; font-size:11px; padding:0; border-radius:2px;
           font-family:var(--sans); line-height:1; }
  .stbtn:first-child { border-radius:2px 0 0 2px; }
  .stbtn:last-child { border-radius:0 2px 2px 0; }
  .stbtn:hover { background:var(--surface-2); }
  .stbtn:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .stbtn.on.none { background:var(--none); border-color:var(--none); color:var(--surface); }
  .stbtn.on.view { background:var(--stone); border-color:var(--stone); color:#fff; }
  .stbtn.on.edit { background:var(--gold-deep); border-color:var(--gold-deep); color:#fff; }

  .chart-legend i.st { margin-right:2px; }

  /* ── Factor editor ───────────────────────────────────────────────── */
  .rmbtn { font:inherit; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
           font-weight:700; color:var(--bad); background:none; border:1px solid var(--line);
           border-radius:99px; padding:4px 11px; cursor:pointer; }
  .rmbtn:hover { background:var(--bad-bg); border-color:var(--bad); }
  .rmbtn:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .addrow { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .addrow .why { margin:0; }
  b.overload { color:var(--bad); }
  .note.bad-note { border-left-color:var(--bad); background:var(--bad-bg); }

  /* Config tables breathe more than data tables — these are settings, read
     slowly and one row at a time, not scanned for a number. */
  .cfg td .why { margin-top:4px; }
  .cfg input.lbl, .cfg input.lvl { width:100%; max-width:none; text-align:left;
                                    font-family:var(--sans); font-size:13px; }
  .cfg input.fwt, .cfg input.kow { width:64px; max-width:64px; }

  /* ── Chrome: one sticky container, nothing measured ─────────────── */
  .chrome { position:sticky; top:0; z-index:9; }
  header.top { position:static; }
  nav.units, nav.tabs { position:static; }

  /* ── Section heading: the numeral leads, no badge ───────────────── */
  .section-n { font-family:var(--serif); font-size:34px; line-height:1; color:var(--gold);
               border:0; border-radius:0; padding:0; letter-spacing:0; }
  .section-h { gap:14px; }

  /* ── Pillar list: a table that expands ─────────────────────────── */
  .plist { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); }
  .pheadwrap { position:sticky; top:var(--chrome-h,118px); z-index:5; }
  .phead, .prow, .ptotal { display:grid; gap:12px; align-items:center; padding:12px 16px; }
  .phead { background:var(--surface-2); border-bottom:1px solid var(--line);
           font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
           color:var(--ink-3); font-weight:700; padding-top:9px; padding-bottom:9px; }
  .prow { width:100%; text-align:left; font:inherit; color:inherit; background:none;
          border:0; border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .prow:hover { background:var(--surface-2); }
  .prow:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  .prow[aria-expanded="true"] { background:var(--surface-2); }
  .pname { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .pname b { font-size:14.5px; font-weight:600; }
  .pname .psub { font-size:11.5px; color:var(--ink-3); font-weight:400; }
  .powner { font-size:12.5px; color:var(--ink-2); }
  .prow .num, .ptotal .num, .phead .num { text-align:right;
        font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .phead .num { font-family:var(--sans); }
  .prow .num.lead { font-weight:700; font-size:15px; }
  .chev { color:var(--ink-3); font-size:12px; transition:transform .15s ease; text-align:center; }
  .prow[aria-expanded="true"] .chev { transform:rotate(90deg); }
  .ptotal { background:var(--panel); color:var(--panel-ink); font-weight:700; }
  .ptotal .num { color:var(--panel-ink); }
  .ptotal .tsub { display:block; font-size:11px; font-weight:400; opacity:.75; }
  .pbody { padding:8px 16px 22px; border-bottom:1px solid var(--line-soft); background:var(--surface); }
  .pbody[hidden] { display:none; }

  /* ── Compact score pair ────────────────────────────────────────── */
  .card.tight { padding:14px 16px 13px; }
  .card.tight .score-h { margin-bottom:6px; }
  .headline { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .headline .big { font-size:31px; }
  .headline .ofplan { font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
                      color:var(--ink-3); font-weight:700; margin:0 0 5px; }
  .minirow { display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
             margin-top:11px; padding-top:10px; border-top:1px solid var(--line-soft); }
  .minirow div { display:flex; flex-direction:column; gap:1px; }
  .minirow em { font-style:normal; font-size:9.5px; letter-spacing:.09em;
                text-transform:uppercase; color:var(--ink-3); font-weight:700; }
  .minirow b { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px; }

  /* ── Tables: name left, figures centred, conclusion coloured ───── */
  th.cc, td.cc { text-align:center; }
  td.num, th.num.cc { text-align:center; }
  .pbody td.num, .pbody th.cc { text-align:center; }
  th.idx, td.idx { width:38px; text-align:center; font-family:var(--mono);
                   font-variant-numeric:tabular-nums; color:var(--ink-3); font-size:12px; }
  td.final { font-weight:700; font-size:14px; }
  .pair { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pair b { font-weight:700; }
  .pbody .qs { justify-content:flex-start; }

  @media (max-width:900px) {
    .phead { display:none; }
    .prow, .ptotal { grid-template-columns:1fr 74px 60px 18px !important; }
    .prow > span:nth-child(2), .prow > span:nth-child(3), .powner { display:none; }
    .ptotal > span:nth-child(2), .ptotal > span:nth-child(3), .ptotal > span:nth-child(4) { display:none; }
  }

  /* ── Configuration: read-only until Edit is pressed ─────────────── */
  .cfgwrap.open { border:1px solid var(--line); border-radius:var(--r);
                  background:var(--surface); }
  .cfg-bar { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
             padding:14px 18px; border-bottom:1px solid var(--line-soft); }
  .cfg-bar.plain { border:1px solid var(--line); border-bottom:0;
                   border-radius:var(--r) var(--r) 0 0; background:var(--surface); }
  .cfg-bar .cfg-sum { flex:1; margin:0; }
  .cfg-lab { flex:1; font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
             color:var(--ink-3); font-weight:700; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:50%;
            margin-right:9px; vertical-align:baseline; }
  .cfg input.blabel { width:100%; max-width:none; text-align:left;
                      font-family:var(--sans); font-size:13px; }
  .cfg input.bfloor { width:64px; max-width:64px; }
  .qual.static i { width:20px; height:20px; border:1px solid var(--line); border-radius:2px;
                   display:inline-flex; align-items:center; justify-content:center;
                   font-style:normal; font-size:10px; font-family:var(--mono);
                   color:var(--ink-3); background:var(--surface); }
  .qual.static i.on { background:var(--stone-soft); border-color:var(--stone-soft); color:#fff; }
  .cfg .val { display:inline-block; padding:4px 0; font-size:13px; }

  /* ── Drag handle ────────────────────────────────────────────────────
     The handle is the only drag target, so opening a pillar and moving it are
     never confused with one another. */
  .grip { display:inline-flex; flex-direction:column; justify-content:center; gap:3px;
          width:20px; height:26px; padding:0 5px; cursor:grab; touch-action:none;
          border-radius:2px; opacity:.55; transition:opacity .12s ease; }
  .grip i { display:block; height:2px; background:var(--ink-3); border-radius:1px; }
  .prow:hover .grip, tr:hover .grip, .grip:focus-visible { opacity:1; }
  .grip:hover { background:var(--surface-2); }
  .grip:active { cursor:grabbing; }
  .grip:focus-visible { outline:2px solid var(--gold); outline-offset:1px; opacity:1; }
  .grip-off { display:inline-block; width:20px; }

  .prow.arrangeable { align-items:center; }
  .prow.static { display:grid; gap:12px; padding:14px 16px;
                 border-bottom:1px solid var(--line-soft); background:var(--surface); }
  .prow.static:last-child { border-bottom:0; }
  .prow-wrap { display:block; }

  .dragging { opacity:.9; background:var(--attn-bg) !important;
              box-shadow:0 6px 18px rgba(0,0,0,.14); position:relative; z-index:3; }
  tr.dragging td { background:var(--attn-bg); }
  .sorting { cursor:grabbing; }
  .sorting .prow, .sorting tr { transition:transform .12s ease; }

  /* The number doubles as the handle's home, so reordering costs no column. */
  td.idx { white-space:nowrap; }
  td.idx .grip { vertical-align:middle; margin-right:2px; height:18px; }
  td.idx .idx-n { display:inline-block; min-width:14px; }

  /* Arrange mode reads as a distinct state, so nobody drags a row believing
     they are in the normal view. */
  .plist.arranging { border-color:var(--gold); }
  .plist.arranging .phead { background:var(--attn-bg); }
  .editbtn[data-arrange] { white-space:nowrap; }

  /* The drill sits on the headline row, so it costs no height. It replaces the
     hover note: a modal explains and shows the breakdown in one place, and
     works on touch, which a hover note never did. */
  .drill { font:inherit; font-size:12px; background:none; border:0; padding:0;
           margin-left:auto; color:var(--stone); cursor:pointer;
           text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
  .drill:hover { color:var(--gold-deep); }
  .drill:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  nav.tabs.sectionrow { background:var(--surface-2); border-bottom:1px solid var(--line); }
  nav.tabs.sectionrow button[aria-selected="true"] { border-bottom-color:var(--stone-soft); }
  .gwrap { display:block; }
  .gwrap .card-head { position:relative; }
  .gwrap .card-head .grip { position:absolute; left:8px; top:50%; transform:translateY(-50%); opacity:.75; }
  .gwrap .card-head .grip i { background:var(--panel-ink); }
  .gauges.sorting .gwrap { transition:transform .12s ease; }
  .gwrap.dragging { opacity:.92; box-shadow:0 8px 22px rgba(0,0,0,.2); }

  /* Foundation and analysis in edit: the field replaces the text in place, so
     the page keeps its shape and nothing moves when the mode changes. */
  .fld { font:inherit; font-size:14px; width:100%; padding:6px 9px; resize:vertical;
         border:1px solid var(--line); border-radius:var(--r);
         background:var(--surface); color:var(--ink); font-family:var(--sans); }
  .fld:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .big-field { font-family:var(--serif); font-size:15px; }
  .swot .fld { font-size:13px; }
  td.horizon { color:var(--ink-3); }
  td.annual  { font-weight:700; }
  th.cc + th.cc { white-space:nowrap; }

  /* Ten units will not fit one line at every width. Wrapping keeps every unit
     reachable; a horizontal scroll hides the last one behind a gesture nobody
     is told about. */
  .units-in { flex-wrap:wrap; overflow-x:visible; }
  .units button { padding:11px 14px; }
  body.scrolled .units button { padding:8px 14px; }
  .units .sep { margin:8px 8px; }

  /* The card was designed three-up and its execution box needs that width —
     at four across the labels truncate. Ten units become four rows rather than
     three, which the section tabs have already paid for. */
  .gauges.g3 { grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); }

  .arrangebar { display:flex; justify-content:flex-end; margin:-10px 0 20px; }

  /* ── Narrow cards ──────────────────────────────────────────────────
     Both grids now auto-fit, so a card can be 255px wide in either. The
     compact sizing that capabilities were given when they were designed
     four-across has to apply to any narrow card, not to one grid class. */
  .gauges .box-obj .gauge { width:112px; height:112px; }
  .gauges .box-obj .gauge::before { inset:12px; }
  .gauges .box-obj .gauge-in b { font-size:25px; }
  .gauges .ratio { font-size:24px; }
  .box-obj { padding-left:8px; padding-right:8px; }
  .box-exec { padding-left:8px; padding-right:8px; }
  dl.led { grid-template-columns:minmax(0,1fr) auto; gap:3px 10px; font-size:11.5px; }
  dl.led dt { white-space:nowrap; }
  dl.led dd { font-size:12.5px; }
  .gcard .card-head .gsub { font-size:11px; }

  /* Grid tracks default to min-width:auto, so a track never shrinks below its
     content and the card is pushed open from the inside. Clamping with
     minmax(0,·) is what actually stops the overflow — the font sizes above
     only delayed it. */
  .two { grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
  .box-obj, .box-exec { min-width:0; }
  .gcard, .gwrap { min-width:0; }
  .gauges { min-width:0; }

  /* The label row reserves a mirrored gutter so the word stays centred whether
     or not the button is showing. At 73px those fixed 19px gutters no longer
     fit, so they become flexible and the button overlays the right gutter
     instead of demanding its own track. */
  .boxlabel { grid-template-columns:minmax(0,19px) minmax(0,1fr) minmax(0,19px); }
  .boxlabel .plusbtn { justify-self:end; }
  .box-exec .boxlabel > span { font-size:9px; letter-spacing:.08em; }

  /* Capabilities were four-up from the start and truncated their labels there
     too — it simply never showed until the units grid made it obvious. Same
     minimum, so a card is the same card wherever it appears. */
  .gauges.g4 { grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); }
  .gauges.g4 .box-obj .gauge { width:112px; height:112px; }
  .gauges.g4 .box-obj .gauge::before { inset:12px; }
  .gauges.g4 .box-obj .gauge-in b { font-size:25px; }
  .gauges.g4 .ratio { font-size:24px; }

  /* ── Foundation: the aspiration card holds the objectives box ────── */
  .fgrid { grid-template-columns:1.05fr 1fr; }
  .fcol { display:flex; flex-direction:column; gap:20px; }
  .cardhead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:2px; }
  .cardhead h2.sec { margin:0; }
  .pill.horizon { color:var(--gold-deep); border:1px solid var(--gold); background:none; }
  .horizon-f { font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700;
               color:var(--ink-3); display:inline-flex; align-items:center; gap:8px; }
  .horizon-f input.yr { width:78px; text-align:center; }
  .divide { border-top:1px solid var(--line-soft); margin:18px 0 14px; }
  .boxhead { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .boxlab { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
            color:var(--ink-3); font-weight:700; }
  .minisw { display:inline-flex; margin-left:auto; border:1px solid var(--line);
            border-radius:var(--r); overflow:hidden; }
  .minisw button { font:inherit; font-size:11px; line-height:1; padding:5px 9px; border:0;
                   cursor:pointer; background:var(--surface); color:var(--ink-3);
                   border-right:1px solid var(--line); }
  .minisw button:last-child { border-right:0; }
  .minisw button[aria-pressed="true"] { background:var(--stone-soft); color:#fff; }
  .minisw button:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }

  .ohead { display:grid; grid-template-columns:minmax(0,1fr) 96px 96px; gap:14px;
           padding-bottom:8px; border-bottom:1px solid var(--line); font-size:10px;
           letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700; }
  .ohead span:not(:first-child) { text-align:right; }
  .orow { display:grid; grid-template-columns:minmax(0,1fr) 96px 96px; gap:14px;
          align-items:baseline; padding:10px 0; border-bottom:1px solid var(--line-soft); }
  .orow:last-child { border-bottom:0; }
  .orow .on { font-size:14.5px; }
  .orow .ot { font-family:var(--mono); font-variant-numeric:tabular-nums;
              text-align:right; font-size:14px; }
  .orow .ot.h { color:var(--ink-3); font-size:13px; }

  .ochips { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
  .ochip { border:1px solid var(--line); border-radius:var(--r); padding:11px 13px;
           background:var(--surface-2); min-width:0; }
  .ochip b { display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; }
  .ochip .v { font-family:var(--mono); font-size:17px; font-variant-numeric:tabular-nums; }
  .ochip .h { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:2px; }

  .fld.mono { font-family:var(--mono); text-align:center; }
  select.fld { padding:5px 8px; }

  /* Info sits in the chrome, apart from anything that changes data. */
  .infobtn { font:inherit; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
             font-weight:700; color:var(--ink-3); background:none;
             border:1px solid var(--line); border-radius:99px; padding:5px 14px; cursor:pointer; }
  .infobtn:hover { border-color:var(--stone-soft); color:var(--ink); }
  .infobtn:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  /* A bare action above the columns, replacing the labelled bar. */
  .pageact { display:flex; justify-content:flex-end; margin:0 0 16px; }

  /* Arrange rides in the legend row rather than a row of its own. */
  .bands { justify-content:flex-start; }
  .bands-act { margin-left:auto; display:inline-flex; }
  .bands-act .editbtn { padding:5px 14px; }

  /* Info holds the top-right corner on every page. The tenant tag moves into
     the brand block so nothing can wrap between the two and displace it. */
  .brand { gap:4px; }
  .brand .shapetag { align-self:flex-start; margin-top:3px; }
  .top-in > .infobtn { margin-left:4px; align-self:center; }
  body.scrolled .brand .shapetag { display:none; }

  /* 5. The rule above a section heading and the gap it sat in. A section is
     already announced by its heading; the line was doing the job twice. */
  .section { margin-top:26px; padding-top:0; border-top:0; }
  .section:first-of-type { margin-top:14px; }
  .view { padding-top:22px; }

  /* Retired units stay listed and stay legible — greyed, not hidden, so the
     record of what once existed is still readable. */
  tr.retired td { opacity:.5; }
  tr.retired td.idx { opacity:.35; }
  .rmbtn.on { color:var(--good); border-color:var(--good); }
  .cfg td .why.mono { font-size:10.5px; letter-spacing:.02em; }
  th.wcol { line-height:1.25; }
  .why-f { margin-top:6px; font-size:12px; }

  /* The units table is edited, not scanned, so its fields need room to show
     what they hold. Fixed column widths stop the name box collapsing when a
     dropdown beside it grows. */
  .cfg table.unitcfg { table-layout:fixed; }
  .cfg .unitcfg input.fld { text-align:left; font-family:var(--sans); }
  .cfg .unitcfg select.fld { min-width:100%; max-width:none; }
  .cfg .unitcfg td { vertical-align:middle; }
  .cfg .unitcfg input.fld { max-width:none; width:100%; }

  /* A tooltip inherits white-space from its cell. Inside a table header, where
     nowrap keeps column titles on one line, the tooltip inherited it too and
     ran off the edge as a single line. It sets its own wrapping. */
  .tip::after { white-space:normal; text-transform:none; letter-spacing:0;
                font-weight:400; width:min(320px,70vw); }

  /* A tooltip on the last column would open past the right edge, so tips near
     an edge anchor to it instead of centring on the icon. */
  th:last-child .tip::after, td:last-child .tip::after {
    left:auto; right:0; transform:none;
  }

  /* ── Import ─────────────────────────────────────────────────────── */
  .imp { display:flex; flex-direction:column; gap:0; }
  .imp-step { display:grid; grid-template-columns:34px 1fr; gap:16px;
              padding:20px 0; border-bottom:1px solid var(--line-soft); }
  .imp-step:last-child { border-bottom:0; }
  .imp-n { width:28px; height:28px; border-radius:50%; background:var(--panel);
           color:var(--panel-ink); font-family:var(--mono); font-size:13px;
           display:flex; align-items:center; justify-content:center; }
  .imp-b h4 { margin:0 0 4px; font-family:var(--serif); font-size:18px; }
  .imp-b .sub { margin:0; max-width:74ch; }
  .imp-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; }
  .imp-row select.fld { width:auto; min-width:190px; max-width:none; }
  .imp-row input[type=file] { font:inherit; font-size:13px; }
  .imp-tally { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 14px; }
  .csvbox { width:100%; height:340px; font-family:var(--mono); font-size:12px;
            line-height:1.5; padding:12px; border:1px solid var(--line);
            border-radius:var(--r); background:var(--surface-2); color:var(--ink);
            white-space:pre; overflow:auto; }
  td.was { color:var(--ink-3); text-decoration:line-through; }
  td.now { color:var(--ink); font-weight:600; }
  .editbtn.apply { border-color:var(--good); color:var(--good); }
  .editbtn.apply:hover { background:var(--good-bg); }

  /* Three states, and the first two were too close to tell apart: a quarter
     the tactic runs in but which has not arrived looked almost identical to a
     quarter it does not run in at all. A marked quarter is now tinted and
     bordered whether or not it has passed; only the fill separates past from
     ahead. */
  .qs i { border-style:dashed; border-color:var(--line); color:var(--none);
          background:none; font-weight:400; }
  .qs i.on { background:var(--attn-bg); border:1px solid var(--stone-soft);
             color:var(--stone); font-weight:700; }
  .qs i.on.past { background:var(--panel); border-color:var(--panel);
                  color:var(--panel-ink); font-weight:700; }
  tr.notdue td { opacity:.62; }
  .endin { margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .endin .boxlab { display:block; margin-bottom:6px; }
  .endin .statement { font-size:15px; }
  .minirow .sub-n { font-size:9.5px; color:var(--ink-3); letter-spacing:.06em;
                    text-transform:uppercase; font-weight:700; margin-top:2px; }

  .imp-checks { display:flex; flex-direction:column; gap:6px; margin:0 0 14px; }
  .chk { display:grid; grid-template-columns:88px 1fr; gap:10px; align-items:baseline;
         padding:8px 12px; border-radius:var(--r); font-size:13px; }
  .chk.bad { background:var(--bad-bg); }
  .chk.note-c { background:var(--attn-bg); }
  .chk b { font-weight:600; }
  .chk span:last-child { grid-column:2; color:var(--ink-2); font-size:12.5px; }
  .chk b + span { display:block; }
  .rowacts { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .confirm { display:flex; flex-direction:column; gap:5px; align-items:center;
             background:var(--bad-bg); border-radius:var(--r); padding:8px 10px; }
  .confirm b { font-size:11.5px; color:var(--bad); }
  .big .nodata { color:var(--none); font-family:var(--sans); font-size:19px; font-style:italic; }

  /* The code is a reference, not part of the name it sits beside. */
  .pcode { color:var(--ink-3); font-weight:400; font-family:var(--mono);
           font-size:12.5px; letter-spacing:.02em; margin-right:2px; }

  /* A target nobody set is worth noticing \u2014 it silently removes a measure
     from the score. */
  .missing { color:var(--bad); font-style:italic; font-family:var(--sans);
             font-size:12.5px; font-weight:400; }
  .ochip .h .missing { font-size:11.5px; }

  /* SWOT points are numbered so they can be referred to in a review; the
     numbers stay quiet so they never compete with the text. */
  .swotlist { list-style:none; margin:0; padding:0; }
  .swotlist li { display:grid; grid-template-columns:22px 1fr; gap:8px;
                 align-items:baseline; padding:5px 0; font-size:13.5px; }
  .swot-n { font-family:var(--mono); font-size:11.5px; color:var(--none);
            font-variant-numeric:tabular-nums; }

  /* Temple editing: tables, with the statements in labelled rows above them. */
  .templeedit h4.mini:first-child { margin-top:0; }
  .tcard { background:var(--surface); border:1px solid var(--line);
           border-radius:var(--r); padding:14px 16px; }
  .trow { display:grid; grid-template-columns:120px 1fr; gap:14px;
          align-items:start; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .trow:last-child { border-bottom:0; }
  .trow > label { font-size:11px; letter-spacing:.09em; text-transform:uppercase;
                  color:var(--ink-3); font-weight:700; padding-top:7px; }
  .trow .fld { width:100%; max-width:none; }
  .trow input.yr { max-width:90px; }
  .cfg .fld { width:100%; max-width:none; text-align:left; }
  .cfg .fld.mono { text-align:center; }

  .masterbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
               border:1px solid var(--line); border-radius:var(--r);
               background:var(--surface); padding:12px 16px; margin:0 0 18px; }
  .masterbar .cfg-lab { flex:1; }
  .editbtn.danger { color:var(--bad); border-color:var(--bad); }
  .editbtn.danger:hover { background:var(--bad-bg); }
  .confirm.row { flex-direction:row; align-items:center; flex-wrap:wrap; gap:10px; }
  .confirm.row .why { max-width:46ch; }

  .applied { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
             background:var(--good-bg); border:1px solid var(--good);
             border-radius:var(--r); padding:12px 16px; margin:0 0 16px;
             font-size:13.5px; }

  /* ── Focus measures ─────────────────────────────────────────────── */
  .fmark{display:inline-block;width:7px;height:7px;background:var(--gold);
    transform:rotate(45deg);margin-left:8px;vertical-align:middle;flex:none}
  .fmark-btn{width:11px;height:11px;padding:0;margin-left:8px;background:none;
    border:1.5px solid var(--line);transform:rotate(45deg);cursor:pointer;
    vertical-align:middle;border-radius:1px}
  .fmark-btn.on{background:var(--gold);border-color:var(--gold-deep)}
  .fmark-btn:hover{border-color:var(--gold-deep)}
  .fmark-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  tr.focusrow td:first-child{box-shadow:inset 3px 0 0 var(--gold)}

  .fstrip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    margin:0 0 22px;overflow:hidden}
  .fstrip-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--surface-2);border-bottom:1px solid var(--line);padding:12px 18px}
  .fstrip-t{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    font-weight:700;color:var(--ink-2)}
  .fstrip-meta{color:var(--ink-3);font-size:12px;margin-right:auto}
  .fstrip-body{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:16px 18px 14px}
  .fcount{display:flex;align-items:baseline;gap:6px;font-family:var(--serif)}
  .fcount b{font-size:30px;font-weight:400;color:var(--good)}
  .fcount span{font-size:19px;color:var(--ink-3)}
  .fcount em{font-style:normal;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);font-family:var(--sans);font-weight:700;margin-left:8px}
  .fchips{display:flex;gap:7px;flex-wrap:wrap}
  .fmean{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
  .fstrip-empty{padding:16px 18px;color:var(--ink-3);font-size:13px}
  .fstrip .cfg{border-top:1px solid var(--line-soft)}
  .fstrip .cfg table{border:0}

  .badge{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.06em;
    text-transform:uppercase;padding:5px 9px;border-radius:20px;white-space:nowrap}
  .b-over{background:#FBF6E9;color:var(--gold-deep);border:1px solid #E8D9AE}
  .b-met{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .b-short{background:var(--bad-bg);color:var(--bad)}
  .b-none{background:var(--surface-2);color:var(--none)}
  .board tbody tr.alt td{background:var(--surface-2)}
  .board tbody tr.unitstart td{border-top:1px solid var(--line)}
  .board tbody tr:first-child td{border-top:0}
  .board td.unitcell{vertical-align:top;padding-top:14px}

  /* The focus panel is closed until asked for: it is a lens on a few measures,
     not the unit's headline. */
  details.fstrip > summary{list-style:none;cursor:pointer}
  details.fstrip > summary::-webkit-details-marker{display:none}
  .fstrip-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .fstrip-head::after{content:"▸";margin-left:4px;color:var(--ink-3);font-size:11px;
    transition:transform .15s ease}
  details.fstrip[open] > summary .fstrip-head::after,
  details.fstrip[open] > summary::after{transform:rotate(90deg)}
  .fstrip-sum{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .fstrip-sum b{color:var(--good);font-size:15px}
  .fstrip-meta{margin-left:auto}
  .fstrip .fstrip-body{padding:12px 18px 10px}
  .fstrip .fmean{margin:0;font-size:12px}
  .cfg .pick{display:grid;grid-template-columns:26px 1fr auto 90px;gap:14px;align-items:center;
    padding:10px 16px;border-bottom:1px solid var(--line-soft)}
  .cfg .pick .src{font-size:11px;color:var(--ink-3)}

  /* ── Reporting ──────────────────────────────────────────────────── */
  .rep-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px}
  .kpi{display:flex;align-items:baseline;gap:8px}
  .kpi b{font:400 26px/1 var(--serif)}
  .kpi span{color:var(--ink-3);font-size:12.5px}
  /* Named repbar, not bar: .bar is already a three-column grid component in
     group-extra.css, and reusing it turned this fill into a grid track. */
  .repbar{display:block;height:6px;background:var(--surface-2);border-radius:20px;
    overflow:hidden;flex:1;min-width:120px;max-width:260px}
  .repbar i{display:block;height:100%;background:var(--good)}
  .repbar.part i{background:var(--attn)}
  .rep-bar .why{margin-left:auto}
  input.field{font:inherit;font-family:var(--mono);font-size:13px;padding:6px 10px;width:104px;
    border:1px solid var(--line);border-radius:var(--r);text-align:right;background:var(--surface);
    color:var(--ink)}
  input.field.filled{border-color:var(--good);background:var(--good-bg)}
  input.field:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .notefld{width:100%;max-width:none;text-align:left;font-size:13px}
  .notefld.needed{border-color:var(--bad);background:var(--bad-bg)}
  tr.wantnote td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .bad-note{border-left:3px solid var(--bad);background:var(--bad-bg)}
  .repcell{display:flex;align-items:center;gap:10px}
  .repcell .repbar{max-width:none}
  .delta{font-family:var(--mono);font-size:12px;margin-left:10px;font-weight:600;
    vertical-align:middle;letter-spacing:.02em}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)}
  .headline .delta{align-self:center}

  /* Reporting reuses the pillar accordion so the two pages read as one product,
     but its row carries how much is done rather than a score \u2014 that is what
     the person filling it in wants to know at a glance. */
  .prow.rprow{grid-template-columns:1fr 90px 26px}
  .rtally{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);
    background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  .rtally.full{color:var(--good);background:var(--good-bg);border-color:var(--good)}
  .prow.rprow .chev{color:var(--ink-3);font-size:11px;transition:transform .15s ease}
  .prow.rprow[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .notecol{width:30%}
  .notecol .notefld{width:100%}

  /* The reported box states its unit rather than asking for it to be typed. */
  .entry{display:inline-flex;align-items:stretch;border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;background:var(--surface)}
  .entry.filled{border-color:var(--good)}
  .entry.filled .field{background:var(--good-bg)}
  .entry .field{border:0;width:78px;border-radius:0}
  .entry .field:focus-visible{outline:none}
  .entry:focus-within{outline:2px solid var(--gold);outline-offset:1px}
  .unitsuf{display:flex;align-items:center;padding:0 9px;background:var(--surface-2);
    border-left:1px solid var(--line);font-family:var(--mono);font-size:12px;
    color:var(--ink-3);white-space:nowrap}
  .phead.rphead,.prow.rprow{grid-template-columns:1fr 110px 84px 84px 78px 20px;gap:14px}
  .phead.rphead .num{text-align:right}
  .phead.rphead .cc{text-align:center}

  /* ── Table headers, dark ──────────────────────────────────────────
     Navy ground, white type. A column header is a label for what sits under
     it, and at this weight it reads as one band rather than as a first row of
     data. Applied to every table and to the grid headers that behave like
     one — the pillar lists and the grouped lists in Setup — so no screen has
     two different ideas of what a header looks like. */
  thead th, table thead th, .cfg table thead th, .scroll table thead th{
    background:var(--panel) !important; color:var(--panel-ink) !important; border-bottom:0}
  thead th .tip{color:rgba(255,255,255,.72);border-color:rgba(255,255,255,.45)}
  thead th .tip:hover{color:#fff;border-color:#fff}
  .phead, .plist .phead{background:var(--panel) !important; color:var(--panel-ink) !important;
    border-bottom:0}
  .phead span, .phead > *{color:var(--panel-ink)}
  .phead .tip{color:rgba(255,255,255,.72);border-color:rgba(255,255,255,.45)}
  .grouphead{background:var(--panel) !important; color:var(--panel-ink) !important; border-bottom:0}
  /* Arrange mode still has to be visible against the dark band. */
  .plist.arranging .phead{background:var(--gold-deep);color:#fff}



  /* Expand or collapse every panel, beside the first column header. */
  .phead .hfirst{display:inline-flex;align-items:center;gap:9px}
  .foldall{background:none;border:0;padding:0;cursor:pointer;line-height:0;
