<title>Copilot Clip Spacing</title>
<style>
:root{--ground:#F7F8FA;--surface:#FFFFFF;--line:#D6DCE5;--ink:#171B22;--ink-2:#414A58;--gold-deep:#8A6B22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#14161A;--surface:#1C2027;--line:#333A45;--ink:#E9ECF1;--ink-2:#B4BCC8;--gold-deep:#E6C65C;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#14161A;--surface:#1C2027;--line:#333A45;--ink:#E9ECF1;--ink-2:#B4BCC8;--gold-deep:#E6C65C;color-scheme:dark}
body{background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;margin:0;padding-inline:16px}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;margin:0}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tag{font:700 11px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep)}
img{display:block;width:100%;border:1px solid var(--line);border-radius:6px}
p{margin:0;color:var(--ink-2)}
</style>
<div class="wrap">
  <h1>The paperclip under the Copilot box</h1>
  <section class="frame"><span class="tag">Today</span><img src="before.png" alt="Paperclip touching the box, with a deeper gap below it">
    <p>The clip sits right against the box, with 16px of empty space under it — 38px from the box to the edge.</p></section>
  <section class="frame"><span class="tag">Proposed</span><img src="after.png" alt="Paperclip centred in a shorter space below the box">
    <p>The clip sits in the middle of the space (4px above, 4px below), and the space shrinks to 30px. Nothing else moves.</p></section>
</div>
