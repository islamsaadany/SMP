<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copilot Layout Concept</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--ground:#F7F8FA;--surface:#FFFFFF;--surface-2:#EFF2F6;--line:#D6DCE5;--ink:#171B22;--ink-2:#414A58;--ink-3:#636C79;--gold:#8A6720;--goldfill:#C9A24D;--panel:#111417;--nav:#16325C;--panel-ink:#FFFFFF;--panel-quiet:#A9B1BC;--warnbg:#FBF1DE;--goodbg:#E6F2EA;--good:#2E6B45;--shade:rgba(10,20,40,.28);--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#14161A;--surface:#1C1F25;--surface-2:#23272E;--line:#333A45;--ink:#E9ECF1;--ink-2:#B4BCC8;--ink-3:#949DAA;--gold:#D9B665;--goldfill:#D9B665;--panel:#0B0D10;--nav:#0E2A4F;--panel-ink:#EAF0FA;--panel-quiet:#9FB0C8;--warnbg:#2E2717;--goodbg:#1C2E23;--good:#8FCBA4;--shade:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--ground:#14161A;--surface:#1C1F25;--surface-2:#23272E;--line:#333A45;--ink:#E9ECF1;--ink-2:#B4BCC8;--ink-3:#949DAA;--gold:#D9B665;--goldfill:#D9B665;--panel:#0B0D10;--nav:#0E2A4F;--panel-ink:#EAF0FA;--panel-quiet:#9FB0C8;--warnbg:#2E2717;--goodbg:#1C2E23;--good:#8FCBA4;--shade:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}

/* ── the mockup's own controls ── */
.ctl{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.ctl > b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--nav);color:var(--panel-ink)}
.ctl .say{color:var(--ink-3);flex:1 1 280px;font-size:12.5px}
.viewport{padding:16px;display:flex;justify-content:center}
.scaler{transform-origin:top left}
.stage{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 2px 14px rgba(0,0,0,.06)}
.full .viewport{padding:0;display:block}.full .scaler{width:100%}.full .stage{border:0;border-radius:0;box-shadow:none}

/* ── the platform frame ── */
.app{container-type:inline-size;display:flex;flex-direction:column;height:820px;position:relative;background:var(--surface)}
.full .app{height:var(--apph,calc(100vh - 49px))}
.top{background:var(--panel);color:var(--panel-quiet);display:flex;gap:16px;padding:9px 16px;font-size:13px;align-items:center;flex:none}
.top b{color:var(--panel-ink)}
.top .pill{background:#2A2F36;color:var(--panel-ink);border-radius:6px;padding:2px 9px}
.tabs{display:flex;gap:20px;padding:8px 16px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2);flex:none}
.tabs span{padding-bottom:7px}.tabs .on{color:var(--ink);font-weight:700;border-bottom:2px solid var(--goldfill)}
.areas{display:flex;gap:4px;padding:7px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.area{border:0;background:none;font-size:12.5px;padding:4px 10px;border-radius:5px;color:var(--ink-2);white-space:nowrap}
.area[aria-pressed="true"]{background:var(--nav);color:var(--panel-ink);font-weight:600}
.body{flex:1 1 auto;min-height:0;display:flex}

/* zone 1 · chats: open, or folded to the strip */
.rail{flex:none;width:248px;border-right:1px solid var(--line);background:var(--surface-2);padding:12px;font-size:13px;overflow:auto}
.strip{flex:none;width:44px;border-right:1px solid var(--line);background:var(--surface-2);display:none;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.ib{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;background:var(--surface);font-size:14px;line-height:1}
.app.railfold .rail{display:none}.app.railfold .strip{display:flex}
.rh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.rh span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.rh .fold{border:0;background:none;color:var(--ink-3);font-size:15px;padding:0 4px}
.new{font:600 11.5px/1.2 var(--sans);border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;text-transform:uppercase;letter-spacing:.04em}
.ri{padding:6px 8px;border-radius:5px;color:var(--ink-2);display:flex;flex-direction:column}
.ri.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.ri small{font-weight:400;color:var(--ink-3);font-size:11.5px}

/* zone 2 · the conversation: 740 by default, resizable when a result is open */
.chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;border-right:1px solid transparent}
/* 776 = a 740px reading column plus its padding; on a smaller screen the
   default gives way first, so the result keeps 400px and the to-do its 200 */
.app.hasout .chat{flex:0 0 var(--chatw,min(776px,calc(100cqw - 444px)));max-width:calc(100cqw - 444px)}
.app.hasout.hastodo .chat{flex-basis:var(--chatw,min(776px,calc(100cqw - 644px)));max-width:calc(100cqw - 644px)}
.chead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.chead b{font-size:13.5px}
.chead .prog{margin-left:auto}
.feed{flex:1 1 auto;overflow-y:auto;padding:14px 18px 6px}
.col{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.who{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:3px}
.who.me{align-self:flex-end}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14.5px;line-height:1.6}
.msg.ai{border-left:3px solid var(--goldfill)}
.msg.me{align-self:flex-end;background:var(--surface-2);max-width:80%}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;background:var(--surface)}
.compose{flex:none;padding:6px 18px 14px}
.box{max-width:740px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:7px 7px 7px 14px;display:flex;align-items:center;gap:8px}
.box input{flex:1 1 auto;border:0;outline:0;background:transparent;font:14.5px var(--sans);color:var(--ink);min-width:0}
.send{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:var(--nav);color:var(--panel-ink);display:grid;place-items:center}

/* the handle between conversation and result */
.grip{flex:none;width:9px;margin:0 -4px;z-index:2;cursor:col-resize;display:none;position:relative;touch-action:none}
.grip::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line)}
.grip:hover::after,.grip.drag::after{width:3px;left:3px;background:var(--goldfill)}
.app.hasout .grip{display:block}

/* zone 3 · the result: the area's work, or a free chat's draft */
.out{flex:1 1 auto;min-width:0;display:none;flex-direction:column;background:var(--surface-2)}
.app.hasout .out{display:flex}
.ohead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;background:var(--surface)}
.ohead b{font-size:13.5px}
.ohead .chip{display:none;margin-left:auto}
.ohead .x{display:none;border:0;background:none;font-size:18px;color:var(--ink-3);padding:0 4px}
.obody{flex:1 1 auto;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.ofoot{flex:none;display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap;align-items:center}
.ofoot .k{margin-right:auto;color:var(--ink-3);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font:600 12.5px/1.2 var(--sans)}
.btn.pri{background:var(--nav);color:var(--panel-ink);border-color:var(--nav)}
.btn.gold{background:var(--warnbg);border-color:var(--goldfill);color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card.wide{grid-column:1/-1}
.card.now{border-left:3px solid var(--goldfill);background:var(--warnbg)}
.card h4{margin:0 0 4px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.card h4 small{font-weight:600;color:var(--ink-3);font-size:11px}
.card.now h4 small{color:var(--gold)}
.card p{margin:0;color:var(--ink-2)}
.card p.e{color:var(--ink-3);font-style:italic}
.card ul{margin:2px 0 0;padding-left:17px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);background:var(--surface-2)}
.sc{font-weight:700;color:var(--good)}
.prog{font-size:11.5px;color:var(--good);background:var(--goodbg);border-radius:999px;padding:1px 8px;font-weight:700;white-space:nowrap}

/* zone 4 · the to-do: workflows only, 200px, never resized */
.todo{flex:none;width:200px;border-left:1px solid var(--line);padding:12px;font-size:12.5px;overflow:auto;display:none;background:var(--surface)}
.app.hastodo .todo{display:block}
.todo h5{margin:0 0 4px;font-size:13.5px;display:flex;align-items:baseline;gap:6px}
.todo h5 small{font-weight:600;color:var(--ink-3);font-size:11px}
.bar2{height:3px;background:var(--line);border-radius:2px;margin:4px 0 10px}.bar2 i{display:block;height:100%;background:var(--goldfill);border-radius:2px}
.tg{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:10px 0 4px}
.ti{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px}
.ti .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.ti.s-done .d{background:var(--good);border-color:var(--good)}
.ti.s-now{background:var(--warnbg)}.ti.s-now .d{border-color:var(--goldfill)}
.ti span{flex:1 1 auto}
.ti em{font-style:normal;font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--ink-3)}
.ti.s-done em{color:var(--good);border-color:var(--good)}.ti.s-now em{color:var(--gold);border-color:var(--goldfill)}

.otab{display:none;flex:none;margin:8px 16px 0 auto;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:600 12.5px/1.2 var(--sans);background:var(--surface);gap:6px;align-items:center}
.shade{display:none;position:absolute;inset:0;background:var(--shade);z-index:5}
.ptabs{display:none}

/* ═ RULES BY WIDTH (container queries follow the simulated width) ═
   1280+   all four zones; the chats fold when a result is open; the to-do
           keeps its 200px and the chat's default gives way first
   900–1279   the result becomes a tab that slides over the chat, and the
              to-do a chip on the result's header
   under 900  phone: Chat · Result · To-do as tabs, chats behind ☰ */
@container (max-width:1279px){
  .app.hastodo .todo{display:none}
  .app.hastodo .ohead .chip{display:inline-flex}
  .app.todoopen .todo{display:block;position:absolute;top:0;right:0;bottom:0;z-index:7;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
  .app.todoopen .shade{display:block}
  .app.hasout .chat,.app.hasout.hastodo .chat{flex:1 1 auto;max-width:none}
  .app.hasout .grip{display:none}
  .app.hasout .out{display:none}
  .app.hasout .otab{display:inline-flex}
  .app.hasout.sheet .out{display:flex;position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(720px,88cqw);box-shadow:-8px 0 24px rgba(0,0,0,.18)}
  .app.sheet .shade{display:block}
  .ohead .x{display:block}
}
@container (max-width:899px){
  .rail,.strip{display:none!important}
  .app.hasout .otab{display:none}
  .ptabs{display:flex;border-bottom:1px solid var(--line);flex:none}
  .ptabs button{flex:1 1 0;border:0;background:var(--surface);padding:8px 4px;font-size:13px;border-bottom:2px solid transparent}
  .ptabs button[aria-pressed="true"]{border-bottom-color:var(--goldfill);font-weight:700}
  .ptabs button[hidden]{display:none}
  .app.ph-out .chat{display:none}
  .app.ph-out .out{display:flex!important;position:static;width:auto;box-shadow:none;flex:1 1 auto}
  .app.ph-todo .chat{display:none}
  .app.ph-todo .todo{display:block!important;position:static;width:auto;box-shadow:none;flex:1 1 auto;border-left:0}
  .app .shade{display:none!important}
  .ohead .x,.ohead .chip{display:none!important}
  .feed{padding:12px 12px 6px}.compose{padding:6px 12px 12px}
  .msg.me{max-width:88%}
  .menu{display:inline-grid!important}
}
.menu{display:none;border:0;background:none;color:var(--panel-ink);font-size:17px;padding:0}
.app.railopen-phone .rail{display:block!important;position:absolute;top:0;left:0;bottom:0;z-index:7;box-shadow:8px 0 24px rgba(0,0,0,.18)}
.app.railopen-phone .shade{display:block!important}
</style>
</head>
<body>
<div class="ctl" role="toolbar" aria-label="Mockup controls">
  <b>Concept</b>
  <span class="seg" id="modes" aria-label="Kind of chat"><button data-m="wf" aria-pressed="true">Workflow</button><button data-m="free">Free chat</button></span>
  <span class="seg" id="widths" aria-label="Window width">
    <button data-w="0" aria-pressed="true">Your window</button><button data-w="1900">1900</button><button data-w="1440">1440</button><button data-w="1280">1280</button><button data-w="1100">1100</button><button data-w="390">Phone</button>
  </span>
  <span class="say" id="say"></span>
</div>
<div class="viewport" id="vp"><div class="scaler" id="scaler"><div class="stage" id="stage">
<div class="app" id="app">
  <div class="top"><button class="menu" id="menu" aria-label="Chats">☰</button><span>⌂</span><b>Strategy</b><span class="pill">Functions</span><span>HR</span><span>Finance</span><span>IT</span></div>
  <div class="tabs"><span>Plan</span><span>Performance</span><span>Focus</span><span class="on">Copilot</span></div>
  <div class="areas" id="areas"></div>
  <div class="ptabs" id="ptabs"><button data-p="chat" aria-pressed="true">Chat</button><button data-p="out">Result</button><button data-p="todo">To-do</button></div>
  <div class="body">
    <nav class="rail" aria-label="Chats">
      <div class="rh"><span>Chats</span><span><button class="new">+ New chat</button> <button class="fold" id="fold" aria-label="Fold the chats" title="Fold the chats">«</button></span></div>
      <div id="chats"></div>
      <div class="rh" style="margin-top:16px"><span>Deliverables</span></div>
      <div class="ri">Foundation v3<small>saved 22 Oct</small></div>
      <div class="ri">SWOT v2<small>saved 18 Oct</small></div>
    </nav>
    <div class="strip"><button class="ib" id="unfold" aria-label="Open the chats" title="Open the chats">»</button><span class="ib">+</span></div>
    <section class="chat" aria-label="Conversation">
      <div class="chead"><b id="ctitle"></b><span id="csub" style="color:var(--ink-3)"></span><span class="prog" id="cprog"></span></div>
      <button class="otab" id="otab"></button>
      <div class="feed" id="feed"><div class="col" id="col"></div></div>
      <div class="compose"><div class="box"><input placeholder="Type your answer…" aria-label="Message"><button class="send" aria-label="Send">↑</button></div></div>
    </section>
    <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Resize the conversation" tabindex="0" title="Drag to resize · double-click for 740px"></div>
    <section class="out" aria-label="Result">
      <div class="ohead"><b id="otitle"></b><span id="osub" style="color:var(--ink-3)"></span><button class="btn chip" id="chip"></button><button class="x" id="close" aria-label="Close">×</button></div>
      <div class="obody" id="obody"></div>
      <div class="ofoot" id="ofoot"></div>
    </section>
    <aside class="todo" id="todo" aria-label="To-do"></aside>
  </div>
  <div class="shade" id="shade"></div>
</div>
</div></div></div>

<script>
(function(){
  var app = document.getElementById("app");
  function $(id){ return document.getElementById(id); }
  function T(items){ return items.map(function(g){ return '<div class="tg">' + g[0] + '</div>' + g[1].map(function(i){
    return '<div class="ti s-' + i[1] + '"><i class="d"></i><span>' + i[0] + '</span><em>' + ({done:"Done",now:"Now",todo:"To do",opt:"Optional"})[i[1]] + '</em></div>'; }).join(""); }).join(""); }
  function C(h, s, body, cls){ return '<div class="card ' + (cls || "") + '"><h4>' + h + '<small>' + s + '</small></h4>' + body + '</div>'; }

  /* Each area: its workflow (title, conversation, result, to-do) and what a
     free chat there drafts. The content is illustrative. */
  var A = {
    foundation: { word:"Foundation", wf:{ title:"Copilot · Winning Aspiration", sub:"Foundation — testing v1", prog:"0 of 6 parts agreed", n:[2,9],
      msgs:[["ai","Good. We'll build the parts in order, starting with <b>Who we are</b> (7 short questions)."],["ai","Close your eyes and imagine it's the end of 2028 — you've \"won.\" Paint me that picture. What does success look like?"],["me","We're the first name ministries call for teacher training in the region."],["ai","A clear picture. Is that about <b>reach</b> (how many) or <b>trust</b> (who calls you first)?",["Reach","Trust","Both"]]],
      out:{ t:"Foundation — testing v1", s:"in progress · 2026 to 2028", body:'<div class="cards">' +
        C("Who we are","In progress",'<p>An education company training teachers and students across Egypt, through schools, ministries and online programmes.</p>',"wide") +
        C("Winning Aspiration","Question 1 of 4",'<p>0 of 4 answered.</p>',"now wide") + C("End in Mind","Empty",'<p class="e">Not started.</p>') + C("Mission","Empty",'<p class="e">Not started.</p>') +
        C("Key Objectives","Empty",'<p class="e">Not started.</p>') + C("Core Values","Empty",'<p class="e">Not started.</p>') + '</div>',
        foot:'<span class="k">0 of 6 parts agreed</span><button class="btn">Run the check</button><button class="btn gold">Save as Foundation</button><button class="btn">Apply to plan</button>' },
      todo:[["Start",[["Starting point","done"],["Plan years 2026–2028","done"]]],["The parts",[["Who we are","todo"],["Winning Aspiration","now"],["End in Mind","todo"],["Mission","todo"],["Key Objectives","todo"],["Core Values","todo"]]],["Then",[["Consistency check","opt"],["Save as Foundation","todo"]]]] },
      free:{ msgs:[["me","I want to refine the key objectives with proper targets"],["ai","The plan holds 7 today; Forefront suggests 3–5. We're going one at a time."],["me","620,000 as of end of 2024"],["ai","Agreed — it's in the draft. 2 of 5: <b>Educators reached (cumulative)</b>, currently ≥ 150,000. Where does it stand today?",["I'll give it","Assume for me","No baseline yet"]]],
        out:{ t:"Key Objectives · draft", s:"1 of 5 agreed", body: C("Students reached","Agreed",'<p>≥ 1,500,000 by 2028 · from 620,000, end 2024</p>',"wide") + C("Educators reached","Under discussion",'<p>≥ 150,000</p>',"now wide") +
          C("Beneficiary satisfaction","Next",'<p>≥ 90%</p>',"wide") + C("Team engagement","Next",'<p>≥ 90%</p>',"wide") + C("Financial stability","Next",'<p>12 months positive cash flow</p>',"wide"),
          foot:'<span class="k">Assumed: none yet</span><button class="btn">Save draft</button><button class="btn pri">Apply to plan</button>' } } },
    analysis: { word:"Analysis", wf:{ title:"Copilot · SWOT", sub:"SWOT — Educate Me", prog:"2 of 4 lines done", n:[3,7],
      msgs:[["ai","The internal analysis is agreed. Now the <b>Micro</b> scan — who are your main competitors for ministry contracts?"],["me","Two regional NGOs and one international publisher."],["ai","Noted three rivals. How hard is it for a new provider to win a ministry contract?",["Very hard","Moderate","Easy"]]],
      out:{ t:"SWOT — Educate Me", s:"v2 in progress", body:'<div class="cards">' +
        C("Strengths","5 items",'<ul><li>Ministry partnerships in 4 governorates</li><li>1.2M students reached</li><li>Own trainer academy</li></ul>') + C("Weaknesses","4 items",'<ul><li>Funding depends on 3 donors</li><li>Burnout and pay gaps</li></ul>') +
        C("Opportunities","Drafting",'<ul><li>National teacher-licensing reform</li></ul>',"now") + C("Threats","Waiting",'<p class="e">After the Macro scan.</p>') + '</div>',
        foot:'<span class="k">2 of 4 lines done</span><button class="btn gold">Save SWOT</button>' },
      todo:[["Analyses",[["Internal","done"],["Micro (5 forces)","now"],["Macro (DESTEP)","todo"]]],["SWOT",[["Strengths","done"],["Weaknesses","done"],["Opportunities","todo"],["Threats","todo"]]]] },
      free:{ msgs:[["me","Is donor dependence really a weakness or a threat?"],["ai","It's internal — the funding mix is yours to change — so the method files it under <b>Weaknesses</b>. The donors' own budget cuts would be the threat. Want both in the draft?",["Yes, both","Only the weakness"]]],
        out:{ t:"SWOT · draft", s:"1 change", body: C("Weaknesses","Changed",'<ul><li>Funding depends on 3 donors (70% of income)</li></ul>',"now wide") + C("Threats","Proposed",'<ul><li>Donor budget cuts after 2026</li></ul>',"wide"),
          foot:'<button class="btn">Save draft</button><button class="btn pri">Apply to plan</button>' } } },
    compete: { word:"How we compete", wf:{ title:"Copilot · Value discipline", sub:"How we compete", prog:"Market scored", n:[2,4],
      msgs:[["ai","The market rewards <b>Best Total Solution</b> by 30 points — buyers want a partner who designs the programme with them."],["ai","Now your side: how close is Educate Me to that today?",["Close","Half way","Far"]]],
      out:{ t:"How we compete", s:"scores", body:'<table><tr><th>Discipline</th><th>Market</th><th>Internal</th></tr><tr><td>Best Total Cost</td><td>40%</td><td>—</td></tr><tr><td>Best Total Solution</td><td class="sc">70%</td><td>—</td></tr><tr><td>Best Product</td><td>35%</td><td>—</td></tr></table>' + C("Leading","Clear",'<p>Best Total Solution leads the market by 30 points.</p>',"wide"),
        foot:'<button class="btn gold">Save</button>' },
      todo:[["Steps",[["Market","done"],["Internal","now"],["Value proposition","todo"],["Save","todo"]]]] },
      free:{ msgs:[["me","Why not Best Product? Our content is our pride."],["ai","Your content is strong, but buyers score partnership above product by 35 points. Product can stay a threshold strength. Want that note in the value proposition?",["Add the note","Leave it"]]],
        out:null } },
    directions: { word:"Directions", wf:{ title:"Copilot · Directions", sub:"Directions 2026–2028", prog:"7 scored", n:[2,5],
      msgs:[["ai","Here are 7 directions from your SWOT and discipline, scored Urgency × Importance × Ease."],["ai","Tick the ones to keep — usually 3 to 5.",["Keep the top 4","Let me choose"]]],
      out:{ t:"Directions", s:"scored", body:'<table><tr><th></th><th>Direction</th><th>U×I×E</th></tr><tr><td>☑</td><td>Win national licensing programmes</td><td class="sc">80</td></tr><tr><td>☑</td><td>Diversify funding beyond donors</td><td class="sc">64</td></tr><tr><td>☑</td><td>Scale online teacher training</td><td class="sc">48</td></tr><tr><td>☐</td><td>Enter the Gulf market</td><td>24</td></tr><tr><td>☐</td><td>Own publishing arm</td><td>12</td></tr></table>',
        foot:'<span class="k">3 chosen</span><button class="btn gold">Save directions</button>' },
      todo:[["Steps",[["Plan or fresh","done"],["Suggest & score","done"],["Choose","now"],["Capabilities","todo"],["Save","todo"]]]] },
      free:{ msgs:[["me","Is the Gulf worth keeping as a later-year direction?"],["ai","It scores low on Ease today. It could sit in year 3 with a trigger — one ministry partner there first. Draft it that way?",["Draft it","No, drop it"]]], out:null } },
    capabilities: { word:"Capabilities", wf:{ title:"Copilot · Capabilities", sub:"Capabilities", prog:"4 proposed", n:[1,3],
      msgs:[["ai","Four capabilities would carry your three directions. Each has an owner from your functions."],["ai","Keep all four?",["Keep all","Let me edit"]]],
      out:{ t:"Capabilities", s:"4 proposed", body:'<table><tr><th>Capability</th><th>Kind</th><th>Owner</th></tr><tr><td>Programme design with ministries</td><td>Core</td><td>Head of Programmes</td></tr><tr><td>Diversified fundraising</td><td>Core</td><td>CFO</td></tr><tr><td>Digital delivery platform</td><td>Internal pillar</td><td>Head of IT</td></tr><tr><td>Trainer retention</td><td>Enabler</td><td>HR Director</td></tr></table>',
        foot:'<button class="btn gold">Save capabilities</button>' },
      todo:[["Steps",[["Propose","done"],["Choose","now"],["Save","todo"]]]] },
      free:{ msgs:[["me","What would a key measure for trainer retention look like?"],["ai","A quantitative one — annual trainer turnover ≤ 12% — and a qualitative one — exit interviews name pay less often. Today's turnover?",["I'll give it","Assume for me"]]], out:null } },
    execution: { word:"Execution", wf:{ title:"Copilot · Execution", sub:"Jan–Dec 2026", prog:"1 of 3 items", n:[2,5],
      msgs:[["ai","The plan runs <b>Full year 2026 (Q1–Q4)</b>. First item: Win national licensing programmes."],["ai","Two measures and three tactics are drafted. Who owns the licensing bid?",["Head of Programmes","CEO"]]],
      out:{ t:"Execution 2026", s:"Q1–Q4", body: C("Win national licensing programmes","Now",'<p><b>Measures:</b> 2 ministry contracts signed (from 0); 15,000 teachers licensed (from 0).</p><p style="margin-top:6px"><b>Tactics:</b> Bid on the pilot (Q1–Q2) · Train 300 trainers (Q2–Q3) · Launch licensing track (Q4)</p>',"now wide") + C("Diversify funding beyond donors","Next",'<p class="e">Not started.</p>',"wide") + C("Scale online teacher training","Next",'<p class="e">Not started.</p>',"wide"),
        foot:'<button class="btn gold">Save execution</button>' },
      todo:[["Steps",[["Period","done"],["Win licensing","now"],["Diversify funding","todo"],["Scale online","todo"],["Save","todo"]]]] },
      free:{ msgs:[["me","Is 15,000 licensed teachers realistic in year one?"],["ai","With 300 trainers at 50 teachers each, 15,000 is the ceiling, not the target. 10,000 leaves room for a late start. Change it?",["Make it 10,000","Keep 15,000"]]], out:null } },
    advisory: { word:"Advisory", wf:{ title:"Copilot · Advisory", sub:"Should we bid for the Gulf contract?", prog:"Question 3 of 5", n:null,
      msgs:[["ai","Situation understood: a Gulf ministry invited Educate Me to bid, due in 6 weeks."],["ai","Would winning it take trainers away from the Egyptian programmes?",["Yes","Partly","No"]]],
      out:{ t:"Decision brief", s:"draft", body: C("Situation","",'<p>A Gulf ministry invited a bid due in 6 weeks; capacity is shared with Egypt.</p>',"wide") + C("Options","",'<ul><li><b>Bid with a partner (Recommended)</b> — effort: medium · risk: shared margin</li><li>Bid alone — effort: high · risk: Egypt delivery slips</li><li>Decline — effort: none · risk: a lost foothold</li></ul>',"wide") + C("What we know","",'<p class="e">Filling in as you answer.</p>',"wide"),
        foot:'<button class="btn gold">Save brief</button>' }, todo:null },
      free:{ msgs:[["me","What's the risk if we decline?"],["ai","Mainly timing: the next Gulf round is 2028, after your plan ends. Declining is safe if Directions keep the Gulf as year 3."]], out:null } }
  };
  var ORDER = ["foundation","analysis","compete","directions","capabilities","execution","advisory"];
  var S = { area:"foundation", mode:"wf", ph:"chat" };

  function draw(){
    var a = A[S.area], wf = S.mode === "wf", v = wf ? a.wf : a.free, out = v.out, todo = wf ? a.wf.todo : null;
    $("areas").innerHTML = ORDER.map(function(k){ return '<button class="area" data-a="' + k + '" aria-pressed="' + (k === S.area) + '">' + A[k].word + '</button>'; }).join("");
    $("chats").innerHTML = '<div class="ri' + (wf ? " on" : "") + '">' + a.wf.sub + '<small>Islam · now · Workflow</small></div><div class="ri' + (wf ? "" : " on") + '">Free chat — ' + a.word + '<small>Islam · now · Free chat</small></div>';
    $("ctitle").textContent = wf ? a.wf.title : "Free chat";
    $("csub").textContent = wf ? "" : "· " + a.word;
    $("cprog").textContent = wf ? a.wf.prog : ""; $("cprog").style.display = wf ? "" : "none";
    $("col").innerHTML = v.msgs.map(function(m){ return (m[0] === "me" ? '<div class="who me">Islam Saadany</div><div class="msg me">' : '<div class="who">Copilot</div><div class="msg ai">') + m[1] + '</div>' +
      (m[2] ? '<div class="opts">' + m[2].map(function(o){ return '<span class="opt">' + o + '</span>'; }).join("") + '</div>' : ""); }).join("");
    app.classList.toggle("hasout", !!out); app.classList.toggle("hastodo", !!todo);
    app.classList.toggle("railfold", !!out || S.userFold === true); if (!out && S.userFold !== true) app.classList.remove("railfold");
    if (out){ $("otitle").textContent = out.t; $("osub").textContent = "· " + out.s; $("obody").innerHTML = out.body; $("ofoot").innerHTML = out.foot;
      $("otab").innerHTML = (wf ? "View " + a.word.toLowerCase() : "View draft") + ' <span class="prog">' + out.s + '</span>'; }
    if (todo){ $("todo").innerHTML = '<h5>To-do <small>' + (a.wf.n ? a.wf.n[0] + "/" + a.wf.n[1] : "") + '</small></h5><div class="bar2"><i style="width:' + (a.wf.n ? Math.round(100 * a.wf.n[0] / a.wf.n[1]) : 0) + '%"></i></div>' + T(todo);
      $("chip").textContent = "To-do " + a.wf.n[0] + "/" + a.wf.n[1] + " ▾"; }
    var pt = $("ptabs").querySelectorAll("button");
    pt[1].hidden = !out; pt[2].hidden = !todo; pt[1].textContent = wf ? a.word : "Draft";
    if ((S.ph === "out" && !out) || (S.ph === "todo" && !todo)) S.ph = "chat";
    pt.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.p === S.ph)); });
    app.classList.toggle("ph-out", S.ph === "out"); app.classList.toggle("ph-todo", S.ph === "todo");
    app.classList.remove("sheet","todoopen","railopen-phone");
    say();
  }
  function say(){
    var w = W || document.documentElement.clientWidth, a = A[S.area], out = (S.mode === "wf" ? a.wf : a.free).out;
    $("say").textContent = !out ? "Nothing on the right yet: one centred conversation, chats open." :
      w >= 1280 ? "Chat on the left (drag the line to resize, double-click for the default), the result beside it" + (S.mode === "wf" && a.wf.todo ? ", the to-do at 200px." : ".") :
      w >= 900 ? "The result is a tab that slides over the chat; the to-do is the chip on its header." : "Phone: Chat · Result · To-do as tabs.";
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-a],[data-m],[data-w],[data-p]"); if (!t) return;
    if (t.dataset.a){ S.area = t.dataset.a; draw(); }
    else if (t.dataset.m){ S.mode = t.dataset.m; document.querySelectorAll("#modes button").forEach(function(b){ b.setAttribute("aria-pressed", String(b === t)); }); draw(); }
    else if (t.dataset.w != null){ W = Number(t.dataset.w); document.querySelectorAll("#widths button").forEach(function(b){ b.setAttribute("aria-pressed", String(b === t)); }); app.classList.remove("sheet","todoopen"); fit(); say(); }
    else if (t.dataset.p){ S.ph = t.dataset.p; draw(); }
  });
  $("fold").onclick = function(){ S.userFold = true; app.classList.add("railfold"); };
  $("unfold").onclick = function(){ S.userFold = false; app.classList.remove("railfold"); };
  $("otab").onclick = function(){ app.classList.add("sheet"); };
  $("close").onclick = function(){ app.classList.remove("sheet"); };
  $("chip").onclick = function(){ app.classList.add("todoopen"); };
  $("menu").onclick = function(){ app.classList.add("railopen-phone"); };
  $("shade").onclick = function(){ app.classList.remove("sheet","todoopen","railopen-phone"); };

  /* The handle: drag to resize the conversation (420 to 1000px), the result
     takes the rest; double-click puts 740 back. Remembered in the real build. */
  var grip = $("grip");
  function setW(px){ px = Math.max(420, Math.min(1100, px)); app.style.setProperty("--chatw", px + "px"); }
  grip.addEventListener("pointerdown", function(e){
    e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add("drag");
    var chat = document.querySelector(".chat"), x0 = e.clientX, w0 = chat.getBoundingClientRect().width, s = scale();
    function mv(ev){ setW(w0 / s + (ev.clientX - x0) / s); }
    function up(){ grip.classList.remove("drag"); grip.removeEventListener("pointermove", mv); grip.removeEventListener("pointerup", up); }
    grip.addEventListener("pointermove", mv); grip.addEventListener("pointerup", up);
  });
  grip.addEventListener("dblclick", function(){ app.style.removeProperty("--chatw"); });
  grip.addEventListener("keydown", function(e){ var c = document.querySelector(".chat").getBoundingClientRect().width / scale();
    if (e.key === "ArrowLeft") setW(c - 20); if (e.key === "ArrowRight") setW(c + 20); });

  var W = 0, SC = 1;
  function scale(){ return SC; }
  function fit(){
    var stage = $("stage"), sc = $("scaler"), vp = $("vp");
    document.documentElement.style.setProperty("--apph", Math.max(520, window.innerHeight - document.querySelector(".ctl").offsetHeight) + "px");
    document.body.classList.toggle("full", !W);
    if (!W){ SC = 1; stage.style.width = ""; sc.style.transform = ""; sc.style.width = ""; vp.style.height = ""; return; }
    var room = document.documentElement.clientWidth - 32; SC = Math.min(1, room / W);
    stage.style.width = W + "px"; sc.style.transform = "scale(" + SC + ")"; sc.style.width = W + "px";
    vp.style.height = (stage.offsetHeight * SC + 32) + "px";
  }
  window.addEventListener("resize", function(){ fit(); say(); });
  draw(); fit(); say();
})();
</script>
