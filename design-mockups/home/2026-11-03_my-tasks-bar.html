<title>My Tasks Bar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* My tasks' card head, before and after, matched to the Tracker's quiet bar
   (§723). Islam: "show me My tasks top bar match the tracker before and
   after". Sort by becomes the plain-word views after the count; Search an
   icon that opens; Done a small "Done: Hide ▾" word. Example tasks. */
:root{--ink:#141C2B;--ink-2:#465268;--ink-3:#5E6E85;--line:#D8DEE8;--line-2:#E6EAF0;--ground:#F3F5F8;--surface:#FFF;--surface-2:#EDF0F5;
  --gold:#9C5D08;--gold-bg:#FBF3E4;--blue:#1F5FBF;--bad:#B23025;--d0:#8A97AB;--d1:#E0B300;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E7EBF2;--ink-2:#AAB4C6;--ink-3:#8E99AC;--line:#333B4A;--line-2:#2A303C;--ground:#12151C;--surface:#1A1F29;--surface-2:#222834;--gold:#F5A623;--gold-bg:#2E2715;--blue:#8FB4F0;--bad:#E8776B;--d0:#7D889B;--d1:#E8C547;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E7EBF2;--ink-2:#AAB4C6;--ink-3:#8E99AC;--line:#333B4A;--line-2:#2A303C;--ground:#12151C;--surface:#1A1F29;--surface-2:#222834;--gold:#F5A623;--gold-bg:#2E2715;--blue:#8FB4F0;--bad:#E8776B;--d0:#7D889B;--d1:#E8C547;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg{display:block}
.pg{max-width:1000px;margin:0 auto;padding-block:24px 48px;display:grid;gap:14px}
.vs{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:3px;justify-self:start}
.vs button{border:0;background:none;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.vs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0;max-width:78ch}
.note b{color:var(--ink)}.note p{margin:0}.note p+p{margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--line-2);position:relative}
.hd h2{margin:0;font:700 19px/1.15 var(--serif);white-space:nowrap}

/* BEFORE */
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--gold-bg);color:var(--gold)}
.tile svg{width:17px;height:17px}
.pill{font:700 11.5px/1.5 var(--font);border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink-2)}
.sp{flex:1}
.sort{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.sort .sw{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2)}
.sort .sw span{font-size:12px;font-weight:600;color:var(--ink-2);padding:3px 9px;border-radius:6px}
.sort .sw span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,28,43,.08)}
.fld{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--ink-3);width:170px}

/* AFTER — the Tracker's quiet bar */
.q .hd{padding:12px 16px 10px;gap:6px 10px}
.q h2{font-size:18px}
.q .cnt{color:var(--ink-3);font-weight:500}
.tabs{display:flex;gap:2px;margin-left:6px;margin-right:auto;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:4px 10px;border-radius:7px;color:var(--ink-3);font-size:13.5px}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
.find{display:flex;align-items:center;gap:6px;height:32px;border:1px solid transparent;border-radius:8px;padding:0 8px;color:var(--ink-3);cursor:pointer}
.find:hover{background:var(--surface-2)}
.find svg{width:15px;height:15px;flex:none}
.find input{border:0;background:none;outline:none;width:0;padding:0;font-size:13.5px;color:var(--ink)}
.find.on{border-color:var(--line);background:var(--surface);cursor:auto}
.find.on input{width:170px}
.word{position:relative}
.word>button{border:0;background:none;padding:8px;font-size:13.5px;color:var(--ink-3);white-space:nowrap;border-radius:8px}
.word>button:hover,.word>button[aria-expanded="true"]{background:var(--surface-2)}
.word>button b{color:var(--ink-2);font-weight:600;margin-left:3px}
.menu{position:absolute;right:0;top:36px;z-index:5;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(20,28,43,.16);padding:4px;display:grid}
.menu button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:7px;font-size:13.5px;display:flex;align-items:center}
.menu button:hover{background:var(--surface-2)}
.menu button.on{font-weight:700}
.menu button.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:auto}

/* the list, the same under both */
.sh{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;border-bottom:1px solid var(--line-2)}
.sh h3{margin:0;font-size:14px}
.sh .m{color:var(--ink-3);font-size:12.5px}
.sh.late h3{color:var(--bad)}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) 92px 120px 28px;gap:2px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.tick{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px}
.tick.late{border-color:var(--bad)}
.tn{min-width:0}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600}
.meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{font-size:13px;color:var(--ink-3)}.wk.late{color:var(--bad);font-weight:600}
.st{display:flex;gap:7px;align-items:center;font:600 13px/1 var(--font);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--d1)}.dot.ns{background:var(--d0)}
.kb{color:var(--ink-3);text-align:center}
@media (max-width:760px){.row{grid-template-columns:20px minmax(0,1fr) 28px}.wk,.st{display:none}.tabs{margin-right:0}.sp{display:none}}
</style>
<div class="pg">
  <div class="vs" role="group" aria-label="Which version">
    <button type="button" id="s-before" data-v="before" aria-pressed="false">Before</button>
    <button type="button" id="s-after" data-v="after" aria-pressed="true">After · like the Tracker</button>
  </div>
  <div class="note" id="note"></div>

  <div class="card" id="v-before" hidden>
    <div class="hd"><span class="tile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 4h8M6 8h8M6 12h8M2.5 4h.5M2.5 8h.5M2.5 12h.5"/></svg></span><h2>Open tasks</h2><span class="pill">5</span><span class="sp"></span>
      <span class="sort">Sort by <span class="sw"><span class="on">Date</span><span>Client</span></span></span>
      <span class="sort">Done <span class="sw"><span class="on">Hide</span><span>Last week</span><span>30 days</span></span></span>
      <span class="fld">Search tasks</span></div>
    <div class="lst"></div>
  </div>

  <div class="card q" id="v-after">
    <div class="hd"><h2>Open tasks</h2><span class="cnt">5</span>
      <div class="tabs" role="group" aria-label="Sort by"><button type="button" aria-pressed="true">By date</button><button type="button" aria-pressed="false">By client</button></div>
      <label class="find" id="find"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="q" placeholder="Search tasks" aria-label="Search tasks"></label>
      <span class="word"><button type="button" id="done" aria-haspopup="menu" aria-expanded="false">Done: <b id="doneW">Hide</b> ▾</button>
        <span class="menu" id="doneM" role="menu" hidden><button type="button" class="on" data-d="Hide">Hide</button><button type="button" data-d="Last week">Last week</button><button type="button" data-d="30 days">Last 30 days</button></span></span>
    </div>
    <div class="lst"></div>
  </div>
</div>
<script>
const NOTES={
 before:'<p><b>Today.</b> An icon tile, "Open tasks" with a count pill, then two boxed switches (Sort by Date · Client, Done Hide · Last week · 30 days) and a search box, all pushed to the right.</p>',
 after:'<p><b>After, like the Tracker.</b> No tile; the count a plain figure. Sort by becomes the views right after it, as plain words (<b>By date · By client</b>), the chosen one on a soft grey, just like This week · All · Mine on the Tracker. Search is an icon that opens its box. Done becomes a small <b>Done: Hide ▾</b> word, like the Tracker\'s <b>Group: Owner ▾</b>.</p><p>An admin\'s Show (whose tasks) would become a third small word, <b>Show: Mine ▾</b>, in the same place. Home\'s Your tasks card gets the same head.</p>'};
const ROWS='<div class="sh late"><h3>Late</h3><span class="m">1 open</span></div>'+
 '<div class="row"><span class="tick late"></span><div class="tn"><span class="t">Finance Adjust Project that is missing Milestones</span><div class="meta">Raya Trade · Functions · Got the revenue drivers from Hussain</div></div><span class="wk late">2 w late</span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>'+
 '<div class="sh"><h3>This week</h3><span class="m">2 open</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Review the two HR projects &amp; kick 3rd Project Retention Analytics</span><div class="meta">Raya Trade · Functions · Trying to meet this week Wednesday still didn\'t commit</div></div><span class="wk"></span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Logistics Strategy Revamp</span><div class="meta">Raya Trade · Units · Booked a meeting on Wednesday to discuss the strategy</div></div><span class="wk"></span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>';
document.querySelectorAll('.lst').forEach(l=>l.innerHTML=ROWS);
function show(v){
 ['before','after'].forEach(k=>document.getElementById('v-'+k).hidden=k!==v);
 document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
 document.getElementById('note').innerHTML=NOTES[v];
}
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
const f=document.getElementById('find'),q=document.getElementById('q');
f.addEventListener('click',()=>{f.classList.add('on');q.focus()});
q.addEventListener('blur',()=>{if(!q.value)f.classList.remove('on')});
const db=document.getElementById('done'),dm=document.getElementById('doneM');
db.addEventListener('click',e=>{e.stopPropagation();dm.hidden=!dm.hidden;db.setAttribute('aria-expanded',String(!dm.hidden))});
dm.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;dm.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('doneW').textContent=b.dataset.d;dm.hidden=true;db.setAttribute('aria-expanded','false')});
document.addEventListener('click',()=>{if(!dm.hidden){dm.hidden=true;db.setAttribute('aria-expanded','false')}});
show('after');
</script>
