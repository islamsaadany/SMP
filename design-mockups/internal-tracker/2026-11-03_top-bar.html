<title>Tracker Top Bar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The Internal Tracker's top bar, before and two afters. Islam: "how we make
   it simpler and cleaner as it's functional but taking the focus somehow
   from the tasks itself". Everything it does stays; what changes is how
   loud it is. Example tasks. */
:root{--ink:#141C2B;--ink-2:#465268;--ink-3:#5E6E85;--ink-4:#8A94A6;--line:#D8DEE8;--line-2:#E6EAF0;--ground:#F3F5F8;--surface:#FFF;--surface-2:#EDF0F5;
  --gold:#9C5D08;--gold-bg:#FBF3E4;--blue:#1F5FBF;--bad:#B23025;--d0:#8A97AB;--d1:#E0B300;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E7EBF2;--ink-2:#AAB4C6;--ink-3:#8E99AC;--ink-4:#727D90;--line:#333B4A;--line-2:#2A303C;--ground:#12151C;--surface:#1A1F29;--surface-2:#222834;--gold:#F5A623;--gold-bg:#2E2715;--blue:#8FB4F0;--bad:#E8776B;--d0:#7D889B;--d1:#E8C547;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E7EBF2;--ink-2:#AAB4C6;--ink-3:#8E99AC;--ink-4:#727D90;--line:#333B4A;--line-2:#2A303C;--ground:#12151C;--surface:#1A1F29;--surface-2:#222834;--gold:#F5A623;--gold-bg:#2E2715;--blue:#8FB4F0;--bad:#E8776B;--d0:#7D889B;--d1:#E8C547;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg{display:block}
.pg{max-width:1000px;margin:0 auto;padding-block:24px 48px;display:grid;gap:14px}
.sw{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:3px;justify-self:start}
.sw button{border:0;background:none;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.sw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0;max-width:78ch}
.note b{color:var(--ink)}.note p{margin:0}.note p+p{margin-top:6px}
.v{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}

/* ---------- BEFORE (as it is) ---------- */
.b-top{border-bottom:2px solid var(--gold);border-radius:12px}
.b-h{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.b-ic{width:44px;height:44px;border-radius:10px;background:var(--gold-bg);color:var(--gold);display:grid;place-items:center}
.b-h h1{font:700 26px/1 var(--serif);margin:0}
.b-n{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;color:var(--ink-2)}
.b-show{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-3);flex-wrap:wrap}
.b-seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.b-seg span{padding:6px 12px;border-radius:7px;font-weight:500;color:var(--ink-2)}
.b-seg span.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.b-tools{display:grid;grid-template-columns:minmax(0,1fr) 280px auto;gap:14px;padding:18px 24px}
.b-box{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:0;color:var(--ink-3);font-size:16px}
.b-box .chip{background:var(--surface-2);border-radius:7px;padding:4px 10px;color:var(--ink-2);font-weight:600;font-size:15px;white-space:nowrap}
.b-box .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-box b{color:var(--ink);font-weight:600}

/* ---------- AFTER A: one quiet bar ---------- */
.a-top{padding:14px 18px;display:grid;gap:12px}
.a-r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.a-r1 h1{font:700 20px/1.2 var(--serif);margin:0}
.a-n{color:var(--ink-3);font-weight:500}
.tabs{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:7px;color:var(--ink-3);font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
.a-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.ib{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.ib:hover,.ib[aria-expanded="true"]{background:var(--surface-2);color:var(--ink)}
.ib svg{width:16px;height:16px}
.grp{border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--ink-3);font-size:13.5px;white-space:nowrap}
.grp b{color:var(--ink-2);font-weight:600}
.grp:hover{background:var(--surface-2)}
.srch{display:none;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;width:220px;max-width:100%}
.srch.on{display:flex}
.srch input{border:0;background:none;outline:none;min-width:0;flex:1;font-size:14px}
.srch svg{width:14px;height:14px;color:var(--ink-3);flex:none}
.add{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;background:var(--ground);min-width:0}
.add:focus-within{border-color:var(--line);background:var(--surface)}
.add>svg{width:14px;height:14px;color:var(--ink-3);flex:none}
.add input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14.5px}
.add input::placeholder{color:var(--ink-3)}
.add .chips{display:none;gap:6px}
.add:focus-within .chips,.add.typed .chips{display:flex}
.add .chips span{background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}

/* ---------- AFTER B: the bar leaves the card ---------- */
.bb-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 2px 0}
.bb-top h1{font:700 22px/1.2 var(--serif);margin:0}
.bb-top .tabs{margin-left:6px}
.addrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);min-width:0}
.addrow>svg{width:16px;height:16px;color:var(--blue);flex:none}
.addrow input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.addrow input::placeholder{color:var(--blue)}
.addrow .chips{display:none;gap:6px}
.addrow:focus-within .chips{display:flex}
.addrow .chips span{background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}

/* ---------- the list, the same under all three ---------- */
.hd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--blue);display:grid;place-items:center;font:700 12px/1 var(--font)}
.hd h2{font-size:17px;margin:0}.hd .n{color:var(--ink-3)}
.hd .ad{margin-left:auto;color:var(--blue);font-weight:600}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) 92px 120px 28px;gap:2px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.tick{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px}
.tn{min-width:0}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600}
.meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{font-size:13px;color:var(--ink-3)}.wk.late{color:var(--bad);font-weight:600}
.st{display:flex;gap:7px;align-items:center;font:600 13px/1 var(--font);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--d1)}.dot.ns{background:var(--d0)}
.kb{color:var(--ink-3);text-align:center}

@media (max-width:760px){
  .b-tools{grid-template-columns:1fr}
  .row{grid-template-columns:20px minmax(0,1fr) 28px}.wk,.st{display:none}
  .a-right{margin-left:0}
  .tabs{margin-left:0}
}
</style>
<div class="pg">
  <div class="sw" role="group" aria-label="Which version">
    <button type="button" id="s-before" data-v="before" aria-pressed="false">Before</button>
    <button type="button" id="s-a" data-v="a" aria-pressed="true">After A · one quiet bar</button>
    <button type="button" id="s-b" data-v="b" aria-pressed="false">After B · bar off the card</button>
  </div>
  <div class="note" id="note"></div>

  <!-- BEFORE -->
  <div class="v" id="v-before" hidden>
    <div class="card b-top">
      <div class="b-h"><span class="b-ic"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 4h8M6 8h8M6 12h8M2.5 4h.5M2.5 8h.5M2.5 12h.5"/></svg></span><h1>Actions</h1><span class="b-n">14</span>
        <div class="b-show">Show <div class="b-seg"><span>This week</span><span class="on">All</span><span>Mine</span><span>Undated</span><span>Weekly check</span></div></div></div>
      <div class="b-tools">
        <div class="b-box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linejoin="round"><path d="M3 13l1-3 7-7 2 2-7 7z"/></svg><span class="grow">Write the next action and press Enter</span><span class="chip">Topic</span><span class="chip">This week</span><span class="chip">Islam</span><span>⌄</span></div>
        <div class="b-box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>Search</div>
        <div class="b-box">Group by <b>Owner</b></div>
      </div>
    </div>
    <div class="card list"></div>
  </div>

  <!-- AFTER A -->
  <div class="v" id="v-a">
    <div class="card a-top">
      <div class="a-r1"><h1>Actions</h1><span class="a-n">14</span>
        <div class="tabs" role="group" aria-label="Show"><button type="button" aria-pressed="false">This week</button><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">Mine</button><button type="button" aria-pressed="false">Undated</button><button type="button" aria-pressed="false">Weekly check</button></div>
        <div class="a-right">
          <label class="srch" id="a-srch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="a-q" placeholder="Search actions" aria-label="Search actions"></label>
          <button type="button" class="ib" id="a-sb" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></button>
          <button type="button" class="grp">Group: <b>Owner</b> ▾</button>
        </div>
      </div>
      <label class="add"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><input id="a-add" placeholder="Add an action — press Enter" aria-label="Add an action"><span class="chips"><span>Topic</span><span>This week</span><span>Islam</span></span></label>
    </div>
    <div class="card list"></div>
  </div>

  <!-- AFTER B -->
  <div class="v" id="v-b" hidden>
    <div class="bb-top"><h1>Actions</h1><span class="a-n">14</span>
      <div class="tabs" role="group" aria-label="Show"><button type="button" aria-pressed="false">This week</button><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">Mine</button><button type="button" aria-pressed="false">Undated</button><button type="button" aria-pressed="false">Weekly check</button></div>
      <div class="a-right">
        <label class="srch" id="b-srch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="b-q" placeholder="Search actions" aria-label="Search actions"></label>
        <button type="button" class="ib" id="b-sb" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></button>
        <button type="button" class="grp">Group: <b>Owner</b> ▾</button>
      </div>
    </div>
    <div class="card list" data-addrow="1"></div>
  </div>
</div>
<script>
const NOTES={
 before:'<p><b>Today.</b> A big icon tile, a serif heading with a count pill, a "Show" label and a boxed switch, then three tall boxes (the write line with its three chips always out, Search, Group by) and an amber rule under the lot. It is all useful, but it is heavier than the list it sits on.</p>',
 a:'<p><b>After A, one quiet bar (recommended).</b> Same card, half the height. The heading is smaller and the count plain; the views are plain words, the chosen one on a soft grey; Search is an icon that opens a box; Group by is a small word at the end. The write line is one slim row, and its Topic / week / owner chips appear only once you click into it. No icon tile, no amber rule.</p><p>Click into the add line, or press the search icon, to see them open.</p>',
 b:'<p><b>After B, the bar off the card.</b> Heading, views, search and group sit on the page itself, with no card around them. The add line becomes the first row of the list, in the list\'s own blue, so adding feels like part of the tasks. The flattest of the three; the add line is less prominent than today.</p><p>Click the add row, or the search icon, to see them open.</p>'};
const ROWS='<div class="hd"><span class="av">IS</span><h2>Islam Saadany</h2><span class="n">3 open</span><span class="ad">+ Add for Islam</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">HR project we want to review the two projects &amp; Develop the 3rd Project Retention Analytics</span><div class="meta">Functions · Trying to meet this week Wednesday, still didn\'t commit</div></div><span class="wk">This week</span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Finance Adjust Project that is missing Milestones</span><div class="meta">Finance · Last week · Hussain, trying to have a meeting on Tuesday to discuss</div></div><span class="wk late">2 w late</span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Logistics Strategy Revamp</span><div class="meta">Supply chain</div></div><span class="wk">Next week</span><span class="st"><span class="dot ns"></span>Not started</span><span class="kb">⋯</span></div>';
const ADDROW='<label class="addrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><input id="b-add" placeholder="Add an action" aria-label="Add an action"><span class="chips"><span>Topic</span><span>This week</span><span>Islam</span></span></label>';
document.querySelectorAll('.list').forEach(l=>l.innerHTML=(l.dataset.addrow?ADDROW:'')+ROWS);
function show(v){
 ['before','a','b'].forEach(k=>document.getElementById('v-'+k).hidden=k!==v);
 document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
 document.getElementById('note').innerHTML=NOTES[v];
}
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
document.querySelectorAll('.tabs').forEach(t=>t.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
[['a-sb','a-srch','a-q'],['b-sb','b-srch','b-q']].forEach(([b,s,q])=>{
 const btn=document.getElementById(b),box=document.getElementById(s);
 btn.addEventListener('click',()=>{const on=!box.classList.contains('on');box.classList.toggle('on',on);btn.hidden=on;if(on)document.getElementById(q).focus()});
 document.getElementById(q).addEventListener('blur',e=>{if(!e.target.value){box.classList.remove('on');btn.hidden=false}});
});
show('a');
</script>
