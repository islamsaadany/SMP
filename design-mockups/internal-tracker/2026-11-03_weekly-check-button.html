<title>Weekly Check Button</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The Weekly check leaves the views and becomes a button of its own.
   Islam: "the weekly check is actually an action and shouldn't be sitting
   with the filters". Before, after, and the check itself with its way back.
   Example tasks. */
:root{--ink:#141C2B;--ink-2:#465268;--ink-3:#5E6E85;--line:#D8DEE8;--line-2:#E6EAF0;--ground:#F3F5F8;--surface:#FFF;--surface-2:#EDF0F5;
  --gold:#9C5D08;--gold-bg:#FBF3E4;--blue:#1F5FBF;--blue-bg:#EAF2FB;--bad:#B23025;--d0:#8A97AB;--d1:#E0B300;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E7EBF2;--ink-2:#AAB4C6;--ink-3:#8E99AC;--line:#333B4A;--line-2:#2A303C;--ground:#12151C;--surface:#1A1F29;--surface-2:#222834;--gold:#F5A623;--gold-bg:#2E2715;--blue:#8FB4F0;--blue-bg:#16263A;--bad:#E8776B;--d0:#7D889B;--d1:#E8C547;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E7EBF2;--ink-2:#AAB4C6;--ink-3:#8E99AC;--line:#333B4A;--line-2:#2A303C;--ground:#12151C;--surface:#1A1F29;--surface-2:#222834;--gold:#F5A623;--gold-bg:#2E2715;--blue:#8FB4F0;--blue-bg:#16263A;--bad:#E8776B;--d0:#7D889B;--d1:#E8C547;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg{display:block}
.pg{max-width:1000px;margin:0 auto;padding-block:24px 48px;display:grid;gap:14px}
.vs{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:3px;justify-self:start}
.vs button{border:0;background:none;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.vs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0;max-width:78ch}
.note b{color:var(--ink)}.note p{margin:0}.note p+p{margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.top{padding:12px 16px 14px;display:grid;gap:10px}
.r1{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.r1 h1{font:700 18px/1.2 var(--serif);margin:0}
.n{color:var(--ink-3);font-weight:500}
.tabs{display:flex;gap:2px;margin-left:6px;margin-right:auto;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:4px 10px;border-radius:7px;color:var(--ink-3);font-size:13.5px}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
.ib{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.ib:hover{background:var(--surface-2)}
.ib svg{width:15px;height:15px}
.grp{border:0;background:none;padding:8px;border-radius:8px;color:var(--ink-3);font-size:13.5px;white-space:nowrap}
.grp b{color:var(--ink-2);font-weight:600}
.grp:hover{background:var(--surface-2)}
.wc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.wc:hover{border-color:var(--blue);color:var(--blue)}
.wc svg{width:15px;height:15px;color:var(--blue)}
.add{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;background:var(--ground);color:var(--ink-3);font-size:14.5px}
.add svg{width:14px;height:14px}
/* inside the check */
.chk .r1 h1{font-size:18px}
.back{border:0;background:none;padding:6px 8px;margin-left:-8px;border-radius:8px;color:var(--blue);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.back:hover{background:var(--blue-bg)}
.back svg{width:14px;height:14px}
.sep{width:1px;height:18px;background:var(--line)}
.when{color:var(--ink-3)}
.walk{margin-left:auto;font-size:13px;color:var(--ink-3)}
.walk b{color:var(--ink)}
.meet{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:220px}
.ml{border-right:1px solid var(--line-2);padding:8px}
.ml div{padding:7px 10px;border-radius:7px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml div.on{background:var(--surface-2);font-weight:600}
.ml .h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.mr{padding:16px 20px;display:grid;gap:8px;align-content:start}
.mr h2{margin:0;font-size:17px}
.mr p{margin:0;color:var(--ink-2)}
.mr .box{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink-3)}
/* the list */
.hd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--blue);display:grid;place-items:center;font:700 12px/1 var(--font)}
.hd h2{font-size:17px;margin:0}.hd .m{color:var(--ink-3)}
.hd .ad{margin-left:auto;color:var(--blue);font-weight:600}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) 92px 120px 28px;gap:2px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.tick{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px}
.tn{min-width:0}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600}
.meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{font-size:13px;color:var(--ink-3)}.wk.late{color:var(--bad);font-weight:600}
.st{display:flex;gap:7px;align-items:center;font:600 13px/1 var(--font);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--d1)}
.kb{color:var(--ink-3);text-align:center}
@media (max-width:760px){.row{grid-template-columns:20px minmax(0,1fr) 28px}.wk,.st{display:none}.tabs{margin-right:0}.meet{grid-template-columns:1fr}.ml{border-right:0;border-bottom:1px solid var(--line-2)}.walk{margin-left:0}}
</style>
<div class="pg">
  <div class="vs" role="group" aria-label="Which version">
    <button type="button" data-v="before" aria-pressed="false">Before</button>
    <button type="button" data-v="after" aria-pressed="true">After · the list</button>
    <button type="button" data-v="check" aria-pressed="false">After · in the check</button>
  </div>
  <div class="note" id="note"></div>
  <div id="stage"></div>
</div>
<script>
const LENS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>';
const PLUS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2.5" width="10" height="11.5" rx="1.5"/><path d="M6 2.5h4v2H6zM5.8 9.2l1.6 1.6 3-3.2"/></svg>';
const BACK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>';
const tabs=(list,on)=>'<div class="tabs" role="group" aria-label="Views">'+list.map(t=>'<button type="button" aria-pressed="'+(t===on)+'">'+t+'</button>').join('')+'</div>';
const LIST='<div class="card"><div class="hd"><span class="av">IS</span><h2>Islam Saadany</h2><span class="m">3 open</span><span class="ad">+ Add for Islam</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Review the two HR projects &amp; kick 3rd Project Retention Analytics</span><div class="meta">Functions · Trying to meet this week Wednesday still didn\'t commit</div></div><span class="wk">This week</span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Finance Adjust Project that is missing Milestones</span><div class="meta">Functions · Got the revenue drivers from Hussain</div></div><span class="wk">This week</span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div>'+
 '<div class="row"><span class="tick"></span><div class="tn"><span class="t">Logistics Strategy Revamp</span><div class="meta">Units · Booked a meeting on Wednesday to discuss the strategy</div></div><span class="wk">This week</span><span class="st"><span class="dot"></span>In progress</span><span class="kb">⋯</span></div></div>';
const ADD='<div class="add">'+PLUS+'Add an action and press Enter</div>';
const V={
 before:{note:'<p><b>Today.</b> Weekly check sits among the views, as if it were one more way to filter the list. It isn\'t: it opens the meeting, with its own list on the left and one task at a time on the right.</p>',
  html:'<div class="card top"><div class="r1"><h1>Actions</h1><span class="n">14</span>'+tabs(['This week','All','Mine','Undated','Weekly check'],'All')+'<button class="ib" type="button" aria-label="Search">'+LENS+'</button><button class="grp" type="button">Group: <b>Owner</b> ▾</button></div>'+ADD+'</div>'+LIST},
 after:{note:'<p><b>After, the list.</b> The views are only views: <b>This week · All · Mine · Undated</b>. The check is an action, so it\'s a button of its own at the end of the bar: <b>Start weekly check</b>, outlined, with a clipboard icon. Press it to see the check.</p>',
  html:'<div class="card top"><div class="r1"><h1>Actions</h1><span class="n">14</span>'+tabs(['This week','All','Mine','Undated'],'All')+'<button class="ib" type="button" aria-label="Search">'+LENS+'</button><button class="grp" type="button">Group: <b>Owner</b> ▾</button><button class="wc" type="button" data-go="check">'+CHECK+'Start weekly check</button></div>'+ADD+'</div>'+LIST},
 check:{note:'<p><b>After, in the check.</b> The bar says where you are: <b>← Back to the list</b> first, then <b>Weekly check</b> and its week. The views, search and add line step aside; the meeting has the page. How far you\'ve got stays on the right. Press Back to return to the list.</p>',
  html:'<div class="card top chk"><div class="r1"><button class="back" type="button" data-go="after">'+BACK+'Back to the list</button><span class="sep"></span><h1>Weekly check</h1><span class="when">W1 Nov · 1 – 5 Nov</span><span class="walk"><b>2</b> of 7 gone through</span></div></div>'+
  '<div class="card meet"><div class="ml"><div class="h">Functions</div><div class="on">Review the two HR projects &amp; kick 3rd…</div><div>Finance Adjust Project that is missing…</div><div class="h">Units</div><div>Logistics Strategy Revamp</div></div>'+
  '<div class="mr"><h2>Review the two HR projects &amp; kick 3rd Project Retention Analytics</h2><p>Islam · In progress · due this week</p><div class="box">What happened this week?</div></div></div>'}};
function show(v){
 document.getElementById('stage').innerHTML='<div style="display:grid;gap:14px">'+V[v].html+'</div>';
 document.getElementById('note').innerHTML=V[v].note;
 document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
}
document.addEventListener('click',e=>{
 const v=e.target.closest('[data-v]');if(v){show(v.dataset.v);return}
 const g=e.target.closest('[data-go]');if(g){show(g.dataset.go);return}
 const t=e.target.closest('.tabs button');if(t){t.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===t)))}
});
show('after');
</script>
