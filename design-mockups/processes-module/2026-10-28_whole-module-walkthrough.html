<title>Processes Module Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@600&display=swap">
<style>
/* Layout: SMP's navy top bar, the Processes module's own side rail, one working area. Navy/gold house style; semantic colours only for state. */
:root{--bg:#F3F5F9;--surf:#fff;--surf2:#EEF1F6;--surf3:#E4E9F1;--line:#D5DBE5;--ink:#1B2430;--ink2:#414A58;--ink3:#5F6B7C;--navy:#16325C;--navy-2:#1F4480;--navy-ink:#fff;--navy-q:#B9C6DC;--gold:#B7861F;--gold-bg:#FBF3DF;--gold-ink:#7A5607;--good:#1E7A4D;--good-bg:#E2F3E9;--warn:#8A5A00;--warn-bg:#FBF0D4;--bad:#A4332A;--bad-bg:#F9E3E0;--info:#1F5FA8;--info-bg:#E1ECF9;--code:#3B4BA8;--code-bg:#E8EAF8;--shadow:0 10px 30px rgba(22,50,92,.14);--sans:"Source Sans 3",system-ui,"Segoe UI",sans-serif;--serif:"Source Serif 4",Georgia,serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161E;--surf:#1A2029;--surf2:#222A36;--surf3:#2A3340;--line:#343D4B;--ink:#E9ECF1;--ink2:#C3CAD6;--ink3:#97A2B3;--navy:#0F2547;--navy-2:#163562;--navy-q:#9DB0CF;--gold:#E0B25A;--gold-bg:#3A2F17;--gold-ink:#F0CC7A;--good:#73D2A0;--good-bg:#173626;--warn:#EBC36A;--warn-bg:#3A2F17;--bad:#F0968D;--bad-bg:#3C1F1C;--info:#8DBBEF;--info-bg:#18304C;--code:#AEB7F5;--code-bg:#262C4A;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161E;--surf:#1A2029;--surf2:#222A36;--surf3:#2A3340;--line:#343D4B;--ink:#E9ECF1;--ink2:#C3CAD6;--ink3:#97A2B3;--navy:#0F2547;--navy-2:#163562;--navy-q:#9DB0CF;--gold:#E0B25A;--gold-bg:#3A2F17;--gold-ink:#F0CC7A;--good:#73D2A0;--good-bg:#173626;--warn:#EBC36A;--warn-bg:#3A2F17;--bad:#F0968D;--bad-bg:#3C1F1C;--info:#8DBBEF;--info-bg:#18304C;--code:#AEB7F5;--code-bg:#262C4A;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:21px}h2{font-size:17px}h3{font-size:14.5px}
p{margin:0}
/* top bar */
.top{background:var(--navy);color:var(--navy-ink);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;min-height:50px;padding-block:6px}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em;color:#fff;text-decoration:none}
.org{font-family:var(--serif);font-size:16px;color:#fff}
.mods{display:flex;gap:4px;flex-wrap:wrap}
.mods button{background:none;border:0;color:var(--navy-q);padding:4px 9px;border-radius:5px;font-weight:600;font-size:12.5px;cursor:pointer}
.mods button.on{background:rgba(255,255,255,.14);color:#fff}
.tread{color:#fff;text-decoration:none;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tread .n{background:var(--gold);color:#1B1400;border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:700}
.tacts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tacts select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:3px 6px;font-size:12.5px}
.tacts select option{color:#000}
.tacts button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.mock{background:var(--gold-bg);color:var(--gold-ink);border-bottom:1px solid var(--line);font-size:12.5px;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* frame */
.frame{display:flex;min-height:calc(100vh - 80px)}
.rail{flex:none;width:216px;background:var(--surf);border-right:1px solid var(--line);padding:16px 10px 16px max(12px,env(safe-area-inset-left,0px))}
.rail .ws{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:0 8px}
.rail .wsn{font-weight:700;padding:2px 8px 10px;display:flex;gap:8px;align-items:center}
.rail .wsn i{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--navy),var(--gold));display:inline-block}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 7px 7px 0;padding:6px 9px;color:var(--ink2);font-weight:600;cursor:pointer}
.rail nav button:hover{background:var(--surf2);color:var(--ink)}
.rail nav button.on{background:var(--gold-bg);border-left-color:var(--gold);color:var(--ink)}
.rail .sep{border-top:1px solid var(--line);margin:12px 8px 10px}
.rail .tagline{font-size:11.5px;color:var(--ink3);padding:4px 9px 0}
.main{flex:1;min-width:0;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1120px;margin:0 auto}
.page.narrow{max-width:860px}
@media (max-width:820px){.frame{flex-direction:column}.rail{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}.rail nav{flex-direction:row;flex-wrap:wrap;gap:4px}.rail nav button{border-left:0;border-radius:99px;border:1px solid var(--line);padding:4px 10px;font-size:13px}.rail nav button.on{border-color:var(--gold)}.rail .ws,.rail .wsn,.rail .sep,.rail .tagline{display:none}}
/* header strip */
.ph{background:linear-gradient(100deg,var(--navy),var(--navy-2) 60%,#2B5A9B);color:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.ph h1{color:#fff;font-family:var(--serif);font-weight:600;font-size:22px}
.ph .sub{color:var(--navy-q);font-size:13px;flex-basis:100%}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ph .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.ph .btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1400}
/* bits */
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;min-width:0}
.card.flat{background:var(--surf2)}
.card>h2,.card>h3{margin-bottom:8px}
.h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin:0 0 5px}
.hint{font-size:12.5px;color:var(--ink3)}
.btn{background:var(--surf);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surf2)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.dark:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1400}
.btn.quiet{border-color:transparent;background:none;color:var(--info)}
.btn.danger{color:var(--bad)}
.btn.ai{border-style:dashed;border-color:var(--code);color:var(--code);background:var(--code-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;line-height:1.5}
.good{background:var(--good-bg);color:var(--good)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}.grey{background:var(--surf2);color:var(--ink2)}.goldp{background:var(--gold-bg);color:var(--gold-ink)}.navyp{background:var(--navy);color:#fff}
.code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--code);background:var(--code-bg);padding:1px 6px;border-radius:5px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.amber{border-style:dashed;border-color:var(--gold);color:var(--gold-ink);background:var(--gold-bg);cursor:default}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surf)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th{background:var(--surf2);color:var(--ink3);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:first-child td{border-top:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--gold-bg)}
tr.subrow td{background:var(--surf2)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.tile b{font-size:24px;display:block;font-variant-numeric:tabular-nums;line-height:1.1}.tile span{font-size:12.5px;color:var(--ink3)}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.cols>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border-bottom:0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:10px 0 14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:7px 13px;color:var(--ink3);font-weight:600;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--ink)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:6px;font-weight:600;font-size:13px;color:var(--ink3);cursor:pointer}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{border-left:3px solid var(--gold);background:var(--gold-bg);color:var(--gold-ink);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin:10px 0}
.note.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.note.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.note.info{border-color:var(--info);background:var(--info-bg);color:var(--info)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink3);font-size:13.5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px;margin-top:8px}
.form label,.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.form .wide{grid-column:1/-1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surf);color:var(--ink);font-size:13.5px;font-weight:400;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:7px;background:var(--surf3);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--good)}.bar.w i{background:var(--gold)}.bar.b i{background:var(--bad)}
.steps-strip{display:flex;gap:0;border:1px solid var(--line);border-radius:99px;background:var(--surf);overflow-x:auto;margin:10px 0 12px}
.steps-strip button{flex:1;display:flex;gap:8px;align-items:center;border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--ink2);white-space:nowrap;border-right:1px solid var(--line)}
.steps-strip button:last-child{border-right:0}
.steps-strip .c{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surf2);color:var(--ink2);flex:none}
.steps-strip .c.done{background:var(--good-bg);color:var(--good)}.steps-strip .c.next{background:var(--gold);color:#1B1400}
.steps-strip b{display:block;font-size:13px;color:var(--ink)}.steps-strip small{display:block;font-size:11.5px;color:var(--ink3)}
.steps-strip .nx{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--gold-ink);background:var(--gold-bg);padding:0 5px;border-radius:4px}
.lc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.lc span{padding:4px 11px;border-radius:99px;background:var(--surf2);color:var(--ink3);font-weight:600;font-size:13px}
.lc span.done{background:var(--good-bg);color:var(--good)}.lc span.on{background:var(--navy);color:#fff}
.steprow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.steprow:last-child{border-bottom:0}
.ord{display:flex;flex-direction:column;align-items:center;gap:2px}.ord button{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:11px;padding:0}
.ord .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px}
.ord .n.t{background:var(--surf3);color:var(--ink2)}
.tbadge{font-size:10px;font-weight:700;letter-spacing:.07em;padding:1px 6px;border-radius:4px;background:var(--surf3);color:var(--ink2)}
.tbadge.d{background:var(--gold-bg);color:var(--gold-ink)}.tbadge.s{background:var(--good-bg);color:var(--good)}
.steprow .l{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steprow .meta{font-size:12.5px;color:var(--ink3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gap{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 7px;border-radius:99px}
.ok{font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-bg);padding:1px 7px;border-radius:99px}
.hoff{font-size:11.5px;font-weight:700;color:var(--gold-ink);background:var(--gold-bg);border:1px dashed var(--gold);padding:1px 7px;border-radius:99px;cursor:pointer}
.proposed{border:1.5px dashed var(--code);background:var(--code-bg);border-radius:9px;padding:9px 12px;margin:8px 0}
.proposed .t{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--code)}
.edit{border:1px solid var(--gold);border-radius:10px;padding:12px 14px;background:var(--surf);margin:8px 0;box-shadow:var(--shadow)}
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surf)}
svg{display:block;max-width:none}
svg text{font-family:var(--sans)}
.raci td.cell{text-align:center;cursor:pointer;font-weight:700;font-size:14px;user-select:none;min-width:70px}
.raci td.cell:hover{background:var(--gold-bg)}
.raci .R{color:var(--info)}.raci .A{color:var(--good)}.raci .C{color:var(--gold-ink)}.raci .I{color:var(--ink3)}
.raci td.cell.sug{outline:1.5px dashed var(--code);outline-offset:-3px;color:var(--code)}
.raci td.cell .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);vertical-align:top;margin-left:2px}
.raci tr.skip td{text-decoration:line-through;color:var(--ink3)}
.find{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surf)}
.find.hi{background:var(--bad-bg);border-color:transparent}.find.md{background:var(--warn-bg);border-color:transparent}.find.lo{background:var(--surf2)}
.find .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.find .b{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surf);border:1px solid var(--line);color:var(--ink2)}
.dots{display:inline-flex;gap:3px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--surf3);border:1px solid var(--line);cursor:pointer}.dots i.f{background:var(--navy);border-color:var(--navy)}
.dots.c i.f{background:var(--gold);border-color:var(--gold)}.dots.r i.f{background:var(--bad);border-color:var(--bad)}
.wts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px}.wts label{font-size:12.5px;color:var(--ink2);display:block}.wts label b{float:right;color:var(--ink)}.wts input[type=range]{width:100%;accent-color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.col{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px}.col h3{display:flex;justify-content:space-between;align-items:center}
.pc{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:8px}.pc b{display:block}.pc small{color:var(--ink3);font-size:12px}
.segs{display:flex;gap:3px;margin:7px 0 3px}.segs i{flex:1;height:7px;border-radius:3px;background:var(--surf3)}.segs i.f{background:var(--good)}
.dd{position:relative;display:inline-block}.panel{position:absolute;z-index:6;top:36px;left:0;width:min(360px,calc(100vw - 40px));background:var(--surf);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px}
.panel .pr{display:flex;gap:8px;align-items:center;padding:4px 2px;font-size:13px}.panel .pr.sub{padding-left:24px}
.panel .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:12.5px}
.rails .rl{padding:10px 4px 12px;border-bottom:1px solid var(--line);overflow:hidden}.rails .rl:last-child{border-bottom:0}
.rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rh b{font-size:14px}
.track{position:relative;height:46px;margin:8px 48px 0}.track::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.bead{position:absolute;top:3px;width:14px;height:14px;border:2.5px solid var(--navy);border-radius:50%;background:var(--surf)}.bead.ms{background:var(--gold);border-color:var(--gold)}
.bead small{position:absolute;top:16px;left:-30px;width:90px;font-size:10.5px;color:var(--ink3);line-height:1.2;text-align:center}
.cards{display:flex;flex-wrap:wrap;gap:12px;padding:12px;background:repeating-linear-gradient(0deg,transparent 0 19px,var(--line) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--line) 19px 20px);background-color:var(--surf);border:1px solid var(--line);border-radius:9px}
.pcard{width:210px;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:9px 11px;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:grab}
.pcard.deep{box-shadow:0 0 0 2px var(--gold)}.pcard.branch{border:1.5px dashed var(--gold)}
.pcard .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.vc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.vcol{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.vcol h4{display:flex;gap:6px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:2px 4px 8px}
.vcol h4 i{width:10px;height:10px;border-radius:50%;display:inline-block}
