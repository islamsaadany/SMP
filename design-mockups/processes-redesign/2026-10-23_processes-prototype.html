:root{

  --line:#D6DCE5; --line-soft:#E6EAF0; --field-line:#78899F;
  --ink:#171B22; --ink-2:#414A58; --ink-3:#636C79;
  --panel:#16325C; --panel-ink:#FFFFFF; --panel-quiet:#B7C4D8; --panel-accent:#E6C65C; --panel-hover:#24487A;
  --gold:#C9A24D; --gold-deep:#8A6B22; --on-accent:#16325C; --focus:#8A6B22; --stone:#16325C;
  --good:#2E7D5B; --good-tx:#1F6248; --good-bg:#E4F0EA;
  --attn:#B8860B; --attn-tx:#7A5D1C; --attn-bg:#F7EFD6;
  --bad:#B04434; --bad-tx:#8C3327; --bad-bg:#F7E3E0;
  --over-bg:#FBF6E9; --over-line:#D9C489;
  --brand:#0F6B63; --brand-ink:#FFFFFF; --brand-to:#3E7F8F;
  --scrim:rgba(10,14,22,.45); --ring:rgba(15,23,42,.12); --shadow:0 10px 28px rgba(15,23,42,.16);
  --sans:'Source Sans 3',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;
  --arabic:'Noto Naskh Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--over-bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0}
.num{font-variant-numeric:tabular-nums}
[lang="ar"]{font-family:var(--arabic)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── the drawing band: the mockup's own controls, never the product ───── */
.mk{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--over-bg);border-bottom:1px dashed var(--over-line)}
.mk-in{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.mk-id{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.mk-id b{font-size:14px}
.mk-id span{font-size:12px;color:var(--ink-2)}
.mk-tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);border:1px dashed var(--gold-deep);border-radius:4px;padding:1px 6px}
.mk-ctl{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.mk-btn{border:1px solid var(--over-line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.mk-btn:hover{color:var(--ink)}
.mk-btn.on{background:var(--panel);border-color:var(--panel);color:var(--panel-ink)}
.mk-btn .dn{font-size:9px}
.mk-look{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep)}
.mk-look select{font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;border:1px solid var(--over-line);border-radius:6px;background:var(--surface);color:var(--ink);padding:3px 6px;max-width:230px}
.mk-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:35;width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px dashed var(--over-line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px}
.mk-pop h4{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
.mk-pop p.note{margin-bottom:8px}
.opt-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13px;align-items:start}
.opt-row:first-of-type{border-top:0}
.opt-row input{margin-top:3px;accent-color:var(--panel)}
.opt-row small{display:block;font-size:11.5px;color:var(--ink-3)}
.opt-row .d{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--gold-deep);margin-right:4px}

.doc{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}

/* ── the product frame ───────────────────────────────────────────── */
.frame{background:var(--ground);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgb(15 23 42/.06);position:relative;min-height:70vh}
.tb{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;min-height:40px;position:relative;z-index:6}
.trail{display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0;font-size:13.5px;white-space:nowrap}
.trail .ff{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.trail .sep{color:var(--ink-3)}
.trail .step{position:relative}
.trail .step>button{border:0;background:none;padding:3px 7px;border-radius:7px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.trail .step>button:hover{background:var(--surface-2)}
.trail .client>button{color:var(--ink-2)}
.tstep{border:0;background:none;padding:3px 7px;border-radius:7px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.tstep:hover,.tstep[aria-expanded="true"]{background:var(--surface-2)}
.trail .brandname{font-weight:600;font-size:14px}
.trail .org{color:var(--ink-3)}
.dn{font-size:9px;color:var(--ink-3)}
.tbread{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:3px 8px;border-radius:7px;text-decoration:none;border:0;background:none}
.tbread:hover,.tbread.on{background:var(--surface-2)}
.tbn{font-size:11.5px;font-weight:700;background:var(--over-bg);border:1px solid var(--gold);border-radius:99px;padding:0 7px;line-height:18px;white-space:nowrap}
.tbacts{display:flex;align-items:center;gap:10px}
.tbwho{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.tbtheme{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}
.tbtheme svg{width:14px;height:14px}
.tbout{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
@media (max-width:700px){.trail .ff,.trail .ff+.sep,.tbwho{display:none}.tb{padding:0 14px}}

.sb{background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:24px;padding:0 20px;overflow-x:auto}
.sb a{display:flex;align-items:center;gap:6px;padding:12px 1px 10px;border-bottom:3px solid transparent;font-size:14.5px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.sb a:hover{color:var(--ink)}
.sb a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.sb .cnt{font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;background:var(--bad-bg);color:var(--bad-tx);line-height:17px}
.sb .lang,.side .lang{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sb .lang{margin-left:auto}
.lang button{border:0;background:none;padding:2px 4px;border-radius:4px;color:var(--ink-3)}
.lang button.on{color:var(--ink);font-weight:700}
@media (max-width:700px){.sb{padding:0 14px;gap:18px}}

/* option B for the menu: down the left side */
.body{display:flex;align-items:stretch;min-width:0}
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .ws{padding:0 8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.side .ws b{display:block;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:2px}
.side a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;box-shadow:inset 3px 0 0 transparent}
.side a:hover{background:var(--surface-2);color:var(--ink)}
.side a.on{background:var(--surface-2);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--gold)}
.side .lang{margin-top:14px;padding:12px 8px 0;border-top:1px solid var(--line)}
@media (max-width:900px){.body{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line)}.side .ws,.side .lang{display:none}.side a{white-space:nowrap}}

.pg{padding:20px 24px 32px;min-width:0;flex:1}
@media (max-width:640px){.pg{padding:16px 14px 24px}}

.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:16px}
.phead.brand{background:linear-gradient(120deg,var(--brand),var(--brand-to));color:var(--brand-ink);border-radius:10px;padding:14px 18px;align-items:center}
.phead.brand .crumb,.phead.brand .sub{color:var(--brand-ink);opacity:.82}
.crumb{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}
.phead h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.phead .sub{font-size:13px;color:var(--ink-3);margin-top:2px;max-width:80ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;text-decoration:none;line-height:1.35}
.btn:hover{border-color:var(--gold);color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-accent);font-weight:700}
.btn.gold:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--panel-ink)}
.btn.navy{background:var(--panel);border-color:var(--panel);color:var(--panel-ink)}
.btn.danger{color:var(--bad-tx);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--on-fill,#fff)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{border-color:var(--line)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line)}
.btn.gold[disabled]:hover{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.pen{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.pen:hover{border-color:var(--gold)}
.lnk{font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;cursor:pointer}
.lnk:hover{color:var(--ink)}
.x{border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{background:var(--surface-2);color:var(--ink)}

.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px 0;text-align:left}
.menu.left{left:0;right:auto}
.menu a,.menu .mi{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 14px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer}
.menu a:hover,.menu .mi:hover{background:var(--surface-2)}
.menu small{display:block;font-size:11.5px;color:var(--ink-3)}
.menu .rule{height:1px;background:var(--line);margin:4px 0}
.menu .here{font-weight:700}
.menu .mh{padding:6px 14px 2px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.menu .mi.bad{color:var(--bad-tx)}
.menu label.mi{display:flex;gap:8px;align-items:center}

/* cells, sections, tables */
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.cells.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.cells{grid-template-columns:repeat(2,minmax(0,1fr))}.cells.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.cells,.cells.c3{grid-template-columns:1fr}}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 15px;min-width:0}
.cell .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cell .v{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.cell .v small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.cell .w{font-size:12px;color:var(--ink-3);margin-top:2px}
.cell .w .bad{color:var(--bad-tx);font-weight:600}
.cell.attn .v{color:var(--attn-tx)}
.cell.bad .v{color:var(--bad-tx)}
.cell.good .v{color:var(--good-tx)}
button.cell{text-align:left;cursor:pointer}
button.cell:hover{border-color:var(--field-line)}

.sect{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.sect span{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.sect .r{margin-left:auto;display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0}
.gap{height:18px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse}
table.t thead th{background:var(--panel);color:var(--panel-ink);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:9px 12px;white-space:nowrap}
table.t tbody td{border-top:1px solid var(--line-soft);padding:10px 12px;vertical-align:top;font-size:13.5px}
table.t tbody td+td{border-left:1px solid var(--line-soft)}
table.t tbody tr:nth-child(even) td{background:var(--zebra)}
table.t tbody tr.hov{cursor:pointer}
table.t tbody tr.hov:hover td{background:var(--over-bg)}
table.t tbody tr.sel td{background:var(--over-bg)}
table.t td.c,table.t th.c{text-align:center}
table.t td.r,table.t th.r{text-align:right}
table.t .q,.q{color:var(--ink-3)}
table.t tr.sub td{font-size:13px}
table.t tr.more td{text-align:center;color:var(--ink-3);font-size:12.5px;background:var(--surface)}
table.t tr.prop td{background:var(--attn-bg)!important;border-top:1px dashed var(--attn)}
table.t tfoot td{border-top:1px solid var(--line);padding:9px 12px;font-size:12.5px;color:var(--ink-3);background:var(--surface)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .acts{justify-content:center;margin-top:12px}

.code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--stone);white-space:nowrap}
.pname{font-weight:700;text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
.pname:hover{border-bottom-color:var(--gold)}
.psub{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.psub.br{color:var(--attn-tx)}
.psub.bad{color:var(--bad-tx);font-weight:600}
.psub.attn{color:var(--attn-tx)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-bg);color:var(--good-tx)}
.pill.attn{background:var(--attn-bg);color:var(--attn-tx)}
.pill.bad{background:var(--bad-bg);color:var(--bad-tx)}
.pill.navy{background:var(--panel);color:var(--panel-ink)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap;text-decoration:none}
.chip.gold{border-color:var(--gold);background:var(--over-bg);color:var(--gold-deep)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-tx)}
.chip.attn{border-color:var(--attn);background:var(--attn-bg);color:var(--attn-tx)}
.chip.good{border-color:var(--good);background:var(--good-bg);color:var(--good-tx)}
.chip.navy{border-color:var(--panel);background:var(--panel);color:var(--panel-ink)}
.chip.dash{border-style:dashed}
a.chip:hover{box-shadow:0 0 0 2px var(--ring)}

.marks{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}
.marks i{width:10px;height:10px;border-radius:2px;border:1px solid var(--field-line);display:inline-block}
.marks i.on{background:var(--good);border-color:var(--good)}
.marks b{font-size:12px;font-weight:700;margin-left:5px;font-variant-numeric:tabular-nums}
.seg6{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;height:7px;border-radius:3px;overflow:hidden;margin:6px 0 4px}
.seg6 i{background:var(--surface-2);border:1px solid var(--line)}
.seg6 i.on{background:var(--good);border-color:var(--good)}

.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;border-radius:6px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--panel);color:var(--panel-ink)}
.seg button .c{font-size:11px;opacity:.75;margin-left:4px}
.seg button.empty-tab{color:var(--ink-3);font-style:italic}

.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;max-width:420px;display:flex;align-items:center;gap:8px;border:1px solid var(--field-line);border-radius:6px;background:var(--surface);padding:6px 10px}
.search input{border:0;background:none;outline:0;width:100%;min-width:0}
.search svg{width:14px;height:14px;color:var(--ink-3);flex:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fchip b{font-variant-numeric:tabular-nums;margin-left:3px;color:var(--ink-3)}
.fchip.on{background:var(--panel);border-color:var(--panel);color:var(--panel-ink)}
.fchip.on b{color:var(--panel-quiet)}
.fchip.bad b{color:var(--bad-tx)}
.fold{border:0;background:none;width:18px;height:18px;padding:0;margin-right:4px;border-radius:4px;color:var(--ink-3);font-size:11px;vertical-align:1px}
.fold:hover{background:var(--surface-2);color:var(--ink)}
.dots{border:1px solid transparent;background:none;border-radius:5px;padding:0 7px;font-size:16px;line-height:22px;color:var(--ink-3)}
.dots:hover{border-color:var(--line);color:var(--ink)}

/* forms */
.frm{display:grid;gap:12px}
.frm.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.frm.two{grid-template-columns:1fr}}
.frm .full{grid-column:1/-1}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld>span em{font-style:normal;color:var(--bad-tx);margin-left:2px}
.fld>small{font-size:11.5px;color:var(--ink-3)}
.fld input[type=text],.fld input[type=email],.fld input[type=number],.fld input[type=date],.fld input:not([type]),.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--field-line);border-radius:6px;background:var(--surface);padding:6px 9px;font-size:13.5px;min-width:0}
.fld textarea{min-height:72px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--focus);outline-offset:0}
.fld .err{font-size:12px;color:var(--bad-tx);font-weight:600}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.checks input{accent-color:var(--panel)}
.range{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center}
.range input{accent-color:var(--gold);width:100%}
.range b{text-align:right;font-variant-numeric:tabular-nums}
.banner{border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.banner.attn{background:var(--attn-bg);border-color:var(--attn);color:var(--attn-tx)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-tx)}
.banner.good{background:var(--good-bg);border-color:var(--good);color:var(--good-tx)}
.banner b{font-weight:700}

/* overview */
.ovgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.ovgrid{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:11px 14px;border-top:1px solid var(--line-soft)}
.att:first-child{border-top:0}
.att .what{font-size:13.5px}
.att .what .w2{display:block;font-size:12px;color:var(--ink-3)}
@media (max-width:560px){.att{grid-template-columns:1fr}.att .btn{justify-self:start}}
.dd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 14px;border-top:1px solid var(--line-soft);align-items:center;cursor:pointer}
.dd:first-child{border-top:0}
.dd:hover{background:var(--over-bg)}
.dd .asp{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink-3)}
.dd .asp .ok{color:var(--good-tx)}
.feed{padding:4px 14px}
.feed ul{padding:0}
.feed li{list-style:none;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink-2)}
.feed li:first-child{border-top:0}
.feed time{display:inline-block;min-width:64px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* the process: rail + pane */
.pwrap{display:flex;gap:16px;align-items:flex-start;position:relative}
.rail{width:262px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:sticky;top:60px}
.rail-h{background:var(--panel);color:var(--panel-ink);padding:10px 12px 10px 14px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rail-h .n{color:var(--panel-quiet)}
.rail-h button{margin-left:auto;border:0;background:none;color:var(--panel-accent);padding:2px 4px;border-radius:4px;line-height:0}
.rail-h button svg{width:15px;height:15px}
.rail-s{padding:10px 10px 8px}
.rail-s .search{max-width:none;padding:5px 9px;font-size:13px}
.rail-l{padding:0 10px 10px;display:grid;gap:6px;max-height:min(640px,62vh);overflow-y:auto}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.ri:hover{border-color:var(--field-line)}
.ri .code{font-size:10.5px;color:var(--ink-2)}
.ri .nm{grid-column:1;font-size:13.5px;line-height:1.3}
.ri .fr{grid-row:1/3;grid-column:2;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.ri .fr.good{color:var(--good-tx)}.ri .fr.attn{color:var(--attn-tx)}.ri .fr.bad{color:var(--bad-tx)}
.ri.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--gold)}
.ri.on .nm{font-weight:700}
.ri.sub{margin-left:18px;width:calc(100% - 18px);padding:5px 10px}
.ri.sub .nm{font-size:13px}
.rail-f{border-top:1px solid var(--line);background:var(--surface-2);padding:8px 14px;font-size:12px;color:var(--ink-3)}
.railbtn{display:none}
.pwrap.railoff .rail{display:none}
.pwrap.railoff .railbtn{display:inline-flex}
@media (max-width:900px){.pwrap{flex-direction:column;align-items:stretch}.rail{width:100%;position:static}.rail-l{max-height:220px}}

.pane{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pane-h{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--gold);border-bottom:1px solid var(--line);padding:14px 18px 12px;border-radius:10px 10px 0 0}
.pane-h.brand{background:linear-gradient(120deg,var(--brand),var(--brand-to));color:var(--brand-ink);box-shadow:none}
.pane-h.brand .code,.pane-h.brand .who em,.pane-h.brand .rdl,.pane-h.brand .next,.pane-h.brand .q{color:var(--brand-ink)}
.ph1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ph1 .code{font-size:14px}
.ph1 h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.who{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px}
.who em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.ph2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px}
.rdl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rdl b{color:inherit;font-size:13px;letter-spacing:0;text-transform:none;margin-left:4px}
.pane-h:not(.brand) .rdl b{color:var(--ink)}
.rdm{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--good);background:var(--surface);color:var(--good-tx);border-radius:99px;padding:2px 10px 2px 7px;font-size:12.5px;font-weight:600}
.rdm::before{content:"✓";font-size:11px;font-weight:800}
.rdm.no{border-color:var(--attn);background:var(--attn-bg);color:var(--attn-tx)}
.rdm.no::before{content:"○"}
.rdm:hover{box-shadow:0 0 0 2px var(--ring)}
.next{font-size:12.5px;color:var(--ink-2)}
.next a{font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.ph3{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.pane-b{padding:16px 18px 20px}
@media (max-width:640px){.pane-h{padding:12px 14px}.pane-b{padding:14px}}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.two,.three{grid-template-columns:1fr}}
.blk{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;min-width:0}
.blk-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.lbl .n{color:var(--ink-3);font-weight:700;margin-left:4px}
.blk-h>.pen,.blk-h>.btn,.blk-h>.r{margin-left:auto}
.blk p,.blk li{font-size:13.5px}
.blk ul{padding-left:18px;display:grid;gap:3px}
.blk .none{color:var(--ink-3);font-style:italic}
.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin:0}
.dl dt{color:var(--ink-3);font-size:12.5px}
.dl dd{margin:0;min-width:0}
.dl .miss{color:var(--attn-tx);font-weight:600}
.flow{display:grid;gap:6px}
.flow div{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.arrow{color:var(--ink-3)}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles span{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;background:var(--zebra)}
.roles span b{font-weight:700}
.note{font-size:12px;color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.good{background:var(--good)}
.bar i.bad{background:var(--bad)}
.bar i.attn{background:var(--attn)}

/* map */
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mapbar .r{margin-left:auto;display:flex;gap:6px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
.mapgrid.nodrawer{grid-template-columns:minmax(0,1fr)}
@media (max-width:1150px){.mapgrid{grid-template-columns:1fr}}
.lanes-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:640px}
.lanes{position:relative;display:grid}
.lane-bg{grid-column:1/-1;border-top:1px solid var(--line-soft)}
.lane-bg.first{border-top:0}
.lane-bg.z{background:var(--zebra)}
.lane-l{grid-column:1;display:flex;align-items:center;padding:10px 12px;background:var(--surface-2);border-right:1px solid var(--line);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);z-index:1;position:sticky;left:0}
.st{position:relative;z-index:2;align-self:center;justify-self:center;width:150px;text-align:left;border:1.5px solid var(--field-line);background:var(--surface);border-radius:8px;padding:7px 10px 8px}
.st:hover{border-color:var(--stone)}
.st .n{display:block;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.st b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.st .k{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.st.dec{border-style:dashed;border-color:var(--stone)}
.st.ends{border-radius:999px;width:110px;text-align:center;background:var(--surface-2)}
.st.prop{border:1.5px dashed var(--attn);background:var(--attn-bg)}
.st.on{box-shadow:0 0 0 3px var(--gold)}
.st .flag{position:absolute;top:-9px;right:8px}
.st .ho{position:absolute;bottom:-10px;left:8px}
svg.edges{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
svg.edges path{fill:none;stroke:var(--ink-3);stroke-width:1.5}
svg.edges path.dash{stroke-dasharray:4 3}
svg.edges .ah{fill:var(--ink-3)}
svg.edges text{font:600 11px var(--sans);fill:var(--ink-2)}
svg.edges rect{fill:var(--surface)}
.drawer{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;position:sticky;top:60px}
.drawer-h{padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.drawer-h .n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3)}
.drawer-h h3{font-size:16px;font-weight:700}
.drawer-h .x{margin-left:auto}
.drawer-b{padding:12px 14px;display:grid;gap:10px;max-height:min(560px,60vh);overflow-y:auto}
.drawer-b .dl{grid-template-columns:100px minmax(0,1fr);font-size:13px}
.drawer-b .part p{font-size:13px;margin-top:3px}
.drawer-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* raci */
.rc{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:5px;font-size:11.5px;font-weight:800;border:1px solid transparent;background:none;padding:0}
button.rc{cursor:pointer}
button.rc:hover{box-shadow:0 0 0 2px var(--ring)}
.rc.R{background:var(--panel);color:var(--panel-ink)}
.rc.A{background:var(--gold);color:var(--on-accent)}
.rc.C{border-color:var(--field-line);color:var(--ink-2)}
.rc.I{background:var(--surface-2);color:var(--ink-3)}
.rc.x{color:var(--ink-3);font-weight:400}
.rc.sug{border:1.5px dashed var(--gold);color:var(--gold-deep);background:var(--over-bg)}
.rc.dot::after{content:"";position:absolute}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.issues{display:grid;gap:4px;margin-bottom:10px}
.issues div{font-size:13px;color:var(--bad-tx);display:flex;gap:6px}
.issues div::before{content:"!";font-weight:800;width:16px;height:16px;border-radius:50%;background:var(--bad-bg);display:inline-grid;place-items:center;font-size:11px;flex:none;margin-top:2px}

/* lifecycle */
.track{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.track span{padding:3px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3);font-weight:600}
.track span.done{color:var(--good-tx);border-color:var(--good)}
.track span.done::before{content:"✓ "}
.track span.now{background:var(--panel);border-color:var(--panel);color:var(--panel-ink)}
.track i{color:var(--ink-3);font-style:normal}
.signs{display:grid;gap:6px}
.signs div{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;font-size:13px;align-items:center}
.signs em{font-style:normal;color:var(--ink-3);font-size:12px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--mono);font-size:12px;background:var(--zebra);border:1px solid var(--line);border-radius:5px;padding:4px 8px;user-select:all;overflow-wrap:anywhere}

/* side panels and dialogs */
#layer:empty{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.dlg.wide{width:min(820px,100%)}
.dlg-h{display:flex;align-items:flex-start;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:17px;font-weight:700}
.dlg-h p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:16px 18px;overflow-y:auto;display:grid;gap:12px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .l{margin-right:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet .dlg-b{flex:1}
.aif{padding:11px 0;border-top:1px solid var(--line-soft);display:grid;gap:6px;font-size:13px}
.aif:first-child{border-top:0;padding-top:0}
.aif .acts{gap:6px}
.aif.done{opacity:.55}

/* document pages (SOP, report, sign-off) */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;max-width:860px;margin:0 auto;padding:40px 48px;box-shadow:0 1px 3px rgb(15 23 42/.06)}
@media (max-width:640px){.paper{padding:22px 18px}}
.paper h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.paper h2{font-size:15px;font-weight:700;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.paper h3{font-size:13.5px;font-weight:700;margin:12px 0 4px}
.paper p,.paper li{font-size:13.5px}
.paper .miss{color:var(--bad-tx);font-weight:700}
.paper .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
@media (max-width:640px){.paper .meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.paper .meta div{font-size:12.5px}
.paper .meta em{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.paper ol.steps{padding-left:0;list-style:none;display:grid;gap:10px}
.paper ol.steps li{border:1px solid var(--line-soft);border-radius:6px;padding:9px 12px}
.paper .sig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:28px}
.paper .sig div{border-top:1px solid var(--ink-3);padding-top:6px;font-size:12px;color:var(--ink-3)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:860px;margin:0 auto 12px}
.toolbar .r{margin-left:auto;display:flex;gap:8px}

/* priorities */
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:16px}
@media (max-width:760px){.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps4 button{border:0;border-left:1px solid var(--line);background:none;text-align:left;padding:10px 14px;box-shadow:inset 0 3px 0 transparent}
.steps4 button:first-child{border-left:0}
.steps4 button b{display:block;font-size:13.5px}
.steps4 button span{font-size:12px;color:var(--ink-3)}
.steps4 button.on{background:var(--surface-2);box-shadow:inset 0 3px 0 var(--gold)}
.dotsc{display:inline-flex;gap:3px}
.dotsc button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--field-line);background:var(--surface);padding:0}
.dotsc.imp button.on{background:var(--stone);border-color:var(--stone)}
.dotsc.cx button.on{background:var(--gold);border-color:var(--gold)}
.dotsc.rk button.on{background:var(--bad);border-color:var(--bad)}
.dotsc button[disabled]{cursor:default}
.sugg{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;max-width:22ch}
.sugg button{border:0;background:none;padding:0;color:var(--gold-deep);font-weight:700;font-size:11px;text-decoration:underline}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.col-h b{font-size:13.5px}
.col-h .n{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.col .timing{width:100%;border:1px dashed transparent;background:none;font-size:12px;color:var(--ink-3);padding:2px 4px;border-radius:4px;margin-bottom:8px}
.col .timing:hover,.col .timing:focus{border-color:var(--field-line);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--field-line)}
.card b{font-size:13.5px}
.card .s{font-size:11.5px;color:var(--ink-3)}
.bubble svg{width:100%;height:auto;display:block}
.bubble .ax{stroke:var(--line);stroke-width:1}
.bubble .q1{fill:var(--over-bg)}
.bubble text{font:600 11px var(--sans);fill:var(--ink-3)}
.bubble .ql{font-size:11.5px;fill:var(--ink-2)}
.bubble circle{stroke-width:1.5;cursor:pointer}
.bubble circle.w1{fill:var(--stone);stroke:var(--stone)}
.bubble circle.w2{fill:var(--gold);stroke:var(--gold)}
.bubble circle.later{fill:var(--ink-3);stroke:var(--ink-3)}
.bubble circle.high{fill:var(--line);stroke:var(--field-line)}
.bubble circle.none{fill:var(--surface);stroke:var(--field-line);stroke-dasharray:3 2}
.bubble circle.sel{stroke:var(--bad);stroke-width:3}

/* landscape */
.vc{display:grid;gap:10px}
.vc-primary{display:grid;gap:8px}
.vc-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:stretch}
@media (max-width:700px){.vc-row{grid-template-columns:1fr}}
.vc-lab{background:var(--panel);color:var(--panel-ink);border-radius:6px;padding:8px 10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center}
.vc-lab.sup{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.vc-cells{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px}
.chev{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
@media (max-width:900px){.chev{grid-template-columns:1fr}}
.chev>div{background:var(--surface);border:1px solid var(--line);padding:10px 22px 10px 14px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,10px 50%);min-height:120px}
.chev>div:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
@media (max-width:900px){.chev>div,.chev>div:first-child{clip-path:none;border-radius:6px;min-height:0}}
.chev h4{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.chev .pc{display:block;margin-bottom:5px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer;text-align:left;max-width:100%}
.pchip:hover{border-color:var(--gold)}
.pchip .code{font-size:10.5px}
.pchip.deep{box-shadow:inset 3px 0 0 var(--gold)}
.lgrid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:56px 40px;padding:22px;min-width:820px}
.lnode{position:relative;z-index:2;background:var(--surface);border:1.5px solid var(--field-line);border-radius:8px;padding:9px 11px;text-align:left;cursor:pointer}
.lnode:hover{border-color:var(--stone)}
.lnode.deep{border-color:var(--gold)}
.lnode b{display:block;font-size:13.5px}
.lnode .s{font-size:11.5px;color:var(--ink-3)}
.rails{display:grid;gap:10px}
.railrow{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:760px){.railrow{grid-template-columns:1fr}}
.railline{position:relative;display:flex;align-items:center;gap:0;overflow-x:auto;padding:14px 4px 6px}
.railline::before{content:"";position:absolute;left:10px;right:10px;top:23px;height:2px;background:var(--line)}
.ms{position:relative;flex:1 0 96px;text-align:center;font-size:11.5px;color:var(--ink-2);padding:0 4px}
.ms i{display:block;width:14px;height:14px;border-radius:50%;margin:3px auto 6px;background:var(--surface);border:2px solid var(--field-line);position:relative;z-index:1}
.ms.dec i{border-radius:3px;transform:rotate(45deg);width:12px;height:12px}
.ms.ho i{background:var(--gold);border-color:var(--gold)}

<script>

   action (data-act) and the action changes state and calls render(). Nothing
   leaves the page: this is a drawing that behaves, not the product. */
'use strict';

const TODAY = new Date('2026-10-23T09:00:00');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dt(iso, withYear) {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T09:00:00' : ''));
  return String(d.getDate()).padStart(2, '0') + ' ' + MONTHS[d.getMonth()] + (withYear === false ? '' : ' ' + d.getFullYear());
}
const dshort = (iso) => dt(iso, false);
const todayIso = () => TODAY.toISOString().slice(0, 10);
function daysFrom(iso) { return Math.round((new Date(iso + 'T09:00:00') - TODAY) / 86400000); }

const money = (n) => '$' + Number(n).toLocaleString('en-US');

/* the options the team is comparing (the drawing's own switches) */
const OPT = { nav: 'top', brand: false, rail: true, oldTabs: false, marksAll: true, landscape: true, aiPanel: true };
/* per-viewer screen state: never product data */
const UI = { route: ['overview'], look: 'office', menu: null, layer: null, railHidden: null, sel: {}, f: {}, open: {}, msg: null };

/* ── routing ───────────────────────────────────────────────────────── */
const R = {};          // R.name = (args) => html, registered by each screen file
const AFTER = [];      // post-render hooks for one render (map arrows and the like)
function routeToken() { return UI.route.join('~'); }
function go(route, opts) {
  UI.route = Array.isArray(route) ? route.slice() : String(route).split('~');
  UI.menu = null; UI.layer = null; UI.msg = null;
  if (!opts || !opts.keep) UI.sel = {};

function render() {
  const a = document.activeElement, keepId = a && a.id, caret = keepId && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;

  $('#layer').innerHTML = UI.layer ? UI.layer() : '';

  if (keepId) { const el = document.getElementById(keepId); if (el) { el.focus(); if (caret && el.setSelectionRange) try { el.setSelectionRange(caret[0], caret[1]); } catch (e) {} } }

function screen() {
  const name = UI.route[0];
  if (name === 'review') return (R['review'] || (() => ''))(UI.route.slice(1));
  if (UI.look !== 'office') return staffScreen();
  const fn = R[name] || R.overview;
  return frame(fn(UI.route.slice(1)), name);

/* an open menu floats above everything, so a table or the frame never clips it */
function positionMenus() {
  $$('#app .menu').forEach((m) => {
    const b = m.parentNode.querySelector('[data-act="menu"]'); if (!b) return;
    const r = b.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;

/* ── dialogs, side sheets, toasts ─────────────────────────────────── */
function dialog(o) {

    '<div class="dlg-h"><div><h3 id="dlg-t">' + o.title + '</h3>' + (o.sub ? '<p>' + o.sub + '</p>' : '') + '</div><button class="x" type="button" data-act="close" aria-label="Close">×</button></div>' +
    '<div class="dlg-b">' + (typeof o.body === 'function' ? o.body() : o.body) + '</div>' +
    (o.foot ? '<div class="dlg-f">' + (typeof o.foot === 'function' ? o.foot() : o.foot) + '</div>' : '') + '</div></div>';

    '<div class="dlg-h"><div><h3 id="sh-t">' + o.title + '</h3>' + (o.sub ? '<p>' + o.sub + '</p>' : '') + '</div><button class="x" type="button" data-act="close" aria-label="Close">×</button></div>' +
    '<div class="dlg-b">' + (typeof o.body === 'function' ? o.body() : o.body) + '</div>' +
    (o.foot ? '<div class="dlg-f">' + (typeof o.foot === 'function' ? o.foot() : o.foot) + '</div>' : '') + '</aside>';

/* ── form helpers ─────────────────────────────────────────────────── */

const inp = (id, v, o) => '<input type="' + ((o && o.type) || 'text') + '" id="' + id + '" value="' + esc(v) + '"' + (o && o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o && o.ro ? ' readonly' : '') + (o && o.max ? ' maxlength="' + o.max + '"' : '') + (o && o.min != null ? ' min="' + o.min + '"' : '') + '>';

    opts.map((x) => { const v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x, d = Array.isArray(x) && x[2]; return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + (d ? ' disabled' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>';

/* measured elbow arrows between boxes: used by the map and the landscape */
function drawArrows(container, svg, edges) {
  if (!container || !svg || !container.offsetParent) return;
  const o = container.getBoundingClientRect();
  let out = '<defs><marker id="ah-' + svg.id + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0 0 8 4 0 8z"/></marker></defs>', labels = '';
  edges.forEach((ed) => {
    const A = document.getElementById(ed.from), B = document.getElementById(ed.to);
    if (!A || !B) return;
    const a = A.getBoundingClientRect(), b = B.getBoundingClientRect();
    const ax = a.left - o.left + container.scrollLeft, ay = a.top - o.top + container.scrollTop, bx = b.left - o.left + container.scrollLeft, by = b.top - o.top + container.scrollTop;
    let d, lx, ly;
    if (Math.abs((ax + a.width / 2) - (bx + b.width / 2)) < 12) {
      const x = ax + Math.round(a.width * 0.32), down = by > ay, y1 = down ? ay + a.height : ay, y2 = down ? by - 2 : by + b.height + 2;
      d = 'M' + x + ' ' + y1 + 'V' + y2; lx = x + 6; ly = (y1 + y2) / 2;
    } else if (bx > ax) {
      const sx = ax + a.width, sy = ay + a.height / 2, ex = bx - 2, ey = by + b.height / 2, mx = Math.round(sx + Math.min(26, (ex - sx) / 2));
      d = Math.abs(sy - ey) < 2 ? 'M' + sx + ' ' + sy + 'H' + ex : 'M' + sx + ' ' + sy + 'H' + mx + 'V' + ey + 'H' + ex;
      lx = mx + 5; ly = Math.abs(sy - ey) < 2 ? sy - 7 : (sy + ey) / 2 + 4;
    } else {
      const sx = ax + a.width / 2, sy = ay + a.height, ex = bx + b.width / 2, ey = by + b.height, low = Math.max(sy, ey) + 22;
      d = 'M' + sx + ' ' + sy + 'V' + low + 'H' + ex + 'V' + (ey + 2); lx = (sx + ex) / 2; ly = low - 5;
    }
    out += '<path d="' + d + '"' + (ed.dash ? ' class="dash"' : '') + ' marker-end="url(#ah-' + svg.id + ')"/>';
    if (ed.label) { const w = ed.label.length * 5.7 + 8; labels += '<rect x="' + (lx - 3) + '" y="' + (ly - 11) + '" width="' + w + '" height="15" rx="3"/><text x="' + lx + '" y="' + ly + '">' + esc(ed.label) + '</text>'; }
  });
  svg.innerHTML = out + labels;
}

/* ══ RULES ══════════════════════════════════════════════════════════════
   The module's own rules, restated for the drawing so every screen agrees:
   the six readiness marks, the six step gaps, who acknowledges, the score,
   the code. Pure functions over S; no DOM here. */
const roleById = (id) => S.roles.find((r) => r.id === id);
const roleName = (id) => (roleById(id) || { name: 'Unassigned' }).name;
const personById = (id) => S.people.find((p) => p.id === id);
const personName = (id) => (personById(id) || { name: '' }).name;
const liveRoles = () => S.roles.filter((r) => !r.archived);
const livePeople = () => S.people.filter((p) => !p.archived);
const procs = () => S.processes.filter((p) => !p.deleted);
const byCode = (code) => S.processes.find((p) => p.code === code);
const mains = () => procs().filter((p) => !p.parent || !byCode(p.parent) || byCode(p.parent).deleted).sort((a, b) => a.code.localeCompare(b.code));
const subsOf = (code) => procs().filter((p) => p.parent === code).sort((a, b) => a.code.localeCompare(b.code));
const stepById = (p, id) => p.steps.find((s) => s.id === id);
const workSteps = (p) => p.steps.filter((s) => s.type === 'TASK' || s.type === 'DECISION');
const stepNo = (p, id) => p.steps.findIndex((s) => s.id === id) + 1;

const STATUS = { DRAFT: 'Draft', IN_REVIEW: 'In review', APPROVED: 'Approved', PUBLISHED: 'Published', RETIRED: 'Retired' };
const DEC = { W1: 'Wave 1', W2: 'Wave 2', LATER: 'Later', HIGH: 'Stays high-level' };
const isDeep = (p) => p.prio.dec === 'W1' || p.prio.dec === 'W2';
const inForce = (p) => p.versions.filter((v) => v.published).sort((a, b) => b.n - a.n)[0] || null;
const latestVersion = (p) => p.versions.slice().sort((a, b) => b.n - a.n)[0] || null;
const overdue = (p) => p.status === 'PUBLISHED' && p.nextReview && daysFrom(p.nextReview) < 0;
function statusPill(p) {
  if (overdue(p)) return '<span class="pill bad">Review overdue</span>';
  const v = latestVersion(p), tone = { PUBLISHED: 'good', APPROVED: 'good', IN_REVIEW: 'attn', RETIRED: '', DRAFT: '' }[p.status];
  return '<span class="pill ' + tone + '">' + STATUS[p.status] + (v && p.status !== 'DRAFT' ? ' · v' + (p.status === 'IN_REVIEW' ? v.n + 1 : v.n) : '') + '</span>';
}

/* the six marks, read off the process; nobody ticks them */
function marks(p) {
  return [
    { label: 'Map', done: workSteps(p).length + p.steps.filter((s) => s.type !== 'TASK' && s.type !== 'DECISION').length >= 3, tab: 'map' },
    { label: 'RACI', done: p.raci.final, tab: 'raci' },
    { label: 'Authority', done: p.auth.rules.length > 0, tab: 'authority' },
    { label: 'Controls', done: p.controls.length > 0, tab: 'risks' },
    { label: 'SOP', done: !!(p.doc.version && p.doc.version.trim()), tab: 'lifecycle' },
    { label: 'Approved', done: p.status === 'APPROVED' || p.status === 'PUBLISHED', tab: 'lifecycle' },
  ];
}
const marksDone = (p) => marks(p).filter((m) => m.done).length;
function nextMissing(p) {
  const m = marks(p).find((x) => !x.done);
  if (!m) return null;
  return { Map: ['map', 'map at least three steps'], RACI: ['raci', 'finish the RACI and mark it final'], Authority: ['authority', 'set who approves and when work escalates'], Controls: ['risks', 'record a risk and its control'], SOP: ['lifecycle', 'record the SOP version and effective date'], Approved: ['lifecycle', p.status === 'IN_REVIEW' ? 'wait for ' + personName(p.approver) + ' to approve' : 'send it for review and approval'] }[m.label];
}
function marksHtml(p, withNum) {
  if (!OPT.marksAll && !isDeep(p)) return '<span class="q">High-level</span>';
  if (!p.steps.length) return '<span class="q">Not mapped</span>';
  return '<span class="marks" title="' + marks(p).map((m) => m.label + (m.done ? ' ✓' : '')).join(' · ') + '">' + marks(p).map((m) => '<i' + (m.done ? ' class="on"' : '') + '></i>').join('') + (withNum !== false ? '<b>' + marksDone(p) + '/6</b>' : '') + '</span>';
}

/* RACI */
const raciKey = (rowId, roleId) => rowId + '|' + roleId;
function raciRows(p) {
  const rows = workSteps(p).filter((s) => !p.raci.acts.some((a) => a.step === s.id)).map((s) => ({ id: s.id, label: s.label, type: s.type, step: s.id, act: false }));
  p.raci.acts.forEach((a) => rows.push({ id: a.id, label: a.name, type: 'ACTIVITY', step: a.step, act: true }));
  return rows;
}
function raciRowIssue(p, rowId) {
  if (p.raci.skip.indexOf(rowId) >= 0) return null;
  const letters = Object.keys(p.raci.cells).filter((k) => k.indexOf(rowId + '|') === 0).map((k) => p.raci.cells[k]);
  const a = letters.filter((l) => l === 'A').length, r = letters.filter((l) => l === 'R').length;
  if (a === 0) return 'no accountable';
  if (a > 1) return 'two accountables';
  if (r === 0) return 'no responsible';
  return null;
}
const raciIssues = (p) => raciRows(p).map((r) => ({ row: r, issue: raciRowIssue(p, r.id) })).filter((x) => x.issue);
function raciCols(p) {
  const used = new Set();
  Object.keys(p.raci.cells).forEach((k) => { if (p.raci.cells[k]) used.add(k.split('|')[1]); });
  p.steps.forEach((s) => { if (s.role) used.add(s.role); (s.support || []).forEach((r) => used.add(r)); });
  p.raci.pinned.forEach((r) => used.add(r));
  const ids = liveRoles().map((r) => r.id).filter((id) => used.has(id));
  return ids.length ? ids : liveRoles().map((r) => r.id);
}

/* authority */
const DIR = { gt: 'More than', gte: 'At or above', lt: 'Below', lte: 'At or below', none: 'No rule at all' };
const whoName = (w) => (!w ? '' : w.type === 'role' ? roleName(w.id) : personName(w.id));
function ruleDone(r) { return r.dir === 'none' || (r.value !== '' && r.value != null && !!r.who); }
function ruleSentence(r) {
  if (r.dir === 'none') return 'No approval required — this step proceeds on its own.';
  const v = r.on === 'money' ? money(r.value || 0) : plural(Number(r.value || 0), 'day');
  if (r.then === 'approval') return r.who ? DIR[r.dir] + ' ' + v + ' needs approval from ' + whoName(r.who) + '.' : 'Needs approval, but nobody is assigned.';
  return r.who ? DIR[r.dir] + ' ' + v + ' without a decision escalates to ' + whoName(r.who) + '.' : 'Escalates, but nobody is assigned.';
}
const rulesFor = (p, sid) => p.auth.rules.filter((r) => r.step === sid);
function slaDays(p, sid) { const r = rulesFor(p, sid).find((x) => x.on === 'time' && x.dir !== 'none'); return r ? Number(r.value) : null; }
function gateLine(p, sid) { const r = rulesFor(p, sid).find((x) => x.on === 'money' && x.dir !== 'none'); return r ? DIR[r.dir] + ' ' + money(r.value) : ''; }

/* the six step gaps, the same words the Steps list uses */
function stepGaps(p, s) {
  if (s.type !== 'TASK' && s.type !== 'DECISION') return [];
  const g = [];
  const incoming = p.conn.some((c) => c.to === s.id) || p.ext.some((x) => x.step === s.id);
  if (!incoming && p.steps[0] !== s) g.push('no predecessor');
  const ri = raciRowIssue(p, s.id);
  if (ri && !p.raci.acts.some((a) => a.step === s.id)) g.push(ri);
  const rs = rulesFor(p, s.id);
  if (!rs.length && p.auth.skip.indexOf(s.id) < 0) g.push('no approver');
  if (rs.some((r) => !ruleDone(r))) g.push('an unfinished rule');
  return g;
}
const GAP_SENTENCE = {
  'no predecessor': 'Nothing connects into this step — say which step comes before it.',
  'no accountable': 'No role is accountable for this step — assign an A in the RACI Matrix.',
  'two accountables': 'Two roles are accountable — keep one A in the RACI Matrix.',
  'no responsible': 'Nobody is responsible — assign an R in the RACI Matrix.',
  'no approver': 'No authority rule — add one, or mark the task as needing no approval.',
  'an unfinished rule': 'A rule has no figure or nobody to carry it.',
};

/* who is asked to read and confirm: people holding a role a step is given to */
function expectedReaders(p) {
  const roles = new Set(p.steps.map((s) => s.role).filter(Boolean));
  return livePeople().filter((x) => x.reg && x.roles.some((r) => roles.has(r)));
}

/* the score out of 100 and the rank */
function score(p) {
  const s = p.prio, w = S.plan.weights;
  if (!s.imp || !s.cx || !s.risk) return null;
  const tot = w.imp + w.risk + w.cx;
  if (!tot) return null;
  return Math.round(((s.imp * w.imp + s.risk * w.risk + s.cx * w.cx) / tot) * 20);
}
function ranked() {
  const list = procs().map((p) => ({ p, score: score(p) }));
  list.sort((a, b) => {
    if (a.score == null && b.score == null) return a.p.code.localeCompare(b.p.code);
    if (a.score == null) return 1; if (b.score == null) return -1;
    return b.score - a.score || (b.p.prio.risk - a.p.prio.risk) || (b.p.prio.imp - a.p.prio.imp) || a.p.code.localeCompare(b.p.code);
  });
  let n = 0;
  return list.map((x) => Object.assign(x, { rank: x.score == null ? null : ++n }));
}
const rankOf = (p) => (ranked().find((x) => x.p === p) || {}).rank || null;
function suggestCx(p) {
  if (!p.steps.length) return null;
  const dec = p.steps.filter((s) => s.type === 'DECISION').length, ho = p.steps.reduce((n, s) => n + s.links.length, 0) + p.ext.length, roles = new Set(p.steps.map((s) => s.role).filter(Boolean)).size, n = p.steps.length;
  const v = Math.max(1, Math.min(5, Math.round(n / 3 + dec + ho / 2 + roles / 3 - 1)));
  return { v, why: plural(n, 'step') + ', ' + plural(dec, 'decision') + ', ' + plural(ho, 'hand-over') + ', ' + plural(roles, 'role') };
}
function suggestRisk(p) {
  if (!p.controls.length) return null;
  const hi = p.controls.filter((c) => c.level === 'High').length, md = p.controls.filter((c) => c.level === 'Medium').length;
  return { v: hi >= 2 ? 5 : hi === 1 ? 4 : md ? 3 : 2, why: plural(p.controls.length, 'risk') + ' logged, ' + hi + ' high' };
}

/* the code: first three letters of the name, then the next number from 100 */
function nextCode(name, parentCode) {
  let prefix;
  if (parentCode) prefix = parentCode.replace(/\d+$/, '');
  else { const w = (name.trim().split(/\s+/)[0] || 'NEW').replace(/[^A-Za-z]/g, '').toUpperCase(); prefix = (w + 'XXX').slice(0, 3); }
  const used = S.processes.filter((p) => p.code.replace(/\d+$/, '') === prefix).map((p) => Number(p.code.slice(prefix.length)) || 0);
  return prefix + (used.length ? Math.max.apply(null, used) + 1 : 100);
}

/* the swimlane layout: a lane per role, a column per depth of the flow */
function layout(p) {
  const lanes = [];
  p.steps.forEach((s) => { const k = s.role || '_'; if (lanes.indexOf(k) < 0) lanes.push(k); });
  const depth = {}, order = p.steps.map((s) => s.id);
  order.forEach((id) => { depth[id] = 0; });
  for (let pass = 0; pass < order.length; pass++) {
    p.conn.forEach((c) => {
      if (order.indexOf(c.from) < 0 || order.indexOf(c.to) < 0) return;
      if (order.indexOf(c.to) <= order.indexOf(c.from)) return;   // a loop back is drawn, not laid out
      if (depth[c.to] < depth[c.from] + 1) depth[c.to] = depth[c.from] + 1;
    });
  }
  const taken = {}, pos = {};
  order.forEach((id) => {
    const s = stepById(p, id), lane = lanes.indexOf(s.role || '_');
    let col = depth[id];
    while (taken[lane + ':' + col]) col++;
    taken[lane + ':' + col] = 1; pos[id] = { lane, col };
  });
  const cols = Math.max(1, ...Object.values(pos).map((x) => x.col + 1));
  return { lanes, pos, cols };
}

/* what deleting would take out of view */
function deleteImpact(p) {
  const cellsN = Object.keys(p.raci.cells).filter((k) => p.raci.cells[k]).length;
  const parts = [[p.steps.length, 'step'], [cellsN, 'RACI assignment'], [p.auth.rules.length, 'authority rule'], [p.kpis.length, 'KPI']].filter((x) => x[0]).map((x) => plural(x[0], x[1]));
  const orphans = subsOf(p.code).length, branchers = procs().filter((x) => x.branchFrom && x.branchFrom.code === p.code).length;
  return { parts, orphans, branchers };
}

function rail(p, tab) {

function editSync() {

ACT.stepSave = () => {
  editSync();
  const p = CUR, e = UI.f.edit;
  if (!e.label) { toast('A step needs a name.'); return; }
  let s;
  if (e.isNew) {
    s = { id: uid('s'), milestone: false, support: [], note: '', phase: null };
    const at = e.after ? p.steps.findIndex((x) => x.id === e.after) + 1 : p.steps.length;
    p.steps.splice(at, 0, s);
  } else s = stepById(p, e.id);
  Object.assign(s, { label: e.label, type: e.type, role: e.role, actions: e.actions, inputs: e.inputs, output: e.output, risk: e.risk, errors: e.errors, links: e.links, requiresAll: e.requiresAll });
  if (!e.isNew) s.phase = e.phase;
  p.conn = p.conn.filter((c) => c.to !== s.id && !(e.type === 'DECISION' && c.from === s.id));
  e.preds.filter((x) => x.from).forEach((x) => p.conn.push({ from: x.from, to: s.id, label: x.label }));
  if (e.type === 'DECISION') e.branches.filter((b) => b.to).forEach((b) => p.conn.push({ from: s.id, to: b.to, label: b.label }));
  p.ext = p.ext.filter((x) => x.step !== s.id).concat(e.ext.filter((x) => x.key).map((x) => ({ step: s.id, code: x.key.split('|')[0], stepId: x.key.split('|')[1], label: x.label })));
  UI.sel.step = s.id; UI.layer = null; UI.f.edit = null; toast(e.isNew ? 'Step added.' : 'Step saved.'); render();
};

/* ── RACI ─────────────────────────────────────────────────────────── */
const CYCLE = { '': 'R', R: 'A', A: 'C', C: 'I', I: '' };
function tabRaci(p) {
  const rows = raciRows(p), cols = raciCols(p), issues = raciIssues(p), fin = p.raci.final, sug = UI.f.sug || {};
  if (!rows.length) return '<div class="box"><div class="empty"><b>Map the steps first</b>Every task and decision on the map becomes a row here.<div class="acts">' + goBtn(openP(p.code, 'map'), 'Go to the map') + '</div></div></div>';
  const bar = '<div class="filters">' + (fin ? '<span class="chip good">Final · ' + dt(p.raci.finalAt) + '</span><button class="btn sm" type="button" data-act="raciReopen">Reopen to change</button>'
      : '<span class="chip">Draft</span><button class="btn sm gold" type="button" data-act="raciFinal"' + (issues.length ? ' disabled title="Give every task one A and at least one R first"' : '') + '>Mark final</button><button class="btn sm" type="button" data-act="raciFill">Fill from step owners</button><button class="btn sm" type="button" data-act="raciSuggest">Suggest</button>' +
        menuBtn('raci-add', '+ Add title', liveRoles().filter((r) => cols.indexOf(r.id) < 0).map((r) => mi(esc(r.name), 'raciPin', 'data-id="' + r.id + '"')).join('') || '<p class="note" style="padding:8px 14px">Every title is already a column.</p>', { cls: 'btn sm', w: 220 })) +
    '<span style="margin-left:auto" class="legend"><span><span class="rc R">R</span> does it</span><span><span class="rc A">A</span> answers for it</span><span><span class="rc C">C</span> is asked</span><span><span class="rc I">I</span> is told</span></span></div>';
  const banner = fin ? '' : issues.length ? '<div class="banner bad">' + plural(issues.length, 'task') + ' missing an Accountable or Responsible — finalisation blocked.</div>' : '<div class="banner good">Ready to finalise — every task has exactly one Accountable and at least one Responsible.</div>';
  const body = rows.map((r) => {
    const skipped = p.raci.skip.indexOf(r.id) >= 0, issue = raciRowIssue(p, r.id);
    return '<tr' + (skipped ? ' style="opacity:.55"' : '') + '><td style="' + (issue ? 'box-shadow:inset 3px 0 0 var(--bad);' : '') + 'min-width:220px">' + (skipped ? '<s>' + esc(r.label) + '</s>' : esc(r.label)) + '<span class="psub">' + (r.act ? 'Activity' + (r.step ? ' · step ' + stepNo(p, r.step) : '') : r.type === 'DECISION' ? 'Decision · step ' + stepNo(p, r.id) : 'Step ' + stepNo(p, r.id)) + (issue ? ' · <span style="color:var(--bad-tx);font-weight:600">' + issue + '</span>' : '') + '</span></td>' +
      cols.map((c) => {
        const k = raciKey(r.id, c), v = p.raci.cells[k] || '', sg = !v && sug[k];
        if (skipped) return '<td class="c"><span class="rc x">—</span></td>';
        if (sg) return '<td class="c"><button class="rc sug" type="button" data-act="raciAccept" data-k="' + k + '" title="Suggested from the org chart: the owner\'s manager. Click to accept.">' + sg + '</button></td>';
        return '<td class="c">' + (fin ? '<span class="rc ' + (v || 'x') + '">' + (v || '·') + '</span>' : '<button class="rc ' + (v || 'x') + '" type="button" data-act="raciCycle" data-k="' + k + '" aria-label="' + esc(r.label) + ', ' + esc(roleName(c)) + ': ' + (v || 'empty') + '">' + (v || '·') + '</button>') + (p.raci.dots.indexOf(k) >= 0 ? '<span style="color:var(--stone);font-size:9px;vertical-align:top">●</span>' : '') + '</td>';
      }).join('') +
      '<td class="r" style="white-space:nowrap">' + (fin ? '' : r.act ? '<button class="btn sm ghost" type="button" data-act="raciDelAct" data-id="' + r.id + '">Delete</button>' : '<button class="btn sm ghost" type="button" data-act="raciSkip" data-id="' + r.id + '">' + (skipped ? 'Skipped ✕' : 'Skip') + '</button>') + '</td></tr>';
  }).join('');
  return bar + banner + '<div class="tw"><table class="t"><thead><tr><th>Task</th>' + cols.map((c) => '<th class="c" style="white-space:normal;min-width:84px">' + esc(roleName(c)) + '</th>').join('') + '<th></th></tr></thead><tbody>' + body + '</tbody></table></div>' +
    (fin ? '<p class="note" style="margin-top:8px">Final. Reopen it to change a letter. PDF and Excel are in Export, in the header.</p>' : '<div class="filters" style="margin-top:12px">' + '<input class="inp" id="raci-act" placeholder="New activity, e.g. Reconcile the statement" style="max-width:340px" data-enter="raciAddAct">' + sel('raci-act-step', [['', 'Freestanding']].concat(workSteps(p).map((s) => [s.id, 'Under step ' + stepNo(p, s.id) + ' ' + s.label])), '') + '<button class="btn sm" type="button" data-act="raciAddAct">Add activity</button><span class="note">Click a cell to cycle R → A → C → I → empty.</span></div>');
}
ACT.raciCycle = (el) => { const p = CUR, k = el.dataset.k, v = p.raci.cells[k] || ''; p.raci.cells[k] = CYCLE[v]; if (!p.raci.cells[k]) delete p.raci.cells[k]; p.raci.dots = p.raci.dots.filter((x) => x !== k); render(); };
ACT.raciFill = () => { const p = CUR; let n = 0; workSteps(p).forEach((s) => { if (!s.role) return; const k = raciKey(s.id, s.role); if (!p.raci.cells[k]) { p.raci.cells[k] = 'R'; p.raci.dots.push(k); n++; } }); toast(n ? n + ' empty cells filled · existing entries untouched' : 'Nothing to fill — every owner already has a letter.'); render(); };
ACT.raciSuggest = () => {
  const p = CUR, sug = {}, cols = raciCols(p);
  raciRows(p).forEach((r) => {
    if (raciRowIssue(p, r.id) !== 'no accountable') return;
    const s = stepById(p, r.step || r.id); if (!s || !s.role) return;
    const holders = livePeople().filter((x) => x.roles.indexOf(s.role) >= 0 && x.mgr), mroles = {};
    holders.forEach((h) => (personById(h.mgr) || { roles: [] }).roles.filter((x) => x !== s.role).forEach((x) => { mroles[x] = (mroles[x] || 0) + 1; }));
    const best = Object.keys(mroles).sort((a, b) => mroles[b] - mroles[a] || a.localeCompare(b))[0];
    if (best && cols.indexOf(best) >= 0 && !p.raci.cells[raciKey(r.id, best)]) sug[raciKey(r.id, best)] = 'A';
  });

function pScore() {

function procEdges() {
  const e = [], seen = {};
  procs().forEach((o) => { if (o.branchFrom && byCode(o.branchFrom.code) && !byCode(o.branchFrom.code).deleted) e.push({ kind: 'branch', from: o.branchFrom.code, to: o.code, step: o.branchFrom.step }); });
  procs().forEach((a) => a.steps.forEach((s) => s.links.forEach((c) => { const b = byCode(c); if (!b || b.deleted) return; const k = a.code + '>' + c; if (seen[k]) { seen[k].steps.push(s.id); return; } seen[k] = { kind: 'link', from: a.code, to: c, steps: [s.id] }; e.push(seen[k]); })));
  procs().forEach((b) => b.ext.forEach((x) => { const a = byCode(x.code); if (!a || a.deleted) return; const k = x.code + '>' + b.code; if (seen[k]) { if (seen[k].steps.indexOf(x.stepId) < 0) seen[k].steps.push(x.stepId); return; } seen[k] = { kind: 'link', from: x.code, to: b.code, steps: [x.stepId] }; e.push(seen[k]); }));
  return e;
}

  const open = G.risks.filter((r) => r.status !== 'Closed');
  const heat = '<div class="heat2"><div class="h" style="font-size:10.5px">Likelihood ↓ Impact →</div>' + IMP.map((i) => '<div class="h">' + i + '</div>').join('') + LIK.slice().reverse().map((l) => '<div class="h">' + l + '</div>' + IMP.map((i) => { const n = open.filter((r) => r.lik === l && r.imp === i).length, lv = riskLevel({ lik: l, imp: i }); return '<button type="button" class="' + { High: 'hi', Medium: 'md', Low: 'lo' }[lv] + (n ? '' : ' zero') + (f && f[0] === l && f[1] === i ? ' on' : '') + '"' + (n ? ' data-act="heat" data-l="' + l + '" data-i="' + i + '"' : ' disabled') + '>' + n + '<small>' + lv + '</small></button>'; }).join('')).join('') + '</div>';
  return '<div class="ovgrid" style="margin-bottom:14px"><div class="blk"><div class="blk-h"><span class="lbl">Risk register</span></div><p>Identified risks, tracked on their own — scored, owned, and carried forward independent of any one checklist run. Filled in by an assessment or added by hand.</p><p class="note" style="margin-top:6px">The level is worked out from likelihood and impact, never typed in.</p></div><div class="blk"><div class="blk-h"><span class="lbl">Heat map — open risks</span></div>' + heat + '</div></div>' +
    (lvl ? '<div class="banner">Showing every open ' + lvl + ' risk across all aspects (' + rows.length + '). <button class="lnk" type="button" data-go="governance~risks">Show all risks</button></div>' : f ? '<div class="banner">Showing ' + plural(rows.length, 'risk') + ' at ' + f[0] + ' likelihood, ' + f[1] + ' impact. <button class="lnk" type="button" data-act="heatClear">Show all risks</button></div>' : '') +
    '<div class="sect">' + plural(rows.length, 'risk') + '<span class="r"><button class="btn sm gold" type="button" data-act="rkAdd">+ Add risk</button></span></div><div class="tw"><table class="t"><thead><tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th>Level</th><th>Owner</th><th>Status</th><th></th></tr></thead><tbody>' +
    (rows.length ? rows.map((r) => { const lv = riskLevel(r), od = r.treat && r.treat.actions.some((a) => !a.done && a.due && daysFrom(a.due) < 0), open2 = UI.open['rk-' + r.id];
      return '<tr><td style="min-width:240px"><b>' + esc(r.title) + '</b><span class="psub">' + (r.aspect ? esc(aspectName(r.aspect)) : 'Added manually') + ' · <button class="lnk" type="button" data-act="treatToggle" data-id="' + r.id + '">' + (open2 ? 'Hide treatment' : 'Treatment') + '</button>' + (od ? ' <span class="chip bad">Overdue treatment</span>' : '') + '</span></td>' +
        '<td>' + sel('rl-' + r.id, LIK, r.lik, { chg: 'rkField', data: 'data-id="' + r.id + '" data-f="lik"' }) + '</td><td>' + sel('ri-' + r.id, IMP, r.imp, { chg: 'rkField', data: 'data-id="' + r.id + '" data-f="imp"' }) + '</td><td><span class="pill ' + { High: 'bad', Medium: 'attn', Low: 'good' }[lv] + '">' + lv + '</span></td><td>' + (r.owner ? esc(r.owner) : '<span class="q">— unassigned</span>') + '</td><td>' + sel('rs-' + r.id, ['Open', 'Mitigating', 'Accepted', 'Closed'], r.status, { chg: 'rkField', data: 'data-id="' + r.id + '" data-f="status"' }) + '</td><td class="r"><button class="x" type="button" data-act="rkDel" data-id="' + r.id + '" aria-label="Delete">×</button></td></tr>' +

    '<div class="filters" style="margin-top:6px"><input class="inp" id="ta-d-' + r.id + '" placeholder="What will be done" style="max-width:300px"><input class="inp" id="ta-o-' + r.id + '" placeholder="Owner" style="max-width:160px"><input class="inp" type="date" id="ta-due-' + r.id + '" style="max-width:160px"><button class="btn sm" type="button" data-act="taAdd" data-id="' + r.id + '">Add action</button></div>';
}

    ['bad', 'Confuses', 'The navigation changes under you', 'On a process\'s page and its map you get the tabs. Open RACI, Authority or AI review and the tabs are gone; the only way back to Risks, Quality or Lifecycle is the strip\'s “Process” step, which lands on Overview first.', 'One header and one row of tabs on every view of a process.', 'p~ORD100~raci'],
