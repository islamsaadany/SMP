:root{
  --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#EFF2F6; --zebra:#F5F7FA; --head:#E4E9F0;
  --line:#D6DCE5; --line-soft:#E6EAF0; --field-line:#78899F;
  --ink:#171B22; --ink-2:#414A58; --ink-3:#636C79;
  --panel:#16325C; --panel-ink:#FFFFFF;
  --gold:#C9A24D; --gold-deep:#8A6B22; --on-accent:#16325C; --focus:#8A6B22; --stone:#16325C;
  --good:#2E7D5B; --good-tx:#1F6248; --good-bg:#E4F0EA;
  --attn:#B8860B; --attn-tx:#7A5D1C; --attn-bg:#F7EFD6;
  --bad:#B04434; --bad-tx:#8C3327; --bad-bg:#F7E3E0;
  --over-bg:#FBF6E9; --over-line:#D9C489;
  --bar:#16325C; --bar-ink:#FFFFFF; --bar-quiet:#B9C2CE; --bar-accent:#E8A33A; --bar-late:#FF9B8F; --bar-hover:rgba(255,255,255,.1);
  --scrim:rgba(10,14,22,.45); --shadow:0 10px 28px rgba(15,23,42,.16);
  --sans:'Source Sans 3',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14161A; --surface:#1C2027; --surface-2:#242932; --zebra:#212630; --head:#2C333E;
  --line:#333A45; --line-soft:#2A303A; --field-line:#68758C;
  --ink:#E9ECF1; --ink-2:#B4BCC8; --ink-3:#949DAA;
  --panel:#0E1014; --panel-ink:#EAF0FA;
  --gold:#D9B665; --gold-deep:#C9A24D; --on-accent:#14161A; --focus:#E6C65C; --stone:#7FA3D8;
  --good:#5FB68C; --good-tx:#8FD3B0; --good-bg:#1B3129;
  --attn:#D9B23C; --attn-tx:#E8CA6A; --attn-bg:#332C16;
  --bad:#D97066; --bad-tx:#E79A93; --bad-bg:#33201E;
  --over-bg:#2A2617; --over-line:#5E4F25;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#14161A; --surface:#1C2027; --surface-2:#242932; --zebra:#212630; --head:#2C333E;
  --line:#333A45; --line-soft:#2A303A; --field-line:#68758C;
  --ink:#E9ECF1; --ink-2:#B4BCC8; --ink-3:#949DAA;
  --panel:#0E1014; --panel-ink:#EAF0FA;
  --gold:#D9B665; --gold-deep:#C9A24D; --on-accent:#14161A; --focus:#E6C65C; --stone:#7FA3D8;
  --good:#5FB68C; --good-tx:#8FD3B0; --good-bg:#1B3129;
  --attn:#D9B23C; --attn-tx:#E8CA6A; --attn-bg:#332C16;
  --bad:#D97066; --bad-tx:#E79A93; --bad-bg:#33201E;
  --over-bg:#2A2617; --over-line:#5E4F25;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--over-bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* the prototype band: who you are looking as, the guide, start over */
.mk{background:var(--over-bg);border-bottom:1px dashed var(--over-line)}
.mk-in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mk-tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);border:1px dashed var(--gold-deep);border-radius:4px;padding:1px 6px}
.mk-id{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-right:auto}
.mk-id b{font-size:14px}
.mk-id span{font-size:12px;color:var(--ink-2)}
.mk-sw{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--over-line);border-radius:8px;flex-wrap:wrap;align-items:center}
.mk-sw>span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);padding:0 6px}

const nameOf = (c) => (byCode(c) || { name: c }).name;

/* the version a person reads, the draft the office edits, and whatever exists at all */
const live = (p) => p.live;
const draftC = (p) => (p.draft ? p.draft.c : null);
const anyC = (p) => p.live || draftC(p);
const tasks = (c) => (c ? c.steps.filter((s) => s.type === 'TASK' || s.type === 'DECISION') : []);
const stepById = (c, id) => (c ? c.steps.find((s) => s.id === id) : null);
const stepNo = (c, id) => tasks(c).findIndex((s) => s.id === id) + 1;
const raciOf = (c, sid) => (c.raci[sid] || {});
const rulesOf = (c, sid) => c.auth.filter((r) => r.step === sid);
const ruleText = (r) => (r.kind === 'money' ? 'At or above ' + money(r.n) + ' the ' + roleName(r.role) + ' approves' : 'After ' + plural(r.n, 'day') + ' it goes to the ' + roleName(r.role));
const apprOf = (c, sid) => rulesOf(c, sid).filter((r) => r.kind === 'money').map(ruleText).join('; ');
const timeOf = (c, sid) => rulesOf(c, sid).filter((r) => r.kind === 'time').map(ruleText).join('; ');
const controlsOf = (c, sid) => c.controls.filter((k) => k.step === sid);

function gapsOf(c) {
  if (!c) return [];
  const g = [];
  tasks(c).forEach((s) => {
    const l = Object.values(raciOf(c, s.id)), a = l.filter((x) => x === 'A').length;
    if (!a) g.push({ step: s.id, kind: 'noA', text: 'No one is accountable for this step' });
    else if (a > 1) g.push({ step: s.id, kind: 'twoA', text: 'Two people are accountable for this step' });
    /* the role in the lane does the work; when it is also the accountable one, that counts */
    if (!l.includes('R') && raciOf(c, s.id)[s.role] !== 'A') g.push({ step: s.id, kind: 'noR', text: 'No one is named to do this step' });
  });
  c.controls.forEach((k) => { if (!k.control) g.push({ step: k.step, kind: 'noControl', text: '“' + k.risk + '” has no control' }); });
  return g;
}
/* the six readiness marks: Map, RACI, Authority, Controls, SOP, Approved */
function marksOf(p) {
  const c = anyC(p);
  if (!c) return [0, 0, 0, 0, 0, 0];
  const g = gapsOf(c);
  return [tasks(c).length >= 3 ? 1 : 0, tasks(c).length && !g.some((x) => x.kind !== 'noControl') ? 1 : 0, c.auth.length ? 1 : 0, c.controls.some((k) => k.control) ? 1 : 0, p.live && p.sop ? 1 : 0, p.live || (p.draft && p.draft.state === 'approved') ? 1 : 0];
}
const reviewDays = (p) => (p.nextReview ? daysBetween(TODAY, p.nextReview) : 9999);
function stateOf(p) {
  const d = p.draft;
  if (!anyC(p) || !tasks(anyC(p)).length) return { label: 'Not started', pill: 'q', rank: 6 };
  if (d && d.state === 'returned') return { label: 'Returned by the approver', pill: 'bad', rank: 1 };
  if (d && d.state === 'approved') return { label: 'Approved, ready to publish', pill: 'attn', rank: 2 };
  if (p.live && reviewDays(p) < 0) return { label: 'Review late', pill: 'bad', rank: 2 };
  if (d && d.state === 'in-review') return { label: 'Waiting for approval', pill: 'attn', rank: 3 };
  if (p.live) return { label: 'In force · v' + p.inForce + (d ? ' · draft v' + d.v + ' open' : ''), pill: 'good', rank: d ? 4 : 7 };
  return { label: 'Being drawn', pill: 'q', rank: 5 };
}
/* who has a step: everyone whose role does one of the steps in force */
function readersOf(p) {
  const c = p.live; if (!c) return [];
  const rs = new Set(tasks(c).map((s) => s.role));
  return S.people.filter((x) => !x.office && x.roles.some((r) => rs.has(r))).map((x) => x.id);
}
const myStepsIn = (c, pid) => (c ? tasks(c).filter((s) => person(pid).roles.includes(s.role)) : []);
const changedSteps = (c) => tasks(c).filter((s) => s.changed);
const log = (text) => S.log.unshift([fmt(TODAY), text]);
const doneFor = (pid, text) => { (S.done[pid] = S.done[pid] || []).unshift(text + ' · ' + fmt(TODAY)); };

/* what waits on a person, on the reading side */
function todoFor(pid) {
  const out = [];
  procs().forEach((p) => {
    const d = p.draft;
    if (p.approver === pid && d && d.state === 'in-review') out.push({ kind: 'Approve', code: p.code, what: 'Version ' + d.v + ' is ready for your approval', meta: 'Sent by ' + (d.sentBy || 'the Strategy Office') + ' on ' + fmt(d.sentAt) + (d.note ? ' · ' + d.note : ''), why: 'You approve this process.', act: 'Open and approve', go: [UI.as, 'p', p.code, 'flow'].join('.') });
    if (p.owner === pid && p.live && reviewDays(p) <= 30) out.push({ kind: 'Review', code: p.code, what: reviewDays(p) < 0 ? 'The yearly review was due on ' + fmt(p.nextReview) : 'The yearly review is due on ' + fmt(p.nextReview), meta: 'Say whether it still describes how the work is done', why: 'You own it.', act: 'Review it', go: [UI.as, 'p', p.code, 'summary'].join('.') });
    if (p.live && readersOf(p).includes(pid) && !p.acks.includes(pid)) {
      const ch = changedSteps(p.live).filter((s) => person(pid).roles.includes(s.role));
      out.push({ kind: 'Read', code: p.code, what: 'Version ' + p.inForce + ' is in force since ' + fmt(p.publishedAt), meta: ch.length ? 'Your step changed: ' + ch.map((s) => s.label).join(', ') : 'Your step: ' + myStepsIn(p.live, pid).map((s) => s.label).join(', '), why: 'You have a step in it.', act: 'Read it', go: [UI.as, 'p', p.code, 'steps'].join('.') });
    }
  });
  S.suggestions.filter((s) => s.by === pid && s.state === 'answered').forEach((s) => {
    const c = anyC(byCode(s.code)), stp = stepById(c, s.step);
    out.push({ kind: 'Answer', code: s.code, what: 'The office answered your suggestion' + (stp ? ' on step ' + stepNo(c, s.step) + ', ' + stp.label : ''), meta: person(s.answer.by).name + ', Strategy Office · ' + fmt(s.answer.at), quote: s.answer.text, why: 'You suggested a change.', act: 'Reply', actName: 'reply', id: s.id });
  });
  if (S.plan.state === 'sent' && S.plan.approver === pid) out.push({ kind: 'Approve', code: 'PLAN', name: 'Deep-dive plan', what: 'The Strategy Office sent the plan for your sign-off', meta: 'Which processes the office takes deep first, and in what order', why: 'You sign off the plan.', act: 'Open the plan', actName: 'planOpen' });
  return out;
}
/* what waits on the office, in the builder */
function handleFor() {
  const out = [];
  S.suggestions.filter((s) => s.state === 'new' || s.state === 'replied').forEach((s) => out.push({ kind: s.state === 'new' ? 'Suggestion' : 'Reply', s }));
  procs().forEach((p) => {
    if (p.draft && p.draft.state === 'returned') out.push({ kind: 'Returned', p });
    if (p.draft && p.draft.state === 'approved') out.push({ kind: 'Approved', p });
  });
  if (S.plan.state === 'returned') out.push({ kind: 'Plan' });
  const drawnGaps = procs().filter((p) => !p.live && anyC(p) && gapsOf(anyC(p)).length);
  if (drawnGaps.length) out.push({ kind: 'Gaps', list: drawnGaps });
  return out;
}
const totalGaps = () => procs().reduce((n, p) => n + gapsOf(anyC(p)).length, 0);

/* ══ FRAME ═════════════════════════════════════════════════════════════
   The prototype band, SMP's top bar, the navy band, the tab bar, and the
   pieces both sides share: pills, marks, the flow drawing and a step's detail. */
const LOOKS = [['hend', 'Hend Mourad', 'owner'], ['yara', 'Yara Kamal', 'approver'], ['dalia', 'Dalia Sabry', 'staff'], ['mona', 'Mona Farag', 'office']];
function protoBand() {
  return '<div class="mk"><div class="mk-in"><div class="mk-id"><span class="mk-tag">Prototype</span><b>Processes, rethought</b><span>Nothing is built. Sample data invented for Raya Trade.</span></div>' +
    '<div class="mk-sw" role="group" aria-label="Looking as"><span>Looking as</span>' + LOOKS.map(([k, n, r]) => '<button type="button" class="' + (UI.as === k ? 'on' : '') + '" aria-pressed="' + (UI.as === k) + '" data-go="' + k + '.' + home(k) + '">' + n.split(' ')[0] + ' <small>' + r + '</small></button>').join('') + '</div>' +
    '<button class="mk-b" type="button" data-act="guide">Try this</button><button class="mk-b" type="button" data-act="startOver">Start over</button></div></div>';
}
function topBar() {
  const n = isOffice() ? handleFor().length : todoFor(meId()).length;
  return '<div class="tb"><div class="tb-in"><span class="brand">Raya Trade</span><button class="mod" type="button" data-go="' + UI.as + '.' + home(UI.as) + '">Processes' + (n ? ' <span class="n">' + n + '</span>' : '') + '</button><span class="who">' + esc(me().name) + '</span>' + (isOffice() ? '<span class="seat">Strategy Office</span>' : '') + '<button class="out" type="button" data-act="toast" data-msg="Signing out is not part of this prototype.">Sign out</button></div></div>';
}
ACT.toast = (el) => toast(el.dataset.msg);
const page = (inner) => topBar() + '<div class="pg">' + inner + '</div>';
const tiles = (t) => t.map(([n, l, c]) => '<div class="mtile ' + (c || '') + '"><b>' + n + '</b><span>' + l + '</span></div>').join('');
function mast({ eyebrow, title, sub, acts, tiles: tl, wait, extra }) {
  return '<header class="mast"><div class="mrow"><div style="min-width:0"><p class="wkof">' + eyebrow + '</p><h1>' + title + '</h1>' + (sub ? '<p class="msub">' + sub + '</p>' : '') + (wait ? '<p class="mwait"><b>Waiting on you</b>' + wait + '</p>' : '') + '</div>' +
    '<div class="mside"><div class="macts">' + (acts || '') + '</div><div class="mstrip">' + (tl || '') + '</div></div></div>' + (extra || '') + '</header>';
}
/* the tab bar under the band; a section's own views can ride along under it */
function tabBar(list, cur, sub) {
  return '<div class="vtbar"><div class="vt" role="tablist" aria-label="Views">' + list.map(([k, l, n, hot, g]) => '<button type="button" role="tab" class="' + (k === cur ? 'on' : '') + '" aria-selected="' + (k === cur) + '" data-go="' + g + '">' + l + (n ? ' <span class="ct' + (hot ? ' hot' : '') + '">' + n + '</span>' : '') + '</button>').join('') + '</div>' + (sub ? '<div class="vtsub">' + sub + '</div>' : '') + '</div>';
}
const pill = (k, t) => '<span class="pill ' + k + '">' + esc(t) + '</span>';
const stPill = (p) => { const s = stateOf(p); return pill(s.pill, s.label); };
const pn = (c) => '<span class="code">' + c + '</span> ' + esc(nameOf(c));
const kp = (items) => '<div class="kp">' + items.map(([n, l, c]) => '<div class="' + (c || '') + '"><b>' + n + '</b><span>' + l + '</span></div>').join('') + '</div>';
const marksCell = (p) => '<span class="mk6" title="Map, RACI, Authority, Controls, SOP, Approved">' + ['M', 'R', 'A', 'C', 'S', '✓'].map((L, i) => '<i class="' + (marksOf(p)[i] ? 'on' : '') + '">' + L + '</i>').join('') + '</span>';
const dots = (v) => '<span class="dots" aria-label="' + v + ' of 5">' + '●'.repeat(v) + '<i>' + '●'.repeat(5 - v) + '</i></span>';
const flags = (f) => '<div class="flags">' + f.map(([c, t]) => '<span class="' + c + '">' + esc(t) + '</span>').join('') + '</div>';

/* ── the flow: one lane per role, one column per step ── */
function flowHtml(c, p, opts) {
  const o = opts || {};
  if (!c || !c.steps.length) return '<div class="ph"><b>No steps yet</b>' + (o.edit ? 'Add the first step with + Step.' : 'The office has not drawn this process yet.') + '</div>';
  const lanes = []; c.steps.forEach((s) => { if (lanes.indexOf(s.role) < 0) lanes.push(s.role); });
  const g = o.gaps ? gapsOf(c) : [];
  const sel = o.sel;
  let n = 0;
  const boxes = c.steps.map((s, i) => {
    const isT = s.type === 'TASK' || s.type === 'DECISION';
    if (isT) n += 1;
    const gp = g.filter((x) => x.step === s.id);
    return '<button type="button" class="st' + (s.type === 'DECISION' ? ' dec' : '') + (isT ? '' : ' ends') + (s.id === sel ? ' on' : '') + '" id="fs-' + s.id + '" ' + (isT ? 'data-act="pickStep" data-step="' + s.id + '"' : '') + ' style="grid-row:' + (lanes.indexOf(s.role) + 1) + ';grid-column:' + (i + 2) + '"><span class="n">' + (isT ? 'STEP ' + n : s.type === 'START' ? 'START' : 'END') + '</span><b>' + esc(s.label) + '</b>' + (gp.length ? '<span class="gap" title="' + esc(gp.map((x) => x.text).join('; ')) + '">!</span>' : '') + (o.changes && s.changed ? '<span class="chg">CHANGED</span>' : '') + '</button>';
  }).join('');
  const cols = c.steps.length;
  return '<div class="lanes-wrap"><div class="lanes" data-flow="' + esc(JSON.stringify(c.conn)) + '" style="grid-template-columns:104px repeat(' + cols + ',minmax(116px,1fr));grid-template-rows:repeat(' + lanes.length + ',96px);min-width:' + (104 + cols * 116) + 'px">' +
    lanes.map((r, i) => '<div class="lane-bg' + (i % 2 ? ' z' : '') + '" style="grid-row:' + (i + 1) + '"></div><div class="lane-l" style="grid-row:' + (i + 1) + '">' + esc(roleName(r)) + '</div>').join('') + boxes + '<svg class="edges" aria-hidden="true"></svg></div></div>';
}
/* arrows are measured from the drawn boxes, so they follow any layout */
function drawArrows() {
  $$('.lanes').forEach((L) => {
    if (!L.offsetParent) return;
    const conn = JSON.parse(L.dataset.flow || '[]'), svg = L.querySelector('svg.edges'), o = L.getBoundingClientRect();
    let out = '<defs><marker id="ah-' + (L.id || 'x') + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0 0 8 4 0 8z"/></marker></defs>', lab = '';
    conn.forEach(([f, t, l]) => {
      const A = L.querySelector('#fs-' + f), B = L.querySelector('#fs-' + t); if (!A || !B) return;
      const a = A.getBoundingClientRect(), b = B.getBoundingClientRect();
      let d, lx, ly;
      if (b.left > a.right - 2) {
        const sx = a.right - o.left, sy = a.top - o.top + a.height / 2, ex = b.left - o.left - 2, ey = b.top - o.top + b.height / 2, mx = Math.round(sx + Math.min(22, (ex - sx) / 2));
        d = Math.abs(sy - ey) < 2 ? 'M' + sx + ' ' + sy + 'H' + ex : 'M' + sx + ' ' + sy + 'H' + mx + 'V' + ey + 'H' + ex; lx = mx + 5; ly = (sy + ey) / 2 + 4;
      } else {
        const sx = a.left - o.left + a.width / 2, sy = a.bottom - o.top, ex = b.left - o.left + b.width / 2, ey = b.bottom - o.top + 2, low = Math.max(sy, ey) + 18;
        d = 'M' + sx + ' ' + sy + 'V' + low + 'H' + ex + 'V' + ey; lx = (sx + ex) / 2 - 20; ly = low - 4;
      }
      out += '<path d="' + d + '" marker-end="url(#ah-' + (L.id || 'x') + ')"/>';
      if (l) { const w = l.length * 5.7 + 8; lab += '<rect x="' + (lx - 3) + '" y="' + (ly - 11) + '" width="' + w + '" height="15" rx="3"/><text x="' + lx + '" y="' + ly + '">' + esc(l) + '</text>'; }
    });
    svg.innerHTML = out + lab;
  });
}
AFTER.push(() => requestAnimationFrame(drawArrows));
window.addEventListener('resize', () => requestAnimationFrame(drawArrows));

/* a step's detail, read-only */
function stepRead(c, sid, extra) {
  const s = stepById(c, sid); if (!s) return '<p class="note">Pick a step in the flow.</p>';
  const ks = controlsOf(c, sid), appr = apprOf(c, sid), time = timeOf(c, sid), r = raciOf(c, sid);
  return '<span class="note" style="font-family:var(--mono);font-weight:700">STEP ' + stepNo(c, sid) + (s.type === 'DECISION' ? ' · DECISION' : '') + '</span><h3>' + esc(s.label) + '</h3><dl class="dl"><dt>Done by</dt><dd>' + esc(roleName(s.role)) + '</dd>' + (appr ? '<dt>Approval</dt><dd>' + esc(appr) + '</dd>' : '') + (time ? '<dt>Time limit</dt><dd>' + esc(time) + '</dd>' : '') + (Object.keys(r).length ? '<dt>Involved</dt><dd>' + Object.keys(r).map((k) => r[k] + ' · ' + esc(roleName(k))).join('<br>') + '</dd>' : '') + '</dl>' +
    (s.acts.length ? '<ul style="padding-left:18px;font-size:13px">' + s.acts.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '') + ks.map((k) => k.control ? '<p class="ctl">Control: ' + esc(k.control) + '</p>' : '<p class="ctl bad">“' + esc(k.risk) + '” has no control</p>').join('') + (extra || '');
}
/* a step as a card, for the Steps tab and the Summary */
function stepCard(c, s, n, opts) {
  const o = opts || {};
  const appr = apprOf(c, s.id), time = timeOf(c, s.id), ks = controlsOf(c, s.id);
  const meta = [appr && '<span><em>Approval</em>' + esc(appr) + '</span>', time && '<span><em>Time limit</em>' + esc(time) + '</span>'].filter(Boolean).join('');
  const noCtl = ks.some((k) => !k.control);
  return '<div class="sc" id="' + (o.prefix || 'sc') + '-' + s.id + '"><span class="num">' + n + '</span><div><h3' + (o.compact ? ' data-act="openCard"' : '') + '>' + esc(s.label) + (s.type === 'DECISION' ? ' <span class="chip">Decision</span>' : '') + (noCtl ? ' <span class="chip bad">No control</span>' : '') + (s.changed && o.changes ? ' <span class="chip gold">Changed in v' + o.changes + '</span>' : '') + (o.mine && o.mine.includes(s.role) ? ' <span class="chip navy">Your step</span>' : '') + '</h3><p class="by">Done by: ' + esc(roleName(s.role)) + '</p>' +
    (s.acts.length ? '<ul>' + s.acts.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '') + (meta ? '<div class="meta">' + meta + '</div>' : '') +
    ks.map((k) => '<p class="ctl' + (k.control ? '' : ' bad') + '">Risk: ' + esc(k.risk) + (k.control ? ' · Control: ' + esc(k.control) : ' · no control yet') + '</p>').join('') +
    (o.suggest ? '<div class="sug"><button class="lnk" type="button" data-act="suggest" data-code="' + o.suggest + '" data-step="' + s.id + '">Suggest a change to this step</button></div>' : '') + '</div></div>';
}
ACT.openCard = (el) => el.closest('.sc').classList.toggle('open');

/* ══ THE READING SIDE ══════════════════════════════════════════════════
   What a client's own people see: My processes, To do, Map, All processes,
   and a process page that opens on its flow with Steps and Summary as tabs.
   They see the version in force; an approver also reads the draft sent to them. */
function myParts(pid) {
  const yours = procs().filter((p) => p.owner === pid || p.approver === pid);
  const step = procs().filter((p) => yours.indexOf(p) < 0 && readersOf(p).includes(pid));
  return { yours, step };
}
function readingBand(title, sub) {
  const pid = meId(), t = todoFor(pid), parts = myParts(pid);
  const own = parts.yours.filter((p) => p.owner === pid).length, appr = parts.yours.filter((p) => p.approver === pid).length;
  const noCtl = parts.yours.reduce((n, p) => n + (anyC(p) ? anyC(p).controls.filter((k) => !k.control).length : 0), 0);
  return mast({
    eyebrow: 'Raya Trade · Processes', title,
    sub: sub || esc(me().name) + ' · ' + esc(roleName(me().roles[0])) + ' · <b>' + own + '</b> you own · <b>' + appr + '</b> you approve · <b>' + parts.step.length + '</b> you have a step in',
    wait: t.length && UI.scr !== 'todo' ? '<span>' + plural(t.length, 'thing') + ' waiting</span><button type="button" data-go="' + addr('todo') + '">See them</button>' : '',
    acts: '<button class="bq" type="button" data-go="' + addr('list') + '">Search</button><button class="bgold" type="button" data-act="askNew">Ask for a new process</button>',
    tiles: tiles([[own, 'You own'], [appr, 'You approve'], [t.length, 'Waiting on you', t.length ? 'hot' : ''], [noCtl, 'Risk, no control', noCtl ? 'late' : '']]),
  });
}
function readingTabs(cur) {
  const t = todoFor(meId()).length, n = procs().filter((p) => p.live).length;
  return tabBar([['mine', 'My processes', '', '', addr('mine')], ['todo', 'To do', t || '', true, addr('todo')], ['map', 'Map', '', '', addr('map')], ['list', 'All processes', n, '', addr('list')]], cur);
}
/* the buttons a row carries: whatever waits on this person for this process */
function rowActs(code) {
  return todoFor(meId()).filter((x) => x.code === code).map((x) => x.actName ? '<button class="btn' + (x.kind === 'Approve' ? ' gold' : '') + '" type="button" data-act="' + x.actName + '" data-id="' + (x.id || '') + '">' + esc(x.act) + '</button>' : '<button class="btn' + (x.kind === 'Approve' ? ' gold' : '') + '" type="button" data-go="' + x.go + '">' + esc(x.kind === 'Review' ? 'Review by ' + fmt(byCode(code).nextReview) : x.act) + '</button>').join('');
}
function yourFlags(p) {
  const f = [], c = anyC(p), d = p.draft;
  if (c) { const n = c.controls.filter((k) => !k.control).length; if (n) f.push(['bad', plural(n, 'risk') + ' with no control']); }
  if (p.live) { const r = readersOf(p), a = r.filter((x) => p.acks.includes(x)).length; f.push([a < r.length ? 'warn' : '', a + ' of ' + r.length + ' have read it']); const rd = reviewDays(p); f.push(rd < 0 ? ['bad', 'Review late'] : rd <= 30 ? ['warn', 'Review in ' + plural(rd, 'day')] : ['', 'Review ' + fmt(p.nextReview)]); }
  if (d && d.state === 'draft') f.push(['', 'Draft v' + d.v + ' with the office']);
  if (d && d.state === 'in-review') f.push(['warn', p.approver === meId() ? 'Your approval' : 'With ' + person(p.approver).name]);
  if (d && d.state === 'approved') f.push(['good', 'v' + d.v + ' approved; the office publishes it next']);
  if (d && d.state === 'returned') f.push(['warn', 'v' + d.v + ' sent back to the office']);
  return f;
}

R.mine = () => {

/* every change to a draft goes through here: it can be undone, and it marks what changed */
function edit(fn, msg) {
  const p = bp();
  if (!editable(p)) { toast(p.draft ? 'It is with the approver. Take it back to change it.' : 'Start a draft to change it.'); return; }
  UI.undo.push({ code: p.code, c: clone(p.draft.c) }); if (UI.undo.length > 40) UI.undo.shift();
  fn(p.draft.c, p);
  p.draft.saved = true;
  render(); if (msg) toast(msg);
}
const touch = (p, s) => { if (p.live && s) s.changed = true; };
ACT.undo = () => {
  const p = bp(), i = UI.undo.map((u) => u.code).lastIndexOf(p.code);
  if (i < 0 || !editable(p)) { toast('Nothing to undo.'); return; }
  p.draft.c = UI.undo.splice(i, 1)[0].c; render(); toast('Undone.');
};

/* the next step for this process, on the band and in Lifecycle */
function nextAct(p, cls) {
  const d = p.draft, b = cls || 'bgold';
  if (!d) return '<button class="' + b + '" type="button" data-act="bStart">' + (p.live ? 'Start draft v' + (p.inForce + 1) : 'Start the first draft') + '</button>';
  if (d.state === 'draft' || d.state === 'returned') return '<button class="' + b + '" type="button" data-act="sendAppr">' + (d.state === 'returned' ? 'Send for approval again' : 'Send for approval') + '</button>';
  if (d.state === 'approved') return '<button class="' + b + '" type="button" data-act="publish" data-code="' + p.code + '">Publish v' + d.v + '</button>';
  return '<button class="' + (cls ? 'btn' : 'bq') + '" type="button" data-act="takeBack">Take it back to edit</button>';

function insertStep(c, anchor, type, label, role, edgeLabel, p) {

  else {
    c.steps.splice(ai + 1, 0, s);

    if (g.kind === 'noR') out.push({ step: g.step, text: 'No one is named to do it', why: 'The role in its lane does the work, so it should carry the R.', btn: 'Make the ' + roleName(s.role) + ' responsible', fn: (cc) => { (cc.raci[g.step] = cc.raci[g.step] || {})[s.role] = 'R'; } });
  });

  return out;
}

function secDot(k, p, c) {

  const g = gapsOf(c).filter((x) => x.kind !== 'noControl');
  const word = { noA: 'No one accountable', twoA: 'Two accountable', noR: 'No one doing it' };
  return '<div class="box raci-wrap"><table class="raci"><thead><tr><th>Step</th>' + roles.map((r) => '<th>' + esc(roleName(r)) + '</th>').join('') + '</tr></thead><tbody>' +
    tasks(c).map((s, i) => { const gp = g.filter((x) => x.step === s.id); return '<tr><td' + (gp.length ? ' class="gaprow"' : '') + '>' + (i + 1) + '. ' + esc(s.label) + gp.map((x) => ' <span class="chip bad">' + word[x.kind] + '</span>').join('') + '</td>' + roles.map((r) => { const l = raciOf(c, s.id)[r] || ''; return '<td>' + (ed ? '<button type="button" class="rc ' + (l || 'empty') + '" data-act="cyc" data-step="' + s.id + '" data-role="' + r + '" aria-label="' + esc(roleName(r)) + ' on ' + esc(s.label) + ': ' + (l || 'none') + '">' + l + '</button>' : '<span class="rc ' + (l || 'empty') + '">' + l + '</span>') + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div><p class="note" style="margin-top:8px">One A per step. ' + (ed ? 'Click a cell to change it: none, R, A, C, I. Add a role from a step’s form on Map.' : 'Start a draft to change it.') + '</p>';
}

/* ── Authority ── */
function bAuth(p, c, ed) {
  return '<div class="box tw"><table class="t"><thead><tr><th><span>Step</span></th><th><span>Kind</span></th><th><span>Rule</span></th>' + (ed ? '<th><span><span class="sr">Remove</span></span></th>' : '') + '</tr></thead><tbody>' +
    c.auth.map((x, i) => '<tr><td>' + stepNo(c, x.step) + ' · ' + esc((stepById(c, x.step) || {}).label) + '</td><td>' + (x.kind === 'money' ? 'Approval by amount' : 'Time limit') + '</td><td>' + esc(ruleText(x)) + '</td>' + (ed ? '<td><button class="xdel" type="button" data-act="ruleDel" data-i="' + i + '" aria-label="Remove this rule">×</button></td>' : '') + '</tr>').join('') +
    '</tbody></table>' + (c.auth.length ? '' : '<p class="empty">No rules yet.</p>') + '</div>' + (ed ? '<div class="row3"><button class="btn" type="button" data-act="ruleNew" data-step="">+ Add a rule</button></div>' : '');
}

/* ── Risks & controls ── */
function bRisks(p, c, ed) {
  const lv = [['High', 'High'], ['Medium', 'Medium'], ['Low', 'Low']];
  return '<div class="box tw"><table class="t"><thead><tr><th><span>Step</span></th><th><span>Risk</span></th><th><span>Level</span></th><th><span>Control</span></th><th><span>Last test</span></th>' + (ed ? '<th><span><span class="sr">Remove</span></span></th>' : '') + '</tr></thead><tbody>' +
    c.controls.map((k, i) => '<tr><td>' + stepNo(c, k.step) + ' · ' + esc((stepById(c, k.step) || {}).label) + '</td><td>' + esc(k.risk) + '</td><td>' + (ed ? selD('data-chg="kLvl" data-i="' + i + '" aria-label="Level"', lv, k.level) : pill(k.level === 'High' ? 'bad' : k.level === 'Medium' ? 'attn' : 'q', k.level)) + '</td><td>' + (ed ? '<input data-chg="kCtl" data-i="' + i + '" value="' + esc(k.control) + '" placeholder="No control yet" aria-label="Control">' : k.control ? esc(k.control) : '<span class="ctl bad">None yet</span>') + '</td><td>' + (!k.control ? pill('bad', 'No control') : pill(k.test === 'pass' ? 'good' : k.test === 'fail' ? 'bad' : 'q', k.test === 'pass' ? 'Passed · ' + fmt(k.testedAt) : k.test === 'fail' ? 'Failed · ' + fmt(k.testedAt) : 'Not tested')) + '</td>' + (ed ? '<td><button class="xdel" type="button" data-act="ctlDel" data-i="' + i + '" aria-label="Remove this risk">×</button></td>' : '') + '</tr>').join('') +
    '</tbody></table>' + (c.controls.length ? '' : '<p class="empty">No risks recorded yet.</p>') + '</div>' + (ed ? '<div class="row3"><button class="btn" type="button" data-act="ctlNew" data-step="">+ Add a risk and its control</button></div>' : '');
}
CHG.kLvl = (el) => edit((c) => { c.controls[Number(el.dataset.i)].level = el.value; });
ACT.ctlDel = (el) => edit((c) => { c.controls.splice(Number(el.dataset.i), 1); }, 'Removed.');

/* ── Quality ── */
function bQuality(p, c, ed) {
  const ncs = p.ncs || [];
  return '<div class="sect" style="margin-top:0"><span class="lbl">Measures</span></div><div class="box tw"><table class="t"><thead><tr><th><span>Measure</span></th><th><span>Target</span></th><th><span>How often</span></th>' + (ed ? '<th><span><span class="sr">Remove</span></span></th>' : '') + '</tr></thead><tbody>' +
    c.kpis.map((k, i) => '<tr>' + k.map((v, f) => '<td>' + (ed ? '<input data-chg="kpi" data-i="' + i + '" data-f="' + f + '" value="' + esc(v) + '" aria-label="' + ['Measure', 'Target', 'How often'][f] + '">' : esc(v)) + '</td>').join('') + (ed ? '<td><button class="xdel" type="button" data-act="kpiDel" data-i="' + i + '" aria-label="Remove this measure">×</button></td>' : '') + '</tr>').join('') +
    '</tbody></table>' + (c.kpis.length ? '' : '<p class="empty">No measures yet.</p>') + '</div>' + (ed ? '<div class="row3"><button class="btn" type="button" data-act="kpiAdd">+ Add a measure</button></div>' : '') +
    '<div class="sect"><span class="lbl">Non-conformances</span><span class="note">raised on this process, from the client’s register</span></div>' +
    (ncs.length ? '<div class="box tw"><table class="t"><thead><tr><th><span>Ref</span></th><th><span>What happened</span></th><th><span>Action</span></th><th><span>Owner</span></th><th><span>Raised</span></th><th><span>Status</span></th></tr></thead><tbody>' + ncs.map((n) => '<tr><td><span class="code">' + n.ref + '</span></td><td>' + esc(n.title) + '</td><td>' + esc(n.action) + '</td><td>' + esc(n.owner) + '</td><td>' + fmt(n.raised) + '</td><td>' + pill(n.status === 'Closed' ? 'good' : 'attn', n.status) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="ph"><b>None raised</b>Non-conformances raised against this process show here.</div>');
}
CHG.kpi = (el) => edit((c) => { c.kpis[Number(el.dataset.i)][Number(el.dataset.f)] = el.value.trim(); });
ACT.kpiAdd = () => edit((c) => { c.kpis.push(['New measure', 'Set a target', 'Monthly']); }, 'Measure added. Name it and set its target.');
ACT.kpiDel = (el) => edit((c) => { c.kpis.splice(Number(el.dataset.i), 1); }, 'Removed.');

/* ── Lifecycle ── */
function bLife(p, c) {
  const d = p.draft, rd = readersOf(p), st8 = d ? d.state : 'live';
  const at = { draft: 0, returned: 0, 'in-review': 1, approved: 2, live: 3 }[st8];
  const life = '<div class="life">' + ['Drawing', 'With the approver', 'Approved', 'In force'].map((l, i) => '<span class="' + (i < at ? 'done' : i === at ? 'now' : '') + '">' + l + (i === 0 && d && d.state === 'returned' ? ' · sent back' : '') + '</span>').join('') + '</div>';
  const ppl = S.people.filter((x) => !x.office);
  return life + '<div class="two2"><div class="blk"><span class="lbl">This process</span><dl class="dl"><dt>In force</dt><dd>' + (p.live ? 'v' + p.inForce + ' since ' + fmt(p.publishedAt) : 'Not yet') + '</dd><dt>Draft</dt><dd>' + (d ? 'v' + d.v + ' · ' + DSTATE[d.state][1].toLowerCase() : 'None open') + '</dd><dt>Owner</dt><dd>' + esc(person(p.owner).name) + '</dd><dt>Approver</dt><dd>' + selD('data-chg="approver" aria-label="Approver"' + (d && d.state === 'in-review' ? ' disabled' : ''), ppl.map((x) => [x.id, x.name + ' · ' + roleName(x.roles[0])]), p.approver) + '</dd><dt>Next review</dt><dd>' + (p.nextReview ? fmt(p.nextReview) + (reviewDays(p) < 0 ? ' <span class="chip bad">Late</span>' : '') : 'Set when it is published') + '</dd>' + (p.live ? '<dt>Read by</dt><dd>' + rd.filter((x) => p.acks.includes(x)).length + ' of ' + rd.length + ' with a step</dd>' : '') + '</dl><div class="row3">' + nextAct(p, 'btn gold') + '</div></div>' +
    '<div class="blk"><span class="lbl">Versions</span>' + (p.versions.length ? '<div class="tw"><table class="t"><thead><tr><th><span>Version</span></th><th><span>Published</span></th><th><span>Approved by</span></th><th><span>What changed</span></th></tr></thead><tbody>' + p.versions.map((v) => '<tr><td>v' + v.v + (v.v === p.inForce ? ' <span class="chip gold">In force</span>' : '') + '</td><td>' + fmt(v.date) + '</td><td>' + esc(v.by) + '</td><td>' + esc(v.note) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="note">No version published yet.</p>') + '</div></div>';
}
CHG.approver = (el) => { const p = bp(); p.approver = el.value; log('Mona Farag made ' + person(el.value).name + ' the approver of ' + p.name); render(); toast(person(el.value).name + ' approves ' + p.name + ' from now on.'); };

/* ── Check with AI ── */
function bAi(p, c, ed) {
  const f = aiFindings(p, c);
  if (!tasks(c).length) return notDrawn(p);
  const why = ed ? '' : p.draft ? 'It is with the approver: take it back to apply a suggestion.' : 'This is the version in force: start draft v' + (p.inForce + 1) + ' to apply a suggestion.';
  return '<div class="box" style="padding:4px 16px">' + (f.length ? f.map((x, i) => '<div class="aif"><b>' + (x.step ? 'Step ' + stepNo(c, x.step) + ' · ' + esc(stepById(c, x.step).label) : 'The whole process') + '</b><span>' + esc(x.text) + '</span><span class="note">' + esc(x.why) + '</span><div class="row3" style="margin-top:2px"><button class="btn" type="button" data-act="aiApply" data-i="' + i + '"' + (ed ? '' : ' disabled') + '>' + esc(x.btn) + '</button>' + (x.step ? '<button class="lnk" type="button" data-act="aiShow" data-step="' + x.step + '">Show it on the map</button>' : '') + '</div></div>').join('') : '<div class="aif"><b>Nothing found</b><span>Every step has a role and one accountable, every risk has a control, and every decision has two ways out.</span></div>') + '</div>' +
    '<p class="note" style="margin-top:8px">' + (why ? esc(why) + ' ' : '') + 'Reads ' + (p.draft ? 'draft v' + p.draft.v : 'v' + p.inForce) + ' as it stands now. A sample: in the product the suggestions come from AI and say where they come from.</p>';
}
ACT.aiApply = (el) => { const p = bp(), f = aiFindings(p, bContent(p))[Number(el.dataset.i)]; if (!f) return; edit((c) => { f.fn(c); if (f.step) touch(p, stepById(c, f.step)); }, 'Done: ' + f.btn.charAt(0).toLowerCase() + f.btn.slice(1) + '. Undo on Map takes it back.'); };
ACT.aiShow = (el) => { UI.sel = el.dataset.step; go('mona.b.' + UI.args[0] + '.map'); };

/* ── the band's actions ── */
ACT.bStart = () => { const p = bp(), d = startDraft(p); render(); toast('Draft v' + d.v + ' is open. Readers keep ' + (p.live ? 'v' + p.inForce : 'nothing') + ' until it is published.'); };
ACT.sendAppr = () => {
  const p = bp(), d = p.draft, g = gapsOf(d.c), who = person(p.approver).name;
  if (!tasks(d.c).length) { toast('Draw at least one step first.'); return; }
  dialog({ title: 'Send v' + d.v + ' for approval', sub: 'It goes to ' + esc(who) + ', who approves ' + esc(p.name) + ', and lands in their To do.', body: (g.length ? '<p class="ctl bad">' + plural(g.length, 'gap is', 'gaps are') + ' still open. You can send it anyway: ' + esc(who) + ' sees them in the Summary.</p>' : '<p class="ctl">No gaps.</p>') + fld('A note for ' + esc(who), '<textarea id="sa-note">' + esc(d.note || '') + '</textarea>'), foot: foot2('sendApprGo', 'Send to ' + esc(who)) });
};
ACT.sendApprGo = () => {
  const p = bp(), d = p.draft, who = person(p.approver).name, k = lookFor(p.approver);
  d.state = 'in-review'; d.sentAt = TODAY; d.sentBy = 'Mona Farag'; d.note = val('sa-note') || d.note;
  log('Mona Farag sent ' + p.name + ' v' + d.v + ' to ' + who + ' for approval');
  closeLayer(); render(); toast('Sent to ' + who + '.' + (k ? ' Look as ' + who.split(' ')[0] + ' to approve it.' : ''));
};
ACT.takeBack = () => { const p = bp(); p.draft.state = 'draft'; log('Mona Farag took ' + p.name + ' v' + p.draft.v + ' back to edit'); render(); toast('Taken back. It is a draft again; send it once you are done.'); };
ACT.exit = () => {
  const p = bp(), back = UI.from || 'mona.all';
  const where = /\.p\./.test(back) ? 'the process page' : /\.handle/.test(back) ? 'To handle' : /^mona\.all/.test(back) ? 'All processes' : 'where you were';
  go(back); toast((editable(p) ? 'Saved. Draft v' + p.draft.v + ' waits in the builder. ' : '') + 'Back on ' + where + '.');
};

/* ── Preview as manager: the draft exactly as the owner will read it ── */
R.preview = (args) => {
  const p = byCode(args[0]); if (!p || !isOffice()) return R[home(UI.as)]([]);
  const c = bContent(p); if (!c) return R.b([p.code]);
  const d = p.draft, tab = ['flow', 'steps', 'summary'].includes(args[1]) ? args[1] : window.innerWidth < 640 ? 'steps' : 'flow';
  const owner = person(p.owner), noCtl = c.controls.filter((k) => !k.control).length, changes = d && p.live ? d.v : 0;
  const strip = '<div class="strip"><b>Preview</b><span>' + (d ? 'Draft v' + d.v : 'Version ' + p.inForce) + ' as ' + esc(owner.name) + ', the owner, will read it' + (d ? ' once it is published' : '') + '. Buttons show what they will see, and do nothing here.</span><span class="acts"><button class="btn gold" type="button" data-go="mona.b.' + p.code + '.' + (UI.bsec || 'map') + '">Back to the builder</button></span></div>';
  const inert = (l, gold) => '<button class="' + (gold ? 'bgold' : 'bq') + '" type="button" data-act="toast" data-msg="In the preview this does nothing. ' + esc(owner.name) + ' will have it.">' + l + '</button>';
  const band = mast({ eyebrow: 'Raya Trade · Processes › ' + p.code + ' · ' + esc(p.cat), title: esc(p.name) + ' ' + (d ? pill('attn', 'Draft v' + d.v + ' · preview') : pill('good', 'In force · v' + p.inForce)) + '<span class="own">You own this</span>',
    sub: (c.purpose ? esc(c.purpose.split(',')[0]) + ' · ' : '') + 'Owner <b>' + esc(owner.name) + '</b> · Approver <b>' + esc(person(p.approver).name) + '</b>', acts: inert('Download SOP') + inert('Print') + inert('Suggest a change', true),
    tiles: tiles([[tasks(c).length, 'Steps'], [new Set(tasks(c).map((s) => s.role)).size, 'Roles'], [noCtl, 'Risk, no control', noCtl ? 'late' : '']]) });
  const tabs = tabBar([['flow', 'Flow', '', '', 'mona.preview.' + p.code + '.flow'], ['steps', 'Steps', tasks(c).length, '', 'mona.preview.' + p.code + '.steps'], ['summary', 'Summary', '', '', 'mona.preview.' + p.code + '.summary']], tab);
  let body;
  if (tab === 'flow') { const s0 = UI.sel && tasks(c).some((s) => s.id === UI.sel) ? UI.sel : (tasks(c)[0] || {}).id; body = '<p class="note" style="margin-bottom:10px">Lanes are roles. Click a step for its detail.</p><div class="agrid">' + flowHtml(c, p, { sel: s0, changes }) + '<aside class="box drawer">' + stepRead(c, s0) + '</aside></div>'; }
  else if (tab === 'steps') body = '<div class="box">' + tasks(c).map((s, i) => stepCard(c, s, i + 1, { changes, mine: owner.roles })).join('') + '</div>';
  else body = summaryHtml(p, c, { mode: 'draft' }, []).split('data-go="mona.p.' + p.code).join('data-go="mona.preview.' + p.code);
  return page(strip + band + tabs + body);
};

/* ══ TRY THIS ══════════════════════════════════════════════════════════
   One story across the four people: a suggestion goes from the owner to the
   office, into a draft, to the approver, back out as the version in force, and
   on to the staff who read it. Start over puts everything back. */
const STORY = [
  ['hend.todo', 'Hend Mourad · owner', 'Answer the office', 'The office asked Hend about the delivery photo. On To do, press Reply and answer it.'],
  ['hend.p.ORD100.flow', 'Hend Mourad · owner', 'Suggest a change', 'On Order-to-Cash, pick a step on the Flow and press Suggest a change to this step.'],
  ['mona.handle', 'Mona Farag · Strategy Office', 'Pick it up', 'Hend’s reply and Nadia’s suggestion wait in To handle. Open the draft from one of them.'],
  ['mona.b.ORD100.map', 'Mona Farag · Strategy Office', 'Change the draft', 'Edit a step on Map, try Check with AI, look at Preview as manager, then Send for approval.'],
  ['yara.todo', 'Yara Kamal · approver', 'Approve it', 'Order-to-Cash v3 is in Yara’s To do. Read it, then approve it or send it back with a note.'],
  ['mona.handle', 'Mona Farag · Strategy Office', 'Publish it', 'To handle shows v3 approved. Publish puts it in force and asks everyone with a step to read it.'],
  ['dalia.todo', 'Dalia Sabry · staff', 'Read the new version', 'Dalia has a step in Order-to-Cash. To do asks Dalia to read v3; the steps that changed are marked.'],
  ['hend.p.ORD100.summary', 'Hend Mourad · owner', 'See who has read it', 'The Summary shows who has read v3 and who still has to, with a reminder button.'],
  ['mona.priorities.signoff', 'Also try', 'More to look at', 'Send the deep-dive plan to Yara. Procure-to-Pay came back from Yara, Store Cash Handling waits for Yara, and Export stops the check above 12 processes.'],
];
ACT.guide = () => dialog({ title: 'Try this', sub: 'One suggestion, from the owner to the staff who read the new version. Every button works; switch who you are looking as at the top.', wide: true,
  body: '<div class="guide"><ol>' + STORY.map(([g, who, t, d]) => '<li><span><b>' + esc(t) + '</b><small>' + esc(who) + ' · ' + esc(d) + '</small></span><button class="btn" type="button" data-go="' + g + '">Go</button></li>').join('') + '</ol></div><p class="note">What you do is kept while this page stays open. Start over puts every process, suggestion and to-do back where the story begins.</p>',
  foot: '<button class="btn" type="button" data-act="startOver">Start over</button><button class="btn gold" type="button" data-act="close">Close</button>' });
ACT.startOver = () => {
  seed();
  Object.assign(UI, { sel: null, q: '', sort: ['name', 1], rq: '', rsort: ['name', 1], undo: [], mapOnly: false, mapSel: null, from: null, bsec: null });
  closeLayer(); go(UI.as + '.' + home(UI.as));
  toast('Started over: every process, suggestion and to-do is back where the story begins.');
};

/* ══ START ═════════════════════════════════════════════════════════════ */
seed();
const firstVisit = !location.hash;
render();
if (firstVisit) ACT.guide();

</script>
