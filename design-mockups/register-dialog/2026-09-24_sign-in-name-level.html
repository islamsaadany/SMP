<main>
<h1>The register's edit dialog, at 1280 × 700</h1>
<p>The grey <b>Sign-in name</b> box is 10px taller than the boxes beside it, so that row stands taller than every other row and the dialog scrolls by 6px. The fix makes the grey box the same height as its neighbours. Nothing else changes.</p>
