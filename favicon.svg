<!-- SMP. The north star, the platform's own mark (Islam's pick A, 2026-10-24,
     §622): navy on amber, drawn exactly as the console's column draws it
     (.sblogo in platform.html), so the console, the door and every client's
     platform wear one mark.
     Also inlined as a data URI by SMP-Project-Folder/src/build.py, so the
     single-file platform carries its own mark offline. Change one, run
     build.py, and re-export favicon.png at 32x32 and the icons/ PNGs. -->
