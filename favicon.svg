  <rect width="32" height="32" rx="9" fill="#F5A623"/>
  <g transform="translate(4.6 4.6) scale(.95)" fill="none" stroke="#0F2C69" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
