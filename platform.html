      page.appendChild(card);
      });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  /* A CELL OPENED BY A DOUBLE CLICK (§372's register, round four): the
     words become a box holding them, selected; Enter or leaving it writes
     (`commit` answers null when nothing changed), Escape puts the words back
     untouched. Only one box at a time is ever open on the row. */
  function coCell(span, value, label, mono, commit) {
    span.classList.add("coed");
    span.title = "Double-click to change";
    span.addEventListener("dblclick", function () {
      if (span.hidden) return;
      try { window.getSelection().removeAllRanges(); } catch (e) { /* nothing selected */ }
      var box = el("input", "fld coinput" + (mono ? " mono" : ""));
      box.value = value;
      box.setAttribute("aria-label", label);
      var done = false;
      var shut = function () { if (box.parentNode) box.parentNode.removeChild(box); span.hidden = false; };
      var finish = function (keep) {
        if (done) return;
        done = true;
        if (!keep) { shut(); return; }
        var w = commit(box.value);
        if (!w) { shut(); return; }
        box.disabled = true;
        w.then(shut, shut);
      };
      box.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { e.preventDefault(); finish(false); }
      });
      box.addEventListener("blur", function () { finish(true); });
      span.hidden = true;
      span.parentNode.insertBefore(box, span.nextSibling);
      box.focus();
      box.select();
    });
  }
  /* THE ROW SAYS WHAT THE SERVER ANSWERED, on the row (§621's rule): Saved
     for a moment, or Not saved with the reason, longer. */
  function coSaid(email, ok, why) {
    var row = page.querySelector('.cotable tr[data-email="' + String(email).replace(/"/g, "") + '"] .cowho');
    if (!row) { if (!ok) say(why || "Not saved.", true); return; }
    var tag = el("span", "asksaved" + (ok ? "" : " bad"), ok ? "Saved" : "Not saved" + (why ? " — " + why : ""));
    tag.setAttribute("role", "status");
    row.appendChild(tag);
    setTimeout(function () { if (tag.parentNode) tag.parentNode.removeChild(tag); }, ok ? 1800 : 5000);
  }

  function consultantRow(p, j) {
    var tr = el("tr");

    /* ── THE NAME AND THE ADDRESS ARE EDITABLE (§313.27) ────────────
       Islam: "I need to edit the consultants names and emails as well." Two
       fields on the row rather than a dialog, because there are two of them
       and one row is not a form (§116's argument runs the other way at this
       size: the register moved to a dialog because NINE fields in a 158px
       cell collided; two do not).

       COMMITTED ON `change`, which for a text box means on blur — so the
       value is written by moving away from it, and there is no Save to
       forget. The row updates quietly afterwards, or the field being typed
       into would be replaced under the hand (§35, §71.2).

       AND THE ADDRESS IS THE SIGN-IN, so changing it ends that person's
       sessions and is said on the page rather than left to be discovered. */
    /* ── THE PERSON: THEIR MARK, THE NAME IN BOLD AND THE ADDRESS UNDER IT
       (round four, 2026-10-24). Both are still edited where they are read,
       now the way the client's register opens a cell (§372): a DOUBLE
       CLICK opens it (Islam: "double click open the cells for editing and
       on closing the save banner appears it's a common behavior we have
       already"), leaving it or Enter writes it, Escape puts it back — and
       the row then says Saved, or Not saved with the reason, as the
       register's cells do (§621's `asksaved`).

       AND THE ADDRESS IS THE SIGN-IN, so changing it ends that person's
       sessions and is said on the page rather than left to be discovered
       (§313.27). */
    var edit = j.canEdit;
    tr.setAttribute("data-email", p.email);
    var who = el("td", "coperson");
    who.appendChild(el("span", "coav" + (p.status === "retired" ? " ret" : ""), initials(p.name || p.email)));
    var words = el("span", "cowho");
    var nmS = el("b", "coname", p.name || "—");
    var emS = el("span", "coemail mono", p.email);
    words.appendChild(nmS);
    /* A RETIRED ROW SAYS SO (§35, §124, §338): the one state that stops
       somebody signing in is otherwise invisible. */
    if (p.status === "retired") { words.appendChild(document.createTextNode(" ")); words.appendChild(el("span", "tag", "Retired")); }
    words.appendChild(emS);
    who.appendChild(words);
    if (edit) {
      coCell(nmS, p.name || "", "Name", false, function (v) {
        v = v.trim();
        if (v === (p.name || "")) return null;
        return post({ action: "saveConsultant", email: p.email, name: v }).then(function (r) {
          return r.ok ? drawConsultants(true).then(function () { coSaid(p.email, true); })
                      : coSaid(p.email, false, r.error || "Not changed.");
        });
      });
      coCell(emS, p.email, "Email", true, function (v) {
        v = v.trim().toLowerCase();
        if (!v || v === p.email) return null;
        return post({ action: "saveConsultant", email: p.email, newEmail: v }).then(function (r) {
          if (!r.ok) return coSaid(p.email, false, r.error || "Not changed.");
          /* SAID AFTER THE REDRAW THAT REPORTS IT (§63): said before, the
             sentence goes with the page the redraw replaces. */
          return drawConsultants(true).then(function () {
            coSaid(v, true);
            say(v + " signs in with that address now. Any tab they had open " +
                "has been signed out — the old address no longer exists.");
          });
        });
      });
    }
    tr.appendChild(who);

    /* ── SUPER USER, IN A COLUMN THAT SAYS WHERE (Islam, option B) ──
       The role was always here and read "Platform admin: Yes", which is not
       the word Islam uses for it: "I'm the super user of the platform."

       AND THE WORD ALONE WOULD HAVE COLLIDED. `Super user` already means the
       top seat on a CLIENT (§89), and the column immediately to the right of
       this one reads "Raya Trade · Super user" — so the column carries the
       WHERE and the chip carries the WHAT, and the row reads across as
       Platform · Super user, Raya Trade · Super user. One word for one
       standing, qualified by where it is held (§87's twins, avoided rather
       than discovered).

       THE KEY DOES NOT MOVE: `is_admin`, `canSetAdmin` and `saveConsultant`
       keep their spelling, because renaming a stored field is a migration for
       a word nobody reads (§30.2, §58). */
    var adminTd = el("td");
    /* round four: one pill that says the standing — Super user (amber) or
       Consultant — and changes it when pressed, for whoever may */
    var cell = el("span", "corole" + (j.canSetAdmin && p.email !== j.me ? "" : " locked"));
    var yes = el("button", p.isAdmin ? "on hi" : null, p.isAdmin ? "Super user" : "Consultant");
    yes.type = "button";
    yes.setAttribute("aria-pressed", String(!!p.isAdmin));
    if (j.canSetAdmin && p.email !== j.me) {
      yes.title = (p.isAdmin ? "Press to make them a consultant again. " : "Press to make them a super user: ") + "adding clients and consultants, and setting Who sees what";
      yes.addEventListener("click", function () {
        post({ action: "saveConsultant", email: p.email, isAdmin: !p.isAdmin })
          .then(function (r) { r.ok ? drawConsultants(true) : say(r.error || "Not changed.", true); });
      });
    } else if (p.email === j.me) {
      /* NOBODY CHANGES THEIR OWN STANDING, which is also what stops the
         platform's last super user locking themselves out of it. */
      yes.title = "You cannot change your own standing — somebody else with this role does it.";
    }
    cell.appendChild(yes);
    adminTd.appendChild(cell);
    tr.appendChild(adminTd);

    var seatsTd = el("td", "seats");
    if (!p.seats || !p.seats.length) seatsTd.appendChild(el("span", "muted", "On no client yet"));
    else p.seats.forEach(function (s) {
      var pill = el("span", "seat", s.client + " ");
      pill.appendChild(el("i", null, "· " + (s.seat === "super" ? "Super user" : "SMO team")));
      seatsTd.appendChild(pill);
    });
    tr.appendChild(seatsTd);

    tr.appendChild(el("td", null, p.password === "none" ? "—" : null)).appendChild(p.password === "none" ? document.createTextNode("")
      : el("span", "copw" + (p.password === "temporary" ? " tmp" : ""), p.password === "temporary" ? "Temporary" : "Set"));

    var act = el("td", "coacts");
    if (j.canEdit && p.email !== j.me && !p.isAdmin) {
      var b = el("button", "btn", "Issue password");
      b.type = "button";
      b.addEventListener("click", function () {
        b.disabled = true;
        post({ action: "issuePassword", email: p.email }).then(function (r) {
          b.disabled = false;
          if (!r.ok) { say(r.error || "Not issued.", true); return; }
          var s = say("");
          s.appendChild(document.createTextNode("Temporary password for " + p.email + ": "));
          s.appendChild(el("b", null, r.password));
          s.appendChild(document.createTextNode(" — said once, and stored nowhere in the clear."));
        });
      });
      act.appendChild(b);
    }
    /* TAKING SOMEBODY OFF THE LIST (§338). Islam: "allow me to delete a
       consultants from a user" — two accounts one letter apart and the list
       was ADD-ONLY, with retiring half built and never drawn (§61).

       RETIRE IS DRAWN FIRST AND DELETE ONLY ON A RETIRED ROW, which is
       §323's shape for a client and its reason: the two presses are
       separated by a state somebody chose, so nobody is deleted while they
       can still sign in. Both are asked of the SERVER (canRetire /
       canDelete), never re-derived here, or the row offers what the next
       request refuses (§42, §337's own fault). */
    if (p.canRetire) {
      var back = p.status === "retired";
      var rb = el("button", "btn", back ? "Bring back" : "Retire");
      rb.type = "button";
      rb.title = back ? "Let them sign in again."
        : "Ends their sessions and stops them signing in. Their seats stay on the record.";
      rb.addEventListener("click", function () {
        rb.disabled = true;
        post({ action: "saveConsultant", email: p.email, status: back ? "active" : "retired" })
          .then(function (r) {
            if (!r.ok) { rb.disabled = false; say(r.error || "Not changed.", true); return; }
            drawConsultants(true);
          });
      });
      act.appendChild(rb);
    }
    if (p.canDelete) {
      var db = el("button", "btn risk", "Delete");
      db.type = "button";
      db.title = "Removes the account for good. Offered only once they are retired and on no client.";
      db.addEventListener("click", function () {
        /* ASKED IN PLACE, AND THE ASK NAMES WHO (§89, §95, §186). Never the
           browser's own dialog — §273.3 took the last one of those out of
           the product — and never a modal either: this is one row of a
           table, so the question belongs in the row it is about. The
           failure mode is landing on the wrong line, which is exactly what
           a confirmation naming nobody catches none of. */
        act.textContent = "";
        act.appendChild(el("span", "muted", "Delete " + (p.name || p.email) + "?"));
        var yes = el("button", "btn risksolid", "Delete for ever");
        yes.type = "button";
        var no = el("button", "btn", "Cancel");
        no.type = "button";
        no.addEventListener("click", function () { drawConsultants(true); });
        yes.addEventListener("click", function () {
          yes.disabled = true; no.disabled = true; yes.textContent = "Deleting…";
          post({ action: "deleteConsultant", email: p.email }).then(function (r) {

  /* ════ HISTORY: WHAT HAS BEEN DONE IN THIS CONSOLE (§487) ═══════════
     Islam, of the rules audit's fourth finding: *"let's do the recording on
     console"*, then *"the console record should sit as a separate page as
     history"*. Signed off from a drawing of the page in the console's own
     chrome (rule 1c).

     IT READS AND NOTHING ELSE. Every row is written at the act itself
     (lib/platform-api.ts's logAct), so this page cannot disagree with what
     happened — there is no second answer to assemble and nothing here to
     get wrong but the words.

     THE SENTENCE COMES OFF THE ROW. It was written when the act was made,
     because two of the acts recorded destroy their own subject (a client
     deleted, a consultant removed) and a page re-deriving the words from a
     key would lose exactly those two (§49.2).

     GROUPED BY DAY, NEWEST FIRST, through the table's OWN band — `tr.grp`
     is what My work already heads its groups with, so this page invents no
     second device for "a heading inside a table" (§53.5). The two days
     somebody is actually looking for read as words; everything older reads
     as its date, because "6 days ago" is a sum the reader has to do.

     TYPING NEVER REPAINTS (constitution XV, and the clients grid's own
     answer one tab over): the search hides rows IN PLACE, and a day band
     whose rows have all gone is hidden with them — or the page shows a
     heading over nothing, which reads as a result rather than as an
     absence. */
  function dayOf(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return { key: "?", label: "Undated" };
    var mid = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var days = Math.round((mid(new Date()) - mid(d)) / 86400000);
    var key = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    if (days === 0) return { key: key, label: "Today" };
    if (days === 1) return { key: key, label: "Yesterday" };
    /* the year only once it is not this one — "2 October 2026" on a page
       whose every other row is this year says the year nine times for nothing */
    var opts = { day: "numeric", month: "long" };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return { key: key, label: d.toLocaleDateString(undefined, opts) };
  }
  function clockOf(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "\u2014";
    return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });
  }

  /* ════ The strategy frameworks library (spec 052) ════════════════════
     Forefront's own, outside every client, beside the memory — and the one
     table on this platform that names no client at all: a framework is about

     ASKING IT IS PHASE C and is not drawn as a control that does nothing
     (§61). ADDING one is here, and it is an admin's: `canAdd` comes from the
     server with the list and is never worked out on this page (§42). */
  var FW = { view: "list", one: null, q: "", section: "", rows: null, sections: null,
             canAdd: false, add: null, said: "",
             /* Asking rides in the SAME box as searching, switched — decision
                2, and one field rather than a box with a quieter line under
                it. The answer lives on FW, so opening a framework it named
                and pressing back finds it still there. */
             mode: "search", question: "", answer: null, asking: false };

     kept between visits: a half-typed name from last week reappearing under

  }

     reading view walks this list, so a tenth field is one edit (§104.7). */

                  ["whenToUse", "When to use it"], ["whenNotToUse", "When not to use it"],
                  ["inputsRequired", "Inputs required"], ["outputs", "Outputs"],

  /* ════ The Copilot's settings (§501, spec 064) ═══════════════════════
     The method the Copilot is told for each section, and the templates a
     client downloads — the same for every client, so they are kept here,
     beside the frameworks library, rather than inside one client's
     platform. Every consultant reads them; only a Forefront super user
     changes them, and the server asks that again on every write (§42) —
     `canEdit` arrives with the answer and the page derives nothing. */
  var CP = { mode: "parts", section: "foundation", open: {}, editing: null, flash: null, data: null };

  /* A SMALL, SAFE MARKDOWN READER, built from nodes rather than markup, so
     nothing typed into a part can become a tag (§235). Headings, lists, bold
     and paragraphs, which is all the method's text uses. */
  function cpInline(parent, text) {
    String(text).split(/(\*\*[^*]+\*\*)/).forEach(function (bit) {
      var m = /^\*\*([^*]+)\*\*$/.exec(bit);
      if (m) parent.appendChild(el("strong", null, m[1]));
      else if (bit) parent.appendChild(document.createTextNode(bit));

  function cpMd(src) {
    var box = el("div", "pb");

    String(src || "").split("\n").forEach(function (raw) {
      var l = raw.replace(/\s+$/, "");
      var h = /^(#{1,6})\s+(.*)$/.exec(l), li = /^\s*[-*]\s+(.*)$/.exec(l);
      if (!l.trim()) { flush(); list = null; return; }
      if (h) { flush(); list = null; var hx = el("h" + Math.min(6, Math.max(3, h[1].length))); cpInline(hx, h[2]); box.appendChild(hx); return; }
      if (li) { flush(); if (!list) { list = el("ul"); box.appendChild(list); } var it = el("li"); cpInline(it, li[1]); list.appendChild(it); return; }
      list = null; para.push(l.trim());

    flush();
    return box;
  }
  function cpSize(n) {

  }

  function cpWrite(body, flash) {

      CP.data = j;

  /* A PART'S LIMITS AS TILES: a heading that names limits, followed by a

  function cpTiles(box) {

      var ul = h.nextElementSibling;
      if (!/limits/i.test(h.textContent) || !ul || ul.tagName !== "UL") return;
      var items = Array.prototype.map.call(ul.children, function (li) {
        var st = li.firstChild;
        if (!st || st.nodeName !== "STRONG" || li.childNodes.length !== 2) return null;
        var v = String(li.lastChild.textContent || "").trim();
        return v.length <= 12 ? [st.textContent.replace(/:\s*$/, ""), v] : null;
      });
      if (!items.length || items.some(function (x) { return !x; })) return;
      var tiles = el("div", "cplim");
      items.forEach(function (x) {
        var t = el("div");
        t.appendChild(el("b", null, x[1].replace(/-/g, "\u2013")));
        t.appendChild(el("span", null, x[0]));
        tiles.appendChild(t);
      });
      ul.parentNode.replaceChild(tiles, ul);
    });
    return box;
  }

  function cpTemplates(d, canEdit) {
    var words = {};
    (d.sections || []).forEach(function (s) { words[s.key] = s.title; });
    var wrap = el("div", "tscroll");
    wrap.style.marginTop = "14px";
    var t = el("table");
    var hr = el("tr");
    ["#", "Template", "Section", "Used for", "Size", ""].concat(canEdit ? ["Replace"] : []).forEach(function (x) { hr.appendChild(el("th", null, x)); });
    var th = el("thead"); th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody");
    (d.templates || []).forEach(function (tp, i) {
      var tr = el("tr");
      tr.setAttribute("data-template", tp.key);
      tr.appendChild(el("td", null, String(i + 1)));
      var nm = el("td", null, tp.name);
      if (tp.edited) { nm.appendChild(document.createTextNode(" ")); nm.appendChild(el("span", "tag", "Replaced")); }
      tr.appendChild(nm);
      tr.appendChild(el("td", null, words[tp.section] || tp.section));
      tr.appendChild(el("td", null, tp.use));
      tr.appendChild(el("td", null, cpSize(tp.size)));
      var dl = el("td");
      var a = el("a", "btn", "Download");
      a.href = "/api/copilot?file=" + encodeURIComponent(tp.key);
      dl.appendChild(a);
      tr.appendChild(dl);
      if (canEdit) {
        var rc = el("td");
        var inp = el("input");
        inp.type = "file";
        inp.accept = ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
        inp.hidden = true;
        inp.setAttribute("data-cpfile", tp.key);
        var rb = el("button", "btn", "Replace");
        rb.type = "button";
        rb.addEventListener("click", function () { inp.click(); });
        inp.addEventListener("change", function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 3 * 1048576) { CP.flash = { bad: true, text: "A template can be up to 3 MB." }; cpRepaint(); return; }
          var fr = new FileReader();
          fr.onload = function () {
            var s = String(fr.result || "");
            rb.disabled = true;
            cpWrite({ action: "replace", key: tp.key, name: f.name, data: s.slice(s.indexOf(",") + 1) },
              "Replaced. Every client now downloads the new file.");
          };
          fr.readAsDataURL(f);
        });
        rc.appendChild(inp);
        rc.appendChild(rb);
        if (tp.edited) {
          var pb = el("button", "btn", "Put back the shipped file");
          pb.type = "button";
          pb.style.marginLeft = "6px";
          pb.setAttribute("data-cpreset", tp.key);
          pb.addEventListener("click", function () { pb.disabled = true; cpWrite({ action: "reset", key: tp.key }, "The shipped file is back."); });
          rc.appendChild(pb);
        }
        tr.appendChild(rc);
      }
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    wrap.appendChild(t);
    /* the same card as the parts (round four) */
    var card = el("section", "hocard cpcard cptpl");
    var hd = el("div", "hochd");
    var hic = el("span", "hocic");
    hic.innerHTML = NAV_ICON.copilot;
    hd.appendChild(hic);
    hd.appendChild(el("h2", null, "The templates"));
    hd.appendChild(el("span", "hocnt", String((d.templates || []).length)));
    card.appendChild(hd);
    wrap.style.marginTop = "0";
    card.appendChild(wrap);
    card.appendChild(el("p", "cpwhy cofoot", "A filled template attached in a Copilot chat is read as that section's input." +
      (canEdit ? " A replaced file is what every client downloads." : "")));
    page.appendChild(card);
  }

  function drawFrameworks() {
    if (FW.view === "one") return drawFwOne();
    if (FW.view === "add") return drawFwAdd();
    return drawFwList();
  }

  /* ── The list ──────────────────────────────────────────────────────
     The whole library arrives in one answer and the searching happens here,
     which is a decision rather than a shortcut: 80 rows is small, they are
     already on the page, and a round trip per keystroke would be slower AND
     would replace the box being typed into (constitution XV). */
  function drawFwList(quiet) {
    lead(quiet, "Reading…");
    return fpost({ action: "list" }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "Could not read the library.", true); return; }
      FW.rows = j.frameworks || [];
      FW.sections = j.sections || [];
      FW.canAdd = !!j.canAdd;
      settle(function () { fwPaint(); });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  function fwPaint() {
    /* DRAWN FOR AN ADMIN AND FOR NOBODY ELSE — never drawn disabled, because
       a control that refuses everybody who can see it is furniture (§94.15),
       and the sentence explaining it would be on a page the reader can do
       nothing about. */
    var right = null;
    if (FW.canAdd) {
      right = el("span");
      var add = el("button", "btn amber", "+ Add a framework");
      add.type = "button";
      add.addEventListener("click", function () { fwGo("add", { add: fwAddState() }); });
      right.appendChild(add);
    }
    pageBand("Frameworks", right, nOf(FW.rows.length, "framework") + " · " + nOf(FW.sections.length, "section"),
      "The strategy frameworks the office works with, to read or to ask.");

    /* THE LIBRARY IS ONE CARD (Islam, 2026-10-24, round three): Search · Ask
       it and the box in its header, the section chips in a row under it, the
       frameworks as striped rows. */
    var card = el("section", "hocard fwcard");
    var chd = el("div", "hochd");
    var hic = el("span", "hocic");
    hic.innerHTML = NAV_ICON.frameworks;
    chd.appendChild(hic);
    chd.appendChild(el("h2", null, "The library"));
    var hcnt = el("span", "hocnt", String(FW.rows.length));
    chd.appendChild(hcnt);
    chd.appendChild(el("span", "sp"));
    card.appendChild(chd);
    var box = el("div", "fwbox");

    /* ONE BOX, TWO QUESTIONS, SWITCHED (decision 2). Searching narrows what is
       already on the page; asking sends the library to the assistant. They are
       different enough that one field answering both by guessing would be a
       control nobody can predict — and near enough that two boxes stacked would
       be two things to read before typing. */
    var cell = el("div", "cell");
    [["search", "Search"], ["ask", "Ask it"]].forEach(function (w) {
      var t = el("button", FW.mode === w[0] ? "on" : null, w[1]);
      t.type = "button";
      t.setAttribute("aria-pressed", FW.mode === w[0] ? "true" : "false");
      t.addEventListener("click", function () {
        if (FW.mode === w[0]) return;
        FW.mode = w[0];
        fwRepaint();
      });
      cell.appendChild(t);
    });
    box.appendChild(cell);

    var asking = FW.mode === "ask";
    var field = el("div", "fwask");
    var search = el("input", "fld");
    search.type = asking ? "text" : "search";
    search.placeholder = asking
      ? "What are you trying to work out?"
      : "Search " + FW.rows.length + " frameworks — by name, purpose or when to use it";
    search.value = asking ? FW.question : FW.q;
    field.appendChild(search);
    box.appendChild(field);

    var chips = el("div", "fwchips");
    chd.appendChild(box);
    if (!asking) card.appendChild(chips);
    page.appendChild(card);

    var count = el("p", "fwcount");
    var list = el("div", "fwlist");

    if (asking) {
      var go = el("button", "btn solid", FW.asking ? "Asking…" : "Ask");
      go.type = "button";
      if (FW.asking) go.disabled = true;
      field.appendChild(go);
      go.addEventListener("click", function () { fwAsk(search.value); });
      /* Enter asks, because a single field with a button beside it is a form
         in every way but the tag, and pressing Enter in one is what people do. */
      search.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); fwAsk(search.value); }
      });

      if (FW.answer) {
        var ans = el("div", "fwans");
        ans.appendChild(el("p", null, FW.answer.reply));
        (FW.answer.sources || []).forEach(function (sc2) {
          var cite = el("button", "fwcite");
          cite.type = "button";
          cite.appendChild(el("span", "nm", sc2.name));
          /* THE FRAMEWORK'S OWN WORDS FOR WHAT IT IS FOR. The mockup drew a
             sentence written about THIS question instead, which is a second
             field in the answer's shape and is recorded as not built rather
             than quietly dropped (tasks.md C4). */
          if (sc2.purpose) cite.appendChild(el("p", "wy", sc2.purpose));
          cite.addEventListener("click", function () { fwGo("one", { one: sc2.id }); });
          ans.appendChild(cite);
        });
        /* THE DOOR IS ON THE DECLINE AND ONLY ON IT, and only for somebody who
           can walk through it — which is the third way in, and why the page
           carries two add buttons rather than three. */
        if (!FW.answer.answered && FW.canAdd) {
          var row2 = el("div", "row");
          row2.style.marginTop = "13px";
          var addit = el("button", "btn amber", "Add it to the library →");
          addit.type = "button";
          addit.addEventListener("click", function () {
            var a = fwAddState();
            /* WHAT THEY ASKED IS NOT WHAT THE FRAMEWORK IS CALLED, so it does
               not become the name: a question typed into a name box would be
               drafted as though it were a title (§96.2). */
            fwGo("add", { add: a });
          });
          row2.appendChild(addit);
          ans.appendChild(row2);
        }
        page.appendChild(ans);
      }
      page.appendChild(el("p", "note",
        "Answers come only from the library. It will not reach for something that is not in it."));
      search.addEventListener("change", function () { FW.question = search.value; });
      return;
    }

    card.appendChild(count);
    card.appendChild(list);

    /* Every row carries what it is searched on, lowercased once here rather
       than on every keystroke — the same five fields the server sends and,
       not by coincidence, the five that decide whether this is the right
       tool. */
    FW.rows.forEach(function (f) {
      var b = el("button", "fwrow");
      b.type = "button";
      b.dataset.hay = [f.name, f.section, f.purpose, f.keyQuestions, f.whenToUse]
        .join(" ").toLowerCase();
      b.dataset.section = f.section;
      /* the name with one line of what it is for, its section as a pill, a chevron */
      var tx = el("span", "tx");
      tx.appendChild(el("span", "nm", f.name));
      if (f.purpose) tx.appendChild(el("span", "pp", f.purpose));
      b.appendChild(tx);
      b.appendChild(el("span", "tag", f.section));
      b.appendChild(el("span", "go", "›"));
      b.addEventListener("click", function () { fwGo("one", { one: f.id }); });
      list.appendChild(b);
    });

    /* ONE FILTER, asked by the box and by the chips (§53.5) — two that
       narrowed the same list separately is how they come to disagree. It
       hides rows in place and writes the count INTO its node; nothing here
       repaints, so the cursor stays where it is typing (§63, constitution XV). */
    function apply() {
      var q = FW.q.trim().toLowerCase();
      var shown = 0;
      Array.prototype.forEach.call(list.querySelectorAll(".fwrow"), function (r) {
        var hide = (!!q && r.dataset.hay.indexOf(q) < 0) ||
                   (!!FW.section && r.dataset.section !== FW.section);
        r.hidden = hide;
        if (!hide) shown++;
      });
      Array.prototype.forEach.call(chips.querySelectorAll(".fwchip"), function (c) {
        c.classList.toggle("on", (c.dataset.section || "") === FW.section);
        c.setAttribute("aria-pressed", (c.dataset.section || "") === FW.section ? "true" : "false");
      });
      /* IT SAYS WHAT IT FOUND, and when it found nothing it says that rather
         than leaving an empty box to be read as a page that failed (§45.2). */
      hcnt.textContent = String(shown);
      count.textContent = !shown ? "Nothing matches that."
        : shown === FW.rows.length ? nOf(shown, "framework")
        : nOf(shown, "framework") + " of " + FW.rows.length;
    }

    var all = el("button", "fwchip", "All");
    all.type = "button"; all.dataset.section = "";
    all.appendChild(el("i", null, String(FW.rows.length)));
    all.addEventListener("click", function () { FW.section = ""; apply(); });
    chips.appendChild(all);
    FW.sections.forEach(function (sc) {
      var c = el("button", "fwchip", sc.section);
      c.type = "button"; c.dataset.section = sc.section;
      c.appendChild(el("i", null, String(sc.n)));
      /* Pressing the lit one clears it, which is what aria-pressed already
         means and the only way back to "All" without reaching for it. */
      c.addEventListener("click", function () {
        FW.section = FW.section === sc.section ? "" : sc.section;
        apply();
      });
      chips.appendChild(c);
    });

    search.addEventListener("input", function () { FW.q = search.value; apply(); });
    apply();
  }

  /* The rows are already here, so a redraw of the list is a redraw and never
     a second read of the library (§98). */
  function fwRepaint() { settle(function () { fwPaint(); }); }

  function fwAsk(q) {
    q = String(q || "").trim();
    FW.question = q;
    if (!q) { say("Ask it something first.", true); return; }
    if (FW.asking) return;
    FW.asking = true;
    /* THE OLD ANSWER GOES WITH THE OLD QUESTION. Leaving it standing under a
       box being asked something else is an answer to a question nobody can
       see (§45.2, reversed). */
    FW.answer = null;
    fwRepaint();
    fpost({ action: "ask", question: q }).then(function (j) {
      FW.asking = false;
      if (!j || !j.ok) { fwRepaint(); say((j && j.error) || "Could not ask it.", true); return; }
      /* `why` is the plumbing failing rather than the library not covering it
         — two different errands, said differently (§123). */
      if (j.why) { fwRepaint(); say(j.why, true); return; }
      FW.answer = { answered: !!j.answered, reply: String(j.reply || ""), sources: j.sources || [] };
      fwRepaint();
    }).catch(function (e) {
      FW.asking = false;
      if (String(e.message) === "sign in") return;
      fwRepaint(); say("Could not reach the server.", true);
    });
  }

  /* ── One framework ─────────────────────────────────────────────────
     In place behind a way back, which is this page's own idiom for going
     into a thing (the client card does it) — and nine sections of prose is
     more than a dialog should hold. */
  function drawFwOne() {
    clear();
    page.appendChild(el("p", "muted", "Reading…"));
    return fpost({ action: "one", id: FW.one }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "Could not read that framework.", true); return; }
      var f = j.framework;
      settle(function () {
        /* TAKEN ONCE AND CLEARED, or it reappears every time this framework
           is opened, long after it was added (§313.32's own rule, one page
           over). */
        if (FW.said) { say(FW.said); FW.said = ""; }
        var back = el("div");
        var b = el("button", "cback", "← ALL FRAMEWORKS");
        b.type = "button";
        b.addEventListener("click", function () { fwGo("list"); });
        back.appendChild(b);
        back.style.marginBottom = "13px";
        page.appendChild(back);

        var right = el("div");
        right.appendChild(el("span", "tag", f.section));
        title(f.name, right);

        var band = el("div", "band");
        var done = {};
        FWFIELDS.forEach(function (pair) {
          var key = pair[0];
          if (done[key]) return;
          var mate = FWPAIRS[key];
          if (mate) {
            var g = el("div", "fwsec fwgrid");
            [[key, pair[1]], [mate, fwLabel(mate)]].forEach(function (side) {
              var d = el("div");
              d.appendChild(el("h3", null, side[1]));
              d.appendChild(el("p", null, f[side[0]] || "—"));
              g.appendChild(d);
              done[side[0]] = true;
            });
            band.appendChild(g);
            return;
          }
          var sec = el("div", "fwsec");
          sec.appendChild(el("h3", null, pair[1]));
          sec.appendChild(el("p", null, f[key] || "—"));
          band.appendChild(sec);
          done[key] = true;
        });

        /* WHERE IT CAME FROM, and an absent author is an absence rather than
           a person invented to fill it (§35). */
        var apart = el("div", "apart");
        apart.appendChild(el("span", "akey", "Where this came from"));
        apart.appendChild(el("p", "note", f.addedBy
          ? "Added by " + f.addedBy + (f.when ? " · " + whenWord(f.when) : "")
          : "Came with the library. Nobody here has edited it."));
        apart.querySelector(".note").style.margin = "0";
        band.appendChild(apart);
        page.appendChild(band);
      });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  /* ── Adding one ────────────────────────────────────────────────────
     TWO WAYS IN AND ONE SCREEN. By name, for a framework the model genuinely
     knows; by pasted source, for everything else — including Forefront's own,
     which no model has ever read. The mockup drew both panels at once because
     a still cannot show a switch flipping; what is built is the switch, which
     is the control the drawing itself carries.

     NOTHING HERE WRITES UNTIL THE PRESS. `draft` touches no table and `save`
     is a separate action, which is decision 3 and the whole reason the extra
     step exists: a plausible invention sitting among eighty real frameworks
     is quoted to a client under Forefront's name. */
  function drawFwAdd() {
    var A = FW.add || (FW.add = fwAddState());
    /* BUILT DETACHED AND SWAPPED, which keeps the scroll: the draft panel is
       eleven fields tall, and every press redraws it — a jump to the top on
       pressing Save loses the place at the one moment it matters. */
    settle(function () { fwAddBody(A); });
  }

  function fwAddBody(A) {
    var back = el("div");
    var b = el("button", "cback", "← ALL FRAMEWORKS");
    b.type = "button";
    b.addEventListener("click", function () { fwGo("list", { add: null }); });
    back.appendChild(b);
    back.style.marginBottom = "13px";
    page.appendChild(back);
    title("Add a framework");

    if (A.draft) return fwDraftPanel(A);

    var band = el("div", "band");

    /* The page's own segmented pair, never a second one (§53.5). Switching
       KEEPS what is in the other box: somebody who typed a name, was declined
       and reached for the source has not thrown the name away. */
    var cell = el("div", "cell");
    [["name", "By name"], ["source", "Paste the source"]].forEach(function (w) {
      var t = el("button", A.how === w[0] ? "on" : null, w[1]);
      t.type = "button";
      t.setAttribute("aria-pressed", A.how === w[0] ? "true" : "false");
      t.addEventListener("click", function () {
        if (A.how === w[0]) return;
        A.how = w[0];
        /* A DECLINE BELONGS TO THE ASK THAT PRODUCED IT. Carrying it across
           the switch would leave "I do not know that one" standing over a
           box holding the source that answers it (§45.2, reversed). */
        A.why = "";
        drawFwAdd();
      });
      cell.appendChild(t);
    });
    band.appendChild(cell);

    var wrap = el("div");
    wrap.style.marginTop = "15px";
    var fld;
    if (A.how === "name") {
      wrap.appendChild(el("label", "lab", "The framework's name"));
      fld = el("input", "fld");
      fld.type = "text";
      fld.value = A.name;
      fld.placeholder = "Blue Ocean Strategy (Kim and Mauborgne)";
      fld.addEventListener("change", function () { A.name = fld.value; });
    } else {
      wrap.appendChild(el("label", "lab", "Paste a chapter, a page, or your own notes"));
      fld = el("textarea", "fld");
      fld.rows = 7;
      fld.value = A.source;
      fld.addEventListener("change", function () { A.source = fld.value; });
    }
    fld.style.width = "100%";
    wrap.appendChild(fld);
    band.appendChild(wrap);

    band.appendChild(el("p", "note", A.how === "name"
      ? "It will draft the eleven fields from what it knows, and you read them before "
        + "anything is saved. If it does not know the framework well enough it will say so "
        + "rather than invent one — paste the source instead."
      : "It will turn what you paste into the eleven fields and add nothing the material "
        + "does not say. Works for anything, including a framework of ours that no model "
        + "has read."));

    /* THE DECLINE, IN THE ASSISTANT'S OWN WORDS and with the other door on
       it: which framework it does not know is exactly what tells the admin
       whether to paste the source or check the spelling (§125's rule with
       the sign reversed — here the decline IS the useful answer). */
    if (A.why) {
      var d = el("div", "fwdecl", A.why);
      d.style.marginTop = "15px";
      band.appendChild(d);
      if (A.how === "name") {
        var go = el("button", "btn solid", "Paste the source instead →");
        go.type = "button";
        go.addEventListener("click", function () { A.how = "source"; A.why = ""; drawFwAdd(); });
        var r2 = el("div", "row");
        r2.style.marginTop = "15px";
        r2.appendChild(go);
        band.appendChild(r2);
      }
    }

    var row = el("div", "row");
    row.style.marginTop = "15px";
    var go2 = el("button", "btn solid", A.busy ? "Drafting…" : "Draft it");
    go2.type = "button";
    if (A.busy) go2.disabled = true;
    go2.addEventListener("click", function () {
      /* THE FIELD IS COMMITTED BEFORE THE PRESS (§219): these write on
         `change`, which is on BLUR, and a mouse reaching for the button
         usually blurs on the way — usually is what makes it a bug. */
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      var name = String(A.name || "").trim(), source = String(A.source || "").trim();
      if (A.how === "name" ? !name : !source) {
        say(A.how === "name" ? "Give it a name first." : "Paste something first.", true);
        return;
      }
      A.busy = true; A.why = ""; drawFwAdd();
      fpost({ action: "draft", name: name, source: A.how === "source" ? source : "" })
        .then(function (j) {
          A.busy = false;
          if (!j || !j.ok) { drawFwAdd(); say((j && j.error) || "Could not draft it.", true); return; }
          if (!j.drafted) { A.why = j.why || "It could not draft that one."; drawFwAdd(); return; }
          A.draft = j.draft || {};
          if (!A.draft.name && name) A.draft.name = name;
          drawFwAdd();
        })
        .catch(function (e) {
          A.busy = false;
          if (String(e.message) === "sign in") return;
          drawFwAdd(); say("Could not reach the server.", true);
        });
    });
    row.appendChild(go2);
    var cancel = el("button", "btn", "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", function () { fwGo("list", { add: null }); });
    row.appendChild(cancel);
    band.appendChild(row);

    page.appendChild(band);
  }

  /* The draft, every field editable and nothing repainting under a working
     hand (§71.2) — the console's own idiom, and the memory's draft card
     one page up does exactly this. */
  function fwDraftPanel(A) {
    page.appendChild(el("div", "fwdraft",
      "This is a draft. Read it before you save it — nothing is in the library yet."));

    var band = el("div", "band");
    var fields = el("div", "fwfields");

    var nm = el("div");
    nm.appendChild(el("label", "lab", "Name"));
    var nmf = el("input", "fld");
    nmf.type = "text";
    nmf.value = A.draft.name || "";
    nmf.addEventListener("change", function () { A.draft.name = nmf.value; });
    nm.appendChild(nmf);
    fields.appendChild(nm);

    /* A PICKER OVER WHAT EXISTS, which is decision 1 on the screen: the eight
       are fixed, so there is nothing here that makes a ninth. An empty one is
       a real option, because the draft drops a section the model invented and
       the admin is the one who then says which. */
    var sc = el("div");
    sc.appendChild(el("label", "lab", "Section"));
    var ssel = el("select", "fld");
    var none = el("option", null, "— which section?");
    none.value = "";
    ssel.appendChild(none);
    (FW.sections || []).forEach(function (s2) {
      var op = el("option", null, s2.section);
      op.value = s2.section;
      if (s2.section === A.draft.section) op.selected = true;
      ssel.appendChild(op);
    });
    ssel.addEventListener("change", function () { A.draft.section = ssel.value; });
    sc.appendChild(ssel);
    fields.appendChild(sc);

    /* The nine, in the reading view's own order and pairing (§53.5): what is
       corrected here reads back in the same shape it will be read in. */
    var done = {};
    FWFIELDS.forEach(function (pair) {
      var key = pair[0];
      if (done[key]) return;
      var mate = FWPAIRS[key];
      var host = mate ? el("div", "fwgrid") : el("div");
      [[key, pair[1]]].concat(mate ? [[mate, fwLabel(mate)]] : []).forEach(function (side) {
        var box = mate ? el("div") : host;
        box.appendChild(el("label", "lab", side[1]));
        var ta = el("textarea", "fld");
        ta.rows = 2;
        ta.value = A.draft[side[0]] || "";
        (function (k) { ta.addEventListener("change", function () { A.draft[k] = ta.value; }); })(side[0]);
        box.appendChild(ta);
        if (mate) host.appendChild(box);
        done[side[0]] = true;
      });
      fields.appendChild(host);
    });
    band.appendChild(fields);

    var row = el("div", "row");
    row.style.marginTop = "18px";
    var save = el("button", "btn amber", A.busy ? "Saving…" : "Save to the library");
    save.type = "button";
    if (A.busy) save.disabled = true;
    save.addEventListener("click", function () {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      A.busy = true; drawFwAdd();
      fpost({ action: "save", draft: A.draft }).then(function (j) {
        A.busy = false;
        if (!j || !j.ok) { drawFwAdd(); say((j && j.error) || "Not saved.", true); return; }
        /* IT LANDS ON THE THING IT JUST MADE, which is this page's own answer
           to "did that work" — a sentence saying saved over the form that
           still holds the draft is one press from saving it twice (§136).
           The word travels on FW rather than being said here, because
           `drawFwOne` clears and rebuilds: a `say()` appended now is appended
           to a frame about to be replaced (§63). */
        fwGo("one", { one: j.id, add: null, said: "Added to the library." });
      }).catch(function (e) {
        A.busy = false;
        if (String(e.message) === "sign in") return;
        drawFwAdd(); say("Could not reach the server.", true);
      });
    });
    row.appendChild(save);
    var drop = el("button", "btn", "Discard");
    drop.type = "button";
    drop.addEventListener("click", function () {
      /* NOTHING WAS WRITTEN, so there is nothing to take back and no
         confirmation to ask for — saying "are you sure" over an unsaved
         draft teaches people to press through the ones that matter. */
      A.draft = null; A.why = ""; drawFwAdd();
    });
    row.appendChild(drop);
    var note = el("span", "muted", "Saved as added by you, today.");
    note.style.fontSize = "12.5px";
    row.appendChild(note);
    band.appendChild(row);

    page.appendChild(band);
  }

  function fwLabel(key) {
    for (var i = 0; i < FWFIELDS.length; i++) if (FWFIELDS[i][0] === key) return FWFIELDS[i][1];
    return key;
  }

  document.getElementById("signout").addEventListener("click", function () {
    /* §431: signing out wipes every saved copy of a client's page */
    try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf("smp.cache.") === 0) localStorage.removeItem(k); } } catch (e) {}
    fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" },
      body: '{"action":"logout"}' }).finally(function () { location.replace("/"); });
  });

  /* ── Boot ──────────────────────────────────────────────────────
     BOTH QUESTIONS AT ONCE (§369). Islam: "something strange the window is not
     active on opening I need to click anyway to start accepting clicks on the
     cards." THE WINDOW IS ACTIVE AND THE PAGE IS NOT FINISHED, which is worse,
     because the two are indistinguishable from outside: `.top` is drawn
     OUTSIDE `.wrap`, so the bar stands up with Forefront's name and a Sign out
     button over a body that `body:not(.ready)` has hidden — a window that
     looks open, answers nothing, and says nothing about either.

     Measured at 600ms a round trip, which is production's own shape: the
     requests went out as `me` → `cards` → `cards`, THREE sequential trips for
     one page load with the last two the SAME request; the bar was up and dead
     for 1,255ms, the page then appeared titled and empty, and the cards landed
     at 1,872. A click inside that window hits BODY — `elementFromPoint` where
     a card will be, every 100ms of it — so the press he spends is the one that
     happens to land after the page became ready.

     Nothing in `cards` reads `me`'s ANSWER — the session is the cookie both
     already carry — so they were sequential for no reason but the order they
     were written in, and `drawClients()` asked the second one over again. One
     trip now. The cost, stated: a signed-out visitor sends one `cards` that is
     thrown away, and they are being redirected anyway.

     IT IS NOT §368's, established before it was blamed (§303): the same probe
     against the build before that section reports 1,259ms to 1,255. It is the
     boot's own shape, and §359.4 made the second trip heavier by giving
     `cards` a per-client read.

     WHAT IS LEFT IS ONE ROUND TRIP OF THE SAME SILENCE, and it is not fixed
     here. A first draft of this comment said the grid "already says Reading
     your clients… and this gate hides it", and MEASURING IT SAID OTHERWISE:
     lifting the gate alone produces a picture byte-identical to today's,
     because `drawClients()` BUILDS that sentence and is not called until the
     answer lands — there is nothing behind the gate to reveal. Corrected
     rather than left standing (§124).
     So saying anything at all means DRAWING before the answer, which is a
     decision about what a loading page looks like: the page's own title,
     search and sentence drawn early (whose cost is that `drawNav()` reads the
     answer, so the tab row lands a beat later — measured, an early
     `go("clients")` throws on a null ME), or §94.10's grey skeleton, whose
     RULE the gate above cites and whose treatment this page never took. Both
     shot out of the real page and put to Islam
     (design-mockups/console-loading/), never ridden in behind a repair
     (rule 1b, 1c).

     ANSWERED (§371): Islam took the skeleton, over the recommendation. It is
     `drawWaiting()` above, and the window is no longer silent — which is why
     two assertions in checks/console-boot.py §2 and §4 were REWRITTEN rather
     than loosened: they recorded this state on purpose so that the day it
     moved they would go red (§214.3, §218). */
  /* What the column may show is asked of the same rules the pages ask —
     `cards` answers it for this account, so the row cannot offer a page the
     next request refuses. */
  function meFrom(j, c) {
    var me = { email: j.account.email, name: j.account.name, isAdmin: j.account.isAdmin,
               canConsultants: true, canAccess: !!j.account.isAdmin };
    if (c && c.ok) { me.canConsultants = !!c.canConsultants; me.canAccess = !!c.canAccess; }
    return me;
  }
  /* THE CHROME SAYS THE SAME WORD THE TABLE DOES. Leaving "Admin" here
     after renaming the column is exactly the twins this rename avoided.
     The name, then the role as a span of its own (§584.1); the whole line on
     a hover, for a name that had to end in "…". §601: at the column's foot
     the role sits under the name, so its dot is a span of its own that is
     not drawn — the line's words, and what it reads as, are unchanged. */
  function drawWho() {
    var who = document.getElementById("who");
    who.textContent = "";
    who.appendChild(el("span", null, ME.name));
    if (ME.isAdmin) {
      var role = el("span", "role");
      role.appendChild(el("span", "sep", " · "));
      role.appendChild(document.createTextNode("Super user"));
      who.appendChild(role);
    }
    who.title = who.textContent;
    var av = document.getElementById("sbav");
    av.textContent = initials(ME.name);
    /* with the column icons wide, the initials name the person on a hover */
    av.setAttribute("data-tip", who.textContent);
  }
  var gated = function (me, tab) {
    if (!me.canConsultants && tab === "consultants") return "home";
    if (!me.canAccess && tab === "access") return "home";
    return tab;
  };

  /* §620: THE TWO QUESTIONS GO FIRST, recorded as the console's own saved
     copy ("boot"), and before anything is drawn from a saved copy — so no
     saved answer can ever stand in for them. */
  RECORD = { tab: "boot", email: "", answers: {} };
  var bootRec = RECORD;
  var asked = Promise.all([post({ action: "me" }), post({ action: "cards" })]);
  /* THEN WHAT ARRIVING CAN SHOW AT ONCE: the column and the tab the address
     names, from the copy saved for this person last time; else that tab's
     shape. */
  var BOOT = savedOf("boot");
  var KME = '/api/platform {"action":"me"}', KCARDS = '/api/platform {"action":"cards"}';
  var early = null;
  if (BOOT && BOOT.answers[KME] && BOOT.answers[KME].ok) {
    var sme = meFrom(BOOT.answers[KME], BOOT.answers[KCARDS]);
    var stab = gated(sme, TAB), saved = savedOf(stab, sme.email);
    if (saved) { early = sme; ME = sme; TAB = stab; drawNav(); drawWho(); drawSaved(TAB, saved); document.body.classList.add("ready"); }
  }
  if (!early) drawWaiting();
  asked.then(function (r) {
    var j = r[0], c = r[1];
    if (!j || !j.ok) { location.replace("/"); return; }
    ME = meFrom(j, c);
    if (c && c.ok) BOOTCARDS = c;
    /* a saved copy that turns out to be somebody else's is dropped, and so
       is anything it drew */
    if (BOOT && BOOT.email !== ME.email) {
      wipeSaved();
      if (SHOWN.hasAttribute("data-saved")) { unhold(); SHOWN.textContent = ""; SHOWN.appendChild(tabSkel(TAB)); }
    }
    bootRec.email = ME.email;
    if (bootRec.answers[KME]) saveTab(bootRec);
    drawWho();
    document.body.classList.add("ready");
    /* The boot's `cards` answer is for the Clients tab's FIRST draw only
       (§369); opening on another tab, it is let go rather than handed to a
       later visit as a stale list (§48.2). */
    if (TAB !== "clients" && TAB !== "home") BOOTCARDS = null;
    TAB = gated(ME, TAB);
    go(TAB, "boot");
  }).catch(function (e) {
    if (String(e.message) === "sign in") return;
    unhold();
    document.body.classList.add("ready");
    /* THE WAITING CARDS COME DOWN BEFORE THE REFUSAL GOES UP (§371). A
       skeleton is a promise that something is arriving, and `say` APPENDS —
       so without this the sentence lands under three grey cards still
       saying it is on its way. The happy path needs no such line, because
       `go` clears the page itself. */
    clear();
    say("Could not reach the server.", true);
  });
})();
</script>
</body>
</html>
