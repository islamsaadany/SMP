<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forefront — Strategy Management Platform</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32">
<!--
  FOREFRONT'S OWN PLATFORM (spec 042, revision 2 — Islam, 2026-08-29:
  "the page you are showing should be just for login ... and the rest should be
  inside the platform").

  index.html is the DOOR and does one thing. This is what it hands you to: a
  platform with its own chrome and its own navigation, holding the three pages
  that are Forefront's rather than a client's.

  IT IS NOT BUILT FROM src/. Neither is the door — both are hand-written pages
  served as they are, and only the CLIENT's platform is assembled by build.py.
  Its stylesheet is its own for the same reason: the door is a wall and a card,
  this is a chrome and tables, and copying 25KB of the one into the other
  carries rules neither needs (constitution VI: follow what the product does,
  and the product has two kinds of page here).
-->
<style>
  :root{
    --ground:#F5F6F9; --surface:#FFFFFF; --surface-2:#EDF0F5;
    --line:#D8DEE8; --line-soft:#E6EAF1;
    /* --ink-3 IS SET AGAINST THE QUIETEST GROUND IT SITS ON, not the whitest
       (§38.5, and _shared.css records the same lesson): #6E7A90 cleared
       nothing — 4.33 on white, 4.01 on the page's own ground and 3.79 on
       --surface-2 — and it is the colour of the card's industry line, the
       name in the top row, every note and every unlit chip. #5E6E85 is the
       client platform's own value, so this is one vocabulary rather than two
       greys a shade apart (§53.5): 5.19 / 4.80 / 4.54. */
    --ink:#141C2B; --ink-2:#465268; --ink-3:#5E6E85;
    /* Forefront's own, measured before use (constitution XIII):
       #0F2C69 carries white at 13.25:1 · #F5A623 carries #231500 at 9.04:1
       and is 2.03:1 as TYPE on white, so words take #9C5D08 (5.27:1). */
    --ff:#0F2C69; --ff-ink:#FFFFFF; --ff-quiet:#A9BAD8; --ff-tx:#0F2C69;
    --amber:#F5A623; --amber-ink:#231500; --amber-tx:#9C5D08; --amber-wash:#FEF4E2;
    --good:#1B6E4E; --good-bg:#E9F4EF; --warn:#8A6410; --warn-bg:#FBF2DC;
    --bad:#B23025; --bad-bg:#FBEDEB; --bad-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(20,28,43,.06), 0 8px 26px rgba(20,28,43,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#12151C; --surface:#1A1F29; --surface-2:#222834;
      --line:#333B4A; --line-soft:#2A313E;
      --ink:#E7EBF2; --ink-2:#AAB4C6; --ink-3:#8590A3;
      --ff:#0D2350; --ff-ink:#F0F4FB; --ff-quiet:#95A9CC; --ff-tx:#95A9CC;
      --amber:#F5A623; --amber-ink:#231500; --amber-tx:#F5A623; --amber-wash:#2B2210;
      --good:#63BE96; --good-bg:#1B2C26; --warn:#D7B04A; --warn-bg:#2A2515;
      --bad:#E8776B; --bad-bg:#33211F; --bad-ink:#231010;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  /* THE SAME BLOCK AGAIN, DELIBERATELY, AND IT IS WHY --ff-tx WAS ADDED
     TWICE AND STILL DID NOTHING HERE: a token defined only in the media query
     is absent the moment somebody chooses a theme explicitly, which is exactly
     what this check does. Complete blocks, never a base plus overrides —
     _shared.css records the same rule, and v3.0's zebra stripe is what
     happens without it. */
  :root[data-theme="dark"]{
    --ground:#12151C; --surface:#1A1F29; --surface-2:#222834;
    --line:#333B4A; --line-soft:#2A313E;
    --ink:#E7EBF2; --ink-2:#AAB4C6; --ink-3:#8590A3;
    --ff:#0D2350; --ff-ink:#F0F4FB; --ff-quiet:#95A9CC; --ff-tx:#95A9CC;
    --amber:#F5A623; --amber-ink:#231500; --amber-tx:#F5A623; --amber-wash:#2B2210;
    --good:#63BE96; --good-bg:#1B2C26; --warn:#D7B04A; --warn-bg:#2A2515;
    --bad:#E8776B; --bad-bg:#33211F; --bad-ink:#231010;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--ground); color:var(--ink);
    font:400 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased }
  /* NOTHING IS DRAWN UNTIL THE SERVER HAS ANSWERED (§94.10's rule): a platform
     that paints a page and then corrects it has shown somebody a screen that
     was not theirs. */
  body:not(.ready) .wrap{ visibility:hidden }

  /* ── the chrome: two lines, as a client's platform has (§2.9) ── */
  .top{ background:var(--surface); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:9px 18px }
  /* THE MARK IS TYPE, AND --ff IS A FILL (§38.4, the seventh time). It was
     `color:var(--ff)`, which is right in light — #0F2C69 on white is 13.25 —
     and in dark that token becomes the navy the NAVIGATION BAR is painted in:
     #0D2350 on #1A1F29 is 1.08, so Forefront's own name was invisible on
     Forefront's own platform. A fill and a word need two tokens, declared
     together (§94.8's --cta/--cta-ink). --ff-tx is 6.94 dark. */
  .top .mk{ font:700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.16em; color:var(--ff-tx) }
  .top .nm{ font-weight:600; font-size:14px }
  .top .right{ margin-left:auto; display:flex; align-items:center; gap:10px;
    color:var(--ink-3); font-size:12.5px }
  .nav{ background:var(--ff); display:flex; padding:0 10px; gap:2px }
  .nav button{ background:transparent; border:0; color:var(--ff-quiet);
    font:600 13.5px/1 inherit; padding:13px 14px; cursor:pointer;
    border-bottom:3px solid transparent }
  .nav button:hover{ color:var(--ff-ink) }
  .nav button.on{ color:var(--ff-ink); border-bottom-color:var(--amber) }
  .wrap{ max-width:1180px; margin:0 auto; padding:22px 18px 70px }

  .ptitle{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:18px }
  .ptitle h1{ font-size:20px; margin:0; font-weight:600 }
  .ptitle .right{ margin-left:auto; display:flex; gap:8px; align-items:center }

  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:6px 12px; font:600 13px/1.5 inherit; cursor:pointer }
  .btn:hover:not(:disabled){ border-color:var(--amber-tx) }
  .btn:disabled{ opacity:.45; cursor:default }
  .btn.solid{ background:var(--ff); border-color:var(--ff); color:var(--ff-ink) }
  .btn.amber{ background:var(--amber); border-color:var(--amber); color:var(--amber-ink) }
  .fld{ width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:8px 11px; font:400 14px/1.5 inherit }
  .lab{ display:block; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px }

  /* ── client cards ─────────────────────────────────────────── */
  .cards{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)) }
  .ccard{ position:relative; text-align:left; border:1px solid var(--line); border-radius:12px;
    background:var(--surface); padding:15px; display:flex; flex-direction:column; gap:7px;
    min-height:152px; font:inherit; color:inherit; cursor:pointer; box-shadow:var(--shadow) }
  .ccard:hover:not(:disabled), .ccard:focus-visible{ border-color:var(--amber-tx); outline:none }
  .ccard:disabled{ cursor:default; opacity:.72 }
  .ccard .cmark{ width:36px; height:36px; border-radius:9px; background:var(--ff); color:var(--amber);
    font:700 12px/36px ui-monospace, SFMono-Regular, monospace; text-align:center; letter-spacing:.05em }
  /* A client that has a mark wears it on its card — the same picture its
     door wears (§313.36), so the two cannot disagree; a light plate under it
     because a PNG cannot be recoloured (§52). Initials until then. */
  .ccard img.cmark{ width:auto; max-width:120px; height:36px; object-fit:contain; background:#fff; padding:4px 8px; box-sizing:content-box }
  .markrow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap }
  .markrow img{ height:40px; width:auto; max-width:200px; object-fit:contain; background:#fff; padding:5px 10px; border:1px solid var(--line); border-radius:8px }
  .markrow .none{ font-size:13px; color:var(--ink-3) }
  .ccard h2{ margin:0; font-size:17px; font-weight:600 }
  .ccard .ind{ margin:0; color:var(--ink-3); font-size:12.5px }
  .ccard .foot{ margin-top:auto; display:flex; gap:6px; flex-wrap:wrap }
  .ccard.demo{ background:var(--amber-wash); border-color:var(--amber) }
  .ccard.add{ align-items:center; justify-content:center; border-style:dashed; font-weight:600;
    color:var(--ink-3) }
  /* ── THE WORKED EXAMPLE IS NOT ONE OF THE CLIENTS (§317) ──────────
     Islam: "the demo should be a separate client on the platform outside
     beside the clients." It was IN the grid — third across, with the way to
     add a client after it — so the page counted it as one, and two things
     followed that nobody chose: the empty-state line reads a count that
     included it, and the box saying "Search clients" found it.

     THE DEVICE IS THE PAGE'S OWN and nothing here is new: a hairline with an
     uppercase key on it, which is how every other surface separates one kind
     of thing from another (§53.5). The card keeps the amber wash and the Demo
     tag it already wore — what changed is where it is drawn. AND IT KEEPS THE
     GRID'S OWN TRACK WIDTH: a card grown to the full page would read as more
     important than the clients above it, which is the opposite of what
     setting it apart says. */
  .apart{ margin-top:26px; padding-top:14px; border-top:1px solid var(--line) }
  .apart > .akey{ display:block; margin-bottom:12px;
    font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3) }
  .ccfg{ position:absolute; top:11px; right:11px; font:600 10px/1.6 ui-monospace, monospace;
    letter-spacing:.06em; text-transform:uppercase; color:var(--amber-tx);
    border:1px solid var(--line); border-radius:6px; padding:2px 7px; background:var(--surface) }
  .ccfg:hover, .ccfg:focus-visible{ border-color:var(--amber-tx); outline:none }
  .tag{ font:600 10.5px/1.5 ui-monospace, SFMono-Regular, monospace; letter-spacing:.05em;
    text-transform:uppercase; border:1px solid var(--line); border-radius:5px; padding:2px 6px;
    color:var(--ink-2); background:var(--surface-2) }
  .tag.open{ color:var(--good); background:var(--good-bg); border-color:var(--good) }
  .tag.none{ color:var(--warn); background:var(--warn-bg); border-color:var(--warn) }
  .tag.demo{ color:var(--amber-tx); border-color:var(--amber); background:var(--surface) }
  .tag.seat{ color:var(--ff); border-color:var(--ff) }

  /* ── AN ARCHIVED CLIENT'S CARD (§323) ──────────────────────────────
     The card it always was, quieter, and with no door. A dashed edge says
     "set aside" the way the Add card's dashed edge already says "not yet a
     client", so the page keeps one vocabulary rather than gaining a second
     (§53.5). It is never `disabled` in the markup for the LOOK — it is
     disabled because there is genuinely nothing behind it: their address is
     closed, and a card that still opened would promise something that does
     not work (§61, §96). */
  .ccard.arch{ opacity:.72; border-style:dashed; background:var(--surface-2) }
  .ccard.arch:hover{ border-color:var(--line) }
  /* AND WHOEVER ARCHIVED IT IS AN EMAIL, WHICH IS LONGER THAN THE CARD
     (§88's own answer, on a card rather than a table row): one line, clipped
     where it does not fit, the whole of it one hover away. Measured — 
     `islam.saadany@forefront.consulting` runs 4px past a 232px card, and this
     is a `ui-monospace` string with no space in it, so it cannot wrap its way
     out (§158: fit, never "and it overflows"). */
  .tag.arch{ color:var(--ink-3); border-color:var(--line); background:var(--surface);
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  /* BRING BACK TAKES THE CORNER SETTINGS HOLDS on a live card, because on an
     archived client it is what Settings was: the one thing you came to the
     card to do. */
  .cback{ font:600 10px/1.6 ui-monospace, SFMono-Regular, monospace; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-2); background:var(--surface);
    border:1px solid var(--line); border-radius:7px; padding:2px 8px; cursor:pointer }
  .cback:hover, .cback:focus-visible{ border-color:var(--amber-tx); outline:none }
  /* TWO CONTROLS, SO THEY NEED A ROW: `.ccfg` is absolute and a second
     absolute chip would sit on top of it. The wrapper is what is positioned
     and the chips sit in it, so a third one later costs no arithmetic. */
  .cacts{ position:absolute; top:11px; right:11px; display:flex; gap:5px; align-items:center }
  .cacts .ccfg{ position:static; top:auto; right:auto }
  :root[data-theme="dark"] .tag.seat, :root:not([data-theme="light"]) .tag.seat{ color:var(--ff-quiet) }

  /* ── tables ───────────────────────────────────────────────── */
  table{ border-collapse:collapse; width:100%; font-size:14px }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap }
  thead th{ background:var(--ff); color:var(--ff-ink);
    font:600 10.5px/1.4 ui-monospace, SFMono-Regular, monospace; letter-spacing:.09em;
    text-transform:uppercase; border-bottom:0 }
  thead th:first-child{ border-top-left-radius:8px } thead th:last-child{ border-top-right-radius:8px }
  tbody tr:nth-child(even) td{ background:var(--surface-2) }
  .tscroll{ overflow-x:auto }
  /* The seats cell is the one that wraps: it holds a list that grows with the
     clients somebody is on, and clipping it hides the fact the column is for. */
  td.seats{ white-space:normal; min-width:250px }
  /* A FIELD IN A TABLE CELL NEEDS A DEFINITE WIDTH AND min-width:0 (§110.8).
     `max-width:100%` resolves against a containing block an auto-layout table
     has not settled, so the browser treats it as none and the box grows the
     column; a px cap does nothing either. These two are what stop the row
     widening the moment the page is drawn. */
  table .fld{ width:100%; min-width:0; padding:5px 7px; font-size:13px }
  table td:first-child .fld{ min-width:120px }
  table .fld.mono{ font-family:ui-monospace, SFMono-Regular, monospace; font-size:12.5px;
    min-width:210px }
  td.seats .tag{ display:inline-block; margin:2px 3px 2px 0 }
  .mono{ font:400 13px/1.5 ui-monospace, SFMono-Regular, monospace; color:var(--ink-2) }
  .muted{ color:var(--ink-3) }

  /* a cell of two or three states, as §37's matrix has */
  .cell{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden }
  .cell button{ border:0; border-right:1px solid var(--line); background:var(--surface); color:var(--ink-3);
    font:600 10.5px/1.4 ui-monospace, SFMono-Regular, monospace; letter-spacing:.05em;
    text-transform:uppercase; padding:5px 9px; cursor:pointer }
  .cell button:last-child{ border-right:0 }
  .cell button.on{ background:var(--ff); color:var(--ff-ink) }
  .cell button.on.hi{ background:var(--amber); color:var(--amber-ink) }
  .cell.locked button{ cursor:default }

  .row{ display:flex; gap:9px; margin-top:14px; flex-wrap:wrap; align-items:center }
  .row .fld{ flex:1 1 170px; min-width:0 }
  .cfg{ display:grid; grid-template-columns:1.05fr .95fr; gap:26px }
  .rowset{ display:grid; gap:13px }
  .teamrow{ display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--line-soft) }
  .teamrow .who .nm{ font-weight:600; font-size:14px }
  .teamrow .who .em{ color:var(--ink-3); font-size:12.5px }
  .teamrow .sp{ flex-wrap:wrap; justify-content:flex-end }
  .asrow{ display:inline-flex; align-items:center; gap:6px }
  .asrow .aslab{ font:600 9.5px/1.4 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap }
  .asrow .fld{ width:auto; max-width:230px; padding:4px 6px; font-size:12px }
  .teamrow .sp{ margin-left:auto; display:flex; gap:7px; align-items:center }
  .said{ margin:12px 0 0; font-size:13.5px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px }
  .said b{ font-family:ui-monospace, SFMono-Regular, monospace }
  .err{ margin:12px 0 0; font-size:13.5px; color:var(--bad); background:var(--bad-bg);
    border:1px solid var(--bad); border-radius:8px; padding:9px 11px }
  .note{ margin:14px 0 0; font-size:13px; color:var(--ink-3) }
  @media (max-width:820px){ .cfg{ grid-template-columns:1fr } }

  /* ── SETTING A CLIENT UP (§322) ───────────────────────────────────
     The flow's own dress, in this page's tokens and nothing else — it is
     the same chrome, the same buttons and the same fields the rest of the
     platform page uses, with a step rail and a panel beside it. */
  .wzrail{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px }
  .wzstep{ display:flex; align-items:center; gap:7px; padding:5px 11px 5px 6px;
    border:1px solid var(--line); border-radius:999px; background:var(--surface);
    color:var(--ink-2); font:600 12.5px/1.5 inherit; cursor:pointer }
  .wzstep:hover:not(:disabled){ border-color:var(--amber-tx) }
  .wzstep .n{ width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
    background:var(--surface-2); color:var(--ink-3);
    font:600 11px/1 ui-monospace, SFMono-Regular, monospace; flex:none;
    font-variant-numeric:tabular-nums }
  .wzstep[aria-current="step"]{ background:var(--ff); border-color:var(--ff); color:var(--ff-ink) }
  .wzstep[aria-current="step"] .n{ background:var(--amber); color:var(--amber-ink) }
  .wzstep.done{ color:var(--ink-3) }
  .wzstep.done .n{ background:var(--good-bg); color:var(--good) }
  /* DULLED MEANS INERT AND SAYING SO — never merely grey (§61). */
  .wzstep.later{ border-style:dashed; opacity:.55; cursor:not-allowed }

  .wzgrid{ display:grid; grid-template-columns:1.05fr .95fr; gap:26px; align-items:start }
  @media (max-width:900px){ .wzgrid{ grid-template-columns:1fr } }
  .wzq{ font-size:20px; font-weight:600; margin:7px 0 4px; text-wrap:balance }
  .wzwhy{ color:var(--ink-3); font-size:13.5px; margin:14px 0 0; max-width:62ch }
  .wzempty{ color:var(--ink-3); font-size:13.5px; font-style:italic; margin:0 }
  .wzfoot{ display:flex; align-items:center; gap:9px; margin-top:22px; padding-top:15px;
    border-top:1px solid var(--line); flex-wrap:wrap }
  .wzfnote{ margin-left:auto; color:var(--ink-3); font-size:12.5px }

  /* lists you add to */
  .wzrows{ display:flex; flex-direction:column; gap:6px }
  .wzrow{ display:flex; align-items:center; gap:9px }
  .wzrow .fld{ flex:1 1 160px; min-width:0 }
  .wzrow .wzname{ flex:1 1 160px; font-weight:600; font-size:14px }
  .wzrt{ display:flex; align-items:center; gap:7px; flex:none }
  .wzrt .fld{ width:auto }
  .wzsub{ font-size:12px; color:var(--ink-3); white-space:nowrap }
  .wzx{ border:0; background:transparent; color:var(--ink-3); cursor:pointer;
    font-size:17px; line-height:1; padding:2px 5px; flex:none }
  .wzx:hover{ color:var(--bad) }
  .wzadd{ border:1px dashed var(--line); border-radius:8px; padding:8px 11px; color:var(--ink-3);
    background:transparent; font:600 13px/1.5 inherit; text-align:left; cursor:pointer;
    width:100%; margin-top:8px }
  .wzadd:hover{ border-color:var(--amber-tx); color:var(--ink-2) }

  /* a choice */
  .wzchoices{ display:flex; flex-direction:column; gap:10px }
  .wzchoice{ display:block; width:100%; text-align:left; padding:12px 13px; border-radius:9px;
    border:1px solid var(--line); background:var(--surface); color:inherit; font:inherit;
    cursor:pointer }
  .wzchoice:hover{ border-color:var(--amber-tx) }
  .wzchoice[aria-pressed="true"]{ border-color:var(--amber); box-shadow:inset 0 0 0 1px var(--amber) }
  .wzchoice .cname{ display:block; font-weight:600; font-size:14.5px }
  .wzchoice .cwhy{ display:block; color:var(--ink-3); font-size:12.5px; margin-top:3px }
  .wzlaterline{ margin-top:12px; font-size:13px; color:var(--ink-3);
    border-left:2px solid var(--line); padding-left:11px }

  /* ── ENDING A CLIENT (§323) ─────────────────────────────────────────
     §273.4's shape, which Islam chose for the reporting cycle: the
     destructive act in its own block, behind a rule, under a heading, so
     nobody arrives at it by tabbing down the form. Settings is already the
     door — a door is only a guard if the dangerous thing is behind it. */
  .wzend{ margin-top:26px; padding-top:16px; border-top:1px solid var(--line); max-width:560px }
  .wzendkey{ display:block; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px }
  .wzendwhy{ margin:0 0 12px; font-size:13px; color:var(--ink-3); max-width:62ch }
  .wzendrow{ display:flex; align-items:center; gap:9px; flex-wrap:wrap }

  /* THE WORD IS RED AND THE BUTTON IS NOT (§41's budget): --bad as a fill
     would be the loudest thing on a page whose one accent is the amber. The
     FILL is kept for the confirmation, where the volume belongs — and a fill
     and a word are TWO tokens, declared together (§38.4, §94.8's
     --cta/--cta-ink), because the first build of this wrote `color:#fff` and
     measured 2.90:1. 6.28 light, 6.35 dark. */
  .btn.risk{ color:var(--bad); border-color:var(--bad) }
  .btn.risk:hover:not(:disabled){ background:var(--bad-bg); border-color:var(--bad) }
  .btn.risksolid{ background:var(--bad); border-color:var(--bad); color:var(--bad-ink) }

  /* The question is asked IN the block rather than over the page: there is no
     dialog anywhere on this page, and one act does not earn the first (§2b). */
  .wzask{ border:1px solid var(--bad); background:var(--bad-bg); border-radius:9px;
    padding:13px 14px }
  .wzask p{ margin:0 0 11px; font-size:13.5px; color:var(--ink) }
  .wzask .goes{ margin:0 0 11px; font:400 12.5px/1.7 ui-monospace, SFMono-Regular, monospace;
    color:var(--ink-2) }
  .wzask label{ display:block; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin:0 0 6px }
  .wzask .fld{ background:var(--surface) }
  .wzask .row{ display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap }

  /* An archived client's flow says so BEFORE anything else: the fields below
     are read-only, and a page that did not say why would read as broken
     (§45.2). */
  .wzarched{ border:1px solid var(--line); background:var(--surface-2); border-radius:9px;
    padding:11px 13px; margin-bottom:18px; font-size:13.5px; color:var(--ink-2) }
  .wzarched b{ color:var(--ink) }

  /* the searchable standard list */
  .wzpick{ position:relative }
  .wzpanel{ position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--shadow); max-height:270px; overflow-y:auto; padding:5px }
  .wzpanel .gp{ font:600 10px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3); padding:9px 9px 5px }
  .wzpanel .opt{ display:block; width:100%; text-align:left; border:0; background:transparent;
    color:var(--ink); font:inherit; font-size:13.5px; padding:6px 9px; border-radius:6px;
    cursor:pointer }
  .wzpanel .opt:hover, .wzpanel .opt:focus-visible{ background:var(--surface-2); outline:none }
  .wzpanel .opt[aria-selected="true"]{ background:var(--amber-wash); color:var(--amber-tx);
    font-weight:600 }
  .wzpanel .nohit{ padding:10px 9px; color:var(--ink-3); font-size:13px; font-style:italic }

  /* the size band */
  .wzband{ display:flex; flex-wrap:wrap; gap:6px }
  .wzband button{ border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:8px; padding:6px 11px; font:600 12.5px/1.5 inherit; cursor:pointer;
    display:flex; flex-direction:column; gap:1px; align-items:flex-start }
  .wzband button:hover{ border-color:var(--amber-tx) }
  .wzband button[aria-pressed="true"]{ border-color:var(--amber); background:var(--amber-wash);
    color:var(--ink) }
  .wzband .ppl{ font:400 11px/1.3 ui-monospace, SFMono-Regular, monospace; color:var(--ink-3);
    font-variant-numeric:tabular-nums }
  .wzband button[aria-pressed="true"] .ppl{ color:var(--amber-tx) }

  /* the words table */
  .wztbl{ overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--surface) }
  .wztbl table{ min-width:520px }
  .wztbl td{ white-space:normal }

  /* what you are building */
  .wzshape{ position:sticky; top:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:15px; box-shadow:var(--shadow) }
  .wzshape h2{ font-size:13.5px; margin:0 0 2px; font-weight:600 }
  .wzshape .cap{ color:var(--ink-3); font-size:12.5px; margin:0 0 14px }
  .wzorg{ border:1px solid var(--amber); border-radius:9px; padding:9px 11px;
    background:var(--amber-wash); display:flex; align-items:center; gap:9px }
  .wzorg .nm{ font-weight:700; font-size:14.5px; color:var(--ink) }
  .wzwho{ margin:6px 0 0; font-size:12px; color:var(--ink-3) }
  .wzswitch{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;
    font-size:12px; margin-top:13px }
  .wzswitch span{ flex:1; text-align:center; padding:5px 6px; color:var(--ink-3) }
  .wzswitch span.on{ background:var(--ff); color:var(--ff-ink); font-weight:600 }
  .wzside{ margin-top:13px }
  .wzsidekey{ font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-3); margin-bottom:7px; display:flex;
    align-items:center; gap:7px }
  .wzsidekey .ct{ background:var(--surface-2); border-radius:999px; padding:1px 7px;
    font-size:10.5px; letter-spacing:0; font-variant-numeric:tabular-nums }
  .wzchips{ display:flex; flex-wrap:wrap; gap:6px }
  .wzchip{ border:1px solid var(--line); border-radius:6px; padding:4px 9px; font-size:12.5px;
    background:var(--surface-2); display:flex; align-items:center; gap:7px }
  .wzchip.unit{ border-left:3px solid var(--ff) }
  .wzchip.fn{ border-left:3px solid var(--good) }
  .wzchip .fmt{ font:600 10px/1.4 ui-monospace, SFMono-Regular, monospace; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-3) }
  .wznone{ color:var(--ink-3); font-size:12.5px; font-style:italic; padding:3px 0 }

  /* the summary */
  .wzsumm{ display:flex; flex-direction:column; gap:7px; margin-bottom:18px }
  .wzline{ display:flex; gap:10px; align-items:baseline; font-size:14px; padding:7px 11px;
    border:1px solid var(--line-soft); border-radius:8px; background:var(--surface); flex-wrap:wrap }
  .wzline .sk{ color:var(--ink-3); font-size:12.5px; min-width:136px }
  .wzline .sv{ font-weight:600 }
  .wzed{ margin-left:auto; color:var(--amber-tx); font-size:12.5px; border:0;
    background:transparent; cursor:pointer; font-weight:600 }
  .wzdoors{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:9px }
  @media (max-width:620px){ .wzdoors{ grid-template-columns:1fr } }
  .wzdoor{ border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--surface);
    display:flex; flex-direction:column; gap:5px; cursor:pointer; text-align:left; font:inherit;
    color:inherit }
  .wzdoor:hover{ border-color:var(--amber-tx) }
  .wzdoor.go{ border-color:var(--amber); background:var(--amber-wash) }
  .wzdoor .dn{ font-weight:700; font-size:14.5px }
  .wzdoor .dw{ color:var(--ink-3); font-size:12.5px }
</style>
</head>
<body>
<div class="top">
  <span class="mk">FOREFRONT</span><span class="nm">Platform</span>
  <span class="right"><span id="who"></span>
    <button class="btn" id="signout" type="button">Sign out</button></span>
</div>
<nav class="nav" id="nav"></nav>
<div class="wrap" id="page"></div>

<script>
(function () {
  "use strict";

  /* ── One shape for every request (§71's rule: three callers with the same
     six lines is where a typo lives in exactly one of them). ───────── */
  function post(body) {
    return fetch("/api/platform", { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) })
      .then(function (r) {
        /* NOT SIGNED IN IS NOT AN ERROR MESSAGE, it is the door. */
        if (r.status === 401 || r.status === 403) {
          return r.json().then(function (j) {
            if (j && j.auth) { location.replace("/"); throw new Error("sign in"); }
            return j;
          });
        }
        return r.json();
      });
  }

  var page = document.getElementById("page");
  var nav = document.getElementById("nav");
  var TAB = "clients";
  var ME = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    /* textContent, never innerHTML: every name here is typed by a person. */
    if (text != null) e.textContent = text;
    return e;
  }
  function clear() { page.textContent = ""; }
  function say(msg, bad) {
    var p = el("p", bad ? "err" : "said", msg);
    page.appendChild(p);
    return p;
  }
  function title(text, right) {
    var h = el("div", "ptitle");
    h.appendChild(el("h1", null, text));
    if (right) { right.className = "right"; h.appendChild(right); }
    page.appendChild(h);
    return h;
  }
  /* A COUNT AND ITS NOUN (§323). The client platform has a `plural` helper
     and this page does not — and it is not borrowed, because that one is
     wired to the tenant's own labels and this page has none. Irregular
     plurals are passed in rather than guessed at: "persons" and
     "capabilitys" are what a rule that appends an "s" produces (§107.8's
     trap, on the other side of the switch). */
  function nOf(n, one, many) {
    return n + " " + (n === 1 ? one : (many || one + "s"));
  }
  function initials(name) {
    var w = String(name || "?").trim().split(/\s+/);
    return (w.length > 1 ? w[0].charAt(0) + w[1].charAt(0) : w[0].slice(0, 2)).toUpperCase();
  }

  /* ── The navigation is drawn from what this account may open ─────
     A tab that always refuses is worse than no tab (§45.2), so the row is
     built after `me` answers rather than written into the markup. */
  function drawNav() {
    nav.textContent = "";
    var tabs = [["clients", "Clients", true],
                ["consultants", "Consultants", ME.canConsultants],
                ["access", "Who sees what", ME.canAccess]];
    tabs.forEach(function (t) {
      if (!t[2]) return;
      var b = el("button", TAB === t[0] ? "on" : null, t[1]);
      b.type = "button";
      b.setAttribute("data-tab", t[0]);
      b.addEventListener("click", function () { go(t[0]); });
      nav.appendChild(b);
    });
  }

  function go(tab) {
    TAB = tab;
    drawNav();
    clear();
    return redraw();
  }

  /* ── A SILENT REFRESH (§313.28) ───────────────────────────────────
     Islam: "this page needs silent refresh." Every control here ended in a
     full redraw that CLEARED the page first and put "Reading…" in its place,
     so pressing a seat blanked the whole pane and rebuilt it — a flash, a
     scroll jump, and the row you were working on gone from under the pointer.

     The page is built into a DETACHED node and swapped in when it is ready,
     so nothing empty is ever on screen; the scroll position is put back
     because a swap is not a navigation. §71.2's rule — never a repaint under
     a working hand — applied to the one page that had no other way to update
     itself. */
  function redraw() {
    if (TAB === "clients") return drawClients();
    if (TAB === "consultants") return drawConsultants();
    if (TAB === "access") return drawAccess();
  }

  /* `quiet` is passed by every control that is UPDATING what is already on
     screen, as opposed to arriving at it. Arriving still says "Reading…",
     because then there is nothing to keep. */
  function lead(quiet, msg) {
    if (quiet) return;
    clear();
    page.appendChild(el("p", "muted", msg));
  }

  /* Built detached, swapped in one move, scroll restored — so the page never
     holds an empty frame and the row under the pointer does not move. */
  function settle(build) {
    var y = window.scrollY;
    var next = document.createElement("div");
    var was = page;
    page = next;
    try { build(); } finally { page = was; }
    page.textContent = "";
    while (next.firstChild) page.appendChild(next.firstChild);
    window.scrollTo(0, y);
  }

  /* ── Clients ─────────────────────────────────────────────────── */
  function drawClients() {
    /* ── WHY A CLIENT SENT THEM BACK HERE (§313.32) ──────────────────
       A client whose register cannot place this account refuses and lands
       them on the cards, because the cards are beside the configuration that
       answers it. Said BEFORE the title, so it is the first thing read rather
       than a line under a grid of cards; taken once and cleared, or it would
       reappear on every visit long after the mapping was corrected. */
    var why = null;
    try {
      why = sessionStorage.getItem("smp.client.why");
      if (why) sessionStorage.removeItem("smp.client.why");
    } catch (e) { /* no storage is simply no sentence */ }
    if (why) say(why, true);

    /* Made here and appended after the title, so the search's own handler
       closes over the element it filters rather than over a hoisted blank.

       AND IT IS NAMED. The band below it is a card grid too and rightly wears
       the same `.cards` rule (§53.5), so a selector reading `.cards` reaches
       both — which is how something written later comes to mean "the client
       grid" and quietly include the worked example. `data-grid` is what a
       check or a rule addresses; the class stays about the layout. The new
       check's own first run found this, by going red on it. */
    var grid = el("div", "cards");
    grid.dataset.grid = "clients";

    var right = el("div");
    var search = el("input", "fld");
    search.placeholder = "Search clients"; search.style.width = "190px";
    /* TYPING NEVER REPAINTS (constitution XV): the cards are hidden in place.
       SCOPED TO THE CLIENT GRID (§317): the box says "Search clients", so with
       the worked example out of that grid it is no longer among the things it
       searches. That is a change and it is the honest one — today typing
       "demo" finds it. */
    search.addEventListener("input", function () {
      var q = search.value.trim().toLowerCase();
      Array.prototype.forEach.call(grid.querySelectorAll(".ccard[data-name]"), function (c) {
        c.hidden = !!q && c.dataset.name.indexOf(q) < 0;
      });
    });
    right.appendChild(search);
    title("Clients", right);

    page.appendChild(grid);
    grid.appendChild(el("p", "muted", "Reading your clients…"));

    post({ action: "cards" }).then(function (j) {
      grid.textContent = "";
      if (!j.ok) { say(j.error || "Could not read your clients.", true); return; }
      /* ── THE WAY IN IS DRAWN WHEN THERE IS NOTHING (§313.18, §61) ──
         This RETURNED on an empty list, before the Add card was appended — so
         the one person who can create a client was the one shown a dead end,
         and the sentence it showed them said to ask the platform's super
         user, which is who they are. §61's trap in its purest form: the only
         way to get a client is to add one, and the control that adds one was
         hidden precisely when there were none.

         AND THE EMPTY STATE SAYS WHAT THIS READER CAN DO ABOUT IT. Somebody
         who may add one is told to; somebody who may not is told who to ask.
         A refusal names the place that can fix it (§16.7), and for these two
         people that is not the same place. */
      /* ── THE WORKED EXAMPLE IS NOT ONE OF THE CLIENTS (§317) ────────
         Split by what the tenant IS, never by its name: `kind` is the
         column the server already sorts on, and a key spelled "demo" is a
         client's key like any other. Everything else about it is unchanged
         — same card, same amber, same Demo tag, same door. */
      var clients = j.cards.filter(function (c) { return c.kind !== "demo"; });
      var demos = j.cards.filter(function (c) { return c.kind === "demo"; });

      clients.forEach(function (c) { grid.appendChild(cardFor(c)); });
      if (j.canAdd) grid.appendChild(addCard());
      /* AND THE COUNT IS A COUNT OF CLIENTS. It read `j.cards.length`, which
         includes the demo — so on a platform seeded with the worked example
         and no clients, the sentence below never drew and the one person who
         could add one was shown a single amber card and no way in: §61's
         trap the empty state was written to close, by a road it did not
         cover. */
      if (!clients.length) {
        say(j.canAdd
          ? "No clients yet. Add the first one — it is created with its own name and nothing else."
          : "No client has been given to this account yet. Ask the platform's super user.");
      }

      /* Drawn only when there is one (§61): a heading over an empty band is
         furniture, and a platform with no demo seeded has nothing to say. */
      if (demos.length) {
        var apart = el("div", "apart");
        apart.appendChild(el("span", "akey", "The worked example"));
        var dgrid = el("div", "cards");
        demos.forEach(function (c) { dgrid.appendChild(cardFor(c)); });
        apart.appendChild(dgrid);
        page.appendChild(apart);
      }

      /* ── ARCHIVED CLIENTS (§323) ────────────────────────────────────
         The page's OWN band — the one the worked example sits in — rather
         than a second answer to "a row under the grid" (§53.5).

         A CLIENT THAT SIMPLY VANISHED COULD NEVER COME BACK: the only route
         would be through a card that is no longer drawn (§61). That is the
         whole reason this band exists, and it is also where Delete becomes
         reachable, so being archived is a real step rather than a hidden
         state.

         Drawn only when there is one, like the band above it: a heading over
         an empty band is furniture, and a platform with nothing archived has
         nothing to say. The server has already decided WHO sees this — it
         sends the list only to somebody who can bring one back, so there is
         no second answer here (§42). */
      if (j.archived && j.archived.length) {
        var arch = el("div", "apart");
        arch.appendChild(el("span", "akey", "Archived"));
        var agrid = el("div", "cards");
        agrid.dataset.grid = "archived";
        j.archived.forEach(function (c) { agrid.appendChild(archCardFor(c)); });
        arch.appendChild(agrid);
        page.appendChild(arch);
      }
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      grid.textContent = ""; say("Could not reach the server.", true);
    });
  }

  function cardFor(c) {
    var b = el("button", "ccard" + (c.kind === "demo" ? " demo" : ""));
    b.type = "button";
    b.dataset.client = c.key;
    b.dataset.name = String(c.name + " " + (c.industry || "")).toLowerCase();
    if (c.mark) {
      var im = el("img", "cmark"); im.src = c.mark; im.alt = ""; b.appendChild(im);
    } else {
      b.appendChild(el("div", "cmark", initials(c.name)));
    }
    b.appendChild(el("h2", null, c.name));
    if (c.industry) b.appendChild(el("p", "ind", c.industry));
    var foot = el("div", "foot");
    var tag = function (t, cls) { foot.appendChild(el("span", "tag" + (cls ? " " + cls : ""), t)); };
    if (c.kind === "demo") tag("Demo", "demo");
    /* THE SEAT IS WHAT THIS CARD SAYS ABOUT THIS PERSON — the thing they came
       to know, and the thing that decides what they can do when they arrive. */
    if (c.seat) tag(c.seat === "super" ? "Super user" : "SMO team", "seat");
    if (c.unreadable) tag("Not answering");
    else if (c.cycleOpen) tag("Cycle open", "open");
    else if (!c.planned) tag("No plan yet", "none");
    if (c.units != null && c.units > 0) tag(c.units + (c.units === 1 ? " unit" : " units"));
    if (!c.canOpen) tag("Listed only");
    b.appendChild(foot);

    if (c.canOpen) b.addEventListener("click", function () { location.assign("/" + c.key); });
    else b.disabled = true;

    if (c.canConfig) {
      var cog = el("span", "ccfg", "Settings");
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      /* THE SAME FLOW, WITH ITS ANSWERS IN IT (§322): there is no second
         screen for a client, so Settings opens set-up rather than a card. */
      var open = function (e) { e.stopPropagation(); e.preventDefault(); drawSetup(c.key); };
      cog.addEventListener("click", open);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") open(e); });
      b.appendChild(cog);
    }
    return b;
  }

  /* ── AN ARCHIVED CLIENT'S CARD (§323) ──────────────────────────────
     Everything the live card says about a client is about a client somebody
     is working in — a seat, a cycle, a count of units — and none of it is
     true of one that has been set aside, so this says the two things that
     ARE: when it was archived and who did it. A card that carried the live
     tags would read as a client you could still open.

     IT HAS NO DOOR. Their address is already closed, so a press that
     navigated there would land on "that client is not available" — §61 from
     the other side: a control that leads somewhere refusing is worse than no
     control. `disabled` because there is nothing behind it, not for the look.

     AND THE DATE IS THE READER'S, never the database's spelling: an ISO
     timestamp is a fact about storage. An unreadable or missing one says
     nothing at all rather than printing "Invalid Date" (§35, §15.1). */
  function archDate(v) {
    if (!v) return "";
    var d = new Date(v);
    if (isNaN(d.getTime())) return "";
    try {
      return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    } catch (e) { return ""; }
  }

  function archCardFor(c) {
    var b = el("button", "ccard arch");
    b.type = "button";
    b.disabled = true;
    b.dataset.client = c.key;
    b.dataset.arch = "1";
    if (c.mark) {
      var im = el("img", "cmark"); im.src = c.mark; im.alt = ""; b.appendChild(im);
    } else {
      b.appendChild(el("div", "cmark", initials(c.name)));
    }
    b.appendChild(el("h2", null, c.name));
    if (c.industry) b.appendChild(el("p", "ind", c.industry));
    var foot = el("div", "foot");
    var when = archDate(c.at);
    foot.appendChild(el("span", "tag arch", when ? "Archived " + when : "Archived"));
    if (c.by) {
      var who = el("span", "tag arch", c.by);
      who.title = "Archived by " + c.by;   /* clipped above, so the whole of it is here */
      foot.appendChild(who);
    }
    b.appendChild(foot);

    /* TWO CONTROLS, AND THE SECOND IS WHY THE FIRST IS NOT ENOUGH.
       Bring back is the ordinary thing to want from this band, so it is here
       rather than three presses away. Settings is the ONLY route to Deleting
       — that block lives on an archived client and nowhere else — so a card
       carrying Bring back alone would put the one irreversible act behind a
       screen with no door to it (§61). The check for this file found that by
       going red on it.

       Bring back is ONE function shared with the block inside (§53.5), never
       a second copy of the request. */
    if (c.canConfig) {
      var acts = el("div", "cacts");
      var back = el("span", "cback", "Bring back");
      back.setAttribute("role", "button"); back.tabIndex = 0;
      var go = function (e) { e.stopPropagation(); e.preventDefault(); bringBack(c.key, c.name); };
      back.addEventListener("click", go);
      back.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") go(e); });
      acts.appendChild(back);

      var cog = el("span", "ccfg", "Settings");
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      var open = function (e) { e.stopPropagation(); e.preventDefault(); drawSetup(c.key); };
      cog.addEventListener("click", open);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") open(e); });
      acts.appendChild(cog);
      b.appendChild(acts);
    }
    return b;
  }

  /* ONE REQUEST, BOTH DIRECTIONS AND BOTH SURFACES (§53.5): the band's Bring
     back and the block's Bring back are this, and the block's Archive is this
     with `on` true. A refusal is SAID — a control that silently does nothing
     is the shape this project keeps recording (§32, §171). */
  function setArchived(key, on) {
    return post({ action: "archiveClient", key: key, on: !!on });
  }
  function bringBack(key, name) {
    setArchived(key, false).then(function (j) {
      if (!j.ok) { say(j.error || "Could not bring " + name + " back.", true); return; }
      /* `go("clients")`, NEVER `drawClients()` — the first build called the
         renderer directly and `drawClients` does not CLEAR the page, so it
         appended a whole second copy underneath the first and the Archived
         band the press had just emptied was still sitting there, above a grid
         that now held the client twice. §100.2's family: whoever redraws a
         page is the one that clears it, and on this page that is `go`. Found
         by the check going red on "the band is gone" while every assertion
         about the grid passed. */
      go("clients");
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      say("Could not reach the server.", true);
    });
  }

  function addCard() {
    var b = el("button", "ccard add", "+ Add a client");
    b.type = "button";
    b.addEventListener("click", function () { drawNewClient(); });
    return b;
  }

  /* ── SETTING A CLIENT UP, OUT HERE (§322, spec 044) ──────────────────
     Islam: "the setup should happen on the external creatoin not inside ..
     the default create it's own units and functions that's wrong there is
     not default. it should open blank if they want bu the wizard should
     start on the outside window so the people after the setup can get intop
     the platform ready." And, of the card that used to sit beside it: "the
     wizard should go like the setting one up I don't know what is the
     chaning it later?"

     So there is ONE screen for a client, and it is this flow. Adding a
     client opens it at step 1; the Settings mark on a card opens the same
     flow with the client's own answers already in it, and the rail is how
     you reach the one thing you came to change. The card that asked for
     name, industry and notes a second time is gone.

     NOTHING IS DRAFTED. Every step commits when you leave it, and what the
     flow shows is read back from the server — the data IS the progress
     (§129), so there is no second copy of the answers to fall out of step
     and walking away costs nothing.

     EVERY STEP IS ADDRESSED BY ITS KEY, NEVER ITS NUMBER: the mockup's first
     build read the index in four places and every one was off by one the
     moment a step moved. */
  var STEPS = [
    { k:"client", key:"The client",       label:"The client",     q:"Which client are you setting up?" },
    { k:"units",  key:"The organisation", label:"Business units", q:"What are the business units?" },
    { k:"cos",    key:"The organisation", label:"Companies",      q:"Are the units grouped into companies?" },
    { k:"caps",   key:"Strategy",         label:"Capabilities",   q:"Are there capabilities beside the units?", later:1 },
    { k:"fns",    key:"Strategy",         label:"Functions",      q:"What supporting functions are there?" },
    { k:"words",  key:"Language",         label:"The words",      q:"What does this client call these things?" },
    { k:"office", key:"People",           label:"The office",     q:"Who runs the strategy office?" },
    { k:"done",   key:"Done",             label:"Summary",        q:"" }
  ];
  function stepIdx(k){ for (var i = 0; i < STEPS.length; i++) if (STEPS[i].k === k) return i; return 0; }

  /* THE STANDARD INDUSTRY LIST — Strategy-Formulation's own
     lib/constants/industries.ts, 45 entries on GICS in its eleven groupings
     (they are section comments there). Islam: "the industry should be a
     serachable drop down check the strategy formulation repo we build that
     list there so you can have a standard list." Carried here as the one
     list this page offers, so a client reads the same in both products. */
  var INDUSTRIES = [
    ["Technology & Communications", ["Technology & Software", "Telecommunications", "Media & Entertainment"]],
    ["Financial", ["Banking & Finance", "Insurance", "Investment & Asset Management"]],
    ["Healthcare & Life Sciences", ["Healthcare & Hospitals", "Pharmaceuticals & Biotech", "Medical Devices & Equipment"]],
    ["Consumer", ["Retail & E-commerce", "Consumer Goods & FMCG", "Food & Beverage", "Hospitality & Tourism", "Restaurants & Food Service"]],
    ["Industrial", ["Manufacturing", "Automotive", "Aerospace & Defense", "Chemicals", "Industrial Equipment & Machinery"]],
    ["Energy & Utilities", ["Oil & Gas", "Renewable Energy", "Utilities (Electric, Water, Gas)"]],
    ["Real Estate & Construction", ["Real Estate & Property", "Construction & Engineering", "Architecture & Design"]],
    ["Services", ["Professional Services & Consulting", "Legal Services", "Accounting & Audit", "Marketing & Advertising", "HR & Recruitment"]],
    ["Transportation & Logistics", ["Transportation & Logistics", "Shipping & Maritime", "Aviation & Airlines"]],
    ["Other Sectors", ["Education & Training", "Agriculture & Farming", "Mining & Metals", "Government & Public Sector", "Non-Profit & NGO", "Sports & Recreation", "Fashion & Apparel", "Printing & Publishing"]],
    ["", ["Other"]]
  ];
  /* A BAND, NEVER A HEADCOUNT, and the same five that product asks for: a
     number typed once is stale within the year and nobody comes back to
     correct it, while a band still reads true. */
  var SIZES = [["startup","Startup","1–10"], ["small","Small","11–50"],
               ["medium","Medium","51–200"], ["large","Large","201–1000"],
               ["enterprise","Enterprise","1000+"]];
  function sizeWord(v){
    for (var i = 0; i < SIZES.length; i++) if (SIZES[i][0] === v) return SIZES[i][1] + " · " + SIZES[i][2] + " people";
    return "Not set";
  }
  /* THE TWO PLAN TYPES THE PLATFORM HAS, and the one it does not — drawn and
     dulled, Islam's own instruction, so the intended shape stays visible and
     nothing offers a choice that would open an empty page (§61). */
  var FORMATS = [["pillars","Pillars",1], ["projects","Capabilities & projects",1],
                 ["objectives","Objectives & actions",0]];
  function fmtWord(f){ return f === "objectives" ? "obj" : f === "projects" ? "proj" : "pillars"; }

  /* The flow's own state: which client, which step, what has been answered,
     and what is not yet posted. `S.shape` is the server's answer, edited in
     place and posted back whole — the answers ARE the list (§322). */
  var S = null;

  function drawNewClient(){ drawSetup(null); }

  function drawSetup(key){
    if (!key) {
      S = { key:null, at:0, seen:[], canEdit:true, dirty:false, shapeDirty:false,
            client:{ name:"", industry:"", size:"", notes:"", mark:null },
            shape:{ companies:[], units:[], functions:[], words:{} },
            team:[], office:[], register:[], seats:null, holds:null,
            archived:false, archivedAt:null, archivedBy:null,
            canArchive:false, canDelete:false, goes:null };
      paintSetup();
      return Promise.resolve();
    }
    lead(false, "Reading…");
    return post({ action:"client", key:key }).then(function (j) {
      if (!j.ok) { clear(); say(j.error || "Could not open that client.", true); return; }
      /* AN ARCHIVED CLIENT IS READ, NOT EDITED (§323). `canEdit` is the
         grant AND the standing: their door is closed, so a form that took
         changes would be collecting them for a client nobody can open. The
         SERVER refuses the same two saves, or this is a rule the screen
         keeps and the save does not (§42). */
      var arch = j.client.status === "retired";
      S = { key:key, at:0, seen:[], canEdit:!!j.canEdit && !arch, dirty:false, shapeDirty:false,
            client:{ name:j.client.name, industry:j.client.industry || "",
                     size:j.client.size || "", notes:j.client.notes || "", mark:j.client.mark || null },
            shape:j.shape || { companies:[], units:[], functions:[], words:{} },
            team:j.team || [], office:j.office || [], register:j.register || [],
            seats:j.seats, holds:j.holds, made_here:j.client.made_here,
            archived:arch, archivedAt:j.client.archived_at || null,
            archivedBy:j.client.archived_by || null,
            canArchive:!!j.canArchive, canDelete:!!j.canDelete, goes:j.goes || null };
      S.shape.companies = S.shape.companies || [];
      S.shape.units = S.shape.units || [];
      S.shape.functions = S.shape.functions || [];
      S.shape.words = S.shape.words || {};
      paintSetup();
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  /* ── Committing ──────────────────────────────────────────────────────
     Two posts, because they are two things: the client's own record, and
     the shape of what it holds. Each goes only when it has changed, and a
     refusal is SAID rather than swallowed — the shape's refusal is the one
     that matters (a client with a plan in it is not re-shaped, §322). */
  function commitSetup(){
    if (!S || !S.key || !S.canEdit) return Promise.resolve(true);
    var chain = Promise.resolve(true);
    if (S.dirty) {
      var b = { action:"saveClient", key:S.key, name:S.client.name,
                industry:S.client.industry, size:S.client.size, notes:S.client.notes };
      if (S.markState !== undefined) b.mark = S.markState;
      chain = chain.then(function (okSoFar) {
        return post(b).then(function (r) {
          if (r.ok) { S.dirty = false; if (S.markState !== undefined) { S.client.mark = S.markState || null; S.markState = undefined; } }
          else setupSay(r.error || "Not saved.", true);
          return okSoFar && !!r.ok;
        });
      });
    }
    if (S.shapeDirty) {
      chain = chain.then(function (okSoFar) {
        return post({ action:"shapeClient", key:S.key, shape:S.shape }).then(function (r) {
          if (r.ok) S.shapeDirty = false;
          else setupSay(r.error || "The set-up was not saved.", true);
          return okSoFar && !!r.ok;
        });
      });
    }
    return chain.catch(function () { setupSay("Could not reach the server.", true); return false; });
  }

  /* ONE NOTICE, REPLACED — never a pile of them. `say()` appends, which is
     right for a page that is drawn once and wrong for a screen you press
     Save on repeatedly: that is how two "Saved." lines ended up stacked. */
  function setupSay(msg, bad){
    var n = document.getElementById("setupsaid");
    if (!n) return;
    n.textContent = msg || "";
    n.className = msg ? (bad ? "err" : "said") : "";
    n.hidden = !msg;
  }

  function goStep(i){
    if (i < 0 || i > STEPS.length - 1 || STEPS[i].later) return;
    if (S.seen.indexOf(S.at) < 0) S.seen.push(S.at);
    commitSetup().then(function () { S.at = i; paintSetup(); window.scrollTo({ top:0 }); });
  }

  /* ── The flow ────────────────────────────────────────────────────── */
  function paintSetup(){
    clear();
    var s = STEPS[S.at];
    var right = el("div");
    if (S.key) {
      var closeb = el("button", "btn solid", "Save and close");
      closeb.type = "button";
      closeb.addEventListener("click", function () {
        commitSetup().then(function (good) { if (good) go("clients"); });
      });
      right.appendChild(closeb);
    }
    var leave = el("button", "btn", S.key ? "Back to clients" : "Cancel");
    leave.type = "button";
    leave.addEventListener("click", function () { go("clients"); });
    right.appendChild(leave);
    title(S.key ? "Set up " + S.client.name : "Add a client", right);

    /* the rail */
    var rail = el("nav", "wzrail");
    rail.setAttribute("aria-label", "Set-up steps");
    STEPS.forEach(function (st, i) {
      var done = S.seen.indexOf(i) >= 0 && i !== S.at;
      var b = el("button", "wzstep" + (done ? " done" : "") + (st.later ? " later" : ""));
      b.type = "button";
      if (i === S.at) b.setAttribute("aria-current", "step");
      if (st.later) b.disabled = true;
      var n = el("span", "n", done ? "✓" : String(i + 1));
      b.appendChild(n);
      b.appendChild(document.createTextNode(st.label));
      if (!st.later) b.addEventListener("click", function () { goStep(i); });
      rail.appendChild(b);
    });
    page.appendChild(rail);

    /* ── AN ARCHIVED CLIENT SAYS SO FIRST (§323) ────────────────────
       Before the fields, because they are read-only from here down and a
       form that refuses every keystroke with nothing saying why reads as
       broken (§45.2). Drawn on every step, not only the first: whichever
       step somebody lands on has to explain itself. */
    if (S.archived) {
      var ab = el("div", "wzarched");
      ab.appendChild(document.createTextNode("This client is "));
      ab.appendChild(el("b", null, "archived"));
      var when = archDate(S.archivedAt);
      ab.appendChild(document.createTextNode(
        ". " + (when ? "Archived " + when : "Archived") +
        (S.archivedBy ? " by " + S.archivedBy : "") +
        ". Their link is closed, and nothing here can be changed until they are brought back."));
      page.appendChild(ab);
    }

    var grid = el("div", "wzgrid");
    var col = el("div");
    col.appendChild(el("span", "lab", s.key));
    col.appendChild(el("h2", "wzq", s.q || (S.client.name + " is set up.")));
    var why = s.k === "units"
        ? "Add as many as this client has. Leave it empty and it opens blank — nothing is put here that nobody asked for."
      : s.k === "fns"
        ? "Each function can plan its own way, and that decides what its pages hold. It stays changeable until the function has a plan in it."
      : s.k === "done"
        ? "Everything here stays editable afterwards. Nothing is locked."
      : "";
    if (why) col.appendChild(el("p", "wzwhy", why));
    var bodyBox = el("div");
    bodyBox.appendChild(setupBody(s.k));
    col.appendChild(bodyBox);

    var foot = el("div", "wzfoot");
    var back = el("button", "btn", "Back");
    back.type = "button"; back.disabled = S.at === 0;
    back.addEventListener("click", function () { goStep(S.at - 1); });
    foot.appendChild(back);
    if (S.at < STEPS.length - 1) {
      var next = el("button", "btn amber", "Next");
      next.type = "button";
      next.addEventListener("click", function () {
        if (!S.key) { createThenGo(); return; }
        goStep(S.at + 1 + (STEPS[S.at + 1] && STEPS[S.at + 1].later ? 1 : 0));
      });
      foot.appendChild(next);
    }
    var fn = el("span", "wzfnote", "Nothing is final — every answer stays editable afterwards.");
    foot.appendChild(fn);
    col.appendChild(foot);
    var said = el("p"); said.id = "setupsaid"; said.hidden = true;
    col.appendChild(said);
    grid.appendChild(col);

    grid.appendChild(setupShapePanel());
    page.appendChild(grid);
  }

  /* THE FIRST STEP IS WHAT CREATES THE CLIENT: the address is minted from
     the name and set once, so it has to exist before anything else can be
     written against it — and that is also what lets somebody walk away
     half-way and come back. */
  function createThenGo(){
    var nm = String(S.client.name || "").trim();
    if (!nm) { setupSay("A client needs a name before anything else can be set up.", true); return; }
    setupSay("Creating…");
    post({ action:"createClient", name:nm, industry:S.client.industry, size:S.client.size, notes:S.client.notes })
      .then(function (r) {
        if (!r.ok) { setupSay(r.error || "Not created.", true); return; }
        var mark = S.markState, at = S.at;
        drawSetup(r.key).then(function () {
          if (!S) return;
          if (mark !== undefined) { S.markState = mark; S.dirty = true; }
          S.seen = [at];
          S.at = at + 1;
          commitSetup().then(function () { paintSetup(); });
        });
      }).catch(function () { setupSay("Could not reach the server.", true); });
  }

  /* ── What you are building ───────────────────────────────────────── */
  function setupShapePanel(){
    var a = el("aside", "wzshape");
    a.setAttribute("aria-label", "What you are building");
    a.appendChild(el("h2", null, "What you are building"));
    a.appendChild(el("p", "cap", S.at >= stepIdx("fns")
      ? (S.client.name || "This client") + ", as answered so far."
      : "It fills in as you answer."));
    var org = el("div", "wzorg");
    org.appendChild(el("span", "nm", S.client.name || "The client"));
    a.appendChild(org);
    if (S.client.industry || S.client.size) {
      a.appendChild(el("p", "wzwho",
        [S.client.industry, S.client.size ? sizeWord(S.client.size) : ""].filter(Boolean).join(" · ")));
    }
    if (S.at < stepIdx("units")) {
      a.appendChild(el("p", "wznone", "Its business units come next."));
      return a;
    }
    var sw = el("div", "wzswitch");
    var s1 = el("span", "on", "Strategic"), s2 = el("span", null, "Functions");
    sw.appendChild(s1); sw.appendChild(s2);
    a.appendChild(sw);
    a.appendChild(chipBlock("Business units", S.shape.units, "unit", "None — this client can open blank."));
    if (S.at >= stepIdx("fns")) a.appendChild(chipBlock("Supporting functions", S.shape.functions, "fn", "None."));
    return a;
  }
  function chipBlock(label, list, cls, empty){
    var d = el("div", "wzside");
    var k = el("div", "wzsidekey", label);
    var ct = el("span", "ct", String(list.length));
    k.appendChild(ct);
    d.appendChild(k);
    if (!list.length) { d.appendChild(el("div", "wznone", empty)); return d; }
    var chips = el("div", "wzchips");
    list.forEach(function (x) {
      var c = el("span", "wzchip " + cls, x.name);
      if (cls === "fn") c.appendChild(el("span", "fmt", fmtWord(x.format)));
      chips.appendChild(c);
    });
    d.appendChild(chips);
    return d;
  }

  /* ── Each step ───────────────────────────────────────────────────── */
  function setupBody(k){
    var box = el("div");
    if (k === "client") return clientStep(box);
    if (k === "units") return listStep(box, S.shape.units, "unit");
    if (k === "cos") return companiesStep(box);
    if (k === "caps") return capsStep(box);
    if (k === "fns") return listStep(box, S.shape.functions, "fn");
    if (k === "words") return wordsStep(box);
    if (k === "office") return officeStep(box);
    return summaryStep(box);
  }

  function field(box, label, value, set, note){
    var w = el("div");
    w.appendChild(el("span", "lab", label));
    var i = el("input", "fld");
    i.type = "text"; i.value = value || "";
    if (!S.canEdit) i.readOnly = true;
    i.addEventListener("input", function () { set(i.value); S.dirty = true; });
    w.appendChild(i);
    if (note) w.appendChild(el("p", "note", note));
    box.appendChild(w);
    return i;
  }

  function clientStep(box){
    var rs = el("div", "rowset");
    field(rs, "The client's name", S.client.name, function (v) {
      S.client.name = v;
      var o = document.querySelector(".wzorg .nm");
      if (o) o.textContent = v || "The client";
    }, "What the platform is named after, everywhere — the chrome, the review deck and every email that leaves.");

    /* the searchable standard list */
    var iw = el("div");
    iw.appendChild(el("span", "lab", "Industry"));
    var pick = el("div", "wzpick");
    var inp = el("input", "fld");
    inp.type = "text"; inp.value = S.client.industry || "";
    inp.setAttribute("placeholder", "Type to search the list…");
    inp.setAttribute("autocomplete", "off");
    if (!S.canEdit) inp.readOnly = true;
    var panel = el("div", "wzpanel");
    panel.setAttribute("role", "listbox");
    panel.hidden = true;
    function fill(q){
      panel.textContent = "";
      var needle = String(q || "").trim().toLowerCase(), hits = 0;
      INDUSTRIES.forEach(function (g) {
        var keep = g[1].filter(function (n) { return !needle || n.toLowerCase().indexOf(needle) > -1; });
        if (!keep.length) return;
        hits += keep.length;
        if (g[0]) panel.appendChild(el("div", "gp", g[0]));
        keep.forEach(function (n) {
          var b = el("button", "opt", n);
          b.type = "button";
          if (n === S.client.industry) b.setAttribute("aria-selected", "true");
          b.addEventListener("click", function () {
            S.client.industry = n; S.dirty = true; inp.value = n; panel.hidden = true;
            var w = document.querySelector(".wzshape .wzwho");
            if (w) w.textContent = [n, S.client.size ? sizeWord(S.client.size) : ""].filter(Boolean).join(" · ");
          });
          panel.appendChild(b);
        });
      });
      if (!hits) panel.appendChild(el("div", "nohit", "Nothing matches that — pick Other if none of it fits."));
    }
    inp.addEventListener("focus", function () { fill(""); panel.hidden = false; });
    inp.addEventListener("input", function () { fill(inp.value); panel.hidden = false; });
    pick.appendChild(inp); pick.appendChild(panel);
    iw.appendChild(pick);
    iw.appendChild(el("p", "note", "The standard list — the same one Strategy Formulation uses, so a client reads the same in both."));
    rs.appendChild(iw);

    /* the size band */
    var zw = el("div");
    zw.appendChild(el("span", "lab", "Size"));
    var band = el("div", "wzband");
    band.setAttribute("role", "group");
    SIZES.forEach(function (z) {
      var b = el("button", null, z[1]);
      b.type = "button";
      /* DISABLED, NOT MERELY INERT (§220, §61). The handler has always opened
         `if (!S.canEdit) return;` and nothing had ever made `canEdit` false —
         `mayConfigureClient` is `mayReadConfig`, so anybody who could open
         this flow could write in it — so the read-only path had never once
         been drawn. §323 makes it real for an archived client, and a band
         that lights under the pointer and stores nothing is §96 with a
         cursor on it. */
      b.disabled = !S.canEdit;
      b.setAttribute("aria-pressed", S.client.size === z[0] ? "true" : "false");
      b.appendChild(el("span", "ppl", z[2] + " people"));
      b.addEventListener("click", function () {
        if (!S.canEdit) return;
        S.client.size = z[0]; S.dirty = true;
        Array.prototype.forEach.call(band.children, function (o) {
          o.setAttribute("aria-pressed", o === b ? "true" : "false");
        });
      });
      band.appendChild(b);
    });
    zw.appendChild(band);
    rs.appendChild(zw);

    var nw = el("div");
    nw.appendChild(el("span", "lab", "Notes"));
    var ta = el("textarea", "fld");
    ta.rows = 2; ta.value = S.client.notes || "";
    if (!S.canEdit) ta.readOnly = true;
    ta.addEventListener("input", function () { S.client.notes = ta.value; S.dirty = true; });
    nw.appendChild(ta);
    rs.appendChild(nw);

    var aw = el("div");
    aw.appendChild(el("span", "lab", "Its address here"));
    var a = el("input", "fld");
    a.value = S.key ? location.origin + "/" + S.key : location.origin + "/…";
    a.readOnly = true;
    aw.appendChild(a);
    aw.appendChild(el("p", "note", S.key
      ? "Made from the name and set once, so a link that has been sent keeps working."
      : "Made from the name when the client is created, and never changed after that."));
    rs.appendChild(aw);

    rs.appendChild(markBlock());
    box.appendChild(rs);
    box.appendChild(endBlocks());
    return box;
  }

  /* ── ENDING A CLIENT (§323, spec 047) ───────────────────────────────
     Islam: "we need an option to remove the client" — "both, demo client is
     not removable, and the name is Archive not put aside".

     WHY IT LIVES HERE. Settings is already the door onto everything about a
     client, and §273.4 settled this shape for the reporting cycle at Islam's
     own direction: the destructive act in its own block, behind a rule, under
     a heading, at the foot of the form. A door is only a guard if the
     dangerous thing is behind it — and a control that sat on the card would
     be one press from the grid.

     NOT DRAWN RATHER THAN DISABLED. The worked example can be neither
     archived nor deleted and neither can anybody but the platform's admin, so
     for them there is no block at all (§61): a greyed control invites a press
     and then explains itself, where an absent one asks nothing.

     THE ASK IS IN THE BLOCK. There is no dialog anywhere on this page, and
     one act does not earn the first (§2b) — and a question asked where the
     button was is a question about that button.

     AND THE BLOCK REWRITES ITSELF, NEVER `paintSetup()` (§71.2): a repaint
     under a typing hand would throw away the name half typed into the
     confirmation, which is the one field on this page somebody is asked to
     copy out by eye. */
  function endBlocks(){
    var wrap = el("div");
    if (!S.key || !S.canArchive) return wrap;

    function block(keyword){
      var b = el("div", "wzend");
      b.appendChild(el("span", "wzendkey", keyword));
      return b;
    }
    function rebuild(){ wrap.textContent = ""; draw(); }

    function trouble(box, msg){
      var p2 = el("p", "wzendwhy", msg);
      p2.style.color = "var(--bad)";
      box.appendChild(p2);
    }

    function draw(){
      if (!S.archived) {
        /* ── ARCHIVING ─────────────────────────────────────────────── */
        var a = block("Archiving");
        a.appendChild(el("p", "wzendwhy",
          "Archiving takes " + S.client.name + " off the clients page and closes their link — " +
          "anybody who goes to it is turned away exactly as if this client had never existed. " +
          "Nothing is lost, and you can bring them back."));
        var row = el("div", "wzendrow");
        var go = el("button", "btn risk", "Archive this client");
        go.type = "button";
        go.dataset.archive = "ask";
        go.addEventListener("click", function () { askArchive(a); });
        row.appendChild(go);
        a.appendChild(row);
        wrap.appendChild(a);
        return;
      }

      /* ── THE WAY BACK ──────────────────────────────────────────────
         First, and on its own, because it is the ordinary thing to want
         from this screen and the one below it is not. */
      var r = block("Bringing them back");
      r.appendChild(el("p", "wzendwhy",
        "Their link starts working again and the card returns to the clients page, exactly as it was."));
      var rrow = el("div", "wzendrow");
      var rb = el("button", "btn", "Bring " + S.client.name + " back");
      rb.type = "button";
      rb.dataset.unarchive = "1";
      rb.addEventListener("click", function () {
        rb.disabled = true; rb.textContent = "Bringing them back…";
        setArchived(S.key, false).then(function (j) {
          if (!j.ok) { rb.disabled = false; rb.textContent = "Bring " + S.client.name + " back";
                       trouble(r, j.error || "Not brought back."); return; }
          drawSetup(S.key);
        }).catch(function (e) {
          if (String(e.message) === "sign in") return;
          rb.disabled = false; rb.textContent = "Bring " + S.client.name + " back";
          trouble(r, "Could not reach the server.");
        });
      });
      rrow.appendChild(rb);
      r.appendChild(rrow);
      wrap.appendChild(r);

      if (!S.canDelete) return;

      /* ── AND THE WAY OUT ───────────────────────────────────────────
         Reachable from an archived client and nowhere else. The server
         asks the same thing again (§42), so this is where the rule is
         SHOWN rather than where it is kept. */
      var d = block("Deleting");
      d.appendChild(el("p", "wzendwhy",
        "Deleting removes everything this client has — their plan, their figures, their people " +
        "and their conversations. It cannot be undone and there is nothing to restore from."));
      var drow = el("div", "wzendrow");
      var db = el("button", "btn risk", "Delete permanently\u2026");
      db.type = "button";
      db.dataset.delete = "ask";
      db.addEventListener("click", function () { askDelete(d); });

      d.appendChild(drow);
      wrap.appendChild(d);

    /* ── THE ARCHIVE QUESTION ─────────────────────────────────────────
       It NAMES the client, because the way this goes wrong is pressing it
       on the wrong card — and by the time somebody is here they have been
       reading a form with this client's name at the top of it. */
    function askArchive(box){
      box.textContent = "";
      box.appendChild(el("span", "wzendkey", "Archiving"));
      var q = el("div", "wzask");
      q.dataset.ask = "archive";
