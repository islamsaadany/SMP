    #page[data-tab="memory"] .rhead{ grid-template-columns:auto minmax(0,1fr); padding:18px 16px 20px; gap:14px }
    #page[data-tab="memory"] .rhead .acts{ grid-column:1 / -1; justify-content:flex-start }
    #page[data-tab="memory"] .rhead h1{ font-size:24px }
    #page[data-tab="memory"] .rhead .logo{ width:44px; height:44px; line-height:44px; font-size:13px }
    #page[data-tab="memory"] .stand{ font-size:17px }
    #page[data-tab="memory"] .books{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px; padding:0 2px 14px }
    #page[data-tab="memory"] .cv{ min-height:150px; padding:12px 10px 12px 14px }
    #page[data-tab="memory"] .ctitle{ font-size:15px }
    #page[data-tab="memory"] .bigsearch{ flex-wrap:wrap }
    #page[data-tab="memory"] .bigsearch .ask{ border-left:0; padding-left:0; flex-basis:100% }
    #page[data-tab="memory"] .drow{ grid-template-columns:34px minmax(0,1fr) }
    #page[data-tab="memory"] .drow .state{ grid-column:2; justify-self:start }
    #page[data-tab="memory"] .edrow{ grid-template-columns:minmax(0,1fr) auto }
    #page[data-tab="memory"] .edrow > :nth-child(2){ grid-column:1; grid-row:2 }
    #page[data-tab="memory"] .formcard{ padding:16px 14px }
  }
  @media (prefers-reduced-motion:reduce){ #page[data-tab="memory"] .cover{ transition:none } #page[data-tab="memory"] .cover:hover{ transform:none } }
  /* the write-up's row on My work — a book where the tick is (spec 067 §8) */
  .mwdoc{ width:17px; height:17px; display:grid; place-items:center; color:var(--amber-tx) }
  .mwdoc svg{ width:17px; height:17px }
  .mwcase .t b{ font-weight:600 }

  /* ── The strategy frameworks library (spec 052) ───────────────────
     Every class here is prefixed `fw`, because a class name is one global
     namespace and this page already holds .tag, .cell, .row and .band
     (§65.9). Nothing below is a new colour or a new shape: the box and the
     list are .band's border, radius and shadow; the chips are the only new
     form, and they are a pill because a filter you turn on and off is not a
     tag. Phase A draws no Ask and no Add, so there is no CSS here for
     either — a rule with no markup is one the next reader takes for
     load-bearing (§24). */
  .fwbox{ border:1px solid var(--line); border-radius:11px; background:var(--surface);
    padding:13px; box-shadow:var(--shadow) }
  .fwbox .fld{ width:100% }
  .fwchips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:13px }
  .fwchip{ font-family:inherit; font-size:12px; font-weight:600; line-height:1; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-2); border-radius:999px; padding:6px 11px; cursor:pointer; white-space:nowrap }
  .fwchip:hover{ border-color:var(--amber-tx) }
  .fwchip.on{ background:var(--ff); border-color:var(--ff); color:var(--ff-ink) }
  .fwchip i{ font-style:normal; color:var(--ink-3); margin-left:5px; font-size:11px }
  .fwchip.on i{ color:var(--ff-quiet) }
  .fwcount{ margin:16px 0 9px; font-size:13px; color:var(--ink-3) }
  .fwlist{ border:1px solid var(--line); border-radius:11px; background:var(--surface);
    overflow:hidden; box-shadow:var(--shadow) }
  .fwrow{ display:block; width:100%; text-align:left; border:0;
    border-bottom:1px solid var(--line-soft); background:var(--surface); color:var(--ink);
    padding:12px 15px; cursor:pointer; font:inherit }
  .fwrow:last-child{ border-bottom:0 }
  /* AN AUTHOR `display` BEATS `[hidden]`, MEASURED RATHER THAN REASONED ABOUT
     (§93.11). The filter sets `row.hidden = true`, and with `display:block`
     above it the browser goes on drawing the row: the count said "12 of 80"
     over eighty visible rows, which is the worst shape a filter can take —
     it looks like it worked. The check found it by asking which rows are
     VISIBLE rather than which carry the attribute (§94.8). */
  .fwrow[hidden]{ display:none }
  .fwrow:hover, .fwrow:focus-visible{ background:var(--surface-2); outline:none }
  .fwrow .hd{ display:flex; gap:9px; align-items:baseline; flex-wrap:wrap }
  .fwrow .nm{ font-weight:600; font-size:14.5px }
  .fwrow .pp{ margin:4px 0 0; font-size:13px; color:var(--ink-3) }
  .fwsec{ margin-top:18px }
  .fwsec h3{ margin:0 0 5px; font-size:14px; font-weight:600 }
  .fwsec p{ margin:0; font-size:14px; color:var(--ink-2); white-space:pre-line }
  .fwgrid{ display:grid; grid-template-columns:1fr 1fr; gap:18px }
  @media (max-width:820px){ .fwgrid{ grid-template-columns:1fr } }
  /* ASKING IT: one field under the switch, and the answer in place under the
     box rather than on a page of its own — the question and what it produced
     read together, and the way back to searching is the switch you came in
     by. */
  .fwask{ display:flex; gap:9px; margin-top:11px; align-items:flex-start }
  .fwask .fld{ flex:1 1 220px; min-width:0 }
  .fwans{ background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
    padding:15px; margin-top:13px }
  .fwans > p{ margin:0 0 4px; font-size:14px; color:var(--ink-2); white-space:pre-line }
  /* EVERY SOURCE IS A DOOR, which is the memory's own rule for the memory's
     own reason: the next step is to go and read it. */
  .fwcite{ display:block; width:100%; text-align:left; margin-top:9px; border:1px solid var(--line);
    border-radius:9px; background:var(--surface); padding:11px 13px; cursor:pointer;
    font:inherit; color:var(--ink) }
  .fwcite:hover, .fwcite:focus-visible{ border-color:var(--amber-tx); outline:none }
  .fwcite .nm{ font-weight:600; font-size:14px }
  .fwcite .wy{ margin:4px 0 0; font-size:13px; color:var(--ink-3) }
  /* THE DRAFT SAYS IT IS ONE, in the amber this page already uses for a thing
     that is not settled yet — and it is the whole of decision 3 made visible:
     what is on screen is not in the library. */
  .fwdraft{ background:var(--amber-wash); border:1px solid var(--amber); border-radius:10px;
    padding:11px 13px; font-size:13.5px; color:var(--amber-tx); font-weight:600; margin-bottom:15px }
  .fwfields{ display:grid; gap:13px }
  .fwfields .fld{ width:100% }
  .fwfields textarea.fld{ resize:vertical; min-height:62px }
  /* A DECLINE IS NOT AN ERROR (§168, §190): nothing has gone wrong, the
     assistant has answered honestly, and the next thing to do is on the
     screen — so it wears the warning ground rather than the alarm one. */
  .fwdecl{ background:var(--warn-bg); border:1px solid var(--warn); border-radius:10px;
    padding:13px; font-size:14px; color:var(--warn) }

  /* ── The Copilot's settings (§501) ─────────────────────────── */
  .seg2{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--surface); flex-wrap:wrap }
  .seg2 button{ padding:6px 13px; font:inherit; font-size:13.5px; border:0; border-right:1px solid var(--line); background:transparent; color:var(--ink-2); cursor:pointer }
  .seg2 button:last-child{ border-right:0 }
  .seg2 button.on{ background:var(--surface-2); color:var(--ink); font-weight:600 }
  .cpsecs{ margin-top:14px }
  .parts{ display:flex; flex-direction:column; gap:8px; margin-top:12px }
  .part{ border:1px solid var(--line); border-radius:8px; background:var(--surface) }
  .part .ph{ display:flex; gap:10px; align-items:baseline; padding:10px 12px; cursor:pointer }
  .part .ph b{ font-variant-numeric:tabular-nums; color:var(--ink-3); min-width:1.5em }
  .part .ph .t{ font-weight:600 }
  .part .ph .r{ margin-left:auto; display:flex; gap:8px; align-items:center }
  .part .pb{ padding:0 12px 12px 40px; font-size:14px; line-height:1.55; max-width:78ch }
  .part .pb h3, .part .pb h4, .part .pb h5, .part .pb h6{ font-size:14px; margin:12px 0 4px }
  .part .pb ul{ margin:4px 0; padding-left:20px }
  .part .pb p{ margin:6px 0 }
  .part textarea.fld{ min-height:320px; font:13px/1.5 ui-monospace, SFMono-Regular, monospace; resize:vertical }
  .part .row{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }
  .cpwhy{ color:var(--ink-3); font-size:13px; margin-top:12px }

  /* ── HOME (spec 068) ──────────────────────────────────────────────
     Islam, of design-mockups/home/2026-10-23_home-v4.html: "build it
     compact, for all console". The greeting band, then your clients beside
     your tasks, then case studies' two cards. Every class is `ho`, because
     `.ph`, `.row`, `.cl` and `.list` already mean something here (§65.9).
     THE SERIF IS HOME'S AND NOWHERE ELSE'S: the greeting and the section
     titles, Islam's "keep the serif". */
  .hohello{ position:relative; overflow:hidden; background:var(--ff); color:var(--ff-ink); border-radius:14px;
    padding:16px 22px 17px; margin:0 0 16px }
  .hohello::before, .hohello::after{ content:""; position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,.07); pointer-events:none }
  .hohello::before{ width:300px; height:300px; right:-90px; top:-120px; background:rgba(255,255,255,.035) }
  .hohello::after{ width:210px; height:210px; right:-20px; top:-70px }
  /* the date is the band's gold line, as every other tab's is (Islam,
     2026-10-24: "the day and date in the home is a bit stuck into the good
     afternoon"): `.hohello p` below would otherwise give it the sentence's
     size, ink and spacing */
  .hodate, .hohello p.hodate{ margin:0 0 4px; font-size:10.5px; font-weight:700; line-height:1.5; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); min-height:14px }
  /* THE TITLES ARE GEORGIA, BOLD (Islam, 2026-10-24, of four fonts drawn
     and three more: "I like the georgia bold option"). Georgia is on every
     computer and looks the same on each, which the first serif (Iowan Old
     Style on a Mac, Palatino on Windows) did not; the greeting keeps its
     regular weight, the card titles are bold. */
  .hohello h1, .hochd h2{ font-family:Georgia, "Times New Roman", serif; font-weight:700 }
  .hohello h1{ font-weight:400 }
  .hohello h1{ margin:0; font-size:27px; line-height:1.15; color:var(--ff-ink) }
  .hohello p{ margin:4px 0 0; font-size:13.5px; color:var(--ff-quiet) }
  .hotop{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:stretch; margin:0 0 24px }
  .hotop > section{ display:flex; flex-direction:column; min-width:0 }
  .hosec{ margin:0 0 24px }
  /* A CARD WITH ITS HEADER INSIDE IT (Islam, 2026-10-24, option A of
     design-mockups/home/2026-10-24_home-round-2.html): an icon, the title in
     the band's serif, a count, and the card's control on the right. */
  .hocard{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; box-shadow:var(--shadow); overflow:hidden }
  .hochd{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; padding:10px 14px; border-bottom:1px solid var(--line-soft) }
  .hocic{ flex:none; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--amber-wash); color:var(--amber-tx) }
  .hocic svg{ width:17px; height:17px }
  .hochd h2{ margin:0; font-size:19px; line-height:1.15; white-space:nowrap }
  .hocnt{ font-size:11.5px; font-weight:700; border-radius:999px; padding:1px 8px; background:var(--surface-2); color:var(--ink-2); font-variant-numeric:tabular-nums }
  .hochd .sp{ flex:1 }
  .hobody{ flex:1 }
  .holink{ border:0; background:none; padding:0; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--amber-tx); cursor:pointer; white-space:nowrap }
  .holink:hover{ text-decoration:underline }
  .holink:focus-visible, .howd:focus-visible, .hosort button:focus-visible, .hotask:focus-visible, .hocase:focus-visible, .hobook:focus-visible{
    outline:2px solid var(--amber-tx); outline-offset:1px }
  /* Sort by: Date or Client, the same switch here and on My tasks */
  .hosort{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3) }
  .hosort .sw{ display:inline-flex; border:1px solid var(--line); border-radius:8px; padding:2px; background:var(--surface-2) }
  .hosort button{ border:0; background:transparent; color:var(--ink-2); font-family:inherit; font-size:12px; font-weight:600; line-height:1.4;
    padding:3px 9px; border-radius:6px; cursor:pointer }
  .hosort button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,28,43,.08) }
  .hogrp{ display:flex; align-items:center; gap:8px; padding:9px 14px 3px; font-size:11px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-3) }
  .hogrp i{ font-style:normal; font-weight:600; letter-spacing:0; text-transform:none }
  .hogrp i .late{ color:var(--bad) }
  .cmk{ flex:none; width:30px; height:30px; border-radius:8px; background:var(--ff); color:var(--amber); text-align:center; object-fit:contain;
    font:700 10.5px/30px ui-monospace, SFMono-Regular, monospace; letter-spacing:.04em }
  img.cmk{ background:#fff; padding:2px; box-sizing:border-box }
  /* YOUR CLIENTS, ONE LINE EACH (option B): the mark, the name, and the
     modules as words under it — no industry and no seat (Islam: "remove the
     client industry … it's so noisy"). A module with something outstanding
     carries a dot and the fact, red where it is an alarm. */
  .hocl{ display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line-soft) }
  .hocl:last-child{ border-bottom:0 }
  .hocl b{ display:block; font-size:14px; font-weight:600; line-height:1.3 }
  .howords{ display:flex; flex-wrap:wrap; gap:2px 14px; margin-top:1px }
  .howd{ display:inline-flex; align-items:center; gap:6px; border:0; background:none; padding:1px 0; font-family:inherit; font-size:12.5px;
    color:var(--ink-2); cursor:pointer; white-space:nowrap }
  .howd u{ text-decoration:none; border-bottom:1px solid var(--line) }
  .howd:hover{ color:var(--ink) }
  .howd:hover u{ border-bottom-color:var(--amber-tx) }
  .howd i{ display:inline-flex; align-items:center; gap:4px; font-style:normal; font-size:11px; font-weight:600; color:var(--amber-tx) }
  .howd i::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor }
  .howd i.alarm{ color:var(--bad) }
  .hotask{ display:grid; grid-template-columns:17px minmax(0,1fr) auto; gap:10px; align-items:start; width:100%; padding:9px 14px;
    border:0; border-bottom:1px solid var(--line-soft); background:transparent; color:var(--ink); font-family:inherit; text-align:left; cursor:pointer }
  .hotask:hover{ background:var(--surface-2) }
  .hotask:last-child{ border-bottom:0 }
  /* the tick is My tasks' own (.mwtick), ringed in the alarm when late and
     green when done */
  .hotask .mwtick{ margin-top:1px }
  .hotask.late .mwtick{ border-color:var(--bad) }
  .hotask.done .mwtick{ background:var(--good); border-color:var(--good) }
  .hotask.done .t{ color:var(--ink-3) }
  .hotask[aria-busy="true"]{ cursor:progress }
  .hosaid{ margin:8px 12px 0 }
  .hotask .bk{ width:17px; height:17px; color:var(--amber-tx) }
  .hotask .bk svg{ width:17px; height:17px }
  .hotask .t{ font-size:13.5px; line-height:1.4; overflow-wrap:anywhere }
  .hotask .t b{ font-weight:600 }
  .hotask .m{ display:block; font-size:12px; color:var(--ink-3); margin-top:1px }
  .hotask .m .c{ font-weight:600; color:var(--ink-2) }
  .hotask .wh{ font-size:12px; font-weight:600; color:var(--ink-2); white-space:nowrap; padding-top:1px }
  .hotask.late .wh{ color:var(--bad) }
  .honone{ margin:0; padding:16px; text-align:center; font-size:13px; color:var(--ink-3) }
  /* case studies: one card, its two halves side by side with a hairline */
  .hotwo{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); align-items:stretch }
  .hotwo > div{ padding:12px 16px 14px; min-width:0 }
  .hotwo > div + div{ border-left:1px solid var(--line-soft) }
  .hobxh{ margin:0 0 4px; font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3) }
  .hocase{ display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft) }
  .hocase:last-of-type{ border-bottom:0 }
  .horing{ width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    background:conic-gradient(var(--amber) calc(var(--p) * 1%), var(--surface-2) 0) }
  .horing span{ width:33px; height:33px; border-radius:50%; background:var(--surface); display:grid; place-items:center;
    font-size:11px; font-weight:600; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums }
  .hocase b, .hobook b{ display:block; font-size:14px; font-weight:600; line-height:1.3 }
  .hocase .s, .hobook .s{ display:block; font-size:12px; color:var(--ink-3); margin-top:1px }
  .hocase .s .late{ color:var(--bad); font-weight:600 }
  .hocase .btn{ padding:5px 12px; font-size:12.5px }
  .hofoot{ display:inline-block; margin-top:6px; border:0; background:none; padding:0; font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--amber-tx); cursor:pointer; text-align:left }
  .hofoot:hover{ text-decoration:underline }
  .hobook{ display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px; align-items:center; width:100%; padding:7px 0; border:0;
    border-bottom:1px solid var(--line-soft); background:transparent; color:var(--ink); font-family:inherit; text-align:left; cursor:pointer }
  .hobook:last-of-type{ border-bottom:0 }
  .hobook:hover b{ text-decoration:underline }
  .hospine{ width:32px; height:42px; border-radius:3px 7px 7px 3px; color:var(--ff-ink); text-align:center;
    font-size:9.5px; font-weight:700; line-height:42px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    background:linear-gradient(160deg, var(--ff), color-mix(in srgb, var(--ff) 75%, #000));
    box-shadow:inset 4px 0 0 rgba(0,0,0,.2), inset 0 -3px 0 var(--amber) }
  .hobook .new{ display:inline-block; margin-left:6px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--amber-ink); background:var(--amber); border-radius:999px; padding:1px 6px; vertical-align:2px }
  @media (max-width:999px){ .hotop, .hotwo{ grid-template-columns:minmax(0,1fr) } .hotwo > div + div{ border-left:0; border-top:1px solid var(--line-soft) } }
  @media (max-width:640px){
    .hohello{ padding:14px 16px 15px }
    .hocase{ grid-template-columns:42px minmax(0,1fr) }
    .hocase .btn{ grid-column:2; justify-self:start }
  }

  /* ── COMPACT, ACROSS THE CONSOLE (spec 068) ─────────────────────────
     Islam, of ClientPlus beside the console: "why is client plus a bit
     smaller in view than this dashboard?", then of the drawing that answered
     it, "build it compact, for all console". Said here, after every rule it
     narrows, so the earlier rules keep their reasons and this block holds
     the one decision: 14px text, a narrower column, the whole width of the
     window, tighter rows. A reading page keeps a measure of its own (the
     case study's prose stays in 66ch), so the width is for lists and grids. */
  body{ font-size:14px; line-height:1.5 }
  /* 224px since the name became Strategy Management Platform (2026-10-24):
     the mark, the name's longer line and the « button need it */
  .side{ width:224px }
  .sbhead{ gap:8px; padding:12px 8px 12px 14px }
  .nav button{ padding:8px 10px; font-size:13.5px }
  .nav{ gap:12px }
  .wrap{ max-width:none; padding:16px 22px 56px }
  .ptitle{ padding-bottom:10px; margin-bottom:14px }
  .ptitle h1{ font-size:19px }
  .mwmast{ padding:12px 18px 14px; margin-bottom:18px }
  .mwname h1{ font-size:21px }
  .mwstrip{ min-height:38px }
  .mwstrip b{ font-size:19px }
  .mwsec{ margin-bottom:22px }
  .mwsh h2{ font-size:15.5px }
  .mwrow{ padding:8px 0 }
  .mwrow .t{ font-size:14px }
  .ccard h2{ font-size:15px }
  .erow h3{ font-size:14px }
  .ecard h2{ font-size:19px }
  #page[data-tab="memory"] .ctitle{ font-size:15.5px }
  #page[data-tab="memory"] .shh h2{ font-size:16px }
  #page[data-tab="memory"] .stand{ font-size:17px }
  #page[data-tab="memory"] .rsec h2{ font-size:16.5px }
  #page[data-tab="memory"] .rsec > p{ font-size:15px }
  #page[data-tab="memory"] .icard .ih{ font-size:14px }
  @media (max-width:999px){ .nav button{ padding:11px 10px; font-size:14.5px } .wrap{ padding:14px 14px 50px } }

  /* MY TASKS' SORT BY (2026-10-24): the switch on its own line under the
     band; by client, each section is a client with its mark, and the rows
     drop the client pill the heading already says. */
  .mwbar{ display:flex; align-items:center; gap:12px; margin:-4px 0 12px }
  .mwsh h2{ display:flex; align-items:center; gap:8px }
  .mwsec.byc .mwcl{ display:none }
  @media (min-width:761px){ .mwsec.byc .mwrow{ grid-template-columns:20px minmax(0,1fr) 108px 128px 26px } }

  /* ── MY TASKS AND CLIENTS IN HOME'S LOOK (2026-10-24) ─────────────────
     Islam, of design-mockups/home/2026-10-24_fonts-and-one-look.html: "for
     the other modules build both as drawn". A page's band is Home's greeting
     band (the gold line, the name, a sentence, the circles at its right);
     what is under it sits in cards with their header inside. The card
     titles share Home's one title rule, so the font Islam settles on is one
     change. */
  .pgband, .mwmast{ position:relative; overflow:hidden; background:var(--ff); color:var(--ff-ink); border-radius:14px;

  /* My tasks: one card, the groups labelled inside it over a grey rule (A2) */

  /* Case studies: the library is one card; its industries are chips in a

  .cocard{ flex:none; margin:0 0 16px }

  .cpcard .pb{ padding:0 22px 18px; max-width:calc(78ch + 44px) }
  .cpcard .pb h3{ margin:16px -22px 10px; padding:12px 22px 7px; border-bottom:2px solid var(--line); font-size:11px; font-weight:700; letter-spacing:.12em;

  .pgband .pgeye, .hohello p.hodate, .mwmast .mwwk{ margin:0 0 4px; font-size:10.5px; font-weight:700; line-height:1.5; letter-spacing:.16em;

  /* ONLY THE TAB YOU ARE ON IS BOLD (Islam, 2026-10-24: "make the names of
     the modules not bold only the selected module is highlighted is
     enough"). The names go to regular weight in --sb-text, a step darker
     than the quiet grey, so they keep their contrast on the white; the one you are

  .nav button{ font-weight:400; color:var(--sb-text) }
  .nav button.on{ font-weight:600; color:var(--sb-ink) }

  /* THE CONSOLE AT 80% ON A COMPUTER (Islam, 2026-10-24: "I made the page
     80% smaller it became more visible and neat. can we make the default 80%
     smaller"). The whole page is zoomed, as his browser's own zoom did, so
     every size keeps its proportion; a phone keeps 100%, where 80% would
     put the words under a readable size. Two things a zoom changes are put
     back: the window's height (a zoomed 100vh is 80% of the window, so the

  @media (min-width:1000px){

    .shell{ min-height:calc(100vh / .8) }
    .side{ height:calc(100vh / .8); height:calc(100dvh / .8) }

<!-- §601: the chrome is one white column on the left; on a phone it opens
     from the menu button in .mtop. The tabs are drawn into #nav once `me`
     answers (§45.2), as they always were. -->
<div class="shell">

<!-- The debrief splitter (spec 045). Its own file, because node's own check

     than a second copy that could drift — it is the one piece of the memory
     with a wrong answer available to it. scripts/build-shell.mjs puts it at
     this address and refuses the build if this tag ever goes. -->
<!-- §620: the next page's shape, drawn at the press (smp-app/lib/navskel.ts) -->
<script src="/navskel.js"></script>
<script src="/memory-split.js"></script>
