  /* A DELIVERABLE'S FILE: saved first if the line is new, so it has an id
     from the server; then the store's three steps, one piece at a time, the
     loop Insights' publishing pop-up uses too (modules/insights/script.ts). */
  function csAttach(c, i, f, btn, said) {
    var d = CS.draft;
    if (!d.deliverables[i] || !String(d.deliverables[i].name || "").trim()) { said.textContent = "Give the deliverable a name before attaching its file."; said.hidden = false; return; }
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving…";
    var fail = function (msg) { btn.disabled = false; btn.textContent = was; said.textContent = msg; said.hidden = false; };
    var ready = d.deliverables[i].id ? Promise.resolve(true) : new Promise(function (res) { csSave(c, said, function () { res(true); }, function () { res(false); }); });
    ready.then(function (ok1) {
      if (!ok1) { fail("It could not be saved, so the file was not sent."); return; }
      var del = CS.draft.deliverables[i];
      if (!del || !del.id) { fail("Save the draft, then attach the file."); return; }
      return cpostCases({ action: "fileBegin", id: c.id, deliverable: del.id, name: f.name, bytes: f.size }).then(function (b) {
        if (!b || !b.ok) { fail((b && b.error) || "The upload could not be started."); return; }
        var piece = b.piece || (3 * 1024 * 1024);
        var total = Math.max(1, Math.ceil(f.size / piece));
        var parts = [];
        var q = "/api/cases/file?id=" + encodeURIComponent(c.id) + "&deliverable=" + encodeURIComponent(del.id) +
                "&name=" + encodeURIComponent(f.name) + "&path=" + encodeURIComponent(b.path) +
                "&storeKey=" + encodeURIComponent(b.storeKey) + "&uploadId=" + encodeURIComponent(b.uploadId);
        var step = function (n) {
          if (n > total) {
            btn.textContent = "Finishing…";
            return cpostCases({ action: "fileFinish", id: c.id, deliverable: del.id, name: f.name, bytes: f.size,
                                path: b.path, parts: parts, uploadId: b.uploadId, storeKey: b.storeKey }).then(function (r) {
              if (!r || !r.ok) { fail((r && r.error) || "The file could not be finished."); return; }
              del.file = r.file;
              var y = window.scrollY;
              settle(function () { csDraftPage(c, CS.draft); });
              window.scrollTo(0, y);
            });
          }
          btn.textContent = total > 1 ? "Sending " + n + " of " + total + "…" : "Sending…";
          return fetch(q + "&n=" + n, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/octet-stream" },
                                        body: f.slice((n - 1) * piece, Math.min(f.size, n * piece)) })
            .then(function (r) { return r.json(); })
            .then(function (r) {
              if (!r || !r.ok) { fail((r && r.error) || "That piece was refused."); return; }
              parts.push({ partNumber: r.partNumber, etag: r.etag });
              return step(n + 1);
            });
        };
        return step(1);
      });
    }).catch(function () { fail("Could not reach the server. Nothing was changed — try again."); });
  }

        var acts = el("div", "wacts");
        var openC = claudeLink(function () { return pre.textContent; });
        acts.appendChild(openC);
        acts.appendChild(copyBtn(function () { return pre.textContent; }));
        a.appendChild(acts);
        two.appendChild(a);
        /* THE PROMPT FOLLOWS AS YOU TYPE, and `input` is right here where it
           would be wrong almost anywhere else in this product: §35's rule is
           that typing must not REPAINT, and this repaints nothing — it writes
           into one <pre> that nobody is typing into (§63, §193). On `change`
           it went stale: `change` fires on BLUR, so somebody who filled in the
           end date and reached straight for Copy the prompt copied a prompt
           without it. */
        var follow = function () { pre.textContent = debPrompt(p.picked(), from, to); openC.href = claudeHref(pre.textContent); };
        [from, to].forEach(function (f) { f.addEventListener("input", follow); f.addEventListener("change", follow); });
        follow();

        var b = el("section", "stepcard");
        var h2 = el("h3"); h2.appendChild(el("span", "dot on", "B")); h2.appendChild(document.createTextNode("Paste the whole answer back"));
        b.appendChild(h2);
        var paste = el("textarea", "fld pastebox");
        paste.id = "d-paste";
        paste.value = d.paste;
        paste.setAttribute("aria-label", "Paste the whole answer back");
        paste.placeholder = "Paste the whole answer here, every block at once.";
        b.appendChild(paste);
        var pacts = el("div", "wacts");
        var read = el("button", "btn amber", "Read the learnings");
        read.type = "button";
        read.addEventListener("click", function () {
          var text = paste.value;
          if (!text.trim()) { say("There is nothing pasted in yet.", true); return; }
          var out = window.MemorySplit.split(text);
          if (!out.entries.length && !out.unread.length) { say("There is nothing pasted in yet.", true); return; }
          var c = p.picked(); if (!c) return;
          memGo("drafts", {
            deb: { client: c.client.key, clientName: c.client.name, caseId: c.id, caseName: c.name, caseKind: c.kind,
                   from: from.value, to: to.value, paste: text },
            drafts: out.entries.map(function (e) { return e; })
              .concat(out.unread.map(function (t) { return rawDraft(t); }))
          });
        });
        pacts.appendChild(read);
        pacts.appendChild(el("span", "muted", "You check each one before it is saved."));
        b.appendChild(pacts);
        two.appendChild(b);
        wiz.appendChild(two);
        page.appendChild(wiz);
      });
    });
  }

  /* OPEN IN CLAUDE: a new chat with the prompt already in its box. A link,
     not a script: it opens in a new tab wherever links do, and where it
     does nothing Copy the prompt is beside it. */
  function claudeHref(text) { return "https://claude.ai/new?q=" + encodeURIComponent(text); }
  function claudeLink(text) {
    var a = el("a", "btn amber", "Open in Claude");
    a.href = claudeHref(text());
    a.target = "_blank";
    a.rel = "noopener";
    return a;
  }

  function boxed(id, label, control) {
    var d = el("div");
    d.appendChild(labFor(id, label));
    d.appendChild(control);
    return d;
  }
  function rawDraft(text) {
    /* A BLOCK IT COULD NOT READ COMES BACK WHOLE (§184). It has no title —
       which is the one thing a person can add — so it is shown in the warning
       ground with its words in the first box rather than dropped. */
    return { kind: "lesson", kindGuessed: true, title: "", occurred: "",
             happened: text, did: "", came_of_it: "", next_person: "", raw: true };
  }
  function periodWord(from, to) {
    var f = String(from.value || "").trim(), t = String(to.value || "").trim();
    if (f && t) return f + " to " + t;
    return f || t || "";
  }
  function debPrompt(c, from, to) {
    var p = periodWord(from, to);
    var who = c ? c.client.name + (c.client.industry ? " (" + c.client.industry + ")" : "") : "this client";
    var work = c ? c.name + " (" + (TYPE_WORD[c.kind] || "Planning") + (spanLong(c.started, c.ended) ? ", " + spanLong(c.started, c.ended) : "") + ")" : "";
    return "I want to record what my consulting firm learned on a piece of work, for the next consultant.\n\n" +
      "  Client:   " + who + "\n" +
      (work ? "  Work:     " + work + "\n" : "") +
      (p ? "  Period:   " + p + "\n" : "") + "\n" +
      "Interview me. Ask ONE question at a time and wait for my answer before\n" +
      "asking the next one.\n\n" +
      "Start by asking me to walk you through the period — what we worked on and\n" +
      "what stands out. Then draw out, one at a time:\n\n" +
      "  · what went better than we expected, and why\n" +
      "  · what went wrong, or cost us time\n" +
      "  · what I know now that I did not know at the start\n" +
      "  · anything I would warn the next consultant about\n\n" +
      "For each thing I raise, ask me what happened, what we did, what came of\n" +
      "it, and what the next person should know. Push back when my answer is\n" +
      "vague, and do not move on until it would make sense to somebody who was\n" +
      "not there.\n\n" +
      "When I say I am done, write every item back in exactly this shape, and\n" +
      "nothing else — no summary, no preamble:\n\n" +
      "===\n" +
      "KIND: hiccup | practice | lesson\n" +
      "TITLE: one line, the thing itself\n" +
      (p ? "WHEN: " + p + "\n" : "") +
      "WHAT HAPPENED: ...\n" +
      "WHAT WE DID: ...\n" +
      "WHAT CAME OF IT: ...\n" +
      "WHAT THE NEXT PERSON SHOULD KNOW: ...\n" +
      "===\n\n" +
      "Repeat that block for each item. Use my words, not yours. If I only half\n" +
      "answered something, leave that line out rather than filling it in.";
  }

  /* ── What came back ────────────────────────────────────────────── */
  function drawDrafts() {
    var d = MEM.deb || {}, drafts = MEM.drafts || [];
    settle(function () {
      var right = el("span");
      var back = el("button", "btn", "Back");
      back.type = "button";
      back.addEventListener("click", function () { memGo("learn", { pickClient: d.client, pickCase: d.caseId }); });
      var save = el("button", "btn amber", "Save all " + drafts.length);
      save.type = "button";
      right.appendChild(back); right.appendChild(save);
      title("Check the learnings", right);

      if (!drafts.length) {
        page.appendChild(el("p", "muted", "Nothing left to save — go back and paste it again."));
        return;
      }

      /* THE COUNT AND THE ROWS ARE ONE LIST (§108.1): what was read and what
         was not are said separately, because four found over three that
         parsed is the badge people report as a bug. */
      var read = drafts.filter(function (x) { return !x.raw; }).length;
      var raw = drafts.length - read;
      var found = el("p", "found");
      var b = el("b", null, read + (read === 1 ? " learning read" : " learnings read"));
      found.appendChild(b);
      found.appendChild(document.createTextNode(
        (raw ? ", and " + raw + (raw === 1 ? " block it could not" : " blocks it could not") : "") +
        " · " + (clientNameOf(d.client) || d.client) + (d.caseName ? " · " + (TYPE_WORD[d.caseKind] || "") + " · " + d.caseName : "") + (periodOf(d) ? " · " + periodOf(d) : "")));
      var sp = el("span", "sp");
      KINDS.forEach(function (k) {
        var n = drafts.filter(function (x) { return !x.raw && x.kind === k[0]; }).length;
        if (n) sp.appendChild(el("span", "tag " + k[0], n + " " + (n === 1 ? k[1].toLowerCase() : k[1].toLowerCase() + "s")));
      });
      found.appendChild(sp);
      page.appendChild(found);

      var list = el("div", "drafts");
      drafts.forEach(function (dr) { list.appendChild(draftCard(dr, drafts, list)); });
      page.appendChild(list);

      save.addEventListener("click", function () {
        var missing = -1;
        for (var i = 0; i < drafts.length; i++) if (!String(drafts[i].title || "").trim()) { missing = i; break; }
        if (missing >= 0) { say("Give number " + (missing + 1) + " a title before saving.", true); return; }
        save.disabled = true;
        mpost({ action: "saveMany", client: d.client, caseId: d.caseId, entries: drafts }).then(function (r) {
          save.disabled = false;
          if (!r || !r.ok) { say((r && r.error) || "They could not be saved.", true); return; }
          memGo("client", { deb: null, drafts: null, clientKey: d.client, caseId: d.caseId });
        });
      });
    });
  }

  function clientNameOf(key) {
    return (MEM.deb && MEM.deb.client === key && MEM.deb.clientName) || (MEM.clientNames || {})[key] || key;
  }
  function periodOf(d) {
    var f = String(d.from || "").trim(), t = String(d.to || "").trim();
    return f && t ? f + " to " + t : (f || t || "");
  }

  /* A DRAFT EDITS IN PLACE AND NOTHING REPAINTS (§71.2): these boxes are being
     read and corrected, and a repaint under a working hand is how half a
     correction disappears. Only DROP redraws, because a row leaving changes
     the count above it. */
  function draftCard(dr, drafts, list) {
    var card = el("article", "dcard" + (dr.raw ? " raw" : ""));
    if (dr.raw) card.appendChild(el("p", "rawnote",
      "This one did not come back in the shape the prompt asked for — check it, or save it as it stands."));
    var head = el("div", "dhead");
    var ksel = el("select", "fld");
    ksel.setAttribute("aria-label", "Kind");
    KINDS.forEach(function (k) {
      var op = el("option", null, k[1]);
      op.value = k[0];
      if (k[0] === dr.kind) op.selected = true;
      ksel.appendChild(op);
    });
    ksel.addEventListener("change", function () { dr.kind = ksel.value; });
    head.appendChild(ksel);
    var tfld = el("input", "fld");
    tfld.type = "text";
    tfld.setAttribute("aria-label", "Title");
    tfld.value = dr.title || "";
    if (!dr.title) tfld.placeholder = "Give it a title";
    tfld.addEventListener("change", function () { dr.title = tfld.value; });
    head.appendChild(tfld);
    var drop = el("button", "btn drop", "Drop");
    drop.type = "button";
    drop.addEventListener("click", function () {
      var at = drafts.indexOf(dr);
      if (at >= 0) drafts.splice(at, 1);
      drawDrafts();
    });
    head.appendChild(drop);
    card.appendChild(head);

    QS.forEach(function (q) {
      var box = el("div", "dq");
      box.appendChild(el("label", "lab", q[1]));
      var ta = el("textarea", "fld");
      ta.value = dr[q[0]] || "";
      ta.addEventListener("change", function () { dr[q[0]] = ta.value; });
      box.appendChild(ta);
      card.appendChild(box);
    });
    return card;
  }

  /* ── Clients ─────────────────────────────────────────────────── */
  /* ── WHAT THE PAGE SHOWS WHILE IT ASKS (§371) ──────────────────────
     §369 measured the silence and did not fill it: one round trip, about
     740ms warm and seconds on a cold function, with the bar standing up
     over a hidden body — a window that looks open, answers nothing, and
     says nothing about either. Islam chose the grey skeleton over the
     page's own words, from two shot out of the real page
     (design-mockups/console-loading/).

     IT IS DRAWN BEFORE THE ANSWER, which is the one thing the gate above
     was stopping — and it is safe to draw for precisely the reason that
     gate exists: it holds no name, no mark, no colour of anybody's and no
     figure, so nothing here can turn out to have been somebody else's
     screen (§94.10).

     THE TITLE AND THE CARDS, AND NOT THE SEARCH BOX. That box filters the
     grid it is drawn beside, so one drawn over placeholders would take a
     word and hide three grey blocks (§61: a control with nothing to act on
     is not a choice). It arrives with the cards, where `drawClients`
     builds it — which is also why this draws the title WITHOUT a right-hand
     group rather than an empty one.

     THREE IS A GUESS, AND IT IS THE COST ISLAM TOOK WITH IT NAMED: a
     console with seven clients shows three and then seven. It is not
     remembered from the last visit, because a count kept per device is a
     second thing that has to stay true and §94.10 refused that same trade
     for the branding it was about.

     `aria-hidden` BECAUSE IT SAYS NOTHING. Three empty boxes read out one
     after another is noise, and what a screen reader gets here is what it
     gets today: the page, and then the cards when they land. */
  function drawWaiting() {
    /* §620: every tab arrives on its own shape (tabSkel), the way Clients
       has since §371 — My work's panel without its counts and a bare title
       elsewhere (§583, §400) gave way to the mockup's grey shapes. */
    SHOWN.appendChild(tabSkel(TAB));
    document.body.classList.add("ready");
  }
  /* §371's waiting cards, now drawn for Clients' shape (tabSkel) */
  function skelCards() {
    var grid = el("div", "cards");
    grid.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 3; i++) {
      var c = el("div", "ccard skel");
      var top = el("div", "ctop");
      top.appendChild(el("div", "sk-mark"));
      top.appendChild(el("div", "sk-line"));
      top.appendChild(el("div", "sk-line thin"));
      c.appendChild(top);
      /* The hairline the real card draws above its module rows, so the two
         shapes end the same way rather than the line appearing on arrival. */
      c.appendChild(el("div", "mods"));
      grid.appendChild(c);
    }
    return grid;
  }

  /* ── MY WORK (§400) ───────────────────────────────────────────────
     Islam: "for the main console we can have the person tasks across the
     different clients outside on the main platform derived from the internal
     tracker of the different clients work." Every row is read from that
     client's own Tracker on the server (lib/my-work.ts) — nothing here is
     stored, and every word ("Late 1 w", "This week", "In progress") is the
     Tracker's own, so an action reads the same in both places (§53.5).
     Pressing a row opens that client's Tracker. An admin may look at a
     colleague's list; the server reads it as THEIR world.

     IN THE INTERNAL TRACKER'S LOOK, AND A ROW CAN BE FINISHED HERE (§583).
     Islam: "let's redesign mywork to be similar to the internal tracker
     page", then, of the mockup, "add the done tick and status change too".
     The tick and the status are the Tracker's own write, made through that
     client's door and asked of the person LOOKING; the server says on every
     row whether they may (canChange), so a control is drawn only where it
     would be accepted (§61) and a row they may not change shows the fact.
     A ROW TICKED STAYS WHERE THE HAND LEFT IT, green, and leaves the list
     the next time My work is read — the Tracker's own rule for a row just
     ticked (§497). What a row says after a press is the server's answer,
     drawn by the same function that drew it first (§53.5). */
  var WORK = { who: "" };
  var MW_HEAD = { late: "Late", week: "This week", later: "Next week and later" };
  var MW_TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9.5 10 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MW_GO = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* THE PANEL, drawn the moment the tab is — the name at once, the week and
     the counts when the list lands — so the waiting page and the tab are one
     shape and nothing is taken back (§94.10). */
  function mwMast() {
    var mast = el("header", "mwmast");
    var top = el("div", "mwtop"), left = el("div");
    var wk = el("div", "mwwk");
    var name = el("div", "mwname");
    name.appendChild(el("h1", null, "My tasks"));
    left.appendChild(wk);
    left.appendChild(name);
    left.appendChild(el("p", "pgsub", "Your actions across every client's Internal Tracker."));
    var strip = el("div", "mwstrip");
    top.appendChild(left);
    top.appendChild(strip);
    mast.appendChild(top);
    page.appendChild(mast);
    return { wk: wk, name: name, strip: strip };
  }

  /* THE FOUR COUNTS, counted off flags the server set on each row (open,
     late, due this week — lib/my-work.ts), so this page decides nothing
     about a week. A row finished here is in none of them; it is counted
     again only if it is unticked. */
  function mwCount(strip, rows) {
    var open = rows.filter(function (r) { return r.status !== "done"; });
    var seen = {};
    open.forEach(function (r) { seen[r.client] = true; });
    var clients = Object.keys(seen).length;
    strip.textContent = "";
    [[open.length, "Open actions"],
     [open.filter(function (r) { return r.late; }).length, "Late", "late"],
     [open.filter(function (r) { return r.dueWeek; }).length, "Due this week"],
     [clients, clients === 1 ? "Client" : "Clients"]].forEach(function (t) {
      var d = el("div", t[2] && t[0] ? t[2] : null);
      d.appendChild(el("b", null, String(t[0])));
      d.appendChild(el("span", null, t[1]));
      strip.appendChild(d);
    });
  }

  /* A section's line: how many are open, and how many were finished here. */
  function mwMeta(sec) {
    var all = sec.querySelectorAll(".mwrow").length, done = sec.querySelectorAll(".mwrow.done").length;
    sec.querySelector(".mwsh .meta").textContent = (all - done) + " open" + (done ? " · " + done + " done" : "");
  }

  /* ONE ROW, from the server's row and nothing else: the tick, the action,
     its client, its week, its status, and the way into that client's
     Tracker. `act(r, status, via, row)` is the press. */
  function mwRow(r, statuses, act) {
    var done = r.status === "done";
    var row = el("div", "mwrow" + (done ? " done" : "") + (r.late ? " late" : ""));
    row.setAttribute("data-client", r.client);
    row.setAttribute("data-id", r.id);
    row.setAttribute("data-status", r.status);
    var tick = el("button", "mwtick");
    tick.type = "button";
    tick.setAttribute("role", "checkbox");
    tick.setAttribute("aria-checked", String(done));
    tick.setAttribute("aria-label", (done ? "Mark not done: " : "Mark done: ") + (r.title || ""));
    if (done) tick.innerHTML = MW_TICK;
    /* UNTICKING PUTS BACK WHAT THE ROW WAS when it was ticked here — the
       signed-off mockup's own line — where the Tracker's tick, which has no
       memory of it, puts Not started. */
    if (r.canChange) tick.addEventListener("click", function () { act(r, done ? (r.was || "not_started") : "done", "tick", row); });
    else tick.disabled = true;
    row.appendChild(tick);
    row.appendChild(el("span", "t", r.title || "(untitled)"));
    var cl = el("span", "mwcl");
    cl.title = r.clientName;
    cl.appendChild(el("i", null, r.clientName));
    row.appendChild(cl);
    row.appendChild(el("span", "mwwhen" + (r.late ? " late" : ""), r.when));
    var st = el("span", "mwst" + (r.status === "in_progress" ? " prog" : done ? " done" : "") + (r.canChange ? " live" : ""));
    if (r.canChange) {
      var sel = el("select");
      sel.setAttribute("aria-label", "Status: " + (r.title || ""));
      statuses.forEach(function (s) {
        var o = el("option", null, s.word);
        o.value = s.key;
        if (s.key === r.status) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { act(r, sel.value, "status", row); });
      st.appendChild(sel);
    } else {
      st.appendChild(el("span", null, r.statusWord));
    }
    row.appendChild(st);
    var link = el("a", "mwgo");
    link.href = "/" + r.client + "/tracker";
    link.title = "Open " + r.clientName + "’s Tracker";
    link.setAttribute("aria-label", link.title);
    link.innerHTML = MW_GO;
    row.appendChild(link);
    row.addEventListener("click", function (e) {
      if (e.target.closest(".mwtick, .mwst.live, .mwgo")) return;
      location.assign("/" + r.client + "/tracker");
    });
    return row;
  }

  /* A WRITE-UP ON MY WORK (spec 067 §8): the row's own look, a book where
     the tick is and "Case study" where the status is. It carries NO control
     to finish it — a case study is done when it is marked done on the case
     study, never from a list (§61) — so the whole row opens it. */
  function mwCaseRow(r) {
    var row = el("div", "mwrow mwcase" + (r.late ? " late" : ""));
    row.setAttribute("data-case", r.id);
    var mk = el("span", "mwdoc");
    mk.title = "An assignment to write up";
    mk.innerHTML = NAV_ICON.memory;
    row.appendChild(mk);
    var t = el("span", "t", "Write up the assignment · ");
    t.appendChild(el("b", null, r.name));
    row.appendChild(t);
    var cl = el("span", "mwcl");
    cl.title = r.clientName;
    cl.appendChild(el("i", null, r.clientName));
    row.appendChild(cl);
    row.appendChild(el("span", "mwwhen" + (r.late ? " late" : ""), r.when));
    var st = el("span", "mwst prog");
    st.appendChild(el("span", null, "Track Record"));
    row.appendChild(st);
    var link = el("button", "mwgo");
    link.type = "button";
    link.title = "Open the write-up";
    link.setAttribute("aria-label", "Write up " + r.name);
    link.innerHTML = MW_GO;
    row.appendChild(link);
    row.addEventListener("click", function () { CS.jump = { id: r.id, view: "case", fresh: true }; go("memory"); });
    return row;
  }

  function drawMyWork() {
    var m = mwMast();
    /* a refused or failed press is said here, under the panel, in words */
    var said = el("p", "err mwsaid");
    said.hidden = true;
    page.appendChild(said);
    var body = el("div");
    page.appendChild(body);
    body.appendChild(el("p", "muted", "Reading your actions…"));
    post({ action: "mywork", who: WORK.who || undefined }).then(function (j) {
      if (TAB !== "mywork") return;
      body.textContent = "";
      if (!j.ok) { body.appendChild(el("p", "err", j.error || "Could not read the actions.")); return; }
      m.wk.textContent = j.weekLine || "";
      var pick = null;
      if (j.people && j.people.length > 1) {
        pick = el("label", "mwwho");
        pick.appendChild(document.createTextNode("Show"));
        var sel = el("select");
        sel.setAttribute("data-workwho", "");
        j.people.forEach(function (p) {
          var o = el("option", null, p.email === ME.email ? "Me" : p.name);
          o.value = p.email === ME.email ? "" : p.email;
          if ((WORK.who || "") === o.value) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", function () { WORK.who = sel.value; go("mywork"); });
        pick.appendChild(sel);
      }
      /* WHAT WAS FINISHED IN THE LAST 30 DAYS comes with the open rows since
         2026-10-24, for Show done; it is kept apart from them, so nothing
         that counts or groups what is open ever sees it. */
      var doneRows = (j.rows || []).filter(function (r) { return r.status === "done"; });
      var rows = (j.rows || []).filter(function (r) { return r.status !== "done"; });
      /* THE CASE STUDIES THIS PERSON IS WRITING UP (spec 067): My work's
         second source, drawn among the actions by their due date and counted
         with them (lib/my-work.ts writeUps). */
      var cases = j.cases || [];
      var statuses = j.statuses || [];
      mwCount(m.strip, rows.concat(cases));
      if (j.unanswered && j.unanswered.length) {
        body.appendChild(el("p", "err", "Could not read the Tracker on " + j.unanswered.join(", ") + " — nothing has been lost; try again shortly."));
      }
      var noneOpen = (j.who && !j.who.self ? j.who.name + " has" : "You have") + " no open actions in any client's Tracker.";
      if (!rows.length && !cases.length && !doneRows.length) {
        body.appendChild(el("p", "muted", noneOpen));
        return;
      }

      /* ONE CARD, ITS FILTERS IN ITS HEADER (Islam, 2026-10-24, option A2 of
         design-mockups/home/2026-10-24_my-tasks-filters-header.html: "build
         A2"), as Clients' Active clients card has them: Show (whose tasks,
         for an admin), Sort by and a search. The groups are labelled
         sections inside it, each with a grey rule the card's whole width. */
      var card = el("section", "hocard mwlist");
      var hd = el("div", "hochd mwcardhd");
      var hic = el("span", "hocic");
      hic.innerHTML = HO_TASKS;
      hd.appendChild(hic);
      hd.appendChild(el("h2", null, "Open tasks"));
      var hcnt = el("span", "hocnt");
      hd.appendChild(hcnt);
      hd.appendChild(el("span", "sp"));
      var setCnt = function () {
        hcnt.textContent = String(rows.filter(function (r) { return r.status !== "done"; }).length + cases.length);
      };
      var search = el("input", "fld mwsearch");
      search.type = "search";
      search.placeholder = "Search tasks";
      search.setAttribute("aria-label", "Search tasks");
      /* a task found by its words or its client; a group with nothing found is left out */
      var find = function () {
        var q = search.value.trim().toLowerCase();
        Array.prototype.forEach.call(card.querySelectorAll(".mwsec"), function (sec) {
          var any = false;
          Array.prototype.forEach.call(sec.querySelectorAll(".mwrow"), function (r) {
            var hit = !q || r.textContent.toLowerCase().indexOf(q) >= 0 || (sec.getAttribute("data-name") || "").indexOf(q) >= 0;
            r.hidden = !hit;
            if (hit) any = true;
          });
          sec.hidden = !!q && !any;
        });
      };
      search.addEventListener("input", find);
      card.appendChild(hd);

      /* A PRESS IS ANSWERED BEFORE THE ROW CHANGES (§124): the row holds
         (aria-busy) until the server's write lands, and is then drawn again
         from the server's own answer in the same place. A refusal is said in
         words under the panel and the row is left as it was. */
      var act = function (r, status, via, row) {
        if (row.getAttribute("aria-busy") === "true") return;
        var ctl = row.querySelector(via === "tick" ? ".mwtick" : ".mwst select");
        row.setAttribute("aria-busy", "true");
        if (ctl) ctl.setAttribute("aria-busy", "true");
        var undo = function (msg) {
          row.removeAttribute("aria-busy");
          if (ctl) ctl.removeAttribute("aria-busy");
          if (via === "status" && ctl) ctl.value = r.status;
          said.textContent = msg;
          said.hidden = false;
        };
        post({ action: "workStatus", client: r.client, id: r.id, status: status }).then(function (a) {
          if (!a.ok) { undo(a.error || "That did not save. Nothing was changed — try again."); return; }
          var nr = a.row;
          /* what the row was before Done, for the untick */
          nr.was = r.status === "done" ? r.was : r.status;
          /* A ROW FROM THE DONE GROUP, UNTICKED, goes back among the open
             ones (and one ticked there again stays): the list is drawn again */
          var di = doneRows.indexOf(r);
          if (di >= 0) {
            doneRows.splice(di, 1);
            if (nr.status === "done") doneRows.splice(di, 0, nr); else rows.push(nr);
            mwCount(m.strip, rows);
            setCnt();
            said.hidden = true;
            draw(); find();
            return;
          }
          rows[rows.indexOf(r)] = nr;
          var focused = ctl && document.activeElement === ctl;
          var fresh = mwRow(nr, statuses, act);
          row.parentNode.replaceChild(fresh, row);
          mwMeta(fresh.parentNode);
          mwCount(m.strip, rows);
          setCnt();
          said.hidden = true;
          if (focused) {
            var f = fresh.querySelector(via === "tick" ? ".mwtick" : ".mwst select");
            if (f) f.focus();
          }
        }).catch(function (e) {
          if (String(e.message) === "sign in") return;
          undo("Could not reach the server. Nothing was changed — try again.");
        });
      };

      var list = el("div");
      list.setAttribute("data-grid", "mywork");
      /* A GROUP'S LABEL (A2): its name (Late in red), how many are open, and
         by client a way straight into that client's Internal Tracker, over a
         grey rule the card's whole width. */
      var head = function (sec, n, name, late, client) {
        if (late) sec.classList.add("late");
        var sh = el("div", "mwsh");
        sh.appendChild(name);
        sh.appendChild(el("span", "meta"));
        if (client) {
          sh.appendChild(el("span", "sp"));
          var to = el("a", "holink", "Internal Tracker →");
          to.href = "/" + client + "/tracker";
          sh.appendChild(to);
        }
        sec.appendChild(sh);
      };
      /* BY DATE (Late · This week · Next week and later) or BY CLIENT, one
         numbered section a client, by its name (Islam, 2026-10-24: "a sort
         by so it shows by client"). The rows are the same rows, read from
         `rows` at the press, so a tick made under one order is in the other. */
      var draw = function () {
        list.textContent = "";
        var n = 0;
        if (!rows.length && !cases.length) list.appendChild(el("p", "muted mwnone", noneOpen));
        /* in date order with the actions, a write-up with no date last */
        var all = rows.map(function (r) { return [r.due || "9999", 0, r]; })
          .concat(cases.map(function (r) { return [r.due || "9999", 1, r]; })).sort(byDue);
        if (TSORT.by === "client") {
          byClient(all).forEach(function (g) {
            n++;
            var sec = el("section", "mwsec byc");
            sec.setAttribute("data-client", g.key);
            /* the client's name alone (Islam: "no need for the logo to appear") */
            sec.setAttribute("data-name", String(g.name || "").toLowerCase());
            head(sec, n, el("h2", null, g.name), false, g.key);
            g.rows.forEach(function (x) { sec.appendChild(x[1] ? mwCaseRow(x[2]) : mwRow(x[2], statuses, act)); });
            mwMeta(sec);
            list.appendChild(sec);
          });
          drawDone();
          return;
        }
        ["late", "week", "later"].forEach(function (b) {
          var mine = all.filter(function (x) { return x[2].bucket === b; });
          if (!mine.length) return;
          n++;
          var sec = el("section", "mwsec");
          sec.setAttribute("data-bucket", b);
          head(sec, n, el("h2", null, MW_HEAD[b]), b === "late");
          mine.forEach(function (x) { sec.appendChild(x[1] ? mwCaseRow(x[2]) : mwRow(x[2], statuses, act)); });
          mwMeta(sec);
          list.appendChild(sec);
        });
        drawDone();
      };
      /* SHOW DONE (Islam, 2026-10-24: "done last week and done in the last
         30 days but last week is the important one"): a green group at the
         foot of the card, newest first, each row ticked with the day it was
         finished; unticking one puts it back among the open ones. */
      var drawDone = function () {
        if (TDONE.show === "hide") return;
        var back = new Date();
        back.setDate(back.getDate() - (TDONE.show === "week" ? 7 : 30));
        var from = back.getFullYear() + "-" + ("0" + (back.getMonth() + 1)).slice(-2) + "-" + ("0" + back.getDate()).slice(-2);
        var got = doneRows.filter(function (r) { return (r.doneDay || "") >= from; })
          .sort(function (a, b) { return (b.doneDay || "").localeCompare(a.doneDay || ""); });
        var sec = el("section", "mwsec done");
        sec.setAttribute("data-bucket", "done");
        var sh = el("div", "mwsh");
        sh.appendChild(el("h2", null, TDONE.show === "week" ? "Done in the last week" : "Done in the last 30 days"));
        sh.appendChild(el("span", "meta", String(got.length)));
        sec.appendChild(sh);
        if (!got.length) sec.appendChild(el("p", "muted mwnone", "Nothing finished in that time."));
        got.forEach(function (r) { sec.appendChild(mwRow(r, statuses, act)); });
        list.appendChild(sec);
      };
      if (pick) hd.appendChild(pick);
      hd.appendChild(sortSwitch(function () { draw(); find(); }));
      hd.appendChild(hoSwitch("Done", [["hide", "Hide"], ["week", "Last week"], ["month", "30 days"]], TDONE.show, function (v) {
        TDONE.show = v;
        try { localStorage.setItem("smp.tasks.done", v); } catch (e) { /* this device only */ }
        draw(); find();
      }));
      hd.appendChild(search);
      card.appendChild(list);
      body.appendChild(card);
      draw();
      setCnt();
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      body.textContent = ""; body.appendChild(el("p", "err", "Could not reach the server."));
    });
  }

  /* ── HOME (spec 068) ──────────────────────────────────────────────
     Islam: "we need a user dashboard design when they open, maybe we adjust
     my work to be the dashboard where it shows your tasks and it shows your
     clients to open directly from there", then, of the drawings, "the
     screen should split between the clients and the tasks, clients on the
     left and tasks on the right … with overdue and this week in the same
     place and all tasks takes the person to the tasks tab", "below 2 cards
     the case studies", and "the admin also sees his clients".
     NOTHING HERE IS ITS OWN ANSWER. The clients are the `cards` answer the
     boot already holds, narrowed to a seat; the tasks are My tasks' own
     `mywork` rows; the case studies are /api/cases `home`. So every word and
     mark here is the one the page it opens says (§53.5). */
  var HO_TASKS = NAV_SVG + '<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>';

  /* SORT BY DATE OR BY CLIENT (Islam, 2026-10-24: "for the tasks in the
     dashboard and in the my tasks module can we add a sort by so it shows by
     client in both areas"). One choice for both places, kept on this device
     the column's own way (§601). */
  var TSORT = { by: "date" };
  try { if (localStorage.getItem("smp.tasks.sort") === "client") TSORT.by = "client"; } catch (e) { /* this device only */ }
  /* A WORD AND A PAIR OF CHOICES, one pressed: Sort by Date · Client, and
     Home's clients' Show Mine · Demo */
  function hoSwitch(word, opts, on, pick) {
    var w = el("span", "hosort");
    w.appendChild(document.createTextNode(word));
    var sw = el("span", "sw");
    sw.setAttribute("role", "group");
    sw.setAttribute("aria-label", word);
    opts.forEach(function (o) {
      var b = el("button", null, o[1]);
      b.type = "button";
      b.setAttribute("data-sort", o[0]);
      b.setAttribute("aria-pressed", String(on === o[0]));
      b.addEventListener("click", function () {
        if (b.getAttribute("aria-pressed") === "true") return;
        sw.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        pick(o[0]);
      });
      sw.appendChild(b);
    });
    w.appendChild(sw);
    return w;
  }
  function sortSwitch(onChange) {
    return hoSwitch("Sort by", [["date", "Date"], ["client", "Client"]], TSORT.by, function (v) {
      TSORT.by = v;
      try { localStorage.setItem("smp.tasks.sort", v); } catch (e) { /* this device only */ }
      onChange();
    });
  }
  var HOCL = { show: "mine" };
  /* My tasks' Show done: hide, the last week or the last 30 days, kept on this device */
  var TDONE = { show: "hide" };
  try { var td = localStorage.getItem("smp.tasks.done"); if (td === "week" || td === "month") TDONE.show = td; } catch (e) { /* this device only */ }
  try { if (localStorage.getItem("smp.home.clients") === "demo") HOCL.show = "demo"; } catch (e) { /* this device only */ }
  /* GROUPED BY CLIENT: clients with something late first, then by their
     earliest date, then by name; inside a client, by date. `list` is
     [due, isCase, row]. */
  function byClient(list) {
    var g = {}, order = [];
    list.forEach(function (x) {
      var k = x[2].client;
      if (!g[k]) { g[k] = { key: k, name: x[2].clientName, rows: [], late: 0, first: "9999" }; order.push(k); }
      g[k].rows.push(x);
      if (x[2].late) g[k].late++;
      if (x[0] < g[k].first) g[k].first = x[0];
    });
    return order.map(function (k) { return g[k]; }).sort(function (a, b) {
      return (b.late > 0 ? 1 : 0) - (a.late > 0 ? 1 : 0) || (a.first < b.first ? -1 : a.first > b.first ? 1 : 0) || String(a.name).localeCompare(String(b.name));
    });
  }
  function byDue(a, c) { return a[0] < c[0] ? -1 : a[0] > c[0] ? 1 : a[1] - c[1]; }
  /* a client's mark: its logo where it has one (from the cards), else initials */
  var MARKS = {};
  function clientMark(key, name) {
    if (MARKS[key]) { var im = el("img", "cmk"); im.src = MARKS[key]; im.alt = ""; return im; }
    return el("span", "cmk", initials(name));
  }

  function hoHello() {
    var band = el("header", "hohello");
    var now = new Date(), h = now.getHours();
    var date = "";
    try { date = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short", year: "numeric" }); } catch (e) { date = ""; }
    band.appendChild(el("p", "hodate", date));
    var first = ME && ME.name ? String(ME.name).trim().split(/\s+/)[0] : "";
    band.appendChild(el("h1", null, (h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + (first ? ", " + first : "")));
    /* Islam, 2026-10-24, of four sentences: "What needs you today" */
    band.appendChild(el("p", null, "Here is what needs you today across your clients."));
    page.appendChild(band);
  }

  /* A CARD WITH ITS HEADER INSIDE IT (Islam's option A, 2026-10-24): the
     icon, the title, a count, and on the right the card's own controls. */
  function hoCard(host, name, icon, home) {
    var card = el("section", "hocard");
    card.setAttribute("data-home", home);
    var hd = el("div", "hochd");
    var ic = el("span", "hocic");
    ic.innerHTML = icon;
    hd.appendChild(ic);
    hd.appendChild(el("h2", null, name));
    var cnt = el("span", "hocnt");
    cnt.hidden = true;
    hd.appendChild(cnt);
    hd.appendChild(el("span", "sp"));
    card.appendChild(hd);
    var body = el("div", "hobody");
    body.appendChild(el("p", "honone", "Reading…"));
    card.appendChild(body);
    host.appendChild(card);
    return { card: card, head: hd, body: body, count: function (n) { cnt.textContent = String(n); cnt.hidden = false; } };
  }
  function hoLink(words, press) {
    var a = el("button", "holink", words);
    a.type = "button";
    a.addEventListener("click", press);
    return a;
  }

  /* YOUR CLIENTS, ONE LINE EACH (Islam's option B): the mark, the name, and
     the modules as words under it. No industry and no seat. */
  function hoClient(c) {
    var row = el("div", "hocl");
    row.setAttribute("data-client", c.key);
    row.appendChild(clientMark(c.key, c.name));
    var who = el("span");
    who.appendChild(el("b", null, c.name));
    var words = el("span", "howords");
    if (c.canOpen) (c.modules || []).forEach(function (m) {
      var b = el("button", "howd");
      b.type = "button";
      b.setAttribute("data-module", m.key);
      b.appendChild(el("u", null, m.label));
      if (m.mark) {
        var mk = el("i", m.alarm ? "alarm" : null, m.mark);
        if (m.tip) mk.title = m.tip;
        b.appendChild(mk);
      }
      b.addEventListener("click", function () { moduleGo(c, m); });
      words.appendChild(b);
    });
    who.appendChild(words);
    row.appendChild(who);
    /* SETTINGS AT THE FAR RIGHT (Islam, 2026-10-24: "add the settings
       button on the far right of the table", the sliders mark): the
       client's own Setup, as the card's Settings on Clients opens it */
    if (c.canConfig) {
      var cog = settingsChip(c.name);
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      var setup = function (e) { e.preventDefault(); location.assign("/" + c.key + "/setup"); };
      cog.addEventListener("click", setup);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") setup(e); });
      row.appendChild(cog);
    }
    return row;
  }

  /* A TASK ON HOME OPENS WHAT ITS ROW ON MY TASKS OPENS — the client's
     Tracker, or the case study to write — AND ITS TICK FINISHES IT (§614.1):
     My tasks' own `workStatus` write, drawn live only where the server says
     this person may (canChange), the row staying where the hand left it,
     green, until Home is read again (§583). A write-up has no tick: it is
     done on the case study, never from a list (spec 067 §8). Under a client's
     heading the row does not name the client again. */
  function hoTask(r, isCase, act, noClient) {
    var done = !isCase && r.status === "done";
    var b = el("div", "hotask" + (r.late && !done ? " late" : "") + (done ? " done" : ""));
    b.tabIndex = 0;
    b.setAttribute("role", "link");
    if (isCase) {
      b.setAttribute("data-case", r.id);
      var bk = el("span", "bk");
      bk.innerHTML = NAV_ICON.memory;
      b.appendChild(bk);
    } else {
      b.setAttribute("data-client", r.client);
      b.setAttribute("data-id", r.id);
      var tick = el("button", "mwtick");
      tick.type = "button";
      tick.setAttribute("role", "checkbox");
      tick.setAttribute("aria-checked", String(done));
      tick.setAttribute("aria-label", (done ? "Mark not done: " : "Mark done: ") + (r.title || ""));
      if (done) tick.innerHTML = MW_TICK;
      if (r.canChange && act) tick.addEventListener("click", function (e) { e.stopPropagation(); act(r, b); });
      else { tick.disabled = true; tick.title = "Only its owner or the client's Super user can finish this"; }
      b.appendChild(tick);
    }
    var t = el("span", "t");
    if (isCase) { t.appendChild(document.createTextNode("Write up the assignment · ")); t.appendChild(el("b", null, r.name)); }
    else t.appendChild(document.createTextNode(r.title || "(untitled)"));
    var m = el("span", "m");
    if (!noClient) { m.appendChild(el("span", "c", r.clientName)); m.appendChild(document.createTextNode(" · ")); }
    m.appendChild(document.createTextNode(isCase ? "Track Record" : r.statusWord || ""));
    t.appendChild(m);
    b.appendChild(t);
    b.appendChild(el("span", "wh", r.when || ""));
    var open = function () {
      if (isCase) { CS.jump = { id: r.id, view: "case", fresh: true }; go("memory"); }
      else location.assign("/" + r.client + "/tracker");
    };
    b.addEventListener("click", function (e) { if (!e.target.closest(".mwtick")) open(); });
    b.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target === b) open(); });
    return b;
  }

  /* YOUR TASKS: ONE LIST, overdue first (its date in red), then this week —
     the two tabs are gone (Islam: "remove the overdue and this week
     filters"). Next week and later stay on My tasks. */
  function hoTasks(c, j) {
    var box = c.body;
    box.textContent = "";
    if (!j || !j.ok) { box.appendChild(el("p", "honone", (j && j.error) || "Could not read your tasks.")); return; }
    var near = function (r) { return r.bucket === "late" || r.bucket === "week"; };
    var list = (j.rows || []).filter(function (r) { return r.status !== "done" && near(r); }).map(function (r) { return [r.due || "9999", 0, r]; })
      .concat((j.cases || []).filter(near).map(function (r) { return [r.due || "9999", 1, r]; }));
    /* a refused or failed tick is said here, in words, and the row is left as it was */
    var said = el("p", "err hosaid");
    said.hidden = true;
    var rows = el("div");
    var recount = function () { c.count(rows.querySelectorAll(".hotask:not(.done)").length); };
    var act = function (r, row) {
      if (row.getAttribute("aria-busy") === "true") return;
      var done = r.status === "done";
      var hadFocus = document.activeElement === row.querySelector(".mwtick");
      row.setAttribute("aria-busy", "true");
      var undo = function (msg) { row.removeAttribute("aria-busy"); said.textContent = msg; said.hidden = false; };
      post({ action: "workStatus", client: r.client, id: r.id, status: done ? (r.was || "not_started") : "done" }).then(function (a) {
        if (!a.ok) { undo(a.error || "That did not save. Nothing was changed — try again."); return; }
        var nr = a.row;
        nr.was = done ? r.was : r.status;
        /* the row keeps its place in the list, so a re-sort keeps the tick */
        list.forEach(function (x) { if (x[2] === r) x[2] = nr; });
        var fresh = hoTask(nr, false, act, row.getAttribute("data-noclient") === "1");
        if (row.getAttribute("data-noclient") === "1") fresh.setAttribute("data-noclient", "1");
        row.parentNode.replaceChild(fresh, row);
        said.hidden = true;
        recount();
        if (hadFocus) fresh.querySelector(".mwtick").focus();
      }).catch(function (e) {
        if (String(e.message) === "sign in") return;
        undo("Could not reach the server. Nothing was changed — try again.");
      });
    };
    var draw = function () {
      rows.textContent = "";
      if (!list.length) { rows.appendChild(el("p", "honone", "Nothing overdue or due this week.")); return; }
      list.sort(byDue);
      if (TSORT.by === "client") {
        byClient(list).forEach(function (g) {
          var h = el("div", "hogrp");
          h.setAttribute("data-group", g.key);
          h.appendChild(document.createTextNode(g.name));
          var meta = el("i", null, " · " + g.rows.length);
          if (g.late) { meta.appendChild(document.createTextNode(", ")); meta.appendChild(el("span", "late", g.late + " late")); }
          h.appendChild(meta);
          rows.appendChild(h);
          g.rows.forEach(function (x) { var t = hoTask(x[2], !!x[1], act, true); t.setAttribute("data-noclient", "1"); rows.appendChild(t); });
        });
      } else list.forEach(function (x) { rows.appendChild(hoTask(x[2], !!x[1], act)); });
      recount();
    };
    c.head.appendChild(sortSwitch(draw));
    c.head.appendChild(hoLink("All tasks →", function () { go("mywork"); }));
    box.appendChild(said);
    if (j.unanswered && j.unanswered.length) box.appendChild(el("p", "err", "Could not read the Tracker on " + j.unanswered.join(", ") + "."));
    box.appendChild(rows);
    draw();
  }

  function hoCases(c, j) {
    var box = c.body;
    box.textContent = "";
    if (!j || !j.ok) { box.appendChild(el("p", "honone", (j && j.error) || "Could not read the Track Record.")); return; }
    var two = el("div", "hotwo"), left = el("div"), right = el("div");
    left.setAttribute("data-home", "writing");
    right.setAttribute("data-home", "fresh");
    two.appendChild(left); two.appendChild(right);
    box.appendChild(two);
    left.appendChild(el("p", "hobxh", "Your write-ups · in progress"));
    right.appendChild(el("p", "hobxh", "Newly finished"));
    if (!j.writing.length) left.appendChild(el("p", "honone", "No write-up is waiting on you."));
    j.writing.forEach(function (w) {
      var row = el("div", "hocase");
      row.setAttribute("data-case", w.id);
      var ring = el("span", "horing");
      ring.style.setProperty("--p", String(Math.round(w.filled / 8 * 100)));
      ring.appendChild(el("span", null, w.filled + "/8"));
      row.appendChild(ring);
      var t = el("span");
      t.appendChild(el("b", null, w.name));
      var s = el("span", "s", w.client.name + " · " + (w.filled ? w.filled + " of 8 sections" : "not started"));
      if (w.due) {
        var late = w.due < new Date().toISOString().slice(0, 10);
        s.appendChild(document.createTextNode(" · "));
        s.appendChild(el("span", late ? "late" : null, (late ? "was due " : "due ") + archDate(w.due + "T12:00:00")));
      }
      t.appendChild(s);
      row.appendChild(t);
      var b = el("button", w.filled ? "btn solid" : "btn", w.filled ? "Continue" : "Start");
      b.type = "button";
      b.addEventListener("click", function () { CS.jump = { id: w.id, view: "case", fresh: true }; go("memory"); });
      row.appendChild(b);
      left.appendChild(row);
    });

    var why = null;

        var op = el("option", null, p.name || p.email); op.value = p.id; add.appendChild(op);
      });

        var p = o.consultants.filter(function (x) { return x.id === add.value; })[0];
        if (p) team.push({ id: p.id, name: p.name || p.email });
        drawTeam();
      });

    };
    ld.addEventListener("change", function () { team = team.filter(function (t) { return t.id !== ld.value; }); drawTeam(); });
    drawTeam();
    var acts = el("div", "asgacts");
    acts.appendChild(csButton("Cancel", "sm", function () { CLREG.open = ""; CLREG.redraw(); }));
    if (a) {
      /* REMOVING ONE asks twice, the memory's way: its learnings stay, under
         the client, and its write-up and files go. */
      var rm = csButton("Remove", "sm", function () {
        if (rm.dataset.armed !== "1") { rm.dataset.armed = "1"; rm.textContent = "Remove it and its write-up. Its learnings stay"; return; }
        rm.disabled = true;
        cpostCases({ action: "drop", id: a.id }).then(function (r) {
          if (!r || !r.ok) { rm.disabled = false; said.textContent = (r && r.error) || "It could not be removed."; said.hidden = false; return; }
          CLREG.open = ""; clRegRead();
        });

    acts.appendChild(el("span", "sp"));
    var save = csButton(a ? "Save" : "Add", "amber sm", function () {

                   lead: ld.value, team: team.map(function (t) { return t.id; }) }).then(function (r) {
        save.disabled = false;

    acts.appendChild(save);
    td.appendChild(f);
    td.appendChild(acts);
    td.appendChild(said);
    tr.appendChild(td);
    return tr;
  }

  /* A MONTH PICKER OF OUR OWN (Islam, 2026-10-27, of the browser's month box:
     "the year doesn't have the right and left arrows"). The browser's own
     month picker scrolls a list of years and looks different in every
     browser, so this draws the one in the drawing everywhere: ‹ year ›, the
     twelve months, then Clear and This month. It is a button whose `value`
     is 'YYYY-MM' ('' when empty), so a form reads it like the box it
     replaces. The panel is placed on the screen, because the table it sits
     in clips what overflows it. */
  function monthPick(value, empty) {
    var b = el("button", "fld mpick");
    b.type = "button";
    var cur = /^\d{4}-\d{2}$/.test(value || "") ? value : "";
    var word = el("span"), ico = el("span", "mpico");
    ico.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
    b.appendChild(word); b.appendChild(ico);
    var show = function () { word.textContent = cur ? MONTHS[+cur.slice(5) - 1] + " " + cur.slice(0, 4) : empty; word.className = cur ? "" : "mpnone"; };
    Object.defineProperty(b, "value", { get: function () { return cur; }, set: function (v) { cur = /^\d{4}-\d{2}$/.test(v || "") ? v : ""; show(); } });
    show();
    var panel = null, year = 0;
    var shut = function () {
      if (panel) { panel.remove(); panel = null; }
      document.removeEventListener("mousedown", away, true); window.removeEventListener("scroll", shut, true); document.removeEventListener("keydown", esc);
      b.setAttribute("aria-expanded", "false");
    };
    var away = function (e) { if (panel && !panel.contains(e.target) && e.target !== b && !b.contains(e.target)) shut(); };
    var esc = function (e) { if (e.key === "Escape") { shut(); b.focus(); } };
    var pick = function (v) { cur = v; show(); shut(); b.focus(); b.dispatchEvent(new Event("change", { bubbles: true })); };
    var draw = function () {
      panel.textContent = "";
      var top = el("div", "mptop");
      var prev = el("button", "mpnav", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Previous year");
      var next = el("button", "mpnav", "›"); next.type = "button"; next.setAttribute("aria-label", "Next year");
      prev.addEventListener("click", function () { year--; draw(); });
      next.addEventListener("click", function () { year++; draw(); });
      top.appendChild(prev); top.appendChild(el("b", "mpyear", String(year))); top.appendChild(next);
      panel.appendChild(top);
      var grid = el("div", "mpgrid");
      var today = thisMonth();
      MONTHS.forEach(function (m, i) {
        var v = year + "-" + (i < 9 ? "0" : "") + (i + 1);
        var x = el("button", (v === cur ? "on" : "") + (v === today ? " now" : ""), m);
        x.type = "button";
        x.setAttribute("data-m", v.slice(5));
        x.setAttribute("aria-label", MONTHS_LONG[i] + " " + year);
        x.addEventListener("click", function () { pick(v); });
        grid.appendChild(x);
      });
      panel.appendChild(grid);
      var foot = el("div", "mpfoot");
      var clr = el("button", "mplink", "Clear"); clr.type = "button";
      clr.addEventListener("click", function () { pick(""); });
      var tm = el("button", "mplink", "This month"); tm.type = "button";
      tm.addEventListener("click", function () { pick(thisMonth()); });
      foot.appendChild(clr); foot.appendChild(tm);
      panel.appendChild(foot);
    };
    b.setAttribute("aria-haspopup", "dialog");
    b.setAttribute("aria-expanded", "false");
    b.addEventListener("click", function () {
      if (panel) { shut(); return; }
      year = +(cur || thisMonth()).slice(0, 4);
      panel = el("div", "mppanel");
      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-label", "Pick a month");
      draw();
      document.body.appendChild(panel);
      /* the box is in the window's pixels, the place is set in the page's,
         and the console is zoomed on a computer (tipShow's reason) */
      var z = parseFloat(getComputedStyle(ROOT).zoom) || 1;
      var r = b.getBoundingClientRect(), w = panel.offsetWidth, h = panel.offsetHeight;
      var L = r.left / z, T = r.top / z, B = r.bottom / z, W = window.innerWidth / z, H = window.innerHeight / z;
      panel.style.left = Math.round(Math.max(8, Math.min(L, W - w - 8))) + "px";
      panel.style.top = Math.round(B + 6 + h > H && T - 6 - h > 0 ? T - 6 - h : B + 6) + "px";
      b.setAttribute("aria-expanded", "true");
      document.addEventListener("mousedown", away, true); window.addEventListener("scroll", shut, true); document.addEventListener("keydown", esc);
      var on = panel.querySelector(".mpgrid .on") || panel.querySelector(".mpgrid .now") || panel.querySelector(".mpgrid button");
      if (on) on.focus();
    });
    return b;
  }

  /* + ADD A PAST CLIENT, on Ended (spec 067 §7, kept): its name, industry and

      var acts = el("td", "clgo");

  /* A PAST CLIENT'S CARD: the archived card's quiet look, "Past client"
     where the archive date would be, and one row — its case studies. */

  /* ONLY THE ROWS OPEN (§320.3, spec 046 §4.6a). Islam, of two behaviours
     drawn side by side: "2" — the card's name is not pressable and every way
     into a client names a module, so there is never a question of which one
     the top would open. The card is a DIV holding two things: the identity
     block, and a button per module this client has.

     THE MODULE'S OWN STATE MOVED OUT OF THE FOOT WITH IT. `cycle open`,
     `no plan yet` and `not answering` are all Strategy's answers about this
     client, so with a Strategy row to carry them the foot would have said
     each twice (§87). The seat, the unit count and Demo stay: they are the
     client's and the spine's, not a module's.

     The rows come from the server (lib/modules.ts moduleRows), so the console
     cannot spell a module differently from the switch or from Setup. */
  /* The platform's Settings mark (shell.html ICON_MANAGE), drawn the same here. */
  function settingsChip(name, word) {
    /* on a live card, the word at the foot (2026-10-24); elsewhere the mark */
    if (word) {
      var w = el("span", "ccfg word", "Settings");
      w.title = "Settings";
      w.setAttribute("aria-label", "Settings for " + name);
      return w;
    }
    var cog = el("span", "ccfg ico");
    cog.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">' +
      '<path d="M3 6.5h9M15.5 6.5h1.5M3 13.5h4M10.5 13.5h6.5"/><circle cx="13.6" cy="6.5" r="2.1"/><circle cx="8.6" cy="13.5" r="2.1"/></g></svg>';
    cog.title = "Settings";
    cog.setAttribute("aria-label", "Settings for " + name);
    return cog;
  }

  function cardFor(c) {
    var b = el("div", "ccard" + (c.kind === "demo" ? " demo" : "") + (c.canOpen ? "" : " listed"));
    b.dataset.client = c.key;
    b.dataset.name = String(c.name + " " + (c.industry || "")).toLowerCase();
    /* IN HOME'S LOOK (2026-10-24, Islam: "build both as drawn"): the mark
       and the name on one line, the modules under them, and the facts in a
       quiet line at the foot with Settings as a word — the boxed tags and
       the industry are gone from the card's face. */
    var top = el("div", "ctop");
    if (c.mark) {
      var im = el("img", "cmark solo"); im.src = c.mark; im.alt = c.name; im.title = c.name; top.appendChild(im);
    } else {
      top.appendChild(el("div", "cmark", initials(c.name)));
      top.appendChild(el("h2", null, c.name));
    }
    b.appendChild(top);
    var foot = el("div", "foot");
    var facts = el("span", "facts");
    /* THE SEAT IS WHAT THIS CARD SAYS ABOUT THIS PERSON — the thing they came
       to know, and the thing that decides what they can do when they arrive. */
    facts.textContent = [c.seat ? (c.seat === "super" ? "Super user" : "SMO team") : "",
      c.units != null && c.units > 0 ? c.units + (c.units === 1 ? " unit" : " units") : "",
      c.canOpen ? "" : "Listed only"].filter(Boolean).join(" · ");
    if (c.kind === "demo") foot.appendChild(el("span", "tag demo", "Demo"));
    foot.appendChild(facts);

    /* A CLIENT THIS PERSON MAY NOT OPEN GETS NO ROWS AT ALL — there is no way
       in, so there is nothing to draw (§61); "Listed only" already says it. */
    if (c.canOpen && c.modules && c.modules.length) {
      var mods = el("div", "mods");
      c.modules.forEach(function (m) {
        var r = el("button", "mrow");
        r.type = "button";
        r.dataset.module = m.key;
        r.appendChild(document.createTextNode(m.label));
        /* THE MARK (§368): what this module says is OUTSTANDING on this
           client, in the fewest words, and NOTHING when nothing is — which
           is where the compactness comes from. It replaces the pair that
           was here, a full sentence (the client's chosen landing line) and
           the card's own health word, which on a running cycle said the
           same fact twice and could not fit on one line.
           Both come from the server (lib/modules.ts), so the page decides
           nothing: `alarm` is the module's own word for *broken rather than
           busy* and `tip` is the whole sentence for the hover. */
        if (m.mark) {
          var mk = el("i", m.alarm ? "alarm" : "due", m.mark);
          if (m.tip) mk.title = m.tip;
          r.appendChild(mk);
        }
        /* A LIBRARY'S ROW OPENS THE ROOM WE PUBLISH FROM, not the client's
           own page (spec 053; the flag is the server's, lib/modules.ts). The
           client's read-only library is one press further in, from there —
           this is the one module whose work is on our side, and landing a
           consultant on the page where they can do nothing would be §61 with
           the sign reversed. */
        r.addEventListener("click", function () { moduleGo(c, m); });
        mods.appendChild(r);
      });
      b.appendChild(mods);
    }

    b.appendChild(foot);
    if (c.canConfig) {
      var cog = settingsChip(c.name, true);
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      /* THE CLIENT'S OWN SETUP RAIL (§360, spec 057): one press into the
         client at /<client>/setup, in its own chrome — Getting started at the
         top of that rail until it is done, the register and the organisation
         under it. Nothing between the card and the client. */
      var open = function (e) { e.stopPropagation(); e.preventDefault(); location.assign("/" + c.key + "/setup"); };
      cog.addEventListener("click", open);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") open(e); });
      foot.appendChild(cog);
    }
    return b;
  }

  /* ── AN ARCHIVED CLIENT'S CARD (§323) ──────────────────────────────
     Everything the live card says about a client is about a client somebody
     is working in — a seat, a cycle, a count of units — and none of it is
     true of one that has been set aside, so this says the two things that
     ARE: when it was archived and who did it. A card that carried the live
     tags would read as a client you could still open.

     IT HAS NO DOOR. Their address is already closed, so a press that
     navigated there would land on "that client is not available" — §61 from
     the other side: a control that leads somewhere refusing is worse than no
     control. `disabled` because there is nothing behind it, not for the look.

     AND THE DATE IS THE READER'S, never the database's spelling: an ISO
     timestamp is a fact about storage. An unreadable or missing one says
     nothing at all rather than printing "Invalid Date" (§35, §15.1). */
  function archDate(v) {
    if (!v) return "";
    var d = new Date(v);
    if (isNaN(d.getTime())) return "";
    try {
      return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    } catch (e) { return ""; }
  }

  function archCardFor(c) {
    var b = el("button", "ccard arch");
    b.type = "button";
    b.disabled = true;
    b.dataset.client = c.key;
    b.dataset.arch = "1";
    if (c.mark) {
      var im = el("img", "cmark solo"); im.src = c.mark; im.alt = c.name; im.title = c.name; b.appendChild(im);
    } else {
      b.appendChild(el("div", "cmark", initials(c.name)));
      b.appendChild(el("h2", null, c.name));
    }
    if (c.industry) b.appendChild(el("p", "ind", c.industry));
    var foot = el("div", "foot");
    var when = archDate(c.at);
    foot.appendChild(el("span", "tag arch", when ? "Archived " + when : "Archived"));
    if (c.by) {
      var who = el("span", "tag arch", c.by);
      who.title = "Archived by " + c.by;   /* clipped above, so the whole of it is here */
      foot.appendChild(who);
    }
    b.appendChild(foot);

    /* TWO CONTROLS, AND THE SECOND IS WHY THE FIRST IS NOT ENOUGH.
       Bring back is the ordinary thing to want from this band, so it is here
       rather than three presses away. Settings is the ONLY route to Deleting
       — that block lives on an archived client and nowhere else — so a card
       carrying Bring back alone would put the one irreversible act behind a
       screen with no door to it (§61). The check for this file found that by
       going red on it.

       Bring back is ONE function shared with the block inside (§53.5), never
       a second copy of the request. */
    if (c.canConfig) {
      var acts = el("div", "cacts");
      var back = el("span", "cback", "Bring back");
      back.setAttribute("role", "button"); back.tabIndex = 0;
      var go = function (e) { e.stopPropagation(); e.preventDefault(); bringBack(c.key, c.name); };
      back.addEventListener("click", go);
      back.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") go(e); });
      acts.appendChild(back);

      var cog = settingsChip(c.name);
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      /* ON THIS PAGE, not the client's (§360): an archived client's address
         is closed, so its two acts — bringing it back and deleting it — are
         the one screen the console still draws for a client. */
      var open = function (e) { e.stopPropagation(); e.preventDefault(); drawArchived(c.key); };
      cog.addEventListener("click", open);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") open(e); });
      acts.appendChild(cog);
      b.appendChild(acts);
    }
    return b;
  }

  /* ONE REQUEST, BOTH DIRECTIONS AND BOTH SURFACES (§53.5): the band's Bring
     back and the block's Bring back are this, and the block's Archive is this
     with `on` true. A refusal is SAID — a control that silently does nothing
     is the shape this project keeps recording (§32, §171). */
  function setArchived(key, on) {
    return post({ action: "archiveClient", key: key, on: !!on });
  }
  function bringBack(key, name) {
    setArchived(key, false).then(function (j) {
      if (!j.ok) { say(j.error || "Could not bring " + name + " back.", true); return; }
      /* back where it now is: among the Active clients */
      CL.which = "active";
      /* `go("clients")`, NEVER `drawClients()` — the first build called the
         renderer directly and `drawClients` does not CLEAR the page, so it
         appended a whole second copy underneath the first and the Archived
         band the press had just emptied was still sitting there, above a grid
         that now held the client twice. §100.2's family: whoever redraws a
         page is the one that clears it, and on this page that is `go`. Found
         by the check going red on "the band is gone" while every assertion
         about the grid passed. */
      go("clients");
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      say("Could not reach the server.", true);
    });
  }

  function addCard() {
    var b = el("button", "ccard add", "+ Add a client");
    b.type = "button";
    b.addEventListener("click", function () { drawNewClient(); });

  /* ── SETTING A CLIENT UP IS INSIDE THE CLIENT NOW (§360, spec 057) ───
     Islam: *"the client either we open a module or we go to the client
     settings page where we find a rail with the client settings"* — and, of
     which chrome draws that rail, "A": the client platform's own Setup.
     So Settings on a card OPENS /<client>/setup, and the flow that lived
     here for §322–§352 is client-setup.js, served at /client-setup.js and
     mounted by the platform on its Getting started page. §322's reason for
     the outside flow is kept whole — Settings is still pressed from here
     before anybody at the client has signed in — only the chrome changed.

     TWO PIECES STAY ON THIS PAGE, from that same module, because a client's
     own address cannot draw them: creating a client, which has no address
     until it exists (the first step, then straight into the client's own
     Getting started), and ending an archived one, whose address is closed
     (§323: bring back and delete, from the archived band's Settings). */
  function drawNewClient(){
    clear();
    var right = el("div");
    var leave = el("button", "btn", "Cancel");
    leave.type = "button";
    leave.addEventListener("click", function () { go("clients"); });
    right.appendChild(leave);

  function drawArchived(key){
    lead(false, "Reading…");
    return post({ action:"client", key:key }).then(function (j) {
      if (!j.ok) { clear(); say(j.error || "Could not open that client.", true); return; }
      clear();
      var right = el("div");
      var leave = el("button", "btn", "Back to clients");
      leave.type = "button";
      leave.addEventListener("click", function () { go("clients"); });
      right.appendChild(leave);
      title(j.client.name, right);
      /* AN ARCHIVED CLIENT SAYS SO FIRST (§323): whichever block somebody
         came for, the state has to explain itself before the controls. */
      var ab = el("div", "wzarched");
      ab.appendChild(document.createTextNode("This client is "));
      ab.appendChild(el("b", null, "archived"));
      var when = archDate(j.client.archived_at);
      ab.appendChild(document.createTextNode(
        ". " + (when ? "Archived " + when : "Archived") +
        (j.client.archived_by ? " by " + j.client.archived_by : "") +
        ". Their link is closed, and nothing inside can be changed until they are brought back."));
      page.appendChild(ab);
      var host = el("div", "csetup");
      page.appendChild(host);
      CLIENTSETUP.mountArchived(host, key, { read: j, door: "/", go: function () { go("clients"); } });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  /* ── Consultants ─────────────────────────────────────────────── */
  /* which of the team the card shows: those who can sign in, or the retired */
  var CO = { show: "active" };
  function drawConsultants(quiet) {
    lead(quiet, "Reading…");
    return post({ action: "consultants" }).then(function (j) {
      if (!j.ok) { clear(); say(j.error || "Could not read the list.", true); return; }
      settle(function () {
      /* ROUND FOUR (Islam, 2026-10-24, design-mockups/home/2026-10-24_team-and-copilot.html):
         the band counts the team and its super users and carries Add a

      var people = j.people || [];
      var active = people.filter(function (p) { return p.status !== "retired"; });

        "The office's people, their seats and what each may open.");

      var card = el("section", "hocard cocard");

      hd.appendChild(hic);
      hd.appendChild(el("h2", null, "The team"));
      var shown = CO.show === "retired" ? retired : active;
      hd.appendChild(el("span", "hocnt", String(shown.length)));
      hd.appendChild(el("span", "sp"));
      if (retired.length) hd.appendChild(hoSwitch("Show", [["active", "Active"], ["retired", "Retired"]], CO.show, function (v) { CO.show = v; drawConsultants(true); }));
      var search = el("input", "fld cosearch");
      search.type = "search";
      search.placeholder = "Search by name or email";
      search.setAttribute("aria-label", "Search consultants");

        head.appendChild(el("th", null, h));

      t.appendChild(body);
      box.appendChild(t);
      card.appendChild(box);
      /* typing never repaints (§35): the search hides rows in place */
      search.addEventListener("input", function () {

        Array.prototype.forEach.call(body.querySelectorAll("tr"), function (r) {

      if (j.canEdit) {

        var mail = el("input", "fld"); mail.placeholder = "name@forefront.consulting"; mail.setAttribute("aria-label", "Email");
        var add = el("button", "btn amber", "Add a consultant");

            .then(function (r) {

              /* said after the redraw, or the redraw takes it away (§63) */
              var who = mail.value.trim();
              drawConsultants(true).then(function () {
                coSaid(who.toLowerCase(), true);
                if (!r.password) return;
                var s = say("");
                s.appendChild(document.createTextNode("Temporary password for " + who + ": "));

        "The seats are read here and set on each client's own configuration — " +
