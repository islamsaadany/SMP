      p1.appendChild(document.createTextNode("Archive "));
      p1.appendChild(el("b", null, S.client.name));
      p1.appendChild(document.createTextNode("?"));
      q.appendChild(p1);
      var goes = el("p", "goes");
      goes.appendChild(document.createTextNode("Their link stops working at once."));
      goes.appendChild(el("br"));
      goes.appendChild(document.createTextNode("The card leaves the clients page."));
      goes.appendChild(el("br"));
      goes.appendChild(document.createTextNode("Everything they have is kept."));
      q.appendChild(goes);
      q.appendChild(el("p", null, "You can bring them back from the Archived band at any time."));
      var row = el("div", "row");
      var yes = el("button", "btn risksolid", "Archive " + S.client.name);
      yes.type = "button"; yes.dataset.archive = "do";
      var no2 = el("button", "btn", "Cancel");
      no2.type = "button"; no2.dataset.archive = "cancel";
      no2.addEventListener("click", rebuild);
      yes.addEventListener("click", function () {
        yes.disabled = true; no2.disabled = true; yes.textContent = "Archiving…";
        setArchived(S.key, true).then(function (j) {
          if (!j.ok) { yes.disabled = false; no2.disabled = false;
                       yes.textContent = "Archive " + S.client.name;
                       trouble(q, j.error || "Not archived."); return; }
          /* Back to the clients page, where the Archived band now holds it —
             landing on the record of what happened rather than on a form for
             a client that has just been set aside (§144's rule). */
          go("clients");
        }).catch(function (e) {
          if (String(e.message) === "sign in") return;
          yes.disabled = false; no2.disabled = false;
          yes.textContent = "Archive " + S.client.name;
          trouble(q, "Could not reach the server.");
        });
      });
      row.appendChild(yes); row.appendChild(no2);
      q.appendChild(row);
      box.appendChild(q);
    }

    /* ── THE DELETE QUESTION ──────────────────────────────────────────
       It counts what goes from the client's OWN rows, read at the moment
       the card was opened, so the sentence in front of the one irreversible
       press names what is actually there rather than what somebody wrote
       into a template. A count that could not be read says so — printing a
       nought there would read as "there is nothing to lose" (§93). */
    function askDelete(box){
      box.textContent = "";
      box.appendChild(el("span", "wzendkey", "Deleting"));
      var q = el("div", "wzask");
      q.dataset.ask = "delete";
      var p1 = el("p");
      p1.appendChild(document.createTextNode("Delete "));
      p1.appendChild(el("b", null, S.client.name));
      p1.appendChild(document.createTextNode(" and everything in it?"));
      q.appendChild(p1);

      var goes = el("p", "goes");
      goes.dataset.goes = "1";
      var g = S.goes;
      if (!g) {
        goes.appendChild(document.createTextNode(
          "What is in this client could not be read, so it cannot be listed here."));
      } else {
        var lines = [];
        var shape = [];
        if (g.units != null) shape.push(nOf(g.units, "business unit"));
        if (g.functions != null) shape.push(nOf(g.functions, "supporting function"));
        if (shape.length) lines.push(shape.join(" \u00b7 "));
        if (g.people != null) lines.push(nOf(g.people, "person", "people") + " on the register");
        var rest = [];
        if (g.plans != null) rest.push(nOf(g.plans, "line") + " of plan");
        if (g.capabilities != null && g.capabilities) rest.push(nOf(g.capabilities, "capability", "capabilities"));
        if (g.conversations != null) rest.push(nOf(g.conversations, "conversation"));
        if (rest.length) lines.push(rest.join(" \u00b7 "));
        lines.forEach(function (t, i) {
          if (i) goes.appendChild(el("br"));
          goes.appendChild(document.createTextNode(t));
        });
      }
      q.appendChild(goes);
      q.appendChild(el("p", null,
        "This cannot be undone, and there is no backup to restore from. " +
        "If anybody needs their plans, download them first."));

      var lab = el("label", null, "Type the client's name to confirm");
      lab.setAttribute("for", "wz-confirm");
      q.appendChild(lab);
      var typed = el("input", "fld");
      typed.id = "wz-confirm";
      typed.setAttribute("autocomplete", "off");
      typed.dataset.confirm = "1";
      q.appendChild(typed);

      var row = el("div", "row");
      var yes = el("button", "btn risksolid", "Delete " + S.client.name + " for ever");
      yes.type = "button"; yes.dataset.delete = "do"; yes.disabled = true;
      var no2 = el("button", "btn", "Cancel");
      no2.type = "button"; no2.dataset.delete = "cancel";
      no2.addEventListener("click", rebuild);
      /* THE MATCH IS EXACT, trimmed at the ends and nothing looser — and the
         SERVER asks it again, so this only decides when the button opens. */
      typed.addEventListener("input", function () {
        yes.disabled = typed.value.trim() !== String(S.client.name).trim();
      });
      yes.addEventListener("click", function () {
        yes.disabled = true; no2.disabled = true; typed.readOnly = true;
        yes.textContent = "Deleting…";
        post({ action:"deleteClient", key:S.key, confirm:typed.value })
          .then(function (j) {
            if (!j.ok) {
              no2.disabled = false; typed.readOnly = false;
              yes.textContent = "Delete " + S.client.name + " for ever";
              yes.disabled = typed.value.trim() !== String(S.client.name).trim();
              trouble(q, j.error || "Not deleted.");
              return;
            }
            go("clients");
          }).catch(function (e) {
            if (String(e.message) === "sign in") return;
            no2.disabled = false; typed.readOnly = false;
            yes.textContent = "Delete " + S.client.name + " for ever";
            yes.disabled = false;
            trouble(q, "Could not reach the server.");
          });
      });
      row.appendChild(yes); row.appendChild(no2);
      q.appendChild(row);
      box.appendChild(q);
    }

    draw();
    return wrap;
  }

  /* ── THE MARK ON THE CLIENT'S DOOR (§313.36) ───────────────────────
     PNG only (§52: an SVG is executable content, a JPEG paints its own
     ground). Shrunk here to what a door needs, on a TRANSPARENT canvas.

     AND THE BUTTON IS WIRED TO THE FILE INPUT, which it was not: `var file`
     is `var pick` no longer — the old card declared `var pick` for this
     input AND again sixty lines later for the "add somebody" select, and
     `var` is function-scoped, so pressing Choose a PNG called .click() on a
     dropdown and opened nothing (§56.7, and Islam pressed it). */
  function markBlock(){
    var mk = el("div");
    mk.appendChild(el("span", "lab", "Mark on this client's door"));
    var mrow = el("div", "markrow");
    var preview = el("img"); preview.alt = "";
    var noneNote = el("span", "none", "No mark yet — the door opens plain until one is set.");
    function show(src){
      if (src) { preview.src = src; preview.hidden = false; noneNote.hidden = true; }
      else { preview.removeAttribute("src"); preview.hidden = true; noneNote.hidden = false; }
    }
    mrow.appendChild(preview); mrow.appendChild(noneNote);
    show(S.markState !== undefined ? S.markState : S.client.mark);
    if (S.canEdit) {
      var file = el("input"); file.type = "file"; file.accept = "image/png"; file.hidden = true;
      var choose = el("button", "btn", "Choose a PNG"); choose.type = "button";
      choose.addEventListener("click", function () { file.click(); });
      var drop = el("button", "btn", "Remove"); drop.type = "button";
      drop.addEventListener("click", function () { S.markState = ""; S.dirty = true; show(null); file.value = ""; });
      file.addEventListener("change", function () {
        var f = file.files && file.files[0];
        if (!f) return;
        if (f.type !== "image/png") { setupSay("The mark must be a PNG.", true); file.value = ""; return; }
        var url = URL.createObjectURL(f);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var scale = Math.min(1, 640 / img.naturalWidth, 200 / img.naturalHeight);
          var cv = document.createElement("canvas");
          cv.width = Math.max(1, Math.round(img.naturalWidth * scale));
          cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          var out = cv.toDataURL("image/png");
          if (out.length > 400000) { setupSay("That picture is too large even shrunk — try a simpler PNG.", true); return; }
          S.markState = out; S.dirty = true; show(out);
        };
        img.onerror = function () { URL.revokeObjectURL(url); setupSay("That file could not be read as a picture.", true); };
        img.src = url;
      });
      mrow.appendChild(choose); mrow.appendChild(drop); mrow.appendChild(file);
    }
    mk.appendChild(mrow);
    mk.appendChild(el("p", "note", "Shown on " + (S.key ? location.origin + "/" + S.key : "the client") +
      "/sign-in, the door this client's people sign in at."));
    return mk;
  }

  function summaryStep(box){
    var lines = [
      ["The client", (S.client.name || "—") + (S.key ? " · /" + S.key : ""), "client"],
      ["Industry", S.client.industry || "Not set", "client"],
      ["Size", sizeWord(S.client.size), "client"],

      r.appendChild(el("span", "sk", l[0]));
      r.appendChild(el("span", "sv", l[1]));
      var b = el("button", "wzed", "Change");
      b.type = "button";
      b.addEventListener("click", function () { goStep(stepIdx(l[2])); });
      r.appendChild(b);
      summ.appendChild(r);
    });
    box.appendChild(summ);
    box.appendChild(el("div", "lab", "Where to now"));
    var doors = el("div", "wzdoors");
    /* AND AN ARCHIVED CLIENT HAS NO DOOR TO OFFER (§323, §61). Archiving is
       what closes their address, so this button would have landed on "that
       client is not available" — a control that leads somewhere refusing is
       worse than no control, and the way back is two blocks up the same page.
       Drawn for a live client exactly as it was. */
    var d1 = null;
    if (!S.archived) {
      d1 = el("button", "wzdoor go");
      d1.type = "button";
      d1.appendChild(el("span", "dn", "Open the platform"));
      d1.appendChild(el("span", "dw", "Go into " + (S.client.name || "the client") + " and start the plans."));
      d1.addEventListener("click", function () {
        commitSetup().then(function (good) { if (good && S.key) location.assign("/" + S.key); });
      });
    }
    var d2 = el("button", "wzdoor");
    d2.type = "button";
    d2.appendChild(el("span", "dn", "Back to clients"));
    d2.appendChild(el("span", "dw", "Leave it here. Everything is saved, and the card is where you pick it up."));
    d2.addEventListener("click", function () {
      commitSetup().then(function (good) { if (good) go("clients"); });
    });
    if (d1) doors.appendChild(d1);
    doors.appendChild(d2);
    box.appendChild(doors);
    return box;
  }

  /* A LIST, NOT A MATCH (§87: a name is never an identifier). The register is
     offered and a person answers — the same shape as the role picker, which
     suggests before it creates. The option a row is ALREADY on is shown as it
     is, so this reads as a fact about them rather than a question every time. */
  function registerCell(clientKey, member, register) {
    var wrap = el("span", "asrow");
    wrap.appendChild(el("span", "aslab", "on this register as"));
    var sel = el("select", "fld");
    var own = el("option", null, "a row of their own");
    own.value = "";
    sel.appendChild(own);
    register.forEach(function (r) {
      var o = el("option", null, r.name + (r.email ? " · " + r.email : ""));
      o.value = r.key;
      if (r.key === member.person_key) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () {
      post({ action: "setTeam", key: clientKey, email: member.email,
             seat: member.seat, personKey: sel.value })
        .then(function (r) {
          /* SAID AFTER THE REDRAW THAT REPORTS IT (§63, and I wrote it the
             wrong way round again in the same file): `settle()` replaces the
             page, so a refusal said before it is wiped a moment later and the
             control simply springs back with no explanation. */
          refreshTeam();
          if (!r.ok) setupSay(r.error || "Not changed.", true);
        });
    });
    wrap.appendChild(sel);
    return wrap;
  }

  function seatCell(clientKey, member, seats, editable) {
    var wrap = el("span", "cell" + (editable ? "" : " locked"));
    seats.forEach(function (s) {
      var b = el("button", null, s.name);
      b.type = "button";
      b.title = s.note;
      if (member.seat === s.key) b.className = "on" + (s.key === "super" ? " hi" : "");
      if (editable && member.seat !== s.key) {
        b.addEventListener("click", function () {
          post({ action: "setTeam", key: clientKey, email: member.email, seat: s.key })
            .then(function (r) { r.ok ? refreshTeam()
                                      : setupSay(r.error || "Not changed.", true); });
        });
      }
      wrap.appendChild(b);
    });
    return wrap;
  }

  /* ── Consultants ─────────────────────────────────────────────── */
  function drawConsultants(quiet) {
    lead(quiet, "Reading…");
    return post({ action: "consultants" }).then(function (j) {
      if (!j.ok) { clear(); say(j.error || "Could not read the list.", true); return; }
      settle(function () {
      title("Consultants");

      var box = el("div", "tscroll");
      var t = el("table");
      var head = el("tr");
      ["Name", "Email", "Platform", "Clients and seats", "Password", ""].forEach(function (h) {
        head.appendChild(el("th", null, h));
      });
      var thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      var body = el("tbody");
      j.people.forEach(function (p) { body.appendChild(consultantRow(p, j)); });
      t.appendChild(body);
      box.appendChild(t);
      page.appendChild(box);

      if (j.canEdit) {
        var row = el("div", "row");
        var name = el("input", "fld"); name.placeholder = "Name";
        var mail = el("input", "fld"); mail.placeholder = "name@forefront.consulting";
        var add = el("button", "btn amber", "Add a consultant");
        add.type = "button";
        add.addEventListener("click", function () {
          post({ action: "saveConsultant", email: mail.value.trim(), name: name.value.trim() })
            .then(function (r) {
              if (!r.ok) { say(r.error || "Not added.", true); return; }
              drawConsultants(true);
              if (r.password) {
                var s = say("");
                s.appendChild(document.createTextNode("Temporary password for " + mail.value.trim() + ": "));
                s.appendChild(el("b", null, r.password));
                s.appendChild(document.createTextNode(" — they must change it on first use."));
              }
            });
        });
        row.appendChild(name); row.appendChild(mail); row.appendChild(add);
        page.appendChild(row);
      }
      page.appendChild(el("p", "note",
        "The seats are read here and set on each client's own configuration — " +
        "one place writes them. Somebody on no client can sign in and has " +
        "nothing to open, which is what a new joiner looks like."));
      });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  function consultantRow(p, j) {
    var tr = el("tr");

    /* ── THE NAME AND THE ADDRESS ARE EDITABLE (§313.27) ────────────
       Islam: "I need to edit the consultants names and emails as well." Two
       fields on the row rather than a dialog, because there are two of them
       and one row is not a form (§116's argument runs the other way at this
       size: the register moved to a dialog because NINE fields in a 158px
       cell collided; two do not).

       COMMITTED ON `change`, which for a text box means on blur — so the
       value is written by moving away from it, and there is no Save to
       forget. The row updates quietly afterwards, or the field being typed
       into would be replaced under the hand (§35, §71.2).

       AND THE ADDRESS IS THE SIGN-IN, so changing it ends that person's
       sessions and is said on the page rather than left to be discovered. */
    var edit = j.canEdit;
    var nameTd = el("td");
    if (edit) {
      var nm = el("input", "fld");
      nm.value = p.name || "";
      nm.placeholder = "Name";
      nm.addEventListener("change", function () {
        var v = nm.value.trim();
        if (v === (p.name || "")) return;
        post({ action: "saveConsultant", email: p.email, name: v })
          .then(function (r) { r.ok ? drawConsultants(true)
                                    : say(r.error || "Not changed.", true); });
      });
      nameTd.appendChild(nm);
    } else {
      nameTd.textContent = p.name || "—";
    }
    tr.appendChild(nameTd);

    var mailTd = el("td", "mono");
    if (edit) {
      var em = el("input", "fld mono");
      em.value = p.email;
      em.addEventListener("change", function () {
        var v = em.value.trim().toLowerCase();
        if (!v || v === p.email) { em.value = p.email; return; }
        post({ action: "saveConsultant", email: p.email, newEmail: v })
          .then(function (r) {
            if (!r.ok) { em.value = p.email; say(r.error || "Not changed.", true); return; }
            /* SAID AFTER THE REDRAW THAT REPORTS IT (§63). Said before, the
               sentence is appended to a page `settle()` is about to replace —
               so the rename lands, the outcome is written, and a moment later
               it is gone, which reads exactly like nothing happened. */
            drawConsultants(true).then(function () {
              say(v + " signs in with that address now. Any tab they had open " +
                  "has been signed out — the old address no longer exists.");
            });
          });
      });
      mailTd.appendChild(em);
    } else {
      mailTd.textContent = p.email;
    }
    tr.appendChild(mailTd);

    /* ── SUPER USER, IN A COLUMN THAT SAYS WHERE (Islam, option B) ──
       The role was always here and read "Platform admin: Yes", which is not
       the word Islam uses for it: "I'm the super user of the platform."

       AND THE WORD ALONE WOULD HAVE COLLIDED. `Super user` already means the
       top seat on a CLIENT (§89), and the column immediately to the right of
       this one reads "Raya Trade · Super user" — so the column carries the
       WHERE and the chip carries the WHAT, and the row reads across as
       Platform · Super user, Raya Trade · Super user. One word for one
       standing, qualified by where it is held (§87's twins, avoided rather
       than discovered).

       THE KEY DOES NOT MOVE: `is_admin`, `canSetAdmin` and `saveConsultant`
       keep their spelling, because renaming a stored field is a migration for
       a word nobody reads (§30.2, §58). */
    var adminTd = el("td");
    var cell = el("span", "cell" + (j.canSetAdmin && p.email !== j.me ? "" : " locked"));
    var yes = el("button", null, "Super user");
    yes.type = "button";
    if (p.isAdmin) yes.className = "on hi";
    if (j.canSetAdmin && p.email !== j.me) {
      yes.title = "Adding clients and consultants, and setting Who sees what";
      yes.addEventListener("click", function () {
        post({ action: "saveConsultant", email: p.email, isAdmin: !p.isAdmin })
          .then(function (r) { r.ok ? drawConsultants(true) : say(r.error || "Not changed.", true); });
      });
    } else if (p.email === j.me) {
      /* NOBODY CHANGES THEIR OWN STANDING, which is also what stops the
         platform's last super user locking themselves out of it. */
      yes.title = "You cannot change your own standing — somebody else with this role does it.";
    }
    cell.appendChild(yes);
    adminTd.appendChild(cell);
    tr.appendChild(adminTd);

    var seatsTd = el("td", "seats");
    if (!p.seats || !p.seats.length) seatsTd.appendChild(el("span", "muted", "On no client yet"));
    else p.seats.forEach(function (s) {
      seatsTd.appendChild(el("span", "tag",
        s.client + " · " + (s.seat === "super" ? "Super user" : "SMO team")));
    });
    tr.appendChild(seatsTd);

    tr.appendChild(el("td", null, p.password === "none" ? "—"
      : p.password === "temporary" ? "Temporary" : "Set"));

    var act = el("td");
    if (j.canEdit && p.email !== j.me && !p.isAdmin) {
      var b = el("button", "btn", "Issue password");
      b.type = "button";
      b.addEventListener("click", function () {
        b.disabled = true;
        post({ action: "issuePassword", email: p.email }).then(function (r) {
          b.disabled = false;
          if (!r.ok) { say(r.error || "Not issued.", true); return; }
          var s = say("");
          s.appendChild(document.createTextNode("Temporary password for " + p.email + ": "));
          s.appendChild(el("b", null, r.password));
          s.appendChild(document.createTextNode(" — said once, and stored nowhere in the clear."));
        });
      });
      act.appendChild(b);
    }
    tr.appendChild(act);
    return tr;
  }

  /* ── Who sees what ───────────────────────────────────────────── */
  function drawAccess() {
    page.appendChild(el("p", "muted", "Reading…"));
    post({ action: "access" }).then(function (j) {
      clear();
      if (!j.ok) { say(j.error || "Could not read the table.", true); return; }
      title("Who sees what");
      page.appendChild(el("p", "note",
        "What somebody may do INSIDE a client is the seat they hold on it, set " +
        "on that client's configuration. What is here is the rest — and it is " +
        "asked of everybody who is not the platform's super user."));

      var box = el("div", "tscroll");
      var t = el("table");
      var thead = el("thead"), head = el("tr");
      head.appendChild(el("th", null, "Everybody who is not the super user"));
      j.areas.forEach(function (a) { head.appendChild(el("th", null, a.name)); });
      thead.appendChild(head); t.appendChild(thead);

      var body = el("tbody"), tr = el("tr");
      tr.appendChild(el("td", null, "Every consultant, whatever seats they hold"));
      j.areas.forEach(function (a) {
        var td = el("td");
        var now = Object.prototype.hasOwnProperty.call(j.stored, a.key) ? j.stored[a.key] : j.defaults[a.key];
        var cell = el("span", "cell" + (j.canEdit ? "" : " locked"));
        a.states.forEach(function (st) {
          if (st === "none" && a.states.length > 2) return;   /* nothing lit IS none (§37) */
          var b = el("button", null, st === "yes" ? "Yes" : st.charAt(0).toUpperCase() + st.slice(1));
          b.type = "button";
          b.title = a.note;
          if (now === st) b.className = "on" + (st === "edit" || st === "open" || st === "yes" ? " hi" : "");
          if (j.canEdit) {
            b.addEventListener("click", function () {
              /* Pressing the lit one puts the cell back to nothing: the third
                 state is the absence of the others (§37). */
              var next = now === st ? (a.states[0] === "hidden" ? "hidden" : "none") : st;
              post({ action: "saveAccess", area: a.key, grant: next })
                .then(function (r) { r.ok ? drawAccess() : say(r.error || "Not saved.", true); });
            });
          }
          cell.appendChild(b);
        });
        td.appendChild(cell);
        tr.appendChild(td);
      });
      body.appendChild(tr); t.appendChild(body);
      box.appendChild(t);
      page.appendChild(box);
      page.appendChild(el("p", "note", "Nothing lit means nothing at all."));
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  document.getElementById("signout").addEventListener("click", function () {
    fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" },
      body: '{"action":"logout"}' }).finally(function () { location.replace("/"); });
  });

  /* ── Boot ────────────────────────────────────────────────────── */
  post({ action: "me" }).then(function (j) {
    if (!j || !j.ok) { location.replace("/"); return; }
    ME = { email: j.account.email, name: j.account.name, isAdmin: j.account.isAdmin,
           canConsultants: true, canAccess: !!j.account.isAdmin };
    /* What the navigation may show is asked of the same rules the pages ask —
       `cards` answers it for this account, so the row cannot offer a page the
       next request refuses. */
    return post({ action: "cards" }).then(function (c) {
      if (c && c.ok) {
        ME.canConsultants = !!c.canConsultants;
        ME.canAccess = !!c.canAccess;
      }
      /* THE CHROME SAYS THE SAME WORD THE TABLE DOES. Leaving "Admin" here
         after renaming the column is exactly the twins this rename avoided. */
      document.getElementById("who").textContent =
        ME.name + (ME.isAdmin ? " · Super user" : "");
      document.body.classList.add("ready");
      go("clients");
    });
  }).catch(function (e) {
    if (String(e.message) === "sign in") return;
    document.body.classList.add("ready");
    say("Could not reach the server.", true);
  });
})();
</script>
</body>
</html>
