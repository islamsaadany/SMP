<!-- The client set-up flow (§360, spec 057): one file for this page and the
     client platform, generated to this address by scripts/build-shell.mjs,
     which refuses the build if this tag ever goes. -->
<script src="/client-setup.js"></script>
<script>
(function () {
  "use strict";

  /* §601: the column's width is set before anything is drawn, so a person
     who keeps it to icons does not see it open and then close on arrival. */
  var RAILKEY = "smp.console.rail";
  try { if (localStorage.getItem(RAILKEY) === "1") document.documentElement.setAttribute("data-rail", "1"); } catch (e) { /* kept on this device only */ }

  /* ── One shape for every request (§71's rule: three callers with the same
     six lines is where a typo lives in exactly one of them). ───────── */
  function send(path, body) {
    /* A TAB KEEPS WHAT IT LAST SHOWED (§400.2). A request made while a tab is
       re-reading behind its kept copy is counted, so the fresh copy is swapped
       in when the last answer has landed; and anything that CHANGES something
       drops every kept copy, so the next look at a tab never shows a state
       this page has just altered. */
    /* §620: A SAVED COPY IS DRAWN BY THE TAB'S OWN DRAWING, fed the answers
       it was given last time — never a second drawing of the same page that
       could disagree with the first. A read with no saved answer waits
       forever here: the latest copy replaces whatever was drawn. */
    var key = path + " " + JSON.stringify(body || {});
    var reading = !!body && READS.indexOf(body.action) >= 0;
    if (REPLAY && reading) {
      return Object.prototype.hasOwnProperty.call(REPLAY, key) ? Promise.resolve(REPLAY[key]) : new Promise(function () {});
    }
    var rec = reading ? RECORD : null;
    var rv = REVAL;
    if (rv) rv.pending++;
    if (!reading) KEPT = {};
    var landed = function () { if (rv) { rv.pending--; setTimeout(function () { revalSettle(rv); }, 0); } };
    return fetch(path, { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) })
      .then(function (r) {
        /* NOT SIGNED IN IS NOT AN ERROR MESSAGE, it is the door. */
        if (r.status === 401 || r.status === 403) {
          return r.json().then(function (j) {
            if (j && j.auth) { location.replace("/"); throw new Error("sign in"); }
            return j;
          });
        }
        return r.json();
      })
      .then(function (v) {
        /* kept for next time: what this tab read, as it read it */
        if (rec && v && v.ok !== false && rec === RECORD) { rec.answers[key] = v; saveTab(rec); }
        landed(); return v;
      }, function (e) { landed(); throw e; });
  }
  /* TWO ENDPOINTS, ONE DOOR. /api/memory is its own route (spec 045) and the
     401-is-the-door rule above is not written twice for it. */
  function post(body) { return send("/api/platform", body); }
  function mpost(body) { return send("/api/memory", body); }
  function fpost(body) { return send("/api/frameworks", body); }
  function cpost(body) { return send("/api/copilot", body); }

  var page = document.getElementById("page");
  var nav = document.getElementById("nav");
  /* THE CONSOLE OPENS ON HOME (spec 068; it opened on My work, §400), and
     the tab you are on is the address's hash, so a reload keeps it and a link
     can name one ("Switch client…" from a client is /platform#clients). */
  var TABS_KNOWN = ["home", "mywork", "clients", "consultants", "access", "memory", "frameworks", "copilot", "history"];
  var TAB = (function () {
    var h = String(location.hash || "").replace(/^#/, "");
    return TABS_KNOWN.indexOf(h) >= 0 ? h : "home";
  })();
  var ME = null;
  /* The boot's own `cards` answer, waiting for the FIRST draw and nobody else
     (§369). Declared here rather than left to hoist, because a second `var` of
     one name in this scope is one binding and the later one wins in silence
     (§56.7) — grepped, and this is the only pair. */
  var BOOTCARDS = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    /* textContent, never innerHTML: every name here is typed by a person. */
    if (text != null) e.textContent = text;
    return e;
  }
  function clear() { page.textContent = ""; if (page === SHOWN) ONLIST = null; }
  function say(msg, bad) {
    var p = el("p", bad ? "err" : "said", msg);
    page.appendChild(p);
    return p;
  }
  /* ── EVERY TAB'S BAND IS HOME'S (Islam, 2026-10-24: "the banner in the
     home with its size and location stays the same when we go through the
     modules … with the different content") ────────────────────────────
     The gold line says what the page holds now, the title is the page's
     name in the greeting's Georgia, the sentence what it is for, and the
     right side its counts or its buttons. It keeps the title's own shape
     (`.ptitle`, an h1, a `.right`) so every control a page puts there, and
     every check that finds one, is where it was. */
  function pageBand(text, right, eye, sub) {
    var h = el("header", "ptitle pgband");
    var l = el("div", "pgl");
    var e = el("p", "pgeye", eye || "");
    l.appendChild(e);
    l.appendChild(el("h1", null, text));
    if (sub) l.appendChild(el("p", "pgsub", sub));
    h.appendChild(l);
    if (right) { right.className = (right.className ? right.className + " " : "") + "right"; h.appendChild(right); }
    h.eye = e;
    page.appendChild(h);
    return h;
  }
  function title(text, right) {
    var h = el("div", "ptitle");
    h.appendChild(el("h1", null, text));
    if (right) { right.className = "right"; h.appendChild(right); }
    page.appendChild(h);
    return h;
  }
  /* A COUNT AND ITS NOUN (§323). The client platform has a `plural` helper
     and this page does not — and it is not borrowed, because that one is
     wired to the tenant's own labels and this page has none. Irregular
     plurals are passed in rather than guessed at: "persons" and
     "capabilitys" are what a rule that appends an "s" produces (§107.8's
     trap, on the other side of the switch). */
  function nOf(n, one, many) {
    return n + " " + (n === 1 ? one : (many || one + "s"));
  }
  function initials(name) {
    var w = String(name || "?").trim().split(/\s+/);
    return (w.length > 1 ? w[0].charAt(0) + w[1].charAt(0) : w[0].slice(0, 2)).toUpperCase();
  }

  /* ── The navigation is drawn from what this account may open ─────
     A tab that always refuses is worse than no tab (§45.2), so the row is
     built after `me` answers rather than written into the markup. */
  function drawNav() {
    nav.textContent = "";
    nav.removeAttribute("aria-busy");
    /* MEMORY IS THE FIRST TAB HERE WITH NO GATE, and that is decision 1 of
       spec 045 rather than an oversight: every consultant reads every
       insight, which is what makes it a memory rather than a filing cabinet.
       The boundary it does keep is on the server — a client's own account
       never reaches /api/memory — and it is checked there. */
    /* THE FOURTH WORD IS THE HEADING THE TAB SITS UNDER (§601), in the
       column, and History has none: it stands alone at the foot. Said on
       each tab rather than in a second list, so a tab added here cannot be
       left out of the column by forgetting the other. */
    /* HOME IS FIRST AND MY WORK IS MY TASKS (spec 068): Islam, "change the
       name of my work to my Tasks". The key stays `mywork`, so every address
       and kept copy that names it still works. */
    var tabs = [["home", "Home", true, "Work"],
                ["mywork", "My tasks", true, "Work"],
                ["clients", "Clients", true, "Work"],
                ["consultants", "Consultants", ME.canConsultants, "Team"],
                ["access", "Who sees what", ME.canAccess, "Team"],
                /* TRACK RECORD IS THE MEMORY'S TAB (spec 069, which renamed
                   spec 067's Case studies: Islam, "case studies mean that
                   there is something new while it's just documentation of
                   our previous work"). The key stays `memory`, so every
                   address and kept copy that names it still works. */
                ["memory", "Track Record", true, "Knowledge"],
                /* FRAMEWORKS IS UNGATED FOR THE MEMORY'S OWN REASON (spec 052,
                   decision 1): every consultant reads the whole library, and
                   only an admin adds to it — which is a gate on the ACT, asked
                   on the server, never a gate on the tab. */
                ["frameworks", "Frameworks", true, "Knowledge"],
                /* THE COPILOT'S SETTINGS LIVE HERE (§501): they are the same
                   for every client, so reaching them from inside one client's
                   platform said they were that client's. Ungated for the
                   frameworks' reason: every consultant reads the method, and
                   only a Forefront super user changes it — a gate on the ACT,
                   asked on the server. */
                ["copilot", "Copilot", true, "Knowledge"],
                /* HISTORY IS LAST AND UNGATED (§487), and both halves are
                   decisions. Last, because it is where you go to look back
                   rather than to work — Islam's own placement, from the
                   drawing. Ungated, because every consultant may read what
                   has been done to the clients they can already open, and
                   the narrowing is in the READ's own WHERE (§355): a row
                   about a client whose card this person is not shown is not
                   in the answer at all, so there is nothing for a tab gate
                   to protect. */
                ["history", "History", true, null]];
    /* A heading is drawn over the run of tabs that name it, and only when
       this account is shown one of them (§61): an office without Consultants
       or Who sees what has no Team heading over nothing. */
    var box = null, here = "";
    tabs.forEach(function (t) {
      if (!t[2]) return;
      if (!box || box.getAttribute("data-grp") !== String(t[3])) {
        box = el("div", t[3] ? "sbgrp" : "sbgrp foot");
        box.setAttribute("data-grp", String(t[3]));
        if (t[3]) box.appendChild(el("span", "sbgl", t[3]));
        nav.appendChild(box);
      }
      var b = el("button", TAB === t[0] ? "on" : null);
      b.type = "button";
      b.setAttribute("data-tab", t[0]);
      b.setAttribute("data-tip", t[1]);
      if (TAB === t[0]) { b.setAttribute("aria-current", "page"); here = t[1]; }
      /* the icon is this page's own constant, never a typed word */
      b.innerHTML = NAV_ICON[t[0]] || "";
      b.appendChild(el("span", "lb", t[1]));
      b.addEventListener("click", function () { menu(false); go(t[0], "row"); });
      box.appendChild(b);
    });
    document.getElementById("sbhere").textContent = here;
  }

  /* ── THE COLUMN'S OWN CONTROLS (§601) ────────────────────────────────
     Replacing §584's sideways tab bar: on a computer the « button keeps the
     column to its icons (kept on this device), and the name a hidden label
     stands for shows beside the icon on a hover or a key; on a phone the
     menu button opens the column over the page. */
  var NAV_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">';
  var NAV_ICON = {
    home: NAV_SVG + '<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg>',
    mywork: NAV_SVG + '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
    clients: NAV_SVG + '<path d="M4 20V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v14"/><path d="M15 10h3a2 2 0 0 1 2 2v8"/><path d="M3 20h18"/><path d="M8 8h3M8 12h3M8 16h3"/></svg>',
    consultants: NAV_SVG + '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6"/><path d="M17 14.2a5 5 0 0 1 3.5 4.8"/></svg>',
    access: NAV_SVG + '<path d="M12 3 5 6v5c0 4.5 3 8.2 7 9.5 4-1.3 7-5 7-9.5V6z"/><circle cx="12" cy="10.5" r="2"/><path d="M12 12.5V15"/></svg>',
    memory: NAV_SVG + '<path d="M5 5a1 1 0 0 1 1-1h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
    frameworks: NAV_SVG + '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
    copilot: NAV_SVG + '<path d="M12 3.5 13.8 9a2 2 0 0 0 1.2 1.2l5.5 1.8-5.5 1.8a2 2 0 0 0-1.2 1.2L12 20.5 10.2 15A2 2 0 0 0 9 13.8L3.5 12 9 10.2A2 2 0 0 0 10.2 9z"/></svg>',
    history: NAV_SVG + '<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v4.5H8"/><path d="M12 8v4.5l3 2"/></svg>'
  };
  var ROOT = document.documentElement;
  var side = document.getElementById("side");
  /* THE MARK AT THE TOP GOES HOME (Islam, 2026-10-24: "I want the icon on
     the top to take me home as well"), in the column and on a phone's bar,
     the same press as Home's own row */
  Array.prototype.forEach.call(document.querySelectorAll("[data-home-logo]"), function (b) {
    b.addEventListener("click", function () { menu(false); go("home", "row"); });
  });
  var fold = document.getElementById("sbfold");
  var opener = document.getElementById("sbopen");
  var tip = document.getElementById("sbtip");
  function railOn() {
    return ROOT.getAttribute("data-rail") === "1" && window.matchMedia("(min-width:1000px)").matches;
  }
  function railSay() {
    var words = ROOT.getAttribute("data-rail") === "1" ? "Show names" : "Show icons only";
    fold.setAttribute("aria-label", words);
    fold.setAttribute("data-tip", words);
  }
  fold.addEventListener("click", function () {
    var on = ROOT.getAttribute("data-rail") !== "1";
    if (on) ROOT.setAttribute("data-rail", "1"); else ROOT.removeAttribute("data-rail");
    try { localStorage.setItem(RAILKEY, on ? "1" : "0"); } catch (e) { /* kept on this device only */ }
    railSay();
    tipHide();
  });
  railSay();

  /* A tab's name (and the person's, on the initials) shows only where the
     column is icons wide, since the words are there to read otherwise; a
     button that is only an icon names itself whenever it is pointed at.
     Placed from the box the browser drew. */
  function tipShow(t) {
    if (t.closest("#nav, .sbav") && !railOn()) { tipHide(); return; }
    var r = t.getBoundingClientRect();
    /* the box is in the window's pixels, the place is set in the page's,
       and the console is zoomed on a computer (80%, below) */
    var z = parseFloat(getComputedStyle(ROOT).zoom) || 1;
    tip.textContent = t.getAttribute("data-tip");
    tip.style.left = Math.round((r.right + 10) / z) + "px";
    tip.style.top = Math.round((r.top + r.height / 2) / z) + "px";
    tip.classList.add("on");
  }
  function tipHide() { tip.classList.remove("on"); }
  side.addEventListener("mouseover", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (t) tipShow(t); else tipHide();
  });
  side.addEventListener("mouseleave", tipHide);
  side.addEventListener("focusin", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tip]") : null, keyed = false;
    try { keyed = !!t && t.matches(":focus-visible"); } catch (x) { keyed = false; }
    if (keyed) tipShow(t); else tipHide();
  });
  side.addEventListener("focusout", tipHide);
  side.addEventListener("click", tipHide);
  nav.addEventListener("scroll", tipHide, { passive: true });

  function menu(open) {
    if (open) ROOT.setAttribute("data-menu", "1"); else ROOT.removeAttribute("data-menu");
    opener.setAttribute("aria-expanded", String(!!open));
    if (open) (nav.querySelector("button.on") || document.getElementById("sbclose")).focus();
  }
  opener.addEventListener("click", function () { menu(true); });
  document.getElementById("sbclose").addEventListener("click", function () { menu(false); opener.focus(); });
  document.getElementById("sbscrim").addEventListener("click", function () { menu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && ROOT.getAttribute("data-menu") === "1") { menu(false); opener.focus(); }
  });

  /* ── A TAB SHOWS WHAT IT LAST SHOWED, THEN CATCHES UP (§400.2) ─────
     Islam: "when I switch between the tabs of the platform like my work and
     clients everytime it loads" — and, of the two answers put to him, the one
     that is always current: the kept copy is drawn at once and the tab reads
     again BEHIND it, the fresh copy swapped in when the answers land.
     HOW: every draw writes into `page`, including the parts that arrive
     later (settle(), the archived band, the library), so during a re-read
     `page` IS a detached box for the whole of it, and the kept copy sits in
     the real one. Kept as the tab's own NODES, moved rather than cloned, so
     every control on it still works.
     ONLY THE TAB ROW USES A KEPT COPY. The six other ways here to `go()` —
     after adding a client, archiving one, changing whose work you are
     looking at — follow a change and read fresh, as they did (§369, §48.2).
     A HAND ON THE PAGE WINS: a press or a key inside the kept copy abandons
     the re-read, so nothing is swapped out from under somebody typing into a
     search box (§35, §71.2). Kept in memory only: a refresh starts clean. */
  var SHOWN = page;
  var KEPT = {};
  var ONLIST = null;
  var REVAL = null;
  var READS = ["me", "cards", "mywork", "home", "consultants", "access", "list", "one", "library", "client", "history", "read", "case", "options"];
  /* §620: what a tab's drawing is fed from its saved copy (REPLAY), and the
     record of what its latest reading was given, kept for next time
     (RECORD). Both are the request's own business: see send(). */
  var REPLAY = null;
  var RECORD = null;
  /* A HAND ON THE PAGE WINS (§400.2) — over a kept copy, which is real and
     can be worked on. Never over a skeleton or a saved copy (`hold`): there
     is nothing on either to protect, and abandoning the reading would leave
     the shape standing in for a page that never comes. */
  function revalStop(e) {
    if (!REVAL || (e && REVAL.hold)) return;
    REVAL = null;
    page = SHOWN;
    unhold();
  }
  function revalSettle(rv) {
    if (REVAL !== rv || rv.pending > 0) return;
    REVAL = null;
    page = SHOWN;
    var y = window.scrollY;
    SHOWN.textContent = "";
    unhold();
    while (rv.next.firstChild) SHOWN.appendChild(rv.next.firstChild);
    window.scrollTo(0, y);
  }
  function unhold() {
    SHOWN.removeAttribute("inert");
    SHOWN.removeAttribute("aria-busy");
    SHOWN.removeAttribute("data-saved");
  }
  ["pointerdown", "keydown"].forEach(function (ev) {
    SHOWN.addEventListener(ev, revalStop, true);
  });

  /* ── A TAB'S SAVED COPY (§620) ─────────────────────────────────────────
     Islam chose it: "Should the console remember its tabs between visits
     (kept in your browser, wiped when you sign out)" — "Yes". What each tab
     read last time is kept in this browser under the client page's own
     prefix (§431: `smp.cache.`, which signing in and signing out both wipe),
     with the person it was read for. Coming back to the console, or opening
     a tab for the first time since, draws that copy at once through the
     tab's own drawing, marked "Updating…" and taking no input, while the
     latest copy is read behind it and swapped in. A copy that is somebody
     else's is never drawn, and is dropped. */
  var SAVEKEY = "smp.cache.console.";
  function savedOf(tab, email) {
    try {
      var s = JSON.parse(localStorage.getItem(SAVEKEY + tab) || "null");
      if (!s || !s.answers || !s.email) return null;
      if (email && s.email !== email) { wipeSaved(); return null; }
      return s;
    } catch (e) { return null; }
  }
  function saveTab(rec) {
    try { localStorage.setItem(SAVEKEY + rec.tab, JSON.stringify({ email: rec.email, at: Date.now(), answers: rec.answers })); }
    catch (e) { /* a full or blocked store keeps nothing, and the page is the same */ }
  }
  function wipeSaved() {
    try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf(SAVEKEY) === 0) localStorage.removeItem(k); } } catch (e) {}
  }
  /* The tab's own drawing, fed the saved answers, into the visible page; the
     answers arrive at once, so the copy is complete before anything paints.
     Then the mark, and the lock. */
  function drawSaved(tab, saved, done) {
    page = SHOWN;
    REPLAY = saved.answers;
    try { redraw(); } catch (e) { /* a copy that no longer draws is simply not shown */ }
    /* its answers are already there, so its drawing has finished by the
       next turn; only then does anything else write into the page */
    setTimeout(function () {
      REPLAY = null;
      page = REVAL ? REVAL.next : SHOWN;
      if (TAB === tab && SHOWN.getAttribute("data-saved") === tab) staleMark();
      if (done) done();
    }, 0);
    SHOWN.setAttribute("data-saved", tab);
    SHOWN.setAttribute("inert", "");
    SHOWN.setAttribute("aria-busy", "true");
  }
  function staleMark() {
    var pill = el("span", "stale", "Updating…");
    pill.setAttribute("role", "status");
    pill.title = "Showing what you saw last time while the latest copy loads. Nothing can be changed until it has.";
    var right = SHOWN.querySelector(".ptitle .right"), head = SHOWN.querySelector(".ptitle"), band = SHOWN.querySelector(".hohello, .mwmast, .pgband");
    if (right) right.insertBefore(pill, right.firstChild);
    else if (head) { pill.style.marginLeft = "auto"; head.appendChild(pill); }
    /* Home's and My tasks' bands hold it in their corner, so the band
       stays where the page will draw it (2026-10-24) */
    else if (band) { pill.classList.add("onband"); band.appendChild(pill); }
    else { var line = el("div", "staleline"); line.appendChild(pill); SHOWN.insertBefore(line, SHOWN.firstChild); }
  }

  /* ── EVERY TAB'S SHAPE, THE FIRST TIME (§620) ─────────────────────────
     The mockup's shapes, in the boot skeleton's bars. Clients keeps §371's
     waiting cards. Nothing here is a word anybody typed. */
  /* THE BAND IS DRAWN AT ONCE, AND NEVER MOVES (Islam, 2026-10-24: "when I
     move from home to another module first the banner appear to be lower
     and then adjusts itself"). The waiting shape starts with the tab's own
     band, its real name and sentence, at the place and height the page will
     draw it, so only what is under it waits. */
  var BAND_SAYS = {
    clients: ["Clients", "Every client the office works with, and the way into each module."],
    consultants: ["Consultants", "The office's people, their seats and what each may open."],
    access: ["Who sees what", "Which pages each seat may open, and who may change them."],
    memory: ["Track Record", "What we did for each client, and what we learned doing it."],
    frameworks: ["Frameworks", "The strategy frameworks the office works with, to read or to ask."],
    copilot: ["Copilot settings", "How the Copilot thinks and what it may do, the same for every client."],
    history: ["History", "What was done to the clients you can open, and by whom."]
  };
  function tabSkel(tab) {
    /* drawn into a box nobody sees, then handed over as a fragment, so the
       band and the shape land in the page side by side as they always did */
    var box = el("div"), f = document.createDocumentFragment();
    var was = page;
    page = box;
    try {
      if (tab === "home") hoHello();
      else if (tab === "mywork") mwMast();
      else { var says = BAND_SAYS[tab] || BAND_SAYS.history; pageBand(says[0], null, "", says[1]); }
    } finally { page = was; }
    box.appendChild(tab === "clients" ? skelCards() : tabSkelBody(tab));
    while (box.firstChild) f.appendChild(box.firstChild);
    return f;
  }
  function tabSkelBody(tab) {
    var b = function (w, cls) { return '<span class="b' + (cls ? " " + cls : "") + '" style="width:' + w + '"></span>'; };
    var n = function (k, f) { var s = ""; for (var i = 0; i < k; i++) s += f(i); return s; };
    /* the title line is the band now, drawn above */
    var head = function (w, right) { return ""; };
    var table = function (rows, cells) { return "<div><div class=\"th\"></div>" + n(rows, function (i) { return '<div class="tr">' + cells(i) + "</div>"; }) + "</div>"; };
    var S = {
      mywork: function () {
        return n(2, function () {
            return '<div><div class="r" style="padding-bottom:8px;border-bottom:2px solid var(--line)">' + b("110px", "t") + b("60px", "q") + "</div>" +
              n(3, function (i) { return '<div class="r ln">' + b("16px") + b((52 - i * 9) + "%") + '<span class="grow"></span>' + b("110px", "p q hide-narrow") + b("80px", "q hide-narrow") + b("90px") + "</div>"; }) + "</div>";
          });
      },
      consultants: function () {
        return head("130px") + table(4, function (i) { return b("150px") + b("190px", "q hide-narrow") + b("80px", "p") + b((180 - i * 30) + "px", "q hide-narrow") + b("40px", "q"); }) +
          '<div class="r">' + b("240px", "k q") + b("260px", "k q hide-narrow") + b("140px", "k") + "</div>";
      },
      access: function () {
        return head("150px") + b("70%", "q") + table(2, function () { return b("220px") + '<span class="grow"></span>' + n(4, function () { return b("90px", "p q hide-narrow"); }); });
      },
      /* Home (spec 068): the greeting band, your clients and your tasks side
         by side, and the two boxes under them */
      /* THE CARDS HOME DRAWS, in their own boxes (.hotop, .hocard, .hochd,
         .hotwo), so they land where the page will: Your clients and Your
         tasks side by side, Case studies wide under them with its two
         halves. Only what is inside each waits. */
      home: function () {
        var line = function (i) { return '<div class="r ln">' + b("30px", "q") + b((62 - i * 10) + "%") + '<span class="grow"></span>' + b("70px", "q hide-narrow") + "</div>"; };
        var card = function (cls, body) { return '<section class="hocard' + cls + '"><div class="hochd"><span class="hocic"></span>' + b("120px", "t") +
          '<span class="sp"></span>' + b("80px", "q") + '</div><div class="hobody">' + body + "</div></section>"; };
        var half = function (k) { return "<div>" + b("140px", "q") + n(k, line) + "</div>"; };
        return '<div class="hotop">' + card("", '<div style="padding:4px 14px 8px">' + n(1, line) + "</div>") + card("", '<div style="padding:4px 14px 8px">' + n(1, line) + "</div>") + "</div>" +
          card(" hosec", '<div class="hotwo">' + half(1) + half(1) + "</div>");
      },
      /* Case studies (spec 067), the memory's tab: the title and its count,
         the big search line, the categories, the shelf of studies */
      memory: function () {
        return head("140px", b("90px", "q hide-narrow") + b("150px", "k q") + b("170px", "k")) + '<div class="r">' + b("100%", "k q") + b("150px", "k q hide-narrow") + "</div>" +
          '<div class="r" style="flex-wrap:wrap">' + n(5, function (i) { return b((90 + (i % 3) * 24) + "px", "p q"); }) + "</div>" +
          '<div class="r" style="align-items:stretch;gap:14px;flex-wrap:wrap">' + n(3, function (i) { return '<div class="box c grow" style="min-width:200px">' + b("70px", "p q") + b((70 - i * 8) + "%", "t") + b("90%", "q") + b("60%", "q") + "</div>"; }) + "</div>";
      },
      frameworks: function () {
        return head("130px", b("160px", "k")) + '<div class="box c">' + b("100%", "k q") + '<div class="r" style="flex-wrap:wrap">' + n(6, function (i) { return b((90 + (i % 3) * 30) + "px", "p q"); }) + "</div></div>" +
          '<div class="box c" style="gap:0;padding:0">' + n(5, function (i) { return '<div class="c" style="gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-soft)"><div class="r">' + b((140 + i * 18) + "px") + b("120px", "p q") + "</div>" + b((70 - i * 5) + "%", "q") + "</div>"; }) + "</div>";
      },
      copilot: function () {
        return head("160px", b("220px", "k q")) + '<div class="r">' + n(5, function () { return b("80px", "k q"); }) + "</div>" +
          '<div class="box c"><div class="r">' + b("16px") + b("120px", "t") + '<span class="grow"></span>' + b("50px", "k q") + "</div>" + n(7, function (i) { return b((88 - (i % 4) * 12) + "%", i % 3 ? "q" : ""); }) + "</div>";
      },
      history: function () {
        return head("100px", b("200px", "k q") + b("60px", "p q")) + table(8, function (i) { return b("44px", "q") + b("120px") + b("90px", "q") + b((260 - (i % 3) * 50) + "px", "q hide-narrow"); });
      }
    };
    var d = el("div", "tsk" + (tab === "home" ? " tskhome" : ""));
    d.setAttribute("aria-hidden", "true");
    d.innerHTML = (S[tab] || S.history)();
    return d;
  }

  /* `how` says how the tab is being reached: "row" (its press in the
     column), "boot" (arriving at the console), or nothing (one of the six
     ways that follow a change, which read fresh — §369, §48.2).
     WHAT SHOWS AT ONCE, in this order: the tab as it was left on this visit
     (§400.2's kept copy, "row" only), else its saved copy ("row" and "boot"),
     else its shape. WHAT IS READ, always: the tab's own drawing into a box
     nobody sees, swapped in when its answers have landed. */
  function go(tab, how) {
    /* what is on screen is the tab's own page — never its shape or its saved
       copy still waiting for the latest one, which are not kept (§620) */
    var real = !REVAL || !REVAL.hold;
    revalStop();
    /* Only the tab's own list is kept, never a form or a reading view
       opened inside it — go() below puts the tab back on its list. */
    if (real && ONLIST && ONLIST === TAB && SHOWN.firstChild && MEM.view === "lib" && FW.view === "list") {
      var f = document.createDocumentFragment();
      while (SHOWN.firstChild) f.appendChild(SHOWN.firstChild);
      KEPT[TAB] = f;
    }
    ONLIST = null;
    TAB = tab;
    /* THE CLIENTS PAGE OPENS ON ACTIVE, every visit (Islam: "default is
       active"); only a press inside the page moves it. */
    if (tab === "clients" && how === "row") CL.which = "active";
    try { history.replaceState(null, "", tab === "home" ? location.pathname : "#" + tab); } catch (e) { /* the address is a convenience */ }
    MEM.view = "lib";
    FW.view = "list";
    CP.editing = null;
    CP.flash = null;
    drawNav();
    var kept = how === "row" ? KEPT[tab] : null;
    delete KEPT[tab];
    var hold = !kept;
    if (how === "boot" && SHOWN.getAttribute("data-saved") === tab) {
      /* already drawn from its saved copy while `me` was being asked */
    } else {
      unhold();
      SHOWN.textContent = "";
      var saved = !kept && (how === "row" || how === "boot") ? savedOf(tab, ME.email) : null;
      if (kept) SHOWN.appendChild(kept);
      else if (saved) drawSaved(tab, saved);
      else SHOWN.appendChild(tabSkel(tab));
    }
    var rv = { pending: 0, next: document.createElement("div"), hold: hold };
    REVAL = rv;
    RECORD = { tab: tab, email: ME.email, answers: {} };
    /* the saved copy's own answers arrive first; the fresh reading starts
       on the next turn, so the two never write into one box */
    setTimeout(function () {
      if (REVAL !== rv) return;
      page = rv.next;
      redraw();
      ONLIST = tab;
      setTimeout(function () { revalSettle(rv); }, 0);
    }, 0);
  }

  /* ── A SILENT REFRESH (§313.28) ───────────────────────────────────
     Islam: "this page needs silent refresh." Every control here ended in a
     full redraw that CLEARED the page first and put "Reading…" in its place,
     so pressing a seat blanked the whole pane and rebuilt it — a flash, a
     scroll jump, and the row you were working on gone from under the pointer.

     The page is built into a DETACHED node and swapped in when it is ready,
     so nothing empty is ever on screen; the scroll position is put back
     because a swap is not a navigation. §71.2's rule — never a repaint under
     a working hand — applied to the one page that had no other way to update
     itself. */
  function redraw() {
    /* THE TAB IS NAMED ON THE PAGE'S OWN BOX, so a page's own rules can be
       scoped to it — case studies' are (spec 067), because a class name is
       one global namespace here (§65.9) and theirs are common words. */
    SHOWN.setAttribute("data-tab", TAB);
    if (TAB === "home") return drawHome();
    if (TAB === "mywork") return drawMyWork();
    if (TAB === "clients") return drawClients();
    if (TAB === "consultants") return drawConsultants();
    if (TAB === "access") return drawAccess();
    if (TAB === "memory") return drawMemory();
    if (TAB === "frameworks") return drawFrameworks();
    if (TAB === "copilot") return drawCopilot();
    if (TAB === "history") return drawHistory();
  }

  /* `quiet` is passed by every control that is UPDATING what is already on
     screen, as opposed to arriving at it. Arriving still says "Reading…",
     because then there is nothing to keep. */
  function lead(quiet, msg) {
    if (quiet) return;
    clear();
    page.appendChild(el("p", "muted", msg));
  }

  /* Built detached, swapped in one move, scroll restored — so the page never
     holds an empty frame and the row under the pointer does not move. */
  function settle(build) {
    var y = window.scrollY;
    var next = document.createElement("div");
    var was = page;
    page = next;
    try { build(); } finally { page = was; }
    page.textContent = "";
    while (next.firstChild) page.appendChild(next.firstChild);
    window.scrollTo(0, y);
  }

  /* ════ The consulting memory (spec 045) ══════════════════════════════
     Forefront's own, never a client's: an insight from one client is worth
     having BECAUSE it helps on the next, which is the one place on this
     platform where crossing clients is the point. Four states — the list,
     reading one, adding one, and a period debrief with the drafts it
     produces — drawn in the page's own classes.

     THE PAGE DERIVES NO RULE. `mine` arrives on every row, computed by the
     server, exactly as `mine` on a client card already is: one answer, not
     two (§53.5), and the server asks again when the press lands (§48.2). */
  var MEM = { view: "lib", entry: null, filters: { q: "", client: "", industry: "", kind: "", case: "" },
              draft: null, deb: null, drafts: null };
  var KINDS = [["practice", "Practice"], ["hiccup", "Hiccup"], ["lesson", "Lesson"]];
  /* The four questions, named ONCE — the form, the reading view and the
     debrief's drafts all walk this list (§104.7). */
  var QS = [["happened", "What happened"], ["did", "What we did"],
            ["came_of_it", "What came of it"], ["next_person", "What the next person should know"]];
  var kindWord = function (k) {
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0] === k) return KINDS[i][1];
    return "Lesson";
  };
  var whenWord = function (iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  };

  function memGo(view, extra) {
    MEM.view = view;
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) MEM[k] = extra[k];
    return drawMemory();
  }

  function drawMemory() {
    /* A WRITE-UP PRESSED ON MY TASKS OR HOME lands here on its assignment. */
    if (CS.jump) { MEM.view = CS.jump.view; MEM.caseId = CS.jump.id; CS.fresh = !!CS.jump.fresh; if (CS.jump.client) MEM.clientKey = CS.jump.client; CS.jump = null; }
    if (MEM.view === "lib") return drawCases();
    if (MEM.view === "client") return drawClientPage();
    if (MEM.view === "case") return drawCase();
    if (MEM.view === "pick") return drawPick();
    if (MEM.view === "write") return drawCaseWrite();
    if (MEM.view === "draft") return drawCaseDraft();
    if (MEM.view === "entry") return drawMemEntry();
    if (MEM.view === "wiz") return drawMemForm();
    if (MEM.view === "learn") return drawDebrief();
    if (MEM.view === "drafts") return drawDrafts();
    return drawCases();
  }

  /* ASK IT — on the page the insights are on, never a corner of its own
     (§32: a door behind a door). It writes nothing: what somebody went looking
     for is not part of the record. */
  function memAskBox() {
    var box = el("div", "askbox");
    var row = el("div", "askrow");
    var q = el("input", "fld");
    q.type = "text";
    q.id = "m-ask";
    q.placeholder = "Ask the memory — “we have hit this before, what happened?”";
    var go = el("button", "btn solid", "Ask");
    go.type = "button";
    var out = el("div", "askout");
    out.hidden = true;
    function run() {
      var text = q.value.trim();
      if (!text) return;
      go.disabled = true;
      out.hidden = false;
      out.textContent = "";
      out.appendChild(el("p", "muted", "Reading the memory…"));
      mpost({ action: "ask", question: text }).then(function (r) {
        go.disabled = false;
        out.textContent = "";
        if (!r || !r.ok) { out.appendChild(el("p", "muted", (r && r.error) || "The memory could not be asked.")); return; }
        if (r.why) { out.appendChild(el("p", "muted", r.why)); return; }
        out.appendChild(el("p", "askreply", r.reply));
        /* EVERY ANSWER NAMES ITS SOURCES, and they are DOORS: the next step is
           to open the insight and go and ask whoever wrote it. */
        if ((r.sources || []).length) {
          var sp = el("div", "asksrc");
          sp.appendChild(el("span", "lab", "From"));
          r.sources.forEach(function (src) {
            var b = el("button", "tag", src.title + " · " + src.author);
            b.type = "button";
            b.addEventListener("click", function () { memGo("entry", { entry: src.id }); });
            sp.appendChild(b);
          });
          out.appendChild(sp);
        } else if (r.answered) {
          /* An answer that cites nothing is one nobody can act on — said,
             rather than drawn as though it were sourced (§124). */
          out.appendChild(el("p", "muted", "It named no insight for that — treat it carefully."));
        }
      });
    }
    go.addEventListener("click", run);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
    row.appendChild(q); row.appendChild(go);
    box.appendChild(row); box.appendChild(out);
    return box;
  }

  /* The snippet is the first answer that has anything in it — a one-line
     insight has to look like a finished row, not a broken one (§245). */
  function memSnip(e) {
    /* WHAT THE NEXT PERSON SHOULD KNOW LEADS, where there is one: it is the
       line most worth reading on an index card (spec 067's drawing). */
    if (String(e.next_person || "").trim()) return e.next_person;
    for (var i = 0; i < QS.length; i++) if (String(e[QS[i][0]] || "").trim()) return e[QS[i][0]];
    return "";
  }

  /* ── Reading one ───────────────────────────────────────────────── */
  function drawMemEntry() {
    lead(false, "Reading…");
    return mpost({ action: "one", id: MEM.entry }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "That learning is no longer here.", true); return; }
      var e = j.entry;
      settle(function () {
        /* BACK GOES WHERE IT CAME FROM: the client's page it was opened on,
           or the front's list of learnings (spec 069). */
        var fromClient = MEM.back !== "lib";
        var back = el("button", "btn", fromClient ? "Back to " + e.clientName : "Back to Track Record");
        back.type = "button";
        back.addEventListener("click", function () { MEM.back = null; if (fromClient) memGo("client", { clientKey: e.client, caseId: e.caseId || MEM.caseId }); else memGo("lib"); });
        title("Track Record", (function () { var r = el("span"); r.appendChild(back); return r; }()));

        var card = el("article", "ecard");
        var tags = el("div", "etags");
        tags.appendChild(el("span", "tag " + e.kind, kindWord(e.kind)));
        tags.appendChild(el("span", "tag", e.clientName));
        if (e.industry) tags.appendChild(el("span", "tag", e.industry));
        card.appendChild(tags);
        card.appendChild(el("h2", null, e.title));
        var facts = el("p", "facts");
        facts.appendChild(el("b", null, whenWord(e.when)));
        if (e.occurred) facts.appendChild(document.createTextNode(" · " + e.occurred));
        if (e.caseName) facts.appendChild(document.createTextNode(" · " + (TYPE_WORD[e.caseKind] || "") + " · " + e.caseName));
        card.appendChild(facts);
        /* ITS AUTHOR OR A SUPER USER TIES IT to one of the same client's
           assignments (spec 069); everybody else reads where it is. */
        if (e.mine) memPlace(e, card);

        var qa = el("div", "qa");
        var any = false;
        QS.forEach(function (q) {
          var v = String(e[q[0]] || "").trim();
          if (!v) return;             /* an unanswered question is not a heading over nothing */
          any = true;
          var d = el("div");
          d.appendChild(el("h3", null, q[1]));
          d.appendChild(el("p", null, v));
          qa.appendChild(d);
        });
        if (any) card.appendChild(qa);

        /* THE AUTHOR IS WHAT A READER ACTS ON (decision 3): the name, the
           address, and a way to write to them. */
        var by = el("div", "byline");
        var who = el("span", "who");
        who.appendChild(el("span", "nm", e.author));
        who.appendChild(el("span", "em", e.authorEmail));
        by.appendChild(who);
        var sp = el("span", "sp");
        var ask = el("a", "btn", "Ask " + String(e.author || "").split(/\s+/)[0]);
        ask.href = "mailto:" + e.authorEmail + "?subject=" + encodeURIComponent(e.title);
        sp.appendChild(ask);
        if (e.mine) {
          var ed = el("button", "btn", "Edit");
          ed.type = "button";
          ed.addEventListener("click", function () { memGo("wiz", { draft: e }); });
          sp.appendChild(ed);
          var rm = el("button", "btn", "Remove");
          rm.type = "button";
          rm.addEventListener("click", function () { memDrop(rm, e); });
          sp.appendChild(rm);
        }
        by.appendChild(sp);
        card.appendChild(by);
        page.appendChild(card);
      });
    });
  }

  /* REMOVING ONE IS THE ONE IRREVERSIBLE ACT HERE, and it asks twice.
     NOT `confirm()` — a browser dialog can be silenced permanently on some
     other site and this is the press that must not go through unseen (§95) —
     and not a modal either, because this page has no dialog machinery at all
     and building some for one button is furniture (§2b). The button says what
     the second press does, which is the smallest thing that works and cannot
     be switched off. */
  function memDrop(btn, e) {
    if (btn.dataset.armed !== "1") {
      btn.dataset.armed = "1";
      btn.textContent = "Remove it — this cannot be undone";
      btn.classList.add("amber");
      return;
    }
    btn.disabled = true;
    mpost({ action: "drop", id: e.id }).then(function (j) {
      if (!j || !j.ok) { btn.disabled = false; say((j && j.error) || "It could not be removed.", true); return; }
      memGo("client", { clientKey: e.client, caseId: e.caseId });
    });
  }

  /* The prompt for ONE insight: the four questions with the client already in
     them. Built here rather than on the server because it is made of what the
     page already holds, and asking for it would be a request to learn nothing
     new (§98). */
  function onePrompt(csel, clients) {
    var c = clientPhrase(clientNamed(clients, csel.value));
    return "I am writing up one thing my consulting firm learned, about\n" +
      c + ".\n\n" +
      "Ask me these four questions, one at a time, and wait for my answer\n" +
      "before asking the next:\n\n" +
      "  1. What happened?\n" +
      "  2. What did we do?\n" +
      "  3. What came of it?\n" +
      "  4. What should the next person know?\n\n" +
      "Then write my answers back as four short paragraphs under those four\n" +
      "headings, in my own words, and nothing else.";
  }

  /* ── Adding or correcting one ──────────────────────────────────── */
  function drawMemForm() {
    var e = MEM.draft || {};
    var editing = !!e.id;
    lead(false, "Reading…");
    /* THE CLIENT AND THE ASSIGNMENT ARE ALREADY CHOSEN (spec 069): a new
       learning arrives from Add learnings with both picked, and one being
       corrected keeps its own; where it belongs is changed on its page. */
    return Promise.resolve().then(function () {
      var clients = [{ key: e.client, name: e.clientName || e.client }];
      settle(function () {
        var right = el("span");
        var cancel = el("button", "btn", "Cancel");
        cancel.type = "button";
        cancel.addEventListener("click", function () { if (editing) memGo("entry"); else memGo("learn", { pickClient: e.client, pickCase: e.caseId }); });
        var save = el("button", "btn amber", "Save the learning");
        save.type = "button";
        right.appendChild(cancel); right.appendChild(save);
        title(editing ? "Edit a learning" : "Add a learning", right);
        if (e.caseName) {
          var ctx = el("p", "trctx");
          ctx.appendChild(el("b", null, e.clientName || ""));
          ctx.appendChild(document.createTextNode(" · "));
          ctx.appendChild(typeTag(e.caseKind));
          ctx.appendChild(document.createTextNode(" " + e.caseName));
          page.appendChild(ctx);
        }

        var wiz = el("div", "wiz");
        var fields = {};

        var pair = el("div", "wpair");
        var cbox = el("div");
        cbox.appendChild(labFor("m-client", "Client"));
        var csel = el("select", "fld");
        csel.id = "m-client";
        csel.disabled = true;
        clients.forEach(function (c) {
          var op = el("option", null, c.name);
          op.value = c.key;
          if (c.key === (e.client || "")) op.selected = true;
          csel.appendChild(op);
        });
        cbox.appendChild(csel); pair.appendChild(cbox);

        var kbox = el("div");
        kbox.appendChild(labFor("m-kind", "Kind"));
        var ksel = el("select", "fld");
        ksel.id = "m-kind";
        KINDS.forEach(function (k) {
          var op = el("option", null, k[1]);
          op.value = k[0];
          if (k[0] === (e.kind || "lesson")) op.selected = true;
          ksel.appendChild(op);
        });
        kbox.appendChild(ksel); pair.appendChild(kbox);

        var wbox = el("div");
        wbox.appendChild(labFor("m-when", "When it happened"));
        var wfld = el("input", "fld");
        wfld.id = "m-when"; wfld.type = "text"; wfld.value = e.occurred || "";
        wbox.appendChild(wfld); pair.appendChild(wbox);
        wiz.appendChild(pair);

        var tq = el("div", "wq");
        tq.appendChild(labFor("m-title", "Title"));
        var tfld = el("input", "fld");
        tfld.id = "m-title"; tfld.type = "text"; tfld.value = e.title || "";
        tq.appendChild(tfld); wiz.appendChild(tq);

        QS.forEach(function (q) {
          var box = el("div", "wq");
          box.appendChild(labFor("m-" + q[0], q[1]));
          var ta = el("textarea", "fld");
          ta.id = "m-" + q[0];
          ta.value = e[q[0]] || "";
          box.appendChild(ta);
          fields[q[0]] = ta;
          wiz.appendChild(box);
        });

        wiz.appendChild(el("p", "note", "A title is enough to save. The rest can wait."));

        /* The other way to finish it — under a rule, because it is not the
           next step of the form but an alternative to filling it in (§317's
           own .apart device). */
        var apart = el("div", "apart");
        apart.appendChild(el("span", "akey", "Or answer it out loud"));
        var pre = el("pre", "prompt", onePrompt(csel, clients));
        apart.appendChild(pre);
        var acts = el("div", "wacts");
        acts.appendChild(copyBtn(function () { return pre.textContent; }));
        acts.appendChild(el("span", "muted", "Paste it back into the boxes above."));
        apart.appendChild(acts);
        /* the same, one screen over (§53.5) */
        var follow1 = function () { pre.textContent = onePrompt(csel, clients); };
        csel.addEventListener("input", follow1);
        csel.addEventListener("change", follow1);
        wiz.appendChild(apart);
        page.appendChild(wiz);

        save.addEventListener("click", function () {
          var body = { action: "save", client: csel.value, kind: ksel.value,
                       title: tfld.value, occurred: wfld.value };
          if (editing) body.id = e.id;
          else if (e.caseId) body.caseId = e.caseId;
          QS.forEach(function (q) { body[q[0]] = fields[q[0]].value; });
          save.disabled = true;
          mpost(body).then(function (r) {
            save.disabled = false;
            if (!r || !r.ok) { say((r && r.error) || "It could not be saved.", true); return; }
            if (editing) memGo("entry", { entry: r.id });
            else memGo("client", { clientKey: e.client, caseId: e.caseId });
          });
        });
      });
    });
  }

  function labFor(id, text) {
    var l = el("label", "lab", text);
    l.setAttribute("for", id);
    return l;
  }
  function copyBtn(text) {
    var b = el("button", "btn solid", "Copy the prompt");
    b.type = "button";
    b.addEventListener("click", function () {
      var done = function () {
        b.textContent = "Copied";
        setTimeout(function () { b.textContent = "Copy the prompt"; }, 1600);
      };
      /* execCommand is the path that actually runs from a plain http origin
         (§93.6): navigator.clipboard needs a secure context. */
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text()).then(done, done);
      else {
        var ta = document.createElement("textarea");
        ta.value = text();
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (err) { /* nothing to do */ }
        document.body.removeChild(ta);
        done();
      }
    });
    return b;
  }
  function clientNamed(clients, key) {
    for (var i = 0; i < clients.length; i++) if (clients[i].key === key) return clients[i];
    return null;
  }
  function clientPhrase(c) {
    if (!c) return "this client";
    return c.name + (c.industry ? " (" + c.industry + ")" : "");
  }

  /* ════ The Track Record (spec 069, which reworks spec 067's case studies) ═
     The memory's tab. The front is one card per client; a client's page has
     a tab per assignment — Planning or Retainer, added by the super user on
     Clients — with its write-up and its learnings. Drawn in the console's own
     tokens from the signed-off drawing (design-mockups/track-record/
     2026-10-26_track-record-steps.html).

     THE PAGE DERIVES NO RULE: `canOpen`, `canWrite`, `canRegister` and `hidden`
     are the server's (lib/case-api.ts), and it asks again on every press. */
  var CS = { f: { q: "", industry: "", type: "", kind: "" }, one: null, opts: null, draft: null, pending: null, read: null, missing: null, ask: false, asking: false, jump: null };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function ym(v) { var m = /^(\d{4})-(\d{2})$/.exec(v || ""); return m ? { y: +m[1], m: +m[2] - 1 } : null; }
  function monthWord(v, withYear) { var a = ym(v); return a ? MONTHS[a.m] + (withYear === false ? "" : " " + a.y) : ""; }
  function spanWord(a, b) {
    var x = ym(a), y = ym(b);
    if (!x && !y) return "";
    if (x && !y) return "since " + monthWord(a);
    if (!x) return "until " + monthWord(b);
    return (x.y === y.y ? monthWord(a, false) : monthWord(a)) + " – " + monthWord(b);
  }
  function spanLong(a, b) {
    var x = ym(a), y = ym(b);
    var w = function (p) { return MONTHS_LONG[p.m] + " " + p.y; };
    if (x && y) return w(x) + " to " + w(y);
    if (x) return "since " + w(x);
    return y ? "until " + w(y) : "";
  }

  function firstName(n) { return String(n || "").split(/\s+/)[0]; }
  function cpostCases(body) { return send("/api/cases", body); }

  /* The client's mark where it has one — a PNG data URI only (§52), so it is
     safe as a src — and its initials where it does not (spec 067 §12). */
  function csLogo(client) {
    if (client && client.mark) {
      var im = el("img", "logo");
      im.src = client.mark; im.alt = client.name || "";
      return im;
    }
    return el("span", "logo", initials(client ? client.name : "?"));
  }

  /* ── THE TRACK RECORD'S WORDS (spec 069) ───────────────────────────────
     An assignment is Planning or Retainer; where its write-up stands is one
     of four words, the fourth being the lead's own reminder: the work has
     ended and nothing is written yet. */
  var TYPE_WORD = { planning: "Planning", retainer: "Retainer" };
  function thisMonth() { return new Date().toISOString().slice(0, 7); }
  function asgEnded(c) { return !!c.ended && c.ended <= thisMonth(); }
  function asgState(c) {
    if (c.state === "done") return ["Written up", "pub"];
    if (c.state === "writing") return ["Draft", "dr"];
    return asgEnded(c) ? ["Not written", "late"] : ["Running", "run"];
  }
  function typeTag(kind) { return el("span", "ttag " + (kind || "planning"), TYPE_WORD[kind] || "Planning"); }
  function kindTag(kind) { return el("span", "ktag " + kind, kindWord(kind)); }

  /* + ADD TO TRACK RECORD, one button with its two choices (Islam: "add
     learning or add a track record for a client as well?"). There is no
     "add a client" here: clients and assignments come from Clients. */
  function trAdd(client) {
    var wrap = el("span", "tradd");
    /* THE MENU IS PLACED ON THE SCREEN, not inside the band: the band
       clips what overflows it (its drawn circle), so a menu inside it would
       be cut off at its edge. It closes on the next press anywhere. */
    var shut = function () { menu.hidden = true; document.removeEventListener("click", shut); window.removeEventListener("scroll", shut); };
    var b = csButton("+ Add to Track Record", "amber", function (e) {
      e.stopPropagation();
      if (!menu.hidden) { shut(); return; }
      var z = parseFloat(getComputedStyle(ROOT).zoom) || 1;   /* tipShow's reason */
      var r = b.getBoundingClientRect();
      menu.style.top = Math.round((r.bottom + 6) / z) + "px";
      menu.style.right = Math.max(8, Math.round((window.innerWidth - r.right) / z)) + "px";
      menu.hidden = false;
      document.addEventListener("click", shut);
      window.addEventListener("scroll", shut, { passive: true });
    });
    b.setAttribute("aria-haspopup", "true");
    var menu = el("div", "tramenu");
    menu.hidden = true;
    [["pick", "Write up an assignment", "Pick a client and one of its assignments"],
     ["learn", "Add learnings", "A hiccup, a practice or a lesson, with the prompt or by hand"]].forEach(function (o) {
      var x = el("button");
      x.type = "button";
      x.setAttribute("data-add", o[0]);
      x.appendChild(el("b", null, o[1]));
      x.appendChild(el("small", null, o[2]));
      x.addEventListener("click", function () { memGo(o[0], { pickClient: client || "", pickCase: o[0] === "learn" && client ? MEM.caseId : "" }); });
      menu.appendChild(x);
    });
    wrap.appendChild(b); wrap.appendChild(menu);
    return wrap;
  }

  /* ── The front ─────────────────────────────────────────────────────────
     One card per client with its assignments and where each write-up
     stands (Islam: learnings "are part of the clients work", so there is no
     second view). Picking a kind of learning, or searching, lists the
     learnings that match across every client under the cards — the one
     question the old Insights view answered ("every hiccup on a Retainer"). */
  function drawCases(quiet) {
    lead(quiet, "Reading…");
    var f = CS.f;
    var wantLearn = !!(f.kind || f.q);
    return Promise.all([cpostCases({ action: "library", q: f.q }),
                        wantLearn ? mpost({ action: "list", q: f.q, industry: f.industry, kind: f.kind, type: f.type }) : Promise.resolve(null)])
    .then(function (both) {
      var j = both[0], lj = both[1];
      if (!j || !j.ok) { clear(); say((j && j.error) || "Could not read the Track Record.", true); return; }
      settle(function () {
        var right = el("span");
        var askb = csButton(CS.ask ? "Search instead" : "Ask a question", "ask", function () { CS.ask = !CS.ask; drawCases(true); });
        right.appendChild(askb);
        right.appendChild(trAdd(""));
        var head = pageBand("Track Record", right, "", "What we did for each client, and what we learned doing it.");

        /* one card per client, in the order its newest assignment started */
        var byClient = {}, order = [];
        j.cases.forEach(function (c) {
          var k = c.client.key;
          if (!byClient[k]) { byClient[k] = { client: c.client, list: [], learn: 0 }; order.push(k); }
          byClient[k].list.push(c);
        });
        (j.learnings || []).forEach(function (l) {
          if (!byClient[l.client]) {
            if (f.q) return;     /* a search names what matched, not every client with a note */
            byClient[l.client] = { client: { key: l.client, name: l.name, industry: l.industry, size: l.size, mark: l.mark || null }, list: [], learn: 0 };
            order.push(l.client);
          }
          byClient[l.client].learn = l.n;
        });
        var groups = order.map(function (k) { return byClient[k]; });
        var written = j.cases.filter(function (c) { return c.state === "done"; }).length;
        var nLearn = (j.learnings || []).reduce(function (n, l) { return n + l.n; }, 0);
        head.eye.textContent = nOf(groups.length, "client") + " · " + nOf(j.cases.length, "assignment") + " · " + written + " written up · " + nOf(nLearn, "learning");

        var card = el("section", "hocard cslib");
        var hd = el("div", "hochd");
        var hic = el("span", "hocic");
        hic.innerHTML = NAV_ICON.memory;
        hd.appendChild(hic);
        var hname = el("h2", null, f.kind ? "Learnings" : "Clients");
        hd.appendChild(hname);
        var hcnt = el("span", "hocnt");
        hd.appendChild(hcnt);
        hd.appendChild(el("span", "sp"));
        /* TYPING NEVER REPAINTS (§35): it runs when the box is left or Enter */
        var q = el("input", "fld");
        q.type = "search"; q.id = "cs-q"; q.value = f.q;
        q.placeholder = "Search write-ups and learnings";
        q.setAttribute("aria-label", "Search the Track Record");
        q.addEventListener("change", function () { f.q = q.value.trim(); drawCases(true); });
        hd.appendChild(q);
        card.appendChild(hd);
        if (CS.ask) { var ab = memAskBox(); ab.classList.add("inlib"); card.appendChild(ab); }

        /* THE FILTERS ARE CHIPS, drawn from what is here (§61): industries
           the cards carry; the two types; the three kinds of learning. */
        var inds = {};
        groups.forEach(function (g) { if (g.client.industry) inds[g.client.industry] = true; });
        var chips = el("div", "trchips");
        var chipRow = function (label, key, opts) {
          if (!opts.length) return;
          chips.appendChild(el("span", "lbl", label));
          opts.forEach(function (o) {
            var on = f[key] === o[0];
            var b = el("button", on ? "on" : null, o[1]);
            b.type = "button";
            b.setAttribute("data-" + key, o[0]);
            b.setAttribute("aria-pressed", String(on));
            b.addEventListener("click", function () { f[key] = on ? "" : o[0]; drawCases(true); });
            chips.appendChild(b);
          });
          chips.appendChild(el("span", "div"));
        };
        chipRow("Industry", "industry", Object.keys(inds).sort().map(function (k) { return [k, k]; }));
        chipRow("Type", "type", [["planning", "Planning"], ["retainer", "Retainer"]]);
        chipRow("Learnings", "kind", KINDS.map(function (k) { return [k[0], k[1]]; }));
        if (f.industry || f.type || f.kind || f.q) {
          chips.appendChild(csButton("Clear", "sm", function () { CS.f = { q: "", industry: "", type: "", kind: "" }; drawCases(true); }));
        }
        card.appendChild(chips);

        var shown = groups.filter(function (g) { return !f.industry || g.client.industry === f.industry; })
          .map(function (g) { return { client: g.client, learn: g.learn, list: g.list.filter(function (c) { return !f.type || c.kind === f.type; }) }; })
          .filter(function (g) { return !f.type || g.list.length; });

        if (!f.kind) {
          hcnt.textContent = String(shown.length);
          if (!shown.length) {
            var box = el("div", "empty");
            box.appendChild(el("b", null, f.q || f.industry || f.type ? "Nothing matches that" : "Nothing in the Track Record yet"));
            box.appendChild(document.createTextNode(f.q || f.industry || f.type
              ? "Try a client's name, an industry, or a word from a write-up."
              : "Assignments are added on the Clients page, and each one is written up when it ends."));
            card.appendChild(box);
          } else {
            var grid = el("div", "trcards");
            shown.forEach(function (g) { grid.appendChild(trClientCard(g)); });
            card.appendChild(grid);
          }
        }
        if (lj && lj.ok) {
          if (f.kind) hcnt.textContent = String(lj.entries.length);
          else card.appendChild(el("h3", "trsub", nOf(lj.entries.length, "learning") + " matching"));
          if (!lj.entries.length && f.kind) card.appendChild(el("p", "muted mwnone", "No learnings match that."));
          var res = el("div", "trres");
          lj.entries.forEach(function (e) { res.appendChild(trLearnRow(e)); });
          card.appendChild(res);
        }
        page.appendChild(card);
      });
    }).catch(function (e) { if (String(e.message) !== "sign in") { clear(); say("Could not reach the server.", true); } });
  }

  function trClientCard(g) {
    var b = el("div", "trcard");
    b.setAttribute("data-client", g.client.key);
    var hd = el("button", "trhd");
    hd.type = "button";
    hd.appendChild(csLogo(g.client));
    var t = el("span");
    t.appendChild(el("b", null, g.client.name));
    t.appendChild(el("small", null, [g.client.industry, g.client.past ? "Past client" : g.client.archived ? "Ended" : ""].filter(Boolean).join(" · ")));
    hd.appendChild(t);
    hd.addEventListener("click", function () { memGo("client", { clientKey: g.client.key, caseId: null }); });
    b.appendChild(hd);
    var list = el("div", "trasg");
    g.list.slice().reverse().forEach(function (c) {
      var r = el("button");
      r.type = "button";
      r.setAttribute("data-case", c.id);
      r.appendChild(typeTag(c.kind));
      r.appendChild(el("span", "nm", c.name));
      var st = asgState(c);
      r.appendChild(el("span", "st " + st[1], st[0]));
      r.addEventListener("click", function () { memGo("client", { clientKey: g.client.key, caseId: c.id }); });
      list.appendChild(r);
    });
    if (g.list.length) b.appendChild(list);
    b.appendChild(el("p", "trft", g.learn ? nOf(g.learn, "learning") : "No learnings yet"));
    return b;
  }

  function trLearnRow(e) {
    var b = el("button", "trlr");
    b.type = "button";
    b.appendChild(kindTag(e.kind));
    var t = el("span", "tx");
    t.appendChild(el("b", null, e.title));
    var snip = memSnip(e);
    if (snip) t.appendChild(el("small", null, snip));
    b.appendChild(t);
    var w = el("span", "wh");
    w.appendChild(el("b", null, e.clientName));
    w.appendChild(el("span", "by", e.author));   /* the author is what a reader acts on (spec 045 decision 3) */
    if (e.caseName) { var a = el("span"); if (e.caseKind) a.appendChild(typeTag(e.caseKind)); a.appendChild(document.createTextNode(" " + e.caseName)); w.appendChild(a); }
    else w.appendChild(el("span", "loose", "Not tied to an assignment yet"));
    b.appendChild(w);
    b.addEventListener("click", function () { memGo("entry", { entry: e.id, back: "lib" }); });
    return b;
  }

  /* ── A client's page ───────────────────────────────────────────────────
     The client on top, its assignments on a strip of months, one tab each;
     inside a tab the write-up and that assignment's learnings. A learning
     tied to none sits under the tabs until somebody picks its assignment. */
  function drawCase(quiet) {
    /* A write-up pressed on My tasks or Home names its assignment, not its
       client: read it once for the client, then draw the client's page on it. */
    lead(quiet, "Reading…");
    return cpostCases({ action: "case", id: MEM.caseId }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "That assignment is no longer here.", true); return; }
      var c = j.case;
      var fresh = CS.fresh; CS.fresh = false;
      MEM.clientKey = c.client.key;
      if (fresh && c.canWrite && c.state !== "done" && !(c.inShort || c.clientWhy || c.askedToDo || c.cameOfIt || c.deliverables.length)) return memGo("write");
      return memGo("client");
    });
  }

  function drawClientPage(quiet) {
    lead(quiet, "Reading…");
    return cpostCases({ action: "client", client: MEM.clientKey }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "That client is not here.", true); return; }
      var list = j.assignments;
      var pick = list.filter(function (c) { return c.id === MEM.caseId; })[0] || list[list.length - 1] || null;
      MEM.caseId = pick ? pick.id : null;
      return (pick ? cpostCases({ action: "case", id: pick.id }) : Promise.resolve(null)).then(function (k) {
        settle(function () { trClientPage(j, k && k.ok ? k.case : null); });
      });
    }).catch(function (e) { if (String(e.message) !== "sign in") { clear(); say("Could not reach the server.", true); } });
  }

  function trCrumb(parts) {
    var crumb = el("div", "crumb");
    parts.forEach(function (p, i) {
      if (i) crumb.appendChild(el("span", null, "›"));
      if (p[1]) { var a = el("button", "textlink", p[0]); a.type = "button"; a.addEventListener("click", p[1]); crumb.appendChild(a); }
      else crumb.appendChild(el("span", "here", p[0]));
    });
    page.appendChild(crumb);
  }

  function trClientPage(j, c) {
    var cl = j.client;
    trCrumb([["Track Record", function () { memGo("lib"); }], [cl.name]]);
    var head = pageBand(cl.name, trAdd(cl.key), [cl.industry, cl.size, cl.past ? "Past client" : cl.archived ? "Ended" : ""].filter(Boolean).join(" · "), null);
    head.classList.add("trband");
    head.insertBefore(csLogo(cl), head.firstChild);
    var said = el("p", "err"); said.hidden = true;
    page.appendChild(said);

    if (!j.assignments.length) {
      var none = el("div", "empty");

  /* The assignments as bars on one strip of months, from the first start to
     the last end (or this month, for one still running). Months are the
     registry's own 'YYYY-MM', so nothing here is placed by guessing. */
  function trTimeline(list) {
    var box = el("div", "trtl");
    var now = ym(thisMonth()), idx = function (p) { return p.y * 12 + p.m; };
    var starts = list.map(function (c) { return ym(c.started); }).filter(Boolean);
    if (!starts.length) return box;
    var lo = Math.min.apply(null, starts.map(idx));
    var hi = Math.max.apply(null, list.map(function (c) { var e = ym(c.ended); return e ? idx(e) : idx(now); }).concat([lo]));
    var span = hi - lo + 1;
    var bars = el("div", "trbars");
    list.forEach(function (c) {
      var a = ym(c.started); if (!a) return;
      var e = ym(c.ended), end = e ? idx(e) : idx(now);
      var bar = el("button", "trbar " + (c.kind || "planning") + (e ? "" : " open"));
      bar.type = "button";
      bar.style.left = ((idx(a) - lo) / span * 100) + "%";
      bar.style.width = (Math.max(1, end - idx(a) + 1) / span * 100) + "%";
      bar.textContent = (TYPE_WORD[c.kind] || "Planning") + " · " + c.name + (e ? "" : " (running)");
      bar.title = bar.textContent + " · " + spanWord(c.started, c.ended);
      bar.addEventListener("click", function () { MEM.caseId = c.id; drawClientPage(true); });
      bars.appendChild(bar);
    });
    box.appendChild(bars);
    var ticks = el("div", "trticks");
    var mid = Math.floor((lo + hi) / 2);
    [lo, mid, hi].filter(function (v, i, all) { return all.indexOf(v) === i; }).forEach(function (v) {
      ticks.appendChild(el("span", null, MONTHS[v % 12] + " " + Math.floor(v / 12)));
    });
    box.appendChild(ticks);
    return box;
  }

  /* ── Picking an assignment: to write it up, or to add learnings to it ──

  function trPickers(j, onChange) {

    j.cases.forEach(function (c) { (withAsg[c.client.key] = withAsg[c.client.key] || { client: c.client, list: [] }).list.push(c); });
    var keys = Object.keys(withAsg).sort(function (a, b) { return withAsg[a].client.name.localeCompare(withAsg[b].client.name); });
    var cb = el("div"); cb.appendChild(labFor("tr-p-client", "Client"));
    var cs = el("select", "fld"); cs.id = "tr-p-client";
    keys.forEach(function (k) { var o = el("option", null, withAsg[k].client.name); o.value = k; cs.appendChild(o); });
    if (MEM.pickClient && withAsg[MEM.pickClient]) cs.value = MEM.pickClient;
    cb.appendChild(cs); pair.appendChild(cb);
    var ab = el("div"); ab.appendChild(labFor("tr-p-asg", "Assignment"));
    var as = el("select", "fld"); as.id = "tr-p-asg";
    ab.appendChild(as); pair.appendChild(ab);
    var fill = function () {
      as.textContent = "";
      var g = withAsg[cs.value];

    };

    as.addEventListener("change", function () { MEM.pickCase = as.value; onChange(); });
    var pickedCase = function () { var g = withAsg[cs.value]; return g ? g.list.filter(function (c) { return c.id === as.value; })[0] || null : null; };
    return { node: pair, empty: !keys.length, picked: pickedCase };

  /* The timeline as a strip of months, each stage a bar under them — where
     the stage's own words name months inside the work's span. A stage whose
     words do not (or a span over two years) is drawn as a line instead:
     nothing is placed by guessing (§35). */
  function csTimeline(c) {
    var box = el("div", "tl");
    var a = ym(c.started), b = ym(c.ended);
    var span = a && b ? (b.y - a.y) * 12 + (b.m - a.m) + 1 : 0;
    var months = [];
    if (span > 0 && span <= 24) for (var i = 0; i < span; i++) months.push({ y: a.y + Math.floor((a.m + i) / 12), m: (a.m + i) % 12 });
    var find = function (word, year) {
      var k = MONTHS.map(function (x) { return x.toLowerCase(); }).indexOf(String(word).slice(0, 3).toLowerCase());
      if (k < 0) return -1;
      for (var j = 0; j < months.length; j++) if (months[j].m === k && (!year || months[j].y === +year)) return j;
      return -1;
    };
    if (months.length) {
      box.style.setProperty("--m", String(months.length));
      var head = el("div", "tlm");
      months.forEach(function (p) { head.appendChild(el("span", null, MONTHS[p.m])); });
      box.appendChild(head);
    }
    c.stages.forEach(function (s, idx) {
      var row = el("div", "tls");
      var lb = el("span", "lb", s.what);
      if (s.when) lb.appendChild(el("small", null, s.when));
      row.appendChild(lb);
      var m = /([A-Za-z]{3,})\.?(?:\s+(\d{4}))?(?:\s*[–—-]\s*([A-Za-z]{3,})\.?(?:\s+(\d{4}))?)?/.exec(s.when || "");
      var from = m ? find(m[1], m[2]) : -1, to = m && m[3] ? find(m[3], m[4]) : from;
      if (months.length && from >= 0 && to >= from) {
        var bar = el("div", "tlbar");
        var i2 = el("i", idx === c.stages.length - 1 ? "end" : null);
        i2.style.gridColumn = (from + 1) + " / " + (to + 2);
        bar.appendChild(i2);
        row.appendChild(bar);
      }
      box.appendChild(row);
    });
    return box;
  }

  function fileType(name) {
    var x = (String(name || "").match(/\.([A-Za-z0-9]{2,5})$/) || [, ""])[1].toLowerCase();
    return { pdf: ["PDF", "pdf"], ppt: ["PPT", "ppt"], pptx: ["PPTX", "ppt"], xls: ["XLS", "xls"], xlsx: ["XLSX", "xls"],
             csv: ["CSV", "xls"], doc: ["DOC", ""], docx: ["DOCX", ""], zip: ["ZIP", ""] }[x] || [x ? x.toUpperCase() : "—", ""];
  }

  /* ── The interview ─────────────────────────────────────────────────── */
  function csPrompt(c) {

    return "I am writing up a " + (TYPE_WORD[c.kind] || "Planning") + " assignment my consulting firm finished, for its Track Record. " +
      "It will be read by consultants who have just joined and were not there.\n\n" +
      "  Client:    " + c.client.name + (c.client.industry ? " (" + c.client.industry + ")" : "") + "\n" +
      "  The work:  " + c.name + " (" + (TYPE_WORD[c.kind] || "Planning") + ")\n" +
      (spanLong(c.started, c.ended) ? "  When:      " + spanLong(c.started, c.ended) + "\n" : "") +
      (c.lead ? "  Lead:      " + c.lead.name + "\n" : "") +
      (team ? "  Our team:  " + team + "\n" : "") + "\n" +
      "Interview me. Ask ONE question at a time and wait for my answer before asking the next one. " +
      "Push back when my answer is vague, and do not move on until it would make sense to somebody who was not there.\n\n" +
      "Ask me about, in this order:\n" +
      "  · the client, and why they came to us\n" +
      "  · what we were asked to do\n" +
      "  · the client's people we worked with, and the role of each\n" +
      "  · the main stages of the work, with the month of each\n" +
      "  · every deliverable: its name, what it was, the month we handed it over\n" +
      "  · what came of it\n" +
      "  · for each of us on the team, what a new joiner should ask them about\n" +
      "  · and last, one paragraph a new joiner should read first\n\n" +
      "Then ask what went better than expected, what cost us time, what I know now that I did not at the start, " +
      "and what I would warn the next consultant about. For each, ask what happened, what we did, what came of it, " +
      "and what the next person should know.\n\n" +
      "When I say I am done, write it back in exactly this shape and nothing else:\n\n" +
      "=== IN SHORT\n=== THE CLIENT AND WHY THEY CAME TO US\n=== WHAT WE WERE ASKED TO DO\n" +
      "=== THEIR TEAM            (one line each: name · role)\n=== TIMELINE              (one line each: month · stage)\n" +
      "=== DELIVERABLES          (one line each: name · what it was · month)\n=== WHAT CAME OF IT\n" +
      "=== WHO TO ASK            (one line each: name · what to ask them about)\n\n" +
      "and then each learning as a block:\n\n===\nKIND: hiccup | practice | lesson\nTITLE: one line, the thing itself\n" +
      "WHEN: the month\nWHAT HAPPENED: ...\nWHAT WE DID: ...\nWHAT CAME OF IT: ...\nWHAT THE NEXT PERSON SHOULD KNOW: ...\n===\n\n" +
      "Use my words, not yours. If I only half answered something, leave that line out rather than filling it in.";
  }

  /* THE HEAD OF THE WRITE-UP'S TWO PAGES: where you are, the assignment's
     name and type, and what the registry says about it — which is what the

     none. The draft is redrawn from the server's own answer. */
  function csSave(c, said, then, failed) {
    var d = CS.draft;
    said.hidden = true;
    var body = { action: "save", id: c.id,
                 inShort: d.inShort, clientWhy: d.clientWhy, askedToDo: d.askedToDo, cameOfIt: d.cameOfIt,
                 ourTeam: d.ourTeam.map(function (p) { return { id: p.id, role: p.role }; }),
                 theirTeam: d.theirTeam, stages: d.stages, deliverables: d.deliverables, whoToAsk: d.whoToAsk };
    var fail = function (msg) { said.textContent = msg; said.hidden = false; window.scrollTo(0, 0); if (failed) failed(); };
    return cpostCases(body).then(function (r) {
      if (!r || !r.ok) { fail((r && r.error) || "It could not be saved."); return; }
      var pend = (CS.pending || []).filter(function (e) { return e.title && e.title.trim(); });
      if ((CS.pending || []).length > pend.length) { fail("Give every learning a title, or drop it, before saving."); return; }
      return (pend.length ? cpostCases({ action: "insights", id: c.id, entries: pend }) : Promise.resolve({ ok: true })).then(function (k) {
        if (!k || !k.ok) { fail((k && k.error) || "The learnings could not be saved."); return; }
        CS.pending = null; CS.read = null;
        CS.draft = csDraftFrom(r.case);

        var y = window.scrollY;
        settle(function () { csDraftPage(r.case, CS.draft); });
