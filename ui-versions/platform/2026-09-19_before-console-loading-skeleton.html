      var save = el("button", "btn amber", "Save all " + drafts.length);
      save.type = "button";
      right.appendChild(back); right.appendChild(save);
      title("What came back", right);

      if (!drafts.length) {
        page.appendChild(el("p", "muted", "Nothing left to save — go back and paste it again."));
        return;
      }

      /* THE COUNT AND THE ROWS ARE ONE LIST (§108.1): what was read and what
         was not are said separately, because four found over three that
         parsed is the badge people report as a bug. */
      var read = drafts.filter(function (x) { return !x.raw; }).length;
      var raw = drafts.length - read;
      var found = el("p", "found");
      var b = el("b", null, read + (read === 1 ? " insight read" : " insights read"));
      found.appendChild(b);
      found.appendChild(document.createTextNode(
        (raw ? ", and " + raw + (raw === 1 ? " block it could not" : " blocks it could not") : "") +
        " · " + (clientNameOf(d.client) || d.client) + (periodOf(d) ? " · " + periodOf(d) : "")));
      var sp = el("span", "sp");
      KINDS.forEach(function (k) {
        var n = drafts.filter(function (x) { return !x.raw && x.kind === k[0]; }).length;
        if (n) sp.appendChild(el("span", "tag " + k[0], n + " " + (n === 1 ? k[1].toLowerCase() : k[1].toLowerCase() + "s")));
      });
      found.appendChild(sp);
      page.appendChild(found);

      var list = el("div", "drafts");
      drafts.forEach(function (dr) { list.appendChild(draftCard(dr, drafts, list)); });
      page.appendChild(list);

      save.addEventListener("click", function () {
        var missing = -1;
        for (var i = 0; i < drafts.length; i++) if (!String(drafts[i].title || "").trim()) { missing = i; break; }
        if (missing >= 0) { say("Give number " + (missing + 1) + " a title before saving.", true); return; }
        save.disabled = true;
        mpost({ action: "saveMany", client: d.client, entries: drafts }).then(function (r) {
          save.disabled = false;
          if (!r || !r.ok) { say((r && r.error) || "They could not be saved.", true); return; }
          memGo("list", { deb: null, drafts: null });
        });
      });
    });
  }

  function clientNameOf(key) {
    return (MEM.deb && MEM.deb.client === key && MEM.deb.clientName) || (MEM.clientNames || {})[key] || key;
  }
  function periodOf(d) {
    var f = String(d.from || "").trim(), t = String(d.to || "").trim();
    return f && t ? f + " to " + t : (f || t || "");
  }

  /* A DRAFT EDITS IN PLACE AND NOTHING REPAINTS (§71.2): these boxes are being
     read and corrected, and a repaint under a working hand is how half a
     correction disappears. Only DROP redraws, because a row leaving changes
     the count above it. */
  function draftCard(dr, drafts, list) {
    var card = el("article", "dcard" + (dr.raw ? " raw" : ""));
    if (dr.raw) card.appendChild(el("p", "rawnote",
      "This one did not come back in the shape the prompt asked for — check it, or save it as it stands."));
    var head = el("div", "dhead");
    var ksel = el("select", "fld");
    ksel.setAttribute("aria-label", "Kind");
    KINDS.forEach(function (k) {
      var op = el("option", null, k[1]);
      op.value = k[0];
      if (k[0] === dr.kind) op.selected = true;
      ksel.appendChild(op);
    });
    ksel.addEventListener("change", function () { dr.kind = ksel.value; });
    head.appendChild(ksel);
    var tfld = el("input", "fld");
    tfld.type = "text";
    tfld.setAttribute("aria-label", "Title");
    tfld.value = dr.title || "";
    if (!dr.title) tfld.placeholder = "Give it a title";
    tfld.addEventListener("change", function () { dr.title = tfld.value; });
    head.appendChild(tfld);
    var drop = el("button", "btn drop", "Drop");
    drop.type = "button";
    drop.addEventListener("click", function () {
      var at = drafts.indexOf(dr);
      if (at >= 0) drafts.splice(at, 1);
      drawDrafts();
    });
    head.appendChild(drop);
    card.appendChild(head);

    QS.forEach(function (q) {
      var box = el("div", "dq");
      box.appendChild(el("label", "lab", q[1]));
      var ta = el("textarea", "fld");
      ta.value = dr[q[0]] || "";
      ta.addEventListener("change", function () { dr[q[0]] = ta.value; });
      box.appendChild(ta);
      card.appendChild(box);
    });
    return card;
  }

  /* ── Clients ─────────────────────────────────────────────────── */
  function drawClients() {
    /* ── WHY A CLIENT SENT THEM BACK HERE (§313.32) ──────────────────
       A client whose register cannot place this account refuses and lands
       them on the cards, because the cards are beside the configuration that
       answers it. Said BEFORE the title, so it is the first thing read rather
       than a line under a grid of cards; taken once and cleared, or it would
       reappear on every visit long after the mapping was corrected. */
    var why = null;
    try {
      why = sessionStorage.getItem("smp.client.why");
      if (why) sessionStorage.removeItem("smp.client.why");
    } catch (e) { /* no storage is simply no sentence */ }
    if (why) say(why, true);

    /* Made here and appended after the title, so the search's own handler
       closes over the element it filters rather than over a hoisted blank.

       AND IT IS NAMED. The band below it is a card grid too and rightly wears
       the same `.cards` rule (§53.5), so a selector reading `.cards` reaches
       both — which is how something written later comes to mean "the client
       grid" and quietly include the worked example. `data-grid` is what a
       check or a rule addresses; the class stays about the layout. The new
       check's own first run found this, by going red on it. */
    var grid = el("div", "cards");
    grid.dataset.grid = "clients";

    var right = el("div");
    var search = el("input", "fld");
    search.placeholder = "Search clients"; search.style.width = "190px";
    /* TYPING NEVER REPAINTS (constitution XV): the cards are hidden in place.
       SCOPED TO THE CLIENT GRID (§317): the box says "Search clients", so with
       the worked example out of that grid it is no longer among the things it
       searches. That is a change and it is the honest one — today typing
       "demo" finds it. */
    search.addEventListener("input", function () {
      var q = search.value.trim().toLowerCase();
      Array.prototype.forEach.call(grid.querySelectorAll(".ccard[data-name]"), function (c) {
        c.hidden = !!q && c.dataset.name.indexOf(q) < 0;
      });
    });
    right.appendChild(search);
    title("Clients", right);

    page.appendChild(grid);
    grid.appendChild(el("p", "muted", "Reading your clients…"));

    /* THE BOOT'S OWN ANSWER, ONCE (§369). The boot asks `cards` to learn what
       the navigation may offer, and this asked the identical question again a
       round trip later — the heaviest question in the page, which opens a
       connection per client to read its units, its plan and its cycle. Handed
       over rather than asked twice.
       IT IS ONE-SHOT AND MUST BE: `go("clients")` is pressed from six other
       places — after adding a client, on the way back out of one, after
       archiving — and every one of those has to read the list AGAIN, or the
       grid draws a client that has just been archived (§48.2: a value is read
       at press time, never trusted from the render that drew the button). */
    var handed = BOOTCARDS; BOOTCARDS = null;
    (handed ? Promise.resolve(handed) : post({ action: "cards" })).then(function (j) {
      grid.textContent = "";
      if (!j.ok) { say(j.error || "Could not read your clients.", true); return; }
      /* ── THE WAY IN IS DRAWN WHEN THERE IS NOTHING (§313.18, §61) ──
         This RETURNED on an empty list, before the Add card was appended — so
         the one person who can create a client was the one shown a dead end,
         and the sentence it showed them said to ask the platform's super
         user, which is who they are. §61's trap in its purest form: the only
         way to get a client is to add one, and the control that adds one was
         hidden precisely when there were none.

         AND THE EMPTY STATE SAYS WHAT THIS READER CAN DO ABOUT IT. Somebody
         who may add one is told to; somebody who may not is told who to ask.
         A refusal names the place that can fix it (§16.7), and for these two
         people that is not the same place. */
      /* ── THE WORKED EXAMPLE IS NOT ONE OF THE CLIENTS (§317) ────────
         Split by what the tenant IS, never by its name: `kind` is the
         column the server already sorts on, and a key spelled "demo" is a
         client's key like any other. Everything else about it is unchanged
         — same card, same amber, same Demo tag, same door. */
      var clients = j.cards.filter(function (c) { return c.kind !== "demo"; });
      var demos = j.cards.filter(function (c) { return c.kind === "demo"; });

      clients.forEach(function (c) { grid.appendChild(cardFor(c)); });
      if (j.canAdd) grid.appendChild(addCard());
      /* AND THE COUNT IS A COUNT OF CLIENTS. It read `j.cards.length`, which
         includes the demo — so on a platform seeded with the worked example
         and no clients, the sentence below never drew and the one person who
         could add one was shown a single amber card and no way in: §61's
         trap the empty state was written to close, by a road it did not
         cover. */
      if (!clients.length) {
        say(j.canAdd
          ? "No clients yet. Add the first one — it is created with its own name and nothing else."
          : "No client has been given to this account yet. Ask the platform's super user.");
      }

      /* Drawn only when there is one (§61): a heading over an empty band is
         furniture, and a platform with no demo seeded has nothing to say. */
      if (demos.length) {
        var apart = el("div", "apart");
        apart.appendChild(el("span", "akey", "The worked example"));
        var dgrid = el("div", "cards");
        demos.forEach(function (c) { dgrid.appendChild(cardFor(c)); });
        apart.appendChild(dgrid);
        page.appendChild(apart);
      }

      /* ── ARCHIVED CLIENTS (§323) ────────────────────────────────────
         The page's OWN band — the one the worked example sits in — rather
         than a second answer to "a row under the grid" (§53.5).

         A CLIENT THAT SIMPLY VANISHED COULD NEVER COME BACK: the only route
         would be through a card that is no longer drawn (§61). That is the
         whole reason this band exists, and it is also where Delete becomes
         reachable, so being archived is a real step rather than a hidden
         state.

         Drawn only when there is one, like the band above it: a heading over
         an empty band is furniture, and a platform with nothing archived has
         nothing to say. The server has already decided WHO sees this — it
         sends the list only to somebody who can bring one back, so there is
         no second answer here (§42). */
      if (j.archived && j.archived.length) {
        var arch = el("div", "apart");
        arch.appendChild(el("span", "akey", "Archived"));
        var agrid = el("div", "cards");
        agrid.dataset.grid = "archived";
        j.archived.forEach(function (c) { agrid.appendChild(archCardFor(c)); });
        arch.appendChild(agrid);
        page.appendChild(arch);
      }
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      grid.textContent = ""; say("Could not reach the server.", true);
    });
  }

  /* ONLY THE ROWS OPEN (§320.3, spec 046 §4.6a). Islam, of two behaviours
     drawn side by side: "2" — the card's name is not pressable and every way
     into a client names a module, so there is never a question of which one
     the top would open. The card is a DIV holding two things: the identity
     block, and a button per module this client has.

     THE MODULE'S OWN STATE MOVED OUT OF THE FOOT WITH IT. `cycle open`,
     `no plan yet` and `not answering` are all Strategy's answers about this
     client, so with a Strategy row to carry them the foot would have said
     each twice (§87). The seat, the unit count and Demo stay: they are the
     client's and the spine's, not a module's.

     The rows come from the server (lib/modules.ts moduleRows), so the console
     cannot spell a module differently from the switch or from Setup. */
  function cardFor(c) {
    var b = el("div", "ccard" + (c.kind === "demo" ? " demo" : "") + (c.canOpen ? "" : " listed"));
    b.dataset.client = c.key;
    b.dataset.name = String(c.name + " " + (c.industry || "")).toLowerCase();
    var top = el("div", "ctop");
    if (c.mark) {
      var im = el("img", "cmark"); im.src = c.mark; im.alt = ""; top.appendChild(im);
    } else {
      top.appendChild(el("div", "cmark", initials(c.name)));
    }
    top.appendChild(el("h2", null, c.name));
    if (c.industry) top.appendChild(el("p", "ind", c.industry));
    var foot = el("div", "foot");
    var tag = function (t, cls) { foot.appendChild(el("span", "tag" + (cls ? " " + cls : ""), t)); };
    if (c.kind === "demo") tag("Demo", "demo");
    /* THE SEAT IS WHAT THIS CARD SAYS ABOUT THIS PERSON — the thing they came
       to know, and the thing that decides what they can do when they arrive. */
    if (c.seat) tag(c.seat === "super" ? "Super user" : "SMO team", "seat");
    if (c.units != null && c.units > 0) tag(c.units + (c.units === 1 ? " unit" : " units"));
    if (!c.canOpen) tag("Listed only");
    top.appendChild(foot);
    b.appendChild(top);

    /* A CLIENT THIS PERSON MAY NOT OPEN GETS NO ROWS AT ALL — there is no way
       in, so there is nothing to draw (§61); "Listed only" already says it. */
    if (c.canOpen && c.modules && c.modules.length) {
      var mods = el("div", "mods");
      c.modules.forEach(function (m) {
        var r = el("button", "mrow");
        r.type = "button";
        r.dataset.module = m.key;
        r.appendChild(document.createTextNode(m.label));
        /* THE MARK (§368): what this module says is OUTSTANDING on this
           client, in the fewest words, and NOTHING when nothing is — which
           is where the compactness comes from. It replaces the pair that
           was here, a full sentence (the client's chosen landing line) and
           the card's own health word, which on a running cycle said the
           same fact twice and could not fit on one line.
           Both come from the server (lib/modules.ts), so the page decides
           nothing: `alarm` is the module's own word for *broken rather than
           busy* and `tip` is the whole sentence for the hover. */
        if (m.mark) {
          var mk = el("i", m.alarm ? "alarm" : "due", m.mark);
          if (m.tip) mk.title = m.tip;
          r.appendChild(mk);
        }
        /* A LIBRARY'S ROW OPENS THE ROOM WE PUBLISH FROM, not the client's
           own page (spec 053; the flag is the server's, lib/modules.ts). The
           client's read-only library is one press further in, from there —
           this is the one module whose work is on our side, and landing a
           consultant on the page where they can do nothing would be §61 with
           the sign reversed. */
        r.addEventListener("click", function () {
          if (m.room) return drawLibrary(c.key, m.key, c.name, m.label);
          location.assign("/" + c.key + "/" + m.key);
        });
        mods.appendChild(r);
      });
      b.appendChild(mods);
    }

    if (c.canConfig) {
      var cog = el("span", "ccfg", "Settings");
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      /* THE CLIENT'S OWN SETUP RAIL (§360, spec 057): one press into the
         client at /<client>/setup, in its own chrome — Getting started at the
         top of that rail until it is done, the register and the organisation
         under it. Nothing between the card and the client. */
      var open = function (e) { e.stopPropagation(); e.preventDefault(); location.assign("/" + c.key + "/setup"); };
      cog.addEventListener("click", open);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") open(e); });
      b.appendChild(cog);
    }
    return b;
  }

  /* ── AN ARCHIVED CLIENT'S CARD (§323) ──────────────────────────────
     Everything the live card says about a client is about a client somebody
     is working in — a seat, a cycle, a count of units — and none of it is
     true of one that has been set aside, so this says the two things that
     ARE: when it was archived and who did it. A card that carried the live
     tags would read as a client you could still open.

     IT HAS NO DOOR. Their address is already closed, so a press that
     navigated there would land on "that client is not available" — §61 from
     the other side: a control that leads somewhere refusing is worse than no
     control. `disabled` because there is nothing behind it, not for the look.

     AND THE DATE IS THE READER'S, never the database's spelling: an ISO
     timestamp is a fact about storage. An unreadable or missing one says
     nothing at all rather than printing "Invalid Date" (§35, §15.1). */
  function archDate(v) {
    if (!v) return "";
    var d = new Date(v);
    if (isNaN(d.getTime())) return "";
    try {
      return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    } catch (e) { return ""; }
  }

  function archCardFor(c) {
    var b = el("button", "ccard arch");
    b.type = "button";
    b.disabled = true;
    b.dataset.client = c.key;
    b.dataset.arch = "1";
    if (c.mark) {
      var im = el("img", "cmark"); im.src = c.mark; im.alt = ""; b.appendChild(im);
    } else {
      b.appendChild(el("div", "cmark", initials(c.name)));
    }
    b.appendChild(el("h2", null, c.name));
    if (c.industry) b.appendChild(el("p", "ind", c.industry));
    var foot = el("div", "foot");
    var when = archDate(c.at);
    foot.appendChild(el("span", "tag arch", when ? "Archived " + when : "Archived"));
    if (c.by) {
      var who = el("span", "tag arch", c.by);
      who.title = "Archived by " + c.by;   /* clipped above, so the whole of it is here */
      foot.appendChild(who);
    }
    b.appendChild(foot);

    /* TWO CONTROLS, AND THE SECOND IS WHY THE FIRST IS NOT ENOUGH.
       Bring back is the ordinary thing to want from this band, so it is here
       rather than three presses away. Settings is the ONLY route to Deleting
       — that block lives on an archived client and nowhere else — so a card
       carrying Bring back alone would put the one irreversible act behind a
       screen with no door to it (§61). The check for this file found that by
       going red on it.

       Bring back is ONE function shared with the block inside (§53.5), never
       a second copy of the request. */
    if (c.canConfig) {
      var acts = el("div", "cacts");
      var back = el("span", "cback", "Bring back");
      back.setAttribute("role", "button"); back.tabIndex = 0;
      var go = function (e) { e.stopPropagation(); e.preventDefault(); bringBack(c.key, c.name); };
      back.addEventListener("click", go);
      back.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") go(e); });
      acts.appendChild(back);

      var cog = el("span", "ccfg", "Settings");
      cog.setAttribute("role", "button"); cog.tabIndex = 0;
      /* ON THIS PAGE, not the client's (§360): an archived client's address
         is closed, so its two acts — bringing it back and deleting it — are
         the one screen the console still draws for a client. */
      var open = function (e) { e.stopPropagation(); e.preventDefault(); drawArchived(c.key); };
      cog.addEventListener("click", open);
      cog.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") open(e); });
      acts.appendChild(cog);
      b.appendChild(acts);
    }
    return b;
  }

  /* ONE REQUEST, BOTH DIRECTIONS AND BOTH SURFACES (§53.5): the band's Bring
     back and the block's Bring back are this, and the block's Archive is this
     with `on` true. A refusal is SAID — a control that silently does nothing
     is the shape this project keeps recording (§32, §171). */
  function setArchived(key, on) {
    return post({ action: "archiveClient", key: key, on: !!on });
  }
  function bringBack(key, name) {
    setArchived(key, false).then(function (j) {
      if (!j.ok) { say(j.error || "Could not bring " + name + " back.", true); return; }
      /* `go("clients")`, NEVER `drawClients()` — the first build called the
         renderer directly and `drawClients` does not CLEAR the page, so it
         appended a whole second copy underneath the first and the Archived
         band the press had just emptied was still sitting there, above a grid
         that now held the client twice. §100.2's family: whoever redraws a
         page is the one that clears it, and on this page that is `go`. Found
         by the check going red on "the band is gone" while every assertion
         about the grid passed. */
      go("clients");
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      say("Could not reach the server.", true);
    });
  }

  function addCard() {
    var b = el("button", "ccard add", "+ Add a client");
    b.type = "button";
    b.addEventListener("click", function () { drawNewClient(); });
    return b;
  }

  /* ── SETTING A CLIENT UP IS INSIDE THE CLIENT NOW (§360, spec 057) ───
     Islam: *"the client either we open a module or we go to the client
     settings page where we find a rail with the client settings"* — and, of
     which chrome draws that rail, "A": the client platform's own Setup.
     So Settings on a card OPENS /<client>/setup, and the flow that lived
     here for §322–§352 is client-setup.js, served at /client-setup.js and
     mounted by the platform on its Getting started page. §322's reason for
     the outside flow is kept whole — Settings is still pressed from here
     before anybody at the client has signed in — only the chrome changed.

     TWO PIECES STAY ON THIS PAGE, from that same module, because a client's
     own address cannot draw them: creating a client, which has no address
     until it exists (the first step, then straight into the client's own
     Getting started), and ending an archived one, whose address is closed
     (§323: bring back and delete, from the archived band's Settings). */
  function drawNewClient(){
    clear();
    var right = el("div");
    var leave = el("button", "btn", "Cancel");
    leave.type = "button";
    leave.addEventListener("click", function () { go("clients"); });
    right.appendChild(leave);
    title("Add a client", right);
    var host = el("div", "csetup");
    page.appendChild(host);
    CLIENTSETUP.mountCreate(host, { door: "/" });
  }

  /* ════ THE DOCUMENT ROOM (spec 053) ══════════════════════════════════
     Where a client's library is published from. Forefront's side of Insights
     and Processes — the client's own page reads, and this is the only place
     anything is written (spec 046 decision #9).

     ONE SCREEN AND ONE CARD, which is what the mockup Islam signed off draws
     (design-mockups/insights/2026-09-13_…): a list you search, and one report
     open. There is no third view, because the only things you do to a report
     are edit it, publish it and take it back.

     EVERY RULE IS THE SERVER'S. The buttons drawn here are what somebody may
     press; whether a press lands is asked again when it does (§42, §48.2), so
     a stale page can be wrong about what is offered and never about what
     happens. */
  var LIB = { key: "", kind: "insights", client: "", label: "", items: null, cats: [],
              one: null, q: "", cat: "", state: "", busy: false };

  function drawLibrary(key, kind, client, label) {
    LIB.key = key; LIB.kind = kind; LIB.client = client; LIB.label = label || "Library";
    LIB.one = null; LIB.q = ""; LIB.cat = ""; LIB.state = "";
    return loadLibrary(false);
  }

  function loadLibrary(quiet) {
    lead(quiet, "Reading…");
    return post({ action: "library", key: LIB.key, kind: LIB.kind,
                  q: LIB.q, category: LIB.cat, state: LIB.state }).then(function (j) {
      if (!j || !j.ok) { clear(); return say((j && j.error) || "That library could not be read.", true); }
      LIB.items = j.items || [];
      LIB.cats = j.categories || [];
      /* THIS CLIENT'S OWN UNITS AND FUNCTIONS, for the ticking panel. They
         ride the list's answer rather than a second request, so the panel
         never opens onto a list it is still waiting for (§45.2). */
      LIB.places = j.places || [];
      /* Reading one keeps it open across a refresh, so publishing a report
         does not throw you back to the list you were working in (§71.2). */
      if (LIB.one) {
        var still = LIB.items.filter(function (x) { return x.id === LIB.one.id; })[0];
        LIB.one = still || null;
      }
      settle(LIB.one ? paintOneReport : paintLibrary);
    });
  }

  /* THE PLACES A STORED LIST NAMES, in words. A key the client no longer has
     — a unit retired since the report was narrowed — is drawn as the KEY
     rather than dropped: it is still doing work in the stored row, and a list
     that quietly showed two names for three entries would be lying about
     who can read it (§35, §96.2). */
  function seenNames(seen) {
    return (seen || []).map(function (at) {
      var hit = (LIB.places || []).filter(function (p) { return p.at === at; })[0];
      return hit ? hit.label : at;
    });
  }

  /* The fact line, one place, so the list and the card cannot say a report's
     size one way and its date another. */
  function factsOf(it) {
    var bits = [];
    if (it.categories && it.categories.length) bits.push(it.categories.join(" · "));
    if (it.reportDate) bits.push(it.reportDate);
    bits.push("v" + it.version);
    if (it.sizeLabel) bits.push(it.sizeLabel);
    bits.push(it.state === "published"
      ? it.downloads + (it.downloads === 1 ? " download" : " downloads")
      : "not published");
    return bits.join(" · ");
  }

  function libraryHead(where) {
    var t = el("div", "ptitle");
    var back = el("button", "btn", "‹ Clients");
    back.type = "button";
    back.addEventListener("click", function () { go("clients"); });
    t.appendChild(back);
    t.appendChild(el("h1", null, LIB.label));
    t.appendChild(el("span", "tag", LIB.client));
    var right = el("span", "right");
    if (where === "list") {
      var add = el("button", "btn solid", "Publish a report");
      add.type = "button";
      add.addEventListener("click", function () {
        LIB.one = { id: "", title: "", summary: "", categories: [], reportDate: "",
                    state: "draft", version: 1, fileName: "", sizeLabel: "", downloads: 0, hasFile: false };
        settle(paintOneReport);
      });
      right.appendChild(add);
    }
    t.appendChild(right);
    return t;
  }

  function paintLibrary() {
    page.appendChild(libraryHead("list"));

    var f = el("div", "filters");
    var q = el("input", "fld search"); q.type = "search"; q.placeholder = "Search reports…"; q.value = LIB.q;
    /* Typing does not refetch on every keystroke; Enter and the blur do
       (§35 — a list that rebuilds under a typing hand is the fault §71.2
       names, and this one costs a round trip as well). */
    var run = function () { if (q.value !== LIB.q) { LIB.q = q.value; loadLibrary(true); } };
    q.addEventListener("change", run);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); run(); } });
    f.appendChild(q);

    var cat = el("select", "fld");
    [["", "Every category"]].concat(LIB.cats.map(function (c) { return [c, c]; })).forEach(function (o) {
      var op = el("option", null, o[1]); op.value = o[0]; if (LIB.cat === o[0]) op.selected = true; cat.appendChild(op);
    });
    cat.addEventListener("change", function () { LIB.cat = cat.value; loadLibrary(true); });
    f.appendChild(cat);

    var st = el("select", "fld");
    [["", "Published and drafts"], ["published", "Published"], ["draft", "Drafts"]].forEach(function (o) {
      var op = el("option", null, o[1]); op.value = o[0]; if (LIB.state === o[0]) op.selected = true; st.appendChild(op);
    });
    st.addEventListener("change", function () { LIB.state = st.value; loadLibrary(true); });
    f.appendChild(st);

    f.appendChild(el("span", "count", LIB.items.length + (LIB.items.length === 1 ? " report" : " reports")));
    page.appendChild(f);

    if (!LIB.items.length) {
      /* THREE EMPTY STATES AND NOT ONE (§105's rule): an empty state
         describes THIS filter, never the whole library. */
      var why = (LIB.q || LIB.cat || LIB.state)
        ? "No reports match. Try clearing the search, or a different category."
        : "Nothing has been published to " + LIB.client + " yet. Press “Publish a report” to put the first one up.";
      page.appendChild(el("p", "muted", why));
      return;
    }

    var list = el("div", "elist");
    LIB.items.forEach(function (it) {
      var r = el("button", "erow"); r.type = "button";
      var body = el("span", "body");
      body.appendChild(el("h3", null, it.title));
      if (it.summary) body.appendChild(el("p", "snip", it.summary));
      body.appendChild(el("span", "facts", factsOf(it)));
      r.appendChild(body);
      /* ONLY A DRAFT CARRIES A TAG. Published is the normal case, and marking
         it would spend the page's accent on the state that needs no attention
         (§41's budget, and the mockup's own note). */
      if (it.state !== "published") r.appendChild(el("span", "tag none", "Draft"));
      /* AND WHO MAY SEE IT, BY THE SAME RULE (spec 046 §4.10): only the
         exception carries a mark, so a report everybody can see wears
         nothing. The words are the SERVER's (`seenLabel`), so the list and
         the card cannot describe one report's reach two ways.

         IT TAKES NO ACCENT, and that was found by drawing it: amber beside
         the amber Draft tag put two meanings in one colour in one slot
         (§87's twins, §41's budget). Nobody keeps an alarm, because a
         published report nobody can open is the one state here that is
         genuinely wrong-looking. The names go on the hover — the row has no
         width for three of them without taking a second line (§88). */
      if (it.seenLabel) {
        var lim = el("span", it.seen && !it.seen.length ? "tag shut" : "tag", it.seenLabel);
        if (it.seen && it.seen.length) lim.title = seenNames(it.seen).join(" · ");
        r.appendChild(lim);
      }
      r.addEventListener("click", function () { LIB.one = it; settle(paintOneReport); });
      list.appendChild(r);
    });
    page.appendChild(list);
  }

  /* ── ONE REPORT ───────────────────────────────────────────────────────
     The card the mockup's frame 02 draws: what it says, what it is filed
     under, which file it is, and — in a block of its own behind a rule — the
     two acts that cannot be undone (§273.4's shape, chosen once for closing a
     cycle and again for archiving a client).

     NOTHING HERE IS A SECOND COPY OF A RULE. Every button is drawn from what
     the SERVER said about this report — `hasFile`, `state`, `version` — and
     every press asks again when it lands (§42, §48.2), so a page left open
     while somebody else publishes is wrong about what is offered and never
     about what happens.

     AND IT DOES NOT REPAINT UNDER A TYPING HAND (§71.2, §194): the fields are
     read at the moment of the press rather than written back on every
     keystroke, and only an act that CHANGES the report redraws the card. */
  function paintOneReport() {
    var it = LIB.one;
    var isNew = !it.id;
    page.appendChild(libraryHead("one"));

    var card = el("div", "ecard");

    /* The two marks, and only what is true: a published report says nothing
       about being published, because that is the ordinary state and marking
       it would spend the page's accent on the half that needs no attention
       (§41's budget). The version is always drawn, because it is the one
       number on this card that means something on its own. */
    var tags = el("div", "etags");
    if (it.state !== "published") tags.appendChild(el("span", "tag none", "Draft"));
    tags.appendChild(el("span", "tag", "v" + (it.version || 1)));
    card.appendChild(tags);
    card.appendChild(el("h2", null, it.title || "A new report"));

    var set = el("div", "rowset");
    set.style.marginTop = "18px";

    var tb = el("div");
    tb.appendChild(labFor("lib-title", "Title"));
    var title = el("input", "fld"); title.id = "lib-title"; title.value = it.title || "";
    tb.appendChild(title); set.appendChild(tb);

    var sb = el("div");
    sb.appendChild(labFor("lib-sum", "Summary"));
    var sum = el("textarea", "fld"); sum.id = "lib-sum"; sum.rows = 2; sum.value = it.summary || "";
    sb.appendChild(sum); set.appendChild(sb);

    /* THE CATEGORIES ARE THE ONE LIST THE SERVER SENT (spec 053 §4.4: one
       list for every client, for now), so a category invented here would be
       refused on save — which is why they are chips off that list and not a
       box somebody types into. `aria-pressed` is what a toggle already
       means, so the lit state needs no second attribute. */
    var picked = (it.categories || []).slice();
    var cb = el("div");
    cb.appendChild(el("span", "lab", "Categories"));
    var crow = el("div", "catrow");
    LIB.cats.forEach(function (c) {
      var chip = el("button", "catpick", c);
      chip.type = "button";
      chip.setAttribute("aria-pressed", picked.indexOf(c) >= 0 ? "true" : "false");
      chip.addEventListener("click", function () {
        var at = picked.indexOf(c);
        if (at >= 0) picked.splice(at, 1); else picked.push(c);
        chip.setAttribute("aria-pressed", at >= 0 ? "false" : "true");
      });
      crow.appendChild(chip);
    });
    cb.appendChild(crow); set.appendChild(cb);

    /* ── WHO CAN SEE IT (spec 046 §4.10, reversing decision 15) ───────────
       A field on the report, in the same block as its title, its summary,
       its categories and its file — because that is where the report is
       already being described. A visibility PAGE listing every report would
       be a second copy of this list sitting somewhere else.

       THE ABSENCE OF A LIST IS EVERYONE, so there is no on/off switch beside
       it: a switch would be a second way to say the same thing and the two
       could disagree (§110's pair). `seen` is null for everyone, an array
       for exactly those places, and [] for nobody.

       IT SAVES ON ITS OWN, ON `Done`, and never with the title: narrowing a
       report is not editing its words, so correcting a typo cannot
       re-assert who may read it. */
    var seen = it.seen === null || it.seen === undefined ? null : it.seen.slice();
    var sb2 = el("div");
    sb2.appendChild(el("span", "lab", "Who can see it"));
    var wrap = el("div", "tickwrap");
    var strip = el("div", "seen");
    var panel = null;

    function drawStrip() {
      strip.innerHTML = "";
      var who = el("span", "who");
      if (seen === null) who.appendChild(el("span", "all", "Everyone at " + LIB.client));
      else if (!seen.length) who.appendChild(el("span", "none", "Nobody can open this report"));
      else seenNames(seen).forEach(function (n) { who.appendChild(el("span", "tag", n)); });
      strip.appendChild(who);
      var sp = el("span", "sp");
      var b = el("button", "btn", panel ? "Done" : (seen === null ? "Narrow it…" : "Change"));
      b.type = "button";
      b.addEventListener("click", function () { panel ? closePanel(true) : openPanel(); });
      sp.appendChild(b); strip.appendChild(sp);
    }

    /* SAVED WHEN THE PANEL CLOSES AND ONLY IF SOMETHING MOVED, so opening it
       to look and pressing Done writes nothing (§50.6's habit — a reader that
       creates what it looked for puts a phantom change into every save). */
    var wasSeen = JSON.stringify(seen);
    function closePanel(save) {
      if (panel) { panel.remove(); panel = null; }
      drawStrip();
      if (!save || JSON.stringify(seen) === wasSeen) return;
      if (!it.id) return;
      wasSeen = JSON.stringify(seen);
      lead(true, "Saving…");
      post({ action: "librarySeen", key: LIB.key, id: it.id, seen: seen }).then(function (j) {
        if (!j || !j.ok) return say((j && j.error) || "That could not be saved.", true);
        loadLibrary(true);
      });
    }

    function openPanel() {
      panel = el("div", "tickpanel");
      var head = el("div", "tickhead");
      var find = el("input", "fld"); find.type = "search";
      find.placeholder = "Search departments…";
      find.setAttribute("aria-label", "Search departments");
      head.appendChild(find);

      /* ALL HANDS IT BACK TO EVERYONE — it does NOT tick every place. Ticking
         today's eighteen would EXCLUDE a unit created next month, silently,
         and nobody would ever connect the missing unit to a tick list filled
         in a year earlier. The panel says so in its own foot rather than
         leaving it to be discovered (§35, §124). */
      var all = el("button", "lnk", "All"); all.type = "button";
      all.addEventListener("click", function () { seen = null; rows(); drawStrip(); });
      var none = el("button", "lnk", "None"); none.type = "button";
      none.addEventListener("click", function () { seen = []; rows(); drawStrip(); });
      head.appendChild(all); head.appendChild(none);
      panel.appendChild(head);

      var list = el("div", "ticklist");
      panel.appendChild(list);
      var foot = el("div", "tickfoot");
      foot.appendChild(el("b", null, "All"));
      foot.appendChild(document.createTextNode(
        " hands it back to everyone, including a department added later — it does not tick these " +
        LIB.places.length + "."));
      panel.appendChild(foot);

      /* THE FILTER HIDES ROWS IN PLACE AND NEVER REPAINTS (§35, §108.13):
         rebuilding the list would replace the box being typed into. */
      function rows() {
        list.innerHTML = "";
        var kinds = [["unit", "Business units"], ["fn", "Supporting functions"]];
        kinds.forEach(function (k) {
          var mine = LIB.places.filter(function (p) { return p.kind === k[0]; });
          if (!mine.length) return;
          var gp = el("div", "gp", k[1]);
          list.appendChild(gp);
          mine.forEach(function (p) {
            var on = seen !== null && seen.indexOf(p.at) >= 0;
            var b = el("button", "tick"); b.type = "button";
            b.setAttribute("aria-pressed", on ? "true" : "false");
            /* DRAWN, NEVER A TEXT CHARACTER — the tick mark is outside the
               latin subsets this platform embeds and would ship as a blank
               box (§52, §120.2, §130.1). */
            var bx = el("span", "bx");
            bx.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.6 6.3 4.4 9 10.4 3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            b.appendChild(bx);
            b.appendChild(document.createTextNode(p.label));
            b.setAttribute("data-at", p.at);
            b.addEventListener("click", function () {
              /* TICKING ONE ON A REPORT EVERYBODY CAN SEE STARTS THE LIST at
                 that one place, rather than at eighteen minus one: the act is
                 "only these", not "everyone except". */
              if (seen === null) seen = [];
              var at = seen.indexOf(p.at);
              if (at >= 0) seen.splice(at, 1); else seen.push(p.at);
              b.setAttribute("aria-pressed", at >= 0 ? "false" : "true");
              drawStrip();
            });
            list.appendChild(b);
          });
        });
      }
      rows();

      find.addEventListener("input", function () {
        var q = find.value.trim().toLowerCase();
        var gp = null, any = false;
        Array.prototype.forEach.call(list.children, function (n) {
          if (n.className === "gp") {
            /* A GROUP WITH NOTHING LEFT IN IT GOES WITH ITS ROWS, or the
               panel reads as two headings over one name. Settled when the
               NEXT heading arrives, and again at the end for the last. */
            if (gp) gp.hidden = !any;
            gp = n; any = false; return;
          }
          var hit = !q || n.textContent.toLowerCase().indexOf(q) >= 0;
          n.hidden = !hit;
          if (hit) any = true;
        });
        if (gp) gp.hidden = !any;
      });

      wrap.appendChild(panel);
      drawStrip();
      find.focus();
    }

    drawStrip();
    wrap.appendChild(strip);
    sb2.appendChild(wrap);
    /* A REPORT WITH NO ID YET HAS NOTHING TO NARROW AGAINST, so it says what
       has to happen first rather than failing at the press — the file strip's
       own answer one field up (§61, §221). */
    if (isNew) {
      var n = el("p", "note", "Save it first, then choose who can see it. New reports start open to everyone.");
      sb2.appendChild(n);
    }
    set.appendChild(sb2);

    var pair = el("div", "wpair");
    var db = el("div");
    db.appendChild(labFor("lib-date", "Report date"));
    var date = el("input", "fld"); date.id = "lib-date"; date.type = "date"; date.value = it.reportDate || "";
    db.appendChild(date); pair.appendChild(db);

    /* THE FILE STRIP. A report with no file yet says so rather than drawing
       an empty box: there is one act here and its word says which it is
       (§124).

       AND IT IS LIVE ON A REPORT THAT HAS NEVER BEEN SAVED (§358). It used to
       be switched off with the strip saying "save it first", because the store
       path is built from the report's own id and a report with no row has no
       id for a piece to be written against. That is still true of the SERVER
       and was never true of the person: `sendFile` saves the draft itself when
       there is no row, exactly as Publish two rows below has always saved the
       form before publishing (§53.5 — one press over several requests is this
       card's own idiom, and the file button was the one place it was not
       applied). Attaching is the ordinary act; saving a draft and publishing
       are the two ways of finishing, and neither stands in front of it. */
    var fb = el("div");
    fb.appendChild(el("span", "lab", "The file"));
    var drop = el("div", "filestrip");
    drop.appendChild(el("span", "fname", it.hasFile
      ? it.fileName + (it.sizeLabel ? " · " + it.sizeLabel : "")
      : "No file yet."));
    var fsp = el("span", "sp");
    var pick = el("input"); pick.type = "file"; pick.accept = "application/pdf,.pdf";
    pick.style.display = "none";
    var fbtn = el("button", "btn", it.hasFile ? "Replace" : "Add the file");
    fbtn.type = "button";
    fbtn.addEventListener("click", function () { pick.click(); });
    pick.addEventListener("change", function () {
      var f = pick.files && pick.files[0];
      if (f) sendFile(f, drop, fbtn);
    });
    fsp.appendChild(fbtn); fsp.appendChild(pick);
    drop.appendChild(fsp);
    fb.appendChild(drop); pair.appendChild(fb);
    set.appendChild(pair);

    set.appendChild(el("p", "note",
      "Replacing the file keeps the same link and the same download count, and moves it to the next version. " +
      "What the old file said is not kept."));
    card.appendChild(set);

    /* ── WHAT IS TRUE, THEN WHAT YOU MAY DO (§144's shape) ─────────── */
    var by = el("div", "byline");
    var who = el("span", "who");
    who.appendChild(el("span", "nm", it.state === "published"
      ? "Published to " + LIB.client
      : (isNew ? "Not saved yet" : "Not published yet")));
    /* A stamp that is not there SAYS nothing rather than printing a nought
       or an empty date (§35). */
    var stamp = "";
    if (it.publishedAt) stamp = "published " + stampDay(it.publishedAt) + (it.publishedBy ? " by " + it.publishedBy : "");
    else if (!isNew && it.hasFile) stamp = it.downloads + (it.downloads === 1 ? " download" : " downloads") + " so far";
    if (stamp) who.appendChild(el("span", "em", stamp));
    by.appendChild(who);

    var sp = el("span", "sp");
    var save = el("button", "btn", isNew ? "Save the draft" : "Save");
    save.type = "button";
    save.addEventListener("click", function () { saveReport(false); });
    sp.appendChild(save);

    if (it.state === "published") {
      var back = el("button", "btn", "Back to the list");
      back.type = "button";
      back.addEventListener("click", function () { LIB.one = null; settle(paintLibrary); });
      sp.appendChild(back);
    } else {
      /* PUBLISH IS THE LOUD ONE and it is HELD rather than absent while
         there is nothing to publish — `aria-disabled`, so the reason under it
         can still be reached (§221, §163). A report with no file would go
         into the client's library as a row with no way to open it (§61). */
      var pub = el("button", "btn amber", "Publish to " + LIB.client);
      pub.type = "button";
      /* ONE GATE NOW, AND IT IS THE ONE ABOUT THE REPORT (§358). The `isNew`
         arm said "Save it first", which was the machinery's reason rather than
         the report's — and it is unreachable anyway, because a report with no
         row has no file either, so `!it.hasFile` already covers it. What
         survives is the only refusal a reader would recognise. */
      if (!it.hasFile) {
        pub.setAttribute("aria-disabled", "true");
        pub.title = "Add the file first — a report with nothing to open is not a report.";
      }
      pub.addEventListener("click", function () {
        if (pub.getAttribute("aria-disabled") === "true") { say(pub.title, true); return; }
        saveReport(true);
      });
      sp.appendChild(pub);
    }
    by.appendChild(sp);
    card.appendChild(by);

    if (!isNew) card.appendChild(endOfReport(it));
    page.appendChild(card);

    /* Read at the moment of the press, never written back on every keystroke
       (§35: a field commits on blur, and this card has no other writer). */
    function draft() {
      return { title: title.value, summary: sum.value,
               categories: picked.slice(), reportDate: date.value };
    }

    function saveReport(thenPublish) {
      var d = draft();
      if (!d.title.trim()) { say("A report needs a title.", true); return; }
      if (LIB.busy) return;
      LIB.busy = true;
      save.disabled = true;
      var body = { action: "librarySave", key: LIB.key, kind: LIB.kind,
                   title: d.title, summary: d.summary, categories: d.categories, reportDate: d.reportDate };
      if (it.id) body.id = it.id;
      post(body).then(function (j) {
        if (!j || !j.ok) { LIB.busy = false; save.disabled = false; say((j && j.error) || "It could not be saved.", true); return; }
        LIB.one = j.item;
        if (!thenPublish) { LIB.busy = false; return loadLibrary(true); }
        return post({ action: "libraryState", key: LIB.key, kind: LIB.kind, id: j.item.id, state: "published" })
          .then(function (p) {
            LIB.busy = false;
            if (!p || !p.ok) { save.disabled = false; settle(paintOneReport); say((p && p.error) || "It was saved and not published.", true); return; }
            LIB.one = p.item;
            return loadLibrary(true);
          });
      }).catch(function (e) {
        LIB.busy = false; save.disabled = false;
        if (String(e.message) === "sign in") return;
        say("Could not reach the server. Nothing was saved.", true);
      });
    }

    /* ── THE FILE, IN PIECES (spec 053 §4.3) ────────────────────────
       Begin, one request per piece, finish — every one of them authorised on
       the server, which is why the browser holds no address of its own
       (§261's rule, carried). The word on the button IS the progress: a bar
       would be a second thing to keep in step with a count that already
       says it. */
    function sendFile(f, strip, btn) {
      if (LIB.busy) return;

      /* THE ROW FIRST, WHERE THERE IS NOT ONE YET (§358). The store path is
         built on the server from the report's own id and is never sent by a
         browser, so a piece cannot be written against a report that has no
         row. That is the whole of why this used to be two acts — and it is a
         fact about the SERVER, so it is answered here rather than by asking
         the person to press something first.

         THE TITLE IS THE ONE THING THAT MUST BE THERE, and it is the same
         rule `librarySave` already enforces: a draft with no title is a row
         nobody can pick out of the list. SAID AND FOCUSED rather than refused
         at the press, because the thing that is missing is one field on this
         very card (§221, §61). */
      var d = draft();
      if (!it.id && !d.title.trim()) {
        say("A report needs a title.", true);
        try { title.focus(); } catch (e) {}
        return;
      }

      var was = btn.textContent;
      var nameCell = strip.querySelector(".fname");
      /* Set only once the row exists, so a card whose save failed is redrawn
         to say what is actually stored rather than left claiming "Not saved
         yet" over a draft that is now in the list (§96). */
      var made = false;
      LIB.busy = true; btn.disabled = true; btn.textContent = "Reading…";

      var fail = function (msg) {
        LIB.busy = false; btn.disabled = false; btn.textContent = was;
        nameCell.textContent = it.hasFile ? it.fileName + (it.sizeLabel ? " · " + it.sizeLabel : "") : "No file yet.";
        say(msg, true);
        if (made) settle(paintOneReport);
      };

      /* `it` AND `LIB.one` BOTH, or the pieces are addressed to an id the
         card does not hold: `it` is what the rest of this function reads and
         `LIB.one` is what a repaint draws (§48). */
      var haveRow = it.id ? Promise.resolve(true)
        : post({ action: "librarySave", key: LIB.key, kind: LIB.kind,
                 title: d.title, summary: d.summary,
                 categories: d.categories, reportDate: d.reportDate })
            .then(function (j) {
              if (!j || !j.ok) { fail((j && j.error) || "It could not be saved, so the file was not sent."); return false; }
              it = LIB.one = j.item;
              made = true;
              return true;
            });

      haveRow.then(function (go) {
        if (!go) return;
        return post({ action: "libraryUploadBegin", key: LIB.key, kind: LIB.kind,
             id: it.id, name: f.name, bytes: f.size }).then(function (b) {
        if (!b || !b.ok) { fail((b && b.error) || "The upload could not be started."); return; }
        var piece = b.piece || (3 * 1024 * 1024);
        var total = Math.max(1, Math.ceil(f.size / piece));
        var parts = [];
        var q = "/api/platform/file?client=" + encodeURIComponent(LIB.key) +
                "&kind=" + encodeURIComponent(LIB.kind) +
                "&id=" + encodeURIComponent(it.id) +
                "&name=" + encodeURIComponent(f.name) +
                "&path=" + encodeURIComponent(b.path) +
                "&storeKey=" + encodeURIComponent(b.storeKey) +
                "&uploadId=" + encodeURIComponent(b.uploadId);

        /* One piece at a time, in order. Several at once would be faster and
           would mean a failure halfway leaves pieces written for an upload
           nobody is going to finish; the store keeps nothing until finish is
           called either way, and this is the version that can say which
           piece it was on. */
        var step = function (n) {
          if (n > total) {
            btn.textContent = "Finishing…";
            return post({ action: "libraryUploadFinish", key: LIB.key, kind: LIB.kind,
                          id: it.id, name: f.name, bytes: f.size,
                          path: b.path, parts: parts,
                          uploadId: b.uploadId, storeKey: b.storeKey })
              .then(function (d) {
                LIB.busy = false; btn.disabled = false; btn.textContent = was;
                if (!d || !d.ok) { fail((d && d.error) || "The file could not be finished."); return; }
                LIB.one = d.item;
                return loadLibrary(true);
              });
          }
          btn.textContent = total > 1 ? "Sending " + n + " of " + total + "…" : "Sending…";
          var slice = f.slice((n - 1) * piece, Math.min(f.size, n * piece));
          return fetch(q + "&n=" + n, { method: "POST", cache: "no-store",
                                        headers: { "Content-Type": "application/octet-stream" },
                                        body: slice })
            .then(function (r) { return r.json(); })
            .then(function (r) {
              if (!r || !r.ok) { fail((r && r.error) || "That piece was refused."); return; }
              parts.push({ partNumber: r.partNumber, etag: r.etag });
              return step(n + 1);
            });
        };
        return step(1);
      });
      }).catch(function (e) {
        if (String(e.message) === "sign in") return;
        fail("Could not reach the server. The file was not uploaded.");
      });
    }
  }

  /* A stamp read the way every other date on this platform reads (§239.3's
     own lesson about two-digit years, one screen over): the browser's own
     month names, three letters, never a locale's "Sept". */
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function stampDay(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }

  /* ── TAKING ONE BACK (spec 053 §4.8) ─────────────────────────────────
     §323's block, because the decision is the same one: the two acts with no
     way back live under a rule, at the foot, each saying in its own line what
     it does — rather than a dead control somebody presses to find out.

     WITHDRAW IS NOT A DELETE AND DELETE IS REFUSED UNTIL IT HAS HAPPENED,
     which is the guard rather than a second confirmation: nobody deletes a
     report a client is still reading, and the SERVER refuses it in the same
     words (§42). */
  function endOfReport(it) {
    var apart = el("div", "apart");
    apart.appendChild(el("span", "akey lab", "Taking it back"));

    var pub = it.state === "published";

    /* `div`, NOT `span`, and it was found by looking (§311's own fault: a name
       running into its own sub-line). `.byline .who` is a flex column, so
       spans stack inside it; `.teamrow .who` is not, and every other row that
       uses it builds blocks. Following what the neighbours already do rather
       than giving the shared rule a column it has never needed — which would
       be a restyle of screens nobody asked about (§267.1, rule 1b). */
    var w = el("div", "teamrow");
    var ww = el("div", "who");
    ww.appendChild(el("div", "nm", "Withdraw"));
    ww.appendChild(el("div", "em", pub
      ? "Leaves " + LIB.client + "'s library. Its address answers not found, so nobody is told it ever existed. Nothing is lost and it can go back out."
      : "Nothing to withdraw — this report is a draft, so it is not in " + LIB.client + "'s library."));
    w.appendChild(ww);
    var wsp = el("div", "sp");
    var wb = el("button", "btn", "Withdraw");
    wb.type = "button";
    wb.disabled = !pub;
    wb.addEventListener("click", function () {
      if (LIB.busy) return;
      LIB.busy = true; wb.disabled = true; wb.textContent = "Withdrawing…";
      post({ action: "libraryState", key: LIB.key, kind: LIB.kind, id: it.id, state: "draft" })
        .then(function (j) {
          LIB.busy = false;
          if (!j || !j.ok) { wb.disabled = false; wb.textContent = "Withdraw"; say((j && j.error) || "It was not withdrawn.", true); return; }
          LIB.one = j.item;
          return loadLibrary(true);
        }).catch(function (e) {
          LIB.busy = false; wb.disabled = false; wb.textContent = "Withdraw";
          if (String(e.message) === "sign in") return;
          say("Could not reach the server.", true);
        });
    });
    wsp.appendChild(wb); w.appendChild(wsp);
    apart.appendChild(w);

    var d = el("div", "teamrow");
    var dw = el("div", "who");
    dw.appendChild(el("div", "nm", "Delete"));
    dw.appendChild(el("div", "em", pub
      ? "Withdraw first — nobody may delete a report a client is still reading."
      : "Ends it. The file goes with it, and there is nothing to restore from."));
    d.appendChild(dw);
    var dsp = el("div", "sp");
    var dbtn = el("button", "btn risk", "Delete…");
    dbtn.type = "button";
    dbtn.disabled = pub;
    /* THE ASK IS WHERE THE BUTTON WAS (§323): no dialog anywhere on this
       page, and one act does not earn the first. It NAMES the report,
       because the way this goes wrong is pressing it on the wrong row. */
    dbtn.addEventListener("click", function () { askDeleteReport(apart, d, it); });
    dsp.appendChild(dbtn); d.appendChild(dsp);
    apart.appendChild(d);

    return apart;
  }

  function askDeleteReport(apart, row, it) {
    row.textContent = "";
    var q = el("div", "wzask");
    var p = el("p");
    p.appendChild(document.createTextNode("Delete "));
    p.appendChild(el("b", null, it.title));
    p.appendChild(document.createTextNode("?"));
    q.appendChild(p);
    var goes = el("p", "goes");
    goes.appendChild(document.createTextNode("The report goes."));
    goes.appendChild(el("br"));
    goes.appendChild(document.createTextNode(it.hasFile ? "The file goes with it." : "There is no file on it."));
    goes.appendChild(el("br"));
    goes.appendChild(document.createTextNode("There is nothing to restore from."));
    q.appendChild(goes);
    var acts = el("div", "row");
    var yes = el("button", "btn risksolid", "Delete it");
    yes.type = "button";
    var no2 = el("button", "btn", "Cancel");
    no2.type = "button";
    no2.addEventListener("click", function () { settle(paintOneReport); });
    yes.addEventListener("click", function () {
      yes.disabled = true; no2.disabled = true; yes.textContent = "Deleting…";
      post({ action: "libraryDelete", key: LIB.key, kind: LIB.kind, id: it.id }).then(function (j) {
        if (!j || !j.ok) {
          yes.disabled = false; no2.disabled = false; yes.textContent = "Delete it";
          var bad = el("p", "wzendwhy", (j && j.error) || "It was not deleted.");
          bad.style.color = "var(--bad)";
          q.appendChild(bad);
          return;
        }
        /* Landing on the list, which is the record of what is there now
           rather than a card for a report that has just gone (§144). And the
           store's own answer is worth saying: a row removed while its file
           stayed is not a failure of this press, and it is not silence
           either (§171). */
        LIB.one = null;
        return loadLibrary(true).then(function () {
          if (j.fileRemoved === false) say("The report is gone. The file store would not remove its file — nothing is reachable through the platform.", true);
        });
      }).catch(function (e) {
        yes.disabled = false; no2.disabled = false; yes.textContent = "Delete it";
        if (String(e.message) === "sign in") return;
        var bad2 = el("p", "wzendwhy", "Could not reach the server.");
        bad2.style.color = "var(--bad)";
        q.appendChild(bad2);
      });
    });
    acts.appendChild(yes); acts.appendChild(no2);
    q.appendChild(acts);
    row.appendChild(q);
  }

  function drawArchived(key){
    lead(false, "Reading…");
    return post({ action:"client", key:key }).then(function (j) {
      if (!j.ok) { clear(); say(j.error || "Could not open that client.", true); return; }
      clear();
      var right = el("div");
      var leave = el("button", "btn", "Back to clients");
      leave.type = "button";
      leave.addEventListener("click", function () { go("clients"); });
      right.appendChild(leave);
      title(j.client.name, right);
      /* AN ARCHIVED CLIENT SAYS SO FIRST (§323): whichever block somebody
         came for, the state has to explain itself before the controls. */
      var ab = el("div", "wzarched");
      ab.appendChild(document.createTextNode("This client is "));
      ab.appendChild(el("b", null, "archived"));
      var when = archDate(j.client.archived_at);
      ab.appendChild(document.createTextNode(
        ". " + (when ? "Archived " + when : "Archived") +
        (j.client.archived_by ? " by " + j.client.archived_by : "") +
        ". Their link is closed, and nothing inside can be changed until they are brought back."));
      page.appendChild(ab);
      var host = el("div", "csetup");
      page.appendChild(host);
      CLIENTSETUP.mountArchived(host, key, { read: j, door: "/", go: function () { go("clients"); } });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  /* ── Consultants ─────────────────────────────────────────────── */
  function drawConsultants(quiet) {
    lead(quiet, "Reading…");
    return post({ action: "consultants" }).then(function (j) {
      if (!j.ok) { clear(); say(j.error || "Could not read the list.", true); return; }
      settle(function () {
      title("Consultants");

      var box = el("div", "tscroll");
      var t = el("table");
      var head = el("tr");
      ["Name", "Email", "Platform", "Clients and seats", "Password", ""].forEach(function (h) {
        head.appendChild(el("th", null, h));
      });
      var thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      var body = el("tbody");
      j.people.forEach(function (p) { body.appendChild(consultantRow(p, j)); });
      t.appendChild(body);
      box.appendChild(t);
      page.appendChild(box);

      if (j.canEdit) {
        var row = el("div", "row");
        var name = el("input", "fld"); name.placeholder = "Name";
        var mail = el("input", "fld"); mail.placeholder = "name@forefront.consulting";
        var add = el("button", "btn amber", "Add a consultant");
        add.type = "button";
        add.addEventListener("click", function () {
          post({ action: "saveConsultant", email: mail.value.trim(), name: name.value.trim() })
            .then(function (r) {
              if (!r.ok) { say(r.error || "Not added.", true); return; }
              drawConsultants(true);
              if (r.password) {
                var s = say("");
                s.appendChild(document.createTextNode("Temporary password for " + mail.value.trim() + ": "));
                s.appendChild(el("b", null, r.password));
                s.appendChild(document.createTextNode(" — they must change it on first use."));
              }
            });
        });
        row.appendChild(name); row.appendChild(mail); row.appendChild(add);
        page.appendChild(row);
      }
      page.appendChild(el("p", "note",
        "The seats are read here and set on each client's own configuration — " +
        "one place writes them. Somebody on no client can sign in and has " +
        "nothing to open, which is what a new joiner looks like."));
      });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  function consultantRow(p, j) {
    var tr = el("tr");

    /* ── THE NAME AND THE ADDRESS ARE EDITABLE (§313.27) ────────────
       Islam: "I need to edit the consultants names and emails as well." Two
       fields on the row rather than a dialog, because there are two of them
       and one row is not a form (§116's argument runs the other way at this
       size: the register moved to a dialog because NINE fields in a 158px
       cell collided; two do not).

       COMMITTED ON `change`, which for a text box means on blur — so the
       value is written by moving away from it, and there is no Save to
       forget. The row updates quietly afterwards, or the field being typed
       into would be replaced under the hand (§35, §71.2).

       AND THE ADDRESS IS THE SIGN-IN, so changing it ends that person's
       sessions and is said on the page rather than left to be discovered. */
    var edit = j.canEdit;
    var nameTd = el("td");
    if (edit) {
      var nm = el("input", "fld");
      nm.value = p.name || "";
      nm.placeholder = "Name";
      nm.addEventListener("change", function () {
        var v = nm.value.trim();
        if (v === (p.name || "")) return;
        post({ action: "saveConsultant", email: p.email, name: v })
          .then(function (r) { r.ok ? drawConsultants(true)
                                    : say(r.error || "Not changed.", true); });
      });
      nameTd.appendChild(nm);
    } else {
      nameTd.textContent = p.name || "—";
    }
    /* A RETIRED ROW SAYS SO (§35, §124, §338). Nothing else on this line
       differs — same name, same address, same seats — so without this the
       one state that stops somebody signing in is invisible, and Delete
       appears beside rows that look exactly like the ones it does not. */
    if (p.status === "retired") nameTd.appendChild(el("span", "tag", "Retired"));
    tr.appendChild(nameTd);

    var mailTd = el("td", "mono");
    if (edit) {
      var em = el("input", "fld mono");
      em.value = p.email;
      em.addEventListener("change", function () {
        var v = em.value.trim().toLowerCase();
        if (!v || v === p.email) { em.value = p.email; return; }
        post({ action: "saveConsultant", email: p.email, newEmail: v })
          .then(function (r) {
            if (!r.ok) { em.value = p.email; say(r.error || "Not changed.", true); return; }
            /* SAID AFTER THE REDRAW THAT REPORTS IT (§63). Said before, the
               sentence is appended to a page `settle()` is about to replace —
               so the rename lands, the outcome is written, and a moment later
               it is gone, which reads exactly like nothing happened. */
            drawConsultants(true).then(function () {
              say(v + " signs in with that address now. Any tab they had open " +
                  "has been signed out — the old address no longer exists.");
            });
          });
      });
      mailTd.appendChild(em);
    } else {
      mailTd.textContent = p.email;
    }
    tr.appendChild(mailTd);

    /* ── SUPER USER, IN A COLUMN THAT SAYS WHERE (Islam, option B) ──
       The role was always here and read "Platform admin: Yes", which is not
       the word Islam uses for it: "I'm the super user of the platform."

       AND THE WORD ALONE WOULD HAVE COLLIDED. `Super user` already means the
       top seat on a CLIENT (§89), and the column immediately to the right of
       this one reads "Raya Trade · Super user" — so the column carries the
       WHERE and the chip carries the WHAT, and the row reads across as
       Platform · Super user, Raya Trade · Super user. One word for one
       standing, qualified by where it is held (§87's twins, avoided rather
       than discovered).

       THE KEY DOES NOT MOVE: `is_admin`, `canSetAdmin` and `saveConsultant`
       keep their spelling, because renaming a stored field is a migration for
       a word nobody reads (§30.2, §58). */
    var adminTd = el("td");
    var cell = el("span", "cell" + (j.canSetAdmin && p.email !== j.me ? "" : " locked"));
    var yes = el("button", null, "Super user");
    yes.type = "button";
    if (p.isAdmin) yes.className = "on hi";
    if (j.canSetAdmin && p.email !== j.me) {
      yes.title = "Adding clients and consultants, and setting Who sees what";
      yes.addEventListener("click", function () {
        post({ action: "saveConsultant", email: p.email, isAdmin: !p.isAdmin })
          .then(function (r) { r.ok ? drawConsultants(true) : say(r.error || "Not changed.", true); });
      });
    } else if (p.email === j.me) {
      /* NOBODY CHANGES THEIR OWN STANDING, which is also what stops the
         platform's last super user locking themselves out of it. */
      yes.title = "You cannot change your own standing — somebody else with this role does it.";
    }
    cell.appendChild(yes);
    adminTd.appendChild(cell);
    tr.appendChild(adminTd);

    var seatsTd = el("td", "seats");
    if (!p.seats || !p.seats.length) seatsTd.appendChild(el("span", "muted", "On no client yet"));
    else p.seats.forEach(function (s) {
      seatsTd.appendChild(el("span", "tag",
        s.client + " · " + (s.seat === "super" ? "Super user" : "SMO team")));
    });
    tr.appendChild(seatsTd);

    tr.appendChild(el("td", null, p.password === "none" ? "—"
      : p.password === "temporary" ? "Temporary" : "Set"));

    var act = el("td");
    if (j.canEdit && p.email !== j.me && !p.isAdmin) {
      var b = el("button", "btn", "Issue password");
      b.type = "button";
      b.addEventListener("click", function () {
        b.disabled = true;
        post({ action: "issuePassword", email: p.email }).then(function (r) {
          b.disabled = false;
          if (!r.ok) { say(r.error || "Not issued.", true); return; }
          var s = say("");
          s.appendChild(document.createTextNode("Temporary password for " + p.email + ": "));
          s.appendChild(el("b", null, r.password));
          s.appendChild(document.createTextNode(" — said once, and stored nowhere in the clear."));
        });
      });
      act.appendChild(b);
    }
    /* TAKING SOMEBODY OFF THE LIST (§338). Islam: "allow me to delete a
       consultants from a user" — two accounts one letter apart and the list
       was ADD-ONLY, with retiring half built and never drawn (§61).

       RETIRE IS DRAWN FIRST AND DELETE ONLY ON A RETIRED ROW, which is
       §323's shape for a client and its reason: the two presses are
       separated by a state somebody chose, so nobody is deleted while they
       can still sign in. Both are asked of the SERVER (canRetire /
       canDelete), never re-derived here, or the row offers what the next
       request refuses (§42, §337's own fault). */
    if (p.canRetire) {
      var back = p.status === "retired";
      var rb = el("button", "btn", back ? "Bring back" : "Retire");
      rb.type = "button";
      rb.title = back ? "Let them sign in again."
        : "Ends their sessions and stops them signing in. Their seats stay on the record.";
      rb.addEventListener("click", function () {
        rb.disabled = true;
        post({ action: "saveConsultant", email: p.email, status: back ? "active" : "retired" })
          .then(function (r) {
            if (!r.ok) { rb.disabled = false; say(r.error || "Not changed.", true); return; }
            drawConsultants(true);
          });
      });
      act.appendChild(rb);
    }
    if (p.canDelete) {
      var db = el("button", "btn risk", "Delete");
      db.type = "button";
      db.title = "Removes the account for good. Offered only once they are retired and on no client.";
      db.addEventListener("click", function () {
        /* ASKED IN PLACE, AND THE ASK NAMES WHO (§89, §95, §186). Never the
           browser's own dialog — §273.3 took the last one of those out of
           the product — and never a modal either: this is one row of a
           table, so the question belongs in the row it is about. The
           failure mode is landing on the wrong line, which is exactly what
           a confirmation naming nobody catches none of. */
        act.textContent = "";
        act.appendChild(el("span", "muted", "Delete " + (p.name || p.email) + "?"));
        var yes = el("button", "btn risksolid", "Delete for ever");
        yes.type = "button";
        var no = el("button", "btn", "Cancel");
        no.type = "button";
        no.addEventListener("click", function () { drawConsultants(true); });
        yes.addEventListener("click", function () {
          yes.disabled = true; no.disabled = true; yes.textContent = "Deleting…";
          post({ action: "deleteConsultant", email: p.email }).then(function (r) {
            if (!r.ok) { say(r.error || "Not deleted.", true); drawConsultants(true); return; }
            drawConsultants(true);
          });
        });
        act.appendChild(yes); act.appendChild(no);
      });
      act.appendChild(db);
    }
    tr.appendChild(act);
    return tr;
  }

  /* ── Who sees what ───────────────────────────────────────────── */
  function drawAccess() {
    page.appendChild(el("p", "muted", "Reading…"));
    post({ action: "access" }).then(function (j) {
      clear();
      if (!j.ok) { say(j.error || "Could not read the table.", true); return; }
      title("Who sees what");
      page.appendChild(el("p", "note",
        "What somebody may do INSIDE a client is the seat they hold on it, set " +
        "on that client's configuration. What is here is the rest — and it is " +
        "asked of everybody who is not the platform's super user."));

      var box = el("div", "tscroll");
      var t = el("table");
      var thead = el("thead"), head = el("tr");
      head.appendChild(el("th", null, "Everybody who is not the super user"));
      j.areas.forEach(function (a) { head.appendChild(el("th", null, a.name)); });
      thead.appendChild(head); t.appendChild(thead);

      var body = el("tbody"), tr = el("tr");
      tr.appendChild(el("td", null, "Every consultant, whatever seats they hold"));
      j.areas.forEach(function (a) {
        var td = el("td");
        var now = Object.prototype.hasOwnProperty.call(j.stored, a.key) ? j.stored[a.key] : j.defaults[a.key];
        var cell = el("span", "cell" + (j.canEdit ? "" : " locked"));
        a.states.forEach(function (st) {
          if (st === "none" && a.states.length > 2) return;   /* nothing lit IS none (§37) */
          var b = el("button", null, st === "yes" ? "Yes" : st.charAt(0).toUpperCase() + st.slice(1));
          b.type = "button";
          b.title = a.note;
          if (now === st) b.className = "on" + (st === "edit" || st === "open" || st === "yes" ? " hi" : "");
          if (j.canEdit) {
            b.addEventListener("click", function () {
              /* Pressing the lit one puts the cell back to nothing: the third
                 state is the absence of the others (§37). */
              var next = now === st ? (a.states[0] === "hidden" ? "hidden" : "none") : st;
              post({ action: "saveAccess", area: a.key, grant: next })
                .then(function (r) { r.ok ? drawAccess() : say(r.error || "Not saved.", true); });
            });
          }
          cell.appendChild(b);
        });
        td.appendChild(cell);
        tr.appendChild(td);
      });
      body.appendChild(tr); t.appendChild(body);
      box.appendChild(t);
      page.appendChild(box);
      page.appendChild(el("p", "note", "Nothing lit means nothing at all."));
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  /* ════ The strategy frameworks library (spec 052) ════════════════════
     Forefront's own, outside every client, beside the memory — and the one
     table on this platform that names no client at all: a framework is about
     nobody.

     ASKING IT IS PHASE C and is not drawn as a control that does nothing
     (§61). ADDING one is here, and it is an admin's: `canAdd` comes from the
     server with the list and is never worked out on this page (§42). */
  var FW = { view: "list", one: null, q: "", section: "", rows: null, sections: null,
             canAdd: false, add: null, said: "",
             /* Asking rides in the SAME box as searching, switched — decision
                2, and one field rather than a box with a quieter line under
                it. The answer lives on FW, so opening a framework it named
                and pressing back finds it still there. */
             mode: "search", question: "", answer: null, asking: false };

  /* THE DRAFT'S OWN STATE, minted fresh on every press of Add rather than
     kept between visits: a half-typed name from last week reappearing under
     an empty draft is the shape nobody can tell from a bug. */
  function fwAddState() {
    return { how: "name", name: "", source: "", draft: null, why: "", busy: false };
  }

  /* The nine, named ONCE, in the order the detail page reads them — the
     reading view walks this list, so a tenth field is one edit (§104.7). */
  var FWFIELDS = [["purpose", "Purpose"], ["keyQuestions", "Key questions it answers"],
                  ["whenToUse", "When to use it"], ["whenNotToUse", "When not to use it"],
                  ["inputsRequired", "Inputs required"], ["outputs", "Outputs"],
                  ["executiveExample", "Executive example"],
                  ["consultantUseCase", "Consultant use case"],
                  ["facilitationTips", "Facilitation tips"]];
  /* The two that read side by side, because they are a pair and a reader
     compares them. */
  var FWPAIRS = { whenToUse: "whenNotToUse", inputsRequired: "outputs" };

  function fwGo(view, extra) {
    FW.view = view;
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) FW[k] = extra[k];
    return drawFrameworks();
  }

  function drawFrameworks() {
    if (FW.view === "one") return drawFwOne();
    if (FW.view === "add") return drawFwAdd();
    return drawFwList();
  }

  /* ── The list ──────────────────────────────────────────────────────
     The whole library arrives in one answer and the searching happens here,
     which is a decision rather than a shortcut: 80 rows is small, they are
     already on the page, and a round trip per keystroke would be slower AND
     would replace the box being typed into (constitution XV). */
  function drawFwList(quiet) {
    lead(quiet, "Reading…");
    return fpost({ action: "list" }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "Could not read the library.", true); return; }
      FW.rows = j.frameworks || [];
      FW.sections = j.sections || [];
      FW.canAdd = !!j.canAdd;
      settle(function () { fwPaint(); });
    }).catch(function (e) {
      if (String(e.message) === "sign in") return;
      clear(); say("Could not reach the server.", true);
    });
  }

  function fwPaint() {
    /* DRAWN FOR AN ADMIN AND FOR NOBODY ELSE — never drawn disabled, because
       a control that refuses everybody who can see it is furniture (§94.15),
       and the sentence explaining it would be on a page the reader can do
       nothing about. */
    var right = null;
    if (FW.canAdd) {
      right = el("span");
      var add = el("button", "btn amber", "+ Add a framework");
      add.type = "button";
      add.addEventListener("click", function () { fwGo("add", { add: fwAddState() }); });
      right.appendChild(add);
    }
    title("Frameworks", right);

    var box = el("div", "fwbox");

    /* ONE BOX, TWO QUESTIONS, SWITCHED (decision 2). Searching narrows what is
       already on the page; asking sends the library to the assistant. They are
       different enough that one field answering both by guessing would be a
       control nobody can predict — and near enough that two boxes stacked would
       be two things to read before typing. */
    var cell = el("div", "cell");
