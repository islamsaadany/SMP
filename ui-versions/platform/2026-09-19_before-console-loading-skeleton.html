<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forefront — Strategy Management Platform</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32">
<!--
  FOREFRONT'S OWN PLATFORM (spec 042, revision 2 — Islam, 2026-08-29:
  "the page you are showing should be just for login ... and the rest should be
  inside the platform").

  index.html is the DOOR and does one thing. This is what it hands you to: a
  platform with its own chrome and its own navigation, holding the three pages
  that are Forefront's rather than a client's.

  IT IS NOT BUILT FROM src/. Neither is the door — both are hand-written pages
  served as they are, and only the CLIENT's platform is assembled by build.py.
  Its stylesheet is its own for the same reason: the door is a wall and a card,
  this is a chrome and tables, and copying 25KB of the one into the other
  carries rules neither needs (constitution VI: follow what the product does,
  and the product has two kinds of page here).
-->
<style>
  :root{
    --ground:#F5F6F9; --surface:#FFFFFF; --surface-2:#EDF0F5;
    --line:#D8DEE8; --line-soft:#E6EAF1;
    /* --ink-3 IS SET AGAINST THE QUIETEST GROUND IT SITS ON, not the whitest
       (§38.5, and _shared.css records the same lesson): #6E7A90 cleared
       nothing — 4.33 on white, 4.01 on the page's own ground and 3.79 on
       --surface-2 — and it is the colour of the card's industry line, the
       name in the top row, every note and every unlit chip. #5E6E85 is the
       client platform's own value, so this is one vocabulary rather than two
       greys a shade apart (§53.5): 5.19 / 4.80 / 4.54. */
    --ink:#141C2B; --ink-2:#465268; --ink-3:#5E6E85;
    /* Forefront's own, measured before use (constitution XIII):
       #0F2C69 carries white at 13.25:1 · #F5A623 carries #231500 at 9.04:1
       and is 2.03:1 as TYPE on white, so words take #9C5D08 (5.27:1). */
    --ff:#0F2C69; --ff-ink:#FFFFFF; --ff-quiet:#A9BAD8; --ff-tx:#0F2C69;
    --amber:#F5A623; --amber-ink:#231500; --amber-tx:#9C5D08; --amber-wash:#FEF4E2;
    --good:#1B6E4E; --good-bg:#E9F4EF; --warn:#8A6410; --warn-bg:#FBF2DC;
    --bad:#B23025; --bad-bg:#FBEDEB; --bad-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(20,28,43,.06), 0 8px 26px rgba(20,28,43,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#12151C; --surface:#1A1F29; --surface-2:#222834;
      --line:#333B4A; --line-soft:#2A313E;
      --ink:#E7EBF2; --ink-2:#AAB4C6; --ink-3:#8590A3;
      --ff:#0D2350; --ff-ink:#F0F4FB; --ff-quiet:#95A9CC; --ff-tx:#95A9CC;
      --amber:#F5A623; --amber-ink:#231500; --amber-tx:#F5A623; --amber-wash:#2B2210;
      --good:#63BE96; --good-bg:#1B2C26; --warn:#D7B04A; --warn-bg:#2A2515;
      --bad:#E8776B; --bad-bg:#33211F; --bad-ink:#231010;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  /* THE SAME BLOCK AGAIN, DELIBERATELY, AND IT IS WHY --ff-tx WAS ADDED
     TWICE AND STILL DID NOTHING HERE: a token defined only in the media query
     is absent the moment somebody chooses a theme explicitly, which is exactly
     what this check does. Complete blocks, never a base plus overrides —
     _shared.css records the same rule, and v3.0's zebra stripe is what
     happens without it. */
  :root[data-theme="dark"]{
    --ground:#12151C; --surface:#1A1F29; --surface-2:#222834;
    --line:#333B4A; --line-soft:#2A313E;
    --ink:#E7EBF2; --ink-2:#AAB4C6; --ink-3:#8590A3;
    --ff:#0D2350; --ff-ink:#F0F4FB; --ff-quiet:#95A9CC; --ff-tx:#95A9CC;
    --amber:#F5A623; --amber-ink:#231500; --amber-tx:#F5A623; --amber-wash:#2B2210;
    --good:#63BE96; --good-bg:#1B2C26; --warn:#D7B04A; --warn-bg:#2A2515;
    --bad:#E8776B; --bad-bg:#33211F; --bad-ink:#231010;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--ground); color:var(--ink);
    font:400 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased }
  /* NOTHING IS DRAWN UNTIL THE SERVER HAS ANSWERED (§94.10's rule): a platform
     that paints a page and then corrects it has shown somebody a screen that
     was not theirs. */
  body:not(.ready) .wrap{ visibility:hidden }

  /* ── the chrome: two lines, as a client's platform has (§2.9) ── */
  .top{ background:var(--surface); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:9px 18px }
  /* THE MARK IS TYPE, AND --ff IS A FILL (§38.4, the seventh time). It was
     `color:var(--ff)`, which is right in light — #0F2C69 on white is 13.25 —
     and in dark that token becomes the navy the NAVIGATION BAR is painted in:
     #0D2350 on #1A1F29 is 1.08, so Forefront's own name was invisible on
     Forefront's own platform. A fill and a word need two tokens, declared
     together (§94.8's --cta/--cta-ink). --ff-tx is 6.94 dark. */
  .top .mk{ font:700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.16em; color:var(--ff-tx) }
  .top .nm{ font-weight:600; font-size:14px }
  .top .right{ margin-left:auto; display:flex; align-items:center; gap:10px;
    color:var(--ink-3); font-size:12.5px }
  .nav{ background:var(--ff); display:flex; padding:0 10px; gap:2px }
  .nav button{ background:transparent; border:0; color:var(--ff-quiet);
    font:600 13.5px/1 inherit; padding:13px 14px; cursor:pointer;
    border-bottom:3px solid transparent }
  .nav button:hover{ color:var(--ff-ink) }
  .nav button.on{ color:var(--ff-ink); border-bottom-color:var(--amber) }
  .wrap{ max-width:1180px; margin:0 auto; padding:22px 18px 70px }

  .ptitle{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:18px }
  .ptitle h1{ font-size:20px; margin:0; font-weight:600 }
  .ptitle .right{ margin-left:auto; display:flex; gap:8px; align-items:center }

  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:6px 12px; font:600 13px/1.5 inherit; cursor:pointer }
  .btn:hover:not(:disabled){ border-color:var(--amber-tx) }
  .btn:disabled{ opacity:.45; cursor:default }
  /* A HELD BUTTON LOOKS HELD (§358.12). Islam's A, picked from four drawn
     side by side and AGAINST the recommendation, with the cost measured and in
     front of him — recorded as his rather than overwritten (Principle II).
     THE COST IS THAT THE LABEL STOPS BEING READABLE: the fade composites the
     fill and the words together, so on this filled button they go from 8.79 to
     2.13 light and 2.82 dark, against a 4.5 floor. What carries the meaning
     instead is the hover and the press — and a HELD control answers both
     where a `disabled` one answers neither, which is the whole reason this is
     `aria-disabled` and never `disabled` (§221, §163).
     SO `cursor` IS DELIBERATELY NOT SET, unlike `:disabled` one line above:
     the button is pressable, pressing it says what is missing, and a default
     cursor would be the one part of this that is untrue. The hover border is
     left alone for the same reason (rule 1b — it was not asked for, and it
     is honest: this button IS alive). One control wears it today; any held
     control added later inherits it, which is the rule rather than an accident. */
  .btn[aria-disabled="true"]{ opacity:.45 }
  .btn.solid{ background:var(--ff); border-color:var(--ff); color:var(--ff-ink) }
  .btn.amber{ background:var(--amber); border-color:var(--amber); color:var(--amber-ink) }
  .fld{ width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:8px 11px; font:400 14px/1.5 inherit }
  .lab{ display:block; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px }

  /* ── client cards ─────────────────────────────────────────── */
  .cards{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)) }
  /* ── ONLY THE ROWS OPEN (§320.3, spec 046 §4.6a) ──────────────────
     Islam, of two behaviours drawn side by side: "2". The card's name is
     not pressable; every way into a client names a module, so nothing has
     to decide which one the top would open. The card stopped being a
     <button> for it — a button cannot hold buttons — so the identity block
     and the rows are its two children and the padding moved onto them. */
  /* ── A MARK, NOT A SENTENCE — AND TIGHTER (§368) ──────────────────
     Islam: "we don't needs notes that take 2 lines we can just have a
     notificaiton here if something is new to check ... to keep it neat and
     clean nad let's make it compact." Option A of a signed-off mockup
     (design-mockups/client-card-rows/2026-09-17_a-mark-not-a-sentence.html),
     with the tighter rows he ticked on it.

     `min-height` GOES FROM THE CARD AND STAYS ON `.ccard.add`, which is the
     one card whose whole height comes from it: it is a centred dashed box
     holding four words, and on a platform with no clients yet it is alone in
     its row with nothing to be stretched against (§317's own empty state).
     Every other card is as tall as it needs to be, and the grid still levels
     a row against its tallest. */
  .ccard{ position:relative; text-align:left; border:1px solid var(--line); border-radius:12px;
    background:var(--surface); display:flex; flex-direction:column;
    min-height:0; font:inherit; color:inherit; box-shadow:var(--shadow) }
  .ccard:focus-visible{ border-color:var(--amber-tx); outline:none }
  .ccard.listed{ opacity:.72 }
  .ccard .ctop{ display:flex; flex-direction:column; gap:5px; padding:13px 14px }
  .ccard .mods{ margin-top:auto; border-top:1px solid var(--line) }
  .mrow{ display:flex; width:100%; align-items:baseline; gap:8px; padding:6px 14px;
    font:inherit; font-size:13px; text-align:left; color:inherit; background:none;
    border:0; border-bottom:1px solid var(--line); cursor:pointer }
  .mrow:last-child{ border-bottom:0; border-radius:0 0 11px 11px }
  /* AND THE TAIL MAY NEVER WRAP, which is the two-line row he photographed:
     this had no `flex:none`, so the sentence that used to sit beside it
     squeezed the two-word state until it broke. The sentence is gone, and
     the guard stays — a mark is a mark on one line whatever ends up next to
     it, and a wrapped one costs the whole grid a row of height. */
  .mrow i{ font-style:normal; font-size:11.5px; color:var(--ink-3); margin-left:auto;
    flex:none; white-space:nowrap }
  /* The two marks that mean something is BROKEN rather than busy, in the
     warning ink (--warn, measured for words on this surface); a count is not
     an alarm however large it is, so it stays the row's quiet ink at the
     weight that lets a figure be picked out of a column of names. */
  .mrow i.alarm{ color:var(--warn); font-weight:600 }
  .mrow i.due{ color:var(--ink-2); font-weight:600 }
  .mrow:hover, .mrow:focus-visible{ background:var(--surface-2); outline:none }
  .ccard.add{ cursor:pointer }
  .ccard.add:hover, .ccard.add:focus-visible{ border-color:var(--amber-tx); outline:none }
  .ccard .cmark{ width:30px; height:30px; border-radius:8px; background:var(--ff); color:var(--amber);
    font:700 11px/30px ui-monospace, SFMono-Regular, monospace; text-align:center; letter-spacing:.05em }
  /* A client that has a mark wears it on its card — the same picture its
     door wears (§313.36), so the two cannot disagree; a light plate under it
     because a PNG cannot be recoloured (§52). Initials until then.
     ITS HEIGHT FOLLOWS THE INITIALS' (§368): the mockup could only draw the
     initials, and leaving this at 36 would have made a client with a logo
     taller than one without — two card heights in one row for no reason
     anybody could read. */
  .ccard img.cmark{ width:auto; max-width:120px; height:30px; object-fit:contain; background:#fff; padding:3px 7px; box-sizing:content-box }
  .markrow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap }
  .markrow img{ height:40px; width:auto; max-width:200px; object-fit:contain; background:#fff; padding:5px 10px; border:1px solid var(--line); border-radius:8px }
  .markrow .none{ font-size:13px; color:var(--ink-3) }
  .ccard h2{ margin:0; font-size:16px; font-weight:600 }
  .ccard .ind{ margin:0; color:var(--ink-3); font-size:12.5px }
  .ccard .foot{ display:flex; gap:6px; flex-wrap:wrap }
  .ccard.demo{ background:var(--amber-wash); border-color:var(--amber) }
  .ccard.add{ align-items:center; justify-content:center; border-style:dashed; font-weight:600;
    padding:15px; color:var(--ink-3); min-height:152px }
  /* ── THE WORKED EXAMPLE IS NOT ONE OF THE CLIENTS (§317) ──────────
     Islam: "the demo should be a separate client on the platform outside
     beside the clients." It was IN the grid — third across, with the way to
     add a client after it — so the page counted it as one, and two things
     followed that nobody chose: the empty-state line reads a count that
     included it, and the box saying "Search clients" found it.

     THE DEVICE IS THE PAGE'S OWN and nothing here is new: a hairline with an
     uppercase key on it, which is how every other surface separates one kind
     of thing from another (§53.5). The card keeps the amber wash and the Demo
     tag it already wore — what changed is where it is drawn. AND IT KEEPS THE
     GRID'S OWN TRACK WIDTH: a card grown to the full page would read as more
     important than the clients above it, which is the opposite of what
     setting it apart says. */
  .apart{ margin-top:26px; padding-top:14px; border-top:1px solid var(--line) }
  .apart > .akey{ display:block; margin-bottom:12px;
    font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3) }
  .ccfg{ position:absolute; top:11px; right:11px; font:600 10px/1.6 ui-monospace, monospace;
    letter-spacing:.06em; text-transform:uppercase; color:var(--amber-tx);
    border:1px solid var(--line); border-radius:6px; padding:2px 7px; background:var(--surface);
    /* A SPAN WITH TEXT IN IT SHOWS THE TEXT CURSOR (§361). This chip is a
       <span role="button">, so with no cursor of its own the pointer becomes
       the I-beam over the one control that opens a client — and `.cback`
       directly below, built the same way for the same kind of act, has
       carried `cursor:pointer` since it was written. One of the pair was
       given it and the other was not. */
    cursor:pointer }
  .ccfg:hover, .ccfg:focus-visible{ border-color:var(--amber-tx); outline:none }
  .tag{ font:600 10.5px/1.5 ui-monospace, SFMono-Regular, monospace; letter-spacing:.05em;
    text-transform:uppercase; border:1px solid var(--line); border-radius:5px; padding:2px 6px;
    color:var(--ink-2); background:var(--surface-2) }
  .tag.open{ color:var(--good); background:var(--good-bg); border-color:var(--good) }
  .tag.none{ color:var(--warn); background:var(--warn-bg); border-color:var(--warn) }
  .tag.demo{ color:var(--amber-tx); border-color:var(--amber); background:var(--surface) }
  .tag.seat{ color:var(--ff); border-color:var(--ff) }

  /* ── AN ARCHIVED CLIENT'S CARD (§323) ──────────────────────────────
     The card it always was, quieter, and with no door. A dashed edge says
     "set aside" the way the Add card's dashed edge already says "not yet a
     client", so the page keeps one vocabulary rather than gaining a second
     (§53.5). It is never `disabled` in the markup for the LOOK — it is
     disabled because there is genuinely nothing behind it: their address is
     closed, and a card that still opened would promise something that does
     not work (§61, §96). */
  .ccard.arch{ opacity:.72; border-style:dashed; background:var(--surface-2) }
  .ccard.arch:hover{ border-color:var(--line) }
  /* AND WHOEVER ARCHIVED IT IS AN EMAIL, WHICH IS LONGER THAN THE CARD
     (§88's own answer, on a card rather than a table row): one line, clipped
     where it does not fit, the whole of it one hover away. Measured — 
     `islam.saadany@forefront.consulting` runs 4px past a 232px card, and this
     is a `ui-monospace` string with no space in it, so it cannot wrap its way
     out (§158: fit, never "and it overflows"). */
  .tag.arch{ color:var(--ink-3); border-color:var(--line); background:var(--surface);
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  /* BRING BACK TAKES THE CORNER SETTINGS HOLDS on a live card, because on an
     archived client it is what Settings was: the one thing you came to the
     card to do. */
  .cback{ font:600 10px/1.6 ui-monospace, SFMono-Regular, monospace; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-2); background:var(--surface);
    border:1px solid var(--line); border-radius:7px; padding:2px 8px; cursor:pointer }
  .cback:hover, .cback:focus-visible{ border-color:var(--amber-tx); outline:none }
  /* TWO CONTROLS, SO THEY NEED A ROW: `.ccfg` is absolute and a second
     absolute chip would sit on top of it. The wrapper is what is positioned
     and the chips sit in it, so a third one later costs no arithmetic. */
  .cacts{ position:absolute; top:11px; right:11px; display:flex; gap:5px; align-items:center }
  .cacts .ccfg{ position:static; top:auto; right:auto }
  :root[data-theme="dark"] .tag.seat, :root:not([data-theme="light"]) .tag.seat{ color:var(--ff-quiet) }

  /* ── tables ───────────────────────────────────────────────── */
  table{ border-collapse:collapse; width:100%; font-size:14px }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap }
  thead th{ background:var(--ff); color:var(--ff-ink);
    font:600 10.5px/1.4 ui-monospace, SFMono-Regular, monospace; letter-spacing:.09em;
    text-transform:uppercase; border-bottom:0 }
  thead th:first-child{ border-top-left-radius:8px } thead th:last-child{ border-top-right-radius:8px }
  tbody tr:nth-child(even) td{ background:var(--surface-2) }
  .tscroll{ overflow-x:auto }
  /* The seats cell is the one that wraps: it holds a list that grows with the
     clients somebody is on, and clipping it hides the fact the column is for. */
  td.seats{ white-space:normal; min-width:250px }
  /* A FIELD IN A TABLE CELL NEEDS A DEFINITE WIDTH AND min-width:0 (§110.8).
     `max-width:100%` resolves against a containing block an auto-layout table
     has not settled, so the browser treats it as none and the box grows the
     column; a px cap does nothing either. These two are what stop the row
     widening the moment the page is drawn. */
  table .fld{ width:100%; min-width:0; padding:5px 7px; font-size:13px }
  table td:first-child .fld{ min-width:120px }
  table .fld.mono{ font-family:ui-monospace, SFMono-Regular, monospace; font-size:12.5px;
    min-width:210px }
  td.seats .tag{ display:inline-block; margin:2px 3px 2px 0 }
  .mono{ font:400 13px/1.5 ui-monospace, SFMono-Regular, monospace; color:var(--ink-2) }
  .muted{ color:var(--ink-3) }

  /* a cell of two or three states, as §37's matrix has */
  .cell{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden }
  .cell button{ border:0; border-right:1px solid var(--line); background:var(--surface); color:var(--ink-3);
    font:600 10.5px/1.4 ui-monospace, SFMono-Regular, monospace; letter-spacing:.05em;
    text-transform:uppercase; padding:5px 9px; cursor:pointer }
  .cell button:last-child{ border-right:0 }
  .cell button.on{ background:var(--ff); color:var(--ff-ink) }
  .cell button.on.hi{ background:var(--amber); color:var(--amber-ink) }
  .cell.locked button{ cursor:default }

  .row{ display:flex; gap:9px; margin-top:14px; flex-wrap:wrap; align-items:center }
  .row .fld{ flex:1 1 170px; min-width:0 }
  /* ── WHICH MODULES A CLIENT HAS (spec 046 §4.5) ────────────────────
     The ROWS are the team list's own — .teamrow, .who .nm/.em, .sp, .tag,
     .btn, .note — so this section adds no vocabulary to the drawer (§53.5).
     All that is here is what puts them in a band of their own, which is the
     only thing about it that is new. */
  .band{ border:1px solid var(--line); border-radius:11px; background:var(--surface);
    padding:14px 16px 4px; margin:0 0 20px }
  .band .teamrow:last-of-type{ border-bottom:0 }
  .cfg{ display:grid; grid-template-columns:1.05fr .95fr; gap:26px }
  .rowset{ display:grid; gap:13px }
  .teamrow{ display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--line-soft) }
  .teamrow .who .nm{ font-weight:600; font-size:14px }
  .teamrow .who .em{ color:var(--ink-3); font-size:12.5px }
  .teamrow .sp{ flex-wrap:wrap; justify-content:flex-end }
  .asrow{ display:inline-flex; align-items:center; gap:6px }
  .asrow .aslab{ font:600 9.5px/1.4 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap }
  .asrow .fld{ width:auto; max-width:230px; padding:4px 6px; font-size:12px }
  .teamrow .sp{ margin-left:auto; display:flex; gap:7px; align-items:center }
  .said{ margin:12px 0 0; font-size:13.5px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px }
  .said b{ font-family:ui-monospace, SFMono-Regular, monospace }
  .err{ margin:12px 0 0; font-size:13.5px; color:var(--bad); background:var(--bad-bg);
    border:1px solid var(--bad); border-radius:8px; padding:9px 11px }
  .note{ margin:14px 0 0; font-size:13px; color:var(--ink-3) }
  @media (max-width:820px){ .cfg{ grid-template-columns:1fr } }

  /* ── THE TWO PIECES OF SET-UP THIS PAGE STILL DRAWS (§360, spec 057) ──
     The flow moved into the client platform (client-setup.js); what is
     left here is adding a client and ending an archived one, in this
     page's tokens. The markup is the module's, so the classes are its. */
  .csetup .lab{ margin-bottom:6px }
  .csetup .rowset{ max-width:640px }
  .csetup .cssaid{ margin:12px 0 0; font-size:13.5px; border-radius:8px; padding:9px 11px }
  .csetup .cssaid.said{ background:var(--surface-2); border:1px solid var(--line) }
  .csetup .cssaid.err{ color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad) }
  .wzq{ font-size:20px; font-weight:600; margin:7px 0 4px; text-wrap:balance }
  .wzwhy{ color:var(--ink-3); font-size:13.5px; margin:14px 0 0; max-width:62ch }
  .wzempty{ color:var(--ink-3); font-size:13.5px; font-style:italic; margin:0 }
  .wzfoot{ display:flex; align-items:center; gap:9px; margin-top:22px; padding-top:15px;
    border-top:1px solid var(--line); flex-wrap:wrap }
  .wzfnote{ margin-left:auto; color:var(--ink-3); font-size:12.5px }

  /* ── ENDING A CLIENT (§323) ─────────────────────────────────────────
     §273.4's shape, which Islam chose for the reporting cycle: the
     destructive act in its own block, behind a rule, under a heading, so
     nobody arrives at it by tabbing down the form. Settings is already the
     door — a door is only a guard if the dangerous thing is behind it. */
  .wzend{ margin-top:26px; padding-top:16px; border-top:1px solid var(--line); max-width:560px }
  .wzendkey{ display:block; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px }
  .wzendwhy{ margin:0 0 12px; font-size:13px; color:var(--ink-3); max-width:62ch }
  .wzendrow{ display:flex; align-items:center; gap:9px; flex-wrap:wrap }

  /* THE WORD IS RED AND THE BUTTON IS NOT (§41's budget): --bad as a fill
     would be the loudest thing on a page whose one accent is the amber. The
     FILL is kept for the confirmation, where the volume belongs — and a fill
     and a word are TWO tokens, declared together (§38.4, §94.8's
     --cta/--cta-ink), because the first build of this wrote `color:#fff` and
     measured 2.90:1. 6.28 light, 6.35 dark. */
  .btn.risk{ color:var(--bad); border-color:var(--bad) }
  .btn.risk:hover:not(:disabled){ background:var(--bad-bg); border-color:var(--bad) }
  .btn.risksolid{ background:var(--bad); border-color:var(--bad); color:var(--bad-ink) }

  /* The question is asked IN the block rather than over the page: there is no
     dialog anywhere on this page, and one act does not earn the first (§2b). */
  .wzask{ border:1px solid var(--bad); background:var(--bad-bg); border-radius:9px;
    padding:13px 14px }
  .wzask p{ margin:0 0 11px; font-size:13.5px; color:var(--ink) }
  .wzask .goes{ margin:0 0 11px; font:400 12.5px/1.7 ui-monospace, SFMono-Regular, monospace;
    color:var(--ink-2) }
  .wzask label{ display:block; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin:0 0 6px }
  .wzask .fld{ background:var(--surface) }
  .wzask .row{ display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap }

  /* An archived client's flow says so BEFORE anything else: the fields below
     are read-only, and a page that did not say why would read as broken
     (§45.2). */
  .wzarched{ border:1px solid var(--line); background:var(--surface-2); border-radius:9px;
    padding:11px 13px; margin-bottom:18px; font-size:13.5px; color:var(--ink-2) }
  .wzarched b{ color:var(--ink) }

  /* the searchable standard list */
  .wzpick{ position:relative }
  .wzpanel{ position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--shadow); max-height:270px; overflow-y:auto; padding:5px }
  .wzpanel .gp{ font:600 10px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3); padding:9px 9px 5px }
  .wzpanel .opt{ display:block; width:100%; text-align:left; border:0; background:transparent;
    color:var(--ink); font:inherit; font-size:13.5px; padding:6px 9px; border-radius:6px;
    cursor:pointer }
  .wzpanel .opt:hover, .wzpanel .opt:focus-visible{ background:var(--surface-2); outline:none }
  .wzpanel .opt[aria-selected="true"]{ background:var(--amber-wash); color:var(--amber-tx);
    font-weight:600 }
  .wzpanel .nohit{ padding:10px 9px; color:var(--ink-3); font-size:13px; font-style:italic }

  /* the size band */
  .wzband{ display:flex; flex-wrap:wrap; gap:6px }
  .wzband button{ border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:8px; padding:6px 11px; font:600 12.5px/1.5 inherit; cursor:pointer;
    display:flex; flex-direction:column; gap:1px; align-items:flex-start }
  .wzband button:hover{ border-color:var(--amber-tx) }
  .wzband button[aria-pressed="true"]{ border-color:var(--amber); background:var(--amber-wash);
    color:var(--ink) }
  .wzband .ppl{ font:400 11px/1.3 ui-monospace, SFMono-Regular, monospace; color:var(--ink-3);
    font-variant-numeric:tabular-nums }
  .wzband button[aria-pressed="true"] .ppl{ color:var(--amber-tx) }
  /* ── The consulting memory (spec 045) ────────────────────────────
     FOUR SHAPES, and each is an existing one put to a new use rather than a
     new look: the filter row is .ptitle's own flex row, an entry row is
     .teamrow one level richer, the reading view is the card border and radius
     the client cards already wear, and the form is .lab over .fld like every
     other form on this platform. Nothing here introduces a colour. */
  .filters{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px }
  .filters .fld{ width:auto; flex:0 1 230px; min-width:0 }
  .filters .fld.search{ flex:1 1 280px }
  .count{ margin-left:auto; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3) }

  .elist{ display:flex; flex-direction:column; border-top:1px solid var(--line) }
  .erow{ display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left;
    padding:13px 10px; border:0; border-bottom:1px solid var(--line-soft);
    background:transparent; color:inherit; font:inherit; cursor:pointer }
  .erow:hover, .erow:focus-visible{ background:var(--surface-2); outline:none }
  .erow .body{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:3px }
  .erow h3{ margin:0; font-size:15px; font-weight:600; line-height:1.35 }
  .erow .snip{ margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  /* THE FACT LINE IS ONE LINE OF KEYS — client · industry · author · when.
     It is what a reader runs an eye down, so it is one size and one colour,
     or the eye has to decide which half matters on every row (§88). */
  .erow .facts{ font:400 12px/1.5 ui-monospace, SFMono-Regular, monospace;
    color:var(--ink-3); overflow-wrap:anywhere }
  .erow .facts b{ font-weight:600; color:var(--ink-2) }

  .ecard{ border:1px solid var(--line); border-radius:12px; background:var(--surface);
    box-shadow:var(--shadow); padding:20px 22px; max-width:760px }
  .ecard h2{ margin:0 0 4px; font-size:21px; font-weight:600; line-height:1.3 }
  .ecard .facts{ font:400 12.5px/1.6 ui-monospace, SFMono-Regular, monospace; color:var(--ink-3) }
  .ecard .facts b{ font-weight:600; color:var(--ink-2) }
  .etags{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:11px }
  .qa{ margin-top:22px; display:flex; flex-direction:column; gap:18px }
  .qa h3{ margin:0 0 5px; font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3) }
  .qa p{ margin:0; font-size:14.5px; line-height:1.62; color:var(--ink); max-width:62ch;
    white-space:pre-line }
  /* THE AUTHOR IS THE POINT OF THE PAGE (decision 3), so it is a block and not
     a byline: what a reader does with an insight is go and ask the person who
     wrote it. */
  .byline{ margin-top:24px; padding-top:15px; border-top:1px solid var(--line);
    display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  .byline .who{ display:flex; flex-direction:column; gap:1px; min-width:0 }
  .byline .who .nm{ font-weight:600; font-size:14.5px }
  .byline .who .em{ font:400 12.5px/1.5 ui-monospace, SFMono-Regular, monospace; color:var(--ink-3) }
  .byline .sp{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap }

  /* ── THE DOCUMENT ROOM (spec 053) ────────────────────────────────
     THREE RULES, and that is the whole of what this page gains: the list is
     .filters + .count + .elist + .erow, the editor is .ecard + .lab + .fld,
     the dangerous pair is .apart + .teamrow, and every button is .btn — all
     of them declared above for the consulting memory and the set-up flow
     (§53.5). What is new is a category that can be pressed, a strip for the
     file, and the row that holds them. */
  .catpick{ font:600 10.5px/1.5 ui-monospace, SFMono-Regular, monospace; letter-spacing:.05em;
    text-transform:uppercase; border:1px solid var(--line); border-radius:5px; padding:3px 8px;
    color:var(--ink-2); background:var(--surface-2); cursor:pointer }
  .catpick[aria-pressed="true"]{ color:var(--amber-tx); border-color:var(--amber);
    background:var(--surface) }
  /* A chip must answer the pointer in BOTH states, or the lit one reads as
     something that has stopped being a control (§41.4 recorded exactly this:
     a new pressed style with no hover beside it goes silent under the mouse).
     The edge moves and the ground does not, so a pressed chip does not lose
     the one thing saying it is pressed. */
  .catpick:hover, .catpick:focus-visible{ border-color:var(--amber-tx); outline:none }
  .catrow{ display:flex; gap:7px; flex-wrap:wrap }

  /* ── WHO CAN SEE ONE REPORT (spec 046 §4.10) ─────────────────────────
     Four rule families, verbatim from the mockup signed off on 15 September
     (design-mockups/insights/2026-09-15_report-visibility.html), which is
     itself built out of the rules above.

     THE STRIP is .filestrip's shape with a SOLID border rather than a dashed
     one: it is a field among the others, and dashed is how the file row says
     something can be dragged onto it.

     THE PANEL is .wzpanel's box with .gp's headings and .opt's rows — the
     set-up flow's picker, which is itself the client platform's own
     searchable list one surface over (§130.1, §295.1). What is new is the
     head (a search and the two words) and the tick.

     THE MARK ON A ROW NEEDS NO RULE AT ALL: a narrowed report wears the
     plain .tag, and only `Nobody` takes an alarm. Drawn amber first and the
     render caught it — .tag.none (Draft) is already amber, so two meanings
     landed in one colour in one slot (§87's twins, §41's budget).
     --bad on --bad-bg measures 5.51 light and 5.28 dark in THIS palette;
     §62's 4.41 is the client platform's and is not a measurement of this one
     (§303's shape). */
  .tag.shut{ color:var(--bad); background:var(--bad-bg); border-color:var(--bad) }
  .seen{ display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--surface) }
  .seen .who{ min-width:0; display:flex; gap:6px; flex-wrap:wrap; align-items:center }
  .seen .all{ font-size:13.5px; color:var(--ink-2) }
  .seen .none{ font-size:13.5px; color:var(--bad); font-weight:600 }
  .seen .sp{ margin-left:auto; display:flex; gap:8px }
  .tickwrap{ position:relative }
  .tickpanel{ position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--shadow); overflow:hidden }
  .tickhead{ display:flex; gap:8px; align-items:center; padding:9px 9px 8px;
    border-bottom:1px solid var(--line-soft); flex-wrap:wrap }
  .tickhead .fld{ flex:1 1 180px; min-width:0; padding:6px 9px; font-size:13.5px }
  .tickhead .lnk{ border:0; background:transparent; padding:2px 4px; cursor:pointer;
    font:600 10.5px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing:.07em;
    text-transform:uppercase; color:var(--ff-tx); text-decoration:underline;
    text-underline-offset:3px }
  .tickhead .lnk:hover, .tickhead .lnk:focus-visible{ color:var(--ink); outline:none }
  .ticklist{ max-height:236px; overflow-y:auto; padding:5px }
  .ticklist .gp{ font:600 10px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3); padding:9px 9px 5px }
  .tick{ display:flex; gap:9px; align-items:center; width:100%; text-align:left; border:0;
    background:transparent; color:var(--ink); font:inherit; font-size:13.5px;
    padding:6px 9px; border-radius:6px; cursor:pointer }
  .tick:hover, .tick:focus-visible{ background:var(--surface-2); outline:none }
  .tick .bx{ flex:none; width:15px; height:15px; border-radius:4px; border:1.5px solid var(--line);
    display:grid; place-items:center; background:var(--surface) }
  .tick .bx svg{ width:11px; height:11px; display:none }
  .tick[aria-pressed="true"] .bx{ border-color:var(--amber); background:var(--amber) }
  .tick[aria-pressed="true"] .bx svg{ display:block; color:var(--amber-ink) }
  .tick[aria-pressed="true"]{ font-weight:600 }
  .tickfoot{ border-top:1px solid var(--line-soft); padding:8px 11px 9px;
    font-size:12.5px; color:var(--ink-3) }
  .tickfoot b{ color:var(--ink); font-weight:600 }
  /* A bordered strip and not a card: the file is one field among the others,
     and a card would rank it above the title. Dashed, because until something
     is dropped on it there is nothing there — the same thing the Add card's
     dashed edge says one page over. */
  /* `.filestrip` AND NOT `.drop`: the debrief's own Drop button is a
     `.btn drop` (§65.9 — a class name is one global namespace), so a bare
     `.drop` here would have put a dashed box and 14px of padding round a
     small remove control one page over, where nothing would have looked at
     it. Found by grepping the name before trusting it. */
  .filestrip{ display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    border:1px dashed var(--line); border-radius:9px; padding:12px 14px; background:var(--surface) }
  .filestrip .fname{ font:400 12.5px/1.5 ui-monospace, SFMono-Regular, monospace; color:var(--ink-2);
    min-width:0; overflow-wrap:anywhere }
  .filestrip .sp{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center }

  .wiz{ max-width:720px }
  .wq{ margin-bottom:17px }
  .wq textarea.fld{ min-height:74px; resize:vertical; font-size:14px }
  .wpair{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:17px }
  .wpair > div{ flex:1 1 220px; min-width:0 }
  .prompt{ margin:0; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:13px 15px; overflow-x:auto;
    font:400 12.5px/1.65 ui-monospace, SFMono-Regular, monospace; color:var(--ink-2);
    white-space:pre-wrap }
  .wacts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px }
  .pastebox{ min-height:150px; resize:vertical;
    font:400 13px/1.6 ui-monospace, SFMono-Regular, monospace }

  .found{ display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    background:var(--good-bg); border:1px solid var(--good); border-radius:8px;
    padding:10px 13px; margin-bottom:18px; font-size:13.5px; color:var(--ink-2) }
  .found b{ color:var(--good) }
  .found .sp{ margin-left:auto; display:flex; gap:8px }
  .drafts{ display:flex; flex-direction:column; gap:14px; max-width:760px }
  .dcard{ border:1px solid var(--line); border-radius:12px; background:var(--surface);
    box-shadow:var(--shadow); padding:15px 17px }
  .dhead{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:11px }
  .dhead .fld{ flex:1 1 240px; min-width:0; font-weight:600 }
  .dhead select.fld{ flex:0 0 auto; width:auto; font-weight:400 }
  .dhead .drop{ margin-left:auto; color:var(--ink-3) }
  .dhead .drop:hover{ border-color:var(--bad); color:var(--bad) }
  .dq{ margin-bottom:11px }
  .dq:last-child{ margin-bottom:0 }
  .dq textarea.fld{ min-height:56px; resize:vertical; font-size:13.5px }
  /* A BLOCK THAT COULD NOT BE READ IS SHOWN, NEVER DROPPED (§184): what came
     back is somebody's own words, so the one thing the platform may not do
     with it is lose it quietly. */
  .dcard.raw{ border-color:var(--warn); background:var(--warn-bg) }
  .dcard.raw .rawnote{ font-size:13px; color:var(--warn); margin:0 0 10px }

  .empty{ border:1px dashed var(--line); border-radius:12px; padding:34px 24px;
    text-align:center; color:var(--ink-3); background:var(--surface) }
  .empty b{ display:block; color:var(--ink); font-size:16px; margin-bottom:6px }
  .empty .btn{ margin-top:16px }
  .askbox{ margin-bottom:16px }
  .askrow{ display:flex; gap:9px; flex-wrap:wrap }
  .askrow .fld{ flex:1 1 380px; min-width:0 }
  .askout{ margin-top:11px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:13px 15px }
  .askreply{ margin:0; font-size:14.5px; line-height:1.62; max-width:62ch; white-space:pre-line }
  .asksrc{ margin-top:12px; display:flex; gap:7px; align-items:center; flex-wrap:wrap }
  .asksrc .lab{ margin:0 }
  .asksrc button.tag{ cursor:pointer }
  .asksrc button.tag:hover{ border-color:var(--amber-tx) }
  @media (max-width:700px){ .erow{ flex-direction:column; gap:8px } .count{ margin-left:0 } }

  /* ── The strategy frameworks library (spec 052) ───────────────────
     Every class here is prefixed `fw`, because a class name is one global
     namespace and this page already holds .tag, .cell, .row and .band
     (§65.9). Nothing below is a new colour or a new shape: the box and the
     list are .band's border, radius and shadow; the chips are the only new
     form, and they are a pill because a filter you turn on and off is not a
     tag. Phase A draws no Ask and no Add, so there is no CSS here for
     either — a rule with no markup is one the next reader takes for
     load-bearing (§24). */
  .fwbox{ border:1px solid var(--line); border-radius:11px; background:var(--surface);
    padding:13px; box-shadow:var(--shadow) }
  .fwbox .fld{ width:100% }
  .fwchips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:13px }
  .fwchip{ font:600 12px/1 inherit; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-2); border-radius:999px; padding:6px 11px; cursor:pointer; white-space:nowrap }
  .fwchip:hover{ border-color:var(--amber-tx) }
  .fwchip.on{ background:var(--ff); border-color:var(--ff); color:var(--ff-ink) }
  .fwchip i{ font-style:normal; color:var(--ink-3); margin-left:5px; font-size:11px }
  .fwchip.on i{ color:var(--ff-quiet) }
  .fwcount{ margin:16px 0 9px; font-size:13px; color:var(--ink-3) }
  .fwlist{ border:1px solid var(--line); border-radius:11px; background:var(--surface);
    overflow:hidden; box-shadow:var(--shadow) }
  .fwrow{ display:block; width:100%; text-align:left; border:0;
    border-bottom:1px solid var(--line-soft); background:var(--surface); color:var(--ink);
    padding:12px 15px; cursor:pointer; font:inherit }
  .fwrow:last-child{ border-bottom:0 }
  /* AN AUTHOR `display` BEATS `[hidden]`, MEASURED RATHER THAN REASONED ABOUT
     (§93.11). The filter sets `row.hidden = true`, and with `display:block`
     above it the browser goes on drawing the row: the count said "12 of 80"
     over eighty visible rows, which is the worst shape a filter can take —
     it looks like it worked. The check found it by asking which rows are
     VISIBLE rather than which carry the attribute (§94.8). */
  .fwrow[hidden]{ display:none }
  .fwrow:hover, .fwrow:focus-visible{ background:var(--surface-2); outline:none }
  .fwrow .hd{ display:flex; gap:9px; align-items:baseline; flex-wrap:wrap }
  .fwrow .nm{ font-weight:600; font-size:14.5px }
  .fwrow .pp{ margin:4px 0 0; font-size:13px; color:var(--ink-3) }
  .fwsec{ margin-top:18px }
  .fwsec h3{ margin:0 0 5px; font-size:14px; font-weight:600 }
  .fwsec p{ margin:0; font-size:14px; color:var(--ink-2); white-space:pre-line }
  .fwgrid{ display:grid; grid-template-columns:1fr 1fr; gap:18px }
  @media (max-width:820px){ .fwgrid{ grid-template-columns:1fr } }
  /* ASKING IT: one field under the switch, and the answer in place under the
     box rather than on a page of its own — the question and what it produced
     read together, and the way back to searching is the switch you came in
     by. */
  .fwask{ display:flex; gap:9px; margin-top:11px; align-items:flex-start }
  .fwask .fld{ flex:1 1 220px; min-width:0 }
  .fwans{ background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
    padding:15px; margin-top:13px }
  .fwans > p{ margin:0 0 4px; font-size:14px; color:var(--ink-2); white-space:pre-line }
  /* EVERY SOURCE IS A DOOR, which is the memory's own rule for the memory's
     own reason: the next step is to go and read it. */
  .fwcite{ display:block; width:100%; text-align:left; margin-top:9px; border:1px solid var(--line);
    border-radius:9px; background:var(--surface); padding:11px 13px; cursor:pointer;
    font:inherit; color:var(--ink) }
  .fwcite:hover, .fwcite:focus-visible{ border-color:var(--amber-tx); outline:none }
  .fwcite .nm{ font-weight:600; font-size:14px }
  .fwcite .wy{ margin:4px 0 0; font-size:13px; color:var(--ink-3) }
  /* THE DRAFT SAYS IT IS ONE, in the amber this page already uses for a thing
     that is not settled yet — and it is the whole of decision 3 made visible:
     what is on screen is not in the library. */
  .fwdraft{ background:var(--amber-wash); border:1px solid var(--amber); border-radius:10px;
    padding:11px 13px; font-size:13.5px; color:var(--amber-tx); font-weight:600; margin-bottom:15px }
  .fwfields{ display:grid; gap:13px }
  .fwfields .fld{ width:100% }
  .fwfields textarea.fld{ resize:vertical; min-height:62px }
  /* A DECLINE IS NOT AN ERROR (§168, §190): nothing has gone wrong, the
     assistant has answered honestly, and the next thing to do is on the
     screen — so it wears the warning ground rather than the alarm one. */
  .fwdecl{ background:var(--warn-bg); border:1px solid var(--warn); border-radius:10px;
    padding:13px; font-size:14px; color:var(--warn) }
</style>
</head>
<body>
<div class="top">
  <span class="mk">FOREFRONT</span><span class="nm">Platform</span>
  <span class="right"><span id="who"></span>
    <button class="btn" id="signout" type="button">Sign out</button></span>
</div>
<nav class="nav" id="nav"></nav>
<div class="wrap" id="page"></div>

<!-- The debrief splitter (spec 045). Its own file, because node's own check
     requires the SAME BYTES this page runs (checks/memory-split.mjs) rather
     than a second copy that could drift — it is the one piece of the memory
     with a wrong answer available to it. scripts/build-shell.mjs puts it at
     this address and refuses the build if this tag ever goes. -->
<script src="/memory-split.js"></script>
<!-- The client set-up flow (§360, spec 057): one file for this page and the
     client platform, generated to this address by scripts/build-shell.mjs,
     which refuses the build if this tag ever goes. -->
<script src="/client-setup.js"></script>
<script>
(function () {
  "use strict";

  /* ── One shape for every request (§71's rule: three callers with the same
     six lines is where a typo lives in exactly one of them). ───────── */
  function send(path, body) {
    return fetch(path, { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) })
      .then(function (r) {
        /* NOT SIGNED IN IS NOT AN ERROR MESSAGE, it is the door. */
        if (r.status === 401 || r.status === 403) {
          return r.json().then(function (j) {
            if (j && j.auth) { location.replace("/"); throw new Error("sign in"); }
            return j;
          });
        }
        return r.json();
      });
  }
  /* TWO ENDPOINTS, ONE DOOR. /api/memory is its own route (spec 045) and the
     401-is-the-door rule above is not written twice for it. */
  function post(body) { return send("/api/platform", body); }
  function mpost(body) { return send("/api/memory", body); }
  function fpost(body) { return send("/api/frameworks", body); }

  var page = document.getElementById("page");
  var nav = document.getElementById("nav");
  var TAB = "clients";
  var ME = null;
  /* The boot's own `cards` answer, waiting for the FIRST draw and nobody else
     (§369). Declared here rather than left to hoist, because a second `var` of
     one name in this scope is one binding and the later one wins in silence
     (§56.7) — grepped, and this is the only pair. */
  var BOOTCARDS = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    /* textContent, never innerHTML: every name here is typed by a person. */
    if (text != null) e.textContent = text;
    return e;
  }
  function clear() { page.textContent = ""; }
  function say(msg, bad) {
    var p = el("p", bad ? "err" : "said", msg);
    page.appendChild(p);
    return p;
  }
  function title(text, right) {
    var h = el("div", "ptitle");
    h.appendChild(el("h1", null, text));
    if (right) { right.className = "right"; h.appendChild(right); }
    page.appendChild(h);
    return h;
  }
  /* A COUNT AND ITS NOUN (§323). The client platform has a `plural` helper
     and this page does not — and it is not borrowed, because that one is
     wired to the tenant's own labels and this page has none. Irregular
     plurals are passed in rather than guessed at: "persons" and
     "capabilitys" are what a rule that appends an "s" produces (§107.8's
     trap, on the other side of the switch). */
  function nOf(n, one, many) {
    return n + " " + (n === 1 ? one : (many || one + "s"));
  }
  function initials(name) {
    var w = String(name || "?").trim().split(/\s+/);
    return (w.length > 1 ? w[0].charAt(0) + w[1].charAt(0) : w[0].slice(0, 2)).toUpperCase();
  }

  /* ── The navigation is drawn from what this account may open ─────
     A tab that always refuses is worse than no tab (§45.2), so the row is
     built after `me` answers rather than written into the markup. */
  function drawNav() {
    nav.textContent = "";
    /* MEMORY IS THE FIRST TAB HERE WITH NO GATE, and that is decision 1 of
       spec 045 rather than an oversight: every consultant reads every
       insight, which is what makes it a memory rather than a filing cabinet.
       The boundary it does keep is on the server — a client's own account
       never reaches /api/memory — and it is checked there. */
    var tabs = [["clients", "Clients", true],
                ["consultants", "Consultants", ME.canConsultants],
                ["access", "Who sees what", ME.canAccess],
                ["memory", "Memory", true],
                /* FRAMEWORKS IS UNGATED FOR THE MEMORY'S OWN REASON (spec 052,
                   decision 1): every consultant reads the whole library, and
                   only an admin adds to it — which is a gate on the ACT, asked
                   on the server, never a gate on the tab. */
                ["frameworks", "Frameworks", true]];
    tabs.forEach(function (t) {
      if (!t[2]) return;
      var b = el("button", TAB === t[0] ? "on" : null, t[1]);
      b.type = "button";
      b.setAttribute("data-tab", t[0]);
      b.addEventListener("click", function () { go(t[0]); });
      nav.appendChild(b);
    });
  }

  function go(tab) {
    TAB = tab;
    MEM.view = "list";
    FW.view = "list";
    drawNav();
    clear();
    return redraw();
  }

  /* ── A SILENT REFRESH (§313.28) ───────────────────────────────────
     Islam: "this page needs silent refresh." Every control here ended in a
     full redraw that CLEARED the page first and put "Reading…" in its place,
     so pressing a seat blanked the whole pane and rebuilt it — a flash, a
     scroll jump, and the row you were working on gone from under the pointer.

     The page is built into a DETACHED node and swapped in when it is ready,
     so nothing empty is ever on screen; the scroll position is put back
     because a swap is not a navigation. §71.2's rule — never a repaint under
     a working hand — applied to the one page that had no other way to update
     itself. */
  function redraw() {
    if (TAB === "clients") return drawClients();
    if (TAB === "consultants") return drawConsultants();
    if (TAB === "access") return drawAccess();
    if (TAB === "memory") return drawMemory();
    if (TAB === "frameworks") return drawFrameworks();
  }

  /* `quiet` is passed by every control that is UPDATING what is already on
     screen, as opposed to arriving at it. Arriving still says "Reading…",
     because then there is nothing to keep. */
  function lead(quiet, msg) {
    if (quiet) return;
    clear();
    page.appendChild(el("p", "muted", msg));
  }

  /* Built detached, swapped in one move, scroll restored — so the page never
     holds an empty frame and the row under the pointer does not move. */
  function settle(build) {
    var y = window.scrollY;
    var next = document.createElement("div");
    var was = page;
    page = next;
    try { build(); } finally { page = was; }
    page.textContent = "";
    while (next.firstChild) page.appendChild(next.firstChild);
    window.scrollTo(0, y);
  }

  /* ════ The consulting memory (spec 045) ══════════════════════════════
     Forefront's own, never a client's: an insight from one client is worth
     having BECAUSE it helps on the next, which is the one place on this
     platform where crossing clients is the point. Four states — the list,
     reading one, adding one, and a period debrief with the drafts it
     produces — drawn in the page's own classes.

     THE PAGE DERIVES NO RULE. `mine` arrives on every row, computed by the
     server, exactly as `mine` on a client card already is: one answer, not
     two (§53.5), and the server asks again when the press lands (§48.2). */
  var MEM = { view: "list", entry: null, filters: { q: "", client: "", industry: "", kind: "" },
              draft: null, deb: null, drafts: null };
  var KINDS = [["practice", "Practice"], ["hiccup", "Hiccup"], ["lesson", "Lesson"]];
  /* The four questions, named ONCE — the form, the reading view and the
     debrief's drafts all walk this list (§104.7). */
  var QS = [["happened", "What happened"], ["did", "What we did"],
            ["came_of_it", "What came of it"], ["next_person", "What the next person should know"]];
  var kindWord = function (k) {
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0] === k) return KINDS[i][1];
    return "Lesson";
  };
  var whenWord = function (iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  };

  function memGo(view, extra) {
    MEM.view = view;
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) MEM[k] = extra[k];
    return drawMemory();
  }

  function drawMemory() {
    if (MEM.view === "entry") return drawMemEntry();
    if (MEM.view === "wiz") return drawMemForm();
    if (MEM.view === "deb") return drawDebrief();
    if (MEM.view === "drafts") return drawDrafts();
    return drawMemList();
  }

  /* ── The list ──────────────────────────────────────────────────── */
  function drawMemList(quiet) {
    lead(quiet, "Reading…");
    var f = MEM.filters;
    return mpost({ action: "list", q: f.q, client: f.client, industry: f.industry, kind: f.kind })
      .then(function (j) {
        if (!j || !j.ok) { clear(); say((j && j.error) || "Could not read the memory.", true); return; }
        MEM.clientNames = {};
        (j.clients || []).forEach(function (c) { MEM.clientNames[c.key] = c.name; });
        settle(function () {
          var right = el("span");
          var add = el("button", "btn", "Add one insight");
          add.type = "button";
          add.addEventListener("click", function () { memGo("wiz", { draft: null }); });
          var deb = el("button", "btn amber", "Write up a period");
          deb.type = "button";
          deb.addEventListener("click", function () { memGo("deb", { deb: null }); });
          right.appendChild(add); right.appendChild(deb);
          title("Memory", right);

          /* NOTHING YET — the one sentence on the page, and it is a fact the
             screen does not otherwise state rather than a description of
             itself (rule 1b-ii, §45.2). Drawn only when the memory is empty
             and nothing is being filtered, or "no insights match" would read
             as "there are none". */
          var filtering = !!(f.q || f.client || f.industry || f.kind);
          if (!j.entries.length && !filtering) {
            var box = el("div", "empty");
            box.appendChild(el("b", null, "Nothing here yet"));
            box.appendChild(document.createTextNode(
              "Every insight names the client it came from and the person who wrote it."));
            var first = el("button", "btn amber", "Write up a period");
            first.type = "button";
            first.addEventListener("click", function () { memGo("deb", { deb: null }); });
            box.appendChild(first);
            page.appendChild(box);
            return;
          }

          page.appendChild(memAskBox());
          page.appendChild(memFilters(j));
          if (!j.entries.length) { page.appendChild(el("p", "muted", "Nothing matches that.")); return; }
          var list = el("div", "elist");
          j.entries.forEach(function (e) { list.appendChild(memRow(e)); });
          page.appendChild(list);
        });
      });
  }

  /* ASK IT — on the page the insights are on, never a corner of its own
     (§32: a door behind a door). It writes nothing: what somebody went looking
     for is not part of the record. */
  function memAskBox() {
    var box = el("div", "askbox");
    var row = el("div", "askrow");
    var q = el("input", "fld");
    q.type = "text";
    q.id = "m-ask";
    q.placeholder = "Ask the memory — “we have hit this before, what happened?”";
    var go = el("button", "btn solid", "Ask");
    go.type = "button";
    var out = el("div", "askout");
    out.hidden = true;
    function run() {
      var text = q.value.trim();
      if (!text) return;
      go.disabled = true;
      out.hidden = false;
      out.textContent = "";
      out.appendChild(el("p", "muted", "Reading the memory…"));
      mpost({ action: "ask", question: text }).then(function (r) {
        go.disabled = false;
        out.textContent = "";
        if (!r || !r.ok) { out.appendChild(el("p", "muted", (r && r.error) || "The memory could not be asked.")); return; }
        if (r.why) { out.appendChild(el("p", "muted", r.why)); return; }
        out.appendChild(el("p", "askreply", r.reply));
        /* EVERY ANSWER NAMES ITS SOURCES, and they are DOORS: the next step is
           to open the insight and go and ask whoever wrote it. */
        if ((r.sources || []).length) {
          var sp = el("div", "asksrc");
          sp.appendChild(el("span", "lab", "From"));
          r.sources.forEach(function (src) {
            var b = el("button", "tag", src.title + " · " + src.author);
            b.type = "button";
            b.addEventListener("click", function () { memGo("entry", { entry: src.id }); });
            sp.appendChild(b);
          });
          out.appendChild(sp);
        } else if (r.answered) {
          /* An answer that cites nothing is one nobody can act on — said,
             rather than drawn as though it were sourced (§124). */
          out.appendChild(el("p", "muted", "It named no insight for that — treat it carefully."));
        }
      });
    }
    go.addEventListener("click", run);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
    row.appendChild(q); row.appendChild(go);
    box.appendChild(row); box.appendChild(out);
    return box;
  }

  function memFilters(j) {
    var f = MEM.filters, row = el("div", "filters");
    var q = el("input", "fld search");
    q.type = "search"; q.value = f.q;
    q.placeholder = "Search insights — title, body, client";
    /* TYPING NEVER REPAINTS (§35). The search runs when the box is left or
       Enter is pressed, so the field being typed into is never replaced. */
    q.addEventListener("change", function () { f.q = q.value.trim(); drawMemList(true); });
    row.appendChild(q);

    row.appendChild(memPick(j.clients.map(function (c) { return [c.key, c.name]; }),
      "Every client", f.client, function (v) { f.client = v; drawMemList(true); }));
    row.appendChild(memPick(j.industries.map(function (i) { return [i, i]; }),
      "Every industry", f.industry, function (v) { f.industry = v; drawMemList(true); }));

    var cell = el("span", "cell");
    cell.setAttribute("role", "group");
    cell.setAttribute("aria-label", "Kind");
    [["", "All"]].concat(KINDS).forEach(function (k) {
      var b = el("button", f.kind === k[0] ? "on" : null, k[1]);
      b.type = "button";
      b.addEventListener("click", function () { f.kind = k[0]; drawMemList(true); });
      cell.appendChild(b);
    });
    row.appendChild(cell);
    row.appendChild(el("span", "count", j.entries.length + (j.entries.length === 1 ? " insight" : " insights")));
    return row;
  }

  /* The filters offer what the MEMORY holds, never every client on the
     platform: a picker whose every option empties the page is not a choice
     (§61). */
  function memPick(pairs, all, value, onPick) {
    var sel = el("select", "fld");
    sel.setAttribute("aria-label", all);
    var opts = [["", all]].concat(pairs);
    opts.forEach(function (o) {
      var op = el("option", null, o[1]);
      op.value = o[0];
      if (o[0] === value) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener("change", function () { onPick(sel.value); });
    return sel;
  }

  function memRow(e) {
    var b = el("button", "erow");
    b.type = "button";
    b.appendChild(el("span", "tag " + e.kind, kindWord(e.kind)));
    var body = el("span", "body");
    body.appendChild(el("h3", null, e.title));
    var snip = memSnip(e);
    if (snip) body.appendChild(el("p", "snip", snip));
    var facts = el("span", "facts");
    facts.appendChild(el("b", null, e.clientName));
    facts.appendChild(document.createTextNode(
      (e.industry ? " · " + e.industry : "") + " · " + e.author + " · " + whenWord(e.when)));
    body.appendChild(facts);
    b.appendChild(body);
    b.addEventListener("click", function () { memGo("entry", { entry: e.id }); });
    return b;
  }
  /* The snippet is the first answer that has anything in it — a one-line
     insight has to look like a finished row, not a broken one (§245). */
  function memSnip(e) {
    for (var i = 0; i < QS.length; i++) if (String(e[QS[i][0]] || "").trim()) return e[QS[i][0]];
    return "";
  }

  /* ── Reading one ───────────────────────────────────────────────── */
  function drawMemEntry() {
    lead(false, "Reading…");
    return mpost({ action: "one", id: MEM.entry }).then(function (j) {
      if (!j || !j.ok) { clear(); say((j && j.error) || "That insight is no longer here.", true); return; }
      var e = j.entry;
      settle(function () {
        var back = el("button", "btn", "Back to the list");
        back.type = "button";
        back.addEventListener("click", function () { memGo("list"); });
        title("Memory", (function () { var r = el("span"); r.appendChild(back); return r; }()));

        var card = el("article", "ecard");
        var tags = el("div", "etags");
        tags.appendChild(el("span", "tag " + e.kind, kindWord(e.kind)));
        tags.appendChild(el("span", "tag", e.clientName));
        if (e.industry) tags.appendChild(el("span", "tag", e.industry));
        card.appendChild(tags);
        card.appendChild(el("h2", null, e.title));
        var facts = el("p", "facts");
        facts.appendChild(el("b", null, whenWord(e.when)));
        if (e.occurred) facts.appendChild(document.createTextNode(" · " + e.occurred));
        card.appendChild(facts);

        var qa = el("div", "qa");
        var any = false;
        QS.forEach(function (q) {
          var v = String(e[q[0]] || "").trim();
          if (!v) return;             /* an unanswered question is not a heading over nothing */
          any = true;
          var d = el("div");
          d.appendChild(el("h3", null, q[1]));
          d.appendChild(el("p", null, v));
          qa.appendChild(d);
        });
        if (any) card.appendChild(qa);

        /* THE AUTHOR IS WHAT A READER ACTS ON (decision 3): the name, the
           address, and a way to write to them. */
        var by = el("div", "byline");
        var who = el("span", "who");
        who.appendChild(el("span", "nm", e.author));
        who.appendChild(el("span", "em", e.authorEmail));
        by.appendChild(who);
        var sp = el("span", "sp");
        var ask = el("a", "btn", "Ask " + String(e.author || "").split(/\s+/)[0]);
        ask.href = "mailto:" + e.authorEmail + "?subject=" + encodeURIComponent(e.title);
        sp.appendChild(ask);
        if (e.mine) {
          var ed = el("button", "btn", "Edit");
          ed.type = "button";
          ed.addEventListener("click", function () { memGo("wiz", { draft: e }); });
          sp.appendChild(ed);
          var rm = el("button", "btn", "Remove");
          rm.type = "button";
          rm.addEventListener("click", function () { memDrop(rm, e); });
          sp.appendChild(rm);
        }
        by.appendChild(sp);
        card.appendChild(by);
        page.appendChild(card);
      });
    });
  }

  /* REMOVING ONE IS THE ONE IRREVERSIBLE ACT HERE, and it asks twice.
     NOT `confirm()` — a browser dialog can be silenced permanently on some
     other site and this is the press that must not go through unseen (§95) —
     and not a modal either, because this page has no dialog machinery at all
     and building some for one button is furniture (§2b). The button says what
     the second press does, which is the smallest thing that works and cannot
     be switched off. */
  function memDrop(btn, e) {
    if (btn.dataset.armed !== "1") {
      btn.dataset.armed = "1";
      btn.textContent = "Remove it — this cannot be undone";
      btn.classList.add("amber");
      return;
    }
    btn.disabled = true;
    mpost({ action: "drop", id: e.id }).then(function (j) {
      if (!j || !j.ok) { btn.disabled = false; say((j && j.error) || "It could not be removed.", true); return; }
      memGo("list");
    });
  }

  /* The prompt for ONE insight: the four questions with the client already in
     them. Built here rather than on the server because it is made of what the
     page already holds, and asking for it would be a request to learn nothing
     new (§98). */
  function onePrompt(csel, clients) {
    var c = clientPhrase(clientNamed(clients, csel.value));
    return "I am writing up one consulting insight for my firm's memory, about\n" +
      c + ".\n\n" +
      "Ask me these four questions, one at a time, and wait for my answer\n" +
      "before asking the next:\n\n" +
      "  1. What happened?\n" +
      "  2. What did we do?\n" +
      "  3. What came of it?\n" +
      "  4. What should the next person know?\n\n" +
      "Then write my answers back as four short paragraphs under those four\n" +
      "headings, in my own words, and nothing else.";
  }

  /* ── Adding or correcting one ──────────────────────────────────── */
  function drawMemForm() {
    var e = MEM.draft || {};
    var editing = !!e.id;
    lead(false, "Reading…");
    /* THE CLIENT LIST IS THE CARDS' OWN, not the memory's: this is the one
       picker that must offer a client nothing has been written about yet, so
       it cannot come from the list endpoint like the filters do. `cards` has
       already dropped the retired ones (visibleClients); the worked example is
       dropped here, because it is not an engagement anybody learned anything
       on (§317). */
    return post({ action: "cards" }).then(function (j) {
      var clients = ((j && j.cards) || []).filter(function (c) { return c.kind !== "demo"; });
      settle(function () {
        var right = el("span");
        var cancel = el("button", "btn", "Cancel");
        cancel.type = "button";
        cancel.addEventListener("click", function () { memGo(editing ? "entry" : "list"); });
        var save = el("button", "btn amber", "Save");
        save.type = "button";
        right.appendChild(cancel); right.appendChild(save);
        title(editing ? "Edit an insight" : "Add an insight", right);

        var wiz = el("div", "wiz");
        var fields = {};

        var pair = el("div", "wpair");
        var cbox = el("div");
        cbox.appendChild(labFor("m-client", "Client"));
        var csel = el("select", "fld");
        csel.id = "m-client";
        if (editing) { csel.disabled = true; }
        clients.forEach(function (c) {
          var op = el("option", null, c.name);
          op.value = c.key;
          if (c.key === (e.client || "")) op.selected = true;
          csel.appendChild(op);
        });
        cbox.appendChild(csel); pair.appendChild(cbox);

        var kbox = el("div");
        kbox.appendChild(labFor("m-kind", "Kind"));
        var ksel = el("select", "fld");
        ksel.id = "m-kind";
        KINDS.forEach(function (k) {
          var op = el("option", null, k[1]);
          op.value = k[0];
          if (k[0] === (e.kind || "lesson")) op.selected = true;
          ksel.appendChild(op);
        });
        kbox.appendChild(ksel); pair.appendChild(kbox);

        var wbox = el("div");
        wbox.appendChild(labFor("m-when", "When it happened"));
        var wfld = el("input", "fld");
        wfld.id = "m-when"; wfld.type = "text"; wfld.value = e.occurred || "";
        wbox.appendChild(wfld); pair.appendChild(wbox);
        wiz.appendChild(pair);

        var tq = el("div", "wq");
        tq.appendChild(labFor("m-title", "Title"));
        var tfld = el("input", "fld");
        tfld.id = "m-title"; tfld.type = "text"; tfld.value = e.title || "";
        tq.appendChild(tfld); wiz.appendChild(tq);

        QS.forEach(function (q) {
          var box = el("div", "wq");
          box.appendChild(labFor("m-" + q[0], q[1]));
          var ta = el("textarea", "fld");
          ta.id = "m-" + q[0];
          ta.value = e[q[0]] || "";
          box.appendChild(ta);
          fields[q[0]] = ta;
          wiz.appendChild(box);
        });

        wiz.appendChild(el("p", "note", "A title and a client are enough to save. The rest can wait."));

        /* The other way to finish it — under a rule, because it is not the
           next step of the form but an alternative to filling it in (§317's
           own .apart device). */
        var apart = el("div", "apart");
        apart.appendChild(el("span", "akey", "Or answer it out loud"));
        var pre = el("pre", "prompt", onePrompt(csel, clients));
        apart.appendChild(pre);
        var acts = el("div", "wacts");
        acts.appendChild(copyBtn(function () { return pre.textContent; }));
        acts.appendChild(el("span", "muted", "Paste it back into the boxes above."));
        apart.appendChild(acts);
        /* the same, one screen over (§53.5) */
        var follow1 = function () { pre.textContent = onePrompt(csel, clients); };
        csel.addEventListener("input", follow1);
        csel.addEventListener("change", follow1);
        wiz.appendChild(apart);
        page.appendChild(wiz);

        save.addEventListener("click", function () {
          var body = { action: "save", client: csel.value, kind: ksel.value,
                       title: tfld.value, occurred: wfld.value };
          if (editing) body.id = e.id;
          QS.forEach(function (q) { body[q[0]] = fields[q[0]].value; });
          save.disabled = true;
          mpost(body).then(function (r) {
            save.disabled = false;
            if (!r || !r.ok) { say((r && r.error) || "It could not be saved.", true); return; }
            memGo(editing ? "entry" : "list", { entry: r.id });
          });
        });
      });
    });
  }

  function labFor(id, text) {
    var l = el("label", "lab", text);
    l.setAttribute("for", id);
    return l;
  }
  function copyBtn(text) {
    var b = el("button", "btn solid", "Copy the prompt");
    b.type = "button";
    b.addEventListener("click", function () {
      var done = function () {
        b.textContent = "Copied";
        setTimeout(function () { b.textContent = "Copy the prompt"; }, 1600);
      };
      /* execCommand is the path that actually runs from a plain http origin
         (§93.6): navigator.clipboard needs a secure context. */
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text()).then(done, done);
      else {
        var ta = document.createElement("textarea");
        ta.value = text();
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (err) { /* nothing to do */ }
        document.body.removeChild(ta);
        done();
      }
    });
    return b;
  }
  function clientNamed(clients, key) {
    for (var i = 0; i < clients.length; i++) if (clients[i].key === key) return clients[i];
    return null;
  }
  function clientPhrase(c) {
    if (!c) return "this client";
    return c.name + (c.industry ? " (" + c.industry + ")" : "");
  }

  /* ── A period debrief, and what comes back ─────────────────────
     THE MAIN DOOR (Islam: "it will not be case by case usually it would be a
     period of time to share"). One conversation, several insights: the page
     writes a prompt carrying the client and the period, the consultant talks
     it through with whatever assistant they use, and pastes the whole answer
     back in one box.

     NOTHING IS STORED UNTIL SOMEBODY HAS READ IT. The prompt forbids
     invention — "use my words, not yours; if I only half answered, leave that
     line out" — and the platform CANNOT TELL a paragraph somebody said from
     one a model completed, so the drafts screen is not politeness: it is the
     only place that judgement can happen. */
  function drawDebrief() {
    lead(false, "Reading…");
    return post({ action: "cards" }).then(function (j) {
      var clients = ((j && j.cards) || []).filter(function (c) { return c.kind !== "demo"; });
      var d = MEM.deb || { client: (clients[0] || {}).key || "", from: "", to: "", paste: "" };
      settle(function () {
        var right = el("span");
        var cancel = el("button", "btn", "Cancel");
        cancel.type = "button";
        cancel.addEventListener("click", function () { memGo("list", { deb: null }); });
        right.appendChild(cancel);
        title("Write up a period", right);

        var wiz = el("div", "wiz");
        var pair = el("div", "wpair");
        var csel = el("select", "fld");
        csel.id = "d-client";
        clients.forEach(function (c) {
          var op = el("option", null, c.name);
          op.value = c.key;
          if (c.key === d.client) op.selected = true;
          csel.appendChild(op);
        });
        pair.appendChild(boxed("d-client", "Client", csel));
        var from = el("input", "fld"); from.id = "d-from"; from.type = "text"; from.value = d.from;
        from.placeholder = "1 August 2026";
        pair.appendChild(boxed("d-from", "From", from));
        var to = el("input", "fld"); to.id = "d-to"; to.type = "text"; to.value = d.to;
        to.placeholder = "11 September 2026";
        pair.appendChild(boxed("d-to", "To", to));
        wiz.appendChild(pair);

        wiz.appendChild(el("span", "lab", "Take this to your assistant and talk it through"));
        var pre = el("pre", "prompt", debPrompt(csel, clients, from, to));
        wiz.appendChild(pre);
        var acts = el("div", "wacts");
        acts.appendChild(copyBtn(function () { return pre.textContent; }));
        wiz.appendChild(acts);
        /* THE PROMPT FOLLOWS AS YOU TYPE, and `input` is right here where it
           would be wrong almost anywhere else in this product: §35's rule is
           that typing must not REPAINT, and this repaints nothing — it writes
           into one <pre> that nobody is typing into, which is the
           write-into-the-node pattern §63 and §193 already use.

           On `change` it went stale in the one way that matters: `change`
           fires on BLUR, so somebody who filled in the end date and reached
           straight for Copy the prompt would have copied a prompt with no end
           date in it. Measured — the period read "covering 1 August 2026"
           with 11 September plainly in the box beside it. */
        [csel, from, to].forEach(function (f) {
          var follow = function () { pre.textContent = debPrompt(csel, clients, from, to); };
          f.addEventListener("input", follow);
          f.addEventListener("change", follow);
        });

        var apart = el("div", "apart");
        apart.appendChild(el("span", "akey", "Then paste what came back"));
        var paste = el("textarea", "fld pastebox");
        paste.id = "d-paste";
        paste.value = d.paste;
        paste.placeholder = "Paste the whole answer here — every block at once.";
        apart.appendChild(paste);
        var pacts = el("div", "wacts");
        var read = el("button", "btn amber", "Read what came back");
        read.type = "button";
        read.addEventListener("click", function () {
          var text = paste.value;
          if (!text.trim()) { say("There is nothing pasted in yet.", true); return; }
          var out = window.MemorySplit.split(text);
          if (!out.entries.length && !out.unread.length) { say("There is nothing pasted in yet.", true); return; }
          memGo("drafts", {
            /* the NAME is carried with the key: on a first debrief the list
               endpoint has never heard of this client, so MEM.clientNames is
               empty and the strip would read a slug (§124) */
            deb: { client: csel.value, clientName: csel.options[csel.selectedIndex].textContent,
                   from: from.value, to: to.value, paste: text },
            drafts: out.entries.map(function (e) { return e; })
              .concat(out.unread.map(function (t) { return rawDraft(t); }))
          });
        });
        pacts.appendChild(read);
        pacts.appendChild(el("span", "muted", "Nothing is saved until you have read them."));
        apart.appendChild(pacts);
        wiz.appendChild(apart);
        page.appendChild(wiz);
      });
    });
  }

  function boxed(id, label, control) {
    var d = el("div");
    d.appendChild(labFor(id, label));
    d.appendChild(control);
    return d;
  }
  function rawDraft(text) {
    /* A BLOCK IT COULD NOT READ COMES BACK WHOLE (§184). It has no title —
       which is the one thing a person can add — so it is shown in the warning
       ground with its words in the first box rather than dropped. */
    return { kind: "lesson", kindGuessed: true, title: "", occurred: "",
             happened: text, did: "", came_of_it: "", next_person: "", raw: true };
  }
  function periodWord(from, to) {
    var f = String(from.value || "").trim(), t = String(to.value || "").trim();
    if (f && t) return f + " to " + t;
    return f || t || "";
  }
  function debPrompt(csel, clients, from, to) {
    var c = clientPhrase(clientNamed(clients, csel.value));
    var p = periodWord(from, to);
    return "I have just finished a period of work at " + c + (p ? ",\ncovering " + p : "") + ". Help me write up what we learned\n" +
      "from it, for my firm's consulting memory.\n\n" +
      "Interview me. Ask ONE question at a time and wait for my answer before\n" +
      "asking the next one.\n\n" +
      "Start by asking me to walk you through the period — what we worked on and\n" +
      "what stands out. Then draw out, one at a time:\n\n" +
      "  · what went better than we expected, and why\n" +
      "  · what went wrong, or cost us time\n" +
      "  · what I know now that I did not know at the start\n" +
      "  · anything I would warn the next consultant about\n\n" +
      "For each thing I raise, ask me what happened, what we did, what came of\n" +
      "it, and what the next person should know. Push back when my answer is\n" +
      "vague, and do not move on until it would make sense to somebody who was\n" +
      "not there.\n\n" +
      "When I say I am done, write every item back in exactly this shape, and\n" +
      "nothing else — no summary, no preamble:\n\n" +
      "===\n" +
      "KIND: hiccup | practice | lesson\n" +
      "TITLE: one line, the thing itself\n" +
      (p ? "WHEN: " + p + "\n" : "") +
      "WHAT HAPPENED: ...\n" +
      "WHAT WE DID: ...\n" +
      "WHAT CAME OF IT: ...\n" +
      "WHAT THE NEXT PERSON SHOULD KNOW: ...\n" +
      "===\n\n" +
      "Repeat that block for each item. Use my words, not yours. If I only half\n" +
      "answered something, leave that line out rather than filling it in.";
  }

  /* ── What came back ────────────────────────────────────────────── */
  function drawDrafts() {
    var d = MEM.deb || {}, drafts = MEM.drafts || [];
    settle(function () {
      var right = el("span");
      var back = el("button", "btn", "Back");
      back.type = "button";
      back.addEventListener("click", function () { memGo("deb"); });
